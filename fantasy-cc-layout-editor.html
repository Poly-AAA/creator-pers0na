<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Placement — Étape 3 · Flèches</title>
<style>
  :root{ --bg:#ecece8; --ink:#3d3d3a; --muted:#8e8e8a; --line:#c6c6c2; --card:#fafaf8; --ok:#2f6f4e; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 Helvetica,Arial,sans-serif;overflow:hidden}
  .app{height:100%;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
  .top{padding:10px 14px 6px}
  .top h1{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  .top p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
  .stage{flex:1;min-height:0;margin:0 8px;border:1.5px dashed #b8b8b4;border-radius:14px;
    background:linear-gradient(180deg,#f7f7f4,#e8e8e4);position:relative;overflow:hidden;touch-action:none}
  .shadow{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
  .char{position:absolute;z-index:1;pointer-events:none;image-rendering:pixelated}
  .char canvas{width:100%;height:100%;display:block}
  .ghost{position:absolute;z-index:2;pointer-events:none;opacity:.55;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;background:rgba(250,250,248,.85);border:1px solid var(--line);padding:6px 8px;border-radius:8px}
  .rot{
    position:absolute;z-index:8;border-radius:50%;border:2px solid #3d3d3a;background:#fafaf8;color:#3d3d3a;
    font-size:30px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .rot.drag{cursor:grabbing;outline:2px solid #888}
  .rot .tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;pointer-events:none}
  .dock{flex-shrink:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(250,250,248,.96);
    border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:8px}
  .row label{width:70px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .row input[type=range]{flex:1;accent-color:var(--ink)}
  .row .val{width:40px;text-align:right;font-size:12px}
  .btns{display:flex;gap:8px}
  .btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px}
  .btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
  .out{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--muted);background:#f0f0ec;
    border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;max-height:64px;overflow:auto}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d3d3a;color:#fff;
    padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Étape 3 — Flèches rotation</h1>
    <p>Glisse les deux gros boutons ‹ › où tu veux (pour tourner le perso). Taille avec le curseur. Puis <b>Valider</b>.</p>
  </div>
  <div class="stage" id="stage">
    <div class="shadow" id="shadow"></div>
    <div class="char" id="char"><canvas id="cv" width="256" height="256"></canvas></div>
    <!-- rappel soft des labels déjà validés -->
    <div class="ghost" style="left:50%;top:20%">Tête</div>
    <div class="ghost" style="left:72%;top:29%">Torse</div>
    <div class="ghost" style="left:18%;top:27%">Sac</div>
    <button type="button" class="rot" id="prev"><span class="tag">Gauche</span>‹</button>
    <button type="button" class="rot" id="next"><span class="tag">Droite</span>›</button>
  </div>
  <div class="dock">
    <div class="row">
      <label>Taille</label>
      <input type="range" id="size" min="40" max="72" value="52" step="1"/>
      <span class="val" id="sizeVal">52</span>
    </div>
    <div class="out" id="out">…</div>
    <div class="btns">
      <button type="button" class="btn" id="btnReset">Reset</button>
      <button type="button" class="btn" id="btnCopy">Copier JSON</button>
      <button type="button" class="btn ok" id="btnOk">Valider ✓</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const BASE="https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f89bfa1/assets/packs/fantasy-cc/";
  const KEY="neuro.layoutEditor.step3";
  const STEP1={ char:{xPct:47.93,yPct:58.97,size:320}, shadow:{xPct:50,yPct:72,w:60,h:34,opacity:0.05}, stage:{w:370,h:344} };
  const stage=document.getElementById("stage");
  const state={ size:52, prev:{xPct:18,yPct:78}, next:{xPct:82,yPct:78} };

  function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),1600); }

  function placeBG(){
    const r=stage.getBoundingClientRect();
    const char=document.getElementById("char"), sh=document.getElementById("shadow");
    const size=Math.min(r.width,r.height)*(STEP1.char.size/STEP1.stage.w);
    char.style.width=size+"px"; char.style.height=size+"px";
    char.style.left=STEP1.char.xPct+"%"; char.style.top=STEP1.char.yPct+"%";
    char.style.marginLeft=(-size/2)+"px"; char.style.marginTop=(-size/2)+"px";
    const sw=r.width*(STEP1.shadow.w/STEP1.stage.w), shH=r.height*(STEP1.shadow.h/STEP1.stage.h);
    sh.style.width=sw+"px"; sh.style.height=shH+"px";
    sh.style.left=STEP1.shadow.xPct+"%"; sh.style.top=STEP1.shadow.yPct+"%";
    sh.style.marginLeft=(-sw/2)+"px"; sh.style.marginTop=(-shH/2)+"px";
    sh.style.background=`rgba(0,0,0,${STEP1.shadow.opacity})`;
  }

  function apply(){
    placeBG();
    ["prev","next"].forEach(k=>{
      const el=document.getElementById(k);
      const p=state[k];
      el.style.width=state.size+"px"; el.style.height=state.size+"px";
      el.style.left=p.xPct+"%"; el.style.top=p.yPct+"%";
      el.style.marginLeft=(-state.size/2)+"px"; el.style.marginTop=(-state.size/2)+"px";
      el.style.fontSize=Math.round(state.size*0.55)+"px";
    });
    document.getElementById("size").value=state.size;
    document.getElementById("sizeVal").textContent=state.size;
    document.getElementById("out").textContent=JSON.stringify(exportObj(),null,2);
  }

  function makeDrag(el, key){
    let dragging=false, ox=0, oy=0;
    const down=(e)=>{
      const p=e.touches?e.touches[0]:e; dragging=true; el.classList.add("drag");
      const r=stage.getBoundingClientRect();
      ox=p.clientX-(r.left+state[key].xPct/100*r.width);
      oy=p.clientY-(r.top+state[key].yPct/100*r.height);
      e.preventDefault();
    };
    const move=(e)=>{
      if(!dragging) return;
      const p=e.touches?e.touches[0]:e; const r=stage.getBoundingClientRect();
      let x=Math.max(0,Math.min(r.width,p.clientX-r.left-ox));
      let y=Math.max(0,Math.min(r.height,p.clientY-r.top-oy));
      state[key].xPct=+(x/r.width*100).toFixed(2);
      state[key].yPct=+(y/r.height*100).toFixed(2);
      apply(); e.preventDefault();
    };
    const up=()=>{ dragging=false; el.classList.remove("drag"); save(); };
    el.addEventListener("pointerdown", down);
    window.addEventListener("pointermove", move, {passive:false});
    window.addEventListener("pointerup", up);
  }

  function exportObj(){
    const r=stage.getBoundingClientRect();
    return {
      step:3, validatedAt:new Date().toISOString(),
      stage:{w:Math.round(r.width),h:Math.round(r.height)},
      rot:{ size:state.size, prev:{...state.prev}, next:{...state.next} }
    };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(exportObj())); }catch(_e){} }
  function load(){
    try{
      const o=JSON.parse(localStorage.getItem(KEY)||"null");
      if(!o||!o.rot) return;
      state.size=o.rot.size||52;
      if(o.rot.prev) state.prev=o.rot.prev;
      if(o.rot.next) state.next=o.rot.next;
    }catch(_e){}
  }

  async function drawChar(){
    const urls=[BASE+"spritesheets/NakedBody/Idle.png",BASE+"spritesheets/Head1/Idle.png",BASE+"spritesheets/Chest1/Idle.png",BASE+"spritesheets/Legs1/Idle.png",BASE+"spritesheets/Shoes1/Idle.png"];
    const loadImg=(src)=>new Promise(res=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
    const imgs=await Promise.all(urls.map(loadImg));
    const cv=document.getElementById("cv"), cx=cv.getContext("2d");
    cx.clearRect(0,0,256,256); cx.imageSmoothingEnabled=false;
    const S=1.7, FW=128, FH=128, dw=FW*S, dh=FH*S, dx=(256-dw)/2, dy=16;
    for(const im of imgs){ if(im) try{ cx.drawImage(im,0,0,FW,FH,dx,dy,dw,dh);}catch(_e){} }
  }

  document.getElementById("size").oninput=(e)=>{ state.size=+e.target.value; apply(); save(); };
  document.getElementById("btnReset").onclick=()=>{ state.size=52; state.prev={xPct:18,yPct:78}; state.next={xPct:82,yPct:78}; apply(); save(); toast("Reset"); };
  document.getElementById("btnCopy").onclick=async()=>{
    const j=JSON.stringify(exportObj(),null,2);
    try{ await navigator.clipboard.writeText(j); toast("JSON copié ✓"); }catch(_e){ prompt("Copie :", j); }
  };
  document.getElementById("btnOk").onclick=()=>{
    const o=exportObj(); o.validated=true;
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(_e){}
    try{ navigator.clipboard.writeText(JSON.stringify(o,null,2)); }catch(_e){}
    document.getElementById("out").textContent=JSON.stringify(o,null,2);
    toast("Étape 3 validée ✓");
    alert("Flèches validées ✓\nEnvoie-moi le JSON et j’applique.");
  };

  makeDrag(document.getElementById("prev"),"prev");
  makeDrag(document.getElementById("next"),"next");
  load(); apply(); drawChar();
  window.addEventListener("resize", apply);
})();
</script>
</body>
</html>
