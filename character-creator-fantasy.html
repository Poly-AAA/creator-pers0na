<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Créateur Fantasy — NEURO-CORE</title>
<style>
  :root{
    --bg:#ecece8; --bg2:#f5f5f2; --ink:#555552; --ink2:#8e8e8a;
    --line:#c6c6c2; --line2:#dcdcd8; --card:#fafaf8; --tap:48px;
    --sel:#3d3d3a; --soft:#f0f0ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.35 Helvetica,Arial,sans-serif; overflow:hidden; overscroll-behavior:none}
  .app{height:100%;height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg2),var(--bg) 60%,#e2e2de)}

  .stage{flex:1;min-height:0;position:relative;overflow:hidden}
  canvas#stage{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
  .lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .callout{
    position:absolute;z-index:4;border:0;background:rgba(250,250,248,.92);color:var(--ink);
    padding:6px 8px;border-radius:8px;border:1px solid var(--line);cursor:pointer;
    letter-spacing:.1em;text-transform:uppercase;font-size:10px;min-height:36px;
  }
  .callout.on{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:600}

  .float-tab{
    position:absolute;z-index:5;display:flex;align-items:center;gap:6px;
    background:rgba(250,250,248,.94);border:1px solid var(--line);border-radius:12px;
    padding:4px 6px;min-height:40px;overflow:hidden;
  }
  .float-tab .ttl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);flex-shrink:0;padding:0 4px}
  .float-tab .scroller{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .float-tab .scroller::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1px solid var(--line2);background:var(--soft);color:var(--ink);
    border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:32px}
  .chip.on{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:600}

  .rot{
    position:absolute;z-index:6;width:var(--tap);height:var(--tap);border-radius:50%;
    border:1.5px solid var(--line);background:var(--card);color:var(--sel);
    font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .rot:active{background:var(--sel);color:#fff}

  .dock{
    flex-shrink:0;background:rgba(250,250,248,.96);border-top:1px solid var(--line2);
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;max-height:34%;overflow:auto;
  }
  .row{display:flex;align-items:center;gap:8px;min-width:0}
  .ttl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);flex-shrink:0;width:56px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;flex:1}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .sw.on{border-color:var(--sel)}
  .sw.bw{box-shadow:inset 0 0 0 1px #999}
  .body-stack{display:none;flex-direction:column;gap:8px}
  .body-stack.on{display:flex}
  .body-row{display:flex;align-items:center;gap:8px}
  .body-row select{flex:1;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;padding:0 10px}
  .body-row input[type=range]{flex:1;accent-color:var(--sel)}
  .body-row .op{width:42px;text-align:right;color:var(--ink2);font-size:13px}
  .body-row .rm{width:44px;height:44px;border:0;background:transparent;color:var(--ink2);font-size:22px;cursor:pointer}
  .btn{flex:1;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:15px;cursor:pointer}
  .btn.primary{background:var(--sel);color:#fff;border-color:var(--sel)}
  .status{font-size:11px;color:var(--ink2);text-align:center}
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(40,40,38,.35);display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet-panel{width:min(430px,100%);background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .sheet-panel h3{margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  .sheet-panel label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
  .sheet-panel input[type=range]{flex:1;accent-color:var(--sel)}
  .preview-sw{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);margin:0 auto}
  .sheet-actions{display:flex;gap:10px}
  .sheet-actions button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:15px}
  .sheet-actions .ok{background:var(--sel);color:#fff;border-color:var(--sel)}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stageWrap">
    <canvas id="stage" width="374" height="393" aria-label="Personnage"></canvas>
    <svg class="lines" id="lines"></svg>
    <div id="callouts"></div>

    <div class="float-tab" id="tabAnim"><span class="ttl">Anim</span><div class="scroller" id="animRail"></div></div>
    <div class="float-tab" id="tabChoix"><span class="ttl">Choix</span><div class="scroller" id="optRail"></div></div>
    <div class="float-tab" id="tabPartie"><span class="ttl">Partie</span><div class="scroller" id="zoneBar"></div></div>

    <button type="button" class="rot" id="dirPrev" aria-label="Tourner gauche">‹</button>
    <button type="button" class="rot" id="dirNext" aria-label="Tourner droite">›</button>
  </section>

  <section class="dock">
    <div class="row">
      <span class="ttl">Taille</span>
      <input type="range" id="charSize" min="45" max="95" value="86" step="1" style="flex:1;accent-color:var(--sel)"/>
      <span id="charSizeVal" style="min-width:3em;text-align:right;font-size:13px;color:var(--ink2)">86%</span>
    </div>
    <div class="row"><span class="ttl">Couleur</span><div class="swatches" id="swatches"></div></div>
    <div class="body-stack" id="bodyStack">
      <div class="row">
        <span class="ttl">Corps</span>
        <button type="button" class="btn" id="addBody" style="flex:0 0 auto;min-width:110px;min-height:44px">+ Couche</button>
      </div>
      <div id="bodyRows"></div>
    </div>
    <div class="row">
      <button type="button" class="btn" id="btnRandom">Aléatoire</button>
      <button type="button" class="btn" id="btnReset">Reset</button>
      <button type="button" class="btn primary" id="btnExport">Sauver</button>
    </div>
    <div class="status" id="status">Chargement…</div>
  </section>
</div>

<div class="sheet" id="colorSheet" role="dialog" aria-modal="true">
  <div class="sheet-panel">
    <h3>Couleur avancée</h3>
    <div class="preview-sw" id="advPreview"></div>
    <label>Teinte <input type="range" id="advH" min="0" max="360" value="30"/></label>
    <label>Saturation <input type="range" id="advS" min="0" max="100" value="40"/></label>
    <label>Clarté <input type="range" id="advL" min="5" max="95" value="55"/></label>
    <div class="sheet-actions">
      <button type="button" id="advCancel">Annuler</button>
      <button type="button" class="ok" id="advOk">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f89bfa1/assets/packs/fantasy-cc/";
  const FW=128, FH=128, COLS=15;
  const DIR_ROW=[0,1,2,3,4,5,6,7];
  let weaponAfterShieldRows=[true,true,true,false,false,false,false,true];
  let backpackInFrontRows=[true,false,false,false,false,true,true,true];

  /* Layout validé (étapes 1–2). Flèches = provisoire jusqu’à étape 3. */
  const LAY = {
    char:{ xPct:47.93, yPct:58.97, sizePct:320/370 }, // sizePct modifiable via curseur
    shadow:{ xPct:50, yPct:72, wPct:60/370, hPct:34/344, opacity:0.05 },
    labSize:10,
    tabH:40,
    callouts:{
      head:{ lab:"Tête", labX:50.09, labY:20.46, pinX:52.67, pinY:44.8 },
      chest:{ lab:"Torse", labX:72.41, labY:29.43, pinX:59.34, pinY:54.89 },
      backpack:{ lab:"Sac", labX:18.2, labY:26.78, pinX:43.56, pinY:50.63 },
      body:{ lab:"Corps", labX:8, labY:50, pinX:40.21, pinY:59.54 },
      legs:{ lab:"Jambes", labX:75, labY:72.18, pinX:61.05, pinY:63.32 },
      shoes:{ lab:"Chauss.", labX:12.05, labY:73.42, pinX:38.15, pinY:72.74 },
      weapon:{ lab:"Extra", labX:84, labY:50, pinX:74.95, pinY:55.09 },
    },
    tabs:{
      partie:{ xPct:3.11, yPct:86.85, wPct:92 },
      anim:{ xPct:4, yPct:4, wPct:44 },
      choix:{ xPct:52, yPct:4, wPct:44 },
    },
    // provisoire — à valider en étape 3
    rot:{ prev:{xPct:12, yPct:78}, next:{xPct:88, yPct:78}, size:48 }
  };

  const ZONE_ORDER = ["head","chest","backpack","body","legs","shoes","weapon"];
  const MISC_SLOTS = ["weapon","offhand","belt","gloves","slash","effect","mount"];
  const PALETTE = [
    "#f5c6aa","#d4a574","#a67c52","#f8d9a0","#e0b878","#b8893a",
    "#f0a090","#c45c26","#7a3010","#f2b8c6","#d4789a","#8a3a58",
    "#b8d4e8","#5b7c99","#2f4a66","#b8e0c8","#6b8f71","#3a5a42",
    "#d4c4e8","#8a70b0","#4a3870","#c8c4bc","#8a8580","#4a4642",
    "#ffffff","#000000",
  ];
  const DEFAULT_COLORS = {
    body:"#d4a574", shoes:"#3a3230", legs:"#3e4f63", chest:"#5b7c99",
    belt:"#8b6914", gloves:"#6a5a4e", offhand:"#6b8f71", weapon:"#9aa8b8",
    backpack:"#7a5c3a", head:"#e0b878", slash:"#e8590c", effect:"#5ec8ff", mount:"#8a7060",
  };

  const state = {
    catalog:null, look:{}, colors:{},
    bodies:[{folder:"NakedBody", opacity:1}],
    anim:"Idle", dir:0, fps:14,
    zoneId:"head", _miscFocus:"weapon",
    charSizePct: 320/370,
    cache:new Map(), raf:0, frame:0, lastT:0,
    drawing:false, dirty:true, drawRect:null,
  };

  const el = (id)=> document.getElementById(id);
  const stage = el("stage");
  const cx = stage.getContext("2d");
  const tintCv = document.createElement("canvas");
  const tintCx = tintCv.getContext("2d");

  function slots(){ return (state.catalog && state.catalog.slots) || []; }
  function slotById(id){ return slots().find(s=>s.id===id); }
  function folderFor(slotId){
    if(slotId==="body") return null;
    const v=state.look[slotId];
    return (!v||v==="None")?null:v;
  }
  function tintFor(slotId){
    const c=state.colors[slotId];
    if(!c||c==="#ffffff"||c==="#FFFFFF") return null;
    return c;
  }
  function defaultColors(){ return Object.assign({}, DEFAULT_COLORS); }
  function defaultLook(cat){
    const look={};
    for(const s of cat.slots) look[s.id]=s.required?(s.folders[0]||"NakedBody"):"None";
    look.body="NakedBody"; look.chest="Chest1"; look.legs="Legs1";
    look.shoes="Shoes1"; look.head="Head1"; look.weapon="Melee1"; look.offhand="Shield1";
    return look;
  }
  function shortOpt(name){
    if(!name||name==="None") return "Aucun";
    return name.replace(/^(Head|Chest|Legs|Shoes|Belt|Hands|Weapon|Shield|Backpack|Melee|Bow|Staff|Mount|Effect|Slash|NakedBody)_?/i,"")||name;
  }

  function loadImg(folder, anim){
    const key=folder+"/"+anim;
    if(state.cache.has(key)) return state.cache.get(key);
    const p=new Promise((resolve)=>{
      const rel=`spritesheets/${folder}/${anim}.png`;
      const urls=[BASE_CDN+rel, BASE_LOCAL+rel];
      const im=new Image(); try{ im.crossOrigin="anonymous"; }catch(_e){}
      let i=0;
      const next=()=>{
        if(i>=urls.length){ resolve(null); return; }
        im.onload=()=>resolve(im); im.onerror=()=>next(); im.src=urls[i++];
      };
      next();
    });
    state.cache.set(key,p); return p;
  }

  function layersForRow(row){
    const L=[];
    L.push({folder:(state.catalog.shadowFolder||"Shadow"), tint:null, alpha:1});
    for(const b of state.bodies){
      if(b.folder) L.push({folder:b.folder, tint:tintFor("body"), alpha:Math.max(0,Math.min(1,+b.opacity||1))});
    }
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folderFor(id); if(f) L.push({folder:f, tint:tintFor(id), alpha:1});
    }
    const shield=folderFor("offhand"), weapon=folderFor("weapon"), bag=folderFor("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tintFor("offhand"),alpha:1}); if(weapon) mid.push({folder:weapon,tint:tintFor("weapon"),alpha:1}); }
    else { if(weapon) mid.push({folder:weapon,tint:tintFor("weapon"),alpha:1}); if(shield) mid.push({folder:shield,tint:tintFor("offhand"),alpha:1}); }
    if(bag){ const item={folder:bag,tint:tintFor("backpack"),alpha:1}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folderFor(id); if(f) L.push({folder:f, tint:tintFor(id), alpha:1}); }
    const mount=folderFor("mount"); if(mount) L.unshift({folder:mount, tint:tintFor("mount"), alpha:1});
    return L.filter(x=>x.folder);
  }

  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex,alpha){
    const a=(alpha==null)?1:alpha;
    cx.save(); cx.globalAlpha=a;
    if(!tintHex){ cx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); cx.restore(); return; }
    const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
    if(tintCv.width!==tw) tintCv.width=tw;
    if(tintCv.height!==th) tintCv.height=th;
    const t=tintCx;
    t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation="source-over"; t.globalAlpha=1;
    t.clearRect(0,0,tw,th); t.imageSmoothingEnabled=false;
    t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,tw,th);
    t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="source-over";
    cx.drawImage(tintCv,dx,dy); cx.restore();
  }

  function fitCanvas(){
    const wrap=el("stageWrap");
    const r=wrap.getBoundingClientRect();
    const w=Math.max(200, Math.round(r.width));
    const h=Math.max(200, Math.round(r.height));
    if(stage.width!==w || stage.height!==h){ stage.width=w; stage.height=h; state.dirty=true; }
  }

  function layoutChrome(){
    const placeTab=(id, key)=>{
      const t=LAY.tabs[key]; const node=el(id); if(!node||!t) return;
      node.style.left=t.xPct+"%"; node.style.top=t.yPct+"%";
      node.style.width=t.wPct+"%"; node.style.minHeight=LAY.tabH+"px";
    };
    placeTab("tabAnim","anim"); placeTab("tabChoix","choix"); placeTab("tabPartie","partie");

    const rp=el("dirPrev"), rn=el("dirNext");
    rp.style.left=LAY.rot.prev.xPct+"%"; rp.style.top=LAY.rot.prev.yPct+"%";
    rp.style.width=LAY.rot.size+"px"; rp.style.height=LAY.rot.size+"px";
    rp.style.marginLeft=(-LAY.rot.size/2)+"px"; rp.style.marginTop=(-LAY.rot.size/2)+"px";
    rn.style.left=LAY.rot.next.xPct+"%"; rn.style.top=LAY.rot.next.yPct+"%";
    rn.style.width=LAY.rot.size+"px"; rn.style.height=LAY.rot.size+"px";
    rn.style.marginLeft=(-LAY.rot.size/2)+"px"; rn.style.marginTop=(-LAY.rot.size/2)+"px";

    const host=el("callouts");
    const svg=el("lines");
    const wr=el("stageWrap").getBoundingClientRect();
    host.innerHTML=""; svg.innerHTML="";
    svg.setAttribute("viewBox", `0 0 ${wr.width} ${wr.height}`);
    ZONE_ORDER.forEach(id=>{
      const c=LAY.callouts[id]; if(!c) return;
      const btn=document.createElement("button");
      btn.type="button"; btn.className="callout"+(state.zoneId===id?" on":"");
      btn.textContent=c.lab;
      btn.style.fontSize=LAY.labSize+"px";
      btn.style.left=c.labX+"%"; btn.style.top=c.labY+"%";
      btn.onclick=()=>selectZone(id);
      host.appendChild(btn);

      const labEl=btn.getBoundingClientRect();
      const x1 = c.labX/100*wr.width + labEl.width*0.5;
      const y1 = c.labY/100*wr.height + labEl.height*0.5;
      const x2 = c.pinX/100*wr.width;
      const y2 = c.pinY/100*wr.height;
      const line=document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",x1); line.setAttribute("y1",y1);
      line.setAttribute("x2",x2); line.setAttribute("y2",y2);
      line.setAttribute("stroke", state.zoneId===id?"#3d3d3a":"#b0b0ac");
      line.setAttribute("stroke-width", state.zoneId===id?"1.5":"1");
      svg.appendChild(line);
      const pin=document.createElementNS("http://www.w3.org/2000/svg","circle");
      pin.setAttribute("cx",x2); pin.setAttribute("cy",y2);
      pin.setAttribute("r", state.zoneId===id?"3.5":"2.5");
      pin.setAttribute("fill", state.zoneId===id?"#3d3d3a":"#b0b0ac");
      svg.appendChild(pin);
    });
  }

  async function draw(){
    if(!state.catalog) return;
    fitCanvas();
    const row=DIR_ROW[state.dir|0]|0;
    const fps=Math.max(1,state.fps|0);
    const interval=1000/fps;
    const now=performance.now();
    let advanced=false;
    if(now-state.lastT>interval){
      const steps=Math.floor((now-state.lastT)/interval);
      state.frame=(state.frame+steps)%COLS;
      state.lastT+=steps*interval;
      if(now-state.lastT>interval*2) state.lastT=now;
      advanced=true;
    }
    if(!advanced && !state.dirty) return;
    state.dirty=false;
    const col=state.frame, anim=state.anim;
    const W=stage.width, H=stage.height;
    cx.clearRect(0,0,W,H);

    const charSize=W*(state.charSizePct||LAY.char.sizePct);
    const scale=charSize/FW;
    const dw=FW*scale, dh=FH*scale;
    const ox=W*(LAY.char.xPct/100), oy=H*(LAY.char.yPct/100);
    const dx=ox-dw/2, dy=oy-dh/2;
    const shX=W*(LAY.shadow.xPct/100), shY=H*(LAY.shadow.yPct/100);
    const shRx=(W*LAY.shadow.wPct)/2, shRy=(H*LAY.shadow.hPct)/2;
    state.drawRect={dx,dy,dw,dh,scale};

    const grd=cx.createRadialGradient(shX,shY,1,shX,shY,Math.max(shRx,shRy));
    grd.addColorStop(0,`rgba(0,0,0,${LAY.shadow.opacity})`);
    grd.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=grd; cx.beginPath(); cx.ellipse(shX,shY,shRx,shRy,0,0,Math.PI*2); cx.fill();

    const layers=layersForRow(row);
    const imgs=await Promise.all(layers.map(L=>loadImg(L.folder,anim)));
    if(state.anim!==anim){ state.dirty=true; return; }
    cx.imageSmoothingEnabled=false;
    let missing=0;
    for(let i=0;i<layers.length;i++){
      const im=imgs[i];
      if(!im||!im.naturalWidth){ missing++; continue; }
      try{ tintDraw(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh,layers[i].tint,layers[i].alpha); }
      catch(_e){ try{ cx.globalAlpha=layers[i].alpha||1; cx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); cx.globalAlpha=1; }catch(__e){ missing++; } }
    }
    el("status").textContent=`${anim} · tour ${state.dir+1}/8`+(missing?` · ${missing} manq.`:"");
    layoutChrome();
  }
  function loop(){
    if(!state.drawing){
      state.drawing=true;
      draw().catch(e=>{ el("status").textContent="Erreur: "+(e.message||e); })
        .finally(()=>{ state.drawing=false; });
    }
    state.raf=requestAnimationFrame(loop);
  }

  function selectZone(id){
    state.zoneId=id;
    el("bodyStack").classList.toggle("on", id==="body");
    renderZones(); renderOpts(); renderSwatches(); renderBodies(); layoutChrome();
  }

  function renderZones(){
    const bar=el("zoneBar"); bar.innerHTML="";
    ZONE_ORDER.forEach(id=>{
      const c=LAY.callouts[id];
      const b=document.createElement("button");
      b.type="button"; b.className="chip"+(state.zoneId===id?" on":"");
      b.textContent=c.lab; b.onclick=()=>selectZone(id);
      bar.appendChild(b);
    });
  }
  function renderAnims(){
    const rail=el("animRail"); rail.innerHTML="";
    const anims=(state.catalog.anims&&state.catalog.anims.length)?state.catalog.anims:["Idle","Walk","Attack1"];
    anims.forEach(a=>{
      const b=document.createElement("button");
      b.type="button"; b.className="chip"+(a===state.anim?" on":"");
      b.textContent=a;
      b.onclick=()=>{ state.anim=a; state.frame=0; state.dirty=true; renderAnims(); };
      rail.appendChild(b);
    });
  }
  function renderOpts(){
    const rail=el("optRail"); rail.innerHTML="";
    const tab=el("tabChoix");
    if(state.zoneId==="body"){ tab.style.opacity="0.35"; return; }
    tab.style.opacity="1";
    if(state.zoneId==="weapon"){
      MISC_SLOTS.forEach(sid=>{
        const s=slotById(sid); if(!s) return;
        const b=document.createElement("button");
        b.type="button"; b.className="chip"+(state._miscFocus===sid?" on":"");
        b.textContent=s.lab.split("/")[0].trim();
        b.onclick=()=>{ state._miscFocus=sid; renderMiscOpts(sid); };
        rail.appendChild(b);
      });
      renderMiscOpts(state._miscFocus||"weapon"); return;
    }
    const s=slotById(state.zoneId); if(!s) return;
    const cur=state.look[state.zoneId];
    (s.folders||[]).forEach(name=>{
      const b=document.createElement("button");
      b.type="button"; b.className="chip"+(name===cur?" on":"");
      b.textContent=shortOpt(name); b.title=name;
      b.onclick=()=>{ state.look[state.zoneId]=name; state.dirty=true; renderOpts(); };
      rail.appendChild(b);
    });
  }
  function renderMiscOpts(sid){
    const rail=el("optRail");
    [...rail.querySelectorAll("[data-misc]")].forEach(n=>n.remove());
    const s=slotById(sid); if(!s) return;
    const cur=state.look[sid];
    (s.folders||[]).forEach(name=>{
      const b=document.createElement("button");
      b.type="button"; b.dataset.misc="1";
      b.className="chip"+(name===cur?" on":"");
      b.textContent=name==="None"?"∅":shortOpt(name);
      b.onclick=()=>{ state.look[sid]=name; state.dirty=true; renderMiscOpts(sid); };
      rail.appendChild(b);
    });
  }
  function renderSwatches(){
    const host=el("swatches"); host.innerHTML="";
    const cur=(state.colors[state.zoneId]||"").toLowerCase();
    PALETTE.forEach(hex=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="sw"+(hex==="#ffffff"||hex==="#000000"?" bw":"")+(cur===hex.toLowerCase()?" on":"");
      b.style.background=hex;
      let timer=null, long=false;
      b.addEventListener("pointerdown", ()=>{ long=false; timer=setTimeout(()=>{ long=true; openColorSheet(hex); },480); });
      const end=()=>{ clearTimeout(timer); if(!long){ state.colors[state.zoneId]=hex; state.dirty=true; renderSwatches(); } };
      b.addEventListener("pointerup", end);
      b.addEventListener("pointerleave", ()=>clearTimeout(timer));
      b.addEventListener("pointercancel", ()=>clearTimeout(timer));
      host.appendChild(b);
    });
  }
  function hslToHex(h,s,l){
    s/=100; l/=100; const a=s*Math.min(l,1-l);
    const f=n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(Math.min(k-3,9-k,1),-1); return Math.round(255*c).toString(16).padStart(2,"0"); };
    return "#"+f(0)+f(8)+f(4);
  }
  function hexToHsl(hex){
    let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b); let h=0,s=0,l=(max+min)/2;
    if(max!==min){ const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){ case r:h=((g-b)/d+(g<b?6:0));break; case g:h=(b-r)/d+2;break; default:h=(r-g)/d+4;} h*=60; }
    return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};
  }
  let advTarget=null;
  function syncAdv(){ const hex=hslToHex(+el("advH").value,+el("advS").value,+el("advL").value); el("advPreview").style.background=hex; advTarget=hex; }
  function openColorSheet(fromHex){
    const hsl=hexToHsl(fromHex||state.colors[state.zoneId]||"#888888");
    el("advH").value=hsl.h; el("advS").value=hsl.s; el("advL").value=hsl.l; syncAdv(); el("colorSheet").classList.add("on");
  }
  function closeColorSheet(apply){
    el("colorSheet").classList.remove("on");
    if(apply&&advTarget){ state.colors[state.zoneId]=advTarget; state.dirty=true; renderSwatches(); }
  }
  function renderBodies(){
    const host=el("bodyRows"); host.innerHTML="";
    const folders=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
    state.bodies.forEach((b,idx)=>{
      const row=document.createElement("div"); row.className="body-row";
      const sel=document.createElement("select");
      folders.forEach(f=>{ const o=document.createElement("option"); o.value=f; o.textContent=f; if(f===b.folder) o.selected=true; sel.appendChild(o); });
      sel.onchange=()=>{ state.bodies[idx].folder=sel.value; state.look.body=state.bodies[0].folder; state.dirty=true; };
      const range=document.createElement("input"); range.type="range"; range.min="0"; range.max="100"; range.value=String(Math.round((b.opacity||1)*100));
      const op=document.createElement("span"); op.className="op"; op.textContent=range.value+"%";
      range.oninput=()=>{ state.bodies[idx].opacity=(+range.value)/100; op.textContent=range.value+"%"; state.dirty=true; };
      const rm=document.createElement("button"); rm.type="button"; rm.className="rm"; rm.textContent="×";
      rm.disabled=state.bodies.length<=1;
      rm.onclick=()=>{ if(state.bodies.length<=1) return; state.bodies.splice(idx,1); state.look.body=state.bodies[0].folder; renderBodies(); state.dirty=true; };
      row.appendChild(sel); row.appendChild(range); row.appendChild(op); row.appendChild(rm); host.appendChild(row);
    });
  }

  function syncSizeUI(){
    const pct=Math.round((state.charSizePct||LAY.char.sizePct)*100);
    const inp=el("charSize"), lab=el("charSizeVal");
    if(inp) inp.value=String(pct);
    if(lab) lab.textContent=pct+"%";
  }
  function bind(){
    el("dirPrev").onclick=()=>{ state.dir=(state.dir+7)%8; state.dirty=true; };
    el("dirNext").onclick=()=>{ state.dir=(state.dir+1)%8; state.dirty=true; };
    const sizeEl=el("charSize");
    if(sizeEl) sizeEl.oninput=()=>{
      state.charSizePct=Math.max(0.45, Math.min(0.95, (+sizeEl.value)/100));
      syncSizeUI(); state.dirty=true;
    };
    el("advH").oninput=syncAdv; el("advS").oninput=syncAdv; el("advL").oninput=syncAdv;
    el("advCancel").onclick=()=>closeColorSheet(false);
    el("advOk").onclick=()=>closeColorSheet(true);
    el("colorSheet").addEventListener("click", e=>{ if(e.target.id==="colorSheet") closeColorSheet(false); });
    el("addBody").onclick=()=>{
      const folders=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
      state.bodies.push({folder:folders[state.bodies.length%folders.length]||"NakedBody", opacity:0.55});
      renderBodies(); state.dirty=true;
    };
    el("btnRandom").onclick=()=>{
      const palette=PALETTE.slice(0,-2);
      for(const s of slots()){
        if(s.id==="body") continue;
        state.look[s.id]=s.folders[Math.floor(Math.random()*s.folders.length)];
        if(Math.random()<0.7) state.colors[s.id]=palette[Math.floor(Math.random()*palette.length)];
      }
      const bf=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
      state.bodies=[{folder:bf[Math.floor(Math.random()*bf.length)]||"NakedBody", opacity:1}];
      state.look.body=state.bodies[0].folder;
      state.dirty=true; renderOpts(); renderSwatches(); renderBodies();
    };
    el("btnReset").onclick=()=>{
      state.look=defaultLook(state.catalog); state.colors=defaultColors(); state.bodies=[{folder:"NakedBody",opacity:1}];
      state.dirty=true; renderOpts(); renderSwatches(); renderBodies();
    };
    el("btnExport").onclick=()=>{
      const payload={pack:"fantasy-cc", look:state.look, colors:state.colors, bodies:state.bodies, fps:state.fps, anim:state.anim, dir:state.dir, charSizePct:state.charSizePct};
      try{ localStorage.setItem("neuro.fantasyLook", JSON.stringify(payload)); }catch(_e){}
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
      a.download="fantasy-look.json"; a.click(); el("status").textContent="Look sauvé";
    };
    window.addEventListener("resize", ()=>{ state.dirty=true; layoutChrome(); });
  }

  async function boot(){
    el("status").textContent="Chargement…";
    let cat=null;
    for(const u of [BASE_CDN+"catalog.json", BASE_LOCAL+"catalog.json"]){
      try{ const r=await fetch(u,{cache:"no-store",mode:"cors"}); if(r.ok){ cat=await r.json(); break; } }catch(_e){}
    }
    if(!cat){ el("status").textContent="Catalogue introuvable"; return; }
    state.catalog=cat;
    if(cat.weaponAfterShieldRows) weaponAfterShieldRows=cat.weaponAfterShieldRows;
    if(cat.backpackInFrontRows) backpackInFrontRows=cat.backpackInFrontRows;
    if(cat.defaultFps) state.fps=cat.defaultFps|0;
    state.colors=defaultColors();
    try{
      const raw=localStorage.getItem("neuro.fantasyLook");
      if(raw){
        const o=JSON.parse(raw);
        if(o&&o.look){
          state.look=o.look;
          if(o.colors) state.colors=Object.assign(defaultColors(), o.colors);
          if(o.bodies&&o.bodies.length) state.bodies=o.bodies;
          else if(o.look.body) state.bodies=[{folder:o.look.body, opacity:1}];
          if(o.anim) state.anim=o.anim;
          if(typeof o.charSizePct==="number") state.charSizePct=Math.max(0.45, Math.min(0.95, o.charSizePct));
        }
      }
    }catch(_e){}
    if(!state.look.body) state.look=defaultLook(cat);
    if(!state.bodies.length) state.bodies=[{folder:"NakedBody",opacity:1}];
    const anims=(cat.anims&&cat.anims.length)?cat.anims:["Idle","Walk","Attack1"];
    if(!anims.includes(state.anim)) state.anim=anims[0];
    bind(); syncSizeUI(); renderAnims(); selectZone("head");
    state.dirty=true;
    await loadImg(state.bodies[0].folder||"NakedBody","Idle");
    loop();
  }
  boot().catch(e=>{ el("status").textContent="Échec: "+(e.message||e); });
})();
</script>
</body>
</html>
