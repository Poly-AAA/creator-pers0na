<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Créateur Fantasy — NEURO-CORE</title>
<style>
  :root{
    --bg:#0c1218; --panel:#121a22; --line:#2a3a4a; --text:#eef3f8; --muted:#8fa3b8;
    --accent:#c45c26; --accent2:#e8a05a; --tap:44px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden}
  .app{height:100%; max-width:980px; margin:0 auto; display:grid;
    grid-template-columns: minmax(200px,42%) 1fr; grid-template-rows:1fr}
  @media(max-width:720px){
    .app{grid-template-columns:1fr; grid-template-rows:42% 1fr}
  }

  /* —— Preview (ancré) —— */
  .preview{
    background:linear-gradient(165deg,#0a1016,#15202a 60%,#0d1520);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; padding:12px; min-height:0;
  }
  @media(max-width:720px){.preview{border-right:0; border-bottom:1px solid var(--line)}}
  canvas#stage{width:min(100%,280px); max-height:70%; aspect-ratio:1;
    background:#070b10; border-radius:12px; border:1px solid var(--line); image-rendering:pixelated}
  .prev-tools{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; width:100%}
  .prev-tools select, .btn{
    min-height:var(--tap); border:1px solid var(--line); background:#1a2632; color:var(--text);
    border-radius:10px; padding:0 12px; font-size:14px; cursor:pointer}
  .btn:active{border-color:var(--accent)}
  .btn.primary{background:#2a1a12; border-color:var(--accent); color:var(--accent2)}
  .fps-row{display:flex; align-items:center; gap:8px; width:min(100%,280px); font-size:12px; color:var(--muted)}
  .fps-row input{flex:1; accent-color:var(--accent)}
  .status{font-size:11px; color:var(--muted); text-align:center; min-height:1.2em}

  /* —— Panel droit (écrans) —— */
  .ui{display:flex; flex-direction:column; min-height:0; background:var(--panel)}
  .screen{display:none; flex:1; flex-direction:column; min-height:0; padding:12px; gap:10px}
  .screen.on{display:flex}
  .topbar{display:flex; align-items:center; gap:8px; min-height:var(--tap)}
  .topbar h1{margin:0; font-size:17px; letter-spacing:.03em; flex:1}
  .topbar .back{min-width:var(--tap)}

  .zone-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; overflow:auto; flex:1; align-content:start}
  .zone-card{
    min-height:64px; border:1px solid var(--line); border-radius:12px; background:#18232e;
    padding:12px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px}
  .zone-card:active{border-color:var(--accent)}
  .zone-card .zlab{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted)}
  .zone-card .zval{font-size:15px; font-weight:600; color:var(--accent2); word-break:break-word}

  .editor{display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center}
  .row-arrows{display:flex; align-items:center; gap:8px}
  .row-arrows .mid{flex:1; text-align:center; min-width:0}
  .row-arrows .mid .lab{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .row-arrows .mid .val{font-size:20px; font-weight:700; color:var(--text); margin-top:4px; word-break:break-word}
  .arrow{
    width:var(--tap); height:var(--tap); flex-shrink:0; border-radius:12px;
    border:1px solid var(--line); background:#1a2632; color:var(--text); font-size:22px; cursor:pointer}
  .arrow:active{border-color:var(--accent); color:var(--accent2)}

  .color-row{display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:12px; background:#18232e}
  .color-row span{flex:1; font-size:14px; color:var(--muted)}
  .color-row input[type=color]{width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer}
  .foot{display:flex; gap:8px; flex-wrap:wrap}
  .foot .btn{flex:1; min-width:100px}
  .hint{font-size:12px; color:var(--muted); line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <aside class="preview">
    <canvas id="stage" width="256" height="256" aria-label="Aperçu personnage"></canvas>
    <div class="prev-tools">
      <select id="animSelect" aria-label="Animation"></select>
      <button type="button" class="btn" id="dirPrev" aria-label="Direction précédente">◀</button>
      <button type="button" class="btn" id="dirNext" aria-label="Direction suivante">▶</button>
    </div>
    <div class="fps-row">
      <label for="fps">FPS</label>
      <input type="range" id="fps" min="1" max="30" value="14" step="1"/>
      <span id="fpsVal">14</span>
    </div>
    <div class="status" id="status">Chargement…</div>
  </aside>

  <section class="ui">
    <!-- Écran 1 : liste des zones -->
    <div class="screen on" id="screenHome">
      <div class="topbar"><h1>Zones</h1></div>
      <p class="hint">Touche une zone · flèches pour changer · couleur à côté.</p>
      <div class="zone-grid" id="zoneGrid"></div>
      <div class="foot">
        <button type="button" class="btn" id="btnRandom">Aléatoire</button>
        <button type="button" class="btn" id="btnReset">Reset</button>
        <button type="button" class="btn primary" id="btnExport">Sauver</button>
      </div>
    </div>

    <!-- Écran 2 : édition d’une zone -->
    <div class="screen" id="screenZone">
      <div class="topbar">
        <button type="button" class="btn back" id="btnBack" aria-label="Retour">←</button>
        <h1 id="zoneTitle">Zone</h1>
      </div>
      <div class="editor">
        <div class="row-arrows">
          <button type="button" class="arrow" id="optPrev" aria-label="Option précédente">‹</button>
          <div class="mid">
            <div class="lab">Option</div>
            <div class="val" id="optVal">—</div>
          </div>
          <button type="button" class="arrow" id="optNext" aria-label="Option suivante">›</button>
        </div>
        <div class="color-row">
          <span>Couleur</span>
          <input type="color" id="optColor" value="#888888" aria-label="Couleur de la zone"/>
          <button type="button" class="btn" id="optColorClear">Orig.</button>
        </div>
        <div class="row-arrows">
          <button type="button" class="arrow" id="zonePrev" aria-label="Zone précédente">‹</button>
          <div class="mid">
            <div class="lab">Changer de zone</div>
            <div class="val" id="zoneNavLab" style="font-size:15px">—</div>
          </div>
          <button type="button" class="arrow" id="zoneNext" aria-label="Zone suivante">›</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f89bfa1/assets/packs/fantasy-cc/";
  const FW = 128, FH = 128, COLS = 15;
  const DIR_ROW = [0,1,2,3,4,5,6,7];
  let weaponAfterShieldRows = [true,true,true,false,false,false,false,true];
  let backpackInFrontRows = [true,false,false,false,false,true,true,true];

  const DEFAULT_COLORS = {
    body:"#d4a574", shoes:"#3a3230", legs:"#3e4f63", chest:"#5b7c99",
    belt:"#8b6914", gloves:"#6a5a4e", offhand:"#6b8f71", weapon:"#9aa8b8",
    backpack:"#7a5c3a", head:"#e0b878", slash:"#e8590c", effect:"#5ec8ff", mount:"#8a7060",
  };

  const state = {
    catalog:null, look:{}, colors:{},
    anim:"Idle", dir:0, fps:14,
    zoneId:null, zoneIdx:0,
    cache:new Map(), raf:0, frame:0, lastT:0,
    drawing:false, dirty:true,
  };

  const el = (id)=> document.getElementById(id);
  const stage = el("stage");
  const cx = stage.getContext("2d");
  const tintCv = document.createElement("canvas");
  const tintCx = tintCv.getContext("2d");

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s=> s.classList.toggle("on", s.id===id));
  }

  function slots(){ return (state.catalog && state.catalog.slots) || []; }

  function folderFor(slotId){
    const v = state.look[slotId];
    return (!v || v === "None") ? null : v;
  }
  function tintFor(slotId){
    const c = state.colors[slotId];
    if(!c || c === "#ffffff" || c === "#FFFFFF") return null;
    return c;
  }
  function displayOpt(name){
    return (!name || name === "None") ? "Aucun" : name;
  }

  function defaultColors(){ return Object.assign({}, DEFAULT_COLORS); }
  function defaultLook(cat){
    const look = {};
    for(const s of cat.slots) look[s.id] = s.required ? (s.folders[0]||"NakedBody") : "None";
    look.body="NakedBody"; look.chest="Chest1"; look.legs="Legs1";
    look.shoes="Shoes1"; look.head="Head1"; look.weapon="Melee1"; look.offhand="Shield1";
    return look;
  }

  function urlFor(folder, anim){
    const rel = `spritesheets/${folder}/${anim}.png`;
    return { local: BASE_LOCAL+rel, cdn: BASE_CDN+rel };
  }
  function loadImg(folder, anim){
    const key = folder+"/"+anim;
    if(state.cache.has(key)) return state.cache.get(key);
    const p = new Promise((resolve)=>{
      const urls = urlFor(folder, anim);
      const order = [urls.cdn, urls.local];
      const im = new Image();
      try{ im.crossOrigin="anonymous"; }catch(_e){}
      let i=0;
      const next=()=>{
        if(i>=order.length){ resolve(null); return; }
        im.onload=()=>resolve(im);
        im.onerror=()=>next();
        im.src=order[i++];
      };
      next();
    });
    state.cache.set(key,p);
    return p;
  }

  function layersForRow(row){
    const L=[];
    L.push({folder: (state.catalog.shadowFolder||"Shadow"), tint:null});
    const body=folderFor("body"); if(body) L.push({folder:body, tint:tintFor("body")});
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folderFor(id); if(f) L.push({folder:f, tint:tintFor(id)});
    }
    const shield=folderFor("offhand"), weapon=folderFor("weapon"), bag=folderFor("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tintFor("offhand")}); if(weapon) mid.push({folder:weapon,tint:tintFor("weapon")}); }
    else { if(weapon) mid.push({folder:weapon,tint:tintFor("weapon")}); if(shield) mid.push({folder:shield,tint:tintFor("offhand")}); }
    if(bag){ const item={folder:bag,tint:tintFor("backpack")}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folderFor(id); if(f) L.push({folder:f,tint:tintFor(id)}); }
    const mount=folderFor("mount"); if(mount) L.unshift({folder:mount,tint:tintFor("mount")});
    return L.filter(x=>x.folder);
  }

  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex){
    if(!tintHex){ cx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); return; }
    const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
    if(tintCv.width!==tw) tintCv.width=tw;
    if(tintCv.height!==th) tintCv.height=th;
    const t=tintCx;
    t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation="source-over"; t.globalAlpha=1;
    t.clearRect(0,0,tw,th); t.imageSmoothingEnabled=false;
    t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,tw,th);
    t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="source-over";
    cx.drawImage(tintCv,dx,dy);
  }

  async function draw(){
    if(!state.catalog) return;
    const row=DIR_ROW[state.dir|0]|0;
    const fps=Math.max(1,state.fps|0);
    const interval=1000/fps;
    const now=performance.now();
    let advanced=false;
    if(now-state.lastT>interval){
      const steps=Math.floor((now-state.lastT)/interval);
      state.frame=(state.frame+steps)%COLS;
      state.lastT+=steps*interval;
      if(now-state.lastT>interval*2) state.lastT=now;
      advanced=true;
    }
    if(!advanced && !state.dirty) return;
    state.dirty=false;
    const col=state.frame, anim=state.anim;
    const W=stage.width, H=stage.height;
    cx.clearRect(0,0,W,H); cx.fillStyle="#0a1420"; cx.fillRect(0,0,W,H);
    const tw=40, th=20, ox=W/2, oy=H/2+36;
    for(let c=-1;c<=1;c++) for(let r=-1;r<=1;r++){
      const x=ox+(c-r)*tw/2, y=oy+(c+r)*th/2;
      cx.beginPath();
      cx.moveTo(x,y-th/2); cx.lineTo(x+tw/2,y); cx.lineTo(x,y+th/2); cx.lineTo(x-tw/2,y); cx.closePath();
      cx.fillStyle=((c+r)&1)?"rgba(196,92,38,.10)":"rgba(196,92,38,.18)"; cx.fill();
    }
    const layers=layersForRow(row);
    const imgs=await Promise.all(layers.map(L=>loadImg(L.folder,anim)));
    if(state.anim!==anim){ state.dirty=true; return; }
    const scale=1.55, dw=FW*scale, dh=FH*scale, foot=110;
    const dx=ox-dw/2, dy=oy+4-foot*scale;
    cx.imageSmoothingEnabled=false;
    let missing=0;
    for(let i=0;i<layers.length;i++){
      const im=imgs[i];
      if(!im||!im.naturalWidth){ missing++; continue; }
      try{ tintDraw(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh,layers[i].tint); }
      catch(_e){ try{ cx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); }catch(__e){ missing++; } }
    }
    el("status").textContent=`${anim} · ${fps}fps · dir ${state.dir}`+(missing?` · ${missing} manq.`:"");
  }
  function loop(){
    if(!state.drawing){
      state.drawing=true;
      draw().catch(e=>{ el("status").textContent="Erreur: "+(e.message||e); })
        .finally(()=>{ state.drawing=false; });
    }
    state.raf=requestAnimationFrame(loop);
  }

  /* —— UI zones —— */
  function renderHome(){
    const grid=el("zoneGrid"); grid.innerHTML="";
    slots().forEach((s, idx)=>{
      const b=document.createElement("button");
      b.type="button"; b.className="zone-card";
      b.innerHTML=`<span class="zlab">${s.lab}</span><span class="zval">${displayOpt(state.look[s.id])}</span>`;
      b.onclick=()=> openZone(idx);
      grid.appendChild(b);
    });
  }

  function openZone(idx){
    const list=slots();
    if(!list.length) return;
    state.zoneIdx=((idx%list.length)+list.length)%list.length;
    state.zoneId=list[state.zoneIdx].id;
    renderZone();
    showScreen("screenZone");
  }

  function renderZone(){
    const list=slots();
    const s=list[state.zoneIdx]; if(!s) return;
    el("zoneTitle").textContent=s.lab;
    el("zoneNavLab").textContent=s.lab;
    const opts=s.folders||[];
    let cur=state.look[s.id];
    let i=opts.indexOf(cur); if(i<0) i=0;
    el("optVal").textContent=displayOpt(opts[i]);
    el("optColor").value=state.colors[s.id]||DEFAULT_COLORS[s.id]||"#888888";
  }

  function cycleOpt(delta){
    const s=slots()[state.zoneIdx]; if(!s) return;
    const opts=s.folders||[]; if(!opts.length) return;
    let i=opts.indexOf(state.look[s.id]); if(i<0) i=0;
    i=(i+delta+opts.length)%opts.length;
    state.look[s.id]=opts[i];
    state.dirty=true;
    renderZone();
    renderHome();
  }

  function cycleZone(delta){
    openZone(state.zoneIdx+delta);
  }

  function fillAnimSelect(anims){
    const sel=el("animSelect"); sel.innerHTML="";
    for(const a of anims){
      const o=document.createElement("option");
      o.value=a; o.textContent=a;
      if(a===state.anim) o.selected=true;
      sel.appendChild(o);
    }
    sel.onchange=()=>{ state.anim=sel.value; state.frame=0; state.dirty=true; };
  }

  function bind(){
    el("dirPrev").onclick=()=>{ state.dir=(state.dir+7)%8; state.dirty=true; };
    el("dirNext").onclick=()=>{ state.dir=(state.dir+1)%8; state.dirty=true; };
    const fps=el("fps"), fpsVal=el("fpsVal");
    const syncFps=()=>{ state.fps=Math.max(1,parseInt(fps.value,10)||14); fpsVal.textContent=String(state.fps); state.dirty=true; };
    fps.oninput=syncFps; syncFps();

    el("btnBack").onclick=()=>{ showScreen("screenHome"); renderHome(); };
    el("optPrev").onclick=()=> cycleOpt(-1);
    el("optNext").onclick=()=> cycleOpt(1);
    el("zonePrev").onclick=()=> cycleZone(-1);
    el("zoneNext").onclick=()=> cycleZone(1);
    el("optColor").oninput=()=>{
      if(!state.zoneId) return;
      state.colors[state.zoneId]=el("optColor").value;
      state.dirty=true;
    };
    el("optColorClear").onclick=()=>{
      if(!state.zoneId) return;
      state.colors[state.zoneId]="#ffffff";
      el("optColor").value="#ffffff";
      state.dirty=true;
    };

    el("btnRandom").onclick=()=>{
      const palette=["#d4a574","#5b7c99","#6b8f71","#c45c26","#9aa8b8","#8b6914","#a06bff","#e8590c","#3e4f63","#e0b878"];
      for(const s of slots()){
        const opts=s.folders; state.look[s.id]=opts[Math.floor(Math.random()*opts.length)];
        if(Math.random()<0.7) state.colors[s.id]=palette[Math.floor(Math.random()*palette.length)];
      }
      if(!folderFor("body")) state.look.body="NakedBody";
      state.dirty=true; renderHome();
    };
    el("btnReset").onclick=()=>{
      state.look=defaultLook(state.catalog);
      state.colors=defaultColors();
      state.dirty=true; renderHome();
    };
    el("btnExport").onclick=()=>{
      const payload={pack:"fantasy-cc", look:state.look, colors:state.colors, fps:state.fps, anim:state.anim, dir:state.dir};
      try{ localStorage.setItem("neuro.fantasyLook", JSON.stringify(payload)); }catch(_e){}
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fantasy-look.json"; a.click();
      el("status").textContent="Look sauvé";
    };

    // Swipe horizontal léger sur l’écran zone
    let sx=0;
    const zone=el("screenZone");
    zone.addEventListener("touchstart", e=>{ sx=e.changedTouches[0].clientX; }, {passive:true});
    zone.addEventListener("touchend", e=>{
      const dx=e.changedTouches[0].clientX-sx;
      if(Math.abs(dx)>50) cycleOpt(dx>0?-1:1);
    }, {passive:true});
  }

  async function boot(){
    el("status").textContent="Chargement catalogue…";
    let cat=null;
    for(const u of [BASE_CDN+"catalog.json", BASE_LOCAL+"catalog.json"]){
      try{ const r=await fetch(u,{cache:"no-store",mode:"cors"}); if(r.ok){ cat=await r.json(); break; } }catch(_e){}
    }
    if(!cat){ el("status").textContent="Catalogue introuvable"; return; }
    state.catalog=cat;
    if(cat.weaponAfterShieldRows) weaponAfterShieldRows=cat.weaponAfterShieldRows;
    if(cat.backpackInFrontRows) backpackInFrontRows=cat.backpackInFrontRows;
    if(cat.defaultFps) state.fps=cat.defaultFps|0;
    el("fps").value=String(state.fps);
    state.colors=defaultColors();
    try{
      const raw=localStorage.getItem("neuro.fantasyLook");
      if(raw){
        const o=JSON.parse(raw);
        if(o&&o.look){
          state.look=o.look;
          if(o.colors) state.colors=Object.assign(defaultColors(), o.colors);
          else if(o.skin) state.colors.body=o.skin;
          if(o.fps){ state.fps=o.fps|0; el("fps").value=String(state.fps); }
          if(o.anim) state.anim=o.anim;
        }
      }
    }catch(_e){}
    if(!state.look.body) state.look=defaultLook(cat);
    const anims=(cat.anims&&cat.anims.length)?cat.anims:["Idle","Walk","Attack1"];
    if(!anims.includes(state.anim)) state.anim=anims[0];
    fillAnimSelect(anims);
    bind();
    renderHome();
    state.dirty=true;
    await loadImg(folderFor("body")||"NakedBody","Idle");
    loop();
  }
  boot().catch(e=>{ el("status").textContent="Échec: "+(e.message||e); });
})();
</script>
</body>
</html>
