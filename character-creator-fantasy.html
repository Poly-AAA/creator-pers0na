<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Créateur Fantasy — NEURO-CORE</title>
<style>
  :root{
    --bg:#e8e8e6; --bg2:#f2f2f0; --ink:#6a6a68; --ink2:#9a9a98;
    --line:#b8b8b4; --line2:#d0d0cc; --card:#f7f7f5; --tap:44px;
    --sel:#4a4a48; --accent:#5a5a58;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif; overflow:hidden;
    overscroll-behavior:none}
  .app{height:100%; height:100dvh; max-width:480px; margin:0 auto; display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 55%,#dededc 100%); position:relative}

  /* —— Stage: personnage + callouts —— */
  .stage-wrap{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center}
  canvas#stage{width:min(72vw,300px); height:auto; aspect-ratio:1; image-rendering:pixelated;
    background:transparent; touch-action:none}
  .rot{position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px;
    border:0; background:transparent; color:var(--ink2); font-size:28px; cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center}
  .rot:active{color:var(--sel)}
  .rot.l{left:6px} .rot.r{right:6px}

  /* Callouts */
  .callouts{position:absolute; inset:0; pointer-events:none; z-index:4}
  .callout{position:absolute; pointer-events:auto; display:flex; align-items:center; gap:0; cursor:pointer}
  .callout .lab{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink);
    padding:4px 2px; white-space:nowrap; user-select:none}
  .callout.on .lab{color:var(--sel); font-weight:600}
  .callout .dot{width:5px;height:5px;border-radius:50%;background:var(--line);flex-shrink:0}
  .callout.on .dot{background:var(--sel)}
  .callout svg{position:absolute; overflow:visible; pointer-events:none}

  /* Side rails */
  .rail{position:absolute; top:8%; bottom:8%; width:72px; z-index:6; display:flex; flex-direction:column; gap:4px;
    overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail.left{left:4px; align-items:flex-start}
  .rail.right{right:4px; align-items:flex-end}
  .rail .sec{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); padding:4px 2px}
  .chip{border:0; background:transparent; color:var(--ink); font-size:11px; padding:6px 4px;
    text-align:inherit; cursor:pointer; letter-spacing:.04em; max-width:70px; line-height:1.2}
  .chip.on{color:var(--sel); font-weight:600; text-decoration:underline; text-underline-offset:3px}
  .chip.sm{font-size:10px; opacity:.85}

  /* Bottom: colors + body stack */
  .dock{flex-shrink:0; padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line2); background:rgba(247,247,245,.92); backdrop-filter:blur(8px);
    display:flex; flex-direction:column; gap:8px; max-height:42%; overflow:auto}
  .dock-row{display:flex; align-items:center; gap:8px}
  .dock-row .ttl{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); min-width:52px}
  .swatches{display:flex; flex-wrap:wrap; gap:6px; flex:1}
  .sw{width:28px;height:28px;border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .sw.on{border-color:var(--sel); box-shadow:0 0 0 1px var(--sel)}
  .sw.bw{box-shadow:inset 0 0 0 1px #aaa}

  .body-stack{display:none; flex-direction:column; gap:6px}
  .body-stack.on{display:flex}
  .body-row{display:flex; align-items:center; gap:8px; font-size:12px}
  .body-row select{flex:1; min-height:36px; border:1px solid var(--line2); border-radius:8px;
    background:var(--card); color:var(--ink); font-size:12px; padding:0 8px}
  .body-row input[type=range]{flex:1; accent-color:var(--accent)}
  .body-row .op{min-width:36px; text-align:right; color:var(--ink2); font-size:11px}
  .body-row .rm{width:32px;height:32px;border:0;background:transparent;color:var(--ink2);font-size:18px;cursor:pointer}
  .btn-ghost{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px;
    min-height:36px; padding:0 12px; font-size:12px; cursor:pointer}
  .btn-ghost:active{background:var(--line2)}
  .status{font-size:10px; color:var(--ink2); text-align:center}

  /* Advanced color sheet */
  .sheet{position:fixed; inset:0; z-index:40; background:rgba(40,40,38,.35); display:none;
    align-items:flex-end; justify-content:center}
  .sheet.on{display:flex}
  .sheet-panel{width:min(480px,100%); background:var(--card); border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px}
  .sheet-panel h3{margin:0; font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink)}
  .sheet-panel label{font-size:11px; color:var(--ink2); display:flex; align-items:center; gap:10px}
  .sheet-panel input[type=range]{flex:1; accent-color:var(--accent)}
  .hue-box{height:28px; border-radius:8px; background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .preview-sw{width:48px;height:48px;border-radius:50%; border:1px solid var(--line); margin:0 auto}
  .sheet-actions{display:flex; gap:8px}
  .sheet-actions button{flex:1; min-height:44px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg2); color:var(--ink); font-size:14px; cursor:pointer}
  .sheet-actions .ok{background:var(--sel); color:#f5f5f3; border-color:var(--sel)}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="stageWrap">
    <button type="button" class="rot l" id="dirPrev" aria-label="Tourner gauche">‹</button>
    <canvas id="stage" width="256" height="256" aria-label="Aperçu personnage"></canvas>
    <button type="button" class="rot r" id="dirNext" aria-label="Tourner droite">›</button>
    <div class="callouts" id="callouts"></div>

    <aside class="rail left" id="animRail" aria-label="Animations"></aside>
    <aside class="rail right" id="optRail" aria-label="Options"></aside>
  </div>

  <div class="dock">
    <div class="dock-row">
      <span class="ttl" id="zoneLab">—</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="body-stack" id="bodyStack">
      <div class="dock-row">
        <span class="ttl">Corps</span>
        <button type="button" class="btn-ghost" id="addBody">+ Couche</button>
      </div>
      <div id="bodyRows"></div>
    </div>
    <div class="dock-row" style="justify-content:space-between">
      <button type="button" class="btn-ghost" id="btnRandom">Aléatoire</button>
      <button type="button" class="btn-ghost" id="btnReset">Reset</button>
      <button type="button" class="btn-ghost" id="btnExport">Sauver</button>
    </div>
    <div class="status" id="status">Chargement…</div>
  </div>
</div>

<div class="sheet" id="colorSheet" role="dialog" aria-modal="true">
  <div class="sheet-panel">
    <h3>Couleur avancée</h3>
    <div class="preview-sw" id="advPreview"></div>
    <div class="hue-box"></div>
    <label>Teinte <input type="range" id="advH" min="0" max="360" value="30"/></label>
    <label>Saturation <input type="range" id="advS" min="0" max="100" value="40"/></label>
    <label>Clarté <input type="range" id="advL" min="5" max="95" value="55"/></label>
    <div class="sheet-actions">
      <button type="button" id="advCancel">Annuler</button>
      <button type="button" class="ok" id="advOk">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f89bfa1/assets/packs/fantasy-cc/";
  const FW = 128, FH = 128, COLS = 15;
  const DIR_ROW = [0,1,2,3,4,5,6,7];
  let weaponAfterShieldRows = [true,true,true,false,false,false,false,true];
  let backpackInFrontRows = [true,false,false,false,false,true,true,true];

  /* Callouts: label + slot id + relative anchor on canvas (0–1) */
  const CALLOUTS = [
    {id:"head",     lab:"Hat",   x:0.72, y:0.18, side:"right"},
    {id:"chest",    lab:"Chest", x:0.70, y:0.38, side:"right"},
    {id:"legs",     lab:"Pants", x:0.28, y:0.58, side:"left"},
    {id:"shoes",    lab:"Shoes", x:0.30, y:0.78, side:"left"},
    {id:"backpack", lab:"Back",  x:0.26, y:0.32, side:"left"},
    {id:"weapon",   lab:"Misc",  x:0.74, y:0.52, side:"right"},
    {id:"body",     lab:"Body",  x:0.50, y:0.48, side:"left"},
  ];

  const MISC_SLOTS = ["weapon","offhand","belt","gloves","slash","effect","mount"];

  const PALETTE = [
    // 3 tones × familles + N/B
    "#f5c6aa","#d4a574","#a67c52",
    "#f8d9a0","#e0b878","#b8893a",
    "#f0a090","#c45c26","#7a3010",
    "#f2b8c6","#d4789a","#8a3a58",
    "#b8d4e8","#5b7c99","#2f4a66",
    "#b8e0c8","#6b8f71","#3a5a42",
    "#d4c4e8","#8a70b0","#4a3870",
    "#c8c4bc","#8a8580","#4a4642",
    "#ffffff","#000000",
  ];

  const DEFAULT_COLORS = {
    body:"#d4a574", shoes:"#3a3230", legs:"#3e4f63", chest:"#5b7c99",
    belt:"#8b6914", gloves:"#6a5a4e", offhand:"#6b8f71", weapon:"#9aa8b8",
    backpack:"#7a5c3a", head:"#e0b878", slash:"#e8590c", effect:"#5ec8ff", mount:"#8a7060",
  };

  const state = {
    catalog:null, look:{}, colors:{},
    bodies:[{folder:"NakedBody", opacity:1}],
    anim:"Idle", dir:0, fps:14,
    zoneId:"head",
    cache:new Map(), raf:0, frame:0, lastT:0,
    drawing:false, dirty:true,
  };

  const el = (id)=> document.getElementById(id);
  const stage = el("stage");
  const cx = stage.getContext("2d");
  const tintCv = document.createElement("canvas");
  const tintCx = tintCv.getContext("2d");

  function slots(){ return (state.catalog && state.catalog.slots) || []; }
  function slotById(id){ return slots().find(s=>s.id===id); }
  function folderFor(slotId){
    if(slotId === "body") return null; // bodies handled separately
    const v = state.look[slotId];
    return (!v || v === "None") ? null : v;
  }
  function tintFor(slotId){
    const c = state.colors[slotId];
    if(!c || c === "#ffffff" || c === "#FFFFFF") return null;
    return c;
  }
  function defaultColors(){ return Object.assign({}, DEFAULT_COLORS); }
  function defaultLook(cat){
    const look = {};
    for(const s of cat.slots) look[s.id] = s.required ? (s.folders[0]||"NakedBody") : "None";
    look.body = "NakedBody"; look.chest = "Chest1"; look.legs = "Legs1";
    look.shoes = "Shoes1"; look.head = "Head1"; look.weapon = "Melee1"; look.offhand = "Shield1";
    return look;
  }
  function defaultBodies(){ return [{folder:"NakedBody", opacity:1}]; }

  function urlFor(folder, anim){
    const rel = `spritesheets/${folder}/${anim}.png`;
    return { local: BASE_LOCAL+rel, cdn: BASE_CDN+rel };
  }
  function loadImg(folder, anim){
    const key = folder+"/"+anim;
    if(state.cache.has(key)) return state.cache.get(key);
    const p = new Promise((resolve)=>{
      const urls = urlFor(folder, anim);
      const order = [urls.cdn, urls.local];
      const im = new Image();
      try{ im.crossOrigin="anonymous"; }catch(_e){}
      let i=0;
      const next=()=>{
        if(i>=order.length){ resolve(null); return; }
        im.onload=()=>resolve(im);
        im.onerror=()=>next();
        im.src=order[i++];
      };
      next();
    });
    state.cache.set(key,p);
    return p;
  }

  function layersForRow(row){
    const L=[];
    L.push({folder:(state.catalog.shadowFolder||"Shadow"), tint:null, alpha:1});
    for(const b of state.bodies){
      if(b.folder) L.push({folder:b.folder, tint:tintFor("body"), alpha: Math.max(0, Math.min(1, +b.opacity||1))});
    }
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folderFor(id); if(f) L.push({folder:f, tint:tintFor(id), alpha:1});
    }
    const shield=folderFor("offhand"), weapon=folderFor("weapon"), bag=folderFor("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tintFor("offhand"),alpha:1}); if(weapon) mid.push({folder:weapon,tint:tintFor("weapon"),alpha:1}); }
    else { if(weapon) mid.push({folder:weapon,tint:tintFor("weapon"),alpha:1}); if(shield) mid.push({folder:shield,tint:tintFor("offhand"),alpha:1}); }
    if(bag){ const item={folder:bag,tint:tintFor("backpack"),alpha:1}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folderFor(id); if(f) L.push({folder:f, tint:tintFor(id), alpha:1}); }
    const mount=folderFor("mount"); if(mount) L.unshift({folder:mount, tint:tintFor("mount"), alpha:1});
    return L.filter(x=>x.folder);
  }

  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex,alpha){
    const a = (alpha==null)?1:alpha;
    cx.save();
    cx.globalAlpha = a;
    if(!tintHex){ cx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); cx.restore(); return; }
    const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
    if(tintCv.width!==tw) tintCv.width=tw;
    if(tintCv.height!==th) tintCv.height=th;
    const t=tintCx;
    t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation="source-over"; t.globalAlpha=1;
    t.clearRect(0,0,tw,th); t.imageSmoothingEnabled=false;
    t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,tw,th);
    t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="source-over";
    cx.drawImage(tintCv,dx,dy);
    cx.restore();
  }

  async function draw(){
    if(!state.catalog) return;
    const row=DIR_ROW[state.dir|0]|0;
    const fps=Math.max(1,state.fps|0);
    const interval=1000/fps;
    const now=performance.now();
    let advanced=false;
    if(now-state.lastT>interval){
      const steps=Math.floor((now-state.lastT)/interval);
      state.frame=(state.frame+steps)%COLS;
      state.lastT+=steps*interval;
      if(now-state.lastT>interval*2) state.lastT=now;
      advanced=true;
    }
    if(!advanced && !state.dirty) return;
    state.dirty=false;
    const col=state.frame, anim=state.anim;
    const W=stage.width, H=stage.height;
    cx.clearRect(0,0,W,H);
    // soft ground disc (réf. épurée)
    const gx=W/2, gy=H*0.78;
    const grd=cx.createRadialGradient(gx,gy,4,gx,gy,78);
    grd.addColorStop(0,"rgba(0,0,0,.10)");
    grd.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=grd; cx.beginPath(); cx.ellipse(gx,gy,72,18,0,0,Math.PI*2); cx.fill();

    const layers=layersForRow(row);
    const imgs=await Promise.all(layers.map(L=>loadImg(L.folder,anim)));
    if(state.anim!==anim){ state.dirty=true; return; }
    const scale=1.55, dw=FW*scale, dh=FH*scale, foot=110;
    const ox=W/2, oy=H/2+28;
    const dx=ox-dw/2, dy=oy+4-foot*scale;
    cx.imageSmoothingEnabled=false;
    let missing=0;
    for(let i=0;i<layers.length;i++){
      const im=imgs[i];
      if(!im||!im.naturalWidth){ missing++; continue; }
      try{ tintDraw(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh,layers[i].tint,layers[i].alpha); }
      catch(_e){ try{ cx.globalAlpha=layers[i].alpha||1; cx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); cx.globalAlpha=1; }catch(__e){ missing++; } }
    }
    el("status").textContent=`${anim} · dir ${state.dir}`+(missing?` · ${missing} manq.`:"");
    layoutCallouts();
  }
  function loop(){
    if(!state.drawing){
      state.drawing=true;
      draw().catch(e=>{ el("status").textContent="Erreur: "+(e.message||e); })
        .finally(()=>{ state.drawing=false; });
    }
    state.raf=requestAnimationFrame(loop);
  }

  /* —— Callouts —— */
  function layoutCallouts(){
    const wrap=el("stageWrap");
    const box=stage.getBoundingClientRect();
    const wr=wrap.getBoundingClientRect();
    const host=el("callouts");
    host.innerHTML="";
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width", String(wr.width));
    svg.setAttribute("height", String(wr.height));
    svg.style.cssText="position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none";
    host.appendChild(svg);
    CALLOUTS.forEach(c=>{
      const ax = box.left - wr.left + c.x * box.width;
      const ay = box.top - wr.top + c.y * box.height;
      const labLeft = c.side === "left";
      const labelW = 52;
      const lx = labLeft ? Math.max(4, ax - 88) : Math.min(wr.width - labelW - 4, ax + 36);
      const ly = ay;
      const line=document.createElementNS("http://www.w3.org/2000/svg","line");
      const x1 = labLeft ? lx + labelW : lx;
      line.setAttribute("x1", String(x1));
      line.setAttribute("y1", String(ly));
      line.setAttribute("x2", String(ax));
      line.setAttribute("y2", String(ay));
      line.setAttribute("stroke", state.zoneId===c.id ? "#4a4a48" : "#b8b8b4");
      line.setAttribute("stroke-width", "1");
      svg.appendChild(line);
      const pin=document.createElementNS("http://www.w3.org/2000/svg","circle");
      pin.setAttribute("cx", String(ax)); pin.setAttribute("cy", String(ay));
      pin.setAttribute("r", "2.5");
      pin.setAttribute("fill", state.zoneId===c.id ? "#4a4a48" : "#b8b8b4");
      svg.appendChild(pin);
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="callout"+(state.zoneId===c.id?" on":"");
      btn.style.left = lx + "px";
      btn.style.top = (ly - 11) + "px";
      const span=document.createElement("span");
      span.className="lab"; span.textContent=c.lab;
      btn.appendChild(span);
      btn.onclick=()=> selectZone(c.id);
      host.appendChild(btn);
    });
  }

  function selectZone(id){
    state.zoneId = id;
    el("zoneLab").textContent = (CALLOUTS.find(c=>c.id===id)||{lab:id}).lab;
    el("bodyStack").classList.toggle("on", id==="body");
    renderOpts();
    renderSwatches();
    renderBodies();
    layoutCallouts();
  }

  /* —— Rails —— */
  function renderAnims(){
    const rail=el("animRail"); rail.innerHTML="";
    const sec=document.createElement("div"); sec.className="sec"; sec.textContent="Anim";
    rail.appendChild(sec);
    const anims=(state.catalog.anims&&state.catalog.anims.length)?state.catalog.anims:["Idle","Walk","Attack1"];
    anims.forEach(a=>{
      const b=document.createElement("button");
      b.type="button"; b.className="chip"+(a===state.anim?" on":"");
      b.textContent=a;
      b.onclick=()=>{ state.anim=a; state.frame=0; state.dirty=true; renderAnims(); };
      rail.appendChild(b);
    });
  }

  function currentOptList(){
    const id=state.zoneId;
    if(id==="body"){
      return (slotById("body")||{folders:[]}).folders.filter(f=>f!=="None");
    }
    if(id==="weapon"){
      // Misc: show sub-slots as chips that switch zone, plus weapon folders
      return null;
    }
    const s=slotById(id);
    return s ? (s.folders||[]) : [];
  }

  function renderOpts(){
    const rail=el("optRail"); rail.innerHTML="";
    const sec=document.createElement("div"); sec.className="sec"; sec.textContent="Choix";
    rail.appendChild(sec);

    if(state.zoneId==="weapon"){
      MISC_SLOTS.forEach(sid=>{
        const s=slotById(sid); if(!s) return;
        const b=document.createElement("button");
        b.type="button"; b.className="chip sm"+(state._miscFocus===sid?" on":"");
        b.textContent=s.lab.split("/")[0].trim();
        b.onclick=()=>{ state._miscFocus=sid; renderMiscOpts(sid); };
        rail.appendChild(b);
      });
      renderMiscOpts(state._miscFocus || "weapon");
      return;
    }

    if(state.zoneId==="body"){
      const tip=document.createElement("div");
      tip.className="chip sm"; tip.style.cursor="default";
      tip.textContent="Couches ↓";
      rail.appendChild(tip);
      return;
    }

    const opts=currentOptList()||[];
    const cur=state.look[state.zoneId];
    opts.forEach(name=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="chip"+(name===cur?" on":"");
      b.textContent = name==="None" ? "Aucun" : name.replace(/^(Head|Chest|Legs|Shoes|Belt|Hands|Weapon|Shield|Backpack|Melee|Bow|Staff|Mount|Effect|Slash)_?/i, "") || name;
      b.title=name;
      b.onclick=()=>{
        state.look[state.zoneId]=name;
        state.dirty=true;
        renderOpts();
      };
      rail.appendChild(b);
    });
  }

  function renderMiscOpts(sid){
    // append folders under misc chips
    const rail=el("optRail");
    [...rail.querySelectorAll("[data-misc-opt]")].forEach(n=>n.remove());
    const s=slotById(sid); if(!s) return;
    const cur=state.look[sid];
    (s.folders||[]).forEach(name=>{
      const b=document.createElement("button");
      b.type="button"; b.dataset.miscOpt="1";
      b.className="chip sm"+(name===cur?" on":"");
      b.textContent = name==="None" ? "∅" : name.slice(0,10);
      b.onclick=()=>{ state.look[sid]=name; state.dirty=true; renderMiscOpts(sid); };
      rail.appendChild(b);
    });
  }

  /* —— Colors —— */
  function renderSwatches(){
    const host=el("swatches"); host.innerHTML="";
    const cur=(state.colors[state.zoneId]||"").toLowerCase();
    PALETTE.forEach(hex=>{
      const b=document.createElement("button");
      b.type="button"; b.className="sw"+(hex==="#ffffff"||hex==="#000000"?" bw":"")+(cur===hex.toLowerCase()?" on":"");
      b.style.background=hex;
      b.title=hex;
      let timer=null, long=false;
      const start=()=>{ long=false; timer=setTimeout(()=>{ long=true; openColorSheet(hex); }, 480); };
      const end=()=>{
        clearTimeout(timer);
        if(!long){
          state.colors[state.zoneId]=hex;
          state.dirty=true;
          renderSwatches();
        }
      };
      b.addEventListener("pointerdown", start);
      b.addEventListener("pointerup", end);
      b.addEventListener("pointerleave", ()=> clearTimeout(timer));
      b.addEventListener("pointercancel", ()=> clearTimeout(timer));
      host.appendChild(b);
    });
  }

  function hslToHex(h,s,l){
    s/=100; l/=100;
    const a=s*Math.min(l,1-l);
    const f=n=>{
      const k=(n+h/30)%12;
      const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);
      return Math.round(255*c).toString(16).padStart(2,"0");
    };
    return "#"+f(0)+f(8)+f(4);
  }
  function hexToHsl(hex){
    let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h=0,s=0,l=(max+min)/2;
    if(max!==min){
      const d=max-min;
      s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){
        case r: h=((g-b)/d+(g<b?6:0)); break;
        case g: h=(b-r)/d+2; break;
        default: h=(r-g)/d+4;
      }
      h*=60;
    }
    return {h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100)};
  }

  let advTarget=null;
  function syncAdv(){
    const h=+el("advH").value, s=+el("advS").value, l=+el("advL").value;
    const hex=hslToHex(h,s,l);
    el("advPreview").style.background=hex;
    advTarget=hex;
  }
  function openColorSheet(fromHex){
    const hsl=hexToHsl(fromHex||state.colors[state.zoneId]||"#888888");
    el("advH").value=hsl.h; el("advS").value=hsl.s; el("advL").value=hsl.l;
    syncAdv();
    el("colorSheet").classList.add("on");
  }
  function closeColorSheet(apply){
    el("colorSheet").classList.remove("on");
    if(apply && advTarget){
      state.colors[state.zoneId]=advTarget;
      state.dirty=true;
      renderSwatches();
    }
  }

  /* —— Body stack —— */
  function renderBodies(){
    const host=el("bodyRows"); if(!host) return;
    host.innerHTML="";
    const folders=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
    state.bodies.forEach((b, idx)=>{
      const row=document.createElement("div");
      row.className="body-row";
      const sel=document.createElement("select");
      folders.forEach(f=>{
        const o=document.createElement("option"); o.value=f; o.textContent=f; if(f===b.folder) o.selected=true;
        sel.appendChild(o);
      });
      sel.onchange=()=>{ state.bodies[idx].folder=sel.value; state.look.body=state.bodies[0].folder; state.dirty=true; };
      const range=document.createElement("input");
      range.type="range"; range.min="0"; range.max="100"; range.value=String(Math.round((b.opacity||1)*100));
      const op=document.createElement("span"); op.className="op"; op.textContent=range.value+"%";
      range.oninput=()=>{
        state.bodies[idx].opacity=(+range.value)/100;
        op.textContent=range.value+"%";
        state.dirty=true;
      };
      const rm=document.createElement("button");
      rm.type="button"; rm.className="rm"; rm.textContent="×"; rm.title="Retirer";
      rm.disabled=state.bodies.length<=1;
      rm.onclick=()=>{
        if(state.bodies.length<=1) return;
        state.bodies.splice(idx,1);
        state.look.body=state.bodies[0].folder;
        renderBodies(); state.dirty=true;
      };
      row.appendChild(sel); row.appendChild(range); row.appendChild(op); row.appendChild(rm);
      host.appendChild(row);
    });
  }

  function bind(){
    el("dirPrev").onclick=()=>{ state.dir=(state.dir+7)%8; state.dirty=true; };
    el("dirNext").onclick=()=>{ state.dir=(state.dir+1)%8; state.dirty=true; };
    el("advH").oninput=syncAdv; el("advS").oninput=syncAdv; el("advL").oninput=syncAdv;
    el("advCancel").onclick=()=>closeColorSheet(false);
    el("advOk").onclick=()=>closeColorSheet(true);
    el("colorSheet").addEventListener("click", e=>{ if(e.target.id==="colorSheet") closeColorSheet(false); });

    el("addBody").onclick=()=>{
      const folders=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
      const next=folders[(state.bodies.length)%folders.length]||"NakedBody";
      state.bodies.push({folder:next, opacity:0.55});
      renderBodies(); state.dirty=true;
    };

    el("btnRandom").onclick=()=>{
      const palette=PALETTE.slice(0,-2);
      for(const s of slots()){
        if(s.id==="body") continue;
        const opts=s.folders; state.look[s.id]=opts[Math.floor(Math.random()*opts.length)];
        if(Math.random()<0.7) state.colors[s.id]=palette[Math.floor(Math.random()*palette.length)];
      }
      const bf=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
      state.bodies=[{folder:bf[Math.floor(Math.random()*bf.length)]||"NakedBody", opacity:1}];
      if(Math.random()<0.4 && bf.length>1){
        let f2=bf[Math.floor(Math.random()*bf.length)];
        if(f2===state.bodies[0].folder) f2=bf[(bf.indexOf(f2)+1)%bf.length];
        state.bodies.push({folder:f2, opacity:0.45+Math.random()*0.4});
      }
      state.look.body=state.bodies[0].folder;
      state.dirty=true; renderOpts(); renderSwatches(); renderBodies();
    };
    el("btnReset").onclick=()=>{
      state.look=defaultLook(state.catalog);
      state.colors=defaultColors();
      state.bodies=defaultBodies();
      state.dirty=true; renderOpts(); renderSwatches(); renderBodies();
    };
    el("btnExport").onclick=()=>{
      const payload={
        pack:"fantasy-cc", look:state.look, colors:state.colors,
        bodies:state.bodies, fps:state.fps, anim:state.anim, dir:state.dir
      };
      try{ localStorage.setItem("neuro.fantasyLook", JSON.stringify(payload)); }catch(_e){}
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="fantasy-look.json"; a.click();
      el("status").textContent="Look sauvé";
    };

    window.addEventListener("resize", ()=> layoutCallouts());
  }

  async function boot(){
    el("status").textContent="Chargement catalogue…";
    let cat=null;
    for(const u of [BASE_CDN+"catalog.json", BASE_LOCAL+"catalog.json"]){
      try{ const r=await fetch(u,{cache:"no-store",mode:"cors"}); if(r.ok){ cat=await r.json(); break; } }catch(_e){}
    }
    if(!cat){ el("status").textContent="Catalogue introuvable"; return; }
    state.catalog=cat;
    if(cat.weaponAfterShieldRows) weaponAfterShieldRows=cat.weaponAfterShieldRows;
    if(cat.backpackInFrontRows) backpackInFrontRows=cat.backpackInFrontRows;
    if(cat.defaultFps) state.fps=cat.defaultFps|0;
    state.colors=defaultColors();
    try{
      const raw=localStorage.getItem("neuro.fantasyLook");
      if(raw){
        const o=JSON.parse(raw);
        if(o&&o.look){
          state.look=o.look;
          if(o.colors) state.colors=Object.assign(defaultColors(), o.colors);
          else if(o.skin) state.colors.body=o.skin;
          if(o.bodies && Array.isArray(o.bodies) && o.bodies.length) state.bodies=o.bodies;
          else if(o.look.body) state.bodies=[{folder:o.look.body, opacity:1}];
          if(o.fps) state.fps=o.fps|0;
          if(o.anim) state.anim=o.anim;
        }
      }
    }catch(_e){}
    if(!state.look.body) state.look=defaultLook(cat);
    if(!state.bodies.length) state.bodies=defaultBodies();
    const anims=(cat.anims&&cat.anims.length)?cat.anims:["Idle","Walk","Attack1"];
    if(!anims.includes(state.anim)) state.anim=anims[0];
    bind();
    renderAnims();
    selectZone("head");
    state.dirty=true;
    await loadImg(state.bodies[0].folder||"NakedBody","Idle");
    loop();
  }
  boot().catch(e=>{ el("status").textContent="Échec: "+(e.message||e); });
})();
</script>
