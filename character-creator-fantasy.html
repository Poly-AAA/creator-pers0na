<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Créateur Fantasy — NEURO-CORE</title>
<style>
  :root{
    --bg:#ecece8; --bg2:#f5f5f2; --ink:#555552; --ink2:#8e8e8a;
    --line:#c6c6c2; --line2:#dcdcd8; --card:#fafaf8; --tap:48px;
    --sel:#3d3d3a; --soft:#f0f0ec; --side:132px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.35 Helvetica,Arial,sans-serif; overflow:hidden; overscroll-behavior:none}
  .app{
    height:100%;height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:row;
    background:linear-gradient(180deg,var(--bg2),var(--bg) 60%,#e2e2de);
  }

  /* Menu gauche (ex-bas) */
  .dock{
    width:var(--side);flex-shrink:0;display:flex;flex-direction:column;gap:8px;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    background:rgba(250,250,248,.96);border-right:1px solid var(--line2);
    overflow:auto;min-height:0;
  }
  .dock .sec{display:flex;flex-direction:column;gap:6px}
  .dock .ttl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  .step-row{display:flex;align-items:center;gap:4px}
  .step-row .nav{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--soft);
    color:var(--sel);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;
  }
  .step-row .nav:active{background:var(--sel);color:#fff}
  .step-row .val{
    flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .swatches{display:flex;flex-wrap:wrap;gap:3px}
  .sw{width:16px;height:16px;border-radius:50%;border:1.5px solid transparent;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .sw.on{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
  .sw.bw{box-shadow:inset 0 0 0 1px #999}
  .btn{
    width:100%;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;font-size:12px;cursor:pointer;padding:6px 4px;
  }
  .btn.primary{background:var(--sel);color:#fff;border-color:var(--sel)}
  .btn.ghost{min-height:36px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .status{font-size:10px;color:var(--ink2);text-align:center;line-height:1.25}
  .size-row{display:flex;align-items:center;gap:4px}
  .size-row input{flex:1;accent-color:var(--sel);min-width:0}
  .size-row span{font-size:11px;color:var(--ink2);width:2.6em;text-align:right}

  .body-stack{display:none;flex-direction:column;gap:6px}
  .body-stack.on{display:flex}
  .body-hint{font-size:10px;color:var(--ink2);line-height:1.25;margin:0}
  .body-row{
    display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid var(--line2);
    border-radius:10px;background:var(--card);
  }
  .body-row.on{border-color:var(--sel)}
  .body-row .top{display:flex;align-items:center;gap:4px}
  .body-row .idx{font-size:10px;color:var(--ink2);width:14px}
  .body-row .name{flex:1;font-size:11px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .body-row .ops{display:flex;gap:2px}
  .body-row .ops button,.body-row .sw-mini{
    width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);
    color:var(--ink);font-size:12px;cursor:pointer;padding:0;
  }
  .body-row .sw-mini{border-radius:50%}
  .body-row input[type=range]{width:100%;accent-color:var(--sel)}

  /* Zone perso */
  .stage{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
  canvas#stage{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}

  /* Onglets parties — colonne droite, tête → pieds */
  .zones{
    position:absolute;top:10%;right:6px;bottom:22%;z-index:4;
    display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;
    width:72px;pointer-events:none;
  }
  .zones .callout{
    pointer-events:auto;border:1px solid var(--line);background:rgba(250,250,248,.94);color:var(--ink);
    padding:7px 6px;border-radius:8px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;
    font-size:10px;min-height:34px;text-align:center;line-height:1.2;
  }
  .zones .callout.on{background:var(--sel);color:#fff;border-color:var(--sel);font-weight:600}

  .rot{
    position:absolute;z-index:6;width:var(--tap);height:var(--tap);border-radius:50%;
    border:1.5px solid var(--line);background:var(--card);color:var(--sel);
    font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);padding:0;
  }
  .rot:active{background:var(--sel);color:#fff}

  .sheet{position:fixed;inset:0;z-index:40;background:rgba(40,40,38,.35);display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet-panel{width:min(430px,100%);background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .sheet-panel h3{margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  .sheet-panel label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}
  .sheet-panel input[type=range]{flex:1;accent-color:var(--sel)}
  .preview-sw{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);margin:0 auto}
  .sheet-actions{display:flex;gap:10px}
  .sheet-actions button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:15px}
  .sheet-actions .ok{background:var(--sel);color:#fff;border-color:var(--sel)}
</style>
</head>
<body>
<div class="app">
  <aside class="dock" id="dock">
    <div class="sec">
      <span class="ttl">Anim</span>
      <div class="step-row">
        <button type="button" class="nav" id="animPrev" aria-label="Anim précédente">‹</button>
        <span class="val" id="animVal">Idle</span>
        <button type="button" class="nav" id="animNext" aria-label="Anim suivante">›</button>
      </div>
    </div>
    <div class="sec">
      <span class="ttl">Choix</span>
      <div class="step-row">
        <button type="button" class="nav" id="optPrev" aria-label="Choix précédent">‹</button>
        <span class="val" id="optVal" title="Extra : taper pour sous-slot">—</span>
        <button type="button" class="nav" id="optNext" aria-label="Choix suivant">›</button>
      </div>
      <button type="button" class="btn ghost" id="btnClear">Aucun</button>
    </div>
    <div class="sec">
      <span class="ttl">Taille</span>
      <div class="size-row">
        <input type="range" id="charSize" min="55" max="110" value="98" step="1"/>
        <span id="charSizeVal">98%</span>
      </div>
    </div>
    <div class="sec">
      <span class="ttl">Couleur</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="body-stack" id="bodyStack">
      <span class="ttl">Corps</span>
      <button type="button" class="btn" id="addBody">+ Couche</button>
      <p class="body-hint">Couche · ↑↓ ordre · couleur</p>
      <div id="bodyRows"></div>
    </div>
    <div class="sec" style="margin-top:auto">
      <button type="button" class="btn" id="btnRandom">Aléatoire</button>
      <button type="button" class="btn" id="btnReset">Reset</button>
      <button type="button" class="btn primary" id="btnExport">Sauver</button>
      <div class="status" id="status">Chargement…</div>
    </div>
  </aside>

  <section class="stage" id="stageWrap">
    <canvas id="stage" width="280" height="520" aria-label="Personnage"></canvas>
    <div class="zones" id="callouts"></div>
    <button type="button" class="rot" id="dirPrev" aria-label="Tourner gauche">‹</button>
    <button type="button" class="rot" id="dirNext" aria-label="Tourner droite">›</button>
  </section>
</div>

<div class="sheet" id="colorSheet" role="dialog" aria-modal="true">
  <div class="sheet-panel">
    <h3>Couleur avancée</h3>
    <div class="preview-sw" id="advPreview"></div>
    <label>Teinte <input type="range" id="advH" min="0" max="360" value="30"/></label>
    <label>Saturation <input type="range" id="advS" min="0" max="100" value="40"/></label>
    <label>Clarté <input type="range" id="advL" min="5" max="95" value="55"/></label>
    <div class="sheet-actions">
      <button type="button" id="advCancel">Annuler</button>
      <button type="button" class="ok" id="advOk">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f89bfa1/assets/packs/fantasy-cc/";
  const FW=128, FH=128, COLS=15;
  const DIR_ROW=[0,1,2,3,4,5,6,7];
  let weaponAfterShieldRows=[true,true,true,false,false,false,false,true];
  let backpackInFrontRows=[true,false,false,false,false,true,true,true];

  /* Layout épuré : perso haut, ombre, rot dessous ; zones à droite tête→pieds ; menu à gauche */
  const LAY = {
    char:{ xPct:40, yPct:40, sizePct:0.98 },
    shadow:{ xPct:40, yPct:60, wPct:0.55, hPct:0.085, opacity:0.07 },
    zonesLab:{
      head:"Tête", chest:"Torse", backpack:"Sac", body:"Corps",
      legs:"Jambes", shoes:"Chauss.", weapon:"Extra",
    },
    rot:{ yPct:82, gapPct:20, size:48 } // sous le perso, centrées sur x char
  };

  /* Ordre anatomique haut → bas */
  const ZONE_ORDER = ["head","chest","backpack","body","legs","shoes","weapon"];
  const MISC_SLOTS = ["weapon","offhand","belt","gloves","slash","effect","mount"];
  const PALETTE = [
    "#f5c6aa","#d4a574","#a67c52","#f8d9a0","#e0b878","#b8893a",
    "#f0a090","#c45c26","#7a3010","#f2b8c6","#d4789a","#8a3a58",
    "#b8d4e8","#5b7c99","#2f4a66","#b8e0c8","#6b8f71","#3a5a42",
    "#d4c4e8","#8a70b0","#4a3870","#c8c4bc","#8a8580","#4a4642",
    "#ffffff","#000000",
  ];
  const DEFAULT_COLORS = {
    body:"#d4a574", shoes:"#3a3230", legs:"#3e4f63", chest:"#5b7c99",
    belt:"#8b6914", gloves:"#6a5a4e", offhand:"#6b8f71", weapon:"#9aa8b8",
    backpack:"#7a5c3a", head:"#e0b878", slash:"#e8590c", effect:"#5ec8ff", mount:"#8a7060",
  };

  const state = {
    catalog:null, look:{}, colors:{},
    bodies:[{folder:"NakedBody", opacity:1, color:"#d4a574"}],
    bodyFocus:0,
    anim:"Idle", dir:0, fps:14,
    zoneId:"head", _miscFocus:"weapon",
    lastEdited:null,
    charSizePct: 0.98,
    cache:new Map(), raf:0, frame:0, lastT:0,
    drawing:false, dirty:true, drawRect:null,
  };

  const el = (id)=> document.getElementById(id);
  const stage = el("stage");
  const cx = stage.getContext("2d");
  const tintCv = document.createElement("canvas");
  const tintCx = tintCv.getContext("2d");

  function slots(){ return (state.catalog && state.catalog.slots) || []; }
  function slotById(id){ return slots().find(s=>s.id===id); }
  function folderFor(slotId){
    if(slotId==="body") return null;
    const v=state.look[slotId];
    return (!v||v==="None")?null:v;
  }
  function tintForSlot(slotId){
    const c=state.colors[slotId];
    if(!c||c==="#ffffff"||c==="#FFFFFF") return null;
    return c;
  }
  function defaultColors(){ return Object.assign({}, DEFAULT_COLORS); }
  function defaultLook(cat){
    const look={};
    for(const s of cat.slots) look[s.id]=s.required?(s.folders[0]||"NakedBody"):"None";
    look.body="NakedBody"; look.chest="Chest1"; look.legs="Legs1";
    look.shoes="Shoes1"; look.head="Head1"; look.weapon="Melee1"; look.offhand="Shield1";
    return look;
  }
  function shortOpt(name){
    if(!name||name==="None") return "Aucun";
    return name.replace(/^(Head|Chest|Legs|Shoes|Belt|Hands|Weapon|Shield|Backpack|Melee|Bow|Staff|Mount|Effect|Slash|NakedBody)_?/i,"")||name;
  }
  function markEdited(key){ state.lastEdited=key; }

  function loadImg(folder, anim){
    const key=folder+"/"+anim;
    if(state.cache.has(key)) return state.cache.get(key);
    const p=new Promise((resolve)=>{
      const rel=`spritesheets/${folder}/${anim}.png`;
      const urls=[BASE_CDN+rel, BASE_LOCAL+rel];
      const im=new Image(); try{ im.crossOrigin="anonymous"; }catch(_e){}
      let i=0;
      const next=()=>{
        if(i>=urls.length){ resolve(null); return; }
        im.onload=()=>resolve(im); im.onerror=()=>next(); im.src=urls[i++];
      };
      next();
    });
    state.cache.set(key,p); return p;
  }

  function layersForRow(row){
    const L=[];
    L.push({folder:(state.catalog.shadowFolder||"Shadow"), tint:null, alpha:1});
    for(const b of state.bodies){
      if(!b.folder) continue;
      const tint=(!b.color||b.color==="#ffffff"||b.color==="#FFFFFF")?null:b.color;
      L.push({folder:b.folder, tint, alpha:Math.max(0,Math.min(1,+b.opacity||1))});
    }
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folderFor(id); if(f) L.push({folder:f, tint:tintForSlot(id), alpha:1});
    }
    const shield=folderFor("offhand"), weapon=folderFor("weapon"), bag=folderFor("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tintForSlot("offhand"),alpha:1}); if(weapon) mid.push({folder:weapon,tint:tintForSlot("weapon"),alpha:1}); }
    else { if(weapon) mid.push({folder:weapon,tint:tintForSlot("weapon"),alpha:1}); if(shield) mid.push({folder:shield,tint:tintForSlot("offhand"),alpha:1}); }
    if(bag){ const item={folder:bag,tint:tintForSlot("backpack"),alpha:1}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folderFor(id); if(f) L.push({folder:f, tint:tintForSlot(id), alpha:1}); }
    const mount=folderFor("mount"); if(mount) L.unshift({folder:mount, tint:tintForSlot("mount"), alpha:1});
    return L.filter(x=>x.folder);
  }

  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex,alpha){
    const a=(alpha==null)?1:alpha;
    cx.save(); cx.globalAlpha=a;
    if(!tintHex){ cx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); cx.restore(); return; }
    const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
    if(tintCv.width!==tw) tintCv.width=tw;
    if(tintCv.height!==th) tintCv.height=th;
    const t=tintCx;
    t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation="source-over"; t.globalAlpha=1;
    t.clearRect(0,0,tw,th); t.imageSmoothingEnabled=false;
    t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,tw,th);
    t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="source-over";
    cx.drawImage(tintCv,dx,dy); cx.restore();
  }

  function fitCanvas(){
    const wrap=el("stageWrap");
    const r=wrap.getBoundingClientRect();
    const w=Math.max(160, Math.round(r.width));
    const h=Math.max(200, Math.round(r.height));
    if(stage.width!==w || stage.height!==h){ stage.width=w; stage.height=h; state.dirty=true; }
  }

  function layoutChrome(){
    /* Pas de lignes — onglets droite gérés en flex CSS. Flèches sous le perso. */
    const host=el("callouts");
    if(!host.dataset.ready){
      host.innerHTML="";
      ZONE_ORDER.forEach(id=>{
        const btn=document.createElement("button");
        btn.type="button"; btn.className="callout"; btn.dataset.zone=id;
        btn.textContent=LAY.zonesLab[id]||id;
        btn.onclick=()=>selectZone(id);
        host.appendChild(btn);
      });
      host.dataset.ready="1";
    }
    host.querySelectorAll(".callout").forEach(btn=>{
      btn.classList.toggle("on", btn.dataset.zone===state.zoneId);
    });

    const s=LAY.rot.size;
    const cxPct=LAY.char.xPct;
    const y=LAY.rot.yPct;
    const gap=LAY.rot.gapPct;
    const rp=el("dirPrev"), rn=el("dirNext");
    rp.style.width=s+"px"; rp.style.height=s+"px";
    rn.style.width=s+"px"; rn.style.height=s+"px";
    rp.style.left=(cxPct-gap)+"%"; rp.style.top=y+"%";
    rn.style.left=(cxPct+gap)+"%"; rn.style.top=y+"%";
    rp.style.marginLeft=(-s/2)+"px"; rp.style.marginTop=(-s/2)+"px";
    rn.style.marginLeft=(-s/2)+"px"; rn.style.marginTop=(-s/2)+"px";
  }

  async function draw(){
    if(!state.catalog) return;
    fitCanvas();
    const row=DIR_ROW[state.dir|0]|0;
    const fps=Math.max(1,state.fps|0);
    const interval=1000/fps;
    const now=performance.now();
    let advanced=false;
    if(now-state.lastT>interval){
      const steps=Math.floor((now-state.lastT)/interval);
      state.frame=(state.frame+steps)%COLS;
      state.lastT+=steps*interval;
      if(now-state.lastT>interval*2) state.lastT=now;
      advanced=true;
    }
    if(!advanced && !state.dirty) return;
    state.dirty=false;
    const col=state.frame, anim=state.anim;
    const W=stage.width, H=stage.height;
    cx.clearRect(0,0,W,H);

    const charSize=W*(state.charSizePct||LAY.char.sizePct);
    const scale=charSize/FW;
    const dw=FW*scale, dh=FH*scale;
    const ox=W*(LAY.char.xPct/100), oy=H*(LAY.char.yPct/100);
    const dx=ox-dw/2, dy=oy-dh/2;
    const shX=W*(LAY.shadow.xPct/100), shY=H*(LAY.shadow.yPct/100);
    const shRx=(W*LAY.shadow.wPct)/2, shRy=(H*LAY.shadow.hPct)/2;
    state.drawRect={dx,dy,dw,dh,scale};

    const grd=cx.createRadialGradient(shX,shY,1,shX,shY,Math.max(shRx,shRy));
    grd.addColorStop(0,`rgba(0,0,0,${LAY.shadow.opacity})`);
    grd.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=grd; cx.beginPath(); cx.ellipse(shX,shY,shRx,shRy,0,0,Math.PI*2); cx.fill();

    const layers=layersForRow(row);
    const imgs=await Promise.all(layers.map(L=>loadImg(L.folder,anim)));
    if(state.anim!==anim){ state.dirty=true; return; }
    cx.imageSmoothingEnabled=false;
    let missing=0;
    for(let i=0;i<layers.length;i++){
      const im=imgs[i];
      if(!im||!im.naturalWidth){ missing++; continue; }
      try{ tintDraw(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh,layers[i].tint,layers[i].alpha); }
      catch(_e){ try{ cx.globalAlpha=layers[i].alpha||1; cx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); cx.globalAlpha=1; }catch(__e){ missing++; } }
    }
    el("status").textContent=`${anim} · ${state.dir+1}/8`+(missing?` · ${missing}∅`:"");
    layoutChrome();
  }
  function loop(){
    if(!state.drawing){
      state.drawing=true;
      draw().catch(e=>{ el("status").textContent="Erreur: "+(e.message||e); })
        .finally(()=>{ state.drawing=false; });
    }
    state.raf=requestAnimationFrame(loop);
  }

  function selectZone(id){
    state.zoneId=id;
    if(id==="body") state.bodyFocus=Math.min(state.bodyFocus, Math.max(0,state.bodies.length-1));
    el("bodyStack").classList.toggle("on", id==="body");
    syncSteppers(); renderSwatches(); renderBodies(); layoutChrome();
    state.dirty=true;
  }

  function activeSlotId(){
    if(state.zoneId==="weapon") return state._miscFocus||"weapon";
    return state.zoneId;
  }
  function optionList(){
    if(state.zoneId==="body") return ((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
    if(state.zoneId==="weapon"){ const s=slotById(state._miscFocus||"weapon"); return (s&&s.folders)||["None"]; }
    const s=slotById(state.zoneId); return (s&&s.folders)||["None"];
  }
  function currentOption(){
    if(state.zoneId==="body"){ const b=state.bodies[state.bodyFocus|0]; return (b&&b.folder)||"NakedBody"; }
    return state.look[activeSlotId()]||"None";
  }
  function setOption(name){
    if(state.zoneId==="body"){
      const i=state.bodyFocus|0; if(!state.bodies[i]) return;
      state.bodies[i].folder=name; state.look.body=state.bodies[0].folder; markEdited("body:"+i);
    } else {
      const sid=activeSlotId(); state.look[sid]=name; markEdited(sid);
    }
    state.dirty=true; syncSteppers(); renderBodies();
  }
  function cycleOption(dir){
    const list=optionList(); if(!list.length) return;
    let i=list.indexOf(currentOption()); if(i<0) i=0;
    i=(i+dir+list.length)%list.length; setOption(list[i]);
  }
  function cycleMiscSlot(dir){
    let i=MISC_SLOTS.indexOf(state._miscFocus||"weapon"); if(i<0) i=0;
    i=(i+dir+MISC_SLOTS.length)%MISC_SLOTS.length;
    state._miscFocus=MISC_SLOTS[i]; syncSteppers(); renderSwatches();
  }
  function cycleAnim(dir){
    const anims=(state.catalog.anims&&state.catalog.anims.length)?state.catalog.anims:["Idle","Walk","Attack1"];
    let i=anims.indexOf(state.anim); if(i<0) i=0;
    i=(i+dir+anims.length)%anims.length;
    state.anim=anims[i]; state.frame=0; state.dirty=true; syncSteppers();
  }

  function syncSteppers(){
    el("animVal").textContent=state.anim||"—";
    if(state.zoneId==="weapon"){
      const s=slotById(state._miscFocus||"weapon");
      const sub=(s&&s.lab)?s.lab.split("/")[0].trim():(state._miscFocus||"");
      el("optVal").textContent=sub+": "+shortOpt(currentOption());
    } else if(state.zoneId==="body"){
      el("optVal").textContent="L"+(state.bodyFocus+1)+": "+shortOpt(currentOption());
    } else {
      el("optVal").textContent=shortOpt(currentOption());
    }
  }

  function colorTarget(){
    if(state.zoneId==="body"){
      const b=state.bodies[state.bodyFocus|0];
      return { get:()=> (b&&b.color)||DEFAULT_COLORS.body, set:(hex)=>{ if(b){ b.color=hex; markEdited("body:"+(state.bodyFocus|0)); } } };
    }
    const sid=activeSlotId();
    return { get:()=> state.colors[sid]||DEFAULT_COLORS[sid]||"#888888", set:(hex)=>{ state.colors[sid]=hex; markEdited(sid); } };
  }

  function renderSwatches(){
    const host=el("swatches"); host.innerHTML="";
    const ct=colorTarget();
    const cur=(ct.get()||"").toLowerCase();
    PALETTE.forEach(hex=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="sw"+(hex==="#ffffff"||hex==="#000000"?" bw":"")+(cur===hex.toLowerCase()?" on":"");
      b.style.background=hex;
      let timer=null, long=false;
      b.addEventListener("pointerdown", ()=>{ long=false; timer=setTimeout(()=>{ long=true; openColorSheet(hex); },480); });
      const end=()=>{ clearTimeout(timer); if(!long){ ct.set(hex); state.dirty=true; renderSwatches(); renderBodies(); } };
      b.addEventListener("pointerup", end);
      b.addEventListener("pointerleave", ()=>clearTimeout(timer));
      b.addEventListener("pointercancel", ()=>clearTimeout(timer));
      host.appendChild(b);
    });
  }

  function hslToHex(h,s,l){
    s/=100; l/=100; const a=s*Math.min(l,1-l);
    const f=n=>{ const k=(n+h/30)%12; const c=l-a*Math.max(Math.min(k-3,9-k,1),-1); return Math.round(255*c).toString(16).padStart(2,"0"); };
    return "#"+f(0)+f(8)+f(4);
  }
  function hexToHsl(hex){
    let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b); let h=0,s=0,l=(max+min)/2;
    if(max!==min){ const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){ case r:h=((g-b)/d+(g<b?6:0));break; case g:h=(b-r)/d+2;break; default:h=(r-g)/d+4;} h*=60; }
    return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};
  }
  let advTarget=null;
  function syncAdv(){ const hex=hslToHex(+el("advH").value,+el("advS").value,+el("advL").value); el("advPreview").style.background=hex; advTarget=hex; }
  function openColorSheet(fromHex){
    const hsl=hexToHsl(fromHex||colorTarget().get()||"#888888");
    el("advH").value=hsl.h; el("advS").value=hsl.s; el("advL").value=hsl.l; syncAdv(); el("colorSheet").classList.add("on");
  }
  function closeColorSheet(apply){
    el("colorSheet").classList.remove("on");
    if(apply&&advTarget){ colorTarget().set(advTarget); state.dirty=true; renderSwatches(); renderBodies(); }
  }

  function renderBodies(){
    const host=el("bodyRows"); host.innerHTML="";
    state.bodies.forEach((b,idx)=>{
      const row=document.createElement("div");
      row.className="body-row"+(state.bodyFocus===idx?" on":"");
      row.onclick=(e)=>{ if(e.target.closest("button,input")) return; state.bodyFocus=idx; syncSteppers(); renderSwatches(); renderBodies(); };
      const top=document.createElement("div"); top.className="top";
      const idxEl=document.createElement("span"); idxEl.className="idx"; idxEl.textContent=String(idx+1);
      const name=document.createElement("span"); name.className="name";
      name.textContent=shortOpt(b.folder)+(idx===0?" ↓":idx===state.bodies.length-1?" ↑":"");
      const sw=document.createElement("button"); sw.type="button"; sw.className="sw-mini";
      sw.style.background=b.color||DEFAULT_COLORS.body;
      sw.onclick=(e)=>{ e.stopPropagation(); state.bodyFocus=idx; openColorSheet(b.color||DEFAULT_COLORS.body); };
      const ops=document.createElement("div"); ops.className="ops";
      const up=document.createElement("button"); up.type="button"; up.textContent="↑";
      up.disabled=idx>=state.bodies.length-1;
      up.onclick=(e)=>{ e.stopPropagation(); if(idx>=state.bodies.length-1) return;
        const t=state.bodies[idx+1]; state.bodies[idx+1]=state.bodies[idx]; state.bodies[idx]=t;
        state.bodyFocus=idx+1; state.look.body=state.bodies[0].folder; markEdited("body"); state.dirty=true; renderBodies(); syncSteppers(); };
      const dn=document.createElement("button"); dn.type="button"; dn.textContent="↓";
      dn.disabled=idx<=0;
      dn.onclick=(e)=>{ e.stopPropagation(); if(idx<=0) return;
        const t=state.bodies[idx-1]; state.bodies[idx-1]=state.bodies[idx]; state.bodies[idx]=t;
        state.bodyFocus=idx-1; state.look.body=state.bodies[0].folder; markEdited("body"); state.dirty=true; renderBodies(); syncSteppers(); };
      const rm=document.createElement("button"); rm.type="button"; rm.textContent="×";
      rm.disabled=state.bodies.length<=1;
      rm.onclick=(e)=>{ e.stopPropagation(); if(state.bodies.length<=1) return;
        state.bodies.splice(idx,1); state.bodyFocus=Math.min(state.bodyFocus, state.bodies.length-1);
        state.look.body=state.bodies[0].folder; markEdited("body"); state.dirty=true; renderBodies(); syncSteppers(); };
      ops.appendChild(up); ops.appendChild(dn); ops.appendChild(rm);
      top.appendChild(idxEl); top.appendChild(name); top.appendChild(sw); top.appendChild(ops);
      const range=document.createElement("input"); range.type="range"; range.min="0"; range.max="100";
      range.value=String(Math.round((b.opacity||1)*100));
      range.oninput=()=>{ state.bodies[idx].opacity=(+range.value)/100; markEdited("body:"+idx); state.dirty=true; };
      row.appendChild(top); row.appendChild(range); host.appendChild(row);
    });
  }

  function clearLastPart(){
    const key=state.lastEdited;
    if(!key){
      if(state.zoneId==="body"){ el("status").textContent="Corps : × couche"; return; }
      const sid=activeSlotId(); const s=slotById(sid);
      if(s&&s.required){ el("status").textContent="Obligatoire"; return; }
      state.look[sid]="None"; state.dirty=true; syncSteppers(); el("status").textContent="→ Aucun"; return;
    }
    if(key.startsWith("body")){ el("status").textContent="Corps : × couche"; return; }
    const s=slotById(key);
    if(s&&s.required){ el("status").textContent="Obligatoire"; return; }
    state.look[key]="None"; state.dirty=true; syncSteppers();
    el("status").textContent="→ Aucun ("+key+")";
  }

  function syncSizeUI(){
    const pct=Math.round((state.charSizePct||LAY.char.sizePct)*100);
    const inp=el("charSize"), lab=el("charSizeVal");
    if(inp) inp.value=String(pct);
    if(lab) lab.textContent=pct+"%";
  }

  function bind(){
    el("dirPrev").onclick=()=>{ state.dir=(state.dir+7)%8; state.dirty=true; };
    el("dirNext").onclick=()=>{ state.dir=(state.dir+1)%8; state.dirty=true; };
    el("animPrev").onclick=()=>cycleAnim(-1);
    el("animNext").onclick=()=>cycleAnim(1);
    el("optPrev").onclick=()=>cycleOption(-1);
    el("optNext").onclick=()=>cycleOption(1);
    el("optVal").style.cursor="pointer";
    el("optVal").onclick=()=>{ if(state.zoneId==="weapon") cycleMiscSlot(1); };
    el("btnClear").onclick=clearLastPart;

    const sizeEl=el("charSize");
    if(sizeEl) sizeEl.oninput=()=>{
      state.charSizePct=Math.max(0.55, Math.min(1.10, (+sizeEl.value)/100));
      syncSizeUI(); state.dirty=true;
    };
    el("advH").oninput=syncAdv; el("advS").oninput=syncAdv; el("advL").oninput=syncAdv;
    el("advCancel").onclick=()=>closeColorSheet(false);
    el("advOk").onclick=()=>closeColorSheet(true);
    el("colorSheet").addEventListener("click", e=>{ if(e.target.id==="colorSheet") closeColorSheet(false); });
    el("addBody").onclick=()=>{
      const folders=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
      state.bodies.push({folder:folders[state.bodies.length%folders.length]||"NakedBody", opacity:0.7, color:DEFAULT_COLORS.body});
      state.bodyFocus=state.bodies.length-1;
      markEdited("body:"+(state.bodies.length-1));
      renderBodies(); syncSteppers(); renderSwatches(); state.dirty=true;
    };
    el("btnRandom").onclick=()=>{
      const palette=PALETTE.slice(0,-2);
      for(const s of slots()){
        if(s.id==="body") continue;
        state.look[s.id]=s.folders[Math.floor(Math.random()*s.folders.length)];
        if(Math.random()<0.7) state.colors[s.id]=palette[Math.floor(Math.random()*palette.length)];
      }
      const bf=((slotById("body")||{}).folders||[]).filter(f=>f!=="None");
      state.bodies=[{folder:bf[Math.floor(Math.random()*bf.length)]||"NakedBody", opacity:1, color:palette[Math.floor(Math.random()*palette.length)]}];
      state.bodyFocus=0; state.look.body=state.bodies[0].folder;
      state.dirty=true; syncSteppers(); renderSwatches(); renderBodies();
    };
    el("btnReset").onclick=()=>{
      state.look=defaultLook(state.catalog); state.colors=defaultColors();
      state.bodies=[{folder:"NakedBody",opacity:1,color:DEFAULT_COLORS.body}];
      state.bodyFocus=0; state.lastEdited=null;
      state.dirty=true; syncSteppers(); renderSwatches(); renderBodies();
    };
    el("btnExport").onclick=()=>{
      const payload={pack:"fantasy-cc", look:state.look, colors:state.colors, bodies:state.bodies, fps:state.fps, anim:state.anim, dir:state.dir, charSizePct:state.charSizePct};
      try{ localStorage.setItem("neuro.fantasyLook", JSON.stringify(payload)); }catch(_e){}
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
      a.download="fantasy-look.json"; a.click(); el("status").textContent="Look sauvé";
    };
    window.addEventListener("resize", ()=>{ state.dirty=true; layoutChrome(); });
  }

  async function boot(){
    el("status").textContent="…";
    let cat=null;
    for(const u of [BASE_CDN+"catalog.json", BASE_LOCAL+"catalog.json"]){
      try{ const r=await fetch(u,{cache:"no-store",mode:"cors"}); if(r.ok){ cat=await r.json(); break; } }catch(_e){}
    }
    if(!cat){ el("status").textContent="Catalogue ∅"; return; }
    state.catalog=cat;
    if(cat.weaponAfterShieldRows) weaponAfterShieldRows=cat.weaponAfterShieldRows;
    if(cat.backpackInFrontRows) backpackInFrontRows=cat.backpackInFrontRows;
    if(cat.defaultFps) state.fps=cat.defaultFps|0;
    state.colors=defaultColors();
    try{
      const raw=localStorage.getItem("neuro.fantasyLook");
      if(raw){
        const o=JSON.parse(raw);
        if(o&&o.look){
          state.look=o.look;
          if(o.colors) state.colors=Object.assign(defaultColors(), o.colors);
          if(o.bodies&&o.bodies.length){
            state.bodies=o.bodies.map(b=>({folder:b.folder, opacity:b.opacity==null?1:b.opacity, color:b.color||o.colors?.body||DEFAULT_COLORS.body}));
          } else if(o.look.body){
            state.bodies=[{folder:o.look.body, opacity:1, color:state.colors.body||DEFAULT_COLORS.body}];
          }
          if(o.anim) state.anim=o.anim;
          if(typeof o.charSizePct==="number"){
            let p=Math.max(0.55, Math.min(1.10, o.charSizePct));
            if(p<0.90) p=LAY.char.sizePct; /* anciennes valeurs trop petites */
            state.charSizePct=p;
          }
        }
      }
    }catch(_e){}
    if(!state.look.body) state.look=defaultLook(cat);
    if(!state.bodies.length) state.bodies=[{folder:"NakedBody",opacity:1,color:DEFAULT_COLORS.body}];
    const anims=(cat.anims&&cat.anims.length)?cat.anims:["Idle","Walk","Attack1"];
    if(!anims.includes(state.anim)) state.anim=anims[0];
    bind(); syncSizeUI(); selectZone("head");
    state.dirty=true;
    await loadImg(state.bodies[0].folder||"NakedBody","Idle");
    el("status").textContent="Prêt";
    loop();
  }
  boot();
})();
</script>
</body>
</html>
