<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mannequin — Idle breathing + Walk</title>
<style>
  body{margin:0;font-family:Trebuchet MS,sans-serif;background:#151a22;color:#f2f0eb;padding:16px}
  h1{font-size:18px;color:#E8590C;margin:0 0 8px}
  h2{font-size:15px;color:#27e0ff;margin:22px 0 8px}
  p{font-size:13px;color:#DCD3C3;max-width:52rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
  .card{background:#1e2430;border:1px solid #2E2E30;border-radius:10px;padding:10px;text-align:center}
  .card img{width:184px;height:184px;image-rendering:pixelated;background:
    linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%);
    background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
  code{font-size:11px;color:#DCD3C3}
  .ok{color:#3ce08a}
  a{color:#27e0ff;font-weight:700}
</style>
</head>
<body>
<h1>Mannequin — Idle breathing (4f) + Walk (6f)</h1>
<p>Base 184×184 : chauve, nu, mannequin androgyne. Rangées sheet = index jeu 0…7. Idle + Walk @60 fps.</p>
<p><a id="calLink" href="calibrage-vues.html">📐 Calibrer les vues (choisir Face / Dos / Profil…)</a></p>
<h2>Idle breathing</h2>
<div class="grid" id="idle"></div>
<h2>Walk</h2>
<div class="grid" id="walk"></div>
<script>
// Assets via jsDelivr (images OK). Ne pas ouvrir ce HTML via jsDelivr (text/plain).
const CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@cursor/strict-regen-idle-66c0/assets/packs/mannequin-idle/";
const localOk = location.protocol === "file:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  || location.hostname.includes("githack");
const BASE = localOk ? "" : CDN;
document.getElementById("calLink").href = (localOk ? "" : CDN) + "calibrage-vues.html";

const DIRS=[
  ["south","0 Face"],
  ["south-east","1 ¾ Face D"],
  ["east","2 Profil D"],
  ["north-east","3 ¾ Dos D"],
  ["north","4 Dos"],
  ["north-west","5 ¾ Dos G"],
  ["west","6 Profil G"],
  ["south-west","7 ¾ Face G"],
];
function fill(id, folder, ext){
  const g=document.getElementById(id);
  DIRS.forEach(([dir,label],i)=>{
    const rel=`src/${folder}/${dir}.${ext}`;
    const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<div><b>${label}</b></div><img alt="${dir}"/><div class="ok">row ${i}</div><code>${dir}.${ext}</code>`;
    const img=card.querySelector("img");
    img.src=`${BASE}${rel}?v=60`;
    img.onerror=()=>{ img.onerror=null; img.src=`${CDN}${rel}?v=60`; };
    g.appendChild(card);
  });
}
fill("idle","idle","gif");
fill("walk","walk","gif");
</script>
</body>
</html>
