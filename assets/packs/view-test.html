<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Test angle — Thug 8 vues (zoom)</title>
<style>
  :root{
    --cream:#F2F0EB; --accent:#E8590C; --cyan:#27e0ff; --bg:#0c1018;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--cream);
    font-family:Trebuchet MS,Segoe UI,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  header{
    padding:10px 12px; border-bottom:1px solid #2a3140;
    display:flex; flex-direction:column; gap:4px;
  }
  header h1{font-size:16px; color:var(--accent)}
  header .meta{font-size:12px; opacity:.8}
  #status{font-size:12px; color:#8ec8ff}
  #wrap{
    flex:1; position:relative; overflow:hidden; min-height:300px;
    background:radial-gradient(ellipse at 50% 45%, #1a2436 0%, #0c1018 70%);
  }
  canvas{display:block; width:100%; height:100%; touch-action:none}
  .bigdir{
    font-size:22px; font-weight:bold; color:var(--accent);
    text-align:center; padding:6px 8px 0; letter-spacing:1px;
  }
  .bar{
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid #2a3140;
    display:flex; flex-direction:column; gap:8px;
    background:#10151f;
  }
  .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  button{
    background:#1e2633; color:var(--cream); border:1px solid #3a4558;
    border-radius:10px; padding:10px 12px; font-size:14px; font-weight:bold;
    cursor:pointer; min-height:42px;
  }
  button.on{border-color:var(--cyan); color:var(--cyan)}
  button:active{transform:scale(.97)}
  .dirs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; width:100%}
  .dirs button{font-size:12px; padding:8px 4px}
  .hint{font-size:11px; opacity:.7; line-height:1.35}
</style>
</head>
<body>
<header>
  <h1>TEST ANGLE — map iso + zoom</h1>
  <div class="meta">Thug Idle · pieds collés à la case orange · 8 vues</div>
  <div id="status">Chargement…</div>
</header>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="bigdir" id="bigDir">—</div>
<div class="bar">
  <div class="row">
    <button id="btnPlay" class="on">⏸ Pause</button>
    <button id="btnPrev">◀</button>
    <button id="btnNext">▶</button>
    <button id="btnZoomOut">− Zoom</button>
    <button id="btnZoomIn">+ Zoom</button>
    <button id="btnBigger">Perso +</button>
    <button id="btnSmaller">Perso −</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="dirs" id="dirChips"></div>
  <div class="hint">
    Zoom = carte + perso ensemble. Perso +/− = taille sur la case.
    Pince à 2 doigts = zoom · 1 doigt = déplacer.
  </div>
</div>
<script>
const TILE_W = 64, TILE_H = 32;
const GRID = 5;
const CELL = { c: 2, r: 2 };
const FRAME_W = 64, FRAME_H = 64;
const SHEET_COLS = 8;

const DIR_ORDER = [
  { id:"front",       label:"0 · S face" },
  { id:"qFrontRight", label:"1 · SE" },
  { id:"sideRight",   label:"2 · E" },
  { id:"qBackRight",  label:"3 · NE" },
  { id:"back",        label:"4 · N dos" },
  { id:"qBackLeft",   label:"5 · NO" },
  { id:"sideLeft",    label:"6 · O" },
  { id:"qFrontLeft",  label:"7 · SO" },
];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const chipsEl = document.getElementById("dirChips");
const bigDir = document.getElementById("bigDir");

let sheet = null;
let dirIndex = 0;
let frameIndex = 0;
let playing = true;
let lastDirSwitch = 0;
let dpr = 1;
let userZoom = 2.2;
/** Hauteur visuelle du perso en unités map (case = 32 de haut). ~3 cases ≈ bien lisible */
let charH = 110;
let panX = 0, panY = 0;
/** Cache ancre pieds dans la frame 64×64 (bas du contenu opaque) */
const footAnchor = {}; // key dir,frame -> {fx, fy} en px source

DIR_ORDER.forEach((d,i)=>{
  const b = document.createElement("button");
  b.textContent = d.label;
  if(i===0) b.classList.add("on");
  b.onclick = ()=>{ dirIndex=i; syncUI(); };
  chipsEl.appendChild(b);
});

function syncUI(){
  [...chipsEl.children].forEach((b,i)=> b.classList.toggle("on", i===dirIndex));
  bigDir.textContent = DIR_ORDER[dirIndex].label;
}

function toScreen(c, r){
  return {
    x: (c - r) * (TILE_W/2),
    y: (c + r) * (TILE_H/2),
  };
}

/** Trouve le point de contact au sol dans une frame (bas du sprite opaque, centre x) */
function findFoot(dir, frame){
  const key = dir+","+frame;
  if(footAnchor[key]) return footAnchor[key];
  if(!sheet) return { fx: FRAME_W/2, fy: FRAME_H - 2 };

  const c = document.createElement("canvas");
  c.width = FRAME_W; c.height = FRAME_H;
  const x = c.getContext("2d");
  x.clearRect(0,0,FRAME_W,FRAME_H);
  x.drawImage(sheet, frame*FRAME_W, dir*FRAME_H, FRAME_W, FRAME_H, 0, 0, FRAME_W, FRAME_H);
  const data = x.getImageData(0,0,FRAME_W,FRAME_H).data;

  let minX=FRAME_W, maxX=0, maxY=0, found=false;
  for(let y=0;y<FRAME_H;y++){
    for(let px=0;px<FRAME_W;px++){
      const a = data[(y*FRAME_W+px)*4+3];
      if(a > 24){
        found = true;
        if(px<minX) minX=px;
        if(px>maxX) maxX=px;
        if(y>maxY) maxY=y;
      }
    }
  }
  const anchor = found
    ? { fx: (minX+maxX)/2, fy: maxY }
    : { fx: FRAME_W/2, fy: FRAME_H - 2 };
  footAnchor[key] = anchor;
  return anchor;
}

function layout(){
  const wrap = document.getElementById("wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+"px"; canvas.style.height = h+"px";
}

function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#1a2436"); g.addColorStop(1,"#0c1018");
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

  // Centre = pieds de la case perso (coordonnées map pures)
  const footMap = toScreen(CELL.c, CELL.r);
  const sc = userZoom;

  ctx.save();
  // Écran : centre + pan, puis zoom autour du centre
  ctx.translate(w/2 + panX, h/2 + panY);
  ctx.scale(sc, sc);
  ctx.translate(-footMap.x, -footMap.y + 8);

  // --- MAP ---
  const cells = [];
  for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++) cells.push({c,r,z:c+r});
  cells.sort((a,b)=>a.z-b.z);
  for(const t of cells){
    const s = toScreen(t.c, t.r);
    const hw = TILE_W/2, hh = TILE_H/2;
    const even = (t.c+t.r)%2===0;
    const isCell = t.c===CELL.c && t.r===CELL.r;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y-hh);
    ctx.lineTo(s.x+hw, s.y);
    ctx.lineTo(s.x, s.y+hh);
    ctx.lineTo(s.x-hw, s.y);
    ctx.closePath();
    ctx.fillStyle = isCell ? "rgba(232,89,12,.5)" : (even ? "rgba(242,240,235,.2)" : "rgba(220,211,195,.12)");
    ctx.fill();
    ctx.strokeStyle = isCell ? "#E8590C" : "rgba(80,90,110,.8)";
    ctx.lineWidth = isCell ? 2/sc : 1.2/sc;
    ctx.stroke();
  }

  // --- PERSO : ancré par les PIEDS du contenu opaque ---
  if(sheet){
    const foot = toScreen(CELL.c, CELL.r);
    const pivotX = foot.x;
    const pivotY = foot.y + 2;
    const fr = frameIndex % SHEET_COLS;
    const anc = findFoot(dirIndex, fr);

    // échelle pour que la frame fasse charH de haut en unités map
    const sChar = charH / FRAME_H;
    const dw = FRAME_W * sChar;
    const dh = FRAME_H * sChar;

    // point pieds source → doit coincider avec pivot map
    const dx = pivotX - anc.fx * sChar;
    const dy = pivotY - anc.fy * sChar;

    // ombre sous les pieds (pivot)
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.beginPath();
    ctx.ellipse(pivotX, pivotY+3, 18, 8, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      sheet,
      fr * FRAME_W, dirIndex * FRAME_H, FRAME_W, FRAME_H,
      dx, dy, dw, dh
    );

    // repères
    ctx.strokeStyle = "#27e0ff";
    ctx.lineWidth = 2/sc;
    ctx.beginPath(); ctx.ellipse(pivotX, pivotY+2, 20, 9, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "#27e0ff";
    ctx.beginPath(); ctx.arc(pivotX, pivotY, 3/sc, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();

  // HUD
  ctx.fillStyle = "rgba(12,16,24,.85)";
  ctx.fillRect(10, 10, 200, 40);
  ctx.fillStyle = "#F2F0EB";
  ctx.font = "bold 13px Trebuchet MS";
  ctx.fillText("Zoom ×"+userZoom.toFixed(1)+" · hauteur "+Math.round(charH)+"px", 18, 34);
}

function loop(t){
  if(playing && sheet){
    if(!lastDirSwitch) lastDirSwitch = t;
    if(t - lastDirSwitch > 1100){
      dirIndex = (dirIndex + 1) % 8;
      syncUI();
      lastDirSwitch = t;
    }
    frameIndex = Math.floor(t / 140) % SHEET_COLS;
  }
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("btnPlay").onclick = ()=>{
  playing = !playing;
  const b = document.getElementById("btnPlay");
  b.textContent = playing ? "⏸ Pause" : "▶ Play";
  b.classList.toggle("on", playing);
  lastDirSwitch = performance.now();
};
document.getElementById("btnPrev").onclick = ()=>{ dirIndex=(dirIndex+7)%8; syncUI(); };
document.getElementById("btnNext").onclick = ()=>{ dirIndex=(dirIndex+1)%8; syncUI(); };
document.getElementById("btnZoomIn").onclick = ()=>{ userZoom=Math.min(5.5, userZoom+0.3); };
document.getElementById("btnZoomOut").onclick = ()=>{ userZoom=Math.max(0.7, userZoom-0.3); };
document.getElementById("btnBigger").onclick = ()=>{ charH=Math.min(200, charH+12); };
document.getElementById("btnSmaller").onclick = ()=>{ charH=Math.max(48, charH-12); };
document.getElementById("btnReset").onclick = ()=>{
  userZoom=2.2; charH=110; panX=0; panY=0;
};

let touch={mode:null,sx:0,sy:0,panX0:0,panY0:0,pinch0:1,zoom0:1};
canvas.addEventListener("touchstart", e=>{
  if(e.touches.length>=2){
    touch.mode="pinch";
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    touch.pinch0=Math.hypot(dx,dy)||1; touch.zoom0=userZoom;
  } else {
    touch.mode="pan";
    touch.sx=e.touches[0].clientX; touch.sy=e.touches[0].clientY;
    touch.panX0=panX; touch.panY0=panY;
  }
},{passive:true});
canvas.addEventListener("touchmove", e=>{
  if(touch.mode==="pinch" && e.touches.length>=2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy)||1;
    userZoom=Math.max(0.7, Math.min(5.5, touch.zoom0*(d/touch.pinch0)));
    e.preventDefault();
  } else if(touch.mode==="pan" && e.touches.length===1){
    panX=touch.panX0+(e.touches[0].clientX-touch.sx);
    panY=touch.panY0+(e.touches[0].clientY-touch.sy);
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  userZoom=Math.max(0.7, Math.min(5.5, userZoom+(e.deltaY<0?0.2:-0.2)));
},{passive:false});

window.addEventListener("resize", ()=>{ layout(); });

sheet = new Image();
sheet.onload = ()=>{
  statusEl.textContent = "OK — pieds recalés sur la case · zoom carte+perso ensemble";
  layout(); syncUI();
  lastDirSwitch = performance.now();
  requestAnimationFrame(loop);
};
sheet.onerror = ()=> statusEl.textContent = "ERREUR Idle.png";
sheet.src = "thug-16bit-outlined/Idle.png?v=" + Date.now();
</script>
</body>
</html>
