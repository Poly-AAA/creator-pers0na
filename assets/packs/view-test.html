<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Test angle — Thug 8 vues (zoom)</title>
<style>
  :root{
    --cream:#F2F0EB; --beige:#DCD3C3; --ink:#2E2E30; --accent:#E8590C;
    --cyan:#27e0ff; --bg:#0c1018;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--cream);
    font-family:Trebuchet MS,Segoe UI,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  header{
    padding:10px 12px; border-bottom:1px solid #2a3140;
    display:flex; flex-direction:column; gap:4px;
  }
  header h1{font-size:16px; color:var(--accent)}
  header .meta{font-size:12px; opacity:.8}
  #status{font-size:12px; color:#8ec8ff}
  #wrap{
    flex:1; position:relative; overflow:hidden; min-height:280px;
    background:
      radial-gradient(ellipse at 50% 40%, #1a2436 0%, #0c1018 70%);
  }
  canvas{display:block; width:100%; height:100%; touch-action:none}
  .bar{
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid #2a3140;
    display:flex; flex-direction:column; gap:8px;
    background:#10151f;
  }
  .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  button{
    background:#1e2633; color:var(--cream); border:1px solid #3a4558;
    border-radius:10px; padding:10px 12px; font-size:14px; font-weight:bold;
    cursor:pointer; min-height:42px;
  }
  button.on{border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 0 1px rgba(39,224,255,.25)}
  button:active{transform:scale(.97)}
  .dirs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; width:100%}
  .dirs button{font-size:12px; padding:8px 4px}
  .hint{font-size:11px; opacity:.7; line-height:1.35}
  .bigdir{
    font-size:22px; font-weight:bold; color:var(--accent);
    letter-spacing:1px; text-align:center; padding:4px 0 0;
  }
</style>
</head>
<body>
<header>
  <h1>TEST ANGLE — map iso + zoom</h1>
  <div class="meta">Thug Idle · même case · 8 vues bien visibles</div>
  <div id="status">Chargement…</div>
</header>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="bigdir" id="bigDir">—</div>
<div class="bar">
  <div class="row">
    <button id="btnPlay" class="on">⏸ Pause</button>
    <button id="btnPrev">◀</button>
    <button id="btnNext">▶</button>
    <button id="btnZoomOut">− Zoom</button>
    <button id="btnZoomIn">+ Zoom</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="dirs" id="dirChips"></div>
  <div class="hint">
    Pince / boutons zoom. Le perso reste sur la case orange ; seules les vues tournent.
    Si une direction paraît fausse, note son numéro.
  </div>
</div>
<script>
const TILE_W = 64, TILE_H = 32;
const GRID = 5;
const CELL = { c: 2, r: 2 };
const FRAME_W = 64, FRAME_H = 64;
const SHEET_COLS = 8;

const DIR_ORDER = [
  { id:"front",       label:"0 · S face" },
  { id:"qFrontRight", label:"1 · SE" },
  { id:"sideRight",   label:"2 · E" },
  { id:"qBackRight",  label:"3 · NE" },
  { id:"back",        label:"4 · N dos" },
  { id:"qBackLeft",   label:"5 · NO" },
  { id:"sideLeft",    label:"6 · O" },
  { id:"qFrontLeft",  label:"7 · SO" },
];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const chipsEl = document.getElementById("dirChips");
const bigDir = document.getElementById("bigDir");

let sheet = null;
let dirIndex = 0;
let frameIndex = 0;
let playing = true;
let lastDirSwitch = 0;
let dpr = 1;
let userZoom = 2.4;          // zoom fort par défaut
let charScale = 4.2;         // perso GROS (frame 64 → ~270px)
let panX = 0, panY = 0;

DIR_ORDER.forEach((d,i)=>{
  const b = document.createElement("button");
  b.textContent = d.label;
  if(i===0) b.classList.add("on");
  b.onclick = ()=>{ dirIndex=i; syncUI(); draw(); };
  chipsEl.appendChild(b);
});

function syncUI(){
  [...chipsEl.children].forEach((b,i)=> b.classList.toggle("on", i===dirIndex));
  bigDir.textContent = DIR_ORDER[dirIndex].label;
}

function toScreen(c, r, ox, oy){
  return {
    x: ox + (c - r) * (TILE_W/2),
    y: oy + (c + r) * (TILE_H/2),
  };
}

function layout(){
  const wrap = document.getElementById("wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.width = w+"px"; canvas.style.height = h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  // fond
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#1a2436"); g.addColorStop(1,"#0c1018");
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

  // centre la case du perso, puis zoom + pan
  const baseOx = 0, baseOy = 0;
  const foot0 = toScreen(CELL.c, CELL.r, baseOx, baseOy);
  const sc = userZoom;
  const ox = (w/2)/sc - foot0.x + panX/sc;
  const oy = (h/2)/sc - foot0.y + 10 + panY/sc;

  ctx.save();
  ctx.scale(sc, sc);

  // map
  const cells = [];
  for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++) cells.push({c,r,z:c+r});
  cells.sort((a,b)=>a.z-b.z);
  for(const t of cells){
    const s = toScreen(t.c, t.r, ox, oy);
    const hw = TILE_W/2, hh = TILE_H/2;
    const even = (t.c+t.r)%2===0;
    const isCell = t.c===CELL.c && t.r===CELL.r;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y-hh);
    ctx.lineTo(s.x+hw, s.y);
    ctx.lineTo(s.x, s.y+hh);
    ctx.lineTo(s.x-hw, s.y);
    ctx.closePath();
    ctx.fillStyle = isCell ? "rgba(232,89,12,.45)" : (even ? "rgba(242,240,235,.18)" : "rgba(220,211,195,.12)");
    ctx.fill();
    ctx.strokeStyle = isCell ? "#E8590C" : "rgba(46,46,48,.7)";
    ctx.lineWidth = isCell ? 2.2/sc : 1.2/sc;
    ctx.stroke();
  }

  // personnage GROS
  if(sheet){
    const foot = toScreen(CELL.c, CELL.r, ox, oy);
    const pivotX = foot.x;
    const pivotY = foot.y + 2;

    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.beginPath();
    ctx.ellipse(pivotX, pivotY+4, 28, 12, 0, 0, Math.PI*2);
    ctx.fill();

    const dw = FRAME_W * charScale;
    const dh = FRAME_H * charScale;
    const dx = pivotX - dw/2;
    const dy = pivotY - dh + 8;

    const sx = (frameIndex % SHEET_COLS) * FRAME_W;
    const sy = dirIndex * FRAME_H;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sheet, sx, sy, FRAME_W, FRAME_H, dx, dy, dw, dh);

    // anneau + pivot visibles
    ctx.strokeStyle = "#27e0ff";
    ctx.lineWidth = 2.5/sc;
    ctx.beginPath(); ctx.ellipse(pivotX, pivotY+3, 32, 14, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "#27e0ff";
    ctx.beginPath(); ctx.arc(pivotX, pivotY, 3.5/sc, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();

  // HUD zoom
  ctx.fillStyle = "rgba(12,16,24,.8)";
  ctx.fillRect(10, 10, 160, 36);
  ctx.fillStyle = "#F2F0EB";
  ctx.font = "bold 13px Trebuchet MS";
  ctx.fillText("Zoom ×" + userZoom.toFixed(1) + " · perso ×" + charScale.toFixed(1), 18, 32);
}

let raf = 0;
function loop(t){
  if(playing && sheet){
    if(!lastDirSwitch) lastDirSwitch = t;
    if(t - lastDirSwitch > 1100){
      dirIndex = (dirIndex + 1) % 8;
      syncUI();
      lastDirSwitch = t;
    }
    frameIndex = Math.floor(t / 140) % SHEET_COLS;
  }
  draw();
  raf = requestAnimationFrame(loop);
}

document.getElementById("btnPlay").onclick = ()=>{
  playing = !playing;
  const b = document.getElementById("btnPlay");
  b.textContent = playing ? "⏸ Pause" : "▶ Play";
  b.classList.toggle("on", playing);
  lastDirSwitch = performance.now();
};
document.getElementById("btnPrev").onclick = ()=>{
  dirIndex = (dirIndex + 7) % 8; syncUI(); draw();
};
document.getElementById("btnNext").onclick = ()=>{
  dirIndex = (dirIndex + 1) % 8; syncUI(); draw();
};
document.getElementById("btnZoomIn").onclick = ()=>{
  userZoom = Math.min(6, userZoom + 0.35); draw();
};
document.getElementById("btnZoomOut").onclick = ()=>{
  userZoom = Math.max(0.8, userZoom - 0.35); draw();
};
document.getElementById("btnReset").onclick = ()=>{
  userZoom = 2.4; charScale = 4.2; panX = 0; panY = 0; draw();
};

// pinch zoom + pan 1 doigt
let touch = { mode:null, sx:0, sy:0, panX0:0, panY0:0, pinch0:1, zoom0:1 };
canvas.addEventListener("touchstart", e=>{
  if(e.touches.length >= 2){
    touch.mode = "pinch";
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touch.pinch0 = Math.hypot(dx,dy)||1;
    touch.zoom0 = userZoom;
  } else {
    touch.mode = "pan";
    touch.sx = e.touches[0].clientX; touch.sy = e.touches[0].clientY;
    touch.panX0 = panX; touch.panY0 = panY;
  }
},{passive:true});
canvas.addEventListener("touchmove", e=>{
  if(touch.mode==="pinch" && e.touches.length>=2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx,dy)||1;
    userZoom = Math.max(0.8, Math.min(6, touch.zoom0 * (d/touch.pinch0)));
    e.preventDefault();
  } else if(touch.mode==="pan" && e.touches.length===1){
    panX = touch.panX0 + (e.touches[0].clientX - touch.sx);
    panY = touch.panY0 + (e.touches[0].clientY - touch.sy);
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  userZoom = Math.max(0.8, Math.min(6, userZoom + (e.deltaY<0?0.2:-0.2)));
},{passive:false});

window.addEventListener("resize", ()=>{ layout(); draw(); });

sheet = new Image();
sheet.onload = ()=>{
  statusEl.textContent = "OK — perso agrandi · zoom / pince disponibles · change de vue ~1s";
  layout(); syncUI();
  lastDirSwitch = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
};
sheet.onerror = ()=> statusEl.textContent = "ERREUR chargement Idle.png";
sheet.src = "thug-16bit-outlined/Idle.png?v=" + Date.now();
</script>
</body>
</html>
