<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Test Thug — anims + 8 vues</title>
<style>
  :root{ --cream:#F2F0EB; --accent:#E8590C; --cyan:#27e0ff; --bg:#0c1018; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--cream);
    font-family:Trebuchet MS,Segoe UI,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  header{ padding:10px 12px; border-bottom:1px solid #2a3140; }
  header h1{font-size:16px; color:var(--accent)}
  header .meta{font-size:12px; opacity:.8; margin-top:2px}
  #status{font-size:12px; color:#8ec8ff; margin-top:4px}
  #wrap{
    flex:1; min-height:280px; position:relative; overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, #1a2436 0%, #0c1018 70%);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .bigdir{
    font-size:18px; font-weight:bold; color:var(--accent);
    text-align:center; padding:6px 8px 0;
  }
  .bar{
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid #2a3140; background:#10151f;
    display:flex; flex-direction:column; gap:8px;
  }
  .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  button{
    background:#1e2633; color:var(--cream); border:1px solid #3a4558;
    border-radius:10px; padding:9px 11px; font-size:13px; font-weight:bold;
    cursor:pointer; min-height:40px;
  }
  button.on{border-color:var(--cyan); color:var(--cyan)}
  .dirs,.anims{display:grid; gap:5px; width:100%}
  .dirs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .anims{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dirs button,.anims button{font-size:11px; padding:8px 4px}
  .label{font-size:11px; opacity:.65; text-transform:uppercase; letter-spacing:1px}
  .hint{font-size:11px; opacity:.7; line-height:1.35}
</style>
</head>
<body>
<header>
  <h1>TEST THUG — anims + 8 directions</h1>
  <div class="meta">Placeholder moche OK · on vérifie angle + anims sur la map iso</div>
  <div id="status">Chargement…</div>
</header>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="bigdir" id="bigLabel">—</div>
<div class="bar">
  <div class="label">Animation</div>
  <div class="anims" id="animChips"></div>
  <div class="row">
    <button id="btnPlay" class="on">⏸ Pause dir</button>
    <button id="btnPrev">◀ Dir</button>
    <button id="btnNext">Dir ▶</button>
    <button id="btnZoomOut">− Zoom</button>
    <button id="btnZoomIn">+ Zoom</button>
    <button id="btnBigger">Perso +</button>
    <button id="btnSmaller">Perso −</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="label">Direction</div>
  <div class="dirs" id="dirChips"></div>
  <div class="hint">
    Oui, le pack a des animations. Change Idle / Walk / Run / Attack…
    Le perso reste sur la case orange ; les dirs tournent (ou manuellement).
  </div>
</div>
<script>
const TILE_W=64, TILE_H=32, GRID=5, CELL={c:2,r:2};
const FRAME_W=64, FRAME_H=64, SHEET_COLS=8;
const CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@cursor/echo-sprite-idle-test-e78a/assets/packs/thug-16bit-outlined/";

const DIR_ORDER = [
  {id:"front", label:"0 · S"},
  {id:"qFrontRight", label:"1 · SE"},
  {id:"sideRight", label:"2 · E"},
  {id:"qBackRight", label:"3 · NE"},
  {id:"back", label:"4 · N"},
  {id:"qBackLeft", label:"5 · NO"},
  {id:"sideLeft", label:"6 · O"},
  {id:"qFrontLeft", label:"7 · SO"},
];

const ANIMS = [
  { id:"Idle", file:"Idle.png", fps:8, loop:true },
  { id:"Walk", file:"Walk.png", fps:10, loop:true },
  { id:"Run", file:"Run.png", fps:12, loop:true },
  { id:"Attack1", file:"Attack1.png", fps:12, loop:true },
  { id:"Attack2", file:"Attack2.png", fps:12, loop:true },
  { id:"TakeDamage", file:"TakeDamage.png", fps:10, loop:true },
  { id:"Taunt", file:"Taunt.png", fps:10, loop:true },
  { id:"Die", file:"Die.png", fps:8, loop:false },
];

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const bigLabel=document.getElementById("bigLabel");
const dirChips=document.getElementById("dirChips");
const animChips=document.getElementById("animChips");

let sheets={};           // animId -> Image
let animIndex=0;
let dirIndex=0;
let frameIndex=0;
let rotateDirs=true;
let lastDirSwitch=0;
let dpr=1, userZoom=2.2, charH=110, panX=0, panY=0;

DIR_ORDER.forEach((d,i)=>{
  const b=document.createElement("button");
  b.textContent=d.label;
  if(i===0) b.classList.add("on");
  b.onclick=()=>{ dirIndex=i; syncUI(); };
  dirChips.appendChild(b);
});
ANIMS.forEach((a,i)=>{
  const b=document.createElement("button");
  b.textContent=a.id;
  if(i===0) b.classList.add("on");
  b.onclick=()=>{ animIndex=i; frameIndex=0; syncUI(); };
  animChips.appendChild(b);
});

function syncUI(){
  [...dirChips.children].forEach((b,i)=>b.classList.toggle("on", i===dirIndex));
  [...animChips.children].forEach((b,i)=>b.classList.toggle("on", i===animIndex));
  const a=ANIMS[animIndex], d=DIR_ORDER[dirIndex];
  bigLabel.textContent = a.id + "  ·  " + d.label;
}

function toScreen(c,r){
  return { x:(c-r)*(TILE_W/2), y:(c+r)*(TILE_H/2) };
}

function layout(){
  const wrap=document.getElementById("wrap");
  const w=wrap.clientWidth, h=wrap.clientHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+"px"; canvas.style.height=h+"px";
}

function currentSheet(){
  return sheets[ANIMS[animIndex].id] || null;
}

function draw(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#1a2436"); g.addColorStop(1,"#0c1018");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  const footMap=toScreen(CELL.c, CELL.r);
  const sc=userZoom;
  ctx.save();
  ctx.translate(w/2+panX, h/2+panY);
  ctx.scale(sc, sc);
  ctx.translate(-footMap.x, -footMap.y+8);

  const cells=[];
  for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++) cells.push({c,r,z:c+r});
  cells.sort((a,b)=>a.z-b.z);
  for(const t of cells){
    const s=toScreen(t.c,t.r);
    const hw=TILE_W/2, hh=TILE_H/2;
    const even=(t.c+t.r)%2===0;
    const isCell=t.c===CELL.c && t.r===CELL.r;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y-hh); ctx.lineTo(s.x+hw,s.y); ctx.lineTo(s.x,s.y+hh); ctx.lineTo(s.x-hw,s.y);
    ctx.closePath();
    ctx.fillStyle=isCell?"rgba(232,89,12,.5)":(even?"rgba(242,240,235,.2)":"rgba(220,211,195,.12)");
    ctx.fill();
    ctx.strokeStyle=isCell?"#E8590C":"rgba(80,90,110,.8)";
    ctx.lineWidth=isCell?2/sc:1.2/sc;
    ctx.stroke();
  }

  const sheet=currentSheet();
  if(sheet && sheet.complete){
    const foot=toScreen(CELL.c,CELL.r);
    const pivotX=foot.x, pivotY=foot.y+2;
    const fr=frameIndex % SHEET_COLS;
    const sChar=charH/FRAME_H;
    const dw=FRAME_W*sChar, dh=FRAME_H*sChar;
    // ancre pieds approx (contenu Thug ~ y=46, x centre)
    const fx=FRAME_W/2, fy=46;
    const dx=pivotX-fx*sChar, dy=pivotY-fy*sChar;

    ctx.fillStyle="rgba(0,0,0,.45)";
    ctx.beginPath(); ctx.ellipse(pivotX, pivotY+3, 18, 8, 0, 0, Math.PI*2); ctx.fill();

    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(sheet, fr*FRAME_W, dirIndex*FRAME_H, FRAME_W, FRAME_H, dx, dy, dw, dh);

    ctx.strokeStyle="#27e0ff"; ctx.lineWidth=2/sc;
    ctx.beginPath(); ctx.ellipse(pivotX, pivotY+2, 20, 9, 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle="rgba(12,16,24,.85)";
  ctx.fillRect(10,10,210,40);
  ctx.fillStyle="#F2F0EB";
  ctx.font="bold 13px Trebuchet MS";
  ctx.fillText("Zoom ×"+userZoom.toFixed(1)+" · h "+Math.round(charH), 18, 34);
}

function loop(t){
  const anim=ANIMS[animIndex];
  const fps=anim.fps||10;
  const n=SHEET_COLS;
  if(anim.loop){
    frameIndex=Math.floor(t/1000*fps)%n;
  } else {
    frameIndex=Math.min(n-1, Math.floor(((t/1000)*fps)%(n+8))); // hold last
  }
  if(rotateDirs){
    if(!lastDirSwitch) lastDirSwitch=t;
    if(t-lastDirSwitch>1400){
      dirIndex=(dirIndex+1)%8;
      syncUI();
      lastDirSwitch=t;
    }
  }
  draw();
  requestAnimationFrame(loop);
}

function loadAll(){
  let left=ANIMS.length, ok=0;
  statusEl.textContent="Chargement des anims… 0/"+ANIMS.length;
  ANIMS.forEach(a=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>{
      sheets[a.id]=img; ok++; left--;
      statusEl.textContent="Chargement… "+ok+"/"+ANIMS.length;
      if(left===0){
        statusEl.textContent="OK — "+ok+" anims · placeholder en attendant de beaux graphismes";
        layout(); syncUI();
        requestAnimationFrame(loop);
      }
    };
    img.onerror=()=>{
      left--;
      statusEl.textContent="Manque "+a.file+" ("+ok+" ok)";
      if(left===0 && ok){ layout(); syncUI(); requestAnimationFrame(loop); }
    };
    img.src=CDN+a.file;
  });
}

document.getElementById("btnPlay").onclick=()=>{
  rotateDirs=!rotateDirs;
  const b=document.getElementById("btnPlay");
  b.textContent=rotateDirs?"⏸ Pause dir":"▶ Auto dir";
  b.classList.toggle("on", rotateDirs);
  lastDirSwitch=performance.now();
};
document.getElementById("btnPrev").onclick=()=>{ dirIndex=(dirIndex+7)%8; syncUI(); };
document.getElementById("btnNext").onclick=()=>{ dirIndex=(dirIndex+1)%8; syncUI(); };
document.getElementById("btnZoomIn").onclick=()=>{ userZoom=Math.min(5.5,userZoom+0.3); };
document.getElementById("btnZoomOut").onclick=()=>{ userZoom=Math.max(0.7,userZoom-0.3); };
document.getElementById("btnBigger").onclick=()=>{ charH=Math.min(200,charH+12); };
document.getElementById("btnSmaller").onclick=()=>{ charH=Math.max(48,charH-12); };
document.getElementById("btnReset").onclick=()=>{ userZoom=2.2; charH=110; panX=0; panY=0; };

let touch={mode:null,sx:0,sy:0,panX0:0,panY0:0,pinch0:1,zoom0:1};
canvas.addEventListener("touchstart",e=>{
  if(e.touches.length>=2){
    touch.mode="pinch";
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    touch.pinch0=Math.hypot(dx,dy)||1; touch.zoom0=userZoom;
  } else {
    touch.mode="pan";
    touch.sx=e.touches[0].clientX; touch.sy=e.touches[0].clientY;
    touch.panX0=panX; touch.panY0=panY;
  }
},{passive:true});
canvas.addEventListener("touchmove",e=>{
  if(touch.mode==="pinch"&&e.touches.length>=2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    userZoom=Math.max(0.7,Math.min(5.5, touch.zoom0*((Math.hypot(dx,dy)||1)/touch.pinch0)));
    e.preventDefault();
  } else if(touch.mode==="pan"&&e.touches.length===1){
    panX=touch.panX0+(e.touches[0].clientX-touch.sx);
    panY=touch.panY0+(e.touches[0].clientY-touch.sy);
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  userZoom=Math.max(0.7,Math.min(5.5,userZoom+(e.deltaY<0?0.2:-0.2)));
},{passive:false});
window.addEventListener("resize", layout);

loadAll();
</script>
</body>
</html>
