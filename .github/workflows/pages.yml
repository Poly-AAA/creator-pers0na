name: Deploy Typons preview
on:
  push:
    branches: [cursor/atelier-mobile-diy-aaa8, main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/mockups _site/diy
          cp atelier.html _site/index.html
          cp atelier.html _site/atelier.html
          cp -r mockups/* _site/mockups/ || true
          cp -r diy/* _site/diy/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
