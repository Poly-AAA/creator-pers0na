<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Combat Fantasy</title>
<script src="js/fantasy-combat-bridge.js"></script>
<style>
  :root{
    --bg:#ecece8; --bg2:#f5f5f2; --ink:#555552; --ink2:#8e8e8a;
    --line:#c6c6c2; --line2:#dcdcd8; --card:#fafaf8; --tap:48px;
    --sel:#3d3d3a; --soft:#f0f0ec;
    --ok:#2f6f4e; --warn:#8a5a2b; --bad:#8a3030;
    --atk:#8a4040; --def:#3d5a7a; --sup:#f5f0e6;
    --tile-a:#e4e4de; --tile-b:#d6d6d0; --arena:#d8ddd4;
    --combo:#5b7c99;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.35 Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
  .app{
    height:100%;height:100dvh;max-width:390px;margin:0 auto;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg2),var(--bg) 55%,#e2e2de);
  }

  /* —— Zone jeu (haut, ~58%) —— */
  .game{
    flex:1.25;min-height:0;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#e8ebe3 0%,var(--arena) 55%,#cfd4c8 100%);
  }
  canvas#arena{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
  .top-chips{
    position:absolute;left:10px;right:10px;top:10px;z-index:4;
    display:flex;gap:6px;justify-content:space-between;align-items:center;
    pointer-events:none;
  }
  .chips{display:flex;gap:6px;pointer-events:none}
  .chip{
    pointer-events:none;min-width:52px;padding:6px 10px;border-radius:10px;
    background:rgba(250,250,248,.92);border:1px solid var(--line);font-size:11px;font-weight:600;
    color:var(--sel);display:flex;gap:6px;align-items:baseline;
  }
  .chip span{color:var(--ink2);font-weight:500;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
  .chip b{font-size:13px}
  .chip.low b{color:var(--warn)}
  .chip.zero b{color:var(--bad)}
  .link-cc{
    pointer-events:auto;text-decoration:none;color:var(--ink2);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
    background:rgba(250,250,248,.9);
  }

  /* —— Bandeau status —— */
  .midbar{
    flex-shrink:0;padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .hint{margin:0;font-size:11px;color:var(--ink2);line-height:1.3;flex:1;min-width:0}
  .btn-end{
    flex-shrink:0;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--ok);
    background:var(--ok);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  }
  .btn-end:disabled{opacity:.4}

  /* —— Panel bas (ergonomie maquette) —— */
  .panel{
    flex:0 0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(250,250,248,.97);border-top:1px solid var(--line2);
    border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.05);
    display:flex;flex-direction:column;gap:10px;
  }
  .combo{
    height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line2);overflow:hidden;
  }
  .combo > i{
    display:block;height:100%;width:0%;background:var(--combo);border-radius:inherit;
    transition:width .25s ease;
  }
  .controls{
    display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;
  }
  /* Croix iso 45° (comme Neuro) */
  .dpad-wrap{width:118px;height:118px;margin:0;position:relative}
  .dpad{
    width:100%;height:100%;position:relative;
    transform:rotate(45deg);
  }
  .dpad button{
    position:absolute;width:42px;height:42px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--sel);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.06);padding:0;
  }
  .dpad button:active,.dpad button.on{background:var(--sel);color:#fff}
  .dpad .u{top:8px;left:50%;transform:translateX(-50%)}
  .dpad .d{bottom:8px;left:50%;transform:translateX(-50%)}
  .dpad .l{left:8px;top:50%;transform:translateY(-50%)}
  .dpad .r{right:8px;top:50%;transform:translateY(-50%)}
  .dpad .c{
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:50%;font-size:11px;background:var(--soft);
  }
  .dpad .glyph{transform:rotate(-45deg);display:block;line-height:1}

  .spell-pane{display:flex;flex-direction:column;gap:6px;min-width:0}
  .spells{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:36px;
  }
  .spells button{
    min-height:52px;border-radius:12px;border:1px solid var(--line);
    background:var(--soft);color:var(--ink);font-size:11px;cursor:pointer;
    padding:6px 7px;text-align:left;line-height:1.15;display:flex;flex-direction:column;gap:2px;
  }
  .spells button small{
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;
  }
  .spells button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  .spells button.on small{color:#cfcfc8}
  .spells button:disabled{opacity:.38}
  .spells button.lock{opacity:.45;font-style:normal}
  .status{font-size:10px;color:var(--ink2);text-align:center;min-height:1.2em}

  /* Évo overlay */
  .evo-ov{
    position:fixed;inset:0;z-index:40;background:rgba(40,42,38,.55);
    display:none;align-items:flex-end;justify-content:center;padding:12px;
  }
  .evo-ov.on{display:flex}
  .evo-card{
    width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);
    border-radius:18px 18px 12px 12px;padding:14px;box-shadow:0 -8px 28px rgba(0,0,0,.12);
  }
  .evo-card h2{margin:0 0 4px;font-size:15px;color:var(--sel)}
  .evo-card .sub{margin:0 0 10px;font-size:12px;color:var(--ink2)}
  .evo-opts{display:flex;flex-direction:column;gap:8px}
  .evo-opts button{
    text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:12px;
    padding:10px 12px;cursor:pointer;color:var(--ink);
  }
  .evo-opts button b{display:block;font-size:13px;color:var(--sel);margin-bottom:2px}
  .evo-opts button span{font-size:11px;color:var(--ink2)}
  .evo-opts button:active{background:var(--sel);color:#fff}
  .evo-opts button:active span{color:#cfcfc8}
</style>
</head>
<body>
<div class="app">
  <section class="game" aria-label="Zone de jeu">
    <div class="top-chips">
      <div class="chips">
        <div class="chip"><span>PV</span><b id="hudPv">—</b></div>
        <div class="chip" id="chipPa"><span>PA</span><b id="hudPa">—</b></div>
        <div class="chip" id="chipPm"><span>PM</span><b id="hudPm">—</b></div>
      </div>
      <div style="display:flex;gap:6px;pointer-events:auto">
        <a class="link-cc" href="#" id="btnEvo">Évo</a>
        <a class="link-cc" href="#" id="btnRestart" title="Relancer un combat">Relancer</a>
        <a class="link-cc" data-fcc="spell" href="spell-editor.html">Sorts</a>
        <a class="link-cc" data-fcc="anims" href="fantasy-weapon-anim.html">Anims</a>
        <a class="link-cc" data-fcc="dirs" href="fantasy-dir-calibrate.html">Dirs</a>
        <a class="link-cc" data-fcc="creator" href="character-creator-fantasy.html">Créateur</a>
      </div>
    </div>
    <canvas id="arena" width="390" height="480" aria-label="Arène isométrique"></canvas>
  </section>

  <div class="midbar">
    <p class="hint" id="spellHint">Croix = déplacement iso · centre = lancer</p>
    <button type="button" class="btn-end" id="btnEnd">Fin de tour</button>
  </div>

  <section class="panel" aria-label="Commandes">
    <div class="combo" title="Fenêtre combo"><i id="comboFill"></i></div>
    <div class="controls">
      <div class="dpad-wrap">
        <div class="dpad" id="dpad">
          <button type="button" class="u" data-dir="u" aria-label="Iso NE"><span class="glyph">▲</span></button>
          <button type="button" class="l" data-dir="l" aria-label="Iso NW"><span class="glyph">◀</span></button>
          <button type="button" class="c" data-dir="c" aria-label="Lancer"><span class="glyph">●</span></button>
          <button type="button" class="r" data-dir="r" aria-label="Iso SE"><span class="glyph">▶</span></button>
          <button type="button" class="d" data-dir="d" aria-label="Iso SW"><span class="glyph">▼</span></button>
        </div>
      </div>
      <div class="spell-pane">
        <div class="spells" id="spellList" aria-label="Sorts équipés"></div>
      </div>
    </div>
    <div class="status" id="status">…</div>
  </section>
</div>

<div class="evo-ov" id="evoOv" aria-hidden="true">
  <div class="evo-card">
    <h2 id="evoTitle">Évolution</h2>
    <p class="sub" id="evoSub">Choisis 1 effet (cumulable · max 2 paliers)</p>
    <div class="evo-opts" id="evoOpts"></div>
    <button type="button" class="btn-end" id="evoSkip" style="margin-top:12px;width:100%">Passer · prochain combat</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  function wireFccNav(){
    const nav=Object.assign({}, window.FCC_NAV||{});
    try{
      const stored=JSON.parse(localStorage.getItem("neuro.fccNav")||"{}");
      Object.keys(stored).forEach(k=>{ if(!nav[k]) nav[k]=stored[k]; });
    }catch(_e){}
    document.querySelectorAll("[data-fcc]").forEach(el=>{
      const k=el.getAttribute("data-fcc");
      if(nav[k]) el.href=nav[k];
      else if(el.href && /^https?:\/\//.test(el.href)) nav[k]=el.href;
    });
    try{ localStorage.setItem("neuro.fccNav", JSON.stringify(nav)); }catch(_e){}
    return nav;
  }
  wireFccNav();

  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@main/assets/packs/fantasy-cc/";
  const FW=128, FH=128, COLS=15, FPS=14;
  const KEY_LOOK = "neuro.fantasyLook";
  const KEY_DIR = "neuro.fantasyDirRow";
  const KEY_DIR_SHEETS = "neuro.fantasyDirRow.sheets";
  const KEY_DIR_VER = "neuro.fantasyDirRow.ver";
  const DIR_CAL_VER = "cal-2026-08-12";
  /* Calibrage utilisateur : ligne sheet → face écran (0=N…7=NW) */
  const DEFAULT_DIR_ROW = [2,3,4,5,6,7,0,1];
  const DEFAULT_DIR_SHEETS = {
    Walk:DEFAULT_DIR_ROW.slice(), Run:DEFAULT_DIR_ROW.slice(),
    RunBackwards:DEFAULT_DIR_ROW.slice(), StrafeLeft:DEFAULT_DIR_ROW.slice(),
    StrafeRight:DEFAULT_DIR_ROW.slice(), CrouchRun:DEFAULT_DIR_ROW.slice(),
    Attack1:DEFAULT_DIR_ROW.slice(), Attack2:DEFAULT_DIR_ROW.slice(),
    Attack3:DEFAULT_DIR_ROW.slice(), Attack4:DEFAULT_DIR_ROW.slice(),
    Attack5:DEFAULT_DIR_ROW.slice(), Attack6:DEFAULT_DIR_ROW.slice(),
    AttackRun:DEFAULT_DIR_ROW.slice(), AttackRun2:DEFAULT_DIR_ROW.slice(),
    Kick:DEFAULT_DIR_ROW.slice(), Special1:DEFAULT_DIR_ROW.slice(),
    Idle:DEFAULT_DIR_ROW.slice()
  };

  /* Iso Neuro : +c = SE écran, +r = SW écran — map + caméra qui suit */
  const GRID = 10;
  const TILE_W = 56, TILE_H = 28;
  const VIEW_TILES = 8; /* ~tuiles visibles en largeur */
  const cam = { ox:0, oy:0, sc:1, fx:2, fy:5, smooth:0.22, _w:0, _h:0 };
  let TILE_ORDER = null;
  function ensureTileOrder(){
    if(TILE_ORDER) return TILE_ORDER;
    const order=[];
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) order.push({c,r,sum:c+r});
    order.sort((a,b)=>a.sum-b.sum || a.c-b.c);
    TILE_ORDER = order;
    return TILE_ORDER;
  }
  let lastEnemySig = "";

  /*
   * Sheet fantasy-cc : mapping ligne→direction écran (calibrable par action).
   * Face iso : atan2(sx, -sy) avec sx=dc-dr, sy=dc+dr.
   */
  const DIR_LABEL = ["N","NE","E","SE","S","SW","W","NW"];
  let DIR_ROW = DEFAULT_DIR_ROW.slice();
  let DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);
  try{
    const ver = localStorage.getItem(KEY_DIR_VER);
    if(ver === DIR_CAL_VER){
      const raw = localStorage.getItem(KEY_DIR);
      if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length===8) DIR_ROW=a.map(n=>n&7); }
      const sheets = localStorage.getItem(KEY_DIR_SHEETS);
      if(sheets){
        const o=JSON.parse(sheets);
        if(o&&typeof o==="object"){
          for(const k of Object.keys(o)){
            if(Array.isArray(o[k])&&o[k].length===8) DIR_SHEETS[k]=o[k].map(n=>n&7);
          }
        }
      }
    } else {
      /* force calibrage validé (écrase ancien mapping identité) */
      localStorage.setItem(KEY_DIR, JSON.stringify(DEFAULT_DIR_ROW));
      localStorage.setItem(KEY_DIR_SHEETS, JSON.stringify(DEFAULT_DIR_SHEETS));
      localStorage.setItem(KEY_DIR_VER, DIR_CAL_VER);
      DIR_ROW = DEFAULT_DIR_ROW.slice();
      DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);
    }
  }catch(_e){}
  function dirMapForAnim(anim){
    if(anim && DIR_SHEETS[anim]) return DIR_SHEETS[anim];
    /* fallback : famille d’anim */
    if(anim && /^Attack|^Kick|^Special/i.test(anim) && DIR_SHEETS.Attack1) return DIR_SHEETS.Attack1;
    if(anim && /^(Walk|Run|Strafe|Crouch)/i.test(anim) && DIR_SHEETS.Walk) return DIR_SHEETS.Walk;
    return DIR_ROW;
  }
  function sheetRowForDir(dir, anim){
    const m = dirMapForAnim(anim);
    const f=dir&7;
    for(let r=0;r<8;r++) if(m[r]===f) return r;
    return f;
  }
  function dirFromIsoDelta(dc, dr){
    if(!dc && !dr) return null;
    const sx = dc - dr, sy = dc + dr;
    let i = Math.round(Math.atan2(sx, -sy) / (Math.PI/4));
    if(i < 0) i += 8;
    return i & 7;
  }

  const PAD_VEC = { u:{dc:0,dr:-1}, r:{dc:1,dr:0}, d:{dc:0,dr:1}, l:{dc:-1,dr:0} };

  const DEFAULT_COLORS = {
    body:"#d4a574", shoes:"#3a3230", legs:"#3e4f63", chest:"#5b7c99",
    belt:"#8b6914", gloves:"#6a5a4e", offhand:"#6b8f71", weapon:"#9aa8b8",
    backpack:"#7a5c3a", head:"#e0b878", slash:"#e8590c", effect:"#5ec8ff", mount:"#8a7060",
  };

  const SPELLS = [
    { id:"punch", name:"Coup brut", cost:2, range:1, aoe:0, dmg:[8,12], anim:"Attack2", type:"damage" },
    { id:"monofil", name:"Lame spectrale", cost:3, range:1, aoe:0, dmg:[14,18], anim:"Attack3", type:"damage" },
    { id:"arc", name:"Éclair runique", cost:3, range:4, aoe:0, dmg:[10,15], anim:"Attack1", type:"damage" },
    { id:"surchauffe", name:"Brasier", cost:4, range:3, aoe:1, dmg:[16,22], anim:"Attack5", type:"damage" },
    { id:"parasite", name:"Maléfice", cost:4, range:4, aoe:0, dmg:[12,18], anim:"Attack3", type:"damage", effect:"drainPA" },
    { id:"gravite", name:"Poussée tellurique", cost:4, range:3, aoe:1, dmg:[8,12], anim:"Special1", type:"damage", effect:"push" },
    { id:"nanites", name:"Soin de lumière", cost:4, range:0, aoe:0, heal:[15,15], anim:"Special1", type:"heal" },
    { id:"drone", name:"Familier", cost:5, range:0, aoe:0, anim:"Special1", type:"summon" },
    { id:"tir_magnetique", name:"Flèche runique", cost:3, range:6, aoe:0, dmg:[12,16], anim:"Attack1", type:"damage", effect:"push" },
    { id:"impact_cinetique", name:"Frappe du titan", cost:4, range:2, aoe:0, dmg:[18,24], anim:"Attack3", type:"damage", effect:"push" },
    { id:"bombe_thermique", name:"Orbe de feu", cost:5, range:5, aoe:1, dmg:[22,30], anim:"Attack3", type:"damage" },
    { id:"lance_flammes", name:"Souffle de dragon", cost:4, range:3, aoe:0, dmg:[15,21], anim:"Attack5", type:"damage" },
    { id:"impulsion_emp", name:"Décharge scramble", cost:4, range:5, aoe:1, dmg:[10,14], anim:"Attack5", type:"damage", effect:"drainPA" },
    { id:"tempete_tesla", name:"Tempête céleste", cost:5, range:5, aoe:1, dmg:[18,26], anim:"Special1", type:"damage" },
    { id:"piratage_neural", name:"Emprise mentale", cost:4, range:6, aoe:0, dmg:[10,15], anim:"Attack3", type:"damage", effect:"drainPA" },
    { id:"rupture_synaptique", name:"Brisure d’âme", cost:4, range:4, aoe:0, dmg:[17,23], anim:"Attack6", type:"damage" },
    { id:"compression", name:"Étreinte arcanique", cost:4, range:5, aoe:0, dmg:[12,16], anim:"Special1", type:"damage", effect:"push" },
    { id:"distorsion", name:"Faille", cost:5, range:6, aoe:0, dmg:[14,18], anim:"Special1", type:"damage", effect:"push" },
    { id:"armure_nanites", name:"Bouclier sacré", cost:4, range:0, aoe:0, heal:[22,22], anim:"Special1", type:"heal" },
    { id:"reconstruction", name:"Bénédiction", cost:5, range:0, aoe:0, heal:[30,30], anim:"Special1", type:"heal" },
    { id:"teleport", name:"Pas de brume", cost:3, range:0, aoe:0, anim:"Special1", type:"buff" },
    { id:"dash", name:"Charge du sanglier", cost:2, range:4, aoe:0, dmg:[10,14], anim:"AttackRun", type:"damage" },
    { id:"swap", name:"Échange de places", cost:3, range:5, aoe:0, anim:"Special1", type:"buff" },
    { id:"gravjump", name:"Bond céleste", cost:4, range:0, aoe:0, anim:"Special1", type:"buff" },
    { id:"mine", name:"Rune piégée", cost:2, range:2, aoe:0, dmg:[12,16], anim:"Kick", type:"damage" },
    { id:"turret", name:"Totem de garde", cost:4, range:0, aoe:0, anim:"Special1", type:"summon" },
    { id:"sniper", name:"Œil de faucon", cost:5, range:6, aoe:0, dmg:[16,22], anim:"Attack1", type:"damage" },
    { id:"bouclier", name:"Égide", cost:3, range:0, aoe:0, heal:[8,12], anim:"Special1", type:"shield" },
    { id:"overclock", name:"Ivresse de bataille", cost:2, range:0, aoe:0, anim:"Taunt", type:"buff" },
    { id:"double", name:"Sosie", cost:3, range:0, aoe:0, anim:"Special1", type:"clone", dmg:[8,12] },
    { id:"invisibilite", name:"Voile d’ombre", cost:3, range:0, aoe:0, anim:"Special1", type:"buff", invisTurns:2 },
  ];
  function spellById(id){
    const base = SPELLS.find(s=>s.id===id) || null;
    const custom = customSpellById(id);
    if(!base && !custom) return null;
    if(!custom) return base;
    if(!base) return custom;
    return Object.assign({}, base, custom);
  }

  const KEY_EVO = "neuro.fantasySpellEvo";
  const KEY_CUSTOM_SPELLS = "neuro.customSpells";
  let spellEvo = {};
  let customSpells = [];
  try{
    const raw = localStorage.getItem(KEY_EVO);
    if(raw) spellEvo = JSON.parse(raw) || {};
  }catch(_e){}
  try{
    const rawCs = localStorage.getItem(KEY_CUSTOM_SPELLS);
    if(rawCs) customSpells = JSON.parse(rawCs) || [];
  }catch(_e){}
  function importCustomSpellsFromHash(){
    const m=(location.hash||"").match(/fccSpells=([^&]+)/);
    if(!m) return false;
    try{
      const raw=decodeURIComponent(m[1]);
      const arr=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!Array.isArray(arr)) return false;
      customSpells=arr;
      localStorage.setItem(KEY_CUSTOM_SPELLS, JSON.stringify(arr));
      try{ sessionStorage.setItem(KEY_CUSTOM_SPELLS, JSON.stringify(arr)); }catch(_e){}
      return true;
    }catch(_e){ return false; }
  }
  importCustomSpellsFromHash();
  function saveEvo(){ try{ localStorage.setItem(KEY_EVO, JSON.stringify(spellEvo)); }catch(_e){} }
  function evoState(id){
    if(!spellEvo[id]) spellEvo[id] = { tiersTaken:0, evo:{} };
    return spellEvo[id];
  }
  function customSpellById(id){ return customSpells.find(s=>s.id===id) || null; }
  function reloadCustomSpells(){
    try{
      const raw = localStorage.getItem(KEY_CUSTOM_SPELLS);
      if(raw){
        const parsed = JSON.parse(raw) || [];
        if(Array.isArray(parsed) && parsed.length) customSpells = parsed;
      }
    }catch(_e){}
    if(!customSpells.length){
      try{
        const raw = sessionStorage.getItem(KEY_CUSTOM_SPELLS);
        if(raw) customSpells = JSON.parse(raw) || [];
      }catch(_e){}
    }
  }
  function normalizeCastStep(step){
    if(typeof step==="string") return { anim:step, delay:0, fps:14, slash:"None", effect:"None" };
    return {
      anim: step.anim || "Attack1",
      delay: step.delay != null ? step.delay : 0,
      fps: step.fps != null ? step.fps : 14,
      slash: step.slash || "None",
      effect: step.effect || "None",

    if(st.evo && st.evo.anim){

      return [normalizeCastStep({

        slash: fx && /^Slash/i.test(fx) ? fx : "None",
        effect: fx && /^Effect/i.test(fx) ? fx : "None",

    if(custom && custom.evoConfig && typeof FantasyBridge!=="undefined" && FantasyBridge.buildEvoAnimSteps){

  function playCastAnimChain(sp, onDone){

      const step = steps[i++];

      G.player.stepFps = step.fps || 14;
      G.castFx = {

  function rollEnemyLayers(strategy){

    else if(strategy==="caster") weapons = ENEMY_WEAPONS.filter(w=>/^Magic/i.test(w));
    else if(strategy==="bruiser" || strategy==="assassin") weapons = ENEMY_WEAPONS.filter(w=>/^Melee/i.test(w));
    else if(strategy==="skirmisher") weapons = ENEMY_WEAPONS.filter(w=>/^Melee|^Ranged/i.test(w));
    if(!weapons.length) weapons = ENEMY_WEAPONS;
    const weapon = pick(weapons);
    const off = strategy==="bruiser" || strategy==="controller"
      ? pick(["Shield1","Shield2","Offhand1","None"])
      : pick(ENEMY_OFFHAND);
    const tintBody = pick(ENEMY_TINTS);
    const layers = [
      {folder:"NakedBody", tint:tintBody, alpha:1},
      {folder:pick(ENEMY_LEGS), tint:null, alpha:1},
      {folder:pick(ENEMY_CHESTS), tint:null, alpha:1},
    ];

  function pickEnemyStrategy(){

  function rollEnemySpells(weapon, strategy){
    const dmgPool = ENEMY_SPELL_POOL.slice();
    let prefer = dmgPool;
    if(strategy==="sniper" || /^Ranged/i.test(weapon))
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range>=3; });
    else if(strategy==="caster" || /^Magic/i.test(weapon))
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && (s.range>=2 || s.aoe); });
    else if(strategy==="assassin")
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range<=2 && enemySpellDmgAvg(s)>=12; });
    else if(strategy==="bruiser")
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range<=2; });
    if(!prefer.length) prefer = dmgPool;

    const out = [];
    const used = new Set();
    const add = (id)=>{ if(id && !used.has(id) && spellById(id)){ used.add(id); out.push(id); } };

    if(strategy==="controller"){
      add(pick(ENEMY_CTRL_POOL));
      add(pick(ENEMY_CTRL_POOL));
    }
    if(strategy==="skirmisher") add(pick(ENEMY_MOBILE_POOL));
    if(strategy==="bruiser" || strategy==="caster"){
      if(Math.random()<0.55) add(pick(ENEMY_SUPPORT_POOL));
    }
    if(strategy==="assassin" && Math.random()<0.4) add("dash");

    const n = 2 + Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      const avail = prefer.filter(x=>!used.has(x));
      const src = avail.length ? avail : dmgPool.filter(x=>!used.has(x));
      if(!src.length) break;
      add(pick(src));
    }
    if(!out.some(id=>{ const s=spellById(id); return s && s.dmg; }))
      add(pick(prefer) || "punch");
    return out;
  }

  function enemySpellDmgAvg(sp){

  function strategyProfile(strategy, spells){

    const profiles = {
      bruiser:   { preferMin:1, preferMax:1, kiteBelow:0, retreatHp:0.2, supportFirst:true, label:"charge" },
      sniper:    { preferMin:Math.max(3,maxR-1), preferMax:maxR, kiteBelow:2, retreatHp:0.35, supportFirst:false, label:"tire" },
      caster:    { preferMin:2, preferMax:Math.max(3,maxR), kiteBelow:1, retreatHp:0.4, supportFirst:true, label:"incante" },
      skirmisher:{ preferMin:1, preferMax:2, kiteBelow:0, retreatHp:0.45, supportFirst:false, hitAndRun:true, label:"harcèle" },
      controller:{ preferMin:2, preferMax:Math.max(3,maxR), kiteBelow:1, retreatHp:0.3, supportFirst:true, controlFirst:true, label:"contrôle" },
      assassin:  { preferMin:1, preferMax:1, kiteBelow:0, retreatHp:0.25, supportFirst:false, waitForKill:true, label:"frappe" },
    };
    return profiles[strategy] || profiles.bruiser;
  }

  function startNextFight(opts){
    opts = opts || {};
    if(G.awaitingNext && !opts.force) return;
    G.awaitingNext = false;
    try{ closeEvo(); }catch(_e){}
    try{ if(!opts.keepLook) loadLook(); }catch(_e){}
    lastLookSig = lookSig();
    G.clone = null;
    G.busy = false;
    G.armed = null; G.armedSlot = null;
    G.castFx = null;
    G.combo = Math.max(0, Math.floor(G.combo * 0.35));
    if(!opts.keepFightN) G.fightN = (G.fightN|0) + 1;

    /* joueur : soin partiel + reset PA/PM, reste en vie */
    const p = G.player;
    p.alive = true;
    if(p.anim==="Die") playAnim(p,"Idle");
    const heal = opts.fullHeal ? p.pvMax : Math.max(12, Math.floor(p.pvMax*0.35));
    p.pv = Math.min(p.pvMax, Math.max(p.pv, 1) + (opts.fullHeal ? p.pvMax : heal));
    if(opts.fullHeal) p.pv = p.pvMax;
    p.shield = 0;
    p.invis = 0;
    p.c = 2; p.r = Math.floor(GRID/2); p.dir = 3;
    cam.fx = p.c; cam.fy = p.r;
    p.pmMax = playerBasePm();
    playAnim(p, "Idle");

    try{ G.enemy = makeEnemy(1); }catch(_e){
      G.enemy = { c:GRID-3, r:Math.max(1,Math.floor(GRID/2)-1), dir:7, pv:55, pvMax:55, pa:4, paMax:4, pm:4, pmMax:4, anim:"Idle", frame:0, t0:0, flash:0, alive:true, name:"Bandit", strategy:"bruiser", profile:strategyProfile("bruiser",["punch"]), layers:[{folder:"NakedBody",tint:"#8a6060",alpha:1},{folder:"Head3",tint:null,alpha:1},{folder:"Melee2",tint:null,alpha:1}], spells:["punch","monofil"], weaponAnim:"Attack1", shield:0 };
    }
    try{
      warmFolders((G.enemy.layers||[]).map(L=>L.folder), { mounted: !!G.enemy.mount });
      const atk = (G.enemy.spells||[]).map(spellById).filter(Boolean).map(s=>s.anim||G.enemy.weaponAnim).filter(Boolean);
      for(const a of new Set(atk.concat([G.enemy.weaponAnim||"Attack1"]))){
        for(const L of (G.enemy.layers||[])) loadImg(L.folder, a);
      }
    }catch(_e){}
    const spellNames = (G.enemy.spells||[]).map(id=>{ const s=spellById(id); return s?s.name:id; }).join(" · ");
    const sty = (G.enemy.profile && G.enemy.profile.label) || G.enemy.strategy || "?";
    const mountBit = G.enemy.mount ? " · monté" : "";
    setStatus("Combat "+G.fightN+" · "+G.enemy.name+" ("+sty+mountBit+") · "+spellNames);
    G.turn = "player";

  function lookSig(){
    try{ return JSON.stringify(lookState.look||{})+"|"+(lookState.bodies||[]).map(b=>b&&b.folder).join(","); }
    catch(_e){ return ""; }
  }
  let lastLookSig = "";
  function applyLookPayload(o){
    if(!o || !o.look) return false;
    lookState.look = o.look;
    if(o.colors) lookState.colors = Object.assign({}, DEFAULT_COLORS, o.colors);
    else lookState.colors = Object.assign({}, DEFAULT_COLORS);
    if(o.bodies && o.bodies.length) lookState.bodies = o.bodies;
    else if(o.look.body) lookState.bodies = [{folder:o.look.body, opacity:1, color:lookState.colors.body}];
    return true;
  }
  function loadLookFromHash(){
    try{
      const h = (location.hash||"").replace(/^#/,"");
      if(!h) return false;
      const parts = h.split("&");
      let packed = null;
      for(const p of parts){
        if(p.indexOf("fccLook=")===0) packed = p.slice(8);
      }
      if(!packed) return false;
      const o = JSON.parse(decodeURIComponent(packed));
      if(!applyLookPayload(o)) return false;
      try{ localStorage.setItem(KEY_LOOK, JSON.stringify(o)); }catch(_e){}
      try{ history.replaceState(null, "", location.pathname + location.search); }catch(_e){}
      return true;
    }catch(_e){ return false; }
  }
  function loadLook(){
    if(loadLookFromHash()) return true;
    try{
      const raw = localStorage.getItem(KEY_LOOK);
      if(!raw) return false;
      const o = JSON.parse(raw);
      return applyLookPayload(o);
    }catch(_e){ return false; }
  }
  function defaultLook(){

      body:"NakedBody", chest:"Chest1", legs:"Legs1", shoes:"Shoes1",

  function folder(id){

  function tint(id){

  function loadImg(folderName, anim){
    const key = folderName+"/"+anim;
    if(cache.has(key)) return Promise.resolve(cache.get(key));
    if(cacheP.has(key)) return cacheP.get(key);
    const p = new Promise((resolve)=>{
      const rel = `spritesheets/${folderName}/${anim}.png`;
      const urls = [];
      if(folderName==="Head25"){
        urls.push(`hat-refs/Head25/${anim}.png`);
        urls.push(`assets/packs/fantasy-cc/spritesheets/Head25/${anim}.png`);
      }
      urls.push(BASE_CDN+rel, BASE_LOCAL+rel);
      let i=0, useCors=true;
      const tryOne=()=>{
        if(i>=urls.length){
          if(useCors){ useCors=false; i=0; tryOne(); return; }
          resolve(null); return;
        }
        const im = new Image();
        if(useCors){ try{ im.crossOrigin="anonymous"; }catch(_e){} }
        im.onload=()=>{ cache.set(key, im); resolve(im); };
        im.onerror=()=>{ i++; tryOne(); };
        im.src=urls[i++];
      };
      tryOne();
    });
    cacheP.set(key, p);
    return p;
  }
  function getImg(folderName, anim){ return cache.get(folderName+"/"+anim)||null; }

  function layersForRow(row){
    const L=[];
    L.push({folder:(catalog&&catalog.shadowFolder)||"Shadow", tint:null, alpha:1});
    for(const b of lookState.bodies){
      if(!b||!b.folder) continue;
      const t = (b.color && b.color!=="#ffffff") ? b.color : tint("body");
      L.push({folder:b.folder, tint:t, alpha:Math.max(0,Math.min(1,+b.opacity||1))});
    }
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folder(id); if(f) L.push({folder:f, tint:tint(id), alpha:1});
    }
    const shield=folder("offhand"), weapon=folder("weapon"), bag=folder("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tint("offhand"),alpha:1}); if(weapon) mid.push({folder:weapon,tint:tint("weapon"),alpha:1}); }
    else { if(weapon) mid.push({folder:weapon,tint:tint("weapon"),alpha:1}); if(shield) mid.push({folder:shield,tint:tint("offhand"),alpha:1}); }
    if(bag){ const item={folder:bag,tint:tint("backpack"),alpha:1}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folder(id); if(f) L.push({folder:f,tint:tint(id),alpha:1}); }
    /* FX d’évo temporaire au cast */
    if(G.castFx && performance.now() < G.castFx.until){
      if(G.castFx.slash) L.push({folder:G.castFx.slash, tint:tint("slash"), alpha:0.95});
      if(G.castFx.effect) L.push({folder:G.castFx.effect, tint:tint("effect"), alpha:0.9});
    } else if(G.castFx && performance.now() >= G.castFx.until){
      G.castFx = null;
    }
    const mount=folder("mount"); if(mount) L.unshift({folder:mount,tint:tint("mount"),alpha:1});
    return L.filter(x=>x.folder);
  }

  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex,alpha){
    const a=(alpha==null)?1:alpha;
    ctx.save(); ctx.globalAlpha=a;
    if(!tintHex){ ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); ctx.restore(); return; }
    const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
    if(tintCv.width!==tw) tintCv.width=tw;
    if(tintCv.height!==th) tintCv.height=th;
    const t=tintCx;
    t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation="source-over"; t.globalAlpha=1;
    t.clearRect(0,0,tw,th); t.imageSmoothingEnabled=false;
    t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,tw,th);
    t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="source-over";
    ctx.drawImage(tintCv,dx,dy); ctx.restore();
  }

  function toScreen(c, r){
    return {
      x: cam.ox + (c - r) * (TILE_W/2),
      y: cam.oy + (c + r) * (TILE_H/2)
    };
  }
  function toTile(px, py){
    const x = (px - cam.ox) / (TILE_W/2);
    const y = (py - cam.oy) / (TILE_H/2);
    const c = Math.floor((x + y) / 2);
    const r = Math.floor((y - x) / 2);
    return { c, r };
  }
  function updateCamera(){
    const focus = G.player && G.player.alive
      ? G.player
      : (G.enemy && G.enemy.alive ? G.enemy : { c:cam.fx, r:cam.fy });
    const tc = focus.c, tr = focus.r;
    cam.fx += (tc - cam.fx) * cam.smooth;
    cam.fy += (tr - cam.fy) * cam.smooth;
    if(Math.abs(tc - cam.fx) < 0.02) cam.fx = tc;
    if(Math.abs(tr - cam.fy) < 0.02) cam.fy = tr;
  }
  function fit(){
    const host = canvas.parentElement;
    const w = Math.max(200, host.clientWidth|0);
    const h = Math.max(200, host.clientHeight|0);
    if(cam._w!==w || cam._h!==h){
      cam._w=w; cam._h=h;
      if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
      const viewW = VIEW_TILES * TILE_W;
      const viewH = VIEW_TILES * TILE_H * 0.72;
      const sc = Math.min(w / (viewW + 24), h / (viewH + 48), 1.55);
      cam.sc = Math.max(0.72, sc);
    }
    updateCamera();
    const cx = w / (2 * cam.sc);
    const cy = h / (2 * cam.sc) + 10;
    const px = (cam.fx - cam.fy) * (TILE_W/2);
    const py = (cam.fx + cam.fy) * (TILE_H/2);
    cam.ox = cx - px;
    cam.oy = cy - py;
  }
  function tileInView(c, r){
    /* cull rapide autour du focus caméra */
    const pad = 5;
    return Math.abs(c - cam.fx) <= pad && Math.abs(r - cam.fy) <= pad;
  }

  function key(c,r){ return c+","+r; }
  function inBounds(c,r){ return c>=0&&r>=0&&c<GRID&&r<GRID; }
  function occupied(c,r, skip){
    if(G.player.alive && skip!=="player" && G.player.c===c && G.player.r===r) return "player";
    if(G.enemy.alive && skip!=="enemy" && G.enemy.c===c && G.enemy.r===r) return "enemy";
    if(G.clone && G.clone.alive && skip!=="clone" && G.clone.c===c && G.clone.r===r) return "clone";
    return null;
  }
  function dist(a,b){ return Math.max(Math.abs(a.c-b.c), Math.abs(a.r-b.r)); }

  function recomputeMoves(){
    G.moves.clear();
    if(G.turn!=="player" || G.player.pm<=0 || G.armed) return;
    /* BFS PM (comme Neuro) */
    const distM = {};
    const sk = key(G.player.c, G.player.r);
    distM[sk]=0;
    const q=[{c:G.player.c,r:G.player.r}];
    const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
    while(q.length){
      const cur=q.shift();
      const d=distM[key(cur.c,cur.r)];
      if(d>=G.player.pm) continue;
      for(const [dc,dr] of dirs){
        const nc=cur.c+dc, nr=cur.r+dr;
        if(!inBounds(nc,nr)) continue;
        const k=key(nc,nr);
        if(k in distM) continue;
        if(occupied(nc,nr,"player")) continue;
        distM[k]=d+1;
        G.moves.add(k);
        q.push({c:nc,r:nr});
      }
    }
  }
  function recomputeTargets(){
    G.targets.clear(); G.range.clear(); G.aoe.clear();
    const sp = spellById(G.armed);
    if(!sp || G.turn!=="player") return;
    if(isSelfSpell(sp)){
      G.targets.add(key(G.player.c, G.player.r));
      G.range.add(key(G.player.c, G.player.r));
      return;
    }
    for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++){
      if(dist(G.player,{c,r})<=spellRange(sp)) G.range.add(key(c,r));
    }
    if(!G.enemy.alive) return;
    if(G.range.has(key(G.enemy.c, G.enemy.r))){
      G.targets.add(key(G.enemy.c, G.enemy.r));
      const focus = (G.hover && G.range.has(key(G.hover.c,G.hover.r))) ? G.hover : G.enemy;
      const rad = sp.aoe|0;
      for(let c=focus.c-rad;c<=focus.c+rad;c++) for(let r=focus.r-rad;r<=focus.r+rad;r++){
        if(!inBounds(c,r)) continue;
        if(dist(focus,{c,r})<=rad) G.aoe.add(key(c,r));
      }
    }
  }

  function playAnim(ent, anim){
    let a = anim;
    if(ent === G.player && isPlayerMounted()) a = toRideAnim(anim);
    else if(ent && ent.mount) a = toRideAnim(anim);
    if(ent === G.player) warmAnimForPlayer(a);
    ent.anim = a; ent.frame = 0; ent.t0 = performance.now();
    if(/^Idle$/i.test(a) || /^RideIdle$/i.test(a)) ent.stepFps = null;
  }
  function faceToward(ent, tc, tr){
    const d = dirFromIsoDelta(tc-ent.c, tr-ent.r);
    if(d!=null) ent.dir = d;
  }

  function tryStep(dc, dr){
    if(G.busy || G.turn!=="player" || !G.player.alive) return;
    if(G.armed) return;
    if(G.player.pm<=0){ setStatus("Plus de PM"); return; }
    const c = G.player.c+dc, r = G.player.r+dr;
    if(!inBounds(c,r) || occupied(c,r,"player")){ setStatus("Case bloquée"); return; }
    faceToward(G.player, c, r);
    G.player.c=c; G.player.r=r; G.player.pm-=1;
    playAnim(G.player, randomMoveAnim());
    recomputeMoves(); recomputeTargets(); hud();
    setStatus("Dir "+DIR_LABEL[G.player.dir]+" · −1 PM");
    setTimeout(()=>{
      if(MOVE_ANIMS.includes(G.player.anim) || G.player.anim==="RideRun") playAnim(G.player,"Idle");
    }, 380);
  }

  function roll(arr){ return arr[0] + Math.floor(Math.random()*(arr[1]-arr[0]+1)); }

  /** Chemin BFS jusqu’à une case à portée du sort vers l’ennemi */
  function pathIntoSpellRange(sp){
    if(!G.enemy.alive) return null;
    const maxSteps = G.player.pm;
    const distM = {};
    const prev = {};
    const sk = key(G.player.c, G.player.r);
    distM[sk]=0; prev[sk]=null;
    const q=[{c:G.player.c,r:G.player.r}];
    const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
    let goal=null;
    while(q.length){
      const cur=q.shift();
      if(dist(cur, G.enemy) <= spellRange(sp)){ goal=cur; break; }
      const d=distM[key(cur.c,cur.r)];
      if(d>=maxSteps) continue;
      for(const [dc,dr] of dirs){
        const nc=cur.c+dc, nr=cur.r+dr;
        if(!inBounds(nc,nr)) continue;
        const k=key(nc,nr);
        if(k in distM) continue;
        if(occupied(nc,nr,"player")) continue;
        distM[k]=d+1; prev[k]=key(cur.c,cur.r);
        q.push({c:nc,r:nr});
      }
    }
    if(!goal){
      /* se rapprocher au max */
      let best=null, bd=1e9;
      for(const k of Object.keys(distM)){
        const [c,r]=k.split(",").map(Number);
        const d=dist({c,r}, G.enemy);
        if(d<bd){ bd=d; best={c,r}; }
      }
      goal=best;
    }
    if(!goal || (goal.c===G.player.c && goal.r===G.player.r)) return [];
    const path=[];
    let k=key(goal.c,goal.r);
    while(k){
      const [c,r]=k.split(",").map(Number);
      path.unshift({c,r});
      k=prev[k];
    }
    return path; /* inclut départ */
  }

  function approachThen(sp, onReady){
    const path = pathIntoSpellRange(sp);
    if(!path || path.length<2){ onReady(); return; }
    G.busy=true; hud();
    let i=1;
    const step=()=>{
      if(i>=path.length || G.player.pm<=0){
        G.busy=false; playAnim(G.player,"Idle");
        recomputeMoves(); recomputeTargets(); hud();
        onReady(); return;
      }
      const n=path[i++];
      faceToward(G.player, n.c, n.r);
      G.player.c=n.c; G.player.r=n.r; G.player.pm-=1;
      playAnim(G.player, randomMoveAnim());
      recomputeMoves(); recomputeTargets(); hud();
      setTimeout(step, 240);
    };
    step();
  }

  function finishCastSelf(sp){
    const st = evoState(sp.id);
    const evo = evoBonusesFor(sp);
    const cost = Math.max(1, sp.cost + (evo.cost|0));
    if(G.player.pa < cost){ setStatus("Pas assez de PA"); return; }
    G.player.pa -= cost;
    playCastAnimChain(sp, ()=>{
      if(G.player.anim!=="Die") playAnim(G.player,"Idle");
    });

    if(sp.id==="double"){
      spawnClone(sp, evo);
      setStatus("Sosie invoqué");
    } else if(sp.id==="invisibilite"){
      const turns = 2 + (evo.invisTurns|0);
      G.player.invis = Math.max(G.player.invis||0, turns);
      if(evo.invisPm) G.player.pm = Math.min(G.player.pmMax+2, G.player.pm + (evo.invisPm|0));
      setStatus("Voile d’ombre · "+G.player.invis+" tours");
    } else if(sp.id==="overclock"){
      G.player.pm = Math.min(G.player.pmMax+1, G.player.pm+1);
      setStatus("Ivresse · +1 PM");
    } else if(sp.heal){
      let h = roll(sp.heal) + (evo.heal|0);
      G.player.pv = Math.min(G.player.pvMax, G.player.pv + h);
      if(sp.id==="bouclier" || sp.id==="armure_nanites" || sp.type==="shield"){
        G.player.shield = (G.player.shield||0) + Math.floor(h/2) + (evo.shield|0);
      }
      setStatus((G.armedSlot?G.armedSlot.label+" · ":"")+sp.name+" +"+h+" PV");
    } else {
      G.player.shield = (G.player.shield||0) + 8 + (evo.shield|0);
      setStatus((G.armedSlot?G.armedSlot.label+" · ":"")+sp.name);
    }
    G.combo = Math.min(100, G.combo + 18);
    G.armed=null; G.armedSlot=null;
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
  }

  function spawnClone(sp, evo){
    const p = G.player, e = G.enemy;
    let c = p.c, r = p.r;
    if(e.alive){
      if(e.c !== p.c) c = p.c + Math.sign(e.c - p.c);
      else if(e.r !== p.r) r = p.r + Math.sign(e.r - p.r);
    }
    if(!inBounds(c,r) || occupied(c,r,"player") || (e.alive && e.c===c && e.r===r)){
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for(const [dc,dr] of dirs){
        const nc=p.c+dc, nr=p.r+dr;
        if(inBounds(nc,nr) && !occupied(nc,nr,"player") && !(e.alive && e.c===nc && e.r===nr)){
          c=nc; r=nr; break;
        }
      }
    }
    faceToward(p, c, r);
    G.clone = {
      c, r, dir: p.dir, anim:"Run", frame:0, t0:performance.now(),
      alive:true, alpha:0.42,
      pm: 2 + (evo.clonePm|0),
      dmg: [8 + (evo.cloneDmg|0), 12 + (evo.cloneDmg|0)],
      stun: !!(evo.cloneStun),
      hp: 1 + (evo.cloneHp|0),
    };
    playAnim(G.clone, "Run");
  }

  function tickClone(){
    const cl = G.clone;
    if(!cl || !cl.alive || !G.enemy.alive) return;
    let steps = cl.pm|0;
    while(steps-- > 0){
      if(dist(cl, G.enemy) <= 1){
        /* tacle */
        faceToward(cl, G.enemy.c, G.enemy.r);
        playAnim(cl, "AttackRun");
        let dmg = roll(cl.dmg);
        if(G.enemy.shield>0){ const a=Math.min(G.enemy.shield,dmg); G.enemy.shield-=a; dmg-=a; }
        G.enemy.pv = Math.max(0, G.enemy.pv - dmg);
        G.enemy.flash = performance.now()+180;
        playAnim(G.enemy, G.enemy.pv<=0 ? "Die" : "TakeDamage");
        setStatus("Sosie tacle → "+dmg);
        if(cl.stun){ /* retire 1 PA conceptuel au prochain tour ennemi via flag */ G.enemy._stunned = true; }
        if(G.enemy.pv<=0){ G.enemy.alive=false; setStatus("Victoire · sosie"); onCombatEnd("win"); }
        cl.alive = false; G.clone = null;
        hud();
        return;
      }
      const opts=[];
      if(cl.c!==G.enemy.c) opts.push({c:cl.c+Math.sign(G.enemy.c-cl.c), r:cl.r});
      if(cl.r!==G.enemy.r) opts.push({c:cl.c, r:cl.r+Math.sign(G.enemy.r-cl.r)});
      let moved=false;
      for(const o of opts){
        if(!inBounds(o.c,o.r)) continue;
        if(occupied(o.c,o.r,"player")) continue;
        if(G.enemy.alive && G.enemy.c===o.c && G.enemy.r===o.r) continue;
        faceToward(cl, o.c, o.r);
        cl.c=o.c; cl.r=o.r;
        playAnim(cl, "Run");
        moved=true; break;
      }
      if(!moved) break;
    }
  }

  function finishCastEnemy(sp){
    if(!G.enemy.alive){ setStatus("Plus de cible"); return; }
    const evo = evoBonusesFor(sp);
    if(dist(G.player, G.enemy) > spellRange(sp)){ setStatus("Toujours hors portée"); return; }
    const cost = Math.max(1, sp.cost + (evo.cost|0));
    if(G.player.pa < cost){ setStatus("Pas assez de PA"); return; }
    faceToward(G.player, G.enemy.c, G.enemy.r);
    G.player.pa -= cost;
    playCastAnimChain(sp, ()=>{
      if(G.player.anim!=="Die") playAnim(G.player,"Idle");
    });
    let dmg = roll(sp.dmg || [6,10]) + (evo.dmg|0);
    if(G.player.invis>0 && evo.invisBurst) dmg += evo.invisBurst|0;
    const hits = 1 + (evo.hits|0);
    let total = 0;
    for(let i=0;i<hits;i++) total += dmg;
    if(G.enemy.shield>0){ const a=Math.min(G.enemy.shield,total); G.enemy.shield-=a; total-=a; }
    G.enemy.pv = Math.max(0, G.enemy.pv - total);
    G.enemy.flash = performance.now()+180;
    faceToward(G.enemy, G.player.c, G.player.r);
    playAnim(G.enemy, G.enemy.pv<=0 ? "Die" : "TakeDamage");
    G.combo = Math.min(100, G.combo + 22);
    setStatus((G.armedSlot?G.armedSlot.label+" · ":"")+sp.name+" → "+total);
    if(G.player.invis>0) G.player.invis = 0;
    if(G.enemy.pv<=0){ G.enemy.alive=false; setStatus("Victoire"); onCombatEnd("win"); }
    G.armed=null; G.armedSlot=null;
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
  }

  function tryCastAt(c, r){
    if(G.busy || G.turn!=="player" || !G.armed) return;
    const sp = spellById(G.armed); if(!sp) return;
    if(G.player.pa < sp.cost){ setStatus("Pas assez de PA"); return; }

    if(isSelfSpell(sp)){
      finishCastSelf(sp);
      return;
    }

    if(!G.enemy.alive || G.enemy.c!==c || G.enemy.r!==r){ setStatus("Pas de cible"); return; }
    if(dist(G.player, G.enemy) > spellRange(sp)){
      approachThen(sp, ()=> finishCastEnemy(sp));
      return;
    }
    finishCastEnemy(sp);
  }

  function armSlot(slot){
    if(!slot || slot.locked || !slot.spellId) return;
    const sp = spellById(slot.spellId);
    if(!sp) return;
    G.armed = sp.id;
    G.armedSlot = slot;
    recomputeMoves(); recomputeTargets(); renderSpells();
    if(isSelfSpell(sp)){
      tryCastAt(G.player.c, G.player.r);
      return;
    }
    if(G.enemy.alive && dist(G.player,G.enemy)<=spellRange(sp)){
      tryCastAt(G.enemy.c, G.enemy.r);
    } else if(G.enemy.alive){
      approachThen(sp, ()=> finishCastEnemy(sp));
    } else setStatus(sp.name+" armé");
  }

  /** Centre dpad : sort armé, sinon sort d’arme */
  function autoAttack(){
    if(G.busy || G.turn!=="player" || !G.player.alive) return;
    if(G.armed){ castArmed(); return; }
    const bar = G.spellBar.length ? G.spellBar : refreshSpellBar();
    const slot = bar.find(s=>!s.locked && s.spellId && spellById(s.spellId) && G.player.pa>=spellById(s.spellId).cost)
      || bar.find(s=>!s.locked && s.spellId);
    if(!slot){ setStatus("Aucun sort"); return; }
    armSlot(slot);
  }

  function castArmed(){
    if(G.busy) return;
    if(!G.armed){ autoAttack(); return; }
    const sp = spellById(G.armed);
    if(!sp) return;
    if(isSelfSpell(sp)){ tryCastAt(G.player.c, G.player.r); return; }
    if(G.enemy.alive){
      if(dist(G.player, G.enemy) > spellRange(sp)) approachThen(sp, ()=> finishCastEnemy(sp));
      else tryCastAt(G.enemy.c, G.enemy.r);
    } else setStatus("Cible hors portée");
  }

  function endTurn(){
    if(G.turn!=="player" || G.busy) return;
    G.armed=null; G.armedSlot=null; G.turn="enemy";
    G.combo = Math.max(0, G.combo - 12);
    tickClone();
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
    if(!G.enemy.alive){
      if(!G.awaitingNext) onCombatEnd("win");
      return;
    }
    setStatus("Tour ennemi…");
    setTimeout(enemyTurn, 420);
  }

  function enemySpellDmg(sp){
    return enemySpellDmgAvg(sp) || 6;
  }

  function enemyCanAfford(sp){
    return sp && (G.enemy.pa|0) >= Math.max(1, sp.cost|0);
  }

  function enemyPickSpell(mode){
    const e = G.enemy, p = G.player;
    const ids = (e.spells && e.spells.length) ? e.spells : ["punch"];
    const all = ids.map(spellById).filter(s=>s && enemyCanAfford(s));
    if(!all.length) return null;
    const prof = e.profile || strategyProfile(e.strategy||"bruiser", e.spells);
    const d = dist(e,p);

    if(mode==="support" || (prof.supportFirst && e.pv < e.pvMax * 0.55)){
      const sup = all.filter(s=>s.heal || s.type==="shield" || s.type==="heal");
      if(sup.length && (!(e.shield>0) || e.pv < e.pvMax*0.4)) return pick(sup);
    }
    if(mode==="control" || prof.controlFirst){
      const ctrl = all.filter(s=>s.effect && dist(e,p)<=(s.range|0));
      if(ctrl.length) return ctrl.sort((a,b)=>(b.range|0)-(a.range|0))[0];
    }

    const dmg = all.filter(s=>s.dmg);
    const inRange = dmg.filter(s=>d <= (s.range|0));
    if(inRange.length){
      if(prof.waitForKill){
        inRange.sort((a,b)=> enemySpellDmg(b)-enemySpellDmg(a));
        return inRange[0];
      }
      inRange.sort((a,b)=> enemySpellDmg(b)-enemySpellDmg(a) || (a.cost|0)-(b.cost|0));
      return inRange[0];
    }
    dmg.sort((a,b)=> (b.range|0)-(a.range|0) || enemySpellDmg(b)-enemySpellDmg(a));
    return dmg[0] || all[0];
  }

  function enemyStepToward(goalC, goalR){
    const e = G.enemy;
    if((e.pm|0) <= 0) return false;
    const opts=[];
    if(e.c!==goalC) opts.push({c:e.c+Math.sign(goalC-e.c), r:e.r});
    if(e.r!==goalR) opts.push({c:e.c, r:e.r+Math.sign(goalR-e.r)});
    opts.sort((a,b)=> dist(a,{c:goalC,r:goalR}) - dist(b,{c:goalC,r:goalR}));
    for(const o of opts){
      if(!inBounds(o.c,o.r) || occupied(o.c,o.r,"enemy")) continue;
      if(G.player.alive && G.player.c===o.c && G.player.r===o.r) continue;
      if(G.clone && G.clone.alive && G.clone.c===o.c && G.clone.r===o.r) continue;
      faceToward(e, o.c, o.r);
      e.c=o.c; e.r=o.r; e.pm -= 1;
      playAnim(e, "Run");
      return true;
    }
    return false;
  }

  function enemyStepAway(fromC, fromR){
    const e = G.enemy;
    if((e.pm|0) <= 0) return false;
    const opts=[
      {c:e.c+1,r:e.r},{c:e.c-1,r:e.r},{c:e.c,r:e.r+1},{c:e.c,r:e.r-1}
    ].filter(o=>inBounds(o.c,o.r) && !occupied(o.c,o.r,"enemy")
      && !(G.player.alive && G.player.c===o.c && G.player.r===o.r));
    opts.sort((a,b)=> dist(b,{c:fromC,r:fromR}) - dist(a,{c:fromC,r:fromR}));
    if(!opts.length) return false;
    const o = opts[0];
    if(dist(o,{c:fromC,r:fromR}) <= dist(e,{c:fromC,r:fromR})) return false;
    faceToward(e, o.c, o.r);
    e.c=o.c; e.r=o.r; e.pm -= 1;
    playAnim(e, "Walk");
    return true;
  }

  function enemyCast(sp){
    const e=G.enemy, p=G.player;
    if(!e.alive || !sp || !enemyCanAfford(sp)) return false;
    const cost = Math.max(1, sp.cost|0);
    e.pa -= cost;
    const anim = sp.anim || e.weaponAnim || "Attack1";
    playAnim(e, anim);

    /* self / soutien */
    if(sp.heal || sp.type==="heal" || sp.type==="shield" || sp.id==="bouclier" || sp.id==="nanites"){
      if(sp.heal){
        const h = sp.heal[0] + Math.floor(Math.random()*Math.max(1,(sp.heal[1]-sp.heal[0]+1)));
        e.pv = Math.min(e.pvMax, e.pv + h);
        setStatus(e.name+" · "+sp.name+" +"+h+" PV");
      } else {
        e.shield = (e.shield|0) + 10 + Math.floor(Math.random()*8);
        setStatus(e.name+" · "+sp.name+" (égide "+e.shield+")");
      }
      e.flash = performance.now()+160;
      hud();
      return false;
    }

    if(!p.alive) return false;
    faceToward(e, p.c, p.r);
    if(dist(e,p) > (sp.range|0)){ setStatus(e.name+" rate"); return false; }

    let dmg = 0;
    if(sp.dmg){
      dmg = sp.dmg[0] + Math.floor(Math.random()*Math.max(1, sp.dmg[1]-sp.dmg[0]+1));
      const boost = 1.0 + Math.min(0.2, (G.fightN-1)*0.03);
      dmg = Math.max(4, Math.floor(dmg * boost));
    }
    if(sp.effect==="drainPA"){ /* flavor : petit bonus */ dmg += 2; }
    if(sp.effect==="push"){
      /* recule le joueur d’1 case si libre */
      const nc = p.c + Math.sign(p.c - e.c);
      const nr = p.r + Math.sign(p.r - e.r);
      if(inBounds(nc,nr) && !occupied(nc,nr,"player") && !(e.c===nc&&e.r===nr)){
        p.c=nc; p.r=nr;
      }
    }
    if(p.shield>0 && dmg){ const absorb=Math.min(p.shield,dmg); p.shield-=absorb; dmg-=absorb; }
    if(dmg){
      p.pv = Math.max(0, p.pv-dmg);
      p.flash = performance.now()+180;
    }
    setStatus(e.name+" · "+sp.name+(dmg?" → "+dmg:"")+(e.pa>0?" · …":""));
    hud();
    if(p.pv<=0){ p.alive=false; playAnim(p,"Die"); onCombatEnd("defeat"); return true; }
    return false;
  }

  function enemyTurn(){
    if(!G.enemy.alive){ G.turn="player"; beginPlayerTurn(); return; }
    const e=G.enemy, p=G.player;
    e.pa = e.paMax; e.pm = e.pmMax;
    const prof = e.profile || strategyProfile(e.strategy||"bruiser", e.spells);
    if(e._stunned){ e._stunned=false; setStatus(e.name+" étourdi"); setTimeout(()=>{ G.turn="player"; beginPlayerTurn(); }, 380); return; }

    if(!(p.invis>0)) e.lastSeen = { c:p.c, r:p.r };

    if((p.invis|0) > 0){
      const hunt = e.lastSeen || { c:p.c, r:p.r };
      let guard = 6;
      while((e.pm|0)>0 && guard-- > 0){
        if(dist(e, hunt) <= 0) break;
        if(!enemyStepToward(hunt.c, hunt.r)) break;
      }
      setTimeout(()=>{
        stopMoveAnim(e);
        setStatus(e.name+" cherche…");
        setTimeout(()=>{ G.turn="player"; beginPlayerTurn(); }, 280);
      }, 240);
      return;
    }

    let actions = 0;
    const maxActions = 5;
    let didHit = false;
    const finish = ()=>{
      stopMoveAnim(e);
      if(G.turn!=="over" && p.alive){ G.turn="player"; beginPlayerTurn(); }
    };
    const stepOnce = ()=>{
      if(!e.alive || !p.alive || G.turn==="over" || actions++ >= maxActions){
        finish(); return;
      }
      const d = dist(e,p);
      const hpRatio = e.pv / Math.max(1, e.pvMax);

      /* 1) soin / bouclier si blessé */
      if(hpRatio <= (prof.retreatHp||0.35)){
        const sup = enemyPickSpell("support");
        if(sup && (sup.heal || sup.type==="shield" || sup.type==="heal")){
          enemyCast(sup);
          setTimeout(stepOnce, 360);
          return;
        }
        if(prof.kiteBelow>=0 && enemyStepAway(p.c, p.r)){
          setTimeout(stepOnce, 200);
          return;
        }
      }

      /* 2) kiting sniper/caster : trop près → reculer */
      if(d < (prof.kiteBelow||0) && (e.pm|0)>0){
        if(enemyStepAway(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
      }

      /* 3) contrôle d’abord */
      if(prof.controlFirst && !didHit){
        const ctrl = enemyPickSpell("control");
        if(ctrl && ctrl.effect && d <= (ctrl.range|0)){
          const dead = enemyCast(ctrl);
          if(dead) return;
          didHit = true;
          setTimeout(stepOnce, 380);
          return;
        }
      }

      /* 4) à bonne distance → cast */
      const preferLo = prof.preferMin|0, preferHi = prof.preferMax|0;
      const sp = enemyPickSpell("damage");
      const need = sp ? (sp.range|0) : 1;

      if(sp && d <= need){
        /* skirmisher : frappe puis fuite */
        const dead = enemyCast(sp);
        if(dead) return;
        didHit = true;
        if(prof.hitAndRun && (e.pm|0)>0){
          enemyStepAway(p.c, p.r);
          setTimeout(stepOnce, 320);
          return;
        }
        setTimeout(stepOnce, 380);
        return;
      }

      /* 5) se placer à la distance préférée */
      if((e.pm|0)>0){
        if(d > preferHi){
          if(enemyStepToward(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
        } else if(d < preferLo){
          if(enemyStepAway(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
        } else if(d > need){
          if(enemyStepToward(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
        }
      }

      /* 6) dernier recours cast */
      if(sp && d <= need){
        const dead = enemyCast(sp);
        if(dead) return;
        setTimeout(stepOnce, 380);
        return;
      }

      setStatus(e.name+" · "+(prof.label||"attend"));
      setTimeout(finish, 220);
    };
    setStatus(e.name+" · "+(prof.label||e.strategy||"agit")+"…");
    setTimeout(stepOnce, 260);
  }

  function beginPlayerTurn(){
    G.busy = false;
    G.player.pmMax = playerBasePm();
    G.player.pa = G.player.paMax;
    G.player.pm = G.player.pmMax;
    if(G.player.invis>0) G.player.invis -= 1;
    G.armed=null; G.armedSlot=null;
    refreshSpellBar();
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
    const mount = isPlayerMounted() ? " · monture +"+mountPmBonus()+" PM" : "";
    const invis = G.player.invis>0 ? " · voile "+G.player.invis : "";
    setStatus("Ton tour"+mount+invis);
  }

  function offerEvo(forceId, fromVictory){
    if(typeof FantasyBridge==="undefined" || !FantasyBridge.evoChoicesFor){
      if(fromVictory) return false;
      return false;
    }
    const bar = G.spellBar.length ? G.spellBar : refreshSpellBar();
    const candidates = bar.filter(s=>s && s.spellId && !s.locked).map(s=>s.spellId);
    let pickId = forceId || null;
    if(!pickId){
      pickId = candidates.find(id=>{
        if(!FantasyBridge.EVO_TREE || !FantasyBridge.EVO_TREE[id]) return false;
        return FantasyBridge.nextEvoTier(evoState(id)) != null;
      });
    }
    if(!pickId) pickId = candidates.find(id=>FantasyBridge.EVO_TREE && FantasyBridge.EVO_TREE[id]);
    if(!pickId) pickId = candidates[0];
    if(!pickId){
      if(!fromVictory) setStatus("Aucun sort à évoluer");
      return false;
    }
    const st = evoState(pickId);
    const tier = FantasyBridge.nextEvoTier(st);
    if(tier==null){
      if(!fromVictory) setStatus((spellById(pickId)||{}).name+" déjà max (2 paliers)");
      return false;
    }
    const choices = FantasyBridge.evoChoicesFor(pickId, tier);
    if(!choices || !choices.length) return false;
    G.pendingEvo = { spellId: pickId, tier, choices, fromVictory: !!fromVictory };
    const sp = spellById(pickId);
    el("evoTitle").textContent = "Évolution · "+(sp?sp.name:pickId);
    el("evoSub").textContent = "Palier "+tier+"/"+FantasyBridge.EVO_MAX_TIERS+" · effet + anim + FX (cumul)";
    const host = el("evoOpts"); host.innerHTML="";
    choices.forEach((ch)=>{
      const b = document.createElement("button");
      b.type="button";
      const ed = editorEvoEntry(pickId, tier, ch.name);
      const animShow = (ed && ed.anim) ? ed.anim : (ch.anim||"?");
      const fxLab = (ed && ed.effect && ed.effect!=="None") ? ed.effect : (ed && ed.slash && ed.slash!=="None") ? ed.slash : (ch.fx ? ch.fx : "aucun");
      b.innerHTML = "<b>"+ch.name+"</b><span>"+ch.d+"</span><span style=\"display:block;margin-top:4px;color:#5b7c99\">Anim "+animShow+(ed&&ed.anim?" · éditeur":"")+" · FX "+fxLab+"</span>";
      b.onclick=()=>{
        try{ ch.apply(st); }catch(_e){}
        st.tiersTaken = (st.tiersTaken|0) + 1;
        if(!st.evo) st.evo = {};
        if(ch.anim) st.evo.anim = ch.anim;
        st.evo.fx = ch.fx || null;
        applyEditorAnimOnPick(pickId, tier, ch.name, st);
        saveEvo();
        const wasVictory = G.pendingEvo && G.pendingEvo.fromVictory;
        closeEvo();
        setStatus((sp?sp.name:pickId)+" → "+ch.name+" · "+ch.anim+(ch.fx?" +"+ch.fx:""));
        renderSpells();
        if(wasVictory) setTimeout(()=> startNextFight({ force:true }), 450);
      };
      host.appendChild(b);
    });
    el("evoOv").classList.add("on");
    el("evoOv").setAttribute("aria-hidden","false");
    return true;
  }

  function renderSpells(){
    const host = el("spellList"); host.innerHTML="";
    const bar = G.spellBar.length ? G.spellBar : refreshSpellBar();
    bar.forEach(slot=>{
      const b = document.createElement("button");
      b.type="button";
      const sp = slot.spellId ? spellById(slot.spellId) : null;
      const skin = (sp && typeof FantasyBridge!=="undefined" && FantasyBridge.SPELL_SKIN[sp.id]) || null;
      const name = sp ? (skin ? skin.name : sp.name) : "Vide";
      const lab = document.createElement("small");
      lab.textContent = slot.label;
      b.appendChild(lab);
      const line = document.createElement("span");
      if(slot.locked || !sp){
        line.textContent = "—";
        b.className = "lock";
        b.disabled = true;
      } else {
        const st = evoState(sp.id);
        const evoAnim = st.evo && st.evo.anim;
        line.textContent = name+" ·"+sp.cost+(evoAnim?" ·"+evoAnim.replace("Attack","A"):"");
        b.className = (G.armed===sp.id && G.armedSlot && G.armedSlot.slot===slot.slot) ? "on" : "";
        b.disabled = G.turn!=="player" || G.busy || G.player.pa<sp.cost;
        b.onclick=()=>{
          if(G.busy || G.turn!=="player") return;
          if(G.armed===sp.id && G.armedSlot && G.armedSlot.slot===slot.slot){
            castArmed();
            return;
          }
          armSlot(slot);
        };
      }
      b.appendChild(line);
      host.appendChild(b);
    });
  }

  function tileDiamond(c, r, fill, stroke){
    const s = toScreen(c, r);
    const hw = TILE_W/2, hh = TILE_H/2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y-hh);
    ctx.lineTo(s.x+hw, s.y);
    ctx.lineTo(s.x, s.y+hh);
    ctx.lineTo(s.x-hw, s.y);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if(stroke){ ctx.lineWidth=1; ctx.strokeStyle=stroke; ctx.stroke(); }
    return s;
  }

  function drawEntity(ent, isEnemy, opts){
    opts = opts || {};
    if(!ent.alive && ent.anim!=="Die") return;
    const anim = ent.anim||"Idle";
    const mounted = entityMounted(ent);
    const elapsed = (performance.now()-(ent.t0||0))/1000;
    const loopAnims = /^(Idle|Walk|Run|RunBackwards|StrafeLeft|StrafeRight|CrouchRun|RideIdle|RideRun|RideIdleAttack1|RideRunAttack1)$/i;
    const s = toScreen(ent.c, ent.r);
    const scale = 1.15;
    const dw=FW*scale, dh=FH*scale;
    const FOOT_Y = 88;
    const GROUND = 0;
    const dx=s.x-dw/2, dy=s.y + GROUND - FOOT_Y*scale;
    const groundY = s.y + GROUND;
    let baseAlpha = opts.alpha != null ? opts.alpha : 1;
    if(!isEnemy && !opts.clone && (G.player.invis|0)>0) baseAlpha *= 0.38;

    ctx.save();
    ctx.globalAlpha = Math.max(0.12, baseAlpha) * 0.9;
    ctx.fillStyle="rgba(40,40,38,0.16)";
    ctx.beginPath(); ctx.ellipse(s.x, groundY+2, 13, 5, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    const layers = isEnemy
      ? (ent.layers && ent.layers.length
          ? ent.layers
          : [{folder:"NakedBody",tint:"#8a6060",alpha:1},{folder:"Head3",tint:null,alpha:1},{folder:"Melee2",tint:null,alpha:1}])
      : layersForRow(sheetRowForDir(ent.dir|0, anim));

    ctx.imageSmoothingEnabled=false;
    let drawn=0;
    const animFps = ent.stepFps || FPS;
    for(const L of layers){
      const resolved = resolveSheet(L.folder, anim, mounted);
      if(!resolved) continue;
      const { im, sheetAnim } = resolved;
      const row = sheetRowForDir(ent.dir|0, sheetAnim);
      let col = Math.floor(elapsed*animFps);
      if(loopAnims.test(sheetAnim)) col = col % COLS;
      else col = Math.min(col, COLS-1);
      try{ tintDraw(im, col*FW, row*FH, FW, FH, dx, dy, dw, dh, L.tint, (L.alpha||1)*baseAlpha); drawn++; }catch(_e){}
    }
    if(!drawn){
      ctx.save(); ctx.globalAlpha = baseAlpha;
      ctx.fillStyle = isEnemy ? "#8a5050" : (opts.clone ? "#7a8a9a" : "#3d6a8a");
      ctx.beginPath(); ctx.ellipse(s.x, groundY-16, 11, 16, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = isEnemy ? "#c07070" : "#d4a574";
      ctx.beginPath(); ctx.arc(s.x, groundY-30, 7, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if(ent.flash && performance.now()<ent.flash){
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=0.45*baseAlpha;
      for(const L of layers){
        const resolved = resolveSheet(L.folder, anim, mounted);
        if(!resolved) continue;
        const { im, sheetAnim } = resolved;
        const row = sheetRowForDir(ent.dir|0, sheetAnim);
        let col = Math.floor(elapsed*animFps);
        if(loopAnims.test(sheetAnim)) col = col % COLS;
        else col = Math.min(col, COLS-1);
        try{ ctx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); }catch(_e){}
      }
      ctx.restore();
    }
    if(ent.pvMax){
      const pct = ent.pv/ent.pvMax;
      const bw=26, bh=3, bx=s.x-bw/2, by=dy+12;
      ctx.fillStyle="rgba(0,0,0,.22)"; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
      ctx.fillStyle = isEnemy ? "#8a3030" : "#2f6f4e";
      ctx.fillRect(bx, by, bw*Math.max(0,pct), bh);
    }
  }

  function draw(){
    fit();
    const W=canvas.width, H=canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#d8ddd4";
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.scale(cam.sc, cam.sc);

    const order = ensureTileOrder();
    for(const t of order){
      if(!tileInView(t.c, t.r)) continue;
      const a = ((t.c+t.r)&1);
      const fill = a ? "#e8e8e2" : "#dcdcd6";
      tileDiamond(t.c, t.r, fill, "rgba(80,80,70,0.12)");
      const k=key(t.c,t.r);
      if(G.moves.has(k)){
        tileDiamond(t.c, t.r, "rgba(47,111,78,0.28)", "rgba(47,111,78,0.45)");
      }
      if(G.range.has(k) && G.armed){
        tileDiamond(t.c, t.r, "rgba(90,70,140,0.22)", "rgba(90,70,140,0.4)");
      }
      if(G.aoe.has(k)){
        tileDiamond(t.c, t.r, "rgba(138,48,48,0.34)", "rgba(138,48,48,0.55)");
      }
      if(G.targets.has(k)){
        tileDiamond(t.c, t.r, "rgba(138,48,48,0.18)", "rgba(138,48,48,0.65)");
      }
      if(G.hover && G.hover.c===t.c && G.hover.r===t.r){
        tileDiamond(t.c, t.r, "rgba(61,61,58,0.12)", "rgba(61,61,58,0.55)");
      }
    }

    const ents=[];
    if(G.enemy.alive || G.enemy.anim==="Die") ents.push({e:G.enemy, enemy:true});
    if(G.clone && G.clone.alive) ents.push({e:G.clone, enemy:false, clone:true});
    if(G.player.alive || G.player.anim==="Die") ents.push({e:G.player, enemy:false});
    ents.sort((a,b)=> (a.e.c+a.e.r)-(b.e.c+b.e.r) || a.e.c-b.e.c);
    for(const o of ents) drawEntity(o.e, o.enemy, o.clone ? {clone:true, alpha:o.e.alpha||0.42} : null);

    ctx.restore();
  }

  function loop(){ draw(); requestAnimationFrame(loop); }

  function pointer(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    const x = (p.clientX-rect.left) * (canvas.width/rect.width);
    const y = (p.clientY-rect.top) * (canvas.height/rect.height);
    return { x: x/cam.sc, y: y/cam.sc };
  }

  function onTap(e){
    if(G.busy || G.turn!=="player" || !G.player.alive) return;
    const {x,y}=pointer(e);
    const cell=toTile(x,y);
    if(!inBounds(cell.c,cell.r)) return;
    if(G.armed){ tryCastAt(cell.c, cell.r); return; }
    const dc=cell.c-G.player.c, dr=cell.r-G.player.r;
    if(Math.abs(dc)+Math.abs(dr)===1) tryStep(dc,dr);
  }

  function warm(){
    const anims=["Idle","Walk","Run","TakeDamage","Die",
      "Attack1","Attack2","Attack3","Attack4","Attack5","Attack6","Kick","Special1",
      "RideIdle","RideRun","RideIdleAttack1","RideRunAttack1"];
    for(const L of layersForRow(3)) for(const a of anims) loadImg(L.folder,a);
    if(G.enemy && G.enemy.layers){
      for(const L of G.enemy.layers) for(const a of anims) loadImg(L.folder,a);
    }
  }

  function bindPad(){
    el("dpad").querySelectorAll("button").forEach(btn=>{
      const fire=()=>{
        if(G.busy) return;
        const d=btn.dataset.dir;
        if(d==="c"){ castArmed(); return; }
        const v=PAD_VEC[d]; if(!v) return;
        tryStep(v.dc, v.dr);
      };
      btn.addEventListener("pointerdown", (e)=>{ e.preventDefault(); btn.classList.add("on"); fire(); });
      btn.addEventListener("pointerup", ()=>btn.classList.remove("on"));
      btn.addEventListener("pointerleave", ()=>btn.classList.remove("on"));
    });
  }

  async function boot(){
    importCustomSpellsFromHash();
    window.addEventListener("hashchange", ()=>{ importCustomSpellsFromHash(); renderSpells(); });
    setStatus("Chargement…");
    G.awaitingNext = false;
    G.pendingEvo = null;
    G.busy = false;
    G.turn = "player";
    if(!loadLook()) defaultLook();
    lastLookSig = lookSig();
    try{
      for(const u of [BASE_CDN+"catalog.json", BASE_LOCAL+"catalog.json"]){
        const r=await fetch(u,{cache:"no-store",mode:"cors"});
        if(r.ok){ catalog=await r.json(); break; }
      }
    }catch(_e){}
    if(catalog){
      if(catalog.weaponAfterShieldRows) weaponAfterShieldRows=catalog.weaponAfterShieldRows;
      if(catalog.backpackInFrontRows) backpackInFrontRows=catalog.backpackInFrontRows;
    }
    try{
      if(typeof FantasyBridge!=="undefined"){
        if(FantasyBridge.ensureWeaponAnimMap) FantasyBridge.ensureWeaponAnimMap();
        SPELLS.forEach(sp=>{
          const sk=FantasyBridge.SPELL_SKIN[sp.id];
          if(sk) sp.name=sk.name;
        });
      }
    }catch(_e){}

    warm();
    /* premier adversaire aléatoire */
    G.player.c = 2; G.player.r = Math.floor(GRID/2);
    cam.fx = G.player.c; cam.fy = G.player.r;
    G.fightN = 0;
    G.enemy = makeEnemy(1);
    try{ warmFolders((G.enemy.layers||[]).map(L=>L.folder)); }catch(_e){}
    G.fightN = 1;
    refreshSpellBar();
    beginPlayerTurn();
    renderSpells(); hud();
    bindPad();
    {
      const bar = G.spellBar || [];
      const names = bar.filter(s=>!s.locked && s.spellId).map(s=>{
        const sp=spellById(s.spellId);
        return s.label+":"+(sp?sp.name:s.spellId);
      });
      const enSp = (G.enemy.spells||[]).map(id=>{ const s=spellById(id); return s?s.name:id; }).join("/");
      setStatus("Map "+GRID+" · vs "+G.enemy.name+" ("+enSp+")"+customSpellStatus());
    }

    /* Débloquer si session précédente bloquée sur victoire/évo */
    if(G.turn==="over" || G.awaitingNext){
      setTimeout(()=> forceRestartCombat(), 300);
    }

    canvas.addEventListener("click", onTap);
    canvas.addEventListener("touchend", (e)=>{
      e.preventDefault();
      const t=e.changedTouches[0];
      if(t) onTap({clientX:t.clientX, clientY:t.clientY});
    }, {passive:false});
    canvas.addEventListener("mousemove", (e)=>{
      const {x,y}=pointer(e); const t=toTile(x,y);
      G.hover = inBounds(t.c,t.r) ? t : null;
      if(G.armed) recomputeTargets();
    });
    el("btnEnd").onclick=endTurn;
    const btnRestart=el("btnRestart");
    if(btnRestart){
      btnRestart.addEventListener("click", (e)=>{
        e.preventDefault();
        forceRestartCombat();
      });
    }
    const btnEvo = el("btnEvo");
    if(btnEvo){
      btnEvo.addEventListener("click", (e)=>{
        e.preventDefault();
        /* évolue le sort armé, sinon le 1er de la barre */
        const id = (G.armedSlot && G.armedSlot.spellId) || G.armed || null;
        offerEvo(id, false);
      });
    }
    const evoSkip = el("evoSkip");
    if(evoSkip){
      evoSkip.addEventListener("click", ()=>{
        const wasVictory = G.pendingEvo && G.pendingEvo.fromVictory;
        closeEvo();
        if(wasVictory) startNextFight({ force:true });
        else setStatus("Évo annulée");
      });
    }
    window.addEventListener("resize", fit);
    window.addEventListener("pageshow", (e)=>{
      /* retour créateur (cache) : si le look a changé, relancer un combat */
      if(!e.persisted) return;
      try{ loadLook(); }catch(_e){}
      const sig = lookSig();
      if(sig && sig !== lastLookSig){
        lastLookSig = sig;
        startNextFight({ force:true, keepLook:true });
      }
    });
    loop();
  }
  boot().catch((err)=>{
    try{ importCustomSpellsFromHash(); }catch(_e){}
    try{ if(!lookState.look) defaultLook(); }catch(_e){}
    try{
      G.awaitingNext=false; G.pendingEvo=null; G.busy=false;
      G.fightN = 1;
      G.enemy = makeEnemy(1);
      G.turn = "player";
      beginPlayerTurn();
      renderSpells(); hud();
      loop();
      setStatus("Combat relancé"+customSpellStatus());
    }catch(_e){
      try{ setStatus("Erreur combat · touche Relancer"); forceRestartCombat(); loop(); }catch(_e2){}
    }
  });
})();
</script>
