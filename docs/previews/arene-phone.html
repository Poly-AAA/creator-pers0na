  editor: "\u003c!DOCTYPE html>\n\u003chtml lang=\"fr\">\n\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"/>\n\u003ctitle>Éditeur de sorts\u003c/title>\n\u003cscript>try{if(localStorage.getItem(\"roguelite.theme\")===\"dark\")document.documentElement.classList.add(\"dark\");}catch(e){}\u003c/script>\n\u003cstyle>\n  :root{\n    --bg:#FAF7F0;--bg2:#F6F1E8;--ink:#2F3133;--ink2:#8A8278;\n    --line:#E7DFD2;--line2:#E7DFD2;--card:#FFFFFF;\n    --sel:#2F3133;--soft:#EFE6D6;\n    --acc:#EA7020;--ok:#2F6F4E;--warn:#EA7020;\n    --phosphor:rgba(234,112,32,.22);--frame:#2F3133;\n  }\n  html.dark{\n    --bg:#141618;--bg2:#1C1F23;--ink:#F6F1E8;--ink2:#C9BBA8;\n    --line:#3E444C;--line2:#3E444C;--card:#23272C;\n    --sel:#F6F1E8;--soft:#2C3036;\n    --acc:#EA7020;--ok:#F4B07A;--warn:#EA7020;\n    --phosphor:rgba(234,112,32,.8);--frame:#EA7020;\n  }\n  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);\n    font:14px/1.35 -apple-system,BlinkMacSystemFont,Helvetica,sans-serif;overflow:hidden}\n  .app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}\n\n  /* ── PREVIEW (haut) ── */\n  .preview-wrap{flex:0 0 220px;min-height:220px;position:relative;background:#C4B49A;overflow:hidden}\n  html.dark .preview-wrap{background:#1C1F23}\n  canvas#arena{display:block;width:100%;height:220px;image-rendering:pixelated}\n  .preview-status{position:absolute;bottom:4px;left:8px;right:8px;\n    font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6);\n    pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n  /* ── NAV SORTS (bandeau) ── */\n  .spell-nav{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--bg2);\n    border-bottom:1px solid var(--line2);-webkit-overflow-scrolling:touch;flex-shrink:0}\n  .spell-nav button{flex-shrink:0;padding:7px 12px;border:1.5px solid var(--line);border-radius:10px;\n    background:var(--soft);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}\n  .spell-nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}\n  .spell-nav button.new{background:var(--ok);color:#fff;border-color:var(--ok)}\n\n  /* ── PANEL ÉDITEUR (bas, scrollable) ── */\n  .editor{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}\n  .card{background:var(--card);border:1px solid var(--frame);border-radius:3px;padding:12px;box-shadow:0 0 0 1px rgba(234,112,32,.16)}\n  html.dark .card{box-shadow:0 0 6px var(--phosphor)}\n  .card h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}\n  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}\n  label.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}\n  label.field input,label.field select,label.field textarea{\n    padding:7px 9px;border:1px solid var(--line);border-radius:8px;\n    background:var(--soft);font:13px/1.3 inherit;color:var(--ink);width:100%}\n  label.field textarea{resize:vertical;min-height:56px}\n  .anim-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}\n  .anim-list button{padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;\n    background:var(--soft);font-size:11px;font-weight:700;color:var(--ink)}\n  .anim-list button.on{background:var(--acc);color:#fff;border-color:var(--acc)}\n  .anim-seq{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;\n    background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:5px}\n  .anim-seq .chip{display:flex;align-items:center;gap:3px;padding:3px 8px;\n    background:var(--acc);color:#fff;border-radius:999px;font-size:11px;font-weight:700}\n  .anim-seq .chip button{background:none;border:none;color:#fff;font-size:12px;padding:0;cursor:pointer}\n\n  /* évolutions catalogue */\n  .evo-tier{margin-top:10px}\n  .evo-tier h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--acc)}\n  .evo-choice{border:1px solid var(--frame);border-radius:3px;padding:8px;margin-top:6px;background:var(--bg2);box-shadow:0 0 0 1px rgba(234,112,32,.12)}\n  .evo-choice.on{border-color:var(--acc);background:rgba(234,112,32,.12)}\n  .evo-choice-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}\n  .evo-choice-head label{display:flex;align-items:flex-start;gap:6px;cursor:pointer;flex:1}\n  .evo-choice-head b{font-size:12px;color:var(--ink)}\n  .evo-choice-head small{font-size:10px;color:var(--ink2);display:block;margin-top:2px;line-height:1.3}\n  .evo-choice .test-btn{margin-top:6px;padding:4px 10px;border-radius:7px;background:var(--acc);\n    color:#fff;border:none;font-size:10px;font-weight:700;cursor:pointer}\n\n  /* overlay corps */\n  .body-tokens{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}\n  .body-tokens button{padding:4px 10px;border:1.5px solid var(--line);border-radius:8px;\n    background:var(--soft);font-size:11px;font-weight:700;color:var(--ink)}\n  .body-tokens button.on{background:var(--acc);color:#fff;border-color:var(--acc)}\n\n  /* footer */\n  .footer{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));\n    background:var(--bg2);border-top:1px solid var(--line2);flex-shrink:0}\n  .footer button,.footer a{flex:1;min-height:44px;border-radius:3px;border:1px solid var(--frame);\n    background:var(--soft);color:var(--ink);font-size:13px;font-weight:700;\n    display:flex;align-items:center;justify-content:center;text-decoration:none}\n  .footer .primary{background:var(--acc);color:#fff;border-color:var(--acc)}\n  .footer .ok{background:var(--ok);color:#fff;border-color:var(--ok)}\n\n  /* hint */\n  .hint{font-size:11px;color:var(--ink2);margin:3px 0 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"crt\" aria-hidden=\"true\">\u003c/div>\n\u003cdiv class=\"bootlines ar\" aria-hidden=\"true\">\u003cspan>فحص\u003c/span>\u003cspan>سليم\u003c/span>\u003cspan>التزامن\u003c/span>\u003c/div>\n\u003cstyle>\n  .crt{pointer-events:none;position:fixed;inset:0;z-index:40;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(47,49,51,.05) 3px 4px);animation:crt-on .42s steps(2,end) 1}\n  html.dark .crt{background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);box-shadow:inset 0 0 40px rgba(234,112,32,.16)}\n  @keyframes crt-on{0%{opacity:.15}45%{opacity:.7}100%{opacity:1}}\n  .bootlines{pointer-events:none;position:fixed;left:8px;top:6px;z-index:41;display:flex;gap:8px;font-size:11px;color:#EA7020;animation:bootgone 1.1s linear forwards}\n  .bootlines span{opacity:0;animation:bootline .16s linear forwards}\n  .bootlines span:nth-child(2){animation-delay:.12s}\n  .bootlines span:nth-child(3){animation-delay:.24s}\n  @keyframes bootline{to{opacity:1}}\n  @keyframes bootgone{0%,65%{opacity:1}100%{opacity:0}}\n  .ruler{display:flex;justify-content:space-between;height:12px;font-size:9px;color:var(--ink2);background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 10px);background-size:100% 4px;background-repeat:no-repeat;background-position:bottom}\n  .wave{display:block;width:100%;height:22px;color:#EA7020}\n  html.dark .card h3,html.dark .evo-tier h4{text-shadow:0 0 6px var(--phosphor)}\n\u003c/style>\n\u003cdiv class=\"app\">\n  \u003c!-- Prévisualisation combat -->\n  \u003cdiv class=\"preview-wrap\" id=\"previewWrap\" style=\"height:220px\">\n    \u003ccanvas id=\"arena\" width=\"390\" height=\"220\" style=\"display:block;width:100%;height:220px;image-rendering:pixelated\" aria-label=\"Prévisualisation\">\u003c/canvas>\n    \u003cdiv class=\"preview-status\" id=\"pvStatus\">Chargement…\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Navigation sorts -->\n  \u003cdiv class=\"spell-nav\" id=\"spellNav\">\u003c/div>\n  \u003cdiv class=\"ruler\" aria-hidden=\"true\">\u003cspan>-50\u003c/span>\u003cspan>0\u003c/span>\u003cspan>+50\u003c/span>\u003c/div>\n  \u003csvg class=\"wave\" viewBox=\"0 0 200 40\" aria-hidden=\"true\">\u003cpath d=\"M0 26C18 26 18 10 36 10s18 18 36 18 18-16 36-16 18 20 36 20 18-14 36-14 20 8 20 8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"/>\u003cpath d=\"M24 16h6M27 13v6M70 28h6M73 25v6M120 12h6M123 9v6M168 26h6M171 23v6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"/>\u003c/svg>\n\n  \u003c!-- Panneau éditeur -->\n  \u003cdiv class=\"editor\" id=\"editor\">\u003c/div>\n\n  \u003c!-- Footer -->\n  \u003cdiv class=\"footer\" style=\"flex-wrap:wrap\">\n    \u003ca href=\"character-creator-fantasy.html\" data-fcc=\"creator\" style=\"flex:1 1 30%\">Créateur\u003c/a>\n    \u003cbutton type=\"button\" class=\"ok\" id=\"btnCombatGo\" style=\"flex:1 1 40%\">Combat ▶\u003c/button>\n    \u003cbutton type=\"button\" class=\"primary\" id=\"btnSave\" style=\"flex:1 1 25%\">Sauver\u003c/button>\n    \u003cbutton type=\"button\" id=\"btnCopySave\" style=\"flex:1 1 32%;font-size:11px\">Copier config\u003c/button>\n    \u003cbutton type=\"button\" id=\"btnPasteSave\" style=\"flex:1 1 32%;font-size:11px\">Coller config\u003c/button>\n    \u003cbutton type=\"button\" id=\"btnRestoreCoup\" style=\"flex:1 1 32%;font-size:11px;background:#EA7020;color:#fff;border-color:#EA7020\">Restaurer Coup brut\u003c/button>\n    \u003cbutton type=\"button\" id=\"btnGrimoire\" style=\"flex:1 1 32%;font-size:11px;background:#2f6f4e;color:#fff;border-color:#2f6f4e\">Grimoire\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript src=\"js/reactions.js\">\u003c/script>\n\u003cscript src=\"js/combo-blocks.js\">\u003c/script>\n\u003cscript src=\"js/fantasy-combat-bridge.js\">\u003c/script>\n\u003cscript>\n/* Liens Créateur / Combat / Sorts — persistés dans localStorage (neuro.fccNav) */\nfunction wireFccNav(){\n  const nav=Object.assign({}, window.FCC_NAV||{});\n  try{\n    const stored=JSON.parse(localStorage.getItem(\"neuro.fccNav\")||\"{}\");\n    /* Les liens injectés (FCC_NAV) priment — évite un vieux combat 404 en localStorage */\n    Object.keys(stored).forEach(k=>{ if(!nav[k]) nav[k]=stored[k]; });\n  }catch(_e){}\n  document.querySelectorAll(\"[data-fcc]\").forEach(el=>{\n    const k=el.getAttribute(\"data-fcc\");\n    if(nav[k]) el.href=nav[k];\n    else if(el.href && /^https?:\\/\\//.test(el.href)) nav[k]=el.href;\n  });\n  try{ localStorage.setItem(\"neuro.fccNav\", JSON.stringify(nav)); }catch(_e){}\n  return nav;\n}\n\u003c/script>\n\u003cscript>\n(function(){\n\"use strict\";\n\nfunction pvFail(msg){\n  const d=document.getElementById(\"pvStatus\");\n  if(d) d.textContent=\"JS ERROR: \"+(msg||\"inconnu\");\n}\nwindow.addEventListener(\"error\", (e)=>{\n  pvFail((e && e.message) ? e.message : \"unknown\");\n});\nwindow.addEventListener(\"unhandledrejection\", (e)=>{\n  try{\n    pvFail((e && e.reason && e.reason.message) ? e.reason.message : String(e.reason||e));\n  }catch(_x){\n    pvFail(\"unhandledrejection\");\n  }\n});\n\nconst BASE_CDN = \"https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f2e5a50/assets/packs/fantasy-cc/\";\nconst BASE_LOCAL = \"assets/packs/fantasy-cc/\";\n/** Hébergement sans dossier assets (Litterbox, etc.) → CDN en priorité */\nconst HOST_STANDALONE = /litter\\.(catbox|box)\\.moe|catbox\\.moe|trycloudflare\\.com|htmlpreview\\.github\\.io/i.test(location.hostname);\nconst FW=128, FH=128, COLS=15, FPS=14;\nconst KEY_SPELLS = \"neuro.customSpells\";\nconst KEY_LOOK   = \"neuro.fantasyLook\";\n\n/* ────────────────────────────────────────────────────────────\n   Anims disponibles pour chaîner\n──────────────────────────────────────────────────────────── */\nconst ALL_ANIMS = [\n  \"Idle\",\"Walk\",\"Run\",\"Rolling\",\"Slide\",\n  \"Attack1\",\"Attack2\",\"Attack3\",\"Attack4\",\"Attack5\",\"Attack6\",\n  \"AttackRun\",\"AttackRun2\",\"Kick\",\"Special1\",\"Taunt\",\n  \"RideIdleAttack1\",\"RideRunAttack1\",\"TakeDamage\",\"Die\"\n];\nconst MOVE_ANIMS_LIST = [\"Idle\",\"Walk\",\"Run\",\"Rolling\",\"Slide\",\"AttackRun\",\"AttackRun2\",\"TakeDamage\"];\n// Vraies listes depuis catalog.json (slots \"slash\" et \"effect\")\nconst FX_SLASH_LIST  = [\"None\",\"Slash1\",\"Slash2\"];\nconst FX_EFFECT_LIST = [\"None\",\"Effect1\",\"Effect2\",\"Effect3\",\"Effect4\",\"Effect5\"];\n\nconst ATTACK_ANIMS = ALL_ANIMS.filter(a=>/Attack|Kick|Special|Taunt|Rolling|Slide|Ride.*Attack/i.test(a));\n\n/* Corps overlay disponibles */\nconst BODY_OVERLAYS = [\"Aucun\",\"NakedBody2\",\"NakedBody3\"]; // squelette/éthéré quand assets prêts\n\n/* ────────────────────────────────────────────────────────────\n   SPELLS catalogue de base (mêmes que combat)\n──────────────────────────────────────────────────────────── */\n/* Pour l’instant : seul Coup brut. Les anciens sorts sont retirés — tu pourras tout refaire via « + Nouveau ». */\nconst LEGACY_SPELL_IDS = new Set([\n  \"monofil\",\"arc\",\"surchauffe\",\"parasite\",\"gravite\",\"nanites\",\"drone\",\n  \"tir_magnetique\",\"impact_cinetique\",\"bombe_thermique\",\"lance_flammes\",\n  \"impulsion_emp\",\"tempete_tesla\",\"piratage_neural\",\"rupture_synaptique\",\n  \"compression\",\"distorsion\",\"armure_nanites\",\"reconstruction\",\"teleport\",\n  \"dash\",\"swap\",\"gravjump\",\"mine\",\"turret\",\"sniper\",\"bouclier\",\"overclock\",\n  \"double\",\"invisibilite\",\n]);\n/* Config anim sauvegardée (docs/previews/coup-brut-backup.json) — ne pas écraser au boot. */\nconst SAVED_COUP_BRUT = {\n  id:\"punch\", name:\"Coup brut\", cost:2, range:1, dmg:[8,12], anim:\"Attack2\", type:\"damage\",\n  aoe:0, animSeq:[],\n  steps:[{ anim:\"Attack1\", move:\"Idle\", slash:\"None\", effect:\"None\", delay:0, fps:17, hitTarget:true }],\n  evoConfig:{\n    \"1:Brise-Os\":{ enabled:true, anim:\"Attack2\", slash:\"None\", effect:\"None\", fps:12, delay:0 },\n    \"1:Boxeur\":{ enabled:true, anim:\"Attack6\", slash:\"None\", effect:\"None\", fps:17, delay:0 },\n    \"1:Rapide\":{ enabled:false, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:14, delay:0 },\n    \"2:Uppercut\":{ enabled:true, anim:\"Special1\", slash:\"None\", effect:\"Effect1\", fps:17, delay:0 },\n    \"2:Percutant\":{ enabled:true, anim:\"Attack6\", slash:\"None\", effect:\"None\", fps:14, delay:0 },\n    \"2:Double Impact\":{ enabled:false, anim:\"Attack5\", slash:\"Slash2\", effect:\"None\", fps:17, delay:0 },\n  },\n};\n/** Coup de pied : mêmes évos que Coup brut, anim Kick partout (pas d’autres sheets). */\nconst SAVED_COUP_DE_PIED = {\n  id:\"coup_de_pied\",\n  name:\"Coup de pied\",\n  cost:4,\n  range:1,\n  dmg:[4,14],\n  anim:\"Kick\",\n  type:\"damage\",\n  aoe:0,\n  animSeq:[],\n  effect:\"push\",\n  push:1,\n  desc:\"Donne un coup de pied qui repousse l’ennemi de 1 case\",\n  steps:[{ anim:\"Kick\", delay:0, move:\"Idle\", fps:15, slash:\"None\", effect:\"None\", hitTarget:true }],\n  evoConfig:{\n    \"1:Brise-Os\":{ enabled:true, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:15, delay:0 },\n    \"1:Boxeur\":{ enabled:false, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:15, delay:0 },\n    \"1:Rapide\":{ enabled:true, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:15, delay:0 },\n    \"2:Uppercut\":{ enabled:true, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:15, delay:0 },\n    \"2:Percutant\":{ enabled:true, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:15, delay:0 },\n    \"2:Double Impact\":{ enabled:false, anim:\"Kick\", slash:\"None\", effect:\"None\", fps:15, delay:0 },\n  },\n};\n/** Roulade : mobilité (approche / recul). Évos = mêmes paliers que Coup brut (portée / −PA…). */\nconst SAVED_ROULADE = {\n  id:\"roulade\",\n  name:\"Roulade\",\n  cost:4,\n  range:2,\n  dmg:[0,0],\n  anim:\"Rolling\",\n  type:\"buff\",\n  aoe:0,\n  animSeq:[],\n  effect:\"roulade\",\n  push:0,\n  desc:\"Roulade : hors corps à corps → se rapproche ; au corps à corps → recule\",\n  steps:[{ anim:\"Rolling\", delay:0, move:\"Idle\", fps:17, slash:\"None\", effect:\"None\", hitTarget:false }],\n  evoConfig:{\n    \"1:Brise-Os\":{ enabled:false, anim:\"Rolling\", slash:\"None\", effect:\"None\", fps:16, delay:0 },\n    \"1:Boxeur\":{ enabled:true, anim:\"Rolling\", slash:\"None\", effect:\"None\", fps:16, delay:0 },\n    \"1:Rapide\":{ enabled:true, anim:\"Rolling\", slash:\"None\", effect:\"None\", fps:16, delay:0 },\n    \"2:Uppercut\":{ enabled:false, anim:\"Rolling\", slash:\"None\", effect:\"None\", fps:16, delay:0 },\n    \"2:Percutant\":{ enabled:false, anim:\"Rolling\", slash:\"None\", effect:\"None\", fps:16, delay:0 },\n    \"2:Double Impact\":{ enabled:false, anim:\"Rolling\", slash:\"None\", effect:\"None\", fps:16, delay:0 },\n  },\n};\nconst BASE_SPELLS = [\n  JSON.parse(JSON.stringify(SAVED_COUP_BRUT)),\n  JSON.parse(JSON.stringify(SAVED_COUP_DE_PIED)),\n  JSON.parse(JSON.stringify(SAVED_ROULADE)),\n];\n\n/* ────────────────────────────────────────────────────────────\n   État\n──────────────────────────────────────────────────────────── */\nlet customSpells = [];  // sorts créés / modifiés\nlet activeId = null;    // sort en cours d'édition\n\nfunction pruneLegacySpells(){\n  const before = customSpells.length;\n  customSpells = (customSpells||[]).filter(s=>s && s.id && (s.id===\"punch\" || !LEGACY_SPELL_IDS.has(s.id)));\n  if(customSpells.length !== before) saveCustom();\n}\n/** Si Coup brut a perdu ses steps/évos (save vide / nouveau domaine), remettre la config sauvée. */\nfunction ensurePunchAnims(){\n  const preset = JSON.parse(JSON.stringify(SAVED_COUP_BRUT));\n  let punch = (customSpells||[]).find(s=>s && s.id===\"punch\");\n  const incomplete = !punch\n    || !Array.isArray(punch.steps) || !punch.steps.length\n    || !punch.evoConfig || !Object.keys(punch.evoConfig).length\n    || !Object.values(punch.evoConfig).some(e=>e && e.enabled);\n  if(!punch){\n    customSpells = [preset, ...(customSpells||[]).filter(s=>s && s.id!==\"punch\")];\n    punch = customSpells.find(s=>s && s.id===\"punch\");\n    if(typeof Combo!==\"undefined\" && punch) Combo.stamp(punch);\n    saveCustom();\n    return;\n  }\n  if(incomplete){\n    /* Remet la séquence + évos anim sauvegardées, garde id/name */\n    punch.steps = preset.steps;\n    punch.anim = preset.anim;\n    punch.animSeq = [];\n    punch.aoe = preset.aoe;\n    punch.evoConfig = preset.evoConfig;\n    punch.cost = punch.cost != null ? punch.cost : preset.cost;\n    punch.range = punch.range != null ? punch.range : preset.range;\n    punch.dmg = punch.dmg || preset.dmg;\n    punch.type = punch.type || preset.type;\n    if(typeof Combo!==\"undefined\") Combo.stamp(punch);\n    saveCustom();\n    return;\n  }\n  let changed = false;\n  Object.keys(preset.evoConfig).forEach(k=>{\n    if(!punch.evoConfig[k]){ punch.evoConfig[k]=preset.evoConfig[k]; changed=true; }\n  });\n  if(changed) saveCustom();\n  if(typeof Combo!==\"undefined\" && punch && Combo.stamp(punch)) saveCustom();\n}\n/** Migre / seed Coup de pied avec les mêmes évos que Coup brut (anim Kick). */\nfunction ensureCoupDePied(){\n  const preset = JSON.parse(JSON.stringify(SAVED_COUP_DE_PIED));\n  /* Ancien id custom_* → id stable */\n  (customSpells||[]).forEach(s=>{\n    if(!s || !s.id) return;\n    if(s.id===\"coup_de_pied\") return;\n    const isKick = s.id===\"kick\" || /^custom_/.test(s.id) && /coup\\s*de\\s*pied/i.test(s.name||\"\");\n    if(isKick) s.id = \"coup_de_pied\";\n  });\n  let kick = (customSpells||[]).find(s=>s && s.id===\"coup_de_pied\");\n  if(!kick){\n    customSpells = [...(customSpells||[]).filter(s=>s && s.id!==\"coup_de_pied\"), preset];\n    /* garder punch en premier si présent */\n    customSpells.sort((a,b)=>{\n      if(a.id===\"punch\") return -1;\n      if(b.id===\"punch\") return 1;\n      if(a.id===\"coup_de_pied\") return -1;\n      if(b.id===\"coup_de_pied\") return 1;\n      return 0;\n    });\n    saveCustom();\n    return;\n  }\n  let changed = false;\n  if(!kick.effect || kick.effect===\"none\"){ kick.effect=\"push\"; changed=true; }\n  if(kick.push==null && kick.pushDist==null){ kick.push=1; changed=true; }\n  if(!Array.isArray(kick.steps) || !kick.steps.length){\n    kick.steps = preset.steps;\n    kick.anim = \"Kick\";\n    changed = true;\n  }\n  if(!kick.evoConfig || !Object.keys(kick.evoConfig).length\n      || !Object.values(kick.evoConfig).some(e=>e && e.enabled)){\n    kick.evoConfig = preset.evoConfig;\n    changed = true;\n  } else {\n    Object.keys(preset.evoConfig).forEach(k=>{\n      if(!kick.evoConfig[k]){ kick.evoConfig[k]=preset.evoConfig[k]; changed=true; }\n    });\n  }\n  if(changed) saveCustom();\n}\n/** Infère effect:push depuis la description (ex. Coup de pied). */\nfunction ensureSpellEffects(){\n  let changed=false;\n  (customSpells||[]).forEach(s=>{\n    if(!s || !s.id) return;\n    if((!s.effect || s.effect===\"none\") && /repouss/i.test(s.desc||\"\")){\n      s.effect=\"push\";\n      if(s.push==null && s.pushDist==null) s.push=1;\n      changed=true;\n    }\n    if(s.effect===\"push\" && s.push==null && s.pushDist==null){ s.push=1; changed=true; }\n  });\n  if(changed) saveCustom();\n}\n/** Migre / seed Roulade (mobilité). */\nfunction ensureRoulade(){\n  const preset = JSON.parse(JSON.stringify(SAVED_ROULADE));\n  (customSpells||[]).forEach(s=>{\n    if(!s || !s.id || s.id===\"roulade\") return;\n    if(/^custom_/.test(s.id) && /roulade/i.test(s.name||\"\")) s.id = \"roulade\";\n  });\n  let roll = (customSpells||[]).find(s=>s && s.id===\"roulade\");\n  if(!roll){\n    customSpells = [...(customSpells||[]).filter(s=>s && s.id!==\"roulade\"), preset];\n    customSpells.sort((a,b)=>{\n      const order = { punch:0, coup_de_pied:1, roulade:2 };\n      return (order[a.id]??9) - (order[b.id]??9);\n    });\n    saveCustom();\n    return;\n  }\n    let changed = false;\n  if(roll.effect!==\"roulade\"){ roll.effect=\"roulade\"; changed=true; }\n  if((roll.range|0) \u003c 2){ roll.range=2; changed=true; }\n  if(roll.type!==\"buff\" && !(roll.dmg && (roll.dmg[1]|0)>0)){ roll.type=\"buff\"; changed=true; }\n  if(!Array.isArray(roll.steps) || !roll.steps.length){\n    roll.steps = preset.steps;\n    roll.anim = roll.anim || \"Rolling\";\n    changed = true;\n  } else {\n    /* Ne jamais écraser l’anim/FPS joueur — juste normaliser le type numérique */\n    roll.steps.forEach(st=>{\n      if(!st) return;\n      if(st.fps!=null){ const n=Number(st.fps); if(isFinite(n)) st.fps=n; }\n    });\n  }\n  if(!roll.evoConfig || !Object.keys(roll.evoConfig).length){\n    roll.evoConfig = preset.evoConfig;\n    changed = true;\n  } else {\n    Object.keys(preset.evoConfig).forEach(k=>{\n      if(!roll.evoConfig[k]){ roll.evoConfig[k]=preset.evoConfig[k]; changed=true; }\n    });\n  }\n  if(changed) saveCustom();\n}\nfunction loadCustom(){\n  try{ const r=localStorage.getItem(KEY_SPELLS); if(r) customSpells=JSON.parse(r)||[]; }catch(_e){}\n  try{\n    const bk=sessionStorage.getItem(KEY_SPELLS);\n    if(bk && !customSpells.length) customSpells=JSON.parse(bk)||[];\n  }catch(_e){}\n  /* Hash (#fccSpells=…) = transport explicite — doit écraser le localStorage stale */\n  importSpellsFromHash();\n  pruneLegacySpells();\n  dropGeneratedCustom();\n  ensurePunchAnims();\n  ensureCoupDePied();\n  ensureRoulade();\n  ensureSpellEffects();\n  if(typeof FantasyBridge!==\"undefined\" && FantasyBridge.registerSpellEvoAliases)\n    FantasyBridge.registerSpellEvoAliases(customSpells);\n  /* Double Impact = évolution, pas équipé de base (décocher les saves seedées). */\n  (function stripDefaultDoubleImpact(){\n    const MIG = \"neuro.diNotBase.v1\";\n    try{ if(localStorage.getItem(MIG)===\"1\") return; }catch(_e){}\n    let changed=false;\n    const keys=[\"2:Double Impact\",\"2:Déchirure\",\"2:Salve\"];\n    (customSpells||[]).forEach(s=>{\n      if(!s || !s.evoConfig) return;\n      keys.forEach(k=>{\n        if(s.evoConfig[k] && s.evoConfig[k].enabled){\n          s.evoConfig[k].enabled=false;\n          changed=true;\n        }\n      });\n    });\n    if(changed) saveCustom();\n    try{ localStorage.setItem(MIG, \"1\"); }catch(_e){}\n  })();\n}\nfunction saveCustom(){\n  try{\n    localStorage.setItem(KEY_SPELLS, JSON.stringify(customSpells));\n    sessionStorage.setItem(KEY_SPELLS, JSON.stringify(customSpells));\n  }catch(_e){}\n}\nfunction exportSpellsPack(){\n  return btoa(unescape(encodeURIComponent(JSON.stringify(customSpells))));\n}\nfunction importSpellsPack(b64){\n  if(!b64) return false;\n  try{\n    const arr=JSON.parse(decodeURIComponent(escape(atob(String(b64).trim()))));\n    if(!Array.isArray(arr)) return false;\n    customSpells=arr;\n    pruneLegacySpells();\n    ensurePunchAnims();\n    ensureCoupDePied();\n    ensureRoulade();\n    ensureSpellEffects();\n    saveCustom();\n    return true;\n  }catch(_e){ return false; }\n}\nfunction importSpellsFromHash(){\n  const m=(location.hash||\"\").match(/fccSpells=([^&]+)/);\n  if(!m) return false;\n  if(importSpellsPack(decodeURIComponent(m[1]))){\n    try{ history.replaceState(null, \"\", location.pathname+location.search+location.hash); }catch(_e){}\n    return true;\n  }\n  return false;\n}\nfunction exportSpellsJson(){ return JSON.stringify(customSpells, null, 0); }\nfunction importSpellsJson(raw){\n  try{\n    const arr=JSON.parse(String(raw||\"\").trim());\n    if(!Array.isArray(arr)) return false;\n    customSpells=arr;\n    pruneLegacySpells();\n    ensurePunchAnims();\n    ensureCoupDePied();\n    ensureRoulade();\n    ensureSpellEffects();\n    saveCustom();\n    return true;\n  }catch(_e){ return false; }\n}\nasync function pasteSpellsBackup(){\n  let raw=\"\";\n  try{\n    if(navigator.clipboard && navigator.clipboard.readText) raw=await navigator.clipboard.readText();\n  }catch(_e){}\n  if(!raw) raw=prompt(\"Colle ta sauvegarde JSON (ou le bloc fccSpells) :\")||\"\";\n  if(!raw.trim()) return false;\n  raw=raw.trim();\n  if(/^eyJ|^W3s/i.test(raw) || (raw.length>40 && !raw.startsWith(\"[\"))) return importSpellsPack(raw);\n  return importSpellsJson(raw);\n}\n/** Config Coup brut reconstruite depuis tes screenshots (août 2026). */\nconst PRESET_SPELLS = [\n  JSON.parse(JSON.stringify(SAVED_COUP_BRUT)),\n  JSON.parse(JSON.stringify(SAVED_COUP_DE_PIED)),\n  JSON.parse(JSON.stringify(SAVED_ROULADE)),\n];\nconst PRESET_COUP_BRUT = PRESET_SPELLS; /* alias */\nfunction restorePresetCoupBrut(){\n  customSpells=JSON.parse(JSON.stringify(PRESET_SPELLS));\n  activeId=\"punch\";\n  saveCustom();\n  /* Reset évos combat (stats victoire) — les cases éditeur = anim seulement */\n  try{\n    const KEY_EVO=\"neuro.fantasySpellEvo\";\n    const raw=localStorage.getItem(KEY_EVO);\n    const o=raw?JSON.parse(raw):{};\n    if(o){\n      if(o.punch) delete o.punch;\n      if(o.coup_de_pied) delete o.coup_de_pied;\n      if(o.roulade) delete o.roulade;\n      localStorage.setItem(KEY_EVO, JSON.stringify(o));\n    }\n  }catch(_e){}\n  renderNav();\n  renderEditor();\n  showSavedStatus();\n  const st=document.getElementById(\"pvStatus\");\n  if(st) st.textContent=\"Config restaurée ✓ · Coup brut + Coup de pied + Roulade\";\n  return true;\n}\nfunction copySpellsBackup(){\n  const txt=exportSpellsJson();\n  saveCustom();\n  if(navigator.clipboard && navigator.clipboard.writeText){\n    navigator.clipboard.writeText(txt).then(()=>{\n      const st=document.getElementById(\"pvStatus\");\n      if(st) st.textContent=\"Config copiée · \"+customSpells.length+\" sort(s) — garde ce texte !\";\n    }).catch(()=> prompt(\"Copie ce texte :\", txt));\n  } else prompt(\"Copie ce texte (sauvegarde) :\", txt);\n}\nfunction combatUrlWithSaves(base){\n  saveCustom();\n  const pack=exportSpellsPack();\n  try{\n    const u=new URL(base||\"fantasy-combat.html\", location.href);\n    u.hash=\"fccSpells=\"+encodeURIComponent(pack);\n    return u.href;\n  }catch(_e){\n    const b=base||\"fantasy-combat.html\";\n    const sep=b.includes(\"#\")?\"&\":\"#\";\n    return b+sep+\"fccSpells=\"+encodeURIComponent(pack);\n  }\n}\nlet _autoSaveT=null;\nfunction scheduleAutoSave(){\n  clearTimeout(_autoSaveT);\n  _autoSaveT=setTimeout(()=>{ saveCustom(); showSavedStatus(); }, 350);\n}\nfunction goCombat(){\n  const nav=wireFccNav();\n  combatUrlWithSaves(\"fantasy-combat.html\"); parent.postMessage({type:\"open-combat\"}, \"*\");\n}\nfunction allSpells(){ return [...BASE_SPELLS, ...customSpells.filter(c=>!BASE_SPELLS.find(b=>b.id===c.id))]; }\nfunction spellById(id){ return customSpells.find(s=>s.id===id) || BASE_SPELLS.find(s=>s.id===id) || null; }\nfunction editableSpell(id){\n  let s = customSpells.find(s=>s.id===id);\n  if(!s){ const b=BASE_SPELLS.find(b=>b.id===id); s=b?JSON.parse(JSON.stringify(b)):null; }\n  return s;\n}\nfunction ensureEditable(id){\n  if(!customSpells.find(s=>s.id===id)){\n    const b=BASE_SPELLS.find(b=>b.id===id);\n    if(b) customSpells.push(JSON.parse(JSON.stringify(b)));\n    else customSpells.push({ id, name:\"Nouveau sort \"+id, cost:2, range:1, dmg:[8,12], anim:\"Attack1\", type:\"damage\", animSeq:[], evos:[] });\n  }\n  const s = customSpells.find(s=>s.id===id);\n  if(!s) return null;\n  // Compat: nouveau système \"steps\" — garantir steps même pour les sorts de base\n  if(!Array.isArray(s.steps) || !s.steps.length){\n    const seq = (s.animSeq && s.animSeq.length) ? s.animSeq : [(s.anim||\"Attack1\")];\n    s.steps = (seq||[]).map(normalizeStep);\n  }\n  return s;\n}\n\n/* ── Catalogue évolutions (EVO_TREE du jeu) ── */\nfunction getEvoTree(spellId){\n  if(typeof FantasyBridge===\"undefined\" || !FantasyBridge.EVO_TREE) return null;\n  if(FantasyBridge.EVO_TREE[spellId]) return FantasyBridge.EVO_TREE[spellId];\n  const sp = spellById(spellId);\n  if(sp && sp.evoArchetype && FantasyBridge.registerSpellEvoAliases){\n    FantasyBridge.registerSpellEvoAliases([sp]);\n    return FantasyBridge.EVO_TREE[spellId] || null;\n  }\n  return null;\n}\nfunction evoKey(tier, name){\n  if(typeof FantasyBridge!==\"undefined\" && FantasyBridge.evoCatalogKey) return FantasyBridge.evoCatalogKey(tier, name);\n  return tier+\":\"+name;\n}\nfunction initEvoConfig(spell){\n  if(!spell.evoConfig) spell.evoConfig = {};\n  if(typeof FantasyBridge!==\"undefined\" && FantasyBridge.ensureEvoConfig){\n    spell.evoConfig = FantasyBridge.ensureEvoConfig(spell.id, spell.evoConfig);\n  } else {\n    const tree = getEvoTree(spell.id);\n    if(tree){\n      Object.keys(tree).map(Number).filter(n=>n>0).sort((a,b)=>a-b).forEach(tier=>{\n        (tree[tier]||[]).forEach(ch=>{\n          const k=evoKey(tier, ch.name);\n          if(!spell.evoConfig[k]){\n            const slash = ch.fx && /^Slash/i.test(ch.fx) ? ch.fx : \"None\";\n            const effect = ch.fx && /^Effect/i.test(ch.fx) ? ch.fx : \"None\";\n            spell.evoConfig[k] = { enabled:false, anim:ch.anim||\"Attack1\", slash, effect, fps:14, delay:0 };\n          }\n        });\n      });\n    }\n  }\n  Object.values(spell.evoConfig).forEach(e=>{\n    if(e && e.fps==null) e.fps=14;\n    if(e && e.delay==null) e.delay=0;\n  });\n  return spell.evoConfig;\n}\nfunction evoEntry(spell, tier, choice){\n  initEvoConfig(spell);\n  return spell.evoConfig[evoKey(tier, choice.name)] || null;\n}\nfunction savedEvoSummary(spellId){\n  loadCustom();\n  const s=customSpells.find(x=>x.id===spellId);\n  if(!s||!s.evoConfig) return null;\n  initEvoConfig(s);\n  const lines=[];\n  Object.keys(s.evoConfig).forEach(k=>{\n    const e=s.evoConfig[k];\n    if(!e||!e.enabled) return;\n    lines.push(k.split(\":\").pop()+\": \"+(e.anim||\"?\")+\" @\"+(e.fps!=null?e.fps:14)+\"fps\");\n  });\n  return lines.length?{spell:s, lines}:null;\n}\nfunction showSavedStatus(){\n  const sum=savedEvoSummary(\"punch\")||savedEvoSummary(activeId);\n  const st=document.getElementById(\"pvStatus\");\n  if(!st) return;\n  if(sum){\n    st.textContent=\"Sauvé · \"+sum.spell.name+\" · \"+sum.lines.length+\" évo: \"+sum.lines.join(\" · \");\n  }\n}\nfunction previewEnabledEvos(spellId){\n  const s = ensureEditable(spellId);\n  initEvoConfig(s);\n  let steps = [];\n  if(typeof FantasyBridge!==\"undefined\" && FantasyBridge.buildEvoAnimSteps){\n    steps = FantasyBridge.buildEvoAnimSteps(spellId, s.evoConfig);\n  } else {\n    const tree = getEvoTree(spellId);\n    if(tree){\n      Object.keys(tree).map(Number).filter(n=>n>0).sort((a,b)=>a-b).forEach(tier=>{\n        (tree[tier]||[]).forEach(ch=>{\n          const e = evoEntry(s, tier, ch);\n          if(e && e.enabled){\n            steps.push(normalizeStep({\n              anim:e.anim||ch.anim, delay:e.delay!=null?e.delay:80, fps:e.fps!=null?e.fps:14,\n              slash:e.slash, effect:e.effect, hitTarget:tier===2\n            }));\n          }\n        });\n      });\n    }\n  }\n  if(!steps.length){\n    document.getElementById(\"pvStatus\").textContent = \"Aucune évolution active — coche au moins une\";\n    return;\n  }\n  steps = steps.map(normalizeStep);\n  const last = steps[steps.length-1];\n  if(last) last.hitTarget = true;\n  previewAction(steps);\n}\n\n/* ────────────────────────────────────────────────────────────\n   Prévisualisation combat (mini-moteur)\n──────────────────────────────────────────────────────────── */\nconst canvas = document.getElementById(\"arena\");\nconst ctx = canvas.getContext(\"2d\");\nctx.imageSmoothingEnabled = false;\nconst TILE_W=56, TILE_H=28, GRID=6;\nconst cam = { ox:0, oy:0, sc:1 };\nconst imgCache = new Map();\n\nfunction loadImg(folder, anim){\n  const k=folder+\"/\"+anim;\n  const cached=imgCache.get(k);\n  if(cached){\n    if(cached._v) return cached;\n    if(cached._pending) return cached;\n  }\n  const rel=`spritesheets/${folder}/${anim}.png`;\n  const urls=[];\n  if(folder===\"Head25\") urls.push(`hat-refs/Head25/${anim}.png`);\n  const bases=HOST_STANDALONE ? [BASE_CDN, BASE_LOCAL] : [BASE_LOCAL, BASE_CDN];\n  bases.forEach(b=>{ const base=b.endsWith(\"/\")?b:b+\"/\"; urls.push(base+rel); });\n  const p=new Promise(res=>{\n    let i=0, pass=0;\n    function tryNext(){\n      if(i>=urls.length){\n        if(pass===0){ pass=1; i=0; tryNext(); return; }\n        imgCache.delete(k);\n        res(null);\n        return;\n      }\n      const im=new Image();\n      if(pass===0) im.crossOrigin=\"anonymous\";\n      im.onload=()=> res(im);\n      im.onerror=()=>{ i++; tryNext(); };\n      im.src=urls[i++];\n    }\n    tryNext();\n  });\n  p._pending=true;\n  p._failed=false;\n  p.then(function(im){\n    p._pending=false;\n    if(im){ p._v=im; p._failed=false; }\n    else p._failed=true;\n  });\n  imgCache.set(k,p); return p;\n}\nfunction getImg(folder,anim){\n  const p=imgCache.get(folder+\"/\"+anim);\n  return (p&&p._v)||null;\n}\n\n/* Précharger un look */\nlet lookState = { look:{}, bodies:[{folder:\"NakedBody\",opacity:1,color:\"#d4a574\"}], colors:{} };\nfunction loadLook(){\n  try{\n    const r=localStorage.getItem(KEY_LOOK); if(!r) return;\n    const o=JSON.parse(r);\n    if(o.look) lookState.look=o.look;\n    if(o.bodies) lookState.bodies=o.bodies;\n    if(o.colors) lookState.colors=o.colors;\n  }catch(_e){}\n}\n\n/* Entités preview */\nconst player = { c:1, r:GRID/2|0, dir:3, anim:\"Idle\", frame:0, t0:0, alive:true, pv:40, pvMax:40 };\nconst enemy  = { c:GRID-2, r:GRID/2|0, dir:7, anim:\"Idle\", frame:0, t0:0, alive:true, pv:40, pvMax:40 };\n\nfunction toScreen(c,r){\n  return { x: cam.ox+(c-r)*(TILE_W/2), y: cam.oy+(c+r)*(TILE_H/2) };\n}\nfunction fitCam(){\n  const W=Math.max(canvas.width||320, canvas.clientWidth||320);\n  const H=Math.max(canvas.height||220, 220);\n  /* sync canvas internal size if CSS size differs */\n  if(canvas.width!==W){ canvas.width=W; }\n  const sc=Math.min(W/(GRID*TILE_W*0.7+24), H/(GRID*TILE_H*0.9+24), 1.6);\n  cam.sc=Math.max(0.6,sc);\n  const fx=(GRID-1)/2, fy=(GRID-1)/2;\n  const cx=W/(2*cam.sc), cy=H/(2*cam.sc);\n  cam.ox=cx-(fx-fy)*(TILE_W/2);\n  cam.oy=cy-(fx+fy)*(TILE_H/2);\n}\n\nconst ROW_LABEL_TO_DIR_ROW={\"E\":0,\"SE\":1,\"S\":2,\"SW\":3,\"W\":4,\"NW\":5,\"N\":6,\"NE\":7};\nfunction sheetRow(dir){ return dir&7; }\n\nlet raf=0;\nfunction drawLoop(){\n  raf=requestAnimationFrame(drawLoop);\n  fitCam();\n  const W=canvas.width, H=canvas.height;\n  ctx.setTransform(1,0,0,1,0,0);\n  ctx.clearRect(0,0,W,H);\n  ctx.fillStyle=\"#d8ddd4\"; ctx.fillRect(0,0,W,H);\n  ctx.save(); ctx.scale(cam.sc,cam.sc);\n  /* tiles */\n  for(let c=0;c\u003cGRID;c++) for(let r=0;r\u003cGRID;r++){\n    const s=toScreen(c,r);\n    const hw=TILE_W/2, hh=TILE_H/2;\n    ctx.beginPath();\n    ctx.moveTo(s.x,s.y-hh); ctx.lineTo(s.x+hw,s.y);\n    ctx.lineTo(s.x,s.y+hh); ctx.lineTo(s.x-hw,s.y); ctx.closePath();\n    ctx.fillStyle=((c+r)&1)?\"#e8e8e2\":\"#dcdcd6\"; ctx.fill();\n    ctx.strokeStyle=\"rgba(80,80,70,0.12)\"; ctx.lineWidth=1; ctx.stroke();\n  }\n  const now=performance.now();\n  for(const ent of [enemy, player]){\n    if(!ent.alive && ent.anim!==\"Die\") continue;\n    const anim=ent.anim||\"Idle\";\n    const row=sheetRow(ent.dir);\n    const elapsed=(now-ent.t0)/1000;\n    const fps=ent.stepFps||FPS;\n    const loop=/^(Idle|Walk|Run|RideIdle|RideRun)$/i.test(anim);\n    let col=Math.floor(elapsed*fps);\n    col=loop?col%COLS:Math.min(col,COLS-1);\n    const s=toScreen(ent.c,ent.r);\n    const sc2=1.15, dw=FW*sc2, dh=FH*sc2, FOOT=88;\n    const dx=s.x-dw/2, dy=s.y-FOOT*sc2;\n    const isEnemy=(ent===enemy);\n    /* Build layers: base + optional FX for player */\n    let layers=isEnemy\n      ? [{folder:\"NakedBody\",tint:\"#8a6060\",alpha:1},{folder:\"Head3\",tint:null,alpha:1}]\n      : playerLayers();\n    if(!isEnemy){\n      if(ent.fxSlash) layers=layers.concat([{folder:ent.fxSlash,tint:\"#e8590c\",alpha:0.9}]);\n      if(ent.fxEffect) layers=layers.concat([{folder:ent.fxEffect,tint:\"#5ec8ff\",alpha:0.85}]);\n    }\n    ctx.imageSmoothingEnabled=false;\n    let drawn=0;\n    for(const L of layers){\n      const im=getImg(L.folder,anim)||getImg(L.folder,\"Idle\"); if(!im) continue;\n      ctx.save(); ctx.globalAlpha=(L.alpha||1);\n      if(L.tint){ drawTinted(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh,L.tint); }\n      else { ctx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); }\n      ctx.restore(); drawn++;\n    }\n    if(!drawn){\n      ctx.fillStyle=isEnemy?\"#8a5050\":\"#3d6a8a\";\n      ctx.beginPath(); ctx.ellipse(s.x,s.y-16,11,16,0,0,Math.PI*2); ctx.fill();\n    }\n    if(ent.pvMax){\n      const pct=ent.pv/ent.pvMax, bw=24, bh=3, bx=s.x-bw/2, by=dy+12;\n      ctx.fillStyle=\"rgba(0,0,0,.2)\"; ctx.fillRect(bx-1,by-1,bw+2,bh+2);\n      ctx.fillStyle=isEnemy?\"#8a3030\":\"#2f6f4e\";\n      ctx.fillRect(bx,by,bw*Math.max(0,pct),bh);\n    }\n  }\n  ctx.restore();\n  /* warm missing images */\n  for(const ent of [player,enemy]){\n    const layers=ent===player?playerLayers():[{folder:\"NakedBody\"},{folder:\"Head3\"}];\n    for(const L of layers) loadImg(L.folder,ent.anim||\"Idle\").then(im=>{ if(im) im._v=im; });\n  }\n}\nconst tintCv=document.createElement(\"canvas\");\nconst tintCx=tintCv.getContext(\"2d\");\nfunction drawTinted(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex){\n  const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));\n  if(tintCv.width!==tw) tintCv.width=tw;\n  if(tintCv.height!==th) tintCv.height=th;\n  tintCx.clearRect(0,0,tw,th); tintCx.imageSmoothingEnabled=false;\n  tintCx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);\n  tintCx.globalCompositeOperation=\"multiply\"; tintCx.fillStyle=tintHex; tintCx.fillRect(0,0,tw,th);\n  tintCx.globalCompositeOperation=\"destination-in\"; tintCx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);\n  tintCx.globalCompositeOperation=\"source-over\";\n  ctx.drawImage(tintCv,dx,dy);\n}\nfunction playerLayers(){\n  const L=[];\n  for(const b of lookState.bodies){\n    if(!b.folder) continue;\n    const tint=(!b.color||b.color===\"#ffffff\")?null:b.color;\n    L.push({folder:b.folder,tint,alpha:b.opacity??1});\n  }\n  const lk=lookState.look;\n  const folder=id=>{ const v=lk[id]; return (v&&v!==\"None\")?v:null; };\n  for(const id of [\"chest\",\"legs\",\"shoes\"]){\n    const f=folder(id); if(f) L.push({folder:f,tint:(lookState.colors||{})[id]||null,alpha:1});\n  }\n  const h=folder(\"hair\"); if(h) L.push({folder:h,tint:(lookState.colors||{}).hair||null,alpha:1});\n  const hd=folder(\"head\"); if(hd) L.push({folder:hd,tint:(lookState.colors||{}).head||null,alpha:1});\n  return L.filter(x=>x.folder);\n}\n\n/* Normalise un step : string legacy → objet riche */\nfunction normalizeStep(s){\n  if(typeof s===\"string\") return {anim:s, delay:0, move:\"Idle\", fps:14, slash:\"None\", effect:\"None\", hitTarget:false};\n  return Object.assign({anim:\"Attack1\",delay:0,move:\"Idle\",fps:14,slash:\"None\",effect:\"None\",hitTarget:false}, s);\n}\n\n/* FX catalogue : on lit les dossiers depuis catalog si dispo */\nfunction fxSlashList(){ return FX_SLASH_LIST; }\nfunction fxEffectList(){ return FX_EFFECT_LIST; }\n\n/* Preview d'une action (chaîne de steps riches sur le joueur) */\nlet _previewTimer=null;\nfunction previewAction(steps){\n  if(_previewTimer){ clearTimeout(_previewTimer); _previewTimer=null; }\n  const seq=(steps&&steps.length?steps:[\"Attack1\"]).map(normalizeStep);\n  let i=0;\n  function next(){\n    if(i>=seq.length){\n      player.anim=\"Idle\"; player.t0=performance.now();\n      player.fxSlash=null; player.fxEffect=null;\n      enemy.anim=\"Idle\"; enemy.t0=performance.now();\n      return;\n    }\n    const step=seq[i++];\n    /* déplacement joueur */\n    player.anim=step.anim; player.t0=performance.now();\n    player.stepFps=step.fps||14;\n    /* FX */\n    player.fxSlash=(step.slash&&step.slash!==\"None\")?step.slash:null;\n    player.fxEffect=(step.effect&&step.effect!==\"None\")?step.effect:null;\n    /* Hit sur la cible */\n    if(step.hitTarget){\n      enemy.anim=\"TakeDamage\"; enemy.t0=performance.now();\n    }\n    let delay=Math.max(0, step.delay|0);\n    let dur;\n    if(typeof FantasyBridge!==\"undefined\" && FantasyBridge.animStepTiming){\n      const t=FantasyBridge.animStepTiming(step, COLS);\n      delay=t.delay; dur=t.dur; player.stepFps=t.fps;\n    } else {\n      let fps=(step.fps!=null?step.fps:14); if(fps\u003c1) fps=14;\n      player.stepFps=fps;\n      dur=Math.max(120, Math.round((COLS/fps)*1000));\n    }\n    _previewTimer=setTimeout(next, delay+dur);\n  }\n  /* Précharger FX */\n  seq.forEach(s=>{\n    if(s.slash&&s.slash!==\"None\") loadImg(s.slash,\"Attack1\");\n    if(s.effect&&s.effect!==\"None\") loadImg(s.effect,\"Attack1\");\n  });\n  next();\n}\n\n/* ────────────────────────────────────────────────────────────\n   UI — navigation sorts\n──────────────────────────────────────────────────────────── */\nfunction renderNav(){\n  const host=document.getElementById(\"spellNav\");\n  host.innerHTML=\"\";\n  const all=allSpells();\n  all.forEach(s=>{\n    const b=document.createElement(\"button\"); b.type=\"button\";\n    b.textContent=s.name; b.classList.toggle(\"on\",s.id===activeId);\n    b.onclick=()=>{ activeId=s.id; renderNav(); renderEditor(); };\n    host.appendChild(b);\n  });\n  const add=document.createElement(\"button\"); add.type=\"button\";\n  add.textContent=\"+ Nouveau\"; add.className=\"new\";\n  add.onclick=createSpell;\n  host.appendChild(add);\n}\n\nfunction createSpell(){\n  const id=\"custom_\"+Date.now();\n  customSpells.push({\n    id, name:\"Nouveau sort\", cost:2, range:1, dmg:[8,12],\n    anim:\"Attack1\", type:\"damage\", animSeq:[\"Attack1\"], evos:[],\n    desc:\"Décris ce sort ici…\"\n  });\n  activeId=id; saveCustom(); renderNav(); renderEditor();\n}\n\n/* ────────────────────────────────────────────────────────────\n   UI — éditeur\n──────────────────────────────────────────────────────────── */\nfunction renderEditor(){\n  const host=document.getElementById(\"editor\"); host.innerHTML=\"\";\n  if(!activeId){ host.innerHTML='\u003cp style=\"color:var(--ink2);text-align:center;padding:24px\">Sélectionne un sort\u003c/p>'; return; }\n  const sp=editableSpell(activeId);\n  if(!sp) return;\n  const isCustom=!!customSpells.find(s=>s.id===activeId);\n\n  /* ── Identité ── */\n  const idCard=card(\"Identité & paramètres\");\n  idCard.append(\n    fieldText(\"Nom\",sp.name,\"name\"),\n    mkRow2(\n      fieldNum(\"Coût PA\",sp.cost,\"cost\",1,8),\n      fieldNum(\"Portée\",sp.range,\"range\",0,8)\n    ),\n    fieldText(\"Description libre\",sp.desc||\"\",\"desc\",\"Décris ce que fait le sort, l'effet visuel…\",true),\n    mkRow2(\n      fieldSelect(\"Type\",sp.type,\"type\",[\"damage\",\"heal\",\"shield\",\"buff\",\"clone\",\"summon\"]),\n      fieldText(\"Dégâts min\",sp.dmg?String(sp.dmg[0]):\"0\",\"dmgMin\")\n    ),\n    mkRow2(\n      fieldText(\"Dégâts max\",sp.dmg?String(sp.dmg[1]):\"0\",\"dmgMax\"),\n      fieldNum(\"AoE rayon\",sp.aoe||0,\"aoe\",0,3)\n    ),\n    mkRow2(\n      fieldSelect(\"Effet\", sp.effect||\"none\", \"effect\", [\"none\",\"push\",\"roulade\",\"drainPA\"]),\n      fieldNum(\"Push (cases)\", sp.push!=null?sp.push:1, \"push\", 0, 4)\n    )\n  );\n  const eq = document.createElement(\"label\");\n  eq.className = \"field\";\n  eq.style.flexDirection = \"row\";\n  eq.style.alignItems = \"center\";\n  eq.style.gap = \"8px\";\n  const eqBox = document.createElement(\"input\");\n  eqBox.type = \"checkbox\";\n  eqBox.checked = !!sp.equipped;\n  eqBox.onchange = ()=>{\n    const s2 = ensureEditable(activeId);\n    s2.equipped = eqBox.checked;\n    scheduleAutoSave();\n  };\n  eq.appendChild(eqBox);\n  eq.appendChild(document.createTextNode(\"Équipé dans la barre de combat\"));\n  idCard.appendChild(eq);\n  host.appendChild(idCard);\n\n  /* ── Chaîne de steps ── */\n  if(!sp.steps||!sp.steps.length){\n    /* Migrer l'ancien animSeq [] ou anim string vers steps riches */\n    const old=(sp.animSeq&&sp.animSeq.length)?sp.animSeq:[sp.anim||\"Attack1\"];\n    sp.steps=old.map(normalizeStep);\n  }\n\n  const animCard=card(\"Séquence d'actions\");\n  const hint=document.createElement(\"p\"); hint.className=\"hint\";\n  hint.textContent=\"Chaque étape = une animation + ses réglages. Tap + pour ajouter, × pour retirer.\";\n  animCard.appendChild(hint);\n\n  function renderSteps(){\n    /* Re-render the steps list inside animCard */\n    const existing=animCard.querySelector(\".steps-wrap\");\n    if(existing) existing.remove();\n    const wrap=document.createElement(\"div\"); wrap.className=\"steps-wrap\";\n    wrap.style.cssText=\"display:flex;flex-direction:column;gap:8px;margin-top:6px\";\n\n    const s2=ensureEditable(activeId);\n    s2.steps.forEach((step,idx)=>{\n      const st=normalizeStep(step); s2.steps[idx]=st;\n      const box=document.createElement(\"div\");\n      box.style.cssText=\"border:1.5px solid var(--line2);border-radius:10px;padding:8px;background:var(--soft);position:relative\";\n\n      /* Header : numéro + ×supprimer */\n      const hdr=document.createElement(\"div\"); hdr.style.cssText=\"display:flex;align-items:center;gap:6px;margin-bottom:6px\";\n      const num=document.createElement(\"span\"); num.style.cssText=\"font-size:10px;font-weight:700;color:var(--acc);min-width:18px\";\n      num.textContent=\"Step \"+(idx+1);\n      const delB=document.createElement(\"button\"); delB.type=\"button\"; delB.textContent=\"×\";\n      delB.style.cssText=\"margin-left:auto;background:#fee;border:1px solid #fcc;color:#c00;border-radius:6px;padding:0 7px;cursor:pointer;font-weight:700\";\n      delB.onclick=()=>{ s2.steps.splice(idx,1); renderSteps(); };\n      hdr.appendChild(num); hdr.appendChild(delB); box.appendChild(hdr);\n\n      /* Anim */\n      const animSel=mkSelectRow(\"Animation\", ALL_ANIMS, st.anim, v=>{ st.anim=v; });\n      box.appendChild(animSel);\n      /* Mouvement joueur */\n      const moveSel=mkSelectRow(\"Mouvement joueur\", MOVE_ANIMS_LIST, st.move||\"Idle\", v=>{ st.move=v; });\n      box.appendChild(moveSel);\n      /* FX Slash */\n      const slashSel=mkSelectRow(\"FX Slash\", fxSlashList(), st.slash||\"None\", v=>{ st.slash=v; });\n      box.appendChild(slashSel);\n      /* FX Effect */\n      const fxSel=mkSelectRow(\"FX Effect\", fxEffectList(), st.effect||\"None\", v=>{ st.effect=v; });\n      box.appendChild(fxSel);\n      /* Délai avant (ms) */\n      box.appendChild(mkNumRow(\"Délai avant (ms)\", st.delay||0, 0, 3000, 50, v=>{ st.delay=v; scheduleAutoSave(); }));\n      /* Vitesse (FPS) */\n      box.appendChild(mkNumRow(\"Vitesse (FPS)\", st.fps||14, 1, 30, 1, v=>{ st.fps=v; scheduleAutoSave(); }));\n      /* Hit sur la cible */\n      box.appendChild(mkCheckRow(\"Frappe la cible (TakeDamage)\", !!st.hitTarget, v=>{ st.hitTarget=v; }));\n\n      /* Preview ce step seul */\n      const pvB=document.createElement(\"button\"); pvB.type=\"button\"; pvB.textContent=\"▶ Tester ce step\";\n      pvB.style.cssText=\"margin-top:6px;padding:5px 12px;border-radius:8px;background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;font-size:11px\";\n      pvB.onclick=()=>previewAction([st]);\n      box.appendChild(pvB);\n\n      wrap.appendChild(box);\n    });\n\n    /* Bouton ajouter */\n    const addB=document.createElement(\"button\"); addB.type=\"button\"; addB.textContent=\"+ Ajouter une étape\";\n    addB.style.cssText=\"padding:9px;border-radius:9px;border:1.5px dashed var(--acc);background:none;color:var(--acc);font-weight:700;cursor:pointer;width:100%\";\n    addB.onclick=()=>{\n      s2.steps.push(normalizeStep(\"Attack1\"));\n      renderSteps();\n    };\n    wrap.appendChild(addB);\n\n    /* Bouton preview tout */\n    const allB=document.createElement(\"button\"); allB.type=\"button\"; allB.textContent=\"▶ Prévisualiser tout\";\n    allB.style.cssText=\"margin-top:4px;padding:9px;border-radius:9px;background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;width:100%\";\n    allB.onclick=()=>{ const s3=editableSpell(activeId); previewAction(s3.steps||[]); };\n    wrap.appendChild(allB);\n\n    animCard.appendChild(wrap);\n  }\n  renderSteps();\n  host.appendChild(animCard);\n\n  /* ── Overlays corps ── */\n  const bodyCard=card(\"Corps overlay (pendant l'action)\");\n  const bHint=document.createElement(\"p\"); bHint.className=\"hint\";\n  bHint.textContent=\"Choisir un corps alternatif visible pendant le sort (ex. éthéré, squelette).\";\n  bodyCard.appendChild(bHint);\n  const bt=document.createElement(\"div\"); bt.className=\"body-tokens\";\n  BODY_OVERLAYS.forEach(b=>{\n    const btn=document.createElement(\"button\"); btn.type=\"button\"; btn.textContent=b;\n    btn.classList.toggle(\"on\",(sp.bodyOverlay||\"Aucun\")===b);\n    btn.onclick=()=>{\n      const s2=ensureEditable(activeId);\n      s2.bodyOverlay=(b===\"Aucun\")?null:b;\n      bt.querySelectorAll(\"button\").forEach(x=>x.classList.toggle(\"on\",x.textContent===b));\n    };\n    bt.appendChild(btn);\n  });\n  bodyCard.appendChild(bt);\n  host.appendChild(bodyCard);\n\n  /* ── Évolutions catalogue jeu ── */\n  const evoCard=card(\"Évolutions du jeu\");\n  const evHint=document.createElement(\"p\"); evHint.className=\"hint\";\n  evHint.textContent=\"Cases cochées = anim/FX seulement (pas les stats). La portée Coup brut reste 1 sauf si tu CHOISIS Boxeur après une victoire. Séquence d’actions = anim au cast. Combat ▶ obligatoire.\";\n  evoCard.appendChild(evHint);\n\n  const sEvo = ensureEditable(activeId);\n  initEvoConfig(sEvo);\n  if(sEvo.id===\"punch\" && typeof Combo!==\"undefined\") Combo.stamp(sEvo);\n  const tree = getEvoTree(activeId);\n\n  if(!tree && sEvo.evoConfig && Object.keys(sEvo.evoConfig).length){\n    renderStoredEvos(evoCard, sEvo);\n  } else if(!tree){\n    const noEvo=document.createElement(\"p\");\n    noEvo.className=\"hint\";\n    noEvo.textContent=\"Ce sort n'a pas de catalogue d'évolutions dans le jeu.\";\n    evoCard.appendChild(noEvo);\n  } else {\n    Object.keys(tree).map(Number).filter(n=>n>0).sort((a,b)=>a-b).forEach(tier=>{\n      const choices = tree[tier];\n      if(!choices || !choices.length) return;\n      const tierWrap=document.createElement(\"div\"); tierWrap.className=\"evo-tier\";\n      const h4=document.createElement(\"h4\"); h4.textContent=\"Palier \"+tier+\" · \"+choices.length+\" choix\";\n      tierWrap.appendChild(h4);\n      choices.forEach(ch=> tierWrap.appendChild(renderEvoChoice(activeId, tier, ch, sEvo)));\n      evoCard.appendChild(tierWrap);\n    });\n\n    const pvAll=document.createElement(\"button\"); pvAll.type=\"button\";\n    pvAll.textContent=\"▶ Prévisualiser évolutions actives\";\n    pvAll.style.cssText=\"margin-top:8px;padding:9px;border-radius:9px;background:var(--ok);color:#fff;border:none;font-weight:700;cursor:pointer;width:100%\";\n    pvAll.onclick=()=>previewEnabledEvos(activeId);\n    evoCard.appendChild(pvAll);\n  }\n  host.appendChild(evoCard);\n\n  if(!isCustom){\n    const note=document.createElement(\"p\");\n    note.style.cssText=\"font-size:11px;color:var(--ink2);text-align:center;padding:4px\";\n    note.textContent=\"Ce sort est un sort de base. Il sera copié dans tes modifications.\";\n    host.appendChild(note);\n  }\n}\n\n/* ── Helpers UI pour les steps ── */\nfunction mkSelectRow(label, opts, val, onChange){\n  const d=document.createElement(\"div\");\n  d.style.cssText=\"display:flex;align-items:center;gap:6px;margin-bottom:4px\";\n  const lb=document.createElement(\"span\"); lb.style.cssText=\"font-size:11px;color:var(--ink2);min-width:90px;flex-shrink:0\"; lb.textContent=label;\n  const sel=document.createElement(\"select\");\n  sel.style.cssText=\"flex:1;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--soft);font-size:11px\";\n  opts.forEach(o=>{ const op=document.createElement(\"option\"); op.value=o; op.textContent=o; if(o===val) op.selected=true; sel.appendChild(op); });\n  sel.onchange=()=>onChange(sel.value);\n  d.appendChild(lb); d.appendChild(sel); return d;\n}\nfunction mkNumRow(label, val, min, max, step, onChange){\n  const d=document.createElement(\"div\");\n  d.style.cssText=\"display:flex;align-items:center;gap:6px;margin-bottom:4px\";\n  const lb=document.createElement(\"     mode: enc.mode,
    size: enc.size,
    challenges,
    player: packUnit(units.allies[0]),
    allies: units.allies.slice(1).map(packUnit),
    foes: units.foes.map(packUnit),
    foeItems: enc.foes.reduce((arr, f) => arr.concat(f.items || []), []),
    foeLevels: enc.foes.map((f) => f.level),
    gold: state.hero.gold | 0,
    fleeCharges: state.hero.fleeCharges | 0
  };
  try {
    localStorage.setItem(FIGHT, JSON.stringify(payload));
    localStorage.removeItem(RESULT);
  } catch (_e) {
  }
  save();
  showLoad(enc.mode + " \xB7 niveaux " + enc.levelSum, () => {
    window.__openFight();
  });
}
function renderResult(settled) {
  if (!settled) {
    renderHome();
    return;
  }
  if (settled.dead) {
    title.textContent = "\xD7";
    badge.textContent = "0";
    const e = settled.entry || {};
    setMode("result");
    screen.innerHTML = framePanel("\u0627\u0644\u0646\u0648\u0631", String(e.level || 1), '<div class="row mark bad"><i></i>' + ico("skull") + "<b>" + esc(e.name || "") + "</b></div><p class='meters'><span class='pill'><b>" + (e.level || 1) + "</b></span><span class='pill tone-acc'><b>" + esc(e.grade || "") + "</b></span><span class='pill'><b>" + (e.fights || 0) + "</b></span></p>", true) + '<div class="actions icon-actions"><button class="primary" type="button" id="cont" aria-label="Continuer">' + ico("go") + "</button></div>";
    document.getElementById("cont").onclick = () => renderHome("Nouveau personnage : " + state.hero.name + ".");
    return;
  }
  if (settled.fled) {
    renderHome("Fuite. " + (settled.paid ? settled.paid + " kamas." : "0"));
    return;
  }
  const comp = settled.companion;
  let extra = "";
  if (comp) {
    extra = framePanel("\u0631\u0641\u064A\u0642", String(comp.companion.level), '<div class="row mark ' + (comp.accepted ? "ok" : "bad") + '"><i></i>' + ico("person") + "<b>" + comp.companion.level + " " + (comp.accepted ? "\u2713" : "\xD7") + " " + comp.chance + "</b></div>");
    if (comp.accepted) recruit(state.hero, comp.companion);
  }
  title.textContent = settled.victory ? "\u2713" : "=";
  badge.textContent = settled.grade || gradeOf(settled.style || 0);
  setMode("result");
  screen.innerHTML = framePanel(settled.victory ? "\u0646\u0635\u0631" : "\u062A\u0639\u0627\u062F\u0644", settled.grade || gradeOf(settled.style || 0), '<div class="row mark ' + (settled.victory ? "ok" : "bad") + '"><i></i>' + (settled.victory ? I.trophy : "=") + "</div><p class='meters'><span class='pill'>" + I.star + "<b>+" + (settled.xp || 0) + "</b></span><span class='pill tone-acc'>" + I.coin + "<b>+" + (settled.gold || 0) + "</b></span>" + (settled.levels && settled.levels.length ? "<span class='pill'><b>" + state.hero.level + "</b></span>" : "") + "<span class='pill tone-acc'><b>" + esc(settled.grade || "") + "</b></span>" + (settled.drops && settled.drops.length ? "<span class='pill'>" + I.bag + "<b>" + settled.drops.length + "</b></span>" : "") + "</p>", true) + extra + '<div class="actions icon-actions"><button class="primary" type="button" id="cont" aria-label="Continuer">' + ico("go") + "</button></div>";
  save();
  document.getElementById("cont").onclick = () => renderHome();
}
function open(id) {
  showLoad(id === "pre" ? "Briefing" : "Sync", () => {
    if (id === "inv") renderInv();
    else if (id === "heal") renderHeal();
    else if (id === "shop") renderShop();
    else if (id === "craft") renderCraft();
    else if (id === "forge") renderForge();
    else if (id === "board") renderBoard();
    else if (id === "pre") renderPre();
    else renderHome();
  });
}
function consumeResult() {
  let raw = null;
  try {
    raw = localStorage.getItem(RESULT);
  } catch (_e) {
  }
  if (!raw) return null;
  try {
    localStorage.removeItem(RESULT);
    localStorage.removeItem(FIGHT);
  } catch (_e) {
  }
  const report = JSON.parse(raw);
  state._catalog = catalog;
  if (report.fled) {
    const fled = useFlee(state.hero);
    if (!fled.ok) return { ok: false, fled: false, unpaid: true };
    report.paid = fled.paid || 0;
  }
  const settled = settleFight(state, report, nextRng());
  save();
  return settled;
}
function mergeEditorSpells(fileSpells) {
  const list = Array.isArray(fileSpells) ? fileSpells.slice() : [];
  try {
    const custom = JSON.parse(localStorage.getItem("neuro.customSpells") || "[]");
    if (Array.isArray(custom)) {
      custom.forEach((s) => {
        if (!isHandmadeSpell(s)) return;
        const i = list.findIndex((x) => x && x.id === s.id);
        if (i >= 0) list[i] = Object.assign({}, list[i], s);
        else list.push(s);
      });
    }
  } catch (_e) {
  }
  return list;
}
async function boot() {
  let fileSpells = [];
  fileSpells = window.__PHONE_SPELLS || [];
  catalog = prepareCatalog(mergeEditorSpells(fileSpells));
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(SAVE) || "null");
  } catch (_e) {
  }
  if (saved && saved.hero && saved.meta) {
    state = saved;
    state._catalog = catalog;
    recomputeVitals(state.hero);
  } else {
    state = createState((Date.now() ^ Math.random() * 1e9) >>> 0, catalog);
    state._catalog = catalog;
    save();
  }
  let kitChanged = syncHeroSpells(state.hero, catalog);
  (state.hero.companions || []).forEach((c) => {
    if (syncHeroSpells(c, catalog)) kitChanged = true;
  });
  if (kitChanged) save();
  showLoad("Initialisation du personnage", () => {
    const settled = consumeResult();
    if (settled && settled.unpaid) renderHome("Fuite impossible : pas assez de kamas.");
    else if (settled) renderResult(settled);
    else renderHome();
  });
}
document.querySelectorAll('a[href="fantasy-combat.html"]').forEach((a) => {
  a.addEventListener("click", (ev) => {
    ev.preventDefault();
    try {
      localStorage.removeItem(FIGHT);
    } catch (_e) {
    }
    window.__openFight();
  });
});
window.__afterFight = () => {
  const frame = document.getElementById("fight");
  if (frame) {
    frame.style.display = "none";
    frame.srcdoc = "";
  }
  const hubEl = document.getElementById("hub");
  if (hubEl) hubEl.style.display = "";
  const settled = consumeResult();
  if (settled && settled.unpaid) renderHome("Fuite impossible : pas assez de kamas.");
  else if (settled) renderResult(settled);
  else renderHome();
};
boot();

</script>
