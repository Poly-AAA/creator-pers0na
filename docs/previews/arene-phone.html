<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Arène</title>
<style>
/* Variante D — Minimal. Fond clair, orange plein, aucune bordure décorative. */
@import url("https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Kufi+Arabic:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap");

:root{
  --bg:#FAF7F0;
  --panel:#FFFFFF;
  --ink:#2F3133;
  --ink2:#8A8278;
  --acc:#EA7020;
  --acc2:#F4B07A;
  --soft:#EFE6D6;
  --onacc:#FFFFFF;
  --line:#E7DFD2;
  --bad:#8A3030;
  --ok:#2F6F4E;
  --shadow:0 1px 0 rgba(47,49,51,.06);
  --glass:rgba(255,255,255,.78);
  --tap:48px;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);
}
html.dark{
  --bg:#141618;
  --panel:#23272C;
  --ink:#F6F1E8;
  --ink2:#C9BBA8;
  --acc:#EA7020;
  --acc2:#F4B07A;
  --soft:#2C3036;
  --onacc:#FFFFFF;
  --line:#3E444C;
  --bad:#C98A78;
  --ok:#F4B07A;
  --shadow:0 1px 0 rgba(246,241,232,.08);
  --glass:rgba(28,31,35,.78);
}

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body.skin-d{
  font-family:"Pixelify Sans","DotGothic16",ui-sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-y:auto;
}
body.skin-d *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body.skin-d button,body.skin-d a.tap{
  min-height:var(--tap);touch-action:manipulation;
}
.ar{font-family:"Noto Kufi Arabic","Pixelify Sans",sans-serif}
.orient{display:none}
@media (orientation:portrait) and (max-width:900px){
  .orient{
    display:flex;position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);
    align-items:center;justify-content:center;text-align:center;padding:28px;
    font-size:22px;font-weight:700;
  }
}

.hazard{
  height:10px;background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,var(--bg) 8px 16px);
}
.app-hub{
  min-height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;
  padding:var(--safe-t) 0 var(--safe-b);
  background:var(--bg);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px 8px;
}
.topbar h1{margin:0;font-size:22px;letter-spacing:.04em;font-weight:700}
.badge{
  background:var(--acc);color:var(--onacc);padding:6px 10px;font-size:13px;letter-spacing:.08em;
}
.screen{flex:1;padding:6px 14px 18px;display:flex;flex-direction:column;gap:12px}
.kicker{color:var(--ink2);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.panel{background:var(--panel);box-shadow:var(--shadow);padding:12px}
.panel h2{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:var(--ink2);font-size:13px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--soft);display:flex;gap:2px}
.bar i{flex:1;background:transparent}
.bar i.on{background:var(--acc)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions button,.tap{
  border:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);
  font:inherit;font-size:16px;text-align:left;padding:12px 14px;width:100%;
  text-decoration:none;display:flex;justify-content:space-between;align-items:center;
}
.actions button.primary,.tap.primary{background:var(--acc);color:var(--onacc)}
.actions button:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{
  background:var(--panel);box-shadow:var(--shadow);padding:10px;min-height:64px;
  border:0;font:inherit;text-align:left;color:var(--ink);width:100%;
}
.slot b{display:block;font-size:14px}
.slot span{color:var(--ink2);font-size:12px}
.load{
  flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 8px;
}
.load h1{margin:0;font-size:42px;letter-spacing:.18em}
.load .track{height:8px;background:var(--soft)}
.load .track i{display:block;height:100%;width:0;background:var(--acc);animation:fill .7s linear forwards}
@keyframes fill{to{width:100%}}
.footer-links{padding:8px 14px 16px;display:flex;gap:10px;flex-wrap:wrap}
.footer-links a{color:var(--ink2);font-size:13px;letter-spacing:.06em}
@media (max-height:740px){
  .topbar{padding:6px 12px 4px}
  .topbar h1{font-size:18px}
  .screen{gap:6px;padding:4px 12px 8px}
  .panel{padding:8px}
  .panel h2{font-size:15px;margin-bottom:4px}
  .statgrid{font-size:13px;gap:2px 10px}
  .muted{font-size:12px}
  .actions{gap:4px}
  .actions button,.tap{min-height:40px;padding:6px 12px;font-size:15px}
  .footer-links{padding:6px 12px 10px}
}
.float-note{font-size:13px;color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.offer{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel);box-shadow:var(--shadow);padding:10px}
.offer button{min-height:44px;border:0;background:var(--acc);color:#fff;font:inherit;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--soft);font:inherit;padding:8px 10px;min-height:44px}
.chips button.on{background:var(--acc);color:#fff}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{display:inline-flex;align-items:center;justify-content:center;color:inherit}
.ico svg,.footer-links svg,#themeBtn svg{width:22px;height:22px;display:block}
.tone-acc{color:var(--acc)}
.tone-soft{color:var(--ink2)}
.top-tools{display:flex;align-items:center;gap:6px}
#themeBtn{
  width:40px;height:40px;min-width:40px;min-height:40px;padding:0;
  border:0;background:transparent;color:var(--ink);box-shadow:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.pill{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px}
.pill svg{width:16px;height:16px}
.meters{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pips i{font-style:normal;font-weight:700;font-size:14px}
.tier.t1{background:var(--soft);color:var(--ink)}
.tier.t2{background:var(--acc2);color:#2F3133}
.tier.t3{background:var(--acc);color:var(--onacc)}
.offer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.offer-grid button,.slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.icon-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.icon-actions button{justify-content:center;text-align:center;padding:6px}
.footer-links a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;text-decoration:none}

@media (orientation:landscape) and (max-height:560px){
  html,body.skin-d{height:100%;overflow:hidden}
  .app-hub{
    max-width:none;height:100dvh;max-height:100dvh;overflow:hidden;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative;
  }
  .hazard{height:6px}
  .topbar{padding:2px 8px;min-height:0}
  .topbar h1{font-size:16px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .screen{min-height:0;overflow:hidden;padding:4px 8px;gap:4px;display:flex;flex-direction:column}
  .screen.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(168px,.75fr);align-content:stretch;gap:6px}
  .screen.load-screen{align-items:center;justify-content:center}
  .panel{padding:6px}
  .panel h2{font-size:14px;margin:0 0 4px}
  .statgrid{grid-template-columns:repeat(4,minmax(0,1fr));font-size:13px;gap:2px 8px}
  .footer-links{padding:2px 8px 4px;flex-wrap:nowrap}
  .actions{gap:4px}
  .icon-actions{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .icon-actions button,.actions button,.tap,.chips button,.offer-grid button{
    min-height:44px;padding:4px;font-size:14px
  }
  .slot{min-height:44px;padding:4px}
  .grid2.slots{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .chips{gap:4px}
  .list{gap:4px}
  .load{padding:4px;gap:8px}
  .load h1{font-size:28px;letter-spacing:.12em}
  .float-note{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;background:var(--acc);color:#fff;padding:4px 8px;display:inline-flex;align-items:center;gap:4px}
}
body.skin-d .app{max-width:none}
body.skin-d .link-cc{border:0;border-radius:0;font-size:12px}

/* Écran : cadres, pastilles, échelle, lueur. Pas de flou. */
:root{
  --phosphor:rgba(234,112,32,.22);
  --frame:#2F3133;
}
html.dark{
  --phosphor:rgba(234,112,32,.8);
  --frame:#EA7020;
}
.crt{
  pointer-events:none;position:fixed;inset:0;z-index:70;
  background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(47,49,51,.05) 3px 4px);
  animation:crt-on .42s steps(2,end) 1;
}
html.dark .crt{
  background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);
  box-shadow:inset 0 0 40px rgba(234,112,32,.16);
}
@keyframes crt-on{0%{opacity:.15}45%{opacity:.7}100%{opacity:1}}
.panel,.glass,.evo-card,.slot,.offer,.offer-grid button,.chips button,.tier,.icon-actions button{
  position:relative;
  border:1px solid var(--frame);
  border-radius:3px;
  box-shadow:0 0 0 1px rgba(234,112,32,.16);
}
html.dark .panel,html.dark .glass,html.dark .evo-card,html.dark .slot,html.dark .offer,
html.dark .offer-grid button,html.dark .chips button,html.dark .tier,html.dark .icon-actions button{
  box-shadow:0 0 6px var(--phosphor);
}
.panel::before,.evo-card::before{
  content:"";position:absolute;inset:3px;border:1px solid var(--frame);border-radius:2px;opacity:.35;pointer-events:none;
}
.badge,.pill,.turn-pip,.clock,.readout,.link-cc{
  border:1px solid var(--frame);border-radius:3px;
  box-shadow:0 0 0 1px rgba(234,112,32,.12);
}
html.dark .badge,html.dark .pill,html.dark .turn-pip,html.dark .clock,html.dark .readout,html.dark .link-cc{
  box-shadow:0 0 6px var(--phosphor);
}
html.dark body.skin-d h1,html.dark .kicker,html.dark .grade,html.dark .clock,html.dark .readout,html.dark .boot{
  text-shadow:0 0 6px var(--phosphor);
}
body.skin-d h1,body.skin-d .kicker,body.skin-d .boot{text-shadow:0 0 1px rgba(234,112,32,.25)}
.icon-actions button,.actions button.tier{border-radius:3px}
.row.mark{gap:6px}
.row.mark>i{
  width:7px;height:7px;flex:none;background:var(--ok);
  box-shadow:0 0 3px rgba(47,111,78,.45);
}
html.dark .row.mark>i{box-shadow:0 0 5px rgba(244,176,122,.8)}
.row.mark.bad>i{background:var(--bad);box-shadow:0 0 4px rgba(138,48,48,.55)}
.slot.mark::after,.chips button.on::after{
  content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;background:var(--ok);
  box-shadow:0 0 3px rgba(47,111,78,.45);pointer-events:none;
}
.slot.mark.bad::after{background:var(--bad);box-shadow:0 0 4px rgba(138,48,48,.55)}
html.dark .slot.mark::after,html.dark .chips button.on::after{box-shadow:0 0 4px rgba(244,176,122,.85)}
.bar{height:8px;gap:3px;background:transparent}
.bar i{border:1px solid var(--line)}
.bar i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 3px var(--phosphor)}
.seg i.on{box-shadow:0 0 3px var(--phosphor)}
.ruler{
  display:flex;justify-content:space-between;align-items:flex-end;
  height:12px;font-size:9px;letter-spacing:0;color:var(--ink2);
  background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 10px);
  background-size:100% 4px;background-repeat:no-repeat;background-position:bottom;
}
.wave{display:block;width:100%;height:28px;color:var(--acc)}
html.dark .wave{filter:none;color:#F4B07A}
.boot{opacity:0;font-size:12px;letter-spacing:.08em;animation:bootline .16s linear forwards}
.boot:nth-child(2){animation-delay:.1s}
.boot:nth-child(3){animation-delay:.2s}
@keyframes bootline{to{opacity:1}}
.readout{font-family:"DotGothic16","Pixelify Sans",sans-serif;font-size:12px;padding:0 4px}
.frame-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px}

#fight{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#FAF7F0;z-index:50}
</style>

<script>
(function(){
  var KEY="roguelite.theme";
  var sun="<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='2.6' fill='currentColor'/><path stroke='currentColor' stroke-width='1.5' d='M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4'/></svg>";
  var moon="<svg viewBox='0 0 16 16' aria-hidden='true'><path fill='currentColor' d='M9.2 1.6a5.6 5.6 0 1 0 5.2 7.6 4.6 4.6 0 0 1-5.2-7.6z'/></svg>";
  function apply(){
    var dark=false;
    try{ dark=localStorage.getItem(KEY)==="dark"; }catch(e){}
    document.documentElement.classList.toggle("dark", dark);
    var b=document.getElementById("themeBtn");
    if(b) b.innerHTML= dark ? sun : moon;
  }
  apply();
  var b=document.getElementById("themeBtn");
  if(b) b.addEventListener("click", function(){
    var next=document.documentElement.classList.contains("dark") ? "light" : "dark";
    try{ localStorage.setItem(KEY, next); }catch(e){}
    apply();
  });
})();
</script>

SHEETS));\n      localStorage.setItem(KEY_DIR_VER, DIR_CAL_VER);\n      DIR_ROW = DEFAULT_DIR_ROW.slice();\n      DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);\n    }\n  }catch(_e){}\n  function dirMapForAnim(anim){\n    if(anim && DIR_SHEETS[anim]) return DIR_SHEETS[anim];\n    /* fallback : famille d’anim */\n    if(anim && /^Attack|^Kick|^Special/i.test(anim) && DIR_SHEETS.Attack1) return DIR_SHEETS.Attack1;\n    if(anim && /^(Walk|Run|Strafe|Crouch)/i.test(anim) && DIR_SHEETS.Walk) return DIR_SHEETS.Walk;\n    return DIR_ROW;\n  }\n  function sheetRowForDir(dir, anim){\n    const m = dirMapForAnim(anim);\n    const f=dir&7;\n    for(let r=0;r\u003c8;r++) if(m[r]===f) return r;\n    return f;\n  }\n  function dirFromIsoDelta(dc, dr){\n    if(!dc && !dr) return null;\n    const sx = dc - dr, sy = dc + dr;\n    let i = Math.round(Math.atan2(sx, -sy) / (Math.PI/4));\n    if(i \u003c 0) i += 8;\n    return i & 7;\n  }\n\n  const PAD_VEC = { u:{dc:0,dr:-1}, r:{dc:1,dr:0}, d:{dc:0,dr:1}, l:{dc:-1,dr:0} };\n\n  const DEFAULT_COLORS = {\n    body:\"#d4a574\", shoes:\"#3a3230\", legs:\"#3e4f63\", chest:\"#5b7c99\",\n    belt:\"#8b6914\", gloves:\"#6a5a4e\", offhand:\"#6b8f71\", weapon:\"#9aa8b8\",\n    backpack:\"#7a5c3a\", head:\"#e0b878\", slash:\"#e8590c\", effect:\"#5ec8ff\", mount:\"#8a7060\",\n  };\n\n  const SPELLS = [\n    { id:\"punch\", name:\"Coup brut\", cost:2, range:1, aoe:0, dmg:[8,12], anim:\"Attack2\", type:\"damage\" },\n    { id:\"monofil\", name:\"Lame spectrale\", cost:3, range:1, aoe:0, dmg:[14,18], anim:\"Attack3\", type:\"damage\" },\n    { id:\"arc\", name:\"Éclair runique\", cost:3, range:4, aoe:0, dmg:[10,15], anim:\"Attack1\", type:\"damage\" },\n    { id:\"surchauffe\", name:\"Brasier\", cost:4, range:3, aoe:1, dmg:[16,22], anim:\"Attack5\", type:\"damage\" },\n    { id:\"parasite\", name:\"Maléfice\", cost:4, range:4, aoe:0, dmg:[12,18], anim:\"Attack3\", type:\"damage\", effect:\"drainPA\" },\n    { id:\"gravite\", name:\"Poussée tellu (occupied(nc,nr, skipKey)) continue;\n      if(G.enemy.alive && G.enemy.c===nc && G.enemy.r===nr) continue;\n      if(G.clone && G.clone.alive && G.clone.c===nc && G.clone.r===nr) continue;\n      ent.c = nc; ent.r = nr;\n      return true;\n    }\n    return false;\n  }\n\n  function stepEntityAwayOnce(ent, from, skipKey){\n    let dc = Math.sign(ent.c - from.c);\n    let dr = Math.sign(ent.r - from.r);\n    if(dc===0 && dr===0){\n      const dirs = [[0,1],[1,0],[0,-1],[-1,0]];\n      const d = dirs[(from.dir|0) % 4] || [0,1];\n      dc = d[0]; dr = d[1];\n    }\n    const tries = [];\n    if(dc && dr) tries.push([dc,dr],[dc,0],[0,dr]);\n    else if(dc) tries.push([dc,0],[0,1],[0,-1]);\n    else tries.push([0,dr],[1,0],[-1,0]);\n    for(const [tdc,tdr] of tries){\n      const nc = ent.c + tdc, nr = ent.r + tdr;\n      if(!inBounds(nc,nr)) continue;\n      if(occupied(nc,nr, skipKey)) continue;\n      if(G.enemy.alive && G.enemy.c===nc && G.enemy.r===nr) continue;\n      if(G.clone && G.clone.alive && G.clone.c===nc && G.clone.r===nr) continue;\n      ent.c = nc; ent.r = nr;\n      return true;\n    }\n    return false;\n  }\n\n  /** Une roulade animée (slide + Rolling). Appelle onDone à la fin. */\n  function playOneRoulade(sp, evo, onDone){\n    const planned = planRouladePath(G.player, sp, evo);\n    const path = planned.path || [];\n    if(!path.length){\n      if(typeof onDone === \"function\") onDone(null, true);\n      return;\n    }\n    const from = { c:G.player.c, r:G.player.r };\n    const to = path[path.length - 1];\n    faceToward(G.player, to.c, to.r);\n\n    reloadCustomSpells();\n    const custom = customSpellById(sp.id) || sp;\n    const chosen = chosenEvoStep(sp);\n    const rawStep = chosen || (custom.steps && custom.steps[0]) || (sp.steps && sp.steps[0]) || null;\n    const step = normalizeCastStep(rawStep || { anim: (sp.anim||\"Rolling\"), fps:16 });\n    let fps = Number(step.fps);\n    if(!isFinite(fps) || fps \u003c 1) fps = 14;\n    fps = Ma (\n        \"Roulade · \"+lastMode+\n        (rollsDone > 1 ? \" ×\"+rollsDone : \"\")+\n        \" · \"+cellsMoved+\" case\"+(cellsMoved>1?\"s\":\"\")\n      );\n      recomputeMoves(); recomputeTargets(); renderSpells(); hud();\n    };\n\n    const runRoll = (index)=>{\n      playOneRoulade(sp, evo, (planned, current)=>{\n        if(!current) return;\n        if(!planned || !planned.path || !planned.path.length){\n          if(rollsDone === 0) setStatus(\"Roulade · bloqué\");\n          finish();\n          return;\n        }\n        rollsDone += 1;\n        cellsMoved += planned.path.length;\n        lastMode = planned.mode || lastMode;\n\n        const next = index + 1;\n        if(next >= maxRolls){\n          finish();\n          return;\n        }\n        /* Approche : stop si déjà CAC après la 1re. Recul : toujours enchaîner. */\n        if(mode0 === \"approche\" && G.enemy && G.enemy.alive && dist(G.player, G.enemy) \u003c= 1){\n          finish();\n          return;\n        }\n        runRoll(next);\n      });\n    };\n\n    runRoll(0);\n  }\n\n  /** @deprecated kept for helpers — use castRoulade */\n  function applyRoulade(ent, sp, evo){\n    const planned = planRouladePath(ent, sp, evo);\n    if(!planned.path.length) return 0;\n    const to = planned.path[planned.path.length-1];\n    faceToward(ent, to.c, to.r);\n    ent.c = to.c; ent.r = to.r;\n    return planned.path.length;\n  }\n\n  /** Avance `ent` vers `target` sur N cases (cases libres, sans marcher sur l’ennemi). */\n  function stepEntityToward(ent, target, cells, skipKey){\n    let moved = 0;\n    const n = Math.max(0, cells|0);\n    for(let i=0;i\u003cn;i++){\n      if(!stepEntityTowardOnce(ent, target, skipKey)) break;\n      moved++;\n    }\n    return moved;\n  }\n\n  function spawnClone(sp, evo){\n    const p = G.player, e = G.enemy;\n    let c = p.c, r = p.r;\n    if(e.alive){\n      if(e.c !== p.c) c = p.c + Math.sign(e.c - p.c);\n      else if(e.r !== p.r) r = p.r + Math.sign(e.r - p.   creator: "\u003c!DOCTYPE html>\n\u003chtml lang=\"fr\">\n\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no\"/>\n\u003ctitle>Créateur fantasy\u003c/title>\n\u003cscript>try{if(localStorage.getItem(\"roguelite.theme\")===\"dark\")document.documentElement.classList.add(\"dark\");}catch(e){}\u003c/script>\n\u003cstyle>\n  :root{\n    --bg:#FAF7F0; --bg2:#F6F1E8; --ink:#2F3133; --ink2:#8A8278;\n    --line:#E7DFD2; --line2:#E7DFD2; --card:#FFFFFF; --tap:48px;\n    --sel:#2F3133; --soft:#EFE6D6; --side:132px;\n    --acc:#EA7020; --phosphor:rgba(234,112,32,.22); --frame:#2F3133;\n  }\n  html.dark{\n    --bg:#141618; --bg2:#1C1F23; --ink:#F6F1E8; --ink2:#C9BBA8;\n    --line:#3E444C; --line2:#3E444C; --card:#23272C;\n    --sel:#F6F1E8; --soft:#2C3036; --acc:#EA7020;\n    --phosphor:rgba(234,112,32,.8); --frame:#EA7020;\n  }\n  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}\n  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);\n    font:15px/1.35 Helvetica,Arial,sans-serif; overflow:hidden; overscroll-behavior:none}\n  .app{\n    height:100%;height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:row;\n    background:var(--bg);\n  }\n\n  /* Menu gauche (ex-bas) */\n  .dock{\n    width:var(--side);flex-shrink:0;display:flex;flex-direction:column;gap:8px;\n    padding:10px 8px calc(10px + env(safe-area-inset-bottom));\n    background:var(--card);border-right:1px solid var(--frame);box-shadow:inset 0 0 0 1px rgba(234,112,32,.2);\n    overflow:auto;min-height:0;\n  }\n  .dock .sec{display:flex;flex-direction:column;gap:6px}\n  .dock .ttl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}\n  .step-row{display:flex;align-items:center;gap:4px}\n  .step-row .nav{\n    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--soft);\n    color:var(--sel);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;\n  }\n  .step-row .nav:active{background:var(--sel);color:#fff}\n  .step-row .val{\n    flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;\n    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n  }\n  .swatches{display:flex;flex-wrap:wrap;gap:2px}\n  .sw{width:12px;height:12px;border-radius:50%;border:1px solid transparent;cursor:pointer;padding:0;\n    box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}\n  .sw.on{border-color:var(--sel);transform:scale(1.15)}\n  .sw.bw{box-shadow:inset 0 0 0 1px #999}\n  .btn{\n    width:100%;min-height:40px;border:1px solid var(--frame);background:var(--card);color:var(--ink);\n    border-radius:3px;font-size:12px;cursor:pointer;padding:6px 4px;\n    box-shadow:0 0 0 1px rgba(234,112,32,.12);\n  }\n  html.dark .btn{box-shadow:0 0 6px var(--phosphor)}\n  .btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}\n  .btn.ghost{min-height:36px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}\n  /* Pavé directionnel */\n  .dpad{display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px);gap:2px;margin:0 auto}\n  .dpad button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--soft);\n    color:var(--sel);font-size:14px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}\n  .dpad button:active{background:var(--sel);color:#fff}\n  .dpad span{width:30px;height:30px}\n  .status{font-size:10px;color:var(--ink2);text-align:center;line-height:1.25}\n  .size-row{display:flex;align-items:center;gap:4px}\n  .size-row input{flex:1;accent-color:var(--sel);min-width:0}\n  .size-row span{font-size:11px;color:var(--ink2);width:2.6em;text-align:right}\n\n  .body-stack{display:none;flex-direction:column;gap:6px}\n  .body-stack.on{display:flex}\n  .body-hint{font-size:10px;color:var(--ink2);line-height:1.25;margin:0}\n  .body-row{\n    display:flex;flex-direction:column;gap:4px;padding:6px;border:1px solid var(--line2);\n    border-radius:10px;background:var(--card);\n  }\n  .body-row.on{border-color:var(--sel)}\n  .body-row .top{display:flex;align-items:center;gap:4px}\n  .body-row .idx{font-size:10px;color:var(--ink2);width:14px}\n  .body-row .name{flex:1;font-size:11px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .body-row .ops{display:flex;gap:2px}\n  .body-row .ops button,.body-row .sw-mini{\n    width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--soft);\n    color:var(--ink);font-size:12px;cursor:pointer;padding:0;\n  }\n  .body-row .sw-mini{border-radius:50%}\n  .body-row input[type=range]{width:100%;accent-color:var(--sel)}\n\n  /* Zone perso */\n  .stage{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}\n  canvas#stage{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}\n\n  /* Onglets parties — colonne droite, tête → pieds */\n  .zones{\n    position:absolute;top:10%;right:6px;bottom:22%;z-index:4;\n    display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;\n    width:72px;pointer-events:none;\n  }\n  .zones .callout{\n    pointer-events:auto;border:1px solid var(--frame);background:var(--card);color:var(--ink);\n    padding:5px 4px;border-radius:3px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;\n    font-size:9px;min-height:28px;text-align:center;line-height:1.15;\n  }\n  .zones .callout.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}\n\n  .rot{\n    position:absolute;z-index:6;width:var(--tap);height:var(--tap);border-radius:50%;\n    border:1.5px solid var(--line);background:var(--card);color:var(--sel);\n    font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;\n    box-shadow:0 2px 8px rgba(0,0,0,.08);padding:0;\n  }\n  .rot:active{background:var(--sel);color:#fff}\n\n  .sheet{position:fixed;inset:0;z-index:40;background:rgba(40,40,38,.35);display:none;align-items:flex-end;justify-content:center}\n  .sheet.on{display:flex}\n  .sheet-panel{width:min(430px,100%);background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}\n  .sheet-panel h3{margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase}\n  .sheet-panel label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:10px}\n  .sheet-panel input[type=range]{flex:1;accent-color:var(--sel)}\n  .preview-sw{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);margin:0 auto}\n  .sheet-actions{display:flex;gap:10px}\n  .sheet-actions button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:15px}\n  .sheet-actions .ok{background:var(--sel);color:#fff;border-color:var(--sel)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"crt\" aria-hidden=\"true\">\u003c/div>\n\u003cdiv class=\"bootlines ar\" aria-hidden=\"true\">\u003cspan>فحص\u003c/span>\u003cspan>سليم\u003c/span>\u003cspan>التزامن\u003c/span>\u003c/div>\n\u003cstyle>\n  .crt{pointer-events:none;position:fixed;inset:0;z-index:30;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(47,49,51,.05) 3px 4px);animation:crt-on .42s steps(2,end) 1}\n  html.dark .crt{background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);box-shadow:inset 0 0 40px rgba(234,112,32,.16)}\n  @keyframes crt-on{0%{opacity:.15}45%{opacity:.7}100%{opacity:1}}\n  .bootlines{pointer-events:none;position:fixed;left:8px;bottom:6px;z-index:31;display:flex;gap:8px;font-size:11px;color:#EA7020;animation:bootgone 1.1s linear forwards}\n  .bootlines span{opacity:0;animation:bootline .16s linear forwards}\n  .bootlines span:nth-child(2){animation-delay:.12s}\n  .bootlines span:nth-child(3){animation-delay:.24s}\n  @keyframes bootline{to{opacity:1}}\n  @keyframes bootgone{0%,65%{opacity:1}100%{opacity:0}}\n  html.dark .ttl,html.dark .status{text-shadow:0 0 6px var(--phosphor)}\n  .ruler{display:flex;justify-content:space-between;height:12px;font-size:9px;color:var(--ink2);background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 10px);background-size:100% 4px;background-repeat:no-repeat;background-position:bottom}\n\u003c/style>\n\u003cdiv class=\"app\">\n  \u003caside class=\"dock\" id=\"dock\">\n    \u003cdiv class=\"ruler\" aria-hidden=\"true\">\u003cspan>-50\u003c/span>\u003cspan>0\u003c/span>\u003cspan>+50\u003c/span>\u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cspan class=\"ttl\">Anim\u003c/span>\n      \u003cdiv class=\"step-row\">\n        \u003cbutton type=\"button\" class=\"nav\" id=\"animPrev\" aria-label=\"Anim précédente\">‹\u003c/button>\n        \u003cspan class=\"val\" id=\"animVal\">Idle\u003c/span>\n        \u003cbutton type=\"button\" class=\"nav\" id=\"animNext\" aria-label=\"Anim suivante\">›\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cspan class=\"ttl\">Vitesse (FPS)\u003c/span>\n      \u003cdiv class=\"size-row\">\n        \u003cinput type=\"range\" id=\"fpsSlider\" min=\"1\" max=\"30\" value=\"14\" step=\"1\"/>\n        \u003cspan id=\"fpsVal\">14\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cspan class=\"ttl\">Direction\u003c/span>\n      \u003cdiv class=\"dpad\" id=\"dpad\">\n        \u003cbutton type=\"button\" data-d=\"6\">↖\u003c/button>\n        \u003cbutton type=\"button\" data-d=\"7\">↑\u003c/button>\n        \u003cbutton type=\"button\" data-d=\"0\">↗\u003c/button>\n        \u003cbutton type=\"button\" data-d=\"5\">←\u003c/button>\n        \u003cspan>\u003c/span>\n        \u003cbutton type=\"button\" data-d=\"1\">→\u003c/button>\n        \u003cbutton type=\"button\" data-d=\"4\">↙\u003c/button>\n        \u003cbutton type=\"button\" data-d=\"3\">↓\u003c/button>\n        \u003cbutton type=\"button\" data-d=\"2\">↘\u003c/button>\n      \u003c/div>\n      \u003cspan class=\"val\" id=\"dirVal\" style=\"text-align:center;font-size:11px;color:var(--ink2)\">E\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cspan class=\"ttl\">Choix\u003c/span>\n      \u003cdiv class=\"step-row\">\n        \u003cbutton type=\"button\" class=\"nav\" id=\"optPrev\" aria-label=\"Choix précédent\">‹\u003c/button>\n        \u003cspan class=\"val\" id=\"optVal\" title=\"Extra : taper pour sous-slot\">—\u003c/span>\n        \u003cbutton type=\"button\" class=\"nav\" id=\"optNext\" aria-label=\"Choix suivant\">›\u003c/button>\n      \u003c/div>\n      \u003cbutton type=\"button\" class=\"btn ghost\" id=\"btnClear\">Aucun\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cspan class=\"ttl\">Taille\u003c/span>\n      \u003cdiv class=\"size-row\">\n        \u003cinput type=\"range\" id=\"charSize\" min=\"50\" max=\"85\" value=\"74\" step=\"1\"/>\n        \u003cspan id=\"charSizeVal\">74%\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cspan class=\"ttl\">Couleur\u003c/span>\n      \u003cdiv class=\"swatches\" id=\"swatches\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"body-stack\" id=\"bodyStack\">\n      \u003cspan class=\"ttl\">Corps\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"addBody\">+ Couche\u003c/button>\n      \u003cp class=\"body-hint\">Couche · ↑↓ ordre · couleur\u003c/p>\n      \u003cdiv id=\"bodyRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\" style=\"margin-top:auto\">\n      \u003cbutton type=\"button\" class=\"btn\" id=\"btnAdvanced\" style=\"font-size:10px;letter-spacing:.05em\">⚙ Équipements avancés\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"btnRandom\">Aléatoire\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"btnReset\">Reset\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn primary\" id=\"btnExport\">Sauver\u003c/button>\n      \u003ca class=\"btn ok\" id=\"btnCombat\" data-fcc=\"combat\" href=\"fantasy-combat.html\" style=\"display:block;text-align:center;text-decoration:none;line-height:40px;background:#2f6f4e;color:#fff;border-color:#2f6f4e\">Combat\u003c/a>\n      \u003ca class=\"btn\" id=\"btnSpellEditor\" href=\"spell-editor.html\" style=\"display:block;text-align:center;text-decoration:none;line-height:40px;background:#4a3870;color:#fff;border-color:#4a3870\">Sorts\u003c/a>\n      \u003cdiv class=\"status\" id=\"status\">Chargement…\u003c/div>\n    \u003c/div>\n  \u003c/aside>\n\n  \u003csection class=\"stage\" id=\"stageWrap\">\n    \u003ccanvas id=\"stage\" width=\"280\" height=\"520\" aria-label=\"Personnage\">\u003c/canvas>\n    \u003cdiv class=\"zones\" id=\"callouts\">\u003c/div>\n    \u003cbutton type=\"button\" class=\"rot\" id=\"dirPrev\" aria-label=\"Tourner gauche\">‹\u003c/button>\n    \u003cbutton type=\"button\" class=\"rot\" id=\"dirNext\" aria-label=\"Tourner droite\">›\u003c/button>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"sheet\" id=\"colorSheet\" role=\"dialog\" aria-modal=\"true\">\n  \u003cdiv class=\"sheet-panel\">\n    \u003ch3>Couleur avancée\u003c/h3>\n    \u003cdiv class=\"preview-sw\" id=\"advPreview\">\u003c/div>\n    \u003clabel>Teinte \u003cinput type=\"range\" id=\"advH\" min=\"0\" max=\"360\" value=\"30\"/>\u003c/label>\n    \u003clabel>Saturation \u003cinput type=\"range\" id=\"advS\" min=\"0\" max=\"100\" value=\"40\"/>\u003c/label>\n    \u003clabel>Clarté \u003cinput type=\"range\" id=\"advL\" min=\"5\" max=\"95\" value=\"55\"/>\u003c/label>\n    \u003cdiv class=\"sheet-actions\">\n      \u003cbutton type=\"button\" id=\"advCancel\">Annuler\u003c/button>\n      \u003cbutton type=\"button\" class=\"ok\" id=\"advOk\">OK\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  const BASE_LOCAL = \"assets/packs/fantasy-cc/\";\n  const BASE_CDN = \"https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f2e5a50/assets/packs/fantasy-cc/\";\n  const FW=128, FH=128, COLS=15;\n  const DIR_ROW=[0,1,2,3,4,5,6,7];\n  let weaponAfterShieldRows=[true,true,true,false,false,false,false,true];\n  let backpackInFrontRows=[true,false,false,false,false,true,true,true];\n\n  /* Layout épuré : perso haut, ombre, rot dessous ; zones à droite tête→pieds ; menu à gauche */\n  /* sizePct = fraction de la HAUTEUR de la scène (le sprite a beaucoup de marge vide) */\n  const LAY = {\n    char:{ xPct:40, yPct:44, sizePct:0.74 },\n    shadow:{ xPct:40, yPct:66, opacity:0.08 },\n    zonesLab:{\n      hair:\"Coiff.\", head:\"Équip.\", body:\"Corps\",\n      chest:\"Torse\", backpack:\"Sac\", legs:\"Jambes\",\n      shoes:\"Chauss.\", mount:\"Monture\", weapon:\"Extra\",\n    },\n    rot:{ yPct:86, gapPct:22, size:48 }\n  };\n\n  /* Mode simplifié (par défaut) : hair + head + body uniquement\n     Mode avancé : tout le reste visible */\n  const ZONE_SIMPLE   = [\"hair\",\"head\",\"body\"];\n  const ZONE_ADVANCED = [\"hair\",\"head\",\"body\",\"chest\",\"legs\",\"shoes\",\"backpack\",\"mount\",\"weapon\"];\n  let advancedMode = false;\n  function currentZoneOrder(){ return advancedMode ? ZONE_ADVANCED : ZONE_SIMPLE; }\n  const ZONE_ORDER_ALL = ZONE_ADVANCED; /* alias pour compatibilité interne */\n  const MISC_SLOTS = [\"weapon\",\"offhand\",\"belt\",\"gloves\",\"slash\",\"effect\"];\n  const RIDE_ANIMS = [\"RideIdle\",\"RideRun\",\"RideIdleAttack1\",\"RideRunAttack1\"];\n\n  /* Coiffures : dossier vide pour l'instant — tu y ajouteras tes assets */\n  const HAIR_FOLDERS = [];\n  /* Équipements tête (Head1-24 + Head25) : resteront dans le slot \"head\" */\n  /* Pour voir lesquels ressemblent à des coiffures, affiche la liste ci-dessous : */\n  const HEAD_CATALOG_PREVIEW = [\n    \"Head1\",\"Head2\",\"Head3\",\"Head4\",\"Head5\",\"Head6\",\"Head7\",\"Head8\",\"Head9\",\"Head10\",\n    \"Head12\",\"Head13\",\"Head14\",\"Head15\",\"Head16\",\"Head17\",\"Head18\",\"Head19\",\"Head20\",\n    \"Head21\",\"Head22\",\"Head23\",\"Head24\",\"Head25\"\n  ];\n  const PALETTE = [\n    \"#f5c6aa\",\"#d4a574\",\"#a67c52\",\"#f8d9a0\",\"#e0b878\",\"#b8893a\",\n    \"#f0a090\",\"#c45c26\",\"#7a3010\",\"#f2b8c6\",\"#d4789a\",\"#8a3a58\",\n    \"#b8d4e8\",\"#5b7c99\",\"#2f4a66\",\"#b8e0c8\",\"#6b8f71\",\"#3a5a42\",\n    \"#d4c4e8\",\"#8a70b0\",\"#4a3870\",\"#c8c4bc\",\"#8a8580\",\"#4a4642\",\n    \"#ffffff\",\"#000000\",\n  ];\n  const DEFAULT_COLORS = {\n    body:\"#d4a574\", shoes:\"#3a3230\", legs:\"#3e4f63\", chest:\"#5b7c99\",\n    belt:\"#8b6914\", gloves:\"#6a5a4e\", offhand:\"#6b8f71\", weapon:\"#9aa8b8\",\n    backpack:\"#7a5c3a\", head:\"#e0b878\", hair:\"#3a2a1a\", slash:\"#e8590c\", effect:\"#5ec8ff\", mount:\"#8a7060\",\n  };\n\n  const state = {\n    catalog:null, look:{}, colors:{},\n    bodies:[{folder:\"NakedBody\", opacity:1, color:\"#d4a574\"}],\n    bodyFocus:0,\n    anim:\"Idle\", dir:0, fps:14,\n    zoneId:\"hair\", _miscFocus:\"weapon\",\n    lastEdited:null,\n    charSizePct: 0.74,\n    sizeMode: \"h\", /* hauteur scène */\n    cache:new Map(), raf:0, frame:0, lastT:0,\n    drawing:false, dirty:true, drawRect:null,\n  };\n\n  const el = (id)=> document.getElementById(id);\n  const stage = el(\"stage\");\n  const cx = stage.getContext(\"2d\");\n  const tintCv = document.createElement(\"canvas\");\n  const tintCx = tintCv.getContext(\"2d\");\n\n  function slots(){ return (state.catalog && state.catalog.slots) || []; }\n  function slotById(id){\n    if(id===\"hair\") return { id:\"hair\", lab:\"Coiffure\", folders:[\"None\",...HAIR_FOLDERS], required:false };\n    return slots().find(s=>s.id===id);\n  }\n  function folderFor(slotId){\n    if(slotId===\"body\") return null;\n    const v=state.look[slotId];\n    return (!v||v===\"None\")?null:v;\n  }\n  function tintForSlot(slotId){\n    const c=state.colors[slotId];\n    if(!c||c===\"#ffffff\"||c===\"#FFFFFF\") return null;\n    return c;\n  }\n  function defaultColors(){ return Object.assign({}, DEFAULT_COLORS); }\n  function defaultLook(cat){\n    const look={};\n    if(cat){ for(const s of cat.slots) look[s.id]=\"None\"; }\n    /* défaut simplifié : nu + tête 1 seulement */\n    look.body=\"NakedBody\"; look.head=\"None\"; look.hair=\"None\";\n    look.chest=\"None\"; look.legs=\"None\"; look.shoes=\"None\";\n    look.belt=\"None\"; look.gloves=\"None\"; look.backpack=\"None\";\n    look.weapon=\"None\"; look.offhand=\"None\"; look.mount=\"None\";\n    look.slash=\"None\"; look.effect=\"None\";\n    return look;\n  }\n  function shortOpt(name){\n    if(!name||name===\"None\") return \"Aucun\";\n    if(name===\"Head25\") return \"Sorcier\";\n    if(/^Hair/i.test(name)) return name.replace(/^Hair_?/i,\"\")||name;\n    return name.replace(/^(Head|Chest|Legs|Shoes|Belt|Hands|Weapon|Shield|Backpack|Melee|Bow|Staff|Mount|Effect|Slash|NakedBody)_?/i,\"\")||name;\n  }\n  function ensureExtraGear(cat){\n    if(!cat) return cat;\n    const head=(cat.slots||[]).find(s=>s.id===\"head\");\n    if(head && Array.isArray(head.folders) && !head.folders.includes(\"Head25\")){\n      const i=head.folders.indexOf(\"Head24\");\n      head.folders.splice(i>=0?i+1:head.folders.length, 0, \"Head25\");\n    }\n    if(Array.isArray(cat.folders) && !cat.folders.includes(\"Head25\")) cat.folders.push(\"Head25\");\n    return cat;\n  }\n  function markEdited(key){ state.lastEdited=key; }\n\n  function loadImg(folder, anim){\n    const key=folder+\"/\"+anim;\n    if(state.cache.has(key)) return state.cache.get(key);\n    const p=new Promise((resolve)=>{\n      const rel=`spritesheets/${folder}/${anim}.png`;\n      const urls=[];\n      if(folder===\"Head25\"){\n        urls.push(`hat-refs/Head25/${anim}.png`);\n        urls.push(`assets/packs/fantasy-cc/spritesheets/Head25/${anim}.png`);\n      }\n      urls.push(BASE_CDN+rel, BASE_LOCAL+ s(); };\n      const rm=document.createElement(\"button\"); rm.type=\"button\"; rm.textContent=\"×\";\n      rm.disabled=state.bodies.length\u003c=1;\n      rm.onclick=(e)=>{ e.stopPropagation(); if(state.bodies.length\u003c=1) return;\n        state.bodies.splice(idx,1); state.bodyFocus=Math.min(state.bodyFocus, state.bodies.length-1);\n        state.look.body=state.bodies[0].folder; markEdited(\"body\"); state.dirty=true; renderBodies(); syncSteppers(); };\n      ops.appendChild(up); ops.appendChild(dn); ops.appendChild(rm);\n      top.appendChild(idxEl); top.appendChild(name); top.appendChild(sw); top.appendChild(ops);\n      const range=document.createElement(\"input\"); range.type=\"range\"; range.min=\"0\"; range.max=\"100\";\n      range.value=String(Math.round((b.opacity||1)*100));\n      range.oninput=()=>{ state.bodies[idx].opacity=(+range.value)/100; markEdited(\"body:\"+idx); state.dirty=true; };\n      row.appendChild(top); row.appendChild(range); host.appendChild(row);\n    });\n  }\n\n  function clearLastPart(){\n    const key=state.lastEdited;\n    if(!key){\n      if(state.zoneId===\"body\"){ el(\"status\").textContent=\"Corps : × couche\"; return; }\n      const sid=activeSlotId(); const s=slotById(sid);\n      if(s&&s.required){ el(\"status\").textContent=\"Obligatoire\"; return; }\n      state.look[sid]=\"None\"; state.dirty=true; syncSteppers(); el(\"status\").textContent=\"→ Aucun\"; return;\n    }\n    if(key.startsWith(\"body\")){ el(\"status\").textContent=\"Corps : × couche\"; return; }\n    const s=slotById(key);\n    if(s&&s.required){ el(\"status\").textContent=\"Obligatoire\"; return; }\n    state.look[key]=\"None\"; state.dirty=true; syncSteppers();\n    el(\"status\").textContent=\"→ Aucun (\"+key+\")\";\n  }\n\n  function syncSizeUI(){\n    const pct=Math.round((state.charSizePct||LAY.char.sizePct)*100);\n    const inp=el(\"charSize\"), lab=el(\"charSizeVal\");\n    if(inp) inp.value=String(pct);\n    if(lab) lab.textContent=pct+\"%\ cSteppers(); renderSwatches(); state.dirty=true;\n    };\n    el(\"btnAdvanced\").onclick=()=>{\n      advancedMode=!advancedMode;\n      el(\"btnAdvanced\").textContent=advancedMode ? \"⚙ Mode simplifié\" : \"⚙ Équipements avancés\";\n      /* Si on repasse simplifié et zone hors scope, revenir à hair */\n      if(!advancedMode && !currentZoneOrder().includes(state.zoneId)) selectZone(\"hair\");\n      else layoutChrome();\n      state.dirty=true;\n    };\n    el(\"btnRandom\").onclick=()=>{\n      const palette=PALETTE.slice(0,-2);\n      for(const s of slots()){\n        if(s.id===\"body\") continue;\n        if(Math.random()\u003c0.5) state.look[s.id]=s.folders[Math.floor(Math.random()*s.folders.length)];\n      }\n      state.look.chest=\"None\"; state.look.legs=\"None\"; state.look.shoes=\"None\";\n      state.look.weapon=\"None\"; state.look.offhand=\"None\"; state.look.hair=\"None\";\n      const bf=((slotById(\"body\")||{}).folders||[]).filter(f=>f!==\"None\");\n      state.bodies=[{folder:bf[Math.floor(Math.random()*bf.length)]||\"NakedBody\", opacity:1, color:palette[Math.floor(Math.random()*palette.length)]}];\n      state.bodyFocus=0; state.look.body=state.bodies[0].folder;\n      state.dirty=true; syncSteppers(); renderSwatches(); renderBodies();\n      saveLookPayload();\n    };\n    el(\"btnReset\").onclick=()=>{\n      state.look=defaultLook(state.catalog); state.colors=defaultColors();\n      state.bodies=[{folder:\"NakedBody\",opacity:1,color:DEFAULT_COLORS.body}];\n      state.bodyFocus=0; state.lastEdited=null;\n      state.dirty=true; syncSteppers(); renderSwatches(); renderBodies();\n      saveLookPayload();\n    };\n    function saveLookPayload(){\n      const payload={pack:\"fantasy-cc\", look:state.look, colors:state.colors, bodies:state.bodies, fps:state.fps, anim:state.anim, dir:state.dir, charSizePct:state.charSizePct};\n      try{ localStorage.setItem(\"neuro.fantasyLook\", JSON.stringify(payload)); }catch(_e){}\n      return payload;\n    }\n    function combatUrlWithLook(){\n      const payload=saveLookPayload();\n      const href=el(\"btnCombat\").getAttribute(\"href\")||\"fantasy-combat.html\";\n      let url;\n      try{ url=new URL(href, location.href); }catch(_e){ return href; }\n      try{ url.hash=\"fccLook=\"+encodeURIComponent(JSON.stringify(payload)); }catch(_e){}\n      return url.toString();\n    }\n    el(\"btnExport\").onclick=()=>{\n      const payload=saveLookPayload();\n      const a=document.createElement(\"a\"); a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:\"application/json\"}));\n      a.download=\"fantasy-look.json\"; a.click(); el(\"status\").textContent=\"Look sauvé\";\n    };\n    el(\"btnCombat\").onclick=(ev)=>{\n      ev.preventDefault();\n      el(\"status\").textContent=\"Look → combat\";\n      saveLookPayload(); parent.postMessage({type:\"open-combat\"}, \"*\");\n    };\n    document.addEventListener(\"visibilitychange\", ()=>{ if(document.hidden) saveLookPayload(); });\n    window.addEventListener(\"pagehide\", saveLookPayload);\n    window.addEventListener(\"resize\", ()=>{ state.dirty=true; layoutChrome(); });\n  }\n\n  async function boot(){\n    el(\"status\").textContent=\"…\";\n    let cat=null;\n    for(const u of [BASE_CDN+\"catalog.json\", BASE_LOCAL+\"catalog.json\"]){\n      try{ const r=await fetch(u,{cache:\"no-store\",mode:\"cors\"}); if(r.ok){ cat=await r.json(); break; } }catch(_e){}\n    }\n    if(!cat){ el(\"status\").textContent=\"Catalogue ∅\"; return; }\n    state.catalog=ensureExtraGear(cat);\n    if(cat.weaponAfterShieldRows) weaponAfterShieldRows=cat.weaponAfterShieldRows;\n    if(cat.backpackInFrontRows) backpackInFrontRows=cat.backpackInFrontRows;\n    if(cat.defaultFps) state.fps=cat.defaultFps|0;\n    state.colors=defaultColors();\n    try{\n      const raw=localStorage.getItem(\"neuro.fantasyLook\");\n      if(raw){\n        const o=JSON.parse(raw);\n        if(o&&o.look){\n          state.look=o.look;\n          if(o.colors) state.colors=Object.assign(defaultColors(), o.colors);\n          if(o.bodies&&o.bodies.length){\n            state.bodies=o.bodies.map(b=>({folder:b.folder, opacity:b.opacity==null?1:b.opacity, color:b.color||o.colors?.body||DEFAULT_COLORS.body}));\n          } else if(o.look.body){\n            state.bodies=[{folder:o.look.body, opacity:1, color:state.colors.body||DEFAULT_COLORS.body}];\n          }\n          if(o.anim) state.anim=o.anim;\n          /* Ignorer anciennes tailles basées sur la largeur (≥0.90) */\n          if(typeof o.charSizePct===\"number\" && o.charSizePct>=0.50 && o.charSizePct\u003c=0.85){\n            state.charSizePct=o.charSizePct;\n          } else {\n            state.charSizePct=LAY.char.sizePct;\n          }\n        }\n      }\n    }catch(_e){}\n    if(!state.look.body) state.look=defaultLook(cat);\n    if(!(\"hair\" in state.look)) state.look.hair=\"None\";\n    if(!state.bodies.length) state.bodies=[{folder:\"NakedBody\",opacity:1,color:DEFAULT_COLORS.body}];\n    if(!state.look.mount) state.look.mount=\"None\";\n    syncRideAnim();\n    const anims=(cat.anims&&cat.anims.length)?cat.anims:[\"Idle\",\"Walk\",\"Attack1\"];\n    if(!anims.includes(state.anim) && !RIDE_ANIMS.includes(state.anim)) state.anim=isMounted()?\"RideIdle\":anims[0];\n    bind(); syncSizeUI(); selectZone(\"hair\");\n    state.dirty=true;\n    await loadImg(state.bodies[0].folder||\"NakedBody\",\"Idle\");\n    el(\"status\").textContent=\"Prêt\";\n    loop();\n  }\n  boot();\n})();\n\u003c/script>\n\u003cbutton type=\"button\" id=\"phoneBack\" aria-label=\"Arène\" style=\"position:fixed;top:6px;left:6px;z-index:80;width:40px;height:40px;border:0;background:#EA7020;color:#fff;padding:0;display:flex;align-items:center;justify-content:center\">\u003csvg viewBox=\"0 0 16 16\" width=\"18\" height=\"18\" aria-hidden=\"true\">\u003cpath fill=\"currentColor\" d=\"M2 7.2L8 2l6 5.2V14H10v-4H6v4H2V7.2z\"/>\u003c/svg>\u003c/button>\n\u003cscript>document
