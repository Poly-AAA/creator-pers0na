  function loadImg(folderName, anim){
    const key = folderName+"/"+anim;
    if(cache.has(key)) return Promise.resolve(cache.get(key));
    if(cacheP.has(key)) return cacheP.get(key);
    const p = new Promise((resolve)=>{
      const rel = `spritesheets/${folderName}/${anim}.png`;
      const urls = [];
      if(folderName==="Head25"){
        urls.push(`hat-refs/Head25/${anim}.png`);
        urls.push(`assets/packs/fantasy-cc/spritesheets/Head25/${anim}.png`);
      }
      urls.push(BASE_LOCAL+rel, BASE_CDN+rel);
      let i=0, useCors=true;
      const tryOne=()=>{
        if(i>=urls.length){
          if(useCors){ useCors=false; i=0; tryOne(); return; }
          resolve(null); return;
        }
        const im = new Image();
        if(useCors){ try{ im.crossOrigin="anonymous"; }catch(_e){} }
        im.onload=()=>{ cache.set(key, im); resolve(im); };
        im.onerror=()=>{ i++; tryOne(); };
        im.src=urls[i++];
      };
      tryOne();
    });
    cacheP.set(key, p);
    return p;
  }
  function getImg(folderName, anim){ return cache.get(folderName+"/"+anim)||null; }

  function layersForRow(row){
    const L=[];
    L.push({folder:(catalog&&catalog.shadowFolder)||"Shadow", tint:null, alpha:1});
    for(const b of lookState.bodies){
      if(!b||!b.folder) continue;
      const t = (b.color && b.color!=="#ffffff") ? b.color : tint("body");
      L.push({folder:b.folder, tint:t, alpha:Math.max(0,Math.min(1,+b.opacity||1))});
    }
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folder(id); if(f) L.push({folder:f, tint:tint(id), alpha:1});
    }
    const shield=folder("offhand"), weapon=folder("weapon"), bag=folder("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tint("offhand"),alpha:1}); if(weapon) mid.push({folder:weapon,tint:tint("weapon"),alpha:1}); }
    else { if(weapon) mid.push({folder:weapon,tint:tint("weapon"),alpha:1}); if(shield) mid.push({folder:shield,tint:tint("offhand"),alpha:1}); }
    if(bag){ const item={folder:bag,tint:tint("backpack"),alpha:1}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folder(id); if(f) L.push({folder:f,tint:tint(id),alpha:1}); }
    /* FX d’évo temporaire au cast */
    if(G.castFx && performance.now() < G.castFx.until){
      if(G.castFx.slash) L.push({folder:G.castFx.slash, tint:tint("slash"), alpha:0.95});
      if(G.castFx.effect) L.push({folder:G.castFx.effect, tint:tint("effect"), alpha:0.9});
    } else if(G.castFx && performance.now() >= G.castFx.until){
      G.castFx = null;
    }
    const mount=folder("mount"); if(mount) L.unshift({folder:mount,tint:tint("mount"),alpha:1});
    return L.filter(x=>x.folder);
  }

  const tintCache = new Map();
  const TINT_MAX = 240;
  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex,alpha){
    const a=(alpha==null)?1:alpha;
    ctx.save(); ctx.globalAlpha=a;
    if(!tintHex){ ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); ctx.restore(); return; }
    const k=(img.currentSrc||img.src||"")+"|"+sx+","+sy+","+sw+","+sh+"|"+tintHex;
    let cv=tintCache.get(k);
    if(cv){ tintCache.delete(k); tintCache.set(k, cv); }
    else {
      cv=document.createElement("canvas");
      cv.width=Math.max(1, sw|0); cv.height=Math.max(1, sh|0);
      const t=cv.getContext("2d");
      t.imageSmoothingEnabled=false;
      t.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
      t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,cv.width,cv.height);
      t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
      tintCache.set(k, cv);
      if(tintCache.size>TINT_MAX) tintCache.delete(tintCache.keys().next().value);
    }
    ctx.drawImage(cv,dx,dy,dw,dh); ctx.restore();
  }

  function toScreen(c, r){
    return {
      x: cam.ox + (c - r) * (TILE_W/2),
      y: cam.oy + (c + r) * (TILE_H/2)
    };
  }
  function toTile(px, py){
    const x = (px - cam.ox) / (TILE_W/2);
    const y = (py - cam.oy) / (TILE_H/2);
    const c = Math.floor((x + y) / 2);
    const r = Math.floor((y - x) / 2);
    return { c, r };
  }
  function updateCamera(){
    let tc, tr;
    const crowd = G.roguelite && G.roster && G.roster.length > 2;
    if(crowd){
      const live = [];
      if(G.player && (G.player.alive || G.player.anim==="Die")) live.push(G.player);
      G.roster.forEach(p=>{ if(p.alive || p.anim==="Die") live.push(p); });
      tc = live.reduce((s,u)=>s+u.c,0) / Math.max(1, live.length);
      tr = live.reduce((s,u)=>s+u.r,0) / Math.max(1, live.length);
    } else {
      const focusEnt = G.player && G.player.alive
        ? G.player
        : (G.enemy && G.enemy.alive ? G.enemy : { c:cam.fx, r:cam.fy });
      const focus = (focusEnt === G.player) ? entityDrawPos(focusEnt) : { c:focusEnt.c, r:focusEnt.r };
      tc = focus.c; tr = focus.r;
    }
    cam.fx += (tc - cam.fx) * cam.smooth;
    cam.fy += (tr - cam.fy) * cam.smooth;
    if(Math.abs(tc - cam.fx) < 0.02) cam.fx = tc;
    if(Math.abs(tr - cam.fy) < 0.02) cam.fy = tr;
  }
  function fit(){
    const host = canvas.parentElement;
    const w = Math.max(80, host.clientWidth|0);
    const h = Math.max(80, host.clientHeight|0);
    if(cam._w!==w || cam._h!==h){
      cam._w=w; cam._h=h;
      if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
      const viewW = VIEW_TILES * TILE_W;
      const viewH = VIEW_TILES * TILE_H * 0.72;
      const sc = Math.min(w / (viewW + 24), h / (viewH + 48), 1.55);
      if(cam.userSc == null) cam.sc = Math.max(0.42, sc);
    }
    if(cam.userSc != null) cam.sc = cam.userSc;
    updateCamera();
    const cx = w / (2 * cam.sc);
    const cy = h / (2 * cam.sc) + 10;
    const px = (cam.fx - cam.fy) * (TILE_W/2);
    const py = (cam.fx + cam.fy) * (TILE_H/2);
    cam.ox = cx - px + (cam.panX || 0) / cam.sc;
    cam.oy = cy - py + (cam.panY || 0) / cam.sc;
  }
  function tileInView(c, r){
    /* cull rapide autour du focus caméra */
    const pad = 9;
    return Math.abs(c - cam.fx) <= pad && Math.abs(r - cam.fy) <= pad;
  }

  function key(c,r){ return c+","+r; }
  function inBounds(c,r){ return c>=0&&r>=0&&c<GRID&&r<GRID; }
  function occupied(c,r, skip){
    if(G.player.alive && skip!=="player" && G.player.c===c && G.player.r===r) return "player";
    if(G.enemy && G.enemy.alive && skip!=="enemy" && G.enemy.c===c && G.enemy.r===r) return "enemy";
    if(G.clone && G.clone.alive && skip!=="clone" && G.clone.c===c && G.clone.r===r) return "clone";
    if(skip==="pawn") return null;
    for(const p of (G.roster||[])){
      if(!p.alive || p===G.enemy) continue;
      if(p.c===c && p.r===r) return p.side==="b" ? "enemy" : "ally";
    }
    return null;
  }
  function dist(a,b){ return Math.max(Math.abs(a.c-b.c), Math.abs(a.r-b.r)); }

  function recomputeMoves(){
    G.moves.clear();
    if(G.turn!=="player" || G.player.pm<=0 || G.armed) return;
    /* BFS PM (comme Neuro) */
    const distM = {};
    const sk = key(G.player.c, G.player.r);
    distM[sk]=0;
    const q=[{c:G.player.c,r:G.player.r}];
    const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
    while(q.length){
      const cur=q.shift();
      const d=distM[key(cur.c,cur.r)];
      if(d>=G.player.pm) continue;
      for(const [dc,dr] of dirs){
        const nc=cur.c+dc, nr=cur.r+dr;
        if(!inBounds(nc,nr)) continue;
        const k=key(nc,nr);
        if(k in distM) continue;
        if(occupied(nc,nr,"player")) continue;
        distM[k]=d+1;
        G.moves.add(k);
        q.push({c:nc,r:nr});
      }
    }
  }
  function recomputeTargets(){
    G.targets.clear(); G.range.clear(); G.aoe.clear();
    const sp = spellById(G.armed);
    if(!sp || G.turn!=="player") return;
    if(isSelfSpell(sp)){
      G.targets.add(key(G.player.c, G.player.r));
      G.range.add(key(G.player.c, G.player.r));
      return;
    }
    for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++){
      if(dist(G.player,{c,r})<=spellRange(sp)) G.range.add(key(c,r));
    }
    const foes = G.roguelite
      ? (G.roster||[]).filter(p=>p.side==="b" && p.alive)
      : (G.enemy && G.enemy.alive ? [G.enemy] : []);
    foes.forEach(f=>{ if(G.range.has(key(f.c, f.r))) G.targets.add(key(f.c, f.r)); });
    const focusEnt = (G.enemy && G.enemy.alive) ? G.enemy : foes[0];
    if(!focusEnt) return;
    const focus = (G.hover && G.range.has(key(G.hover.c,G.hover.r))) ? G.hover : focusEnt;
    const rad = sp.aoe|0;
    if(G.range.has(key(focus.c, focus.r)) || G.targets.has(key(focus.c, focus.r))){
      for(let c=focus.c-rad;c<=focus.c+rad;c++) for(let r=focus.r-rad;r<=focus.r+rad;r++){
        if(!inBounds(c,r)) continue;
        if(dist(focus,{c,r})<=rad) G.aoe.add(key(c,r));
      }
    }
  }

  function startReaction(ent, id, opts){
    if(!ent) return;
    opts = opts || {};
    const token = (ent._reactToken || 0) + 1;
    ent._reactToken = token;
    if(typeof Reactions==="undefined"){
      playAnim(ent, (ent.pv|0)<=0 ? "Die" : "TakeDamage");
      return;
    }
    const spec = Reactions.compose(id || "flinch", opts);
    ent.react = { id: spec.id, t0: performance.now(), spec: spec, token: token };
    if(opts.faceDir!=null) ent.dir = opts.faceDir & 7;
    ent.feel = null;
    playAnim(ent, spec.sheet);
    ent.stepFps = spec.fps;
    if(spec.poseOut==="garde"){
      setTimeout(function(){
        if(!ent.react || ent.react.token!==token) return;
        if(ent.anim==="Die") return;
        ent.react = null;
        playAnim(ent, "Idle");
      }, spec.returnMs);
    }
  }
  function reactionFace(target, attacker){
    if(typeof Reactions==="undefined" || !target || !attacker) return null;
    const incoming = dirFromIsoDelta(target.c-attacker.c, target.r-attacker.r);
    if(incoming==null) return null;
    const facing = Reactions.facingOf(target.dir|0, incoming);
    return Reactions.sheetDir(facing, incoming);
  }
  function tickDots(ent){
    if(!ent || !ent.alive || !ent.dot || (ent.dot.turns|0)<=0) return;
    ent.dot.turns = (ent.dot.turns|0) - 1;
    const n = ent.dot.dmg|0;
    if(n) ent.pv = Math.max(0, ent.pv - n);
    if(n) rlFloat(ent, "-"+n, null, "damage", 1);
    const dead = ent.pv<=0;
    startReaction(ent, "dot", { elementFx: ent.dot.fx || "", ko: dead });
    if(dead){
      ent.alive = false;
      if(ent===G.player) onCombatEnd("defeat");
      else if(ent===G.enemy){
        if(G.rl) G.rl.kills = (G.rl.kills|0)+1;
        if(!rlPromote()) onCombatEnd("win");
      }
    }
    if((ent.dot.turns|0)<=0) ent.dot = null;
  }
  function playAnim(ent, anim){
    let a = anim;
    if(ent === G.player && isPlayerMounted()) a = toRideAnim(anim);
    else if(ent && ent.mount) a = toRideAnim(anim);
    if(ent === G.player) warmAnimForPlayer(a);
    else if(ent && Array.isArray(ent.layers)){
      for(const L of ent.layers){
        if(L && L.folder) loadImg(L.folder, a);
      }
      if(ent.mount){
        loadImg(ent.mount, "RideIdle");
        loadImg(ent.mount, "RideRun");
      }
    }
    ent.anim = a; ent.frame = 0; ent.t0 = performance.now();
    if(/^Idle$/i.test(a) || /^RideIdle$/i.test(a)){ ent.stepFps = null; ent.feel = null; }
  }
  function faceToward(ent, tc, tr){
    const d = dirFromIsoDelta(tc-ent.c, tr-ent.r);
    if(d!=null) ent.dir = d;
  }

  function tryStep(dc, dr){
    if(G.turn!=="player" || !G.player.alive) return;
    if(G.armed) return;
    if(G.player.pm<=0){ setStatus("Plus de PM"); return; }
    const c = G.player.c+dc, r = G.player.r+dr;
    if(!inBounds(c,r) || occupied(c,r,"player")){ setStatus("Case bloquée"); return; }
    faceToward(G.player, c, r);
    G.player.slide = null;
    G.player.c=c; G.player.r=r; G.player.pm-=1;
    if(G.rl) G.rl.moved = true;
    const seq = ++G.castSeq;
    playAnim(G.player, randomMoveAnim());
    recomputeMoves(); recomputeTargets(); hud();
    setStatus("Dir "+DIR_LABEL[G.player.dir]+" · −1 PM");
    setTimeout(()=>{
      if(seq !== G.castSeq) return;
      if(MOVE_ANIMS.includes(G.player.anim) || G.player.anim==="RideRun") playAnim(G.player,"Idle");
    }, 380);
  }

  function roll(arr){ return arr[0] + Math.floor(Math.random()*(arr[1]-arr[0]+1)); }

  /** Chemin BFS jusqu’à une case à portée du sort vers l’ennemi */
  function pathIntoSpellRange(sp){
    if(!G.enemy.alive) return null;
    const maxSteps = G.player.pm;
    const distM = {};
    const prev = {};
    const sk = key(G.player.c, G.player.r);
    distM[sk]=0; prev[sk]=null;
    const q=[{c:G.player.c,r:G.player.r}];
    const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
    let goal=null;
    while(q.length){
      const cur=q.shift();
      if(dist(cur, G.enemy) <= spellRange(sp)){ goal=cur; break; }
      const d=distM[key(cur.c,cur.r)];
      if(d>=maxSteps) continue;
      for(const [dc,dr] of dirs){
        const nc=cur.c+dc, nr=cur.r+dr;
        if(!inBounds(nc,nr)) continue;
        const k=key(nc,nr);
        if(k in distM) continue;
        if(occupied(nc,nr,"player")) continue;
        distM[k]=d+1; prev[k]=key(cur.c,cur.r);
        q.push({c:nc,r:nr});
      }
    }
    if(!goal){
      /* se rapprocher au max */
      let best=null, bd=1e9;
      for(const k of Object.keys(distM)){
        const [c,r]=k.split(",").map(Number);
        const d=dist({c,r}, G.enemy);
        if(d<bd){ bd=d; best={c,r}; }
      }
      goal=best;
    }
    if(!goal || (goal.c===G.player.c && goal.r===G.player.r)) return [];
    const path=[];
    let k=key(goal.c,goal.r);
    while(k){
      const [c,r]=k.split(",").map(Number);
      path.unshift({c,r});
      k=prev[k];
    }
    return path; /* inclut départ */
  }

  function approachThen(sp, onReady){
    const path = pathIntoSpellRange(sp);
    if(!path || path.length<2){ onReady(); return; }
    G.player.slide = null;
    for(let i=1; i<path.length && G.player.pm>0; i++){
      const n = path[i];
      faceToward(G.player, n.c, n.r);
      G.player.c=n.c; G.player.r=n.r; G.player.pm-=1;
    }
    if(G.rl) G.rl.moved = true;
    recomputeMoves(); recomputeTargets(); hud();
    onReady();
  }

  function finishCastSelf(sp){
    const st = evoState(sp.id);
    const evo = evoBonusesFor(sp);
    const cost = Math.max(1, sp.cost + (evo.cost|0));
    if(G.player.pa < cost){ setStatus("Pas assez de PA"); return; }
    G.player.pa -= cost;

    if(sp.effect==="roulade" || sp.id==="roulade"){
      castRoulade(sp, evo);
      return;
    }

    playCastAnimChain(sp);

    if(sp.id==="double"){
      spawnClone(sp, evo);
      setStatus("Sosie invoqué");
    } else if(sp.id==="invisibilite"){
      const turns = 2 + (evo.invisTurns|0);
      G.player.invis = Math.max(G.player.invis||0, turns);
      if(evo.invisPm) G.player.pm = Math.min(G.player.pmMax+2, G.player.pm + (evo.invisPm|0));
      setTimeout(function(){ startReaction(G.player, "buff"); }, (typeof Reactions!=="undefined") ? Reactions.IMPACT_MS : 260);
      setStatus("Voile d’ombre · "+G.player.invis+" tours");
    } else if(sp.id==="overclock"){
      G.player.pm = Math.min(G.player.pmMax+1, G.player.pm+1);
      setTimeout(function(){ startReaction(G.player, "buff"); }, (typeof Reactions!=="undefined") ? Reactions.IMPACT_MS : 260);
      setStatus("Ivresse · +1 PM");
    } else if(sp.type==="summon" || sp.effect==="summon"){
      rlSpawnBones();
      setStatus(sp.name+" · ossement");
      if(G.rl) G.rl.summoned = (G.rl.summoned|0)+1;
    } else if(sp.heal){
      let h = roll(sp.heal) + (evo.heal|0);
      G.player.pv = Math.min(G.player.pvMax, G.player.pv + h);
      if(G.rl) G.rl.healed = (G.rl.healed|0) + h;
      rlFloat(G.player, "+"+h, null, "heal", 0);
      setTimeout(function(){ startReaction(G.player, "heal"); }, (typeof Reactions!=="undefined") ? Reactions.IMPACT_MS : 260);
      if(sp.id==="bouclier" || sp.id==="armure_nanites" || sp.type==="shield"){
        G.player.shield = (G.player.shield||0) + Math.floor(h/2) + (evo.shield|0);
      }
      setStatus((G.armedSlot?G.armedSlot.label+" · ":"")+sp.name+" +"+h+" PV");
    } else {
      G.player.shield = (G.player.shield||0) + 8 + (evo.shield|0);
      rlFloat(G.player, "+"+G.player.shield, null, "shield", 0);
      setTimeout(function(){ startReaction(G.player, "shield"); }, (typeof Reactions!=="undefined") ? Reactions.IMPACT_MS : 260);
      setStatus((G.armedSlot?G.armedSlot.label+" · ":"")+sp.name);
    }
    G.combo = Math.min(100, G.combo + 18);
    G.armed=null; G.armedSlot=null;
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
  }

  function entityDrawPos(ent){
    if(ent && ent.slide){
      const s = ent.slide;
      const u = Math.max(0, Math.min(1, (performance.now() - s.t0) / Math.max(1, s.dur)));
      const e = (typeof CastFeel !== "undefined")
        ? CastFeel.travel(s.kind || "strike", u)
        : u*u*(3-2*u);
      if(u >= 1){ ent.slide = null; ent.knock = false; }
      return {
        c: s.fromC + (s.toC - s.fromC) * e,
        r: s.fromR + (s.toR - s.fromR) * e,
        u: u,
      };
    }
    return { c: ent.c, r: ent.r, u: 1 };
  }

  /** Planifie le chemin roulade sans muter la position (sauf ghost). */
  function planRouladePath(ent, sp, evo){
    const foe = G.enemy;
    if(!foe || !foe.alive) return { path:[], mode:"none" };
    const cells = Math.max(1, (sp && sp.range != null ? sp.range|0 : 2) + (evo.range|0));
    const d = dist(ent, foe);
    const ghost = { c:ent.c, r:ent.r };
    const path = [];
    const mode = d <= 1 ? "recul" : "approche";
    if(mode === "recul"){
      for(let i=0;i<cells;i++){
        if(!stepEntityAwayOnce(ghost, foe, "player")) break;
        path.push({ c:ghost.c, r:ghost.r });
      }
    } else {
      const steps = Math.min(cells, Math.max(1, d));
      for(let i=0;i<steps;i++){
        if(!stepEntityTowardOnce(ghost, foe, "player")) break;
        path.push({ c:ghost.c, r:ghost.r });
      }
    }
    return { path, mode };
  }

  function stepEntityTowardOnce(ent, target, skipKey){
    if(dist(ent, target) <= 0) return false;
    const dc = Math.sign(target.c - ent.c);
    const dr = Math.sign(target.r - ent.r);
    const tries = [];
    if(dc && dr) tries.push([dc,dr],[dc,0],[0,dr]);
    else if(dc) tries.push([dc,0],[0,1],[0,-1]);
    else tries.push([0,dr],[1,0],[-1,0]);
    for(const [tdc,tdr] of tries){
      const nc = ent.c + tdc, nr = ent.r + tdr;
      if(!inBounds(nc,nr)) continue;
      if(occupied(nc,nr, skipKey)) continue;
      if(G.enemy.alive && G.enemy.c===nc && G.enemy.r===nr) continue;
      if(G.clone && G.clone.alive && G.clone.c===nc && G.clone.r===nr) continue;
      ent.c = nc; ent.r = nr;
      return true;
    }
    return false;
  }

  function stepEntityAwayOnce(ent, from, skipKey){
    let dc = Math.sign(ent.c - from.c);
    let dr = Math.sign(ent.r - from.r);
    if(dc===0 && dr===0){
      const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
      const d = dirs[(from.dir|0) % 4] || [0,1];
      dc = d[0]; dr = d[1];
    }
    const tries = [];
    if(dc && dr) tries.push([dc,dr],[dc,0],[0,dr]);
    else if(dc) tries.push([dc,0],[0,1],[0,-1]);
    else tries.push([0,dr],[1,0],[-1,0]);
    for(const [tdc,tdr] of tries){
      const nc = ent.c + tdc, nr = ent.r + tdr;
      if(!inBounds(nc,nr)) continue;
      if(occupied(nc,nr, skipKey)) continue;
      if(G.enemy.alive && G.enemy.c===nc && G.enemy.r===nr) continue;
      if(G.clone && G.clone.alive && G.clone.c===nc && G.clone.r===nr) continue;
      ent.c = nc; ent.r = nr;
      return true;
    }
    return false;
  }

  /** Une roulade animée (slide + Rolling). Appelle onDone à la fin. */
  function playOneRoulade(sp, evo, onDone){
    const planned = planRouladePath(G.player, sp, evo);
    const path = planned.path || [];
    if(!path.length){
      if(typeof onDone === "function") onDone(null, true);
      return;
    }
    const from = { c:G.player.c, r:G.player.r };
    const to = path[path.length - 1];
    faceToward(G.player, to.c, to.r);

    reloadCustomSpells();
    const custom = customSpellById(sp.id) || sp;
    const chosen = chosenEvoStep(sp);
    const rawStep = chosen || (custom.steps && custom.steps[0]) || (sp.steps && sp.steps[0]) || null;
    const step = normalizeCastStep(rawStep || { anim: (sp.anim||"Rolling"), fps:16 });
    let fps = Number(step.fps);
    if(!isFinite(fps) || fps < 1) fps = 14;
    fps = Math.max(1, Math.min(30, fps));

    warmAnimForPlayer(step.anim || "Rolling");
    const delay = Math.max(0, Number(step.delay)|0);
    const bodyMs = (typeof CastFeel !== "undefined") ? CastFeel.BODY_MS : Math.max(120, Math.round((COLS / fps) * 1000));
    const dur = delay + bodyMs;

    const seq = ++G.castSeq;
    const slideId = seq;
    const tRoll = performance.now();
    playAnim(G.player, step.anim || "Rolling");
    G.player.stepFps = fps;
    if(typeof CastFeel !== "undefined"){
      G.player.feel = { t0: tRoll, kind: "dash", element: (sp && sp.element) || "air" };
      G.fx = G.fx || [];
      G.fx.push({ kind: "dash", element: G.player.feel.element, t0: tRoll, c: from.c, r: from.r, tc: to.c, tr: to.r });
    }
    G.player.c = to.c;
    G.player.r = to.r;
    G.player.slide = {
      id: slideId,
      kind: "dash",
      fromC: from.c, fromR: from.r,
      toC: to.c, toR: to.r,
      t0: tRoll,
      dur,
    };

    setTimeout(()=>{
      const current = seq === G.castSeq;
      if(G.player.slide && G.player.slide.id === slideId){
        G.player.slide = null;
        G.player.stepFps = null;
      }
      if(current && G.player.anim!=="Die") playAnim(G.player, "Idle");
      if(typeof onDone === "function") onDone(current ? planned : null, current);
    }, dur);
  }

  /**
   * Roulade : Double Impact = jusqu’à 2 roulades.
   * Approche : 2e seulement si pas encore CAC après la 1re.
   * Recul : toujours 2 si Double Impact.
   */
  function castRoulade(sp, evo){
    const maxRolls = spellHitCount(sp);
    const initialDist = G.enemy && G.enemy.alive ? dist(G.player, G.enemy) : 99;
    const mode0 = initialDist <= 1 ? "recul" : "approche";

    G.armed = null; G.armedSlot = null;
    G.combo = Math.min(100, G.combo + 18);
    renderSpells(); hud();

    let rollsDone = 0;
    let cellsMoved = 0;
    let lastMode = mode0;

    const finish = ()=>{
      setStatus(
        "Roulade · "+lastMode+
        (rollsDone > 1 ? " ×"+rollsDone : "")+
        " · "+cellsMoved+" case"+(cellsMoved>1?"s":"")
      );
      recomputeMoves(); recomputeTargets(); renderSpells(); hud();
    };

    const runRoll = (index)=>{
      playOneRoulade(sp, evo, (planned, current)=>{
        if(!current) return;
        if(!planned || !planned.path || !planned.path.length){
          if(rollsDone === 0) setStatus("Roulade · bloqué");
          finish();
          return;
        }
        rollsDone += 1;
        cellsMoved += planned.path.length;
        lastMode = planned.mode || lastMode;

        const next = index + 1;
        if(next >= maxRolls){
          finish();
          return;
        }
        /* Approche : stop si déjà CAC après la 1re. Recul : toujours enchaîner. */
        if(mode0 === "approche" && G.enemy && G.enemy.alive && dist(G.player, G.enemy) <= 1){
          finish();
          return;
        }
        runRoll(next);
      });
    };

    runRoll(0);
  }

  /** @deprecated kept for helpers — use castRoulade */
  function applyRoulade(ent, sp, evo){
    const planned = planRouladePath(ent, sp, evo);
    if(!planned.path.length) return 0;
    const to = planned.path[planned.path.length-1];
    faceToward(ent, to.c, to.r);
    ent.c = to.c; ent.r = to.r;
    return planned.path.length;
  }

  /** Avance `ent` vers `target` sur N cases (cases libres, sans marcher sur l’ennemi). */
  function stepEntityToward(ent, target, cells, skipKey){
    let moved = 0;
    const n = Math.max(0, cells|0);
    for(let i=0;i<n;i++){
      if(!stepEntityTowardOnce(ent, target, skipKey)) break;
      moved++;
    }
    return moved;
  }

  function spawnClone(sp, evo){
    const p = G.player, e = G.enemy;
    let c = p.c, r = p.r;
    if(e.alive){
      if(e.c !== p.c) c = p.c + Math.sign(e.c - p.c);
      else if(e.r !== p.r) r = p.r + Math.sign(e.r - p.r);
    }
    if(!inBounds(c,r) || occupied(c,r,"player") || (e.alive && e.c===c && e.r===r)){
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for(const [dc,dr] of dirs){
        const nc=p.c+dc, nr=p.r+dr;
        if(inBounds(nc,nr) && !occupied(nc,nr,"player") && !(e.alive && e.c===nc && e.r===nr)){
          c=nc; r=nr; break;
        }
      }
    }
    faceToward(p, c, r);
    G.clone = {
      c, r, dir: p.dir, anim:"Run", frame:0, t0:performance.now(),
      alive:true, alpha:0.42,
      pm: 2 + (evo.clonePm|0),
      dmg: [8 + (evo.cloneDmg|0), 12 + (evo.cloneDmg|0)],
      stun: !!(evo.cloneStun),
      hp: 1 + (evo.cloneHp|0),
    };
    playAnim(G.clone, "Run");
  }

  function tickClone(){
    const cl = G.clone;
    if(!cl || !cl.alive || !G.enemy.alive) return;
    let steps = cl.pm|0;
    while(steps-- > 0){
      if(dist(cl, G.enemy) <= 1){
        /* tacle */
        faceToward(cl, G.enemy.c, G.enemy.r);
        playAnim(cl, "AttackRun");
        let dmg = roll(cl.dmg);
        if(G.enemy.shield>0){ const a=Math.min(G.enemy.shield,dmg); G.enemy.shield-=a; dmg-=a; }
        G.enemy.pv = Math.max(0, G.enemy.pv - dmg);
        G.enemy.flash = performance.now()+180;
        startReaction(G.enemy, G.enemy.pv<=0 ? "ko" : "flinch", { ko: G.enemy.pv<=0, faceDir: reactionFace(G.enemy, cl) });
        setStatus("Sosie tacle → "+dmg);
        if(cl.stun){ /* retire 1 PA conceptuel au prochain tour ennemi via flag */ G.enemy._stunned = true; }
        if(G.enemy.pv<=0){
          G.enemy.alive=false;
          if(G.rl) G.rl.kills = (G.rl.kills|0)+1;
          if(rlPromote()) setStatus(G.enemy.name+" entre en lice");
          else { setStatus("Victoire · sosie"); onCombatEnd("win"); }
        }
        cl.alive = false; G.clone = null;
        hud();
        return;
      }
      const opts=[];
      if(cl.c!==G.enemy.c) opts.push({c:cl.c+Math.sign(G.enemy.c-cl.c), r:cl.r});
      if(cl.r!==G.enemy.r) opts.push({c:cl.c, r:cl.r+Math.sign(G.enemy.r-cl.r)});
      let moved=false;
      for(const o of opts){
        if(!inBounds(o.c,o.r)) continue;
        if(occupied(o.c,o.r,"player")) continue;
        if(G.enemy.alive && G.enemy.c===o.c && G.enemy.r===o.r) continue;
        faceToward(cl, o.c, o.r);
        cl.c=o.c; cl.r=o.r;
        playAnim(cl, "Run");
        moved=true; break;
      }
      if(!moved) break;
    }
  }

  function finishCastEnemy(sp){
    if(!G.enemy.alive){ setStatus("Plus de cible"); return; }
    const evo = evoBonusesFor(sp);
    if(dist(G.player, G.enemy) > spellRange(sp)){ setStatus("Toujours hors portée"); return; }
    const cost = Math.max(1, sp.cost + (evo.cost|0));
    if(G.player.pa < cost){ setStatus("Pas assez de PA"); return; }
    faceToward(G.player, G.enemy.c, G.enemy.r);
    G.player.pa -= cost;
    const label = (G.armedSlot?G.armedSlot.label+" · ":"")+sp.name;
    G.armed=null; G.armedSlot=null;
    renderSpells(); hud();

    const hits = spellHitCount(sp);
    let dmgEach = roll(sp.dmg || [6,10]) + (evo.dmg|0);
    if(G.roguelite) dmgEach = rlScale(G.player, G.enemy, sp, dmgEach);
    if(G.rl) G.rl.casts = (G.rl.casts|0) + 1;
    if(G.player.invis>0 && evo.invisBurst) dmgEach += evo.invisBurst|0;
    let total = 0;
    let pushed = 0;
    let pushCells = 0;
    if(sp.effect==="push"){
      pushCells += sp.push != null ? (sp.push|0) : (sp.pushDist != null ? (sp.pushDist|0) : 1);
    }
    pushCells += (evo.push|0);

    const applyOneHit = (hitIndex, hitStep)=>{
      if(!G.enemy.alive || G.enemy.pv <= 0) return;
      let dmg = dmgEach;
      let absorbed = 0;
      if(G.enemy.shield>0){ absorbed=Math.min(G.enemy.shield,dmg); G.enemy.shield-=absorbed; dmg-=absorbed; }
      if(G.roguelite) dmg = rlErode(G.enemy, dmg);
      G.enemy.pv = Math.max(0, Math.min(G.enemy.pvMax, G.enemy.pv - dmg));
      if(absorbed) rlFloat(G.enemy, String(absorbed), null, "shield", hitIndex);
      if(dmg) rlFloat(G.enemy, "-"+dmg, null, "damage", hitIndex);
      total += dmg;
      G.enemy.flash = performance.now()+180;
      if(G.enemy.pv<=0){
        startReaction(G.enemy, "ko", { ko:true, faceDir: reactionFace(G.enemy, G.player) });
      } else if(!dmg && absorbed){
        startReaction(G.enemy, "block", { faceDir: reactionFace(G.enemy, G.player) });
      } else if(!hitStep || !hitStep.reaction){
        const named = (typeof Reactions!=="undefined") ? Reactions.forSpell(sp) : "flinch";
        if(named) startReaction(G.enemy, named, { faceDir: reactionFace(G.enemy, G.player) });
      }
      /* Push une seule fois, sur le dernier coup qui touche encore vivant / fin de chaîne */
      if(pushCells > 0 && hitIndex === hits - 1 && G.enemy.pv > 0){
        pushed = pushEntityAway(G.enemy, G.player, Math.max(1, pushCells), "enemy");
      }
      if(hitIndex===0 && sp.id==="punch" && G.enemy.pv>0){
        const chain = punchCombo(sp);
        if(chain && chain.turns){
          G.enemy.dot = { turns: chain.turns, element: chain.element || "", fx: (chain.steps[0] && chain.steps[0].elementFx) || "", dmg: 2 };
        }
      }
      setStatus(label+" → "+dmg+(hits>1?" ("+(hitIndex+1)+"/"+hits+")":"")+(pushed?" · poussé "+pushed:""));
      hud();
    };

    const seq = ++G.castSeq;
    playCastAnimChain(sp, ()=>{
      const mine = seq === G.castSeq;
      if(mine){
        G.combo = Math.min(100, G.combo + 22);
        if(G.player.invis>0) G.player.invis = 0;
      }
      if(G.enemy.pv<=0 && G.enemy.alive){
        G.enemy.alive=false;
        if(G.rl) G.rl.kills = (G.rl.kills|0)+1;
        if(rlPromote()){
          setStatus(G.enemy.name+" entre en lice");
        } else {
          setStatus("Victoire · "+label+" → "+total+(hits>1?" ×"+hits:""));
          onCombatEnd("win");
        }
      } else if(mine && G.enemy.alive) {
        setStatus(label+" → "+total+(hits>1?" ×"+hits:"")+(pushed?" · poussé "+pushed:""));
      }
      recomputeMoves(); recomputeTargets(); renderSpells(); hud();
    }, {
      seq,
      repeat: hits,
      onHit: applyOneHit
    });
  }

  /** Repousse `ent` loin de `from` sur N cases (si libre). */
  function pushEntityAway(ent, from, cells, skipKey){
    const fromC = ent.c, fromR = ent.r;
    let dc = Math.sign(ent.c - from.c);
    let dr = Math.sign(ent.r - from.r);
    if(dc===0 && dr===0){
      /* même case : pousse selon la direction regardée */
      const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
      const d = dirs[(from.dir|0) % 4] || [0,1];
      dc = d[0]; dr = d[1];
    }
    let moved = 0;
    const n = Math.max(0, cells|0);
    for(let i=0;i<n;i++){
      const nc = ent.c + dc, nr = ent.r + dr;
      if(inBounds(nc,nr) && !occupied(nc,nr, skipKey)){
        ent.c = nc; ent.r = nr; moved++;
        continue;
      }
      /* si diag bloquée, tente un axe */
      if(dc && dr){
        const a = {c:ent.c+dc, r:ent.r};
        const b = {c:ent.c, r:ent.r+dr};
        if(inBounds(a.c,a.r) && !occupied(a.c,a.r, skipKey)){ ent.c=a.c; ent.r=a.r; moved++; continue; }
        if(inBounds(b.c,b.r) && !occupied(b.c,b.r, skipKey)){ ent.c=b.c; ent.r=b.r; moved++; continue; }
      }
      break;
    }
    if(moved > 0){
      const now = performance.now();
      ent.slide = {
        kind: "knock",
        fromC: fromC, fromR: fromR,
        toC: ent.c, toR: ent.r,
        t0: now,
        dur: Math.max(160, 140 * moved),
      };
      ent.knock = true;
      if(!ent.react){
        ent.anim = "TakeDamage";
        ent.t0 = now;
        ent.stepFps = null;
      }
      ent.feel = null;
      G.fx = G.fx || [];
      G.fx.push({ kind: "knock", element: "terre", t0: now, c: fromC, r: fromR, tc: ent.c, tr: ent.r });
    }
    return moved;
  }

  function tryCastAt(c, r){
    if(G.turn!=="player" || !G.armed) return;
    const sp = spellById(G.armed); if(!sp) return;
    if(G.player.pa < sp.cost){ setStatus("Pas assez de PA"); return; }

    if(isSelfSpell(sp)){
      finishCastSelf(sp);
      return;
    }

    if(G.roguelite){
      const foe = (G.roster||[]).find(p=>p.alive && p.side==="b" && p.c===c && p.r===r);
      if(foe) G.enemy = foe;
    }
    if(!G.enemy || !G.enemy.alive || G.enemy.c!==c || G.enemy.r!==r){ setStatus("Pas de cible"); return; }
    if(dist(G.player, G.enemy) > spellRange(sp)){
      approachThen(sp, ()=> finishCastEnemy(sp));
      return;
    }
    finishCastEnemy(sp);
  }

  function armSlot(slot){
    if(!slot || slot.locked || !slot.spellId) return;
    const sp = spellById(slot.spellId);
    if(!sp) return;
    G.armed = sp.id;
    G.armedSlot = slot;
    recomputeMoves(); recomputeTargets(); renderSpells();
    if(isSelfSpell(sp)){
      tryCastAt(G.player.c, G.player.r);
      return;
    }
    if(G.enemy.alive && dist(G.player,G.enemy)<=spellRange(sp)){
      tryCastAt(G.enemy.c, G.enemy.r);
    } else if(G.enemy.alive){
      approachThen(sp, ()=> finishCastEnemy(sp));
    } else setStatus(sp.name+" armé");
  }

  /** Centre dpad : sort armé, sinon sort d’arme */
  function autoAttack(){
    if(G.turn!=="player" || !G.player.alive) return;
    if(G.armed){ castArmed(); return; }
    const bar = G.spellBar.length ? G.spellBar : refreshSpellBar();
    const slot = bar.find(s=>!s.locked && s.spellId && spellById(s.spellId) && G.player.pa>=spellById(s.spellId).cost)
      || bar.find(s=>!s.locked && s.spellId);
    if(!slot){ setStatus("Aucun sort"); return; }
    armSlot(slot);
  }

  function castArmed(){
    if(G.turn!=="player" || !G.player.alive) return;
    if(!G.armed){ autoAttack(); return; }
    const sp = spellById(G.armed);
    if(!sp) return;
    if(isSelfSpell(sp)){ tryCastAt(G.player.c, G.player.r); return; }
    if(G.enemy.alive){
      if(dist(G.player, G.enemy) > spellRange(sp)) approachThen(sp, ()=> finishCastEnemy(sp));
      else tryCastAt(G.enemy.c, G.enemy.r);
    } else setStatus("Cible hors portée");
  }

  function endTurn(){
    if(G.turn!=="player") return;
    G.armed=null; G.armedSlot=null; G.turn="enemy";
    G.combo = Math.max(0, G.combo - 12);
    tickClone();
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
    if(!G.enemy.alive){
      if(rlPromote()){ setStatus(G.enemy.name+" entre en lice"); setTimeout(enemyTurn, 280); return; }
      if(!G.awaitingNext) onCombatEnd("win");
      return;
    }
    if(G.rl && (G.rl.casts|0) >= 3) G.rl.combos = (G.rl.combos|0)+1;
    if(G.rl) G.rl.casts = 0;
    setStatus("Tour ennemi…");
    setTimeout(()=> rlRosterPhase(()=> enemyTurn()), G.roguelite ? 120 : 420);
  }

  function enemySpellDmg(sp){
    return enemySpellDmgAvg(sp) || 6;
  }

  function aiPlay(){
    const p = aiPolicy && aiPolicy.play;
    if(!p) return null;
    return {
      healAt: p.healAt != null ? +p.healAt : 0.684,
      kite: p.kite !== false,
      focus: p.focus || "nearest",
    };
  }
  function enemyFocus(){
    const e = G.enemy;
    const cands = [];
    if(G.player && G.player.alive) cands.push(G.player);
    (G.roster||[]).forEach((u)=>{ if(u && u.alive && u.side==="a") cands.push(u); });
    if(!cands.length) return G.player;
    const play = aiPlay();
    if(play && play.focus==="weakest") return cands.reduce((b,u)=> !b || u.pv < b.pv ? u : b, null);
    if(play && play.focus==="leader") return G.player.alive ? G.player : cands[0];
    let best = cands[0], bd = 99;
    cands.forEach((u)=>{ const d = dist(e, u); if(d < bd){ bd = d; best = u; } });
    return best;
  }
  function enemyCanAfford(sp){
    return sp && (G.enemy.pa|0) >= Math.max(1, sp.cost|0);
  }

  function enemyPickSpell(mode){
    const e = G.enemy, p = enemyFocus();
    const ids = (e.spells && e.spells.length) ? e.spells : ["punch"];
    const all = ids.map(spellById).filter(s=>s && enemyCanAfford(s));
    if(!all.length) return null;
    const prof = e.profile || strategyProfile(e.strategy||"bruiser", e.spells);
    const d = dist(e,p);

    if(mode==="support" || (prof.supportFirst && e.pv < e.pvMax * 0.55)){
      const sup = all.filter(s=>s.heal || s.type==="shield" || s.type==="heal");
      if(sup.length && (!(e.shield>0) || e.pv < e.pvMax*0.4)) return pick(sup);
    }
    if(mode==="control" || prof.controlFirst){
      const ctrl = all.filter(s=>s.effect && dist(e,p)<=(s.range|0));
      if(ctrl.length) return ctrl.sort((a,b)=>(b.range|0)-(a.range|0))[0];
    }

    const dmg = all.filter(s=>s.dmg);
    const inRange = dmg.filter(s=>d <= (s.range|0));
    if(inRange.length){
      if(prof.waitForKill){
        inRange.sort((a,b)=> enemySpellDmg(b)*policyWeight(b.id)-enemySpellDmg(a)*policyWeight(a.id));
        return inRange[0];
      }
      inRange.sort((a,b)=> enemySpellDmg(b)*policyWeight(b.id)-enemySpellDmg(a)*policyWeight(a.id) || (a.cost|0)-(b.cost|0));
      return inRange[0];
    }
    dmg.sort((a,b)=> (b.range|0)-(a.range|0) || enemySpellDmg(b)-enemySpellDmg(a));
    return dmg[0] || all[0];
  }

  function enemyStepToward(goalC, goalR){
    const e = G.enemy;
    if((e.pm|0) <= 0) return false;
    const opts=[];
    if(e.c!==goalC) opts.push({c:e.c+Math.sign(goalC-e.c), r:e.r});
    if(e.r!==goalR) opts.push({c:e.c, r:e.r+Math.sign(goalR-e.r)});
    opts.sort((a,b)=> dist(a,{c:goalC,r:goalR}) - dist(b,{c:goalC,r:goalR}));
    for(const o of opts){
      if(!inBounds(o.c,o.r) || occupied(o.c,o.r,"enemy")) continue;
      if(G.player.alive && G.player.c===o.c && G.player.r===o.r) continue;
      if(G.clone && G.clone.alive && G.clone.c===o.c && G.clone.r===o.r) continue;
      faceToward(e, o.c, o.r);
      e.c=o.c; e.r=o.r; e.pm -= 1;
      playAnim(e, "Run");
      return true;
    }
    return false;
  }

  function enemyStepAway(fromC, fromR){
    const e = G.enemy;
    if((e.pm|0) <= 0) return false;
    const opts=[
      {c:e.c+1,r:e.r},{c:e.c-1,r:e.r},{c:e.c,r:e.r+1},{c:e.c,r:e.r-1}
    ].filter(o=>inBounds(o.c,o.r) && !occupied(o.c,o.r,"enemy")
      && !(G.player.alive && G.player.c===o.c && G.player.r===o.r));
    opts.sort((a,b)=> dist(b,{c:fromC,r:fromR}) - dist(a,{c:fromC,r:fromR}));
    if(!opts.length) return false;
    const o = opts[0];
    if(dist(o,{c:fromC,r:fromR}) <= dist(e,{c:fromC,r:fromR})) return false;
    faceToward(e, o.c, o.r);
    e.c=o.c; e.r=o.r; e.pm -= 1;
    playAnim(e, "Walk");
    return true;
  }

  function enemyCast(sp){
    const e=G.enemy, p=enemyFocus();
    if(!e.alive || !sp || !enemyCanAfford(sp)) return false;
    const cost = Math.max(1, sp.cost|0);
    e.pa -= cost;
    const anim = sp.anim || e.weaponAnim || "Attack1";
    const castNow = performance.now();
    playAnim(e, anim);
    if(typeof CastFeel !== "undefined"){
      e.feel = { t0: castNow, kind: CastFeel.motionKind(sp), element: sp.element || "neutre" };
      G.fx = G.fx || [];
      const aim = (p && p.c != null) ? p : e;
      G.fx.push({ kind: e.feel.kind, element: e.feel.element, t0: castNow, c: e.c, r: e.r, tc: aim.c, tr: aim.r });
      if(e.feel.kind === "leap"){
        e.slide = { kind: "leap", fromC: e.c, fromR: e.r, toC: e.c, toR: e.r, t0: castNow, dur: CastFeel.BODY_MS };
      }
      setTimeout(()=>{ if(e.feel && e.feel.t0 === castNow && e.anim !== "Die") playAnim(e, "Idle"); }, CastFeel.BODY_MS);
    }

    /* self / soutien */
    if(sp.heal || sp.type==="heal" || sp.type==="shield" || sp.id==="bouclier" || sp.id==="nanites"){
      if(sp.heal){
        const h = sp.heal[0] + Math.floor(Math.random()*Math.max(1,(sp.heal[1]-sp.heal[0]+1)));
        e.pv = Math.min(e.pvMax, e.pv + h);
        rlFloat(e, "+"+h, null, "heal", 0);
        setStatus(e.name+" · "+sp.name+" +"+h+" PV");
      } else {
        e.shield = (e.shield|0) + 10 + Math.floor(Math.random()*8);
        setStatus(e.name+" · "+sp.name+" (égide "+e.shield+")");
      }
      e.flash = performance.now()+160;
      hud();
      return false;
    }

    if(!p.alive) return false;
    faceToward(e, p.c, p.r);
    if(dist(e,p) > (sp.range|0)){
      startReaction(p, "dodge", { faceDir: reactionFace(p, e) });
      setStatus(e.name+" rate");
      return false;
    }

    let dmg = 0;
    if(sp.dmg){
      dmg = sp.dmg[0] + Math.floor(Math.random()*Math.max(1, sp.dmg[1]-sp.dmg[0]+1));
      if(G.roguelite) dmg = rlScale(e, p, sp, dmg);
      else {
        const boost = 1.0 + Math.min(0.2, (G.fightN-1)*0.03);
        dmg = Math.max(4, Math.floor(dmg * boost));
      }
    }
    if(sp.effect==="drainPA"){ /* flavor : petit bonus */ dmg += 2; }
    if(sp.effect==="push") pushEntityAway(p, e, 1, "player");
    let absorbed = 0;
    if(p.shield>0 && dmg){ absorbed=Math.min(p.shield,dmg); p.shield-=absorbed; dmg-=absorbed; }
    if(dmg){
      if(G.roguelite) dmg = rlErode(p, dmg);
      p.pv = Math.max(0, Math.min(p.pvMax, p.pv-dmg));
    }
    const popHit = ()=>{
      if(absorbed) rlFloat(p, String(absorbed), null, "shield", 0);
      if(dmg) rlFloat(p, "-"+dmg, null, "damage", 0);
      p.flash = performance.now()+180;
      const face = reactionFace(p, e);
      if(p.pv<=0) startReaction(p, "ko", { ko:true, faceDir: face });
      else if(!dmg && absorbed) startReaction(p, "block", { faceDir: face });
      else {
        const named = (typeof Reactions!=="undefined") ? (Reactions.forSpell(sp) || "flinch") : "flinch";
        startReaction(p, named, { faceDir: face });
      }
    };
    if(typeof CastFeel !== "undefined") setTimeout(popHit, CastFeel.IMPACT_AT_MS);
    else popHit();
    setStatus(e.name+" · "+sp.name+(dmg?" → "+dmg:"")+(e.pa>0?" · …":""));
    hud();
    if(p.pv<=0){
      p.alive=false; playAnim(p,"Die");
      if(p===G.player){ onCombatEnd("defeat"); return true; }
      return false;
    }
    return false;
  }

  function enemyTurn(){
    if(!G.enemy.alive){ G.turn="player"; beginPlayerTurn(); return; }
    tickDots(G.enemy);
    if(!G.enemy.alive) return;
    const e=G.enemy;
    e.pa = e.paMax; e.pm = e.pmMax;
    const prof = e.profile || strategyProfile(e.strategy||"bruiser", e.spells);
    const play = aiPlay();
    if(play){
      const defs = (e.spells||[]).map(spellById).filter(Boolean);
      const ranged = defs.some((s)=> (s.type==="damage" || s.dmg) && (s.range|0) >= 3);
      prof.retreatHp = play.healAt;
      prof.kiteBelow = play.kite && ranged ? 2 : 0;
      prof.hitAndRun = false;
      prof.preferMin = 1;
      prof.preferMax = 8;
      prof.label = "proche";
    }
    if(e._stunned){ e._stunned=false; setStatus(e.name+" étourdi"); setTimeout(()=>{ G.turn="player"; beginPlayerTurn(); }, 380); return; }

    let p = enemyFocus();
    if(!(p.invis>0)) e.lastSeen = { c:p.c, r:p.r };

    if((p.invis|0) > 0){
      const hunt = e.lastSeen || { c:p.c, r:p.r };
      let guard = 6;
      while((e.pm|0)>0 && guard-- > 0){
        if(dist(e, hunt) <= 0) break;
        if(!enemyStepToward(hunt.c, hunt.r)) break;
      }
      setTimeout(()=>{
        stopMoveAnim(e);
        setStatus(e.name+" cherche…");
        setTimeout(()=>{ G.turn="player"; beginPlayerTurn(); }, 280);
      }, 240);
      return;
    }

    let actions = 0;
    const maxActions = 5;
    let didHit = false;
    const finish = ()=>{
      stopMoveAnim(e);
      if(G.turn!=="over" && G.player.alive){ G.turn="player"; beginPlayerTurn(); }
    };
    const stepOnce = ()=>{
      p = enemyFocus();
      if(!e.alive || !G.player.alive || G.turn==="over" || actions++ >= maxActions){
        finish(); return;
      }
      const d = dist(e,p);
      const hpRatio = e.pv / Math.max(1, e.pvMax);

      /* 1) soin / bouclier si blessé */
      if(hpRatio <= (prof.retreatHp||0.35)){
        const sup = enemyPickSpell("support");
        if(sup && (sup.heal || sup.type==="shield" || sup.type==="heal")){
          enemyCast(sup);
          setTimeout(stepOnce, 360);
          return;
        }
        if(prof.kiteBelow>=0 && enemyStepAway(p.c, p.r)){
          setTimeout(stepOnce, 200);
          return;
        }
      }

      /* 2) kiting sniper/caster : trop près → reculer */
      if(d < (prof.kiteBelow||0) && (e.pm|0)>0){
        if(enemyStepAway(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
      }

      /* 3) contrôle d’abord */
      if(prof.controlFirst && !didHit){
        const ctrl = enemyPickSpell("control");
        if(ctrl && ctrl.effect && d <= (ctrl.range|0)){
          const dead = enemyCast(ctrl);
          if(dead) return;
          didHit = true;
          setTimeout(stepOnce, 380);
          return;
        }
      }

      /* 4) à bonne distance → cast */
      const preferLo = prof.preferMin|0, preferHi = prof.preferMax|0;
      const sp = enemyPickSpell("damage");
      const need = sp ? (sp.range|0) : 1;

      if(sp && d <= need){
        /* skirmisher : frappe puis fuite */
        const dead = enemyCast(sp);
        if(dead) return;
        didHit = true;
        if(prof.hitAndRun && (e.pm|0)>0){
          enemyStepAway(p.c, p.r);
          setTimeout(stepOnce, 320);
          return;
        }
        setTimeout(stepOnce, 380);
        return;
      }

      /* 5) se placer à la distance préférée */
      if((e.pm|0)>0){
        if(d > preferHi){
          if(enemyStepToward(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
        } else if(d < preferLo){
          if(enemyStepAway(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
        } else if(d > need){
          if(enemyStepToward(p.c, p.r)){ setTimeout(stepOnce, 200); return; }
        }
      }

      /* 6) dernier recours cast */
      if(sp && d <= need){
        const dead = enemyCast(sp);
        if(dead) return;
        setTimeout(stepOnce, 380);
        return;
      }

      setStatus(e.name+" · "+(prof.label||"attend"));
      setTimeout(finish, 220);
    };
    setStatus(e.name+" · "+(prof.label||e.strategy||"agit")+"…");
    setTimeout(stepOnce, 260);
  }

  function beginPlayerTurn(){
    G.busy = false;
    tickDots(G.player);
    if(!G.player.alive) return;
    if(!G.roguelite) G.player.pmMax = playerBasePm();
    G.player.pa = G.player.paMax;
    G.player.pm = G.player.pmMax;
    if(G.player.invis>0) G.player.invis -= 1;
    G.armed=null; G.armedSlot=null;
    refreshSpellBar();
    recomputeMoves(); recomputeTargets(); renderSpells(); hud();
    const mount = isPlayerMounted() ? " · monture +"+mountPmBonus()+" PM" : "";
    const invis = G.player.invis>0 ? " · voile "+G.player.invis : "";
    setStatus("Ton tour"+mount+invis);
    if(G.roguelite){
      G.turnDeadline = performance.now() + 30000;
      if(G.rl) G.rl.turns = (G.rl.turns|0) + 1;
    }
  }

  function offerEvo(forceId, fromVictory){
    if(typeof FantasyBridge==="undefined" || !FantasyBridge.evoChoicesFor){
      if(fromVictory) return false;
      return false;
    }
    const bar = G.spellBar.length ? G.spellBar : refreshSpellBar();
    const candidates = bar.filter(s=>s && s.spellId && !s.locked).map(s=>s.spellId);
    let pickId = forceId || null;
    if(!pickId){
      pickId = candidates.find(id=>{
        if(!FantasyBridge.EVO_TREE || !FantasyBridge.EVO_TREE[id]) return false;
        return FantasyBridge.nextEvoTier(evoState(id), id) != null;
      });
    }
    if(!pickId) pickId = candidates.find(id=>FantasyBridge.EVO_TREE && FantasyBridge.EVO_TREE[id]);
    if(!pickId) pickId = candidates[0];
    if(!pickId){
      if(!fromVictory) setStatus("Aucun sort à évoluer");
      return false;
    }
    const st = evoState(pickId);
    const tier = FantasyBridge.nextEvoTier(st, pickId);
    if(tier==null){
      if(!fromVictory) setStatus((spellById(pickId)||{}).name+" déjà au dernier palier");
      return false;
    }
    const choices = FantasyBridge.evoChoicesFor(pickId, tier);
    if(!choices || !choices.length) return false;
    G.pendingEvo = { spellId: pickId, tier, choices, fromVictory: !!fromVictory };
    const sp = spellById(pickId);
    el("evoTitle").textContent = "Évolution · "+(sp?sp.name:pickId);
    const tierRead = el("evoTierRead");
    if(tierRead) tierRead.textContent = String(tier).padStart(2,"0");
    const tierMax = FantasyBridge.evoTierCount ? FantasyBridge.evoTierCount(pickId) : FantasyBridge.EVO_MAX_TIERS;
    el("evoSub").textContent = "Palier "+tier+"/"+tierMax+" · un choix, les blocs s’ajoutent";
    const host = el("evoOpts"); host.innerHTML="";
    choices.forEach((ch)=>{
      const b = document.createElement("button");
      b.type="button";
      const ed = editorEvoEntry(pickId, tier, ch.name);
      const animShow = (ed && ed.blocks && ed.blocks.length) ? ed.blocks.join("+") : ((ed && ed.anim) ? ed.anim : (ch.anim||"?"));
      const fxLab = ed
        ? ((ed.effect && ed.effect!=="None") ? ed.effect : (ed.slash && ed.slash!=="None") ? ed.slash : "aucun")
        : (ch.fx || "aucun");
      const fpsShow = ed && ed.fps != null ? ed.fps : 14;
      const brief = String(ch.d||"").split(" · ")[0];
      b.innerHTML = "<b>"+ch.name+"</b><span>"+brief+"</span><span style=\"display:block;margin-top:4px;color:#5b7c99\">Anim "+animShow+" · "+fpsShow+" fps · FX "+fxLab+"</span>";
      b.onclick=()=>{
        try{ ch.apply(st); }catch(_e){}
        st.tiersTaken = (st.tiersTaken|0) + 1;
        const ed = applyEditorAnimOnPick(pickId, tier, ch.name, st);
        const animShow = (ed && ed.anim) || (st.evo && st.evo.anim) || ch.anim || "";
        const fxShow = (ed && ed.effect && ed.effect!=="None") ? ed.effect : (ed && ed.slash && ed.slash!=="None") ? ed.slash : "";
        saveEvo();
        const wasVictory = G.pendingEvo && G.pendingEvo.fromVictory;
        closeEvo();
        setStatus((sp?sp.name:pickId)+" → "+ch.name+" · "+animShow+(fxShow?" +"+fxShow:""));
        renderSpells();
        if(wasVictory) setTimeout(()=> startNextFight({ force:true }), 450);
      };
      host.appendChild(b);
    });
    el("evoOv").classList.add("on");
    el("evoOv").setAttribute("aria-hidden","false");
    return true;
  }

  function spellMark(sp){
    if(!sp) return { ch:"·", cls:"" };
    if(sp.type==="heal" || sp.heal) return { ch:"+", cls:"el-heal" };
    const el = sp.element || "neutre";
    const ch = { feu:"▲", eau:"●", air:"◆", terre:"■", neutre:"○" }[el] || "○";
    return { ch:ch, cls:"el-"+el };
  }
  function renderSpells(){
    const host = el("spellList"); host.innerHTML="";
    const bar = G.spellBar.length ? G.spellBar : refreshSpellBar();
    bar.forEach((slot, slotIndex)=>{
      const b = document.createElement("button");
      b.type="button";
      const sp = slot.spellId ? spellById(slot.spellId) : null;
      const skin = (sp && typeof FantasyBridge!=="undefined" && FantasyBridge.SPELL_SKIN[sp.id]) || null;
      const name = sp ? (skin ? skin.name : sp.name) : "";
      const mark = spellMark(sp);
      const lab = document.createElement("small");
      lab.textContent = String(slotIndex + 1);
      b.appendChild(lab);
      const cost = document.createElement("em");
      cost.textContent = sp ? String(sp.cost|0) : "";
      b.appendChild(cost);
      const line = document.createElement("b");
      if(slot.locked || !sp){
        line.textContent = "—";
        b.className = "lock";
        b.disabled = true;
      } else {
        line.textContent = mark.ch;
        b.className = ((G.armed===sp.id && G.armedSlot && G.armedSlot.slot===slot.slot) ? "on " : "") + mark.cls;
        b.setAttribute("aria-label", name);
        b.disabled = G.turn!=="player" || G.player.pa<sp.cost;
        b.onclick=()=>{
          if(G.turn!=="player") return;
          if(G.armed===sp.id && G.armedSlot && G.armedSlot.slot===slot.slot){
            castArmed();
            return;
          }
          armSlot(slot);
        };
      }
      b.appendChild(line);
      host.appendChild(b);
    });
  }

  function tileDiamond(c, r, fill, stroke){
    const s = toScreen(c, r);
    const hw = TILE_W/2, hh = TILE_H/2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y-hh);
    ctx.lineTo(s.x+hw, s.y);
    ctx.lineTo(s.x, s.y+hh);
    ctx.lineTo(s.x-hw, s.y);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if(stroke){ ctx.lineWidth=1; ctx.strokeStyle=stroke; ctx.stroke(); }
    return s;
  }

  /** À la mort : corps nu seulement (plus de chapeau / stuff flottant sur Die). */
  function layersForDeathPose(ent, isEnemy){
    const raw = (ent.layers && ent.layers.length)
      ? ent.layers
      : (isEnemy
          ? [{folder:"NakedBody",tint:null,alpha:1},{folder:"Head3",tint:null,alpha:1}]
          : layersForRow(sheetRowForDir(ent.dir|0, "Die")));
    const nude = [];
    let bodyTint = isEnemy ? "#8a6060" : null;
    try{ if(!isEnemy) bodyTint = tint("body"); }catch(_e){}
    for(const L of raw){
      if(!L || !L.folder) continue;
      if(/NakedBody/i.test(L.folder)){
        nude.push({ folder:L.folder, tint:L.tint || bodyTint, alpha:1 });
      } else if(/Shadow/i.test(L.folder)){
        nude.push({ folder:L.folder, tint:null, alpha:1 });
      }
    }
    if(!nude.some(L=>/NakedBody/i.test(L.folder)))
      nude.push({ folder:"NakedBody", tint:bodyTint, alpha:1 });
    if(!nude.some(L=>/Shadow/i.test(L.folder)))
      nude.unshift({ folder:(catalog && catalog.shadowFolder) || "Shadow", tint:null, alpha:1 });
    return nude;
  }

  function drawEntity(ent, isEnemy, opts){
    opts = opts || {};
    if(!ent.alive && ent.anim!=="Die") return;
    const anim = ent.anim||"Idle";
    const dying = /^Die$/i.test(anim);
    /* Plus de monture pendant Die (équipement retiré) */
    const mounted = dying ? false : entityMounted(ent);
    const elapsed = (performance.now()-(ent.t0||0))/1000;
    const loopAnims = /^(Idle|Walk|Run|RunBackwards|StrafeLeft|StrafeRight|CrouchRun|RideIdle|RideRun|RideIdleAttack1|RideRunAttack1)$/i;
    const pos = entityDrawPos(ent);
    const s = toScreen(pos.c, pos.r);
    const BODY_PX = 40;
    let scale = (typeof CastFeel !== "undefined") ? CastFeel.tileScale(TILE_H, BODY_PX) : 1.22;
    let squashX = 1, squashY = 1, lift = 0;
    if(ent.slide && ent.slide.kind === "leap" && typeof CastFeel !== "undefined"){
      const sq = CastFeel.landSquash(pos.u || 0);
      squashX = sq.x; squashY = sq.y;
      lift = CastFeel.leapLift(pos.u || 0) * TILE_H;
    }
    const dw=FW*scale*squashX, dh=FH*scale*squashY;
    const FOOT_Y = 88;
    const GROUND = 0;
    const groundY = s.y + GROUND;
    let dx=s.x-dw/2, dy=groundY - FOOT_Y*scale*squashY - lift;
    let reactDraw = null;
    if(ent.react && typeof Reactions!=="undefined"){
      reactDraw = Reactions.sample(ent.react.spec, (performance.now()-ent.react.t0)/1000, ent.dir|0);
      dx += reactDraw.x;
      dy += reactDraw.y;
    }
    if(ent.feel && typeof CastFeel !== "undefined" && (ent.feel.kind === "dash" || ent.slide && ent.slide.kind === "dash")){
      const lean = CastFeel.lean(ent.dir|0, "impact");
      const along = ent.slide ? Math.min(1, pos.u || 0) : 0.4;
      dx += lean.x * along;
      dy += lean.y * along;
    }
    let baseAlpha = opts.alpha != null ? opts.alpha : 1;
    if(!isEnemy && !opts.clone && (G.player.invis|0)>0) baseAlpha *= 0.38;

    ctx.save();
    ctx.globalAlpha = Math.max(0.12, baseAlpha) * 0.9;
    ctx.fillStyle="rgba(40,40,38,0.16)";
    ctx.beginPath(); ctx.ellipse(s.x, groundY+2, 13, 5, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    let layers;
    if(dying && !ent.react){
      layers = layersForDeathPose(ent, isEnemy);
    } else if(ent.layers && ent.layers.length){
      layers = ent.layers;
    } else if(G.roguelite && ent===G.player && G.player.gearLayers){
      layers = G.player.gearLayers;
    } else if(isEnemy){
      layers = [{folder:"NakedBody",tint:null,alpha:1},{folder:"Chest4",tint:null,alpha:1},{folder:"Head3",tint:null,alpha:1},{folder:"Melee2",tint:null,alpha:1}];
    } else {
      layers = layersForRow(sheetRowForDir(ent.dir|0, anim));
    }

    ctx.imageSmoothingEnabled=false;
    let drawn=0;
    const animFps = ent.stepFps || FPS;
    let beat = null;
    if(ent.feel && typeof CastFeel !== "undefined" && !loopAnims.test(anim) && !ent.knock){
      beat = CastFeel.castColumn((performance.now() - ent.feel.t0) / 1000, COLS);
    }
    function sheetCol(sheetAnim){
      if(ent.react && ent.react.spec && ent.react.spec.frames){
        const frames = ent.react.spec.frames;
        const ageMs = performance.now() - ent.react.t0;
        let idx = Math.min(frames.length-1, Math.floor(ageMs / (1000/Math.max(1, ent.react.spec.fps))));
        if(ent.react.spec.hold && ageMs >= ent.react.spec.returnMs) idx = frames.length-1;
        return frames[idx] % COLS;
      }
      if(ent.knock) return 0;
      if(beat && !beat.idle && !loopAnims.test(sheetAnim)) return beat.col;
      let col = Math.floor(elapsed * animFps);
      if(loopAnims.test(sheetAnim) || (beat && beat.idle)) col = col % COLS;
      else col = Math.min(col, COLS-1);
      return col;
    }
    const drawAnim = (beat && beat.idle) ? "Idle" : anim;
    for(const L of layers){
      const resolved = resolveSheet(L.folder, drawAnim, mounted);
      if(!resolved) continue;
      const { im, sheetAnim } = resolved;
      const row = sheetRowForDir(ent.dir|0, sheetAnim);
      const col = sheetCol(sheetAnim);
      try{ tintDraw(im, col*FW, row*FH, FW, FH, dx, dy, dw, dh, L.tint, (L.alpha||1)*baseAlpha); drawn++; }catch(_e){}
    }
    if(beat && beat.smear){
      const ghost = CastFeel.lean(ent.dir|0, "impact");
      ctx.save();
      ctx.globalAlpha = 0.35 * baseAlpha;
      for(const L of layers){
        const resolved = resolveSheet(L.folder, drawAnim, mounted);
        if(!resolved) continue;
        const { im, sheetAnim } = resolved;
        const row = sheetRowForDir(ent.dir|0, sheetAnim);
        try{ tintDraw(im, beat.col*FW, row*FH, FW, FH, dx+ghost.x, dy+ghost.y, dw, dh, L.tint, 0.45); }catch(_e){}
      }
      ctx.restore();
    }
    if(ent.comboHands && typeof CastFeel!=="undefined"){
      const rgb = CastFeel.elementColor(ent.comboHands);
      ctx.save();
      ctx.globalAlpha = 0.9 * baseAlpha;
      ctx.fillStyle = "rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")";
      ctx.fillRect(dx+dw*0.62, dy+dh*0.42, 5, 5);
      ctx.fillRect(dx+dw*0.30, dy+dh*0.42, 5, 5);
      if(drawAnim==="Kick") ctx.fillRect(dx+dw*0.68, dy+dh*0.72, 6, 4);
      ctx.restore();
    }
    if(reactDraw){
      ctx.save();
      if(reactDraw.tint && typeof CastFeel!=="undefined"){
        const rgb = CastFeel.elementColor(reactDraw.tint);
        ctx.fillStyle = "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+",0.28)";
        ctx.fillRect(dx+dw*0.28, dy+dh*0.2, dw*0.44, dh*0.55);
      }
      if(reactDraw.glow && typeof CastFeel!=="undefined"){
        const key = reactDraw.glow==="heal" ? "heal" : reactDraw.glow==="shield" ? "shield" : "neutre";
        const rgb = key==="neutre" ? CastFeel.elementColor("neutre") : CastFeel.NUM[key];
        ctx.globalAlpha = 0.35 * baseAlpha;
        ctx.fillStyle = "rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")";
        ctx.beginPath();
        ctx.ellipse(s.x, dy+dh*0.45, 16, 22, 0, 0, Math.PI*2);
        ctx.fill();
      }
      if(reactDraw.flames){
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = "#e24a2a";
        ctx.fillRect(dx+dw*0.42, dy+dh*0.18, 4, 7);
        ctx.fillRect(dx+dw*0.52, dy+dh*0.12, 3, 6);
      }
      if(reactDraw.sparks){
        ctx.fillStyle = "#c8d0ff";
        ctx.fillRect(dx+dw*0.3, dy+dh*0.3, 2, 2);
        ctx.fillRect(dx+dw*0.62, dy+dh*0.36, 2, 2);
      }
      if(reactDraw.dust){
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = "#c4b49a";
        ctx.beginPath();
        ctx.ellipse(s.x-reactDraw.x, groundY+2, 8, 3, 0, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    if(ent.overlay==="squelette" || ent.overlay==="spectre"){
      const bone = ent.overlay==="squelette";
      const tintHex = bone ? "#efe8dc" : "#d9cbb8";
      const ovA = bone ? 0.8 : 0.45;
      for(const L of layers){
        const resolved = resolveSheet(L.folder, drawAnim, mounted);
        if(!resolved) continue;
        const { im, sheetAnim } = resolved;
        const row = sheetRowForDir(ent.dir|0, sheetAnim);
        const col = sheetCol(sheetAnim);
        try{ tintDraw(im, col*FW, row*FH, FW, FH, dx+3, dy-4, dw, dh, tintHex, ovA*baseAlpha); }catch(_e){}
      }
    }
    if(!drawn){
      ctx.save(); ctx.globalAlpha = baseAlpha;
      ctx.fillStyle = isEnemy ? "#8a5050" : (opts.clone ? "#7a8a9a" : "#3d6a8a");
      ctx.beginPath(); ctx.ellipse(s.x, groundY-16, 11, 16, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = isEnemy ? "#c07070" : "#d4a574";
      ctx.beginPath(); ctx.arc(s.x, groundY-30, 7, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if(ent.flash && performance.now()<ent.flash){
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=0.45*baseAlpha;
      for(const L of layers){
        const resolved = resolveSheet(L.folder, drawAnim, mounted);
        if(!resolved) continue;
        const { im, sheetAnim } = resolved;
        const row = sheetRowForDir(ent.dir|0, sheetAnim);
        const col = sheetCol(sheetAnim);
        try{ ctx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); }catch(_e){}
      }
      ctx.restore();
    }
    if(ent.pvMax){
      const pct = ent.pv/ent.pvMax;
      const bw=26, bh=3, bx=s.x-bw/2, by=dy+12;
      ctx.fillStyle="rgba(0,0,0,.22)"; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
      ctx.fillStyle = isEnemy ? "#8a3030" : "#2f6f4e";
      ctx.fillRect(bx, by, bw*Math.max(0,pct), bh);
    }
  }

  function fxRgb(element){
    const rgb = (typeof CastFeel !== "undefined") ? CastFeel.elementColor(element) : [234, 112, 32];
    return "rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")";
  }
  function drawWorldFx(pass){
    if(typeof CastFeel === "undefined") return;
    const now = performance.now();
    const list = G.fx || [];
    const limit = CastFeel.BODY + CastFeel.LINGER;
    for(const fx of list){
      const age = (now - fx.t0) / 1000;
      if(age < 0 || age > limit) continue;
      const color = fxRgb(fx.element);
      const from = toScreen(fx.c, fx.r);
      const to = toScreen(fx.tc, fx.tr);
      ctx.save();
      if(pass === "ground"){
        if(age >= CastFeel.ANTICIPATE){
          const life = 1 - Math.min(1, (age - CastFeel.ANTICIPATE) / (CastFeel.IMPACT + CastFeel.RECOVER + CastFeel.LINGER));
          ctx.globalAlpha = 0.55 * life;
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          tileDiamond(fx.tc, fx.tr, "rgba(0,0,0,0)", color);
        }
        if(fx.kind === "knock" || fx.kind === "dash"){
          ctx.fillStyle = "rgba(90,80,60,0.35)";
          const steps = 4;
          for(let i = 0; i < steps; i++){
            const u = (i + 1) / (steps + 1);
            if(u > Math.min(1, age / 0.4)) continue;
            const x = from.x + (to.x - from.x) * u;
            const y = from.y + (to.y - from.y) * u;
            ctx.beginPath();
            ctx.ellipse(x, y + 2, 7 - i, 3, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else {
        if(age < CastFeel.ANTICIPATE){
          const u = age / CastFeel.ANTICIPATE;
          ctx.globalAlpha = 0.35 + u * 0.4;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(from.x, from.y, 8 + u * 10, 4 + u * 3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        if(fx.kind === "summon"){
          const drop = age < CastFeel.ANTICIPATE ? 1 - age / CastFeel.ANTICIPATE : 0;
          const hx = to.x, hy = to.y - 18 - drop * 34;
          ctx.globalAlpha = drop > 0 ? 0.9 : 0.4;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(hx, hy - 10);
          ctx.lineTo(hx + 4, hy);
          ctx.lineTo(hx, hy + 8);
          ctx.lineTo(hx - 4, hy);
          ctx.closePath();
          ctx.fill();
        }
        if(age >= CastFeel.ANTICIPATE && age < CastFeel.ANTICIPATE + 0.28){
          const u = (age - CastFeel.ANTICIPATE) / 0.28;
          ctx.globalAlpha = 1 - u;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          const rad = 6 + u * (fx.kind === "summon" ? 26 : 16);
          ctx.beginPath();
          ctx.ellipse(to.x, to.y, rad, rad * 0.45, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = color;
          for(let i = 0; i < 6; i++){
            const a = (i / 6) * Math.PI * 2;
            const x = to.x + Math.cos(a) * (10 + u * 14);
            const y = to.y + Math.sin(a) * (5 + u * 7);
            ctx.fillRect(x, y, 2, 2);
          }
        }
      }
      ctx.restore();
    }
    if(pass === "air"){
      G.fx = list.filter(fx => (now - fx.t0) / 1000 <= limit);
    }
  }

  function draw(){
    fit();
    const W=canvas.width, H=canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = document.body.classList.contains("skin-d") ? "#F3EFE6" : "#d8ddd4";
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.scale(cam.sc, cam.sc);

    const order = ensureTileOrder();
    for(const t of order){
      if(!tileInView(t.c, t.r)) continue;
      const a = ((t.c+t.r)&1);
      const sand = document.body.classList.contains("skin-d");
      const fill = sand ? (a ? "#F6E7D2" : "#E4D2B4") : (a ? "#e8e8e2" : "#dcdcd6");
      tileDiamond(t.c, t.r, fill, sand ? "rgba(47,49,51,0.22)" : "rgba(80,80,70,0.12)");
      const k=key(t.c,t.r);
      if(G.moves.has(k)){
        tileDiamond(t.c, t.r, "rgba(47,111,78,0.28)", "rgba(47,111,78,0.45)");
      }
      if(G.range.has(k) && G.armed){
        tileDiamond(t.c, t.r, "rgba(90,70,140,0.22)", "rgba(90,70,140,0.4)");
      }
      if(G.aoe.has(k)){
        tileDiamond(t.c, t.r, "rgba(138,48,48,0.34)", "rgba(138,48,48,0.55)");
      }
      if(G.targets.has(k)){
        tileDiamond(t.c, t.r, "rgba(138,48,48,0.18)", "rgba(138,48,48,0.65)");
      }
      if(G.hover && G.hover.c===t.c && G.hover.r===t.r){
        tileDiamond(t.c, t.r, "rgba(61,61,58,0.12)", "rgba(61,61,58,0.55)");
      }
    }

    const ents=[];
    const roster = G.roster || [];
    const enemyInRoster = G.enemy && roster.indexOf(G.enemy)>=0;
    if(G.enemy && !enemyInRoster && (G.enemy.alive || G.enemy.anim==="Die")) ents.push({e:G.enemy, enemy:true});
    if(G.clone && G.clone.alive) ents.push({e:G.clone, enemy:false, clone:true});
    if(G.player.alive || G.player.anim==="Die") ents.push({e:G.player, enemy:false});
    roster.forEach(p=>{ if(p.alive || p.anim==="Die") ents.push({e:p, enemy:p.side==="b"}); });
    ents.sort((a,b)=>{
      const pa = entityDrawPos(a.e), pb = entityDrawPos(b.e);
      return (pa.c+pa.r)-(pb.c+pb.r) || pa.c-pb.c;
    });
    drawWorldFx("ground");
    for(const o of ents){
      drawEntity(o.e, o.enemy, o.clone ? {clone:true, alpha:o.e.alpha||0.42} : null);
    }
    drawWorldFx("air");
    const nowDraw = performance.now();
    (G.floats||[]).forEach(f=>{
      const age = (nowDraw - f.t0) / 1000;
      const motion = (typeof CastFeel !== "undefined")
        ? CastFeel.numberMotion(age, f.hit || 0)
        : { scale: 1, alpha: age < 0.7 ? 1 - age / 0.7 : 0, x: 0, y: age * 28, alive: age < 0.7 };
      if(!motion.alive) return;
      const s = toScreen(f.c, f.r);
      const rgb = (typeof CastFeel !== "undefined" && CastFeel.NUM[f.kind]) ? CastFeel.NUM[f.kind] : null;
      ctx.save();
      ctx.translate(s.x + motion.x, s.y - 46 - motion.y);
      ctx.scale(motion.scale, motion.scale);
      ctx.globalAlpha = motion.alpha;
      ctx.fillStyle = f.color || (rgb ? "rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")" : "#D2302A");
      ctx.font = "700 13px Pixelify Sans, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    });
    G.floats = (G.floats||[]).filter(f=>{
      const age = (nowDraw - f.t0) / 1000;
      return (typeof CastFeel !== "undefined") ? CastFeel.numberMotion(age, f.hit || 0).alive : age < 0.7;
    });

    ctx.restore();
  }

  function pointer(e){

    const y = (p.clientY-rect.top) * (canvas.height/rect.height);
    return { x: x/cam.sc, y: y/cam.sc };

  function rlFloat(ent, text, color, kind, hitIndex){
    if(!ent) return;

  function rlScale(caster, target, spell, dmg){
    const map = { terre:"force", neutre:"force", feu:"intel", eau:"chance", air:"agi" };
    const stat = (caster.stats && caster.stats[map[spell.element] || "force"]) || 0;
    let d = Math.max(1, Math.round(dmg * (1 + stat/85) * 0.5));
    if(spell.effect==="glyph" || spell.effect==="trap") d = Math.round(d * 1.35);
    const res = target && target.res ? (target.res[spell.element] || 0) : 0;
    d = Math.max(1, Math.round(d * (1 - Math.min(0.5, res))));
    if(spell.overlay==="squelette" || spell.overlay==="spectre") caster.overlay = spell.overlay;
    return d;
  }
  function rlErode(target, dmg){
    const ero = Math.floor(dmg * 0.1);
    if(ero>0) target.pvMax = Math.max(1, target.pvMax - ero);
    return dmg;
  }
  function rlSpawnBones(){
    if(G.clone && G.clone.alive) return;
    G.clone = {
      c:G.player.c, r:Math.min(GRID-1, G.player.r+1), alive:true,
      pv:22, pvMax:22, pm:2, pa:3, dmg:[5,8], overlay:"squelette",
      anim:"Idle", t0:performance.now(), dir:3, name:"Ossement",
      layers:[{folder:"Shadow",tint:null,alpha:1},{folder:"NakedBody",tint:"#efe8dc",alpha:1}],
    };
  }
  function rlFallbackLayers(name){
    let h = 2166136261;
    const s = String(name || "x");
    for(let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    h = h >>> 0;
    const heads = ["Head1","Head3","Head5","Head8","Head12","Head16"];
    const weapons = ["Melee2","Melee8","Magic2","Magic3","Ranged1"];
    const chests = ["Chest2","Chest4","Chest6","Chest8"];
    const legs = ["Legs1","Legs3","Legs5","Legs7"];
    return [
      {folder:"Shadow", tint:null, alpha:1},
      {folder:"NakedBody", tint:null, alpha:1},
      {folder:legs[h % legs.length], tint:null, alpha:1},
      {folder:chests[(h>>>3) % chests.length], tint:null, alpha:1},
      {folder:weapons[(h>>>6) % weapons.length], tint:null, alpha:1},
      {folder:heads[(h>>>9) % heads.length], tint:null, alpha:1},
    ];
  }
  function rlPlace(side, index, taken){
    for(let k=0;k<90;k++){
      const i = index + k;
      const c = side==="a" ? (i % 3) : (9 - (i % 3));
      const r = (side==="a" ? 2 : 1) + Math.floor(i / 3);
      if(c<0 || r<0 || c>=GRID || r>=GRID) continue;
      if(c===1 && r===4) continue;
      const id = c+","+r;
      if(taken.has(id)) continue;
      taken.add(id);
      return {c, r};
    }
    return side==="a" ? {c:0, r:0} : {c:9, r:9};
  }
  function rlActor(unit, side, spot){
    (unit.spells||[]).forEach(rlInstallSpell);
    const layers = (unit.layers && unit.layers.length) ? unit.layers : rlFallbackLayers(unit.name || side);
    return {
      name: unit.name || (side==="b" ? "Adversaire" : "Allié"),
      level: unit.level|0 || 1,
      side, alive:true,
      c: spot.c, r: spot.r,
      dir: side==="a" ? 3 : 7,
      pv: unit.pv|0, pvMax: unit.pvMax|0 || 1,
      pa: unit.paMax|0 || 6, paMax: unit.paMax|0 || 6,
      pm: unit.pmMax|0 || 3, pmMax: unit.pmMax|0 || 3,
      stats: unit.stats || {}, res: unit.res || {},
      spells: (unit.spells||[]).map(s=> (s && s.id) || s),
      layers, overlay: unit.overlay || null,
      anim:"Idle", t0:performance.now(), frame:0, flash:0, shield:0,
      weaponAnim:"Attack1",
    };
  }
  function rlWarmRoster(){
    const anims = ["Idle","Walk","Attack1","TakeDamage","Die"];
    const folders = new Set();
    const add = (layers)=> (layers||[]).forEach(L=>{ if(L && L.folder) folders.add(L.folder); });
    add(G.player && G.player.gearLayers);
    (G.roster||[]).forEach(p=> add(p.layers));
    folders.forEach(f=> anims.forEach(a=> loadImg(f, a)));
  }
  function rlPromote(){
    if(!G.roguelite) return false;
    const next = (G.roster||[]).find(p=>p.side==="b" && p.alive);
    if(!next || next===G.enemy) return false;
    G.enemy = next;
    try{ playAnim(G.enemy, "Idle"); }catch(_e){}
    return true;
  }
  function rlRosterPhase(done){
    const list = (G.roster||[]).filter(p=>p.alive && p!==G.enemy);
    if(!G.roguelite || !list.length){ done(); return; }
    const delay = list.length > 8 ? 42 : 72;
    let i = 0;
    const step = ()=>{
      if(i>=list.length || !G.player.alive || G.turn==="over"){ done(); return; }
      const p = list[i++];
      if(!p.alive){ step(); return; }
      const foes = p.side==="a"
        ? (G.roster||[]).filter(x=>x.side==="b" && x.alive)
        : [G.player].concat((G.roster||[]).filter(x=>x.side==="a" && x.alive)).filter(x=>x && x.alive);
      let target = null, best = 99;
      foes.forEach(f=>{
        const d = Math.max(Math.abs(f.c-p.c), Math.abs(f.r-p.r));
        if(d<best){ best=d; target=f; }
      });
      let visual = delay;
      const play = aiPlay();
      const ranged = (p.spells||[]).some((id)=>{
        const s = spellById(typeof id === "string" ? id : (id && id.id));
        return s && (s.range|0) >= 3 && (s.dmg || s.type==="damage");
      });
      const hurt = play && p.pv / Math.max(1, p.pvMax) < play.healAt;
      const shouldKite = play && play.kite && ranged && target && best <= 1;
      if(target && (shouldKite || hurt) && best <= 2){
        const nc = Math.max(0, Math.min(GRID-1, p.c + Math.sign(p.c-target.c)));
        const nr = Math.max(0, Math.min(GRID-1, p.r + Math.sign(p.r-target.r)));
        if((nc!==p.c || nr!==p.r) && !occupied(nc, nr)){
          faceToward(p, target.c, target.r);
          p.c = nc; p.r = nr;
          try{ playAnim(p, "Walk"); }catch(_e){}
        }
      } else if(target && best>1){
        const nc = Math.max(0, Math.min(GRID-1, p.c + Math.sign(target.c-p.c)));
        const nr = Math.max(0, Math.min(GRID-1, p.r + Math.sign(target.r-p.r)));
        if((nc!==p.c || nr!==p.r) && !occupied(nc, nr)){
          faceToward(p, nc, nr);
          p.c = nc; p.r = nr;
          try{ playAnim(p, "Walk"); }catch(_e){}
        }
      } else if(target){
        visual = Math.max(delay, 130);
        faceToward(p, target.c, target.r);
        try{ playAnim(p, "Attack1"); }catch(_e){}
        let dmg = 4 + Math.floor((p.level||1)/3);
        if(target.shield>0){ const a=Math.min(target.shield, dmg); target.shield-=a; dmg-=a; }
        if(dmg) dmg = rlErode(target, dmg);
        target.pv = Math.max(0, target.pv - dmg);
        target.flash = performance.now()+160;
        rlFloat(target, "-"+dmg, p.side==="a" ? "#EA7020" : "#8A3030");
        try{ startReaction(target, target.pv<=0 ? "ko" : "flinch", { ko: target.pv<=0, faceDir: reactionFace(target, p) }); }catch(_e){}
        if(target.pv<=0){
          target.alive = false;
          if(target===G.player){ onCombatEnd("defeat"); return; }
          if(target===G.enemy){
            if(G.rl) G.rl.kills = (G.rl.kills|0)+1;
            if(!rlPromote()){ onCombatEnd("win"); return; }
          }
        }
      }
      setTimeout(()=>{
        if(p.alive && (p.anim==="Walk" || p.anim==="Attack1")){ try{ playAnim(p, "Idle"); }catch(_e){} }
        step();
      }, visual);
    };
    step();
  }

  function rlInstallSpell(sp){
    if(!sp || !sp.id) return;
    if(!SPELLS.some(s=>s.id===sp.id)){
      SPELLS.push({
        id:sp.id, name:sp.name, cost:sp.cost|0||2, range:sp.range|0, aoe:sp.aoe|0,
        dmg:sp.dmg||null, heal:sp.heal||null, anim:sp.anim||"Attack1",
        type:sp.type||"damage", effect:sp.effect||"", element:sp.element||"neutre",
        overlay:sp.overlay||null, push:sp.push|0,
      });

  function rlApply(payload){
    G.roguelite = payload;

    G.roster = [];

    (payload.allies||[]).forEach(f=>(f.spells||[]).forEach(rlInstallSpell));
    G.player.pv = p.pv; G.player.pvMax = p.pvMax;

    G.player.layers = G.player.gearLayers;
    G.rogueliteBar = rlBar(p.spells);
