      setStatus("Map "+GRID+" · vs "+G.enemy.name+" ("+enSp+")"+customSpellStatus());
    }

    /* Débloquer si session précédente bloquée sur victoire/évo */
    if(G.turn==="over" || G.awaitingNext){
      setTimeout(()=> forceRestartCombat(), 300);
    }

    const pointers = new Map();
    let pinch = null;
    canvas.addEventListener("pointerdown", (e)=>{
      try{ canvas.setPointerCapture(e.pointerId); }catch(_e){}
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY, moved:false });
      if(pointers.size===2){
        const pts=[...pointers.values()];
        pinch = { dist:Math.max(8, Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)), sc:cam.sc };
      }
    });
    canvas.addEventListener("pointermove", (e)=>{
      const prev = pointers.get(e.pointerId);
      if(!prev) return;
      const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
      if(Math.abs(dx)+Math.abs(dy)>6) prev.moved = true;
      prev.x=e.clientX; prev.y=e.clientY;
      if(pointers.size>=2 && pinch){
        const pts=[...pointers.values()];
        const d=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
        cam.userSc = Math.max(0.55, Math.min(2.6, pinch.sc * (d / pinch.dist)));
        cam.sc = cam.userSc;
      } else if(pointers.size===1 && prev.moved){
        cam.panX = (cam.panX||0) + dx;
        cam.panY = (cam.panY||0) + dy;
      }
    });
    canvas.addEventListener("pointerup", (e)=>{
      const prev = pointers.get(e.pointerId);
      pointers.delete(e.pointerId);
      if(pointers.size<2) pinch = null;
      if(prev && !prev.moved && pointers.size===0) onTap(e);
    });
    canvas.addEventListener("mousemove", (e)=>{
      const {x,y}=pointer(e); const t=toTile(x,y);
      G.hover = inBounds(t.c,t.r) ? t : null;
      if(G.armed) recomputeTargets();
    });
    el("btnEnd").onclick=endTurn;
    const btnFlee = el("btnFlee");
    if(btnFlee){
      btnFlee.addEventListener("click", ()=>{
        if(!G.roguelite || G.turn!=="player") return;
        const pay = G.roguelite;
        if(!(pay.gold>0) && !(pay.fleeCharges>0)){ setStatus("Pas de quoi fuir"); return; }
        rlFinish("flee");
      });
    }
    const btnRestart=el("btnRestart");
    if(btnRestart){
      btnRestart.addEventListener("click", (e)=>{
        e.preventDefault();
        forceRestartCombat();
      });
    }
    const btnEvo = el("btnEvo");
    if(btnEvo){
      btnEvo.addEventListener("click", (e)=>{
        e.preventDefault();
        /* évolue le sort armé, sinon le 1er de la barre */
        const id = (G.armedSlot && G.armedSlot.spellId) || G.armed || null;
        offerEvo(id, false);
      });
    }
    const evoSkip = el("evoSkip");
    if(evoSkip){
      evoSkip.addEventListener("click", ()=>{
        const wasVictory = G.pendingEvo && G.pendingEvo.fromVictory;
        closeEvo();
        if(wasVictory) startNextFight({ force:true });
        else setStatus("Évo annulée");
      });
    }
    window.addEventListener("resize", fit);
    window.addEventListener("pageshow", (e)=>{
      /* retour créateur (cache) : si le look a changé, relancer un combat */
      if(!e.persisted) return;
      try{ loadLook(); }catch(_e){}
      const sig = lookSig();
      if(sig && sig !== lastLookSig){
        lastLookSig = sig;
        startNextFight({ force:true, keepLook:true });
      }
    });
    loop();
  }
  boot().catch((err)=>{
    try{ importCustomSpellsFromHash(); }catch(_e){}
    try{ if(!lookState.look) defaultLook(); }catch(_e){}
    try{
      G.awaitingNext=false; G.pendingEvo=null; G.busy=false;
      G.fightN = 1;
      G.enemy = makeEnemy(1);
      try{ warmFolders((G.enemy.layers||[]).map(L=>L.folder), { mounted: !!G.enemy.mount }); }catch(_e){}
      try{ playAnim(G.player, "Idle"); }catch(_e){}
      try{ playAnim(G.enemy, "Idle"); }catch(_e){}
      G.turn = "player";
      beginPlayerTurn();
      renderSpells(); hud();
      loop();
      setStatus("Combat relancé"+customSpellStatus());
    }catch(_e){
      try{ setStatus("Erreur combat · touche Relancer"); forceRestartCombat(); loop(); }catch(_e2){}
    }
  });
})();
</script>
<script>
(function(){
  var KEY="roguelite.theme";
  var sun="<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='2.6' fill='currentColor'/><path stroke='currentColor' stroke-width='1.5' d='M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4'/></svg>";
  var moon="<svg viewBox='0 0 16 16' aria-hidden='true'><path fill='currentColor' d='M9.2 1.6a5.6 5.6 0 1 0 5.2 7.6 4.6 4.6 0 0 1-5.2-7.6z'/></svg>";
  function apply(){
    var dark=false;
    try{ dark=localStorage.getItem(KEY)==="dark"; }catch(e){}
    document.documentElement.classList.toggle("dark", dark);
    var b=document.getElementById("themeBtn");
    if(b) b.innerHTML= dark ? sun : moon;
  }
  function wire(){
    apply();
    var b=document.getElementById("themeBtn");
    if(!b || b.dataset.wired) return;
    b.dataset.wired="1";
    b.addEventListener("click", function(){
      var next=document.documentElement.classList.contains("dark") ? "light" : "dark";
      try{ localStorage.setItem(KEY, next); }catch(e){}
      apply();
    });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>
</body>
