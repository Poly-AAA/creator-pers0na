<title>Combat Fantasy</title>
<style>
/* Variante D — Minimal. Fond clair, orange plein, aucune bordure décorative. */
@import url("https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Kufi+Arabic:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap");

:root{
  --bg:#FAF7F0;
  --panel:#FFFFFF;
  --ink:#2F3133;
  --ink2:#8A8278;
  --acc:#EA7020;
  --acc2:#F4B07A;
  --soft:#EFE6D6;
  --onacc:#FFFFFF;
  --line:#E7DFD2;
  --bad:#8A3030;
  --ok:#2F6F4E;
  --shadow:0 1px 0 rgba(47,49,51,.06);
  --glass:rgba(255,255,255,.78);
  --tap:48px;
  --safe-t:env(safe-area-inset-top);
  --safe-b:env(safe-area-inset-bottom);
}
html.dark{
  --bg:#141618;
  --panel:#23272C;
  --ink:#F6F1E8;
  --ink2:#C9BBA8;
  --acc:#EA7020;
  --acc2:#F4B07A;
  --soft:#2C3036;
  --onacc:#FFFFFF;
  --line:#3E444C;
  --bad:#C98A78;
  --ok:#F4B07A;
  --shadow:0 1px 0 rgba(246,241,232,.08);
  --glass:rgba(28,31,35,.78);
}

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body.skin-d{
  font-family:"Pixelify Sans","DotGothic16",ui-sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-y:auto;
}
body.skin-d *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body.skin-d button,body.skin-d a.tap{
  min-height:var(--tap);touch-action:manipulation;
}
.ar{font-family:"Noto Kufi Arabic","Pixelify Sans",sans-serif}
.orient{display:none}
@media (orientation:portrait) and (max-width:900px){
  .orient{
    display:flex;position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);
    align-items:center;justify-content:center;text-align:center;padding:28px;
    font-size:22px;font-weight:700;
  }
}

.hazard{
  height:10px;background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,var(--bg) 8px 16px);
}
.app-hub{
  min-height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;
  padding:var(--safe-t) 0 var(--safe-b);
  background:var(--bg);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px 8px;
}
.topbar h1{margin:0;font-size:22px;letter-spacing:.04em;font-weight:700}
.badge{
  background:var(--acc);color:var(--onacc);padding:6px 10px;font-size:13px;letter-spacing:.08em;
}
.screen{flex:1;padding:6px 14px 18px;display:flex;flex-direction:column;gap:12px}
.kicker{color:var(--ink2);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.panel{background:var(--panel);box-shadow:var(--shadow);padding:12px}
.panel h2{margin:0 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:var(--ink2);font-size:13px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--soft);display:flex;gap:2px}
.bar i{flex:1;background:transparent}
.bar i.on{background:var(--acc)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions button,.tap{
  border:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);
  font:inherit;font-size:16px;text-align:left;padding:12px 14px;width:100%;
  text-decoration:none;display:flex;justify-content:space-between;align-items:center;
}
.actions button.primary,.tap.primary{background:var(--acc);color:var(--onacc)}
.actions button:disabled{opacity:.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{
  background:var(--panel);box-shadow:var(--shadow);padding:10px;min-height:64px;
  border:0;font:inherit;text-align:left;color:var(--ink);width:100%;
}
.slot b{display:block;font-size:14px}
.slot span{color:var(--ink2);font-size:12px}
.load{
  flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 8px;
}
.load h1{margin:0;font-size:42px;letter-spacing:.18em}
.load .track{height:8px;background:var(--soft)}
.load .track i{display:block;height:100%;width:0;background:var(--acc);animation:fill .7s linear forwards}
@keyframes fill{to{width:100%}}
.footer-links{padding:8px 14px 16px;display:flex;gap:10px;flex-wrap:wrap}
.footer-links a{color:var(--ink2);font-size:13px;letter-spacing:.06em}
@media (max-height:740px){
  .topbar{padding:6px 12px 4px}
  .topbar h1{font-size:18px}
  .screen{gap:6px;padding:4px 12px 8px}
  .panel{padding:8px}
  .panel h2{font-size:15px;margin-bottom:4px}
  .statgrid{font-size:13px;gap:2px 10px}
  .muted{font-size:12px}
  .actions{gap:4px}
  .actions button,.tap{min-height:40px;padding:6px 12px;font-size:15px}
  .footer-links{padding:6px 12px 10px}
}
.float-note{font-size:13px;color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px}
.offer{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel);box-shadow:var(--shadow);padding:10px}
.offer button{min-height:44px;border:0;background:var(--acc);color:#fff;font:inherit;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--soft);font:inherit;padding:8px 10px;min-height:44px}
.chips button.on{background:var(--acc);color:#fff}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{display:inline-flex;align-items:center;justify-content:center;color:inherit}
.ico svg,.footer-links svg,#themeBtn svg{width:22px;height:22px;display:block}
.tone-acc{color:var(--acc)}
.tone-soft{color:var(--ink2)}
.top-tools{display:flex;align-items:center;gap:6px}
#themeBtn{
  width:40px;height:40px;min-width:40px;min-height:40px;padding:0;
  border:0;background:transparent;color:var(--ink);box-shadow:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.pill{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px}
.pill svg{width:16px;height:16px}
.meters{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pips i{font-style:normal;font-weight:700;font-size:14px}
.tier.t1{background:var(--soft);color:var(--ink)}
.tier.t2{background:var(--acc2);color:#2F3133}
.tier.t3{background:var(--acc);color:var(--onacc)}
.offer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.offer-grid button,.slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.icon-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.icon-actions button{justify-content:center;text-align:center;padding:6px}
.footer-links a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;text-decoration:none}

@media (orientation:landscape) and (max-height:560px){
  html,body.skin-d{height:100%;overflow:hidden}
  .app-hub{
    max-width:none;height:100dvh;max-height:100dvh;overflow:hidden;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative;
  }
  .hazard{height:6px}
  .topbar{padding:2px 8px;min-height:0}
  .topbar h1{font-size:16px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .screen{min-height:0;overflow:hidden;padding:4px 8px;gap:4px;display:flex;flex-direction:column}
  .screen.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(168px,.75fr);align-content:stretch;gap:6px}
  .screen.load-screen{align-items:center;justify-content:center}
  .panel{padding:6px}
  .panel h2{font-size:14px;margin:0 0 4px}
  .statgrid{grid-template-columns:repeat(4,minmax(0,1fr));font-size:13px;gap:2px 8px}
  .footer-links{padding:2px 8px 4px;flex-wrap:nowrap}
  .actions{gap:4px}
  .icon-actions{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .icon-actions button,.actions button,.tap,.chips button,.offer-grid button{
    min-height:44px;padding:4px;font-size:14px
  }
  .slot{min-height:44px;padding:4px}
  .grid2.slots{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .chips{gap:4px}
  .list{gap:4px}
  .load{padding:4px;gap:8px}
  .load h1{font-size:28px;letter-spacing:.12em}
  .float-note{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;background:var(--acc);color:#fff;padding:4px 8px;display:inline-flex;align-items:center;gap:4px}
}
body.skin-d .app{max-width:none}
body.skin-d .link-cc{border:0;border-radius:0;font-size:12px}

/* Écran : cadres, pastilles, échelle, lueur. Pas de flou. */
:root{
  --phosphor:rgba(234,112,32,.22);
  --frame:#2F3133;
}
html.dark{
  --phosphor:rgba(234,112,32,.8);
  --frame:#EA7020;
}
.crt{
  pointer-events:none;position:fixed;inset:0;z-index:70;
  background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(47,49,51,.05) 3px 4px);
  animation:crt-on .42s steps(2,end) 1;
}
html.dark .crt{
  background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.12) 3px 4px);
  box-shadow:inset 0 0 40px rgba(234,112,32,.16);
}
@keyframes crt-on{0%{opacity:.15}45%{opacity:.7}100%{opacity:1}}
.panel,.glass,.evo-card,.slot,.offer,.offer-grid button,.chips button,.tier,.icon-actions button{
  position:relative;
  border:1px solid var(--frame);
  border-radius:3px;
  box-shadow:0 0 0 1px rgba(234,112,32,.16);
}
html.dark .panel,html.dark .glass,html.dark .evo-card,html.dark .slot,html.dark .offer,
html.dark .offer-grid button,html.dark .chips button,html.dark .tier,html.dark .icon-actions button{
  box-shadow:0 0 6px var(--phosphor);
}
.panel::before,.evo-card::before{
  content:"";position:absolute;inset:3px;border:1px solid var(--frame);border-radius:2px;opacity:.35;pointer-events:none;
}
.badge,.pill,.turn-pip,.clock,.readout,.link-cc{
  border:1px solid var(--frame);border-radius:3px;
  box-shadow:0 0 0 1px rgba(234,112,32,.12);
}
html.dark .badge,html.dark .pill,html.dark .turn-pip,html.dark .clock,html.dark .readout,html.dark .link-cc{
  box-shadow:0 0 6px var(--phosphor);
}
html.dark body.skin-d h1,html.dark .kicker,html.dark .grade,html.dark .clock,html.dark .readout,html.dark .boot{
  text-shadow:0 0 6px var(--phosphor);
}
body.skin-d h1,body.skin-d .kicker,body.skin-d .boot{text-shadow:0 0 1px rgba(234,112,32,.25)}
.icon-actions button,.actions button.tier{border-radius:3px}
.row.mark{gap:6px}
.row.mark>i{
  width:7px;height:7px;flex:none;background:var(--ok);
  box-shadow:0 0 3px rgba(47,111,78,.45);
}
html.dark .row.mark>i{box-shadow:0 0 5px rgba(244,176,122,.8)}
.row.mark.bad>i{background:var(--bad);box-shadow:0 0 4px rgba(138,48,48,.55)}
.slot.mark::after,.chips button.on::after{
  content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;background:var(--ok);
  box-shadow:0 0 3px rgba(47,111,78,.45);pointer-events:none;
}
.slot.mark.bad::after{background:var(--bad);box-shadow:0 0 4px rgba(138,48,48,.55)}
html.dark .slot.mark::after,html.dark .chips button.on::after{box-shadow:0 0 4px rgba(244,176,122,.85)}
.bar{height:8px;gap:3px;background:transparent}
.bar i{border:1px solid var(--line)}
.bar i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 3px var(--phosphor)}
.seg i.on{box-shadow:0 0 3px var(--phosphor)}
.ruler{
  display:flex;justify-content:space-between;align-items:flex-end;
  height:12px;font-size:9px;letter-spacing:0;color:var(--ink2);
  background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 10px);
  background-size:100% 4px;background-repeat:no-repeat;background-position:bottom;
}
.wave{display:block;width:100%;height:28px;color:var(--acc)}
html.dark .wave{filter:none;color:#F4B07A}
.boot{opacity:0;font-size:12px;letter-spacing:.08em;animation:bootline .16s linear forwards}
.boot:nth-child(2){animation-delay:.1s}
.boot:nth-child(3){animation-delay:.2s}
@keyframes bootline{to{opacity:1}}
.readout{font-family:"DotGothic16","Pixelify Sans",sans-serif;font-size:12px;padding:0 4px}
.frame-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px}

<script>
/**
 * Réactions de la cible, sur les feuilles d'origine (TakeDamage, Die, Idle).
 * Elles partent à l'image d'impact et, sauf le K.O., reviennent à l'attente.
 */
(function (root) {
  var IMPACT_MS = 260;
  var BODY_MS = 740;

  var SHEETS = { TakeDamage: true, Die: true, Idle: true };

  /** Quatre directions iso, puis face ou dos. */
  var ISO = [
    { id: "E", dir: 0 },
    { id: "N", dir: 2 },
    { id: "O", dir: 4 },
    { id: "S", dir: 6 },
  ];

  var REACTIONS = {
    flinch: { id: "flinch", label: "Recul léger", sheet: "TakeDamage", kind: "hurt", strength: "light", poseIn: "garde", poseOut: "garde", frames: [0, 1, 2], fps: 16, returnMs: 220, motion: "recoil", recoil: 3 },
    stagger: { id: "stagger", label: "Choc", sheet: "TakeDamage", kind: "hurt", strength: "heavy", poseIn: "garde", poseOut: "garde", frames: [0, 1, 2, 3, 4, 5], fps: 12, returnMs: 420, motion: "recoil", recoil: 7 },
    launch: { id: "launch", label: "Décollage", sheet: "TakeDamage", kind: "hurt", strength: "launch", poseIn: "garde", poseOut: "garde", frames: [2, 3, 4, 5, 6], fps: 12, returnMs: 480, motion: "launch", lift: 16 },
    knockback: { id: "knockback", label: "Poussé", sheet: "TakeDamage", kind: "hurt", strength: "slide", poseIn: "garde", poseOut: "garde", frames: [0, 1, 2, 3, 4], fps: 12, returnMs: 460, motion: "slide", recoil: 8, dust: true },
    burn: { id: "burn", label: "Brûlure", sheet: "TakeDamage", kind: "element", element: "feu", poseIn: "garde", poseOut: "garde", frames: [0, 1, 2], fps: 14, returnMs: 280, motion: "recoil", recoil: 4, flames: true },
    frozen: { id: "frozen", label: "Gel", sheet: "TakeDamage", kind: "element", element: "eau", poseIn: "garde", poseOut: "garde", frames: [1, 2], fps: 8, returnMs: 360, motion: "slow", tint: "eau", slowed: true },
    shock: { id: "shock", label: "Éclair", sheet: "TakeDamage", kind: "element", element: "air", poseIn: "garde", poseOut: "garde", frames: [0, 2, 1, 3, 0], fps: 18, returnMs: 240, motion: "jitter", sparks: true },
    blast: { id: "blast", label: "Souffle", sheet: "TakeDamage", kind: "element", element: "feu", poseIn: "garde", poseOut: "garde", frames: [2, 3, 4, 5, 6], fps: 12, returnMs: 480, motion: "launch", lift: 14, flames: true, dust: true },
    dot: { id: "dot", label: "Tic", sheet: "TakeDamage", kind: "tick", poseIn: "garde", poseOut: "garde", frames: [0, 1], fps: 16, returnMs: 200, motion: "recoil", recoil: 2, tick: true },
    multi: { id: "multi", label: "Surcoup", sheet: "TakeDamage", kind: "hurt", strength: "light", poseIn: "garde", poseOut: "garde", frames: [0, 1, 2], fps: 18, returnMs: 180, motion: "recoil", recoil: 3 },
    buff: { id: "buff", label: "Gain", sheet: "Idle", kind: "buff", poseIn: "garde", poseOut: "garde", frames: [0], fps: 8, returnMs: 400, motion: "lift", lift: 4, glow: "neutre", number: "buff" },
    heal: { id: "heal", label: "Soin", sheet: "Idle", kind: "buff", poseIn: "garde", poseOut: "garde", frames: [0], fps: 8, returnMs: 400, motion: "lift", lift: 5, glow: "heal", number: "heal" },
    shield: { id: "shield", label: "Égide", sheet: "Idle", kind: "buff", poseIn: "garde", poseOut: "garde", frames: [0], fps: 8, returnMs: 400, motion: "lift", lift: 4, glow: "shield", number: "shield" },
    block: { id: "block", label: "Parade", sheet: "TakeDamage", kind: "defense", poseIn: "garde", poseOut: "garde", frames: [0, 1], fps: 14, returnMs: 240, motion: "recoil", recoil: 1 },
    dodge: { id: "dodge", label: "Esquive", sheet: "TakeDamage", kind: "defense", poseIn: "garde", poseOut: "garde", frames: [0, 1, 2], fps: 16, returnMs: 280, motion: "sidestep", recoil: 6 },
    ko: { id: "ko", label: "K.O.", sheet: "Die", kind: "ko", poseIn: "garde", poseOut: "sol", frames: [0, 2, 4, 6, 8, 10, 12, 14], fps: 12, returnMs: 900, motion: "drop", lift: -6, hold: true },
  };

  var GEAR = ["NakedBody", "NakedBody2", "NakedBody3", "Head1", "Chest1", "Legs1", "Shoes1", "Melee1", "Shield1", "Shadow"];

  function copy(obj) {
    var out = {};
    Object.keys(obj || {}).forEach(function (k) { out[k] = obj[k]; });
    if (obj && obj.frames) out.frames = obj.frames.slice();
    return out;
  }

  function get(id) {
    return REACTIONS[id] ? copy(REACTIONS[id]) : null;
  }

  function forSpell(spell) {
    if (!spell) return "flinch";
    var effect = String(spell.effect || "");
    if (spell.heal || spell.type === "heal") return "heal";
    if (spell.type === "shield" || spell.id === "bouclier" || spell.id === "armure_nanites") return "shield";
    if (spell.type === "buff" || effect === "step") return "buff";
    if (effect === "push") return "knockback";
    if (effect === "roulade" || spell.id === "roulade") return "";
    if (spell.type === "damage" || spell.dmg) return "flinch";
    return "buff";
  }

  function compose(id, opts) {
    opts = opts || {};
    if (opts.ko) return get("ko");
    var spec = get(id) || get("flinch");
    var extra = opts.elementFx ? get(opts.elementFx) : null;
    if (extra && extra.kind === "element") {
      spec.flames = spec.flames || extra.flames;
      spec.tint = spec.tint || extra.tint;
      spec.sparks = spec.sparks || extra.sparks;
      spec.slowed = spec.slowed || extra.slowed;
      spec.element = extra.element || spec.element;
      spec.elementFx = extra.id;
    }
    spec.impactMs = IMPACT_MS;
    return spec;
  }

  /** Face : regarde le coup. Dos : le coup arrive dans le dos. */
  function sheetDir(facing, incoming) {
    var inc = incoming & 7;
    if (facing === "front") return (inc + 4) & 7;
    return inc;
  }

  function facingOf(targetDir, incoming) {
    var toward = (incoming + 4) & 7;
    var delta = Math.abs((targetDir & 7) - toward);
    if (delta > 4) delta = 8 - delta;
    return delta <= 1 ? "front" : "back";
  }

  function facingCases() {
    var out = [];
    ISO.forEach(function (iso) {
      ["front", "back"].forEach(function (facing) {
        out.push({
          iso: iso.id,
          incoming: iso.dir,
          facing: facing,
          sheetDir: sheetDir(facing, iso.dir),
        });
      });
    });
    return out;
  }

  function sample(spec, age, dir) {
    var ms = Math.max(1, spec.returnMs || 1);
    var u = Math.max(0, Math.min(1, (age * 1000) / ms));
    var env = spec.poseOut === "garde" ? Math.sin(u * Math.PI) : u;
    var sign = ((dir | 0) & 4) ? -1 : 1;
    var x = 0;
    var y = 0;
    if (spec.motion === "recoil" || spec.motion === "slide" || spec.motion === "sidestep") x = sign * (spec.recoil || 0) * env;
    if (spec.motion === "sidestep") x = sign * (spec.recoil || 0) * env;
    if (spec.motion === "launch") y = -((spec.lift || 0) * env);
    if (spec.motion === "lift") y = -((spec.lift || 0) * env);
    if (spec.motion === "drop") y = -((spec.lift || 0) * u);
    if (spec.motion === "jitter") {
      var j = env * 2;
      x = ((Math.floor(age * 40) % 2) ? 1 : -1) * j;
      y = ((Math.floor(age * 30) % 2) ? 1 : -1) * j * 0.5;
    }
    if (spec.poseOut === "garde" && u >= 1) { x = 0; y = 0; }
    return {
      x: x,
      y: y,
      env: env,
      flames: !!spec.flames && env > 0.05,
      sparks: !!spec.sparks && env > 0.05,
      dust: !!spec.dust && env > 0.05,
      tint: spec.tint || "",
      glow: spec.glow || "",
      slowed: !!spec.slowed,
      hold: !!spec.hold,
    };
  }

  function issues(spec) {
    var bad = [];
    if (!spec) return ["vide"];
    if (!SHEETS[spec.sheet]) bad.push("feuille " + spec.id);

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function pickStable(arr, seed, salt) {
    if (!arr || !arr.length) return null;
    return arr[hashStr(String(seed) + ":" + String(salt)) % arr.length];
  }

  function uniqueStable(pool, seed, count, reserved) {
    const out = [];
    const used = new Set(reserved || []);
    let i = 0;
    let guard = 0;
    while (out.length < count && guard < pool.length * 4) {
      const id = pickStable(pool, seed, "fx" + i);
      i++;
      guard++;
      if (!id || used.has(id)) continue;
      used.add(id);
      out.push(id);
    }
    /* complète si pool trop petit / collisions */
    for (const id of pool) {
      if (out.length >= count) break;
      if (used.has(id)) continue;
      used.add(id);
      out.push(id);
    }
    return out;
  }

        { name: "Pas légers", d: "+1 PM sous voile.", anim: "Attack2", fx: "Effect1", apply: (st) => evoAdd(st, "invisPm", 1) },
        { name: "Économe", d: "-1 PA.", anim: "Idle", fx: null, apply: (st) => evoAdd(st, "cost", -1) },
      ],
      2: [
        { name: "Assassin", d: "+6 dmg sortie voile.", anim: "Attack4", fx: "Slash2", apply: (st) => evoAdd(st, "invisBurst", 6) },
        { name: "Brume", d: "+1 tour.", anim: "Special1", fx: "Effect4", apply: (st) => evoAdd(st, "invisTurns", 1) },
        { name: "Ombre vive", d: "+2 PM sous voile.", anim: "AttackRun", fx: "Effect5", apply: (st) => evoAdd(st, "invisPm", 2) },
      ],
    },
    bouclier: {
      1: [
        { name: "Renfort", d: "+8 soin.", anim: "Special1", fx: "Effect1", apply: (st) => evoAdd(st, "heal", 8) },
        { name: "Économe", d: "-1 PA.", anim: "Attack5", fx: null, apply: (st) => evoAdd(st, "cost", -1) },
        { name: "Durée", d: "+1 tour bouclier.", anim: "Taunt", fx: "Effect2", apply: (st) => evoAdd(st, "shieldTurns", 1) },
      ],
      2: [
        { name: "Égide sacrée", d: "+12 soin.", anim: "Special1", fx: "Effect3", apply: (st) => evoAdd(st, "heal", 12) },
        { name: "Riposte", d: "Thorns 4.", anim: "Attack3", fx: "Slash1", apply: (st) => evoAdd(st, "thorns", 4) },
        { name: "Rempart", d: "+16 bouclier.", anim: "Attack5", fx: "Effect4", apply: (st) => evoAdd(st, "shield", 16) },
      ],
    },
    nanites: {
      1: [
        { name: "Réparation", d: "+6 soin.", anim: "Special1", fx: "Effect1", apply: (st) => evoAdd(st, "heal", 6) },
        { name: "Diffusion", d: "+1 portée.", anim: "Attack3", fx: "Effect2", apply: (st) => evoAdd(st, "range", 1) },
        { name: "Économe", d: "-1 PA.", anim: "Attack1", fx: null, apply: (st) => evoAdd(st, "cost", -1) },
      ],
      2: [
        { name: "Régénération", d: "+12 soin.", anim: "Special1", fx: "Effect3", apply: (st) => evoAdd(st, "heal", 12) },
        { name: "Surcadence", d: "-1 PA, +5 soin.", anim: "Attack5", fx: "Effect4", apply: (st) => { evoAdd(st, "cost", -1); evoAdd(st, "heal", 5); } },
        { name: "Bénédiction", d: "+8 soin, +1 portée.", anim: "Taunt", fx: "Effect5", apply: (st) => { evoAdd(st, "heal", 8); evoAdd(st, "range", 1); } },
      ],
    },
  };
  /* alias → mêmes arbres */
  EVO_TREE.armure_nanites = EVO_TREE.bouclier;
  EVO_TREE.reconstruction = EVO_TREE.nanites;
  EVO_TREE.impact_cinetique = EVO_TREE.punch;
  EVO_TREE.impulsion_emp = EVO_TREE.arc;
  EVO_TREE.bombe_thermique = EVO_TREE.surchauffe;
  EVO_TREE.gravite = EVO_TREE.dash;
  EVO_TREE.parasite = EVO_TREE.monofil;
  /* Coup de pied / Roulade = mêmes paliers mécaniques que Coup brut */
  EVO_TREE.coup_de_pied = { 1: EVO_TREE.punch[1], 2: EVO_TREE.punch[2] };
  EVO_TREE.kick = EVO_TREE.coup_de_pied;
  EVO_TREE.roulade = { 1: EVO_TREE.punch[1], 2: EVO_TREE.punch[2] };

  function evoChoicesFor(spellId, tier) {
    const tree = EVO_TREE[spellId];
    if (!tree || !tree[tier]) return [];
    return decorateEvoChoices(tree[tier].slice(0, EVO_CHOICES_PER_TIER));
  }

  function evoTierCount(spellId) {
    const tree = spellId && EVO_TREE[spellId];
    if (!tree) return EVO_MAX_TIERS;
    return Object.keys(tree).length;
  }

  function nextEvoTier(spellState, spellId) {
    const st = spellState || {};
    const taken = (st.tiersTaken || 0) | 0;
    if (taken >= evoTierCount(spellId)) return null;
    if (taken < EVO_TIER_LEVELS.length) return EVO_TIER_LEVELS[taken];
    return taken + 1;
  }

  const MOUNT_PM = {
    Mount1: 1,
    Mount2: 1,
    Mount3: 2,
    Mount4: 1,
    Mount5: 2,
  };

  function currentMountFolder() {
    try {
      const L = currentLook();
      if (L && L.mount && L.mount !== "None") return L.mount;
    } catch (_e) {}
    return "None";
  }

  function mountPmBonus(folder) {
    const f = folder || currentMountFolder();
    return MOUNT_PM[f] || 0;
  }

  function toRideAnim(anim) {
    if (!anim || anim === "Die" || anim === "TakeDamage") return anim;
    if (anim === "Idle" || anim === "RideIdle") return "RideIdle";
    if (/Walk|Run|Strafe|Crouch|RideRun$/i.test(anim)) return "RideRun";
    if (/AttackRun/i.test(anim)) return "RideRunAttack1";
    if (/Attack|Kick|Special|Taunt/i.test(anim)) return "RideIdleAttack1";
    return anim;
  }

  function lookSeed(look) {
    const L = look || {};
    return [L.head || "", L.body || "", L.chest || "", L.weapon || "", L.offhand || "", L.backpack || "", L.mount || ""].join("|");
  }

  /**
   * Barre de sorts — Coup brut + sorts custom de l’éditeur (slots libres).
   */
  function readCustomSpells() {
    const out = [];
    const tryParse = (raw) => {
      try {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) out.push(...arr);
      } catch (_e) {}
    };
    try {
      if (typeof localStorage !== "undefined" && localStorage.getItem("neuro.customSpells")) {
        tryParse(localStorage.getItem("neuro.customSpells"));
      }
    } catch (_e) {}
    if (!out.length) {
      try {
        if (typeof sessionStorage !== "undefined" && sessionStorage.getItem("neuro.customSpells")) {
          tryParse(sessionStorage.getItem("neuro.customSpells"));
        }
      } catch (_e) {}
    }
    return out;
  }

  /** Les sorts générés pointent vers un arbre existant (evoArchetype). */
  function registerSpellEvoAliases(spells) {
    (spells || []).forEach(function (s) {
      if (!s || !s.id || !s.evoArchetype) return;
      if (!EVO_TREE[s.id] && EVO_TREE[s.evoArchetype]) EVO_TREE[s.id] = EVO_TREE[s.evoArchetype];
    });
  }

  function buildSpellBar(look) {
    const L = look || currentLook();
    const weapon = L.weapon && L.weapon !== "None" ? L.weapon : "None";
    const hasWeapon = weapon !== "None";
    const customs = readCustomSpells().filter(function (s) {
      return s && s.id && s.id !== "punch";
    });
    const coreIds = ["coup_de_pied", "roulade"];
    const cores = [];
    coreIds.forEach(function (id) {
      const found = customs.find(function (s) { return s.id === id; });
      if (found) cores.push(found);
    });
    const equipped = customs.filter(function (s) {
      return s.equipped && coreIds.indexOf(s.id) < 0;
    });
    const pool = cores.concat(equipped);
    customs.forEach(function (s) {
      if (pool.length >= 5) return;
      if (!pool.some(function (p) { return p.id === s.id; })) pool.push(s);
    });
    const picked = pool.slice(0, 5);
    const slots = [
      {
        slot: "weapon",
        label: "Coup brut",
        spellId: "punch",
        anim: hasWeapon ? animForGear("weapon", weapon) : "Attack2",
        source: weapon,
        locked: false,
      },
    ];
    const names = ["kick", "offhand", "hero", "bonusA", "bonusB"];
    for (let i = 0; i < names.length; i++) {
      const s = picked[i];
      if (s) {
        const step0 = s.steps && s.steps[0];
        slots.push({
          slot: names[i],
          label: String(s.name || "Sort").trim().slice(0, 12) || "Sort",
          spellId: s.id,
          anim: (step0 && step0.anim) || s.anim || "Kick",
          source: "custom",
          locked: false,
        });
      } else {
        slots.push({
          slot: names[i],
          label: "—",
          spellId: null,
          anim: null,
          source: null,
          locked: true,
        });
      }
    }
    return slots;
  }

  function isSelfSpellId(spellId) {
    return (
      spellId === "bouclier" ||
      spellId === "armure_nanites" ||
      spellId === "nanites" ||
      spellId === "reconstruction" ||
      spellId === "overclock" ||
      spellId === "invisibilite" ||
      spellId === "double" ||
      spellId === "roulade"
    );
  }

  /** Débloque + équipe le sort lié à l’arme du look (A1 suite). */
  function syncWeaponSpell() {
    const folder = currentWeaponFolder();
    const entry = weaponEntry(folder);
    const spellId = resolveSpellId(entry);
    const Loadout = global.Loadout;
    const State = global.State;
    if (!Loadout || !State) return { folder, spellId, anim: entry.anim, loadout: loadoutForWeapon(folder) };
    try {
      Loadout.unlock(spellId);
      if (!Loadout.isEquipped(spellId) && Loadout.canEquipMore()) Loadout.equip(spellId);
      else if (!Loadout.isEquipped(spellId) && State.equipped && State.equipped.length) {
        State.equipped[0] = spellId;
      }
      State._weaponSpell = spellId;
      State._weaponAnim = entry.anim || "Attack1";
      State._weaponArchetype = entry.archetype;
      State._weaponAttacks = entry.attacks;
    } catch (_e) {}
    return { folder, spellId, anim: entry.anim, loadout: loadoutForWeapon(folder) };
  }

  /**
   * Enrichit les choix d’évo :
   * - garde anim/fx du choix (sinon fallback spectacle index)
   * - tag lisible Efficace / Équilibré / Style
   */
  function decorateEvoChoices(choices) {
    if (!choices || !choices.length) return choices;
    return choices.map((ev, i) => {
      const spectacle = Math.min(3, i + 1);
      const power = Math.max(1, 4 - spectacle);
      const anim = ev.anim || EVO_SPECTACLE_ANIMS[spectacle - 1] || "Attack1";
      const fx = ev.fx !== undefined ? ev.fx : EVO_SPECTACLE_FX[spectacle - 1];
      const style =
        spectacle === 1 ? "Efficace" : spectacle === 2 ? "Équilibré" : "Spectacle";
      const fxLab = fx ? " · FX " + fx : " · sans FX";
      const tag = style + " · " + anim + fxLab;
      const baseApply = ev.apply;
      return Object.assign({}, ev, {
        spectacle,
        power,
        anim,
        fx,
        d: (ev.d || "") + " · " + tag,
        apply(st) {
          if (typeof baseApply === "function") baseApply(st);
          if (!st.evo) st.evo = {};
          st.evo.anim = anim;
          st.evo.fx = fx;
          st.evo.spectacle = spectacle;
        },
      });
    });
  }

  /** Anim sheet fantasy pour un sort (évo > anim équipement > défaut). */
  function evoCatalogKey(tier, name) {
    return String(tier) + ":" + name;
  }

  function splitEvoFx(fx) {
    if (!fx) return { slash: "None", effect: "None" };
    if (/^Slash/i.test(fx)) return { slash: fx, effect: "None" };
    if (/^Effect/i.test(fx)) return { slash: "None", effect: fx };
    return { slash: "None", effect: "None" };
  }

  function defaultEvoConfigEntry(choice) {
    const fx = splitEvoFx(choice.fx);
    return {
      enabled: false,
      anim: choice.anim || "Attack1",
      slash: fx.slash,
      effect: fx.effect,
      fps: 14,
      delay: 0,
    };
  }

  /** Complète evoConfig avec les choix manquants du catalogue EVO_TREE. */
  function treeTiers(tree) {
    return Object.keys(tree || {}).map(function (k) { return Number(k); }).filter(function (n) { return n > 0; }).sort(function (a, b) { return a - b; });
  }

  function ensureEvoConfig(spellId, evoConfig) {
    const tree = EVO_TREE[spellId];
    const out = Object.assign({}, evoConfig || {});
    if (!tree) return out;
    treeTiers(tree).forEach(function (tier) {
      (tree[tier] || []).forEach(function (ch) {
        const k = evoCatalogKey(tier, ch.name);
        if (!out[k]) out[k] = defaultEvoConfigEntry(ch);
        else {
          if (out[k].fps == null) out[k].fps = 14;
          if (out[k].delay == null) out[k].delay = 0;
        }
      });
    });
    return out;
  }

  /** Choix activés dans l’ordre palier 1 → 2. */
  function enabledEvoChoices(spellId, evoConfig) {
    const tree = EVO_TREE[spellId];
    if (!tree || !evoConfig) return [];
    const out = [];
    treeTiers(tree).forEach(function (tier) {
      (tree[tier] || []).forEach(function (ch) {
        const k = evoCatalogKey(tier, ch.name);
        const e = evoConfig[k];
        if (e && e.enabled) out.push({ tier: tier, choice: ch, entry: e });
      });
    });
    return out;
  }

  /** Délai avant + durée complète d’une anim (toutes les frames du sheet). */
  function animStepTiming(step, cols) {
    cols = cols || 15;
    const delay = Math.max(0, step.delay != null ? (step.delay | 0) : 0);
    let fps = step.fps != null ? step.fps : 14;
    if (fps < 1) fps = 14;
    const dur = Math.max(120, Math.round((cols / fps) * 1000));
    return { delay: delay, dur: dur, fps: fps };
  }

  /** Steps pour prévisualisation / chaîne d’anim en combat. */
  function buildEvoAnimSteps(spellId, evoConfig) {
    return enabledEvoChoices(spellId, evoConfig).map(function (item) {
      const ch = item.choice;
      const e = item.entry;
      const step = {
        anim: e.anim || ch.anim || "Attack1",
        delay: e.delay != null ? e.delay : 0,
        fps: e.fps != null ? e.fps : 14,
        slash: e.slash || "None",
        effect: e.effect || "None",
        hitTarget: false,
      };
      const t = animStepTiming(step);
      step.dur = t.dur;
      return step;
    });
  }

  /** Cumule les effets + dernière anim/FX des évolutions activées (mute st). */
  function applyEvoConfig(spellId, evoConfig, st) {
    if (!st) return;
    if (!st.evo) st.evo = {};
    const bonuses = editorEvoBonuses(spellId, evoConfig);
    Object.keys(bonuses).forEach(function (k) {
      st.evo[k] = (st.evo[k] | 0) + (bonuses[k] | 0);
    });
    const enabled = enabledEvoChoices(spellId, evoConfig);
    if (enabled.length) {
      const last = enabled[enabled.length - 1];
      if (last.entry.anim) st.evo.anim = last.entry.anim;
      const slash = last.entry.slash && last.entry.slash !== "None" ? last.entry.slash : null;
      const effect = last.entry.effect && last.entry.effect !== "None" ? last.entry.effect : null;
      st.evo.fx = slash || effect || st.evo.fx || null;
    }
  }

  /** Bonus cumulés sans modifier l’état de combat persisté. */
  function editorEvoBonuses(spellId, evoConfig) {
    const out = {};
    enabledEvoChoices(spellId, evoConfig).forEach(function (item) {
      const fake = { evo: {} };
      try {
        if (typeof item.choice.apply === "function") item.choice.apply(fake);
      } catch (_e) {}
      Object.keys(fake.evo).forEach(function (k) {
        out[k] = (out[k] | 0) + (fake.evo[k] | 0);
      });
    });
    return out;
  }

  function castAnimFor(def, st) {
    if (st && st.evo && st.evo.anim) return st.evo.anim;
    const State = global.State;
    const folder = currentWeaponFolder();
    const entry = weaponEntry(folder);
    if (entry && def && (def.id === entry.spell || (entry.attacks && entry.attacks.indexOf(def.id) >= 0))) {
      return entry.anim || animForGear("weapon", folder);
    }
    if (State && State._weaponSpell === (def && def.id) && State._weaponAnim) return State._weaponAnim;
    if (!def) return "Attack1";
    if (def.id === "punch") return animForGear("weapon", folder);
    if (def.type === "heal" || def.type === "shield" || def.cat === "def" || def.cat === "sup") {
      let off = "None";
      try {
        const raw = localStorage.getItem("neuro.fantasyLook");
        if (raw) {
          const o = JSON.parse(raw);
          if (o && o.look && o.look.offhand) off = o.look.offhand;
        }
      } catch (_e) {}
      return animForGear("offhand", off);
    }
    if (def.range > 2) return "Attack1";
    return "Attack3";
  }

  /** Map anim fantasy → clé Sprite legacy (melee/shoot) pour packs non-fantasy. */
  function toSpriteKey(fantasyAnim) {
    if (!fantasyAnim) return "melee";
    if (/Special|Kick|Attack[456]/i.test(fantasyAnim)) return "melee";
    if (/AttackRun|Attack1/i.test(fantasyAnim)) return "shoot";
    return "melee";
  }

  global.FantasyBridge = {
    SCHOOL_FANTASY,
    SPELL_SKIN,
    ARCHETYPES,
    WEAPON_ARCHETYPE,
    WEAPON_SPELL,
    WEAPON_ANIM_KEY,
    WEAPON_ANIM_VER,
    BAKED_WEAPON_ANIM,
    applySpellSkin,
    archetypeFor,
    loadoutForWeapon,
    attackIdsForWeapon,
    weaponEntry,
    animForGear,
    suggestGearAnim,
    readWeaponAnimMap,
    ensureWeaponAnimMap,
    currentWeaponFolder,
    currentMountFolder,
    mountPmBonus,
    toRideAnim,
    MOUNT_PM,
    currentLook,
    buildSpellBar,
    registerSpellEvoAliases,
    isSelfSpellId,
    OFFHAND_SPELL,
    BACKPACK_SPELL,
    syncWeaponSpell,
    decorateEvoChoices,
    evoChoicesFor,
    evoTierCount,
    nextEvoTier,
    EVO_TREE,
    EVO_MAX_TIERS,
    EVO_CHOICES_PER_TIER,
    evoCatalogKey,
    splitEvoFx,
    defaultEvoConfigEntry,
    ensureEvoConfig,
    enabledEvoChoices,
    buildEvoAnimSteps,
    animStepTiming,
    applyEvoConfig,
    editorEvoBonuses,
    castAnimFor,
    toSpriteKey,
    resolveSpellId,
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>

  let TILE_ORDER = null;
  function ensureTileOrder(){
    if(TILE_ORDER) return TILE_ORDER;
    const order=[];
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) order.push({c,r,sum:c+r});
    order.sort((a,b)=>a.sum-b.sum || a.c-b.c);
    TILE_ORDER = order;
    return TILE_ORDER;
  }
  let lastEnemySig = "";

   * Sheet fantasy-cc : mapping ligne→direction écran (calibrable par action).
   * Face iso : atan2(sx, -sy) avec sx=dc-dr, sy=dc+dr.
   */
  const DIR_LABEL = ["N","NE","E","SE","S","SW","W","NW"];
  let DIR_ROW = DEFAULT_DIR_ROW.slice();
  let DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);
  try{
    const ver = localStorage.getItem(KEY_DIR_VER);
    if(ver === DIR_CAL_VER){
      const raw = localStorage.getItem(KEY_DIR);
      if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length===8) DIR_ROW=a.map(n=>n&7); }
      const sheets = localStorage.getItem(KEY_DIR_SHEETS);
      if(sheets){
        const o=JSON.parse(sheets);
        if(o&&typeof o==="object"){
          for(const k of Object.keys(o)){
            if(Array.isArray(o[k])&&o[k].length===8) DIR_SHEETS[k]=o[k].map(n=>n&7);
          }
        }
      }
    } else {
      /* force calibrage validé (écrase ancien mapping identité) */
      localStorage.setItem(KEY_DIR, JSON.stringify(DEFAULT_DIR_ROW));
      localStorage.setItem(KEY_DIR_SHEETS, JSON.stringify(DEFAULT_DIR_SHEETS));
      localStorage.setItem(KEY_DIR_VER, DIR_CAL_VER);
      DIR_ROW = DEFAULT_DIR_ROW.slice();
      DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);
    }
  }catch(_e){}
  function dirMapForAnim(anim){
    if(anim && DIR_SHEETS[anim]) return DIR_SHEETS[anim];
    /* fallback : famille d’anim */
    if(anim && /^Attack|^Kick|^Special/i.test(anim) && DIR_SHEETS.Attack1) return DIR_SHEETS.Attack1;
    if(anim && /^(Walk|Run|Strafe|Crouch)/i.test(anim) && DIR_SHEETS.Walk) return DIR_SHEETS.Walk;
    return DIR_ROW;
  }
  function sheetRowForDir(dir, anim){
    const m = dirMapForAnim(anim);
    const f=dir&7;
    for(let r=0;r<8;r++) if(m[r]===f) return r;
    return f;
  }
  function dirFromIsoDelta(dc, dr){
    if(!dc && !dr) return null;
    const sx = dc - dr, sy = dc + dr;
    let i = Math.round(Math.atan2(sx, -sy) / (Math.PI/4));
    if(i < 0) i += 8;
    return i & 7;
  }

  function rollEnemySpells(weapon, strategy){
    const roleMap = {
      bruiser:["melee","control"],
      sniper:["ranged","mobility"],
      caster:["aoe","ranged","control"],
      skirmisher:["mobility","melee","ranged"],
      controller:["control","aoe"],
      assassin:["melee","mobility"],
    };
    const userIds = (customSpells||[]).filter(s => s && !isGeneratedSpellRecord(s)).map(s => s.id);
    if(userIds.length){
      const out = [];
      const bag = userIds.slice();
      const n = Math.min(3, bag.length);
      while(out.length < n && bag.length){
        out.push(bag.splice(Math.floor(Math.random()*bag.length), 1)[0]);
      }
      if(out.length) return out;
    }
    const gen = generatedIdsFor(roleMap[strategy] || ["melee"]);
    if(gen.length >= 2){
      const out = [];
      const pool = gen.slice();
      const n = 3;
      while(out.length < n && pool.length){
        const id = pickWeighted(pool);
        const at = pool.indexOf(id);
        if(at >= 0) pool.splice(at, 1);
        if(id) out.push(id);
      }
      if(out.length) return out;
    }
    const dmgPool = ENEMY_SPELL_POOL.slice();
    let prefer = dmgPool;
    if(strategy==="sniper" || /^Ranged/i.test(weapon))
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range>=3; });
    else if(strategy==="caster" || /^Magic/i.test(weapon))
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && (s.range>=2 || s.aoe); });
    else if(strategy==="assassin")
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range<=2 && enemySpellDmgAvg(s)>=12; });
    else if(strategy==="bruiser")
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range<=2; });
    if(!prefer.length) prefer = dmgPool;

    const out = [];
    const used = new Set();
    const add = (id)=>{ if(id && !used.has(id) && spellById(id)){ used.add(id); out.push(id); } };

    if(strategy==="controller"){
      add(pick(ENEMY_CTRL_POOL));
      add(pick(ENEMY_CTRL_POOL));
    }
    if(strategy==="skirmisher") add(pick(ENEMY_MOBILE_POOL));
    if(strategy==="bruiser" || strategy==="caster"){
      if(Math.random()<0.55) add(pick(ENEMY_SUPPORT_POOL));
    }
    if(strategy==="assassin" && Math.random()<0.4) add("dash");

    const n = 2 + Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      const avail = prefer.filter(x=>!used.has(x));
      const src = avail.length ? avail : dmgPool.filter(x=>!used.has(x));
      if(!src.length) break;
      add(pick(src));
    }
    if(!out.some(id=>{ const s=spellById(id); return s && s.dmg; }))
      add(pick(prefer) || "punch");
    return out;
  }

      if(/^Ride/i.test(a)) tries.push(a, "RideIdle", "RideRun", "RideIdleAttack1", "RideRunAttack1");
      else if(/^Idle/i.test(a)) tries.push("RideIdle", "RideRun", a);
      else if(/Walk|Run|Strafe|Crouch/i.test(a)) tries.push("RideRun", "RideIdle", a);
      else if(/^(TakeDamage|Die)$/i.test(a)) tries.push(a, "RideIdle");
      else if(isAtk) tries.push(a, "RideIdleAttack1", "RideRunAttack1", "RideIdle", "RideRun");
      else tries.push(a, "RideIdle", "RideRun");
    } else if(isAtk){
      /* Ne PAS retomber sur Idle : sinon corps Attack + stuff Idle = double perso empilé */
      tries.push(a, "Attack1", "Attack2", "Attack3", "Attack4", "Attack5", "Attack6", "Kick", "Special1", "Rolling");
    } else if(/^(TakeDamage|Die)$/i.test(a)){
      /* Pas de fallback Idle : chapeau / tête resteraient en pose debout pendant le hit/mort */
      tries.push(a);
    } else {
      tries.push(a, "Idle");
      if(/Walk|Run/i.test(a)) tries.push("Walk", "Run");
    }
    const seen = new Set();
    for(const t of tries){
      if(!t || seen.has(t)) continue;
      seen.add(t);
      const im = getImg(folder, t);
      if(im) return { im, sheetAnim: t };
    }
    for(const t of tries){ if(t) loadImg(folder, t); }
    return null;
  }

  function warmFolders(folders, opts){
    opts = opts || {};
    /* léger : Idle + moves ; ride complet si monté */
    const anims=["Idle","Walk","Run","TakeDamage","Die"];
    if(opts.mounted) anims.push("RideIdle","RideRun","RideIdleAttack1","RideRunAttack1");
    for(const f of folders){
      if(!f) continue;
      for(const a of anims) loadImg(f, a);
    }
  }

  function makeEnemy(scale){
    scale = scale || 1;
    let tries = 0, look, spells, strategy, name, sig;
    do {
      strategy = pickEnemyStrategy();
      look = rollEnemyLayers(strategy);
      spells = rollEnemySpells(look.weapon, strategy);
      name = pick(ENEMY_NAMES[strategy] || ENEMY_NAMES.bruiser);
      sig = [strategy, look.weapon, name, spells.slice().sort().join(",")].join("|");
      tries++;
    } while(sig === lastEnemySig && tries < 8);
    lastEnemySig = sig;

    const profile = strategyProfile(strategy, spells);
    const basePv = 38 + Math.floor(Math.random()*20) + Math.floor((G.fightN-1)*5);
    const pv = Math.min(110, Math.floor(basePv * scale));
    const spawnSpots = [
      {c:GRID-3, r:Math.floor(GRID/2)-1},
      {c:GRID-3, r:Math.floor(GRID/2)+1},
      {c:GRID-4, r:2},
      {c:GRID-4, r:GRID-3},
      {c:GRID-2, r:Math.floor(GRID/2)},
    ];
    const spot = pick(spawnSpots);
    return {
      c: spot.c, r: Math.max(0, Math.min(GRID-1, spot.r)), dir:7,
      pv, pvMax:pv,
      pa:4, paMax:4 + Math.min(2, Math.floor((G.fightN-1)/2)),
      pm: (strategy==="skirmisher" || strategy==="sniper" ? 5 : 4) + (look.mount ? 1 : 0),
      pmMax: (strategy==="skirmisher" || strategy==="sniper" ? 5 : 4) + (look.mount ? 1 : 0),
      anim:"Idle", frame:0, t0:0, flash:0, alive:true,
      name, strategy, profile,
      layers: look.layers,
      spells,
      weaponAnim: look.weaponAnim,
      mount: look.mount || null,
      _stunned:false,
      lastSeen: null,
      shield:0
    };
  }

  function startNextFight(opts){
    opts = opts || {};
    if(G.awaitingNext && !opts.force) return;
    G.awaitingNext = false;
    try{ closeEvo(); }catch(_e){}
    try{ if(!opts.keepLook) loadLook(); }catch(_e){}
    lastLookSig = lookSig();
    G.clone = null;
    G.busy = false;
    G.armed = null; G.armedSlot = null;
    G.castFx = null;
    G.combo = Math.max(0, Math.floor(G.combo * 0.35));
    if(!opts.keepFightN) G.fightN = (G.fightN|0) + 1;

    /* joueur : soin partiel + reset PA/PM, reste en vie */
    const p = G.player;
    p.alive = true;
    if(p.anim==="Die") playAnim(p,"Idle");
    const heal = opts.fullHeal ? p.pvMax : Math.max(12, Math.floor(p.pvMax*0.35));
    p.pv = Math.min(p.pvMax, Math.max(p.pv, 1) + (opts.fullHeal ? p.pvMax : heal));
    if(opts.fullHeal) p.pv = p.pvMax;
    p.shield = 0;
    p.invis = 0;
    p.c = 2; p.r = Math.floor(GRID/2); p.dir = 3;
    cam.fx = p.c; cam.fy = p.r;
    p.pmMax = playerBasePm();
    playAnim(p, "Idle");

    try{ G.enemy = makeEnemy(1); }catch(_e){
      G.enemy = { c:GRID-3, r:Math.max(1,Math.floor(GRID/2)-1), dir:7, pv:55, pvMax:55, pa:4, paMax:4, pm:4, pmMax:4, anim:"Idle", frame:0, t0:0, flash:0, alive:true, name:"Bandit", strategy:"bruiser", profile:strategyProfile("bruiser",["punch"]), layers:[{folder:"NakedBody",tint:"#8a6060",alpha:1},{folder:"Head3",tint:null,alpha:1},{folder:"Melee2",tint:null,alpha:1}], spells:["punch","monofil"], weaponAnim:"Attack1", shield:0 };
    }
    try{
      warmFolders((G.enemy.layers||[]).map(L=>L.folder), { mounted: !!G.enemy.mount });
      const atk = (G.enemy.spells||[]).map(spellById).filter(Boolean).map(s=>s.anim||G.enemy.weaponAnim).filter(Boolean);
      for(const a of new Set(atk.concat([G.enemy.weaponAnim||"Attack1"]))){
        for(const L of (G.enemy.layers||[])) loadImg(L.folder, a);
      }
    }catch(_e){}
    /* Force RideIdle dès le spawn si monté (sinon Idle vide = monture invisible) */
    try{ playAnim(G.enemy, "Idle"); }catch(_e){}
    const spellNames = (G.enemy.spells||[]).map(id=>{ const s=spellById(id); return s?s.name:id; }).join(" · ");
    const sty = (G.enemy.profile && G.enemy.profile.label) || G.enemy.strategy || "?";
    const mountBit = G.enemy.mount ? " · monté" : "";
    setStatus("Combat "+G.fightN+" · "+G.enemy.name+" ("+sty+mountBit+") · "+spellNames);
    G.turn = "player";
    beginPlayerTurn();
  }

  function onCombatEnd(kind){

      host.innerHTML = "";

  function lookSig(){
    try{ return JSON.stringify(lookState.look||{})+"|"+(lookState.bodies||[]).map(b=>b&&b.folder).join(","); }
    catch(_e){ return ""; }
  }
  let lastLookSig = "";
  function applyLookPayload(o){
    if(!o || !o.look) return false;
    lookState.look = o.look;
    if(o.colors) lookState.colors = Object.assign({}, DEFAULT_COLORS, o.colors);
    else lookState.colors = Object.assign({}, DEFAULT_COLORS);
    if(o.bodies && o.bodies.length) lookState.bodies = o.bodies;
    else if(o.look.body) lookState.bodies = [{folder:o.look.body, opacity:1, color:lookState.colors.body}];
    return true;
  }
  function loadLookFromHash(){
    try{
      const h = (location.hash||"").replace(/^#/,"");
      if(!h) return false;
      const parts = h.split("&");
      let packed = null;
      for(const p of parts){
        if(p.indexOf("fccLook=")===0) packed = p.slice(8);
      }
      if(!packed) return false;
      const o = JSON.parse(decodeURIComponent(packed));
      if(!applyLookPayload(o)) return false;
      try{ localStorage.setItem(KEY_LOOK, JSON.stringify(o)); }catch(_e){}
      try{ history.replaceState(null, "", location.pathname + location.search); }catch(_e){}
      return true;
    }catch(_e){ return false; }
  }
  function loadLook(){
    if(loadLookFromHash()) return true;
    try{
      const raw = localStorage.getItem(KEY_LOOK);
      if(!raw) return false;
      const o = JSON.parse(raw);
      return applyLookPayload(o);
    }catch(_e){ return false; }
  }
  function defaultLook(){
    lookState.look = {
      body:"NakedBody", chest:"Chest1", legs:"Legs1", shoes:"Shoes1",
      head:"Head1", weapon:"Melee1", offhand:"Shield1",
      belt:"None", gloves:"None", backpack:"None", slash:"None", effect:"None", mount:"None"
    };

  function folder(id){

    const v = lookState.look && lookState.look[id];
    return (!v || v==="None") ? null : v;

  function tint(id){
