<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<script>try{if(localStorage.getItem("roguelite.theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
<title>Combat Fantasy</title>
<link rel="stylesheet" href="css/skin-d.css">
<script src="js/fantasy-combat-bridge.js"></script>
<style>
  :root{ --tap:48px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.25 "Pixelify Sans","DotGothic16",sans-serif;overflow:hidden;overscroll-behavior:none}
  .orient{
    display:none;position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);
    align-items:center;justify-content:center;text-align:center;padding:28px;font-size:22px;font-weight:700;
  }
  @media (orientation:portrait) and (max-width:900px){
    .orient{display:flex}
  }
  .app{
    position:relative;height:100%;height:100dvh;width:100%;max-width:none;margin:0;
    overflow:hidden;background:#C4B49A;min-height:0;
  }
  html.dark .app{background:#1C1F23}
  canvas#arena{
    position:absolute;inset:0;width:100%;height:100%;z-index:0;
    touch-action:none;image-rendering:pixelated;
  }
  .hazard{
    position:absolute;top:0;left:0;right:0;height:6px;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(-45deg,var(--acc) 0 8px,transparent 8px 16px);
  }
  .float-hud{position:absolute;inset:0;z-index:2;pointer-events:none}
  .glass{
    background:var(--glass);color:var(--ink);
    box-shadow:0 0 0 1px var(--line);
  }
  .hud-top{
    pointer-events:auto;
    position:absolute;
    top:max(6px, env(safe-area-inset-top));
    left:max(48px, calc(env(safe-area-inset-left) + 44px));
    right:max(6px, env(safe-area-inset-right));
    display:flex;align-items:center;gap:4px;
    padding:3px 4px;min-height:36px;max-height:44px;overflow:hidden;
  }
  .turn-pip{
    flex:none;background:var(--acc);color:var(--onacc);
    min-width:28px;text-align:center;font-weight:700;font-size:13px;padding:2px 4px;
  }
  #turnOrder{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
  .ord{
    display:flex;gap:4px;align-items:center;border:2px solid var(--ink);
    padding:1px 4px;font-size:11px;font-weight:700;background:var(--glass);max-width:92px;
  }
  .ord.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .ord b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mono{font-family:"DotGothic16","Pixelify Sans",sans-serif;font-size:12px}
  .timer,.style{display:flex;align-items:center;gap:3px;flex:none}
  .timer .seg{width:36px}
  .clock{font-size:16px;color:var(--acc);font-weight:700;line-height:1}
  .grade{font-size:20px;color:var(--acc);font-weight:700;line-height:1}
  .link-cc{
    pointer-events:auto;text-decoration:none;color:var(--ink);background:var(--glass);
    width:36px;height:36px;min-width:36px;min-height:36px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;flex:none;
  }
  .link-cc svg,#themeBtn svg,.btn-end svg,#btnFlee svg,#btnChat svg{width:18px;height:18px;display:block}
  #themeBtn{
    pointer-events:auto;width:36px;height:36px;min-width:36px;min-height:36px;padding:0;flex:none;
    border:0;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;
  }
  .dpad-slot{
    pointer-events:none;
    position:absolute;
    left:max(4px, env(safe-area-inset-left));
    bottom:112px;
    width:clamp(156px, 40vh, 188px);
    height:clamp(156px, 40vh, 188px);
  }
  .dpad{position:relative;width:100%;height:100%}
  body.skin-d .dpad button{
    pointer-events:auto;position:absolute;
    width:30%;height:30%;min-width:44px;min-height:44px;
    border:2px solid var(--ink);border-radius:0;background:var(--glass);color:var(--ink);
    font:700 22px/1 "Pixelify Sans",sans-serif;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:none;transform:none;margin:0;
  }
  body.skin-d .dpad .u{top:0;right:0;left:auto;bottom:auto}
  body.skin-d .dpad .r{bottom:0;right:0;top:auto;left:auto}
  body.skin-d .dpad .d{bottom:0;left:0;top:auto;right:auto}
  body.skin-d .dpad .l{top:0;left:0;right:auto;bottom:auto}
  body.skin-d .dpad .c{
    top:50%;left:50%;right:auto;bottom:auto;
    width:26%;height:26%;min-width:44px;min-height:44px;
    transform:translate(-50%,-50%);
    background:var(--acc);color:var(--onacc);border-color:var(--acc);
  }
  .dpad button:active,.dpad button.on{background:var(--acc);color:#fff}
  .dpad .u .glyph{transform:rotate(45deg)}
  .dpad .r .glyph{transform:rotate(135deg)}
  .dpad .d .glyph{transform:rotate(-135deg)}
  .dpad .l .glyph{transform:rotate(-45deg)}
  .dpad .glyph{display:block;line-height:1}
  .dock{
    pointer-events:none;
    position:absolute;
    left:max(4px, env(safe-area-inset-left));
    right:max(4px, env(safe-area-inset-right));
    bottom:max(4px, env(safe-area-inset-bottom));
    display:flex;gap:4px;align-items:stretch;max-height:96px;
  }
  .vitals,.spells-box,.endbox{pointer-events:auto;padding:4px;min-width:0}
  .vitals{flex:0 0 132px;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .vitals .who{display:flex;justify-content:space-between;gap:4px;font-size:11px;font-weight:700}
  .vitals .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter{margin:0}
  .meter .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;gap:4px}
  .meter .row svg{width:14px;height:14px}
  .meter .row b{color:var(--acc)}
  .seg{display:flex;gap:1px;height:6px}
  .seg i{flex:1;background:transparent;border:1px solid var(--line)}
  .seg i.on{background:var(--acc);border-color:var(--acc)}
  .spells-box{flex:1 1 auto;display:flex;align-items:stretch}
  .spells{display:flex;gap:3px;min-width:0;width:100%}
  body.skin-d .spells button{
    flex:1 1 0;min-width:0;min-height:44px;height:auto;border:2px solid var(--ink);border-radius:0;
    background:var(--glass);color:var(--ink);font:inherit;padding:2px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  }
  .spells button small{font-size:11px;color:var(--ink2);font-weight:700;line-height:1}
  .spells button em{font-style:normal;font-size:12px;font-weight:700;color:var(--acc);line-height:1}
  .spells button b{font-size:16px;font-weight:700;line-height:1}
  .spells button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .spells button.on small,.spells button.on em,.spells button.on b{color:#fff}
  .spells button.el-feu b{color:var(--acc)}
  .spells button.el-air b{color:var(--acc2)}
  .spells button.el-terre b{color:var(--ink2)}
  .spells button:disabled{opacity:.45}
  .status{
    position:absolute;left:50%;top:52px;transform:translateX(-50%);
    max-width:34vw;font-size:11px;color:var(--ink);background:var(--glass);
    padding:2px 6px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sync-hex{
    position:absolute;right:max(8px, env(safe-area-inset-right));bottom:108px;
    display:flex;flex-direction:column;align-items:center;pointer-events:none;
  }
  .sync-hex .hex{
    width:28px;height:28px;border:2px solid var(--acc);
    clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background:var(--glass);display:flex;align-items:center;justify-content:center;
  }
  .sync-hex .hex i{width:8px;height:8px;background:var(--acc);display:block}
  .sync-hex .ar{font-size:11px;color:var(--ink2);margin-top:0}
  .endbox{flex:0 0 92px;display:flex;flex-direction:column;gap:3px;justify-content:center}
  body.skin-d .btn-end{
    position:relative;min-height:36px;height:36px;border:0;border-radius:0;background:var(--acc);color:#fff;
    font:700 14px/1 "Pixelify Sans",sans-serif;cursor:pointer;width:100%;padding:0;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-end:disabled{opacity:.4}
  .end-row{display:flex;gap:3px}
  body.skin-d #btnFlee,body.skin-d #btnChat{
    flex:1;min-height:32px;height:32px;border:2px solid var(--ink);background:var(--glass);color:var(--ink);
    padding:0;display:flex;align-items:center;justify-content:center;
  }
  #btnFlee{display:none}
  #btnChat{border-style:dashed;color:var(--ink2);border-color:var(--ink2)}
  .chip.low b{color:var(--acc2)}
  .chip.zero b{color:var(--bad)}
  .combo{height:6px;width:28px;background:var(--soft)}
  .combo > i{display:block;height:100%;width:0%;background:var(--acc)}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .evo-ov{
    position:fixed;inset:0;z-index:40;background:rgba(250,247,240,.92);
    display:none;align-items:flex-end;justify-content:center;padding:12px;
  }
  html.dark .evo-ov{background:rgba(20,22,24,.92)}
  .evo-ov.on{display:flex}
  .evo-card{width:min(520px, 100%);background:var(--panel);padding:14px;box-shadow:0 0 0 1px var(--line);color:var(--ink)}
  .evo-card h2{margin:0 0 4px;font-size:16px}
  .evo-card .sub{margin:0 0 10px;font-size:12px;color:var(--ink2)}
  .evo-opts{display:flex;flex-direction:column;gap:8px}
  .evo-opts button{text-align:left;border:2px solid var(--ink);background:var(--panel);padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
  .evo-opts button b{display:block;font-size:14px;margin-bottom:2px}
  .evo-opts button span{font-size:12px;color:var(--ink2)}
  @media (max-height:400px){
    .dpad-slot{bottom:106px;width:168px;height:168px}
    .dock{max-height:90px}
    .vitals{flex-basis:120px}
    .sync-hex{bottom:102px}
  }
</style>
</head>
<body class="skin-d">
<div class="orient" aria-label="Paysage"><svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><rect x="26" y="8" width="18" height="34" fill="none" stroke="currentColor" stroke-width="3"/><path d="M10 44c10 12 34 12 44 0" fill="none" stroke="#EA7020" stroke-width="3"/><path d="M50 40l6 6-8 1z" fill="#EA7020"/></svg></div>
<div class="app">
  <canvas id="arena" width="640" height="360" aria-label="Arène isométrique"></canvas>
  <div class="hazard" aria-hidden="true"></div>
  <div class="float-hud">
    <header class="glass hud-top">
      <b class="turn-pip" id="hudTurn">01</b>
      <div id="turnOrder" aria-label="Ordre du tour"></div>
      <div class="timer" aria-label="Temps du tour">

      </div>
      <button type="button" id="themeBtn" aria-label="Thème"></button>

      <a class="link-cc" href="#" id="btnRestart" title="Relancer un combat" aria-label="Relancer"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M13 8a5 5 0 1 1-1.4-3.4"/><path fill="currentColor" d="M12 1.5V5h-3.4z"/></svg></a>
      <a class="link-cc" data-fcc="spell" href="spell-editor.html" aria-label="Sorts"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1l1.6 4.6L14 7l-4.4 1.4L8 13l-1.6-4.6L2 7l4.4-1.4z"/></svg></a>

    <div class="dock">
      <section class="glass vitals" aria-label="Points de vie">
        <div class="who"><b id="hudWho"></b><span class="mono" id="hudSync">1</span></div>

          <div class="row"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 13.4S2.4 9.4 2.4 6.2A2.8 2.8 0 0 1 8 4.8 2.8 2.8 0 0 1 13.6 6.2C13.6 9.4 8 13.4 8 13.4z"/></svg><b id="hudPv">—</b></div>
          <div class="seg" id="barPv"></div>

        <div class="meter" id="chipPa">
          <div class="row"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9 1L4 9h3l-1 6 6-8H9l1-6z"/></svg><b id="hudPa">—</b></div>
          <div class="seg" id="barPa"></div>

        <div class="meter" id="chipPm">
          <div class="row"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 9l2-5h4l1 3h3v2l1 4H3V9z"/></svg><b id="hudPm">—</b></div>

    <div class="evo-opts" id="evoOpts"></div>
    <button type="button" class="btn-end" id="evoSkip" aria-label="Passer" style="margin-top:12px;width:100%"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 2l6 6-6 6V10H1V6h5V2z"/></svg></button>

<script>
(function(){
  "use strict";
  function wireFccNav(){
    const nav=Object.assign({}, window.FCC_NAV||{});
    try{
      const stored=JSON.parse(localStorage.getItem("neuro.fccNav")||"{}");
      Object.keys(stored).forEach(k=>{ if(!nav[k]) nav[k]=stored[k]; });
    }catch(_e){}
    document.querySelectorAll("[data-fcc]").forEach(el=>{
      const k=el.getAttribute("data-fcc");
      if(nav[k]) el.href=nav[k];
      else if(el.href && /^https?:\/\//.test(el.href)) nav[k]=el.href;
    });
    try{ localStorage.setItem("neuro.fccNav", JSON.stringify(nav)); }catch(_e){}
    return nav;
  }
  wireFccNav();

  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@main/assets/packs/fantasy-cc/";
  const FW=128, FH=128, COLS=15, FPS=14;
  const KEY_LOOK = "neuro.fantasyLook";
  const KEY_DIR = "neuro.fantasyDirRow";
  const KEY_DIR_SHEETS = "neuro.fantasyDirRow.sheets";
  const KEY_DIR_VER = "neuro.fantasyDirRow.ver";
  const DIR_CAL_VER = "cal-2026-08-12";
  /* Calibrage utilisateur : ligne sheet → face écran (0=N…7=NW) */
  const DEFAULT_DIR_ROW = [2,3,4,5,6,7,0,1];
  const DEFAULT_DIR_SHEETS = {
    Walk:DEFAULT_DIR_ROW.slice(), Run:DEFAULT_DIR_ROW.slice(),
    RunBackwards:DEFAULT_DIR_ROW.slice(), StrafeLeft:DEFAULT_DIR_ROW.slice(),
    StrafeRight:DEFAULT_DIR_ROW.slice(), CrouchRun:DEFAULT_DIR_ROW.slice(),
    Attack1:DEFAULT_DIR_ROW.slice(), Attack2:DEFAULT_DIR_ROW.slice(),
    Attack3:DEFAULT_DIR_ROW.slice(), Attack4:DEFAULT_DIR_ROW.slice(),
    Attack5:DEFAULT_DIR_ROW.slice(), Attack6:DEFAULT_DIR_ROW.slice(),
    AttackRun:DEFAULT_DIR_ROW.slice(), AttackRun2:DEFAULT_DIR_ROW.slice(),
    Kick:DEFAULT_DIR_ROW.slice(), Special1:DEFAULT_DIR_ROW.slice(),
    Idle:DEFAULT_DIR_ROW.slice()
  };

  /* Iso Neuro : +c = SE écran, +r = SW écran — map + caméra qui suit */
  const GRID = 10;
  const TILE_W = 56, TILE_H = 28;
  const VIEW_TILES = 8; /* ~tuiles visibles en largeur */
  const cam = { ox:0, oy:0, sc:1, fx:2, fy:5, smooth:0.22, _w:0, _h:0 };
  let TILE_ORDER = null;
  function ensureTileOrder(){
    if(TILE_ORDER) return TILE_ORDER;
    const order=[];
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) order.push({c,r,sum:c+r});
    order.sort((a,b)=>a.sum-b.sum || a.c-b.c);
    TILE_ORDER = order;
    return TILE_ORDER;
  }
  let lastEnemySig = "";

  /*
   * Sheet fantasy-cc : mapping ligne→direction écran (calibrable par action).
   * Face iso : atan2(sx, -sy) avec sx=dc-dr, sy=dc+dr.
   */
  const DIR_LABEL = ["N","NE","E","SE","S","SW","W","NW"];
  let DIR_ROW = DEFAULT_DIR_ROW.slice();
  let DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);
  try{
    const ver = localStorage.getItem(KEY_DIR_VER);
    if(ver === DIR_CAL_VER){
      const raw = localStorage.getItem(KEY_DIR);
      if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length===8) DIR_ROW=a.map(n=>n&7); }
      const sheets = localStorage.getItem(KEY_DIR_SHEETS);
      if(sheets){
        const o=JSON.parse(sheets);
        if(o&&typeof o==="object"){
          for(const k of Object.keys(o)){
            if(Array.isArray(o[k])&&o[k].length===8) DIR_SHEETS[k]=o[k].map(n=>n&7);
          }
        }
      }
    } else {
      /* force calibrage validé (écrase ancien mapping identité) */
      localStorage.setItem(KEY_DIR, JSON.stringify(DEFAULT_DIR_ROW));
      localStorage.setItem(KEY_DIR_SHEETS, JSON.stringify(DEFAULT_DIR_SHEETS));
      localStorage.setItem(KEY_DIR_VER, DIR_CAL_VER);
      DIR_ROW = DEFAULT_DIR_ROW.slice();
      DIR_SHEETS = Object.assign({}, DEFAULT_DIR_SHEETS);
    }
  }catch(_e){}
  function dirMapForAnim(anim){
    if(anim && DIR_SHEETS[anim]) return DIR_SHEETS[anim];
    /* fallback : famille d’anim */
    if(anim && /^Attack|^Kick|^Special/i.test(anim) && DIR_SHEETS.Attack1) return DIR_SHEETS.Attack1;
    if(anim && /^(Walk|Run|Strafe|Crouch)/i.test(anim) && DIR_SHEETS.Walk) return DIR_SHEETS.Walk;
    return DIR_ROW;
  }
  function sheetRowForDir(dir, anim){
    const m = dirMapForAnim(anim);
    const f=dir&7;
    for(let r=0;r<8;r++) if(m[r]===f) return r;
    return f;
  }
  function dirFromIsoDelta(dc, dr){
    if(!dc && !dr) return null;
    const sx = dc - dr, sy = dc + dr;
    let i = Math.round(Math.atan2(sx, -sy) / (Math.PI/4));
    if(i < 0) i += 8;
    return i & 7;

      }
      let fps = Number(step.fps);

      let delay=Math.max(0, step.delay|0);
      let dur;
      if(typeof FantasyBridge!=="undefined" && FantasyBridge.animStepTiming){
        const t=FantasyBridge.animStepTiming(Object.assign({}, step, { fps }), COLS);
        delay=t.delay; dur=t.dur||step.dur;
        if(mine()) G.player.stepFps=t.fps;
      } else {
        if(mine()) G.player.stepFps=fps;
        dur=Math.max(120, Math.round((COLS/fps)*1000));
      }
      const hitNow = onHit && (i % stepsPerHit === 0);
      setTimeout(()=>{
        if(hitNow) try{ onHit(Math.floor((i-1)/stepsPerHit)); }catch(_e){}
        next();
      }, delay+dur);
    }
    next();
    return seq;
  }

  let aiPolicy = null;
  function policyWeight(id){

  function pickWeighted(ids){
    if(!ids.length) return null;
    const weights = ids.map(id => Math.max(0.05, policyWeight(id)));
    let sum = 0;
    weights.forEach(w => { sum += w; });
    let r = Math.random() * sum;
    for(let i=0;i<ids.length;i++){
      r -= weights[i];
      if(r <= 0) return ids[i];
    }
    return ids[ids.length-1];
  }

  function rollEnemySpells(weapon, strategy){
    const roleMap = {
      bruiser:["melee","control"],
      sniper:["ranged","mobility"],
      caster:["aoe","ranged","control"],
      skirmisher:["mobility","melee","ranged"],
      controller:["control","aoe"],
      assassin:["melee","mobility"],
    };
    const userIds = (customSpells||[]).filter(s => s && !isGeneratedSpellRecord(s)).map(s => s.id);
    if(userIds.length){
      const out = [];
      const bag = userIds.slice();
      const n = Math.min(3, bag.length);
      while(out.length < n && bag.length){
        out.push(bag.splice(Math.floor(Math.random()*bag.length), 1)[0]);
      }
      if(out.length) return out;
    }
    const gen = generatedIdsFor(roleMap[strategy] || ["melee"]);
    if(gen.length >= 2){
      const out = [];
      const pool = gen.slice();
      const n = 3;
      while(out.length < n && pool.length){
        const id = pickWeighted(pool);
        const at = pool.indexOf(id);
        if(at >= 0) pool.splice(at, 1);
        if(id) out.push(id);
      }
      if(out.length) return out;
    }
    const dmgPool = ENEMY_SPELL_POOL.slice();
    let prefer = dmgPool;
    if(strategy==="sniper" || /^Ranged/i.test(weapon))
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range>=3; });
    else if(strategy==="caster" || /^Magic/i.test(weapon))
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && (s.range>=2 || s.aoe); });
    else if(strategy==="assassin")
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range<=2 && enemySpellDmgAvg(s)>=12; });
    else if(strategy==="bruiser")
      prefer = dmgPool.filter(id=>{ const s=spellById(id); return s && s.range<=2; });
    if(!prefer.length) prefer = dmgPool;

    const out = [];
    const used = new Set();
    const add = (id)=>{ if(id && !used.has(id) && spellById(id)){ used.add(id); out.push(id); } };

    if(strategy==="controller"){
      add(pick(ENEMY_CTRL_POOL));
      add(pick(ENEMY_CTRL_POOL));
    }
    if(strategy==="skirmisher") add(pick(ENEMY_MOBILE_POOL));
    if(strategy==="bruiser" || strategy==="caster"){
      if(Math.random()<0.55) add(pick(ENEMY_SUPPORT_POOL));
    }
    if(strategy==="assassin" && Math.random()<0.4) add("dash");

    const n = 2 + Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      const avail = prefer.filter(x=>!used.has(x));
      const src = avail.length ? avail : dmgPool.filter(x=>!used.has(x));
      if(!src.length) break;
      add(pick(src));
    }
    if(!out.some(id=>{ const s=spellById(id); return s && s.dmg; }))
      add(pick(prefer) || "punch");
    return out;
  }

  function enemySpellDmgAvg(sp){
    if(!sp || !sp.dmg) return 0;
    return (sp.dmg[0]+sp.dmg[1])/2;
  }

  function strategyProfile(strategy, spells){
    const defs = (spells||[]).map(spellById).filter(Boolean);
    const maxR = defs.reduce((m,s)=>Math.max(m, s.range|0), 1);
    const profiles = {
      bruiser:   { preferMin:1, preferMax:1, kiteBelow:0, retreatHp:0.2, supportFirst:true, label:"charge" },
      sniper:    { preferMin:Math.max(3,maxR-1), preferMax:maxR, kiteBelow:2, retreatHp:0.35, supportFirst:false, label:"tire" },
      caster:    { preferMin:2, preferMax:Math.max(3,maxR), kiteBelow:1, retreatHp:0.4, supportFirst:true, label:"incante" },
      skirmisher:{ preferMin:1, preferMax:2, kiteBelow:0, retreatHp:0.45, supportFirst:false, hitAndRun:true, label:"harcèle" },
      controller:{ preferMin:2, preferMax:Math.max(3,maxR), kiteBelow:1, retreatHp:0.3, supportFirst:true, controlFirst:true, label:"contrôle" },
      assassin:  { preferMin:1, preferMax:1, kiteBelow:0, retreatHp:0.25, supportFirst:false, waitForKill:true, label:"frappe" },
    };
    return profiles[strategy] || profiles.bruiser;
  }

  function resolveSheet(folder, anim, mounted){
    const a = anim || "Idle";
    const tries = [];
    const isAtk = /^(Attack|Kick|Special|Taunt|Rolling|Slide)/i.test(a);
    if(mounted && isMountFolder(folder)){
      /* Mount Idle/Walk/TakeDamage/Die sont des PNG vides — toujours préférer Ride* */
      if(/^Ride/i.test(a)) tries.push(a);
      else if(isAtk) tries.push("RideIdleAttack1", "RideRunAttack1", "RideIdle", "RideRun");
      else if(/Walk|Run|Strafe|Crouch/i.test(a)) tries.push("RideRun", "RideIdle");
      else tries.push("RideIdle", "RideRun", "RideIdleAttack1", "RideRunAttack1");
    } else if(mounted){
      /* Cavalier : Idle debout ne doit pas gagner sur RideIdle (sinon monture invisible + pose à pied) */
      if(/^Ride/i.test(a)) tries.push(a, "RideIdle", "RideRun", "RideIdleAttack1", "RideRunAttack1");
      else if(/^Idle/i.test(a)) tries.push("RideIdle", "RideRun", a);
      else if(/Walk|Run|Strafe|Crouch/i.test(a)) tries.push("RideRun", "RideIdle", a);
      else if(/^(TakeDamage|Die)$/i.test(a)) tries.push(a, "RideIdle");
      else if(isAtk) tries.push(a, "RideIdleAttack1", "RideRunAttack1", "RideIdle", "RideRun");
      else tries.push(a, "RideIdle", "RideRun");
    } else if(isAtk){
      /* Ne PAS retomber sur Idle : sinon corps Attack + stuff Idle = double perso empilé */
      tries.push(a, "Attack1", "Attack2", "Attack3", "Attack4", "Attack5", "Attack6", "Kick", "Special1", "Rolling");
    } else if(/^(TakeDamage|Die)$/i.test(a)){
      /* Pas de fallback Idle : chapeau / tête resteraient en pose debout pendant le hit/mort */
      tries.push(a);
    } else {
      tries.push(a, "Idle");
      if(/Walk|Run/i.test(a)) tries.push("Walk", "Run");
    }
    const seen = new Set();
    for(const t of tries){
      if(!t || seen.has(t)) continue;
      seen.add(t);
      const im = getImg(folder, t);
      if(im) return { im, sheetAnim: t };
    }
    for(const t of tries){ if(t) loadImg(folder, t); }
    return null;
  }

  function warmFolders(folders, opts){

  function makeEnemy(scale){
    scale = scale || 1;
    let tries = 0, look, spells, strategy, name, sig;
    do {
      strategy = pickEnemyStrategy();
      look = rollEnemyLayers(strategy);
      spells = rollEnemySpells(look.weapon, strategy);
      name = pick(ENEMY_NAMES[strategy] || ENEMY_NAMES.bruiser);
      sig = [strategy, look.weapon, name, spells.slice().sort().join(",")].join("|");
      tries++;
    } while(sig === lastEnemySig && tries < 8);
    lastEnemySig = sig;

    const profile = strategyProfile(strategy, spells);
    const basePv = 38 + Math.floor(Math.random()*20) + Math.floor((G.fightN-1)*5);
    const pv = Math.min(110, Math.floor(basePv * scale));
    const spawnSpots = [
      {c:GRID-3, r:Math.floor(GRID/2)-1},
      {c:GRID-3, r:Math.floor(GRID/2)+1},
      {c:GRID-4, r:2},
      {c:GRID-4, r:GRID-3},
      {c:GRID-2, r:Math.floor(GRID/2)},
    ];
    const spot = pick(spawnSpots);
    return {
      c: spot.c, r: Math.max(0, Math.min(GRID-1, spot.r)), dir:7,
      pv, pvMax:pv,
      pa:4, paMax:4 + Math.min(2, Math.floor((G.fightN-1)/2)),
      pm: (strategy==="skirmisher" || strategy==="sniper" ? 5 : 4) + (look.mount ? 1 : 0),
      pmMax: (strategy==="skirmisher" || strategy==="sniper" ? 5 : 4) + (look.mount ? 1 : 0),
      anim:"Idle", frame:0, t0:0, flash:0, alive:true,
      name, strategy, profile,
      layers: look.layers,
      spells,
      weaponAnim: look.weaponAnim,
      mount: look.mount || null,
      _stunned:false,
      lastSeen: null,
      shield:0
    };
  }

  function startNextFight(opts){
    opts = opts || {};
    if(G.awaitingNext && !opts.force) return;
    G.awaitingNext = false;
    try{ closeEvo(); }catch(_e){}
    try{ if(!opts.keepLook) loadLook(); }catch(_e){}
    lastLookSig = lookSig();
    G.clone = null;
    G.busy = false;
    G.armed = null; G.armedSlot = null;
    G.castFx = null;
    G.combo = Math.max(0, Math.floor(G.combo * 0.35));
    if(!opts.keepFightN) G.fightN = (G.fightN|0) + 1;

    /* joueur : soin partiel + reset PA/PM, reste en vie */
    const p = G.player;
    p.alive = true;
    if(p.anim==="Die") playAnim(p,"Idle");
    const heal = opts.fullHeal ? p.pvMax : Math.max(12, Math.floor(p.pvMax*0.35));
    p.pv = Math.min(p.pvMax, Math.max(p.pv, 1) + (opts.fullHeal ? p.pvMax : heal));
    if(opts.fullHeal) p.pv = p.pvMax;
    p.shield = 0;
    p.invis = 0;
    p.c = 2; p.r = Math.floor(GRID/2); p.dir = 3;

  function applyLookPayload(o){
    if(!o || !o.look) return false;
    lookState.look = o.look;
    if(o.colors) lookState.colors = Object.assign({}, DEFAULT_COLORS, o.colors);
    else lookState.colors = Object.assign({}, DEFAULT_COLORS);
    if(o.bodies && o.bodies.length) lookState.bodies = o.bodies;
    else if(o.look.body) lookState.bodies = [{folder:o.look.body, opacity:1, color:lookState.colors.body}];

  function loadLookFromHash(){
    try{
      const h = (location.hash||"").replace(/^#/,"");
      if(!h) return false;
      const parts = h.split("&");
      let packed = null;
      for(const p of parts){
        if(p.indexOf("fccLook=")===0) packed = p.slice(8);
      }
      if(!packed) return false;
      const o = JSON.parse(decodeURIComponent(packed));
      if(!applyLookPayload(o)) return false;
      try{ localStorage.setItem(KEY_LOOK, JSON.stringify(o)); }catch(_e){}
      try{ history.replaceState(null, "", location.pathname + location.search); }catch(_e){}
      return true;
    }catch(_e){ return false; }
  }
  function loadLook(){
    if(loadLookFromHash()) return true;
    try{

    }catch(_e){ return false; }

  function loadImg(folderName, anim){
    const key = folderName+"/"+anim;
    if(cache.has(key)) return Promise.resolve(cache.get(key));
    if(cacheP.has(key)) return cacheP.get(key);
    const p = new Promise((resolve)=>{
      const rel = `spritesheets/${folderName}/${anim}.png`;
      const urls = [];
      if(folderName==="Head25"){
        urls.push(`hat-refs/Head25/${anim}.png`);
        urls.push(`assets/packs/fantasy-cc/spritesheets/Head25/${anim}.png`);
      }
      urls.push(BASE_LOCAL+rel, BASE_CDN+rel);
      let i=0, useCors=true;
      const tryOne=()=>{
        if(i>=urls.length){
          if(useCors){ useCors=false; i=0; tryOne(); return; }
          resolve(null); return;
        }
        const im = new Image();
        if(useCors){ try{ im.crossOrigin="anonymous"; }catch(_e){} }
        im.onload=()=>{ cache.set(key, im); resolve(im); };
        im.onerror=()=>{ i++; tryOne(); };
        im.src=urls[i++];
      };
      tryOne();
    });
    cacheP.set(key, p);
    return p;
  }
