<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<title>Combat Fantasy</title>
<script src="js/fantasy-combat-bridge.js"></script>
<style>
  :root{
    --bg:#ecece8; --bg2:#f5f5f2; --ink:#555552; --ink2:#8e8e8a;
    --line:#c6c6c2; --line2:#dcdcd8; --card:#fafaf8; --tap:48px;
    --sel:#3d3d3a; --soft:#f0f0ec;
    --ok:#2f6f4e; --warn:#8a5a2b; --bad:#8a3030;
    --atk:#8a4040; --def:#3d5a7a; --sup:#f5f0e6;
    --tile-a:#e4e4de; --tile-b:#d6d6d0; --arena:#d8ddd4;
    --combo:#5b7c99;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.35 Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
  .app{
    height:100%;height:100dvh;max-width:390px;margin:0 auto;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg2),var(--bg) 55%,#e2e2de);
  }

  /* —— Zone jeu (haut, ~58%) —— */
  .game{
    flex:1.25;min-height:0;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#e8ebe3 0%,var(--arena) 55%,#cfd4c8 100%);
  }
  canvas#arena{position:absolute;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
  .top-chips{
    position:absolute;left:10px;right:10px;top:10px;z-index:4;
    display:flex;gap:6px;justify-content:space-between;align-items:center;
    pointer-events:none;
  }
  .chips{display:flex;gap:6px;pointer-events:none}
  .chip{
    pointer-events:none;min-width:52px;padding:6px 10px;border-radius:10px;
    background:rgba(250,250,248,.92);border:1px solid var(--line);font-size:11px;font-weight:600;
    color:var(--sel);display:flex;gap:6px;align-items:baseline;
  }
  .chip span{color:var(--ink2);font-weight:500;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
  .chip b{font-size:13px}
  .chip.low b{color:var(--warn)}
  .chip.zero b{color:var(--bad)}
  .link-cc{
    pointer-events:auto;text-decoration:none;color:var(--ink2);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
    background:rgba(250,250,248,.9);
  }

  /* —— Bandeau status —— */
  .midbar{
    flex-shrink:0;padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .hint{margin:0;font-size:11px;color:var(--ink2);line-height:1.3;flex:1;min-width:0}
  .btn-end{
    flex-shrink:0;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--ok);
    background:var(--ok);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  }
  .btn-end:disabled{opacity:.4}

  /* —— Panel bas (ergonomie maquette) —— */
  .panel{
    flex:0 0 auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(250,250,248,.97);border-top:1px solid var(--line2);
    border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.05);
    display:flex;flex-direction:column;gap:10px;
  }
  .combo{
    height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line2);overflow:hidden;
  }
  .combo > i{
    display:block;height:100%;width:0%;background:var(--combo);border-radius:inherit;
    transition:width .25s ease;
  }
  .controls{
    display:grid;grid-template-columns:1fr 1.15fr;gap:12px;align-items:center;
  }

  /* Croix iso 45° (comme Neuro) */
  .dpad-wrap{width:132px;height:132px;margin:0 auto;position:relative}
  .dpad{
    width:100%;height:100%;position:relative;
    transform:rotate(45deg);
  }
  .dpad button{
    position:absolute;width:42px;height:42px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--sel);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.06);padding:0;
  }
  .dpad button:active,.dpad button.on{background:var(--sel);color:#fff}
  .dpad .u{top:8px;left:50%;transform:translateX(-50%)}
  .dpad .d{bottom:8px;left:50%;transform:translateX(-50%)}
  .dpad .l{left:8px;top:50%;transform:translateY(-50%)}
  .dpad .r{right:8px;top:50%;transform:translateY(-50%)}
  .dpad .c{
    left:50%;top:50%;transform:translate(-50%,-50%);
    width:36px;height:36px;border-radius:50%;font-size:11px;background:var(--soft);
  }
  .dpad .glyph{transform:rotate(-45deg);display:block;line-height:1}

  .cats{
    display:flex;flex-direction:column;gap:8px;align-items:stretch;
  }
  .cat-row{display:flex;gap:8px;justify-content:space-between}
  .cat{
    flex:1;aspect-ratio:1;max-width:72px;margin:0 auto;width:100%;
    border-radius:50%;border:1.5px solid var(--line);background:var(--card);
    color:var(--ink);font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:6px;line-height:1.15;
  }
  .cat.def{background:#e8eef4;border-color:#b8c6d4;color:var(--def)}
  .cat.sup{background:var(--sup);border-color:#d8d0c4;color:#6a5a48}
  .cat.atk{background:#f3e8e8;border-color:#d4b0b0;color:var(--atk)}
  .cat.on{box-shadow:inset 0 0 0 2px var(--sel);transform:scale(1.04)}
  .spells{
    display:flex;flex-wrap:wrap;gap:6px;min-height:36px;
  }
  .spells button{
    flex:1;min-width:42%;min-height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--soft);color:var(--ink);font-size:11px;cursor:pointer;padding:4px 6px;
  }
  .spells button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  .spells button:disabled{opacity:.4}
  .status{font-size:10px;color:var(--ink2);text-align:center;min-height:1.2em}
</style>
</head>
<body>
<div class="app">
  <section class="game" aria-label="Zone de jeu">
    <div class="top-chips">
      <div class="chips">
        <div class="chip"><span>PV</span><b id="hudPv">—</b></div>
        <div class="chip" id="chipPa"><span>PA</span><b id="hudPa">—</b></div>
        <div class="chip" id="chipPm"><span>PM</span><b id="hudPm">—</b></div>
      </div>
      <div style="display:flex;gap:6px;pointer-events:auto">
        <a class="link-cc" href="fantasy-dir-calibrate.html">Dirs</a>
        <a class="link-cc" href="character-creator-fantasy.html">Créateur</a>
      </div>
    </div>
    <canvas id="arena" width="390" height="480" aria-label="Arène isométrique"></canvas>
  </section>

  <div class="midbar">
    <p class="hint" id="spellHint">Croix = déplacement iso · centre = lancer</p>
    <button type="button" class="btn-end" id="btnEnd">Fin de tour</button>
  </div>

  <section class="panel" aria-label="Commandes">
    <div class="combo" title="Fenêtre combo"><i id="comboFill"></i></div>
    <div class="controls">
      <div class="dpad-wrap">
        <div class="dpad" id="dpad">
          <button type="button" class="u" data-dir="u" aria-label="Iso NE"><span class="glyph">▲</span></button>
          <button type="button" class="l" data-dir="l" aria-label="Iso NW"><span class="glyph">◀</span></button>
          <button type="button" class="c" data-dir="c" aria-label="Lancer"><span class="glyph">●</span></button>
          <button type="button" class="r" data-dir="r" aria-label="Iso SE"><span class="glyph">▶</span></button>
          <button type="button" class="d" data-dir="d" aria-label="Iso SW"><span class="glyph">▼</span></button>
        </div>
      </div>
      <div class="cats">
        <div class="cat-row">
          <button type="button" class="cat def" data-cat="def">Défense</button>
          <button type="button" class="cat sup" data-cat="sup">Soutien</button>
          <button type="button" class="cat atk on" data-cat="atk">Attaque</button>
        </div>
        <div class="spells" id="spellList"></div>
      </div>
    </div>
    <div class="status" id="status">…</div>
  </section>
</div>

<script>
(function(){
  "use strict";
  const BASE_LOCAL = "assets/packs/fantasy-cc/";
  const BASE_CDN = "https://cdn.jsdelivr.net/gh/Poly-AAA/creator-pers0na@f89bfa1/assets/packs/fantasy-cc/";
  const FW=128, FH=128, COLS=15, FPS=14;
  const KEY_LOOK = "neuro.fantasyLook";
  const KEY_DIR = "neuro.fantasyDirRow";

  /* Iso Neuro : +c = SE écran, +r = SW écran — même maths que le jeu */
  const GRID = 10;
  const TILE_W = 56, TILE_H = 28;
  const cam = { ox:0, oy:0, sc:1 };

  const DIR_LABEL = ["N","NE","E","SE","S","SW","W","NW"];
  /* map[sheetRow] = direction écran 0..7 — calibrable */
  let DIR_ROW = [0,1,2,3,4,5,6,7];
  try{
    const raw = localStorage.getItem(KEY_DIR);
    if(raw){
      const a = JSON.parse(raw);
      if(Array.isArray(a) && a.length===8) DIR_ROW = a.map(n=>n&7);
    }
  }catch(_e){}

  /** Index logique écran (0=N…7=NW) → ligne sheet */
  function sheetRowForFacing(facing){
    const f = facing&7;
    for(let r=0;r<8;r++) if(DIR_ROW[r]===f) return r;
    return f;
  }
  /** Pas iso → direction écran (N=0 horaire) */
  function facingFromIsoDelta(dc, dr){
    if(!dc && !dr) return null;
    const sx = dc - dr, sy = dc + dr;
    let i = Math.round(Math.atan2(sx, -sy) / (Math.PI/4));
    if(i < 0) i += 8;
    return i & 7;
  }

  const PAD_VEC = { u:{dc:0,dr:-1}, r:{dc:1,dr:0}, d:{dc:0,dr:1}, l:{dc:-1,dr:0} };

  const DEFAULT_COLORS = {
    body:"#d4a574", shoes:"#3a3230", legs:"#3e4f63", chest:"#5b7c99",
    belt:"#8b6914", gloves:"#6a5a4e", offhand:"#6b8f71", weapon:"#9aa8b8",
    backpack:"#7a5c3a", head:"#e0b878", slash:"#e8590c", effect:"#5ec8ff", mount:"#8a7060",
  };

  const SPELLS = [
    { id:"punch", name:"Coup brut", cost:2, range:1, aoe:0, dmg:[8,12], anim:"Attack2", cat:"atk", type:"damage" },
    { id:"monofil", name:"Lame spectrale", cost:3, range:1, aoe:0, dmg:[14,18], anim:"Attack3", cat:"atk", type:"damage" },
    { id:"arc", name:"Éclair runique", cost:3, range:4, aoe:0, dmg:[10,15], anim:"Attack1", cat:"atk", type:"damage" },
    { id:"surchauffe", name:"Brasier", cost:4, range:3, aoe:1, dmg:[16,22], anim:"Attack5", cat:"atk", type:"damage" },
    { id:"impact_cinetique", name:"Frappe du titan", cost:4, range:1, aoe:0, dmg:[18,24], anim:"Attack3", cat:"atk", type:"damage" },
    { id:"dash", name:"Charge", cost:3, range:2, aoe:0, dmg:[12,16], anim:"AttackRun", cat:"atk", type:"damage" },
    { id:"mine", name:"Rune piégée", cost:3, range:2, aoe:0, dmg:[10,14], anim:"Kick", cat:"atk", type:"damage" },
    { id:"tir_magnetique", name:"Flèche runique", cost:3, range:5, aoe:0, dmg:[12,16], anim:"Attack1", cat:"atk", type:"damage" },
    { id:"bombe_thermique", name:"Orbe de feu", cost:4, range:4, aoe:1, dmg:[14,20], anim:"Attack3", cat:"atk", type:"damage" },
    { id:"impulsion_emp", name:"Décharge", cost:3, range:3, aoe:1, dmg:[8,12], anim:"Attack5", cat:"atk", type:"damage" },
    { id:"sniper", name:"Œil de faucon", cost:4, range:6, aoe:0, dmg:[16,22], anim:"Attack1", cat:"atk", type:"damage" },
    { id:"gravite", name:"Poussée", cost:3, range:3, aoe:1, dmg:[10,14], anim:"Special1", cat:"atk", type:"damage" },
    { id:"parasite", name:"Maléfice", cost:3, range:2, aoe:0, dmg:[8,12], anim:"Attack3", cat:"atk", type:"damage" },
    { id:"bouclier", name:"Égide", cost:2, range:0, aoe:0, dmg:[0,0], heal:[8,12], anim:"Special1", cat:"def", type:"shield" },
    { id:"armure_nanites", name:"Bouclier sacré", cost:3, range:0, aoe:0, dmg:[0,0], heal:[12,16], anim:"Special1", cat:"def", type:"shield" },
    { id:"nanites", name:"Soin de lumière", cost:3, range:0, aoe:0, dmg:[0,0], heal:[14,20], anim:"Special1", cat:"sup", type:"heal" },
    { id:"reconstruction", name:"Bénédiction", cost:4, range:0, aoe:0, dmg:[0,0], heal:[22,28], anim:"Special1", cat:"sup", type:"heal" },
  ];
  function spellById(id){ return SPELLS.find(s=>s.id===id) || null; }

  const el = (id)=> document.getElementById(id);
  const canvas = el("arena");
  const ctx = canvas.getContext("2d");
  const tintCv = document.createElement("canvas");
  const tintCx = tintCv.getContext("2d");
  const cache = new Map(), cacheP = new Map();

  let catalog = null;
  let weaponAfterShieldRows = [true,true,true,false,false,false,false,true];
  let backpackInFrontRows = [true,false,false,false,false,true,true,true];
  let moveDist = {};

  const lookState = {
    look: null, colors: Object.assign({}, DEFAULT_COLORS),
    bodies: [{folder:"NakedBody", opacity:1, color:"#d4a574"}],
  };

  const G = {
    turn:"player",
    cat:"atk",
    player:{ c:2, r:5, facing:3, pv:100, pvMax:100, pa:6, paMax:6, pm:3, pmMax:3, anim:"Idle", frame:0, t0:0, flash:0, alive:true, shield:0 },
    enemy:{ c:7, r:4, facing:7, pv:40, pvMax:40, pa:4, pm:2, anim:"Idle", frame:0, t0:0, flash:0, alive:true, name:"Bandit" },
    armed: null,
    moves: new Set(),
    range: new Set(),
    targets: new Set(),
    aoe: new Set(),
    combo: 0,
    hover: null,
    busy: false,
  };

  function setStatus(t){ el("status").textContent = t; }
  function setHint(t){ el("spellHint").textContent = t; }
  function hud(){
    el("hudPv").textContent = G.player.pv+"/"+G.player.pvMax;
    el("hudPa").textContent = G.player.pa+"/"+G.player.paMax;
    el("hudPm").textContent = G.player.pm+"/"+G.player.pmMax;
    el("chipPa").classList.toggle("low", G.player.pa<=2);
    el("chipPa").classList.toggle("zero", G.player.pa<=0);
    el("chipPm").classList.toggle("low", G.player.pm<=1);
    el("chipPm").classList.toggle("zero", G.player.pm<=0);
    el("comboFill").style.width = Math.min(100, G.combo)+"%";
    el("btnEnd").disabled = G.turn!=="player" || G.busy;
  }

  function loadLook(){
    try{
      const raw = localStorage.getItem(KEY_LOOK);
      if(!raw) return false;
      const o = JSON.parse(raw);
      if(!o || !o.look) return false;
      lookState.look = o.look;
      if(o.colors) lookState.colors = Object.assign({}, DEFAULT_COLORS, o.colors);
      if(o.bodies && o.bodies.length) lookState.bodies = o.bodies;
      else if(o.look.body) lookState.bodies = [{folder:o.look.body, opacity:1, color:lookState.colors.body}];
      return true;
    }catch(_e){ return false; }
  }
  function defaultLook(){
    lookState.look = {
      body:"NakedBody", chest:"Chest1", legs:"Legs1", shoes:"Shoes1",
      head:"Head1", weapon:"Melee1", offhand:"Shield1",
      belt:"None", gloves:"None", backpack:"None", slash:"None", effect:"None", mount:"None"
    };
    lookState.bodies = [{folder:"NakedBody", opacity:1, color:"#d4a574"}];
    lookState.colors = Object.assign({}, DEFAULT_COLORS);
  }
  function folder(id){
    if(id==="body") return null;
    const v = lookState.look && lookState.look[id];
    return (!v || v==="None") ? null : v;
  }
  function tint(id){
    const c = lookState.colors[id];
    if(!c || c==="#ffffff" || c==="#FFFFFF") return null;
    return c;
  }

  function loadImg(folderName, anim){
    const key = folderName+"/"+anim;
    if(cache.has(key)) return Promise.resolve(cache.get(key));
    if(cacheP.has(key)) return cacheP.get(key);
    const p = new Promise((resolve)=>{
      const rel = `spritesheets/${folderName}/${anim}.png`;
      const urls = [BASE_CDN+rel, BASE_LOCAL+rel];
      const im = new Image(); try{ im.crossOrigin="anonymous"; }catch(_e){}
      let i=0;
      const next=()=>{
        if(i>=urls.length){ resolve(null); return; }
        im.onload=()=>{ cache.set(key, im); resolve(im); };
        im.onerror=()=>next();
        im.src=urls[i++];
      };
      next();
    });
    cacheP.set(key, p);
    return p;
  }
  function getImg(folderName, anim){ return cache.get(folderName+"/"+anim)||null; }

  function layersForRow(row){
    const L=[];
    L.push({folder:(catalog&&catalog.shadowFolder)||"Shadow", tint:null, alpha:1});
    for(const b of lookState.bodies){
      if(!b||!b.folder) continue;
      const t = (b.color && b.color!=="#ffffff") ? b.color : tint("body");
      L.push({folder:b.folder, tint:t, alpha:Math.max(0,Math.min(1,+b.opacity||1))});
    }
    for(const id of ["shoes","legs","chest","belt","gloves"]){
      const f=folder(id); if(f) L.push({folder:f, tint:tint(id), alpha:1});
    }
    const shield=folder("offhand"), weapon=folder("weapon"), bag=folder("backpack");
    const wAfter=!!weaponAfterShieldRows[row|0], bagFront=!!backpackInFrontRows[row|0];
    const mid=[];
    if(wAfter){ if(shield) mid.push({folder:shield,tint:tint("offhand"),alpha:1}); if(weapon) mid.push({folder:weapon,tint:tint("weapon"),alpha:1}); }
    else { if(weapon) mid.push({folder:weapon,tint:tint("weapon"),alpha:1}); if(shield) mid.push({folder:shield,tint:tint("offhand"),alpha:1}); }
    if(bag){ const item={folder:bag,tint:tint("backpack"),alpha:1}; if(bagFront) mid.push(item); else mid.unshift(item); }
    L.push(...mid);
    for(const id of ["head","slash","effect"]){ const f=folder(id); if(f) L.push({folder:f,tint:tint(id),alpha:1}); }
    const mount=folder("mount"); if(mount) L.unshift({folder:mount,tint:tint("mount"),alpha:1});
    return L.filter(x=>x.folder);
  }

  function tintDraw(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex,alpha){
    const a=(alpha==null)?1:alpha;
    ctx.save(); ctx.globalAlpha=a;
    if(!tintHex){ ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh); ctx.restore(); return; }
    const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
    if(tintCv.width!==tw) tintCv.width=tw;
    if(tintCv.height!==th) tintCv.height=th;
    const t=tintCx;
    t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation="source-over"; t.globalAlpha=1;
    t.clearRect(0,0,tw,th); t.imageSmoothingEnabled=false;
    t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="multiply"; t.fillStyle=tintHex; t.fillRect(0,0,tw,th);
    t.globalCompositeOperation="destination-in"; t.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
    t.globalCompositeOperation="source-over";
    ctx.drawImage(tintCv,dx,dy); ctx.restore();
  }

  function toScreen(c, r){
    return { x: cam.ox + (c - r) * (TILE_W/2), y: cam.oy + (c + r) * (TILE_H/2) };
  }
  function toTile(px, py){
    const x = (px - cam.ox) / (TILE_W/2);
    const y = (py - cam.oy) / (TILE_H/2);
    return { c: Math.floor((x + y) / 2), r: Math.floor((y - x) / 2) };
  }
  function fit(){
    const host = canvas.parentElement.getBoundingClientRect();
    const w = Math.max(200, Math.round(host.width));
    const h = Math.max(200, Math.round(host.height));
    if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
    const sc = Math.min(w / (GRID * TILE_W + 40), h / (GRID * TILE_H + 80), 1.35);
    cam.sc = sc;
    cam.ox = w/(2*sc);
    cam.oy = h/(2*sc) - (GRID*TILE_H)/2 + 18;
  }

  function key(c,r){ return c+","+r; }
  function inBounds(c,r){ return c>=0&&r>=0&&c<GRID&&r<GRID; }
  function occupied(c,r, skip){
    if(G.player.alive && skip!=="player" && G.player.c===c && G.player.r===r) return "player";
    if(G.enemy.alive && skip!=="enemy" && G.enemy.c===c && G.enemy.r===r) return "enemy";
    return null;
  }
  function chebyshev(a,b){ return Math.max(Math.abs(a.c-b.c), Math.abs(a.r-b.r)); }
  function manhattan(a,b){ return Math.abs(a.c-b.c)+Math.abs(a.r-b.r); }

  /* BFS PM — comme Grid.reachable Neuro */
  function reachable(start, maxSteps, skip){
    const dist = {};
    const startK = key(start.c, start.r);
    dist[startK] = 0;
    const q = [{c:start.c, r:start.r}];
    const out = [];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      const cur = q.shift();
      const d = dist[key(cur.c,cur.r)];
      if(d >= maxSteps) continue;
      for(const [dc,dr] of dirs){
        const nc = cur.c+dc, nr = cur.r+dr;
        if(!inBounds(nc,nr)) continue;
        const k = key(nc,nr);
        if(k in dist) continue;
        if(occupied(nc,nr,skip)) continue;
        dist[k] = d+1;
        out.push({c:nc, r:nr, d:d+1});
        q.push({c:nc, r:nr});
      }
    }
    return { tiles: out, dist };
  }

  function pathTo(start, goal, maxSteps, skip){
    const { dist } = reachable(start, maxSteps, skip);
    const gk = key(goal.c, goal.r);
    if(!(gk in dist)) return null;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    const path = [{c:goal.c, r:goal.r}];
    let c=goal.c, r=goal.r;
    while(c!==start.c || r!==start.r){
      let found=false;
      for(const [dc,dr] of dirs){
        const pc=c-dc, pr=r-dr;
        const pk=key(pc,pr);
        if(pk in dist && dist[pk]===dist[key(c,r)]-1){
          c=pc; r=pr; path.unshift({c,r}); found=true; break;
        }
      }
      if(!found) return null;
    }
    return path;
  }

  function areaCells(sp, tc, tr){
    const out=[];
    const rad = sp.aoe|0;
    for(let c=tc-rad;c<=tc+rad;c++) for(let r=tr-rad;r<=tr+rad;r++){
      if(!inBounds(c,r)) continue;
      if(chebyshev({c,r},{c:tc,r:tr})<=rad) out.push({c,r});
    }
    return out;
  }

  function recomputeHighlights(){
    G.moves.clear(); G.range.clear(); G.targets.clear(); G.aoe.clear();
    moveDist = {};
    if(G.turn!=="player" || !G.player.alive) return;

    if(G.armed){
      const sp = spellById(G.armed); if(!sp) return;
      if(sp.type==="heal" || sp.type==="shield"){
        G.targets.add(key(G.player.c, G.player.r));
        G.range.add(key(G.player.c, G.player.r));
        return;
      }
      for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++){
        if(chebyshev(G.player,{c,r}) <= sp.range) G.range.add(key(c,r));
      }
      if(G.enemy.alive && G.range.has(key(G.enemy.c, G.enemy.r))){
        G.targets.add(key(G.enemy.c, G.enemy.r));
        const focus = (G.hover && G.range.has(key(G.hover.c,G.hover.r))) ? G.hover : G.enemy;
        for(const cell of areaCells(sp, focus.c, focus.r)) G.aoe.add(key(cell.c, cell.r));
      } else if(G.hover && G.range.has(key(G.hover.c, G.hover.r))){
        for(const cell of areaCells(sp, G.hover.c, G.hover.r)) G.aoe.add(key(cell.c, cell.r));
      }
      return;
    }

    if(G.player.pm>0){
      const reach = reachable(G.player, G.player.pm, "player");
      moveDist = reach.dist;
      for(const t of reach.tiles) G.moves.add(key(t.c,t.r));
    }
  }

  function playAnim(ent, anim){
    ent.anim = anim; ent.frame = 0; ent.t0 = performance.now();
  }
  function faceToward(ent, tc, tr){
    const f = facingFromIsoDelta(tc-ent.c, tr-ent.r);
    if(f!=null) ent.facing = f;
  }

  function tryStep(dc, dr){
    if(G.busy || G.turn!=="player" || !G.player.alive) return;
    if(G.armed){
      /* avec sort armé : les flèches ne bougent pas (comme Neuro) */
      setHint("Sort armé · centre = lancer");
      return;
    }
    if(G.player.pm<=0){ setStatus("Plus de PM"); return; }
    const c = G.player.c+dc, r = G.player.r+dr;
    if(!inBounds(c,r) || occupied(c,r,"player")){ setStatus("Case bloquée"); return; }
    faceToward(G.player, c, r);
    G.player.c=c; G.player.r=r; G.player.pm-=1;
    playAnim(G.player, "Walk");
    recomputeHighlights(); hud();
    setStatus("Dir "+DIR_LABEL[G.player.facing]+" · −1 PM");
    setTimeout(()=>{ if(G.player.anim==="Walk") playAnim(G.player,"Idle"); }, 320);
  }

  function tryMoveTo(c, r){
    if(G.busy || G.turn!=="player" || G.armed) return;
    if(!G.moves.has(key(c,r))) return;
    const path = pathTo(G.player, {c,r}, G.player.pm, "player");
    if(!path || path.length<2) return;
    G.busy = true; hud();
    let i = 1;
    const step = ()=>{
      if(i>=path.length){
        G.busy=false; playAnim(G.player,"Idle");
        recomputeHighlights(); renderSpells(); hud();
        return;
      }
      const n = path[i++];
      faceToward(G.player, n.c, n.r);
      G.player.c=n.c; G.player.r=n.r; G.player.pm-=1;
      playAnim(G.player, path.length>3 ? "Run" : "Walk");
      recomputeHighlights(); hud();
      setTimeout(step, 220);
    };
    step();
  }

  function roll(arr){ return arr[0] + Math.floor(Math.random()*(arr[1]-arr[0]+1)); }

  function doCast(sp, tc, tr){
    if(G.busy) return false;
    if(G.player.pa < sp.cost){ setStatus("Pas assez de PA"); return false; }

    if(sp.type==="heal" || sp.type==="shield"){
      G.player.pa -= sp.cost;
      playAnim(G.player, sp.anim||"Special1");
      if(sp.heal){
        const h = roll(sp.heal);
        G.player.pv = Math.min(G.player.pvMax, G.player.pv + h);
        setStatus(sp.name+" +"+h+" PV");
      } else {
        G.player.shield = (G.player.shield||0) + 8;
        setStatus(sp.name+" · bouclier");
      }
      G.combo = Math.min(100, G.combo + 18);
      G.armed=null;
      recomputeHighlights(); renderSpells(); hud();
      setTimeout(()=>playAnim(G.player,"Idle"), 650);
      return true;
    }

    if(!G.enemy.alive || G.enemy.c!==tc || G.enemy.r!==tr){ setStatus("Pas de cible"); return false; }
    if(chebyshev(G.player, G.enemy) > sp.range){ setStatus("Hors de portée"); return false; }

    faceToward(G.player, tc, tr);
    let anim = sp.anim;
    try{
      if(typeof FantasyBridge!=="undefined"){
        const w = FantasyBridge.currentWeaponFolder();
        const ent = FantasyBridge.weaponEntry(w);
        if(ent && FantasyBridge.resolveSpellId(ent)===sp.id && ent.anim) anim = ent.anim;
      }
    }catch(_e){}

    G.player.pa -= sp.cost;
    playAnim(G.player, anim);
    let total = 0;
    for(const cell of areaCells(sp, tc, tr)){
      if(G.enemy.alive && G.enemy.c===cell.c && G.enemy.r===cell.r){
        const dmg = roll(sp.dmg);
        total += dmg;
        G.enemy.pv = Math.max(0, G.enemy.pv - dmg);
        G.enemy.flash = performance.now()+180;
        faceToward(G.enemy, G.player.c, G.player.r);
        playAnim(G.enemy, G.enemy.pv<=0 ? "Die" : "TakeDamage");
      }
    }
    G.combo = Math.min(100, G.combo + 22);
    setStatus(sp.name+" → "+total+" · "+DIR_LABEL[G.player.facing]);
    if(G.enemy.pv<=0){ G.enemy.alive=false; setStatus("Victoire"); }
    G.armed=null;
    recomputeHighlights(); renderSpells(); hud();
    setTimeout(()=>{ if(G.player.anim!=="Die") playAnim(G.player,"Idle"); }, 700);
    return true;
  }

  /** Comme Neuro : 1er appui arme + lance auto si 1 cible valide */
  function armSpell(id){
    if(G.turn!=="player" || G.busy || !G.player.alive) return;
    const sp = spellById(id); if(!sp) return;
    if(G.player.pa < sp.cost){ setStatus("PA insuffisants"); return; }

    if(G.armed === id){
      /* 2ᵉ appui = lancer / désarmer */
      if(sp.type==="heal"||sp.type==="shield"){ doCast(sp, G.player.c, G.player.r); return; }
      if(G.enemy.alive && G.targets.has(key(G.enemy.c,G.enemy.r))){
        doCast(sp, G.enemy.c, G.enemy.r); return;
      }
      G.armed=null; recomputeHighlights(); renderSpells();
      setHint("Déplacement · cases vertes = PM");
      setStatus("Sort désélectionné");
      return;
    }

    G.armed = id;
    recomputeHighlights();
    renderSpells();

    /* Attaque auto si cible déjà à portée */
    if(sp.type==="heal"||sp.type==="shield"){
      doCast(sp, G.player.c, G.player.r);
      return;
    }
    if(G.enemy.alive && G.targets.has(key(G.enemy.c, G.enemy.r))){
      doCast(sp, G.enemy.c, G.enemy.r);
      return;
    }
    setHint(sp.name+" armé · aucune cible · tape une case / centre");
    setStatus("Portée "+sp.range+(sp.aoe?" · AoE"+sp.aoe:""));
  }

  function castArmed(){
    if(!G.armed){ setHint("Tape un sort pour attaquer"); return; }
    const sp = spellById(G.armed); if(!sp) return;
    if(sp.type==="heal"||sp.type==="shield"){ doCast(sp, G.player.c, G.player.r); return; }
    if(G.enemy.alive && chebyshev(G.player,G.enemy)<=sp.range){
      doCast(sp, G.enemy.c, G.enemy.r);
    } else setStatus("Cible hors portée");
  }

  function endTurn(){
    if(G.turn!=="player" || G.busy) return;
    G.armed=null; G.turn="enemy";
    G.combo = Math.max(0, G.combo - 12);
    recomputeHighlights(); renderSpells(); hud();
    setStatus("Tour ennemi…");
    setTimeout(enemyTurn, 420);
  }

  function enemyTurn(){
    if(!G.enemy.alive){ G.turn="player"; beginPlayerTurn(); return; }
    const e=G.enemy, p=G.player;
    const path = (()=>{
      /* approche : se rapprocher jusqu'à dist 1 */
      const reach = reachable(e, e.pm, "enemy");
      const all = [{c:e.c,r:e.r,d:0}].concat(reach.tiles);
      let best=all[0], bd=manhattan(best,p);
      for(const t of all){
        const d=manhattan(t,p);
        if(d<bd && !(t.c===p.c&&t.r===p.r)){ bd=d; best=t; }
      }
      if(best.c===e.c && best.r===e.r) return null;
      return pathTo(e, best, e.pm, "enemy");
    })();
    if(path && path.length>1){
      for(let i=1;i<path.length;i++){
        faceToward(e, path[i].c, path[i].r);
        e.c=path[i].c; e.r=path[i].r;
      }
      playAnim(e,"Walk");
      setTimeout(()=>playAnim(e,"Idle"), 360);
    }
    setTimeout(()=>{
      if(e.alive && chebyshev(e,p)<=1){
        faceToward(e, p.c, p.r);
        playAnim(e,"Attack1");
        let dmg = 6+Math.floor(Math.random()*5);
        if(p.shield>0){ const absorb=Math.min(p.shield,dmg); p.shield-=absorb; dmg-=absorb; }
        p.pv = Math.max(0, p.pv-dmg);
        p.flash = performance.now()+180;
        setStatus("Bandit → "+dmg);
        hud();
        if(p.pv<=0){ p.alive=false; playAnim(p,"Die"); setStatus("Défaite"); G.turn="over"; return; }
      }
      setTimeout(()=>{ G.turn="player"; beginPlayerTurn(); }, 480);
    }, 420);
  }

  function beginPlayerTurn(){
    G.player.pa = G.player.paMax;
    G.player.pm = G.player.pmMax;
    G.armed=null;
    recomputeHighlights(); renderSpells(); hud();
    setHint("Cases vertes = PM · sort = attaque auto si cible");
    setStatus("Ton tour");
  }

  function renderSpells(){
    const host = el("spellList"); host.innerHTML="";
    let weaponSpell = null;
    try{
      if(typeof FantasyBridge!=="undefined"){
        const w = FantasyBridge.currentWeaponFolder();
        const ent = FantasyBridge.weaponEntry(w);
        weaponSpell = FantasyBridge.resolveSpellId(ent);
      }
    }catch(_e){}
    const baseByCat = {
      atk: ["punch","monofil","arc","surchauffe"],
      def: ["bouclier","armure_nanites"],
      sup: ["nanites","reconstruction"],
    };
    let ids = (baseByCat[G.cat]||[]).slice();
    if(G.cat==="atk" && weaponSpell){
      if(!ids.includes(weaponSpell)) ids.unshift(weaponSpell);
      else { ids.splice(ids.indexOf(weaponSpell),1); ids.unshift(weaponSpell); }
    }
    ids = ids.slice(0,4);
    ids.forEach(id=>{
      const sp = spellById(id); if(!sp) return;
      const skin = (typeof FantasyBridge!=="undefined" && FantasyBridge.SPELL_SKIN[sp.id]) || null;
      const name = skin ? skin.name : sp.name;
      const b = document.createElement("button");
      b.type="button";
      b.className = G.armed===sp.id ? "on" : "";
      b.textContent = name+" ·"+sp.cost;
      b.disabled = G.turn!=="player" || G.busy || G.player.pa<sp.cost;
      b.onclick=()=> armSpell(sp.id);
      host.appendChild(b);
    });
  }

  function tileDiamond(c, r, fill, stroke){
    const s = toScreen(c, r);
    const hw = TILE_W/2, hh = TILE_H/2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y-hh);
    ctx.lineTo(s.x+hw, s.y);
    ctx.lineTo(s.x, s.y+hh);
    ctx.lineTo(s.x-hw, s.y);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if(stroke){ ctx.lineWidth=1; ctx.strokeStyle=stroke; ctx.stroke(); }
    return s;
  }

  function drawEntity(ent, isEnemy){
    if(!ent.alive && ent.anim!=="Die") return;
    const row = sheetRowForFacing(ent.facing|0);
    const anim = ent.anim||"Idle";
    const elapsed = (performance.now()-(ent.t0||0))/1000;
    let col = Math.floor(elapsed*FPS);
    if(anim==="Idle"||anim==="Walk"||anim==="Run") col = col % COLS;
    else col = Math.min(col, COLS-1);
    const s = toScreen(ent.c, ent.r);
    const scale = 1.15;
    const dw=FW*scale, dh=FH*scale;
    const foot = 98;
    const dx=s.x-dw/2, dy=s.y - foot*scale + 6;

    ctx.fillStyle="rgba(40,40,38,0.14)";
    ctx.beginPath(); ctx.ellipse(s.x, s.y+6, 14, 6, 0,0,Math.PI*2); ctx.fill();

    const layers = isEnemy
      ? [{folder:"NakedBody",tint:"#8a6060",alpha:1},{folder:"Head3",tint:null,alpha:1},{folder:"Melee2",tint:null,alpha:1}]
      : layersForRow(row);

    ctx.imageSmoothingEnabled=false;
    for(const L of layers){
      const im = getImg(L.folder, anim) || getImg(L.folder, "Idle");
      if(!im){ loadImg(L.folder, anim); loadImg(L.folder,"Idle"); continue; }
      try{ tintDraw(im, col*FW, row*FH, FW, FH, dx, dy, dw, dh, L.tint, L.alpha); }catch(_e){}
    }
    if(ent.flash && performance.now()<ent.flash){
      ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=0.45;
      for(const L of layers){
        const im=getImg(L.folder,anim)||getImg(L.folder,"Idle");
        if(!im) continue;
        try{ ctx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); }catch(_e){}
      }
      ctx.restore();
    }
    /* contour cible */
    if(!isEnemy && G.armed){ /* self heal highlight handled via tiles */ }
    if(isEnemy && G.targets.has(key(ent.c,ent.r))){
      const t = performance.now()/1000;
      ctx.save();
      ctx.globalAlpha = 0.45 + Math.sin(t*6)*0.25;
      ctx.strokeStyle = G.aoe.has(key(ent.c,ent.r)) ? "#8a3030" : "#6a4a8a";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(s.x, s.y-18, 16, 22, 0,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    const pct = ent.pv/ent.pvMax;
    const bw=26, bh=3, bx=s.x-bw/2, by=dy+10;
    ctx.fillStyle="rgba(0,0,0,.22)"; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle = isEnemy ? "#8a3030" : "#2f6f4e";
    ctx.fillRect(bx, by, bw*pct, bh);
  }

  function draw(){
    fit();
    const W=canvas.width, H=canvas.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#d8ddd4";
    ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.scale(cam.sc, cam.sc);

    const order=[];
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) order.push({c,r,sum:c+r});
    order.sort((a,b)=>a.sum-b.sum || a.c-b.c);

    for(const t of order){
      const a = ((t.c+t.r)&1);
      const fill = a ? "#e8e8e2" : "#dcdcd6";
      tileDiamond(t.c, t.r, fill, "rgba(80,80,70,0.12)");
      const k=key(t.c,t.r);
      if(G.moves.has(k)){
        tileDiamond(t.c, t.r, "rgba(47,111,78,0.30)", "rgba(47,111,78,0.5)");
      }
      if(G.range.has(k) && G.armed){
        tileDiamond(t.c, t.r, "rgba(90,70,140,0.22)", "rgba(90,70,140,0.4)");
      }
      if(G.aoe.has(k)){
        tileDiamond(t.c, t.r, "rgba(138,48,48,0.34)", "rgba(138,48,48,0.55)");
      }
      if(G.targets.has(k)){
        tileDiamond(t.c, t.r, "rgba(138,48,48,0.18)", "rgba(138,48,48,0.65)");
      }
      if(G.hover && G.hover.c===t.c && G.hover.r===t.r){
        tileDiamond(t.c, t.r, "rgba(61,61,58,0.12)", "rgba(61,61,58,0.55)");
      }
    }

    const ents=[];
    if(G.enemy.alive || G.enemy.anim==="Die") ents.push({e:G.enemy, enemy:true});
    if(G.player.alive || G.player.anim==="Die") ents.push({e:G.player, enemy:false});
    ents.sort((a,b)=> (a.e.c+a.e.r)-(b.e.c+b.e.r) || a.e.c-b.e.c);
    for(const o of ents) drawEntity(o.e, o.enemy);
    ctx.restore();
  }

  function loop(){ draw(); requestAnimationFrame(loop); }

  function pointer(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    const x = (p.clientX-rect.left) * (canvas.width/rect.width);
    const y = (p.clientY-rect.top) * (canvas.height/rect.height);
    return { x: x/cam.sc, y: y/cam.sc };
  }

  function onTap(e){
    if(G.turn!=="player" || !G.player.alive || G.busy) return;
    const {x,y}=pointer(e);
    const cell=toTile(x,y);
    if(!inBounds(cell.c,cell.r)) return;
    if(G.armed){
      const sp = spellById(G.armed);
      if(!sp) return;
      if(sp.type==="heal"||sp.type==="shield"){ doCast(sp, G.player.c, G.player.r); return; }
      if(G.enemy.alive && cell.c===G.enemy.c && cell.r===G.enemy.r){
        doCast(sp, cell.c, cell.r); return;
      }
      setStatus("Cible invalide");
      return;
    }
    tryMoveTo(cell.c, cell.r);
  }

  function warm(){
    const anims=["Idle","Walk","Run","Attack1","Attack2","Attack3","Attack4","Attack5","Attack6","AttackRun","TakeDamage","Die","Special1","Kick"];
    for(const L of layersForRow(3)) for(const a of anims) loadImg(L.folder,a);
    for(const f of ["NakedBody","Head3","Melee2"]) for(const a of anims) loadImg(f,a);
  }

  function bindPad(){
    el("dpad").querySelectorAll("button").forEach(btn=>{
      const fire=()=>{
        const d=btn.dataset.dir;
        if(d==="c"){ castArmed(); return; }
        const v=PAD_VEC[d]; if(!v) return;
        tryStep(v.dc, v.dr);
      };
      btn.addEventListener("pointerdown", (e)=>{ e.preventDefault(); btn.classList.add("on"); fire(); });
      btn.addEventListener("pointerup", ()=>btn.classList.remove("on"));
      btn.addEventListener("pointerleave", ()=>btn.classList.remove("on"));
    });
    document.querySelectorAll(".cat").forEach(btn=>{
      btn.onclick=()=>{
        G.cat = btn.dataset.cat;
        document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("on", b===btn));
        G.armed=null; recomputeHighlights(); renderSpells();
        setStatus(G.cat==="atk"?"Attaque":G.cat==="def"?"Défense":"Soutien");
      };
    });
  }

  async function boot(){
    setStatus("Chargement…");
    if(!loadLook()) defaultLook();
    try{
      for(const u of [BASE_CDN+"catalog.json", BASE_LOCAL+"catalog.json"]){
        const r=await fetch(u,{cache:"no-store",mode:"cors"});
        if(r.ok){ catalog=await r.json(); break; }
      }
    }catch(_e){}
    if(catalog){
      if(catalog.weaponAfterShieldRows) weaponAfterShieldRows=catalog.weaponAfterShieldRows;
      if(catalog.backpackInFrontRows) backpackInFrontRows=catalog.backpackInFrontRows;
    }
    try{
      if(typeof FantasyBridge!=="undefined"){
        SPELLS.forEach(sp=>{
          const sk=FantasyBridge.SPELL_SKIN[sp.id];
          if(sk) sp.name=sk.name;
        });
      }
    }catch(_e){}

    warm();
    beginPlayerTurn();
    renderSpells(); hud();
    bindPad();

    canvas.addEventListener("click", onTap);
    canvas.addEventListener("touchend", (e)=>{
      e.preventDefault();
      const t=e.changedTouches[0];
      if(t) onTap({clientX:t.clientX, clientY:t.clientY});
    }, {passive:false});
    canvas.addEventListener("mousemove", (e)=>{
      const {x,y}=pointer(e); const t=toTile(x,y);
      G.hover = inBounds(t.c,t.r) ? t : null;
      if(G.armed) recomputeHighlights();
    });
    el("btnEnd").onclick=endTurn;
    window.addEventListener("resize", fit);
    loop();
  }
  boot();
})();
</script>
</body>
</html>
