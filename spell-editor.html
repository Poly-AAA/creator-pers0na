<style>
  :root{
    --bg:#ecece8;--bg2:#f5f5f2;--ink:#3d3d3a;--ink2:#888884;
    --line:#d0d0cc;--line2:#e4e4e0;--card:#fafaf8;
    --sel:#3d3d3a;--soft:#f0f0ec;
    --acc:#4a3870;--ok:#2f6f4e;--warn:#c45c26;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,Helvetica,sans-serif;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}

  /* ── PREVIEW (haut) ── */
  .preview-wrap{flex:0 0 220px;min-height:220px;position:relative;background:#d8ddd4;overflow:hidden}
  canvas#arena{display:block;width:100%;height:220px;image-rendering:pixelated}
  .preview-status{position:absolute;bottom:4px;left:8px;right:8px;
    font-size:11px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.6);
    pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── NAV SORTS (bandeau) ── */
  .spell-nav{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--bg2);
    border-bottom:1px solid var(--line2);-webkit-overflow-scrolling:touch;flex-shrink:0}
  .spell-nav button{flex-shrink:0;padding:7px 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--soft);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
  .spell-nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .spell-nav button.new{background:var(--ok);color:#fff;border-color:var(--ok)}

  /* ── PANEL ÉDITEUR (bas, scrollable) ── */
  .editor{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px}
  .card h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  label.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
  label.field input,label.field select,label.field textarea{
    padding:7px 9px;border:1px solid var(--line);border-radius:8px;
    background:var(--soft);font:13px/1.3 inherit;color:var(--ink);width:100%}
  label.field textarea{resize:vertical;min-height:56px}
  .anim-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .anim-list button{padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;
    background:var(--soft);font-size:11px;font-weight:700;color:var(--ink)}
  .anim-list button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .anim-seq{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;
    background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:5px}
  .anim-seq .chip{display:flex;align-items:center;gap:3px;padding:3px 8px;
    background:var(--acc);color:#fff;border-radius:999px;font-size:11px;font-weight:700}
  .anim-seq .chip button{background:none;border:none;color:#fff;font-size:12px;padding:0;cursor:pointer}

  /* évolutions catalogue */
  .evo-tier{margin-top:10px}
  .evo-tier h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--acc)}
  .evo-choice{border:1.5px solid var(--line2);border-radius:10px;padding:8px;margin-top:6px;background:var(--bg2)}
  .evo-choice.on{border-color:var(--acc);background:#f0eef8}
  .evo-choice-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
  .evo-choice-head label{display:flex;align-items:flex-start;gap:6px;cursor:pointer;flex:1}
  .evo-choice-head b{font-size:12px;color:var(--ink)}
  .evo-choice-head small{font-size:10px;color:var(--ink2);display:block;margin-top:2px;line-height:1.3}
  .evo-choice .test-btn{margin-top:6px;padding:4px 10px;border-radius:7px;background:var(--acc);
    color:#fff;border:none;font-size:10px;font-weight:700;cursor:pointer}

  /* overlay corps */
  .body-tokens{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .body-tokens button{padding:4px 10px;border:1.5px solid var(--line);border-radius:8px;
    background:var(--soft);font-size:11px;font-weight:700;color:var(--ink)}
  .body-tokens button.on{background:#6b4a2e;color:#fff;border-color:#6b4a2e}

  /* footer */
  .footer{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--bg2);border-top:1px solid var(--line2);flex-shrink:0}
  .footer button,.footer a{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);
    background:var(--soft);color:var(--ink);font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;text-decoration:none}
  .footer .primary{background:var(--acc);color:#fff;border-color:var(--acc)}
  .footer .ok{background:var(--ok);color:#fff;border-color:var(--ok)}

  /* hint */
  .hint{font-size:11px;color:var(--ink2);margin:3px 0 0}

  /* onglets éditeur */
  .editor-tabs{display:flex;gap:6px;padding:8px 10px 0;background:var(--bg2);flex-shrink:0;border-bottom:1px solid var(--line2)}
  .editor-tabs button{flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px 10px 0 0;
    background:var(--soft);font-size:12px;font-weight:700;color:var(--ink);border-bottom:none}
  .editor-tabs button.on{background:var(--card);color:var(--acc);border-color:var(--acc);position:relative;z-index:1}

  /* boutons +/- (remplacent les barres / champs difficiles au doigt) */
  .step-btns{display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
  .step-btns button{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--soft);font-size:22px;font-weight:700;color:var(--ink);line-height:1;cursor:pointer;
    touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .step-btns button:active{background:var(--acc);color:#fff;border-color:var(--acc)}
  .step-btns .val{min-width:52px;text-align:center;font-size:15px;font-weight:700;color:var(--ink);
    font-variant-numeric:tabular-nums}

  /* bande de frames */
  .frame-strip{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
  .frame-strip button{width:28px;height:28px;padding:0;border:1.5px solid var(--line);border-radius:6px;
    background:var(--soft);font-size:10px;font-weight:700;color:var(--ink2);cursor:pointer}
  .frame-strip button.in{background:#dfe8ff;border-color:var(--acc);color:var(--acc)}
  .frame-strip button.start{background:var(--acc);color:#fff;border-color:var(--acc)}
  .frame-strip button.end{background:var(--ok);color:#fff;border-color:var(--ok)}

  .frame-scrub button{min-width:40px;min-height:32px;border:1.5px solid var(--line);border-radius:8px;
    background:var(--soft);font-weight:700;cursor:pointer}

/* Liens Créateur / Combat / Sorts — persistés dans localStorage (neuro.fccNav) */
function wireFccNav(){
  const nav=Object.assign({}, window.FCC_NAV||{});
  try{
    const stored=JSON.parse(localStorage.getItem("neuro.fccNav")||"{}");
    /* Les liens injectés (FCC_NAV) priment — évite un vieux combat 404 en localStorage */
    Object.keys(stored).forEach(k=>{ if(!nav[k]) nav[k]=stored[k]; });
  }catch(_e){}
  document.querySelectorAll("[data-fcc]").forEach(el=>{
    const k=el.getAttribute("data-fcc");
    if(nav[k]) el.href=nav[k];
    else if(el.href && /^https?:\/\//.test(el.href)) nav[k]=el.href;
  });
  try{ localStorage.setItem("neuro.fccNav", JSON.stringify(nav)); }catch(_e){}
  return nav;
}
</script>

/** Migre / seed Coup de pied — n’écrase jamais les anims joueur. */
function ensureCoupDePied(){
  const preset = JSON.parse(JSON.stringify(SAVED_COUP_DE_PIED));
  (customSpells||[]).forEach(s=>{
    if(!s || !s.id) return;
    if(s.id==="coup_de_pied") return;
    const isKick = s.id==="kick" || /^custom_/.test(s.id) && /coup\s*de\s*pied/i.test(s.name||"");
    if(isKick) s.id = "coup_de_pied";
  });
  let kick = (customSpells||[]).find(s=>s && s.id==="coup_de_pied");
  if(!kick){
    customSpells = [...(customSpells||[]).filter(s=>s && s.id!=="coup_de_pied"), preset];
    customSpells.sort((a,b)=>{
      if(a.id==="punch") return -1;
      if(b.id==="punch") return 1;
      if(a.id==="coup_de_pied") return -1;
      if(b.id==="coup_de_pied") return 1;
      return 0;
    });
    return;
  }
  if(!kick.effect || kick.effect==="none") kick.effect="push";
  if(kick.push==null && kick.pushDist==null) kick.push=1;
  if(!Array.isArray(kick.steps) || !kick.steps.length){
    kick.steps = JSON.parse(JSON.stringify(preset.steps));
    if(!kick.anim) kick.anim = "Kick";
  }
  fillMissingEvoKeys(kick, preset.evoConfig);

/** Seed Roulade — n’écrase jamais steps/évos existants. */
function ensureRoulade(){
  const preset = JSON.parse(JSON.stringify(SAVED_ROULADE));
  (customSpells||[]).forEach(s=>{
    if(!s || !s.id || s.id==="roulade") return;
    if(/^custom_/.test(s.id) && /roulade/i.test(s.name||"")) s.id = "roulade";
  });
  let roll = (customSpells||[]).find(s=>s && s.id==="roulade");
  if(!roll){
    customSpells = [...(customSpells||[]).filter(s=>s && s.id!=="roulade"), preset];
    customSpells.sort((a,b)=>{
      const order = { punch:0, coup_de_pied:1, roulade:2 };
      return (order[a.id]??9) - (order[b.id]??9);
    });
    return;
  }
  if(!roll.effect) roll.effect="roulade";
  if(!Array.isArray(roll.steps) || !roll.steps.length){
    roll.steps = JSON.parse(JSON.stringify(preset.steps));
    if(!roll.anim) roll.anim = "Rolling";
  } else {

}

/* ── Catalogue évolutions (EVO_TREE du jeu) ── */
function getEvoTree(spellId){
  if(typeof FantasyBridge==="undefined" || !FantasyBridge.EVO_TREE) return null;
  return FantasyBridge.EVO_TREE[spellId] || null;
}
function evoKey(tier, name){
  if(typeof FantasyBridge!=="undefined" && FantasyBridge.evoCatalogKey) return FantasyBridge.evoCatalogKey(tier, name);
  return tier+":"+name;
}
function initEvoConfig(spell){
  if(!spell.evoConfig) spell.evoConfig = {};
  if(typeof FantasyBridge!=="undefined" && FantasyBridge.ensureEvoConfig){
    spell.evoConfig = FantasyBridge.ensureEvoConfig(spell.id, spell.evoConfig);
  } else {
    const tree = getEvoTree(spell.id);
    if(tree){
      [1,2].forEach(tier=>{
        (tree[tier]||[]).forEach(ch=>{
          const k=evoKey(tier, ch.name);
          if(!spell.evoConfig[k]){
            const slash = ch.fx && /^Slash/i.test(ch.fx) ? ch.fx : "None";
            const effect = ch.fx && /^Effect/i.test(ch.fx) ? ch.fx : "None";
            spell.evoConfig[k] = { enabled:false, anim:ch.anim||"Attack1", slash, effect, fps:14, delay:0 };
          }
        });
      });
    }
  }
  Object.values(spell.evoConfig).forEach(e=>{
    if(!e) return;
    if(e.fps==null) e.fps=14;
    if(e.delay==null) e.delay=0;
    if(!e.hitAnim) e.hitAnim="TakeDamage";
    if(e.hitAnimFps==null) e.hitAnimFps=14;
    if(e.hitDelay === "") e.hitDelay = null;
    if(e.frameStart==null) e.frameStart=0;
    if(e.frameEnd==null) e.frameEnd=FRAME_MAX;
    if(e.hitFrameStart==null) e.hitFrameStart=0;
    if(e.hitFrameEnd==null) e.hitFrameEnd=FRAME_MAX;
    if(e.fxHold==null) e.fxHold=false;
  });
  return spell.evoConfig;
}
function evoEntry(spell, tier, choice){
  initEvoConfig(spell);
  return spell.evoConfig[evoKey(tier, choice.name)] || null;
}
function savedEvoSummary(spellId){
  loadCustom();
  const s=customSpells.find(x=>x.id===spellId);
  if(!s||!s.evoConfig) return null;
  initEvoConfig(s);
  const lines=[];
  Object.keys(s.evoConfig).forEach(k=>{
    const e=s.evoConfig[k];
    if(!e||!e.enabled) return;
    lines.push(k.split(":").pop()+": "+(e.anim||"?")+" @"+(e.fps!=null?e.fps:14)+"fps");
  });
  return lines.length?{spell:s, lines}:null;
}
function showSavedStatus(){
  const st=document.getElementById("pvStatus");
  if(!st) return;
  if(spellsDirty){
    st.textContent="Non sauvé · appuie sur Sauver (ou Combat ▶)";

  if(sum){

  } else {
    st.textContent="Sauvé · "+(customSpells.length||0)+" sort(s)";
  }
}
function previewEnabledEvos(spellId){
  const s = ensureEditable(spellId);
  initEvoConfig(s);
  let steps = [];
  if(typeof FantasyBridge!=="undefined" && FantasyBridge.buildEvoAnimSteps){
    steps = FantasyBridge.buildEvoAnimSteps(spellId, s.evoConfig);
  } else {
    const tree = getEvoTree(spellId);
    if(tree){
      [1,2].forEach(tier=>{
        (tree[tier]||[]).forEach(ch=>{
          const e = evoEntry(s, tier, ch);
          if(e && e.enabled){
            steps.push(normalizeStep({
              anim:e.anim||ch.anim, delay:e.delay!=null?e.delay:80, fps:e.fps!=null?e.fps:14,
              slash:e.slash, effect:e.effect, hitTarget:tier===2
            }));

        });

    }

}

const imgCache = new Map();

function loadImg(folder, anim){
  const k=folder+"/"+anim;
  const cached=imgCache.get(k);
  if(cached){
    if(cached._v) return cached;
    if(cached._pending) return cached;
  }
  const rel=`spritesheets/${folder}/${anim}.png`;
  const urls=[];
  if(folder==="Head25") urls.push(`hat-refs/Head25/${anim}.png`);
  const bases=HOST_STANDALONE ? [BASE_CDN, BASE_LOCAL] : [BASE_LOCAL, BASE_CDN];
  bases.forEach(b=>{ const base=b.endsWith("/")?b:b+"/"; urls.push(base+rel); });
  const p=new Promise(res=>{
    let i=0, pass=0;
    function tryNext(){
      if(i>=urls.length){
        if(pass===0){ pass=1; i=0; tryNext(); return; }
        imgCache.delete(k);
        res(null);
        return;
      }
      const im=new Image();
      if(pass===0) im.crossOrigin="anonymous";
      im.onload=()=> res(im);
      im.onerror=()=>{ i++; tryNext(); };
      im.src=urls[i++];
    }
    tryNext();
  });
  p._pending=true;
  p._failed=false;
  p.then(function(im){
    p._pending=false;
    if(im){ p._v=im; p._failed=false; }
    else p._failed=true;
  });
  imgCache.set(k,p); return p;
}
function getImg(folder,anim){
  const p=imgCache.get(folder+"/"+anim);
  return (p&&p._v)||null;
}

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#d8ddd4"; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.scale(cam.sc,cam.sc);
  /* tiles */
  for(let c=0;c<GRID;c++) for(let r=0;r<GRID;r++){
    const s=toScreen(c,r);
    const hw=TILE_W/2, hh=TILE_H/2;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y-hh); ctx.lineTo(s.x+hw,s.y);
    ctx.lineTo(s.x,s.y+hh); ctx.lineTo(s.x-hw,s.y); ctx.closePath();
    ctx.fillStyle=((c+r)&1)?"#e8e8e2":"#dcdcd6"; ctx.fill();
    ctx.strokeStyle="rgba(80,80,70,0.12)"; ctx.lineWidth=1; ctx.stroke();
  }
  const now=performance.now();
  for(const ent of [enemy, player]){
    if(!ent.alive && ent.anim!=="Die") continue;
    const anim=ent.anim||"Idle";
    const row=sheetRowForDir(ent.dir, anim);
    const elapsed=(now-ent.t0)/1000;
    const fps=ent.stepFps||FPS;
    const loop=/^(Idle|Walk|Run|RideIdle|RideRun)$/i.test(anim);
    const fs = ent.frameStart != null ? (ent.frameStart|0) : 0;
    const fe = ent.frameEnd != null ? (ent.frameEnd|0) : FRAME_MAX;
    const span = Math.max(1, fe - fs + 1);
    let col;
    if(ent.freezeFrame != null){
      col = Math.max(0, Math.min(FRAME_MAX, ent.freezeFrame|0));
    } else {
      col = fs + Math.floor(elapsed*Math.max(0.0001, fps));
      if(loop) col = fs + ((col - fs) % span);
      else col = Math.min(col, fe);
    }
    const s=toScreen(ent.c,ent.r);
    const sc2=1.15, dw=FW*sc2, dh=FH*sc2, FOOT=88;
    const dx=s.x-dw/2, dy=s.y-FOOT*sc2;
    const isEnemy=(ent===enemy);
    /* Monture sous le perso (preview onglet dégâts monture) */
    const wantMount = !isEnemy && (ent.showMount || (editorTab==="mount" && !ent.hideMount && previewMountOn!==false)) && !ent.hideMount;
    if(wantMount){
      const mf = previewMountFolder();
      const mountAnim = /^Ride/i.test(anim) ? anim : "RideIdle";
      const mim = getImg(mf, mountAnim) || getImg(mf, "RideIdle") || getImg(mf, "Idle");
      if(mim){
        ctx.save(); ctx.globalAlpha=1;
        ctx.drawImage(mim, col*FW, row*FH, FW, FH, dx, dy, dw, dh);
        ctx.restore();
      } else {
        loadImg(mf, "RideIdle");
      }
    }
    /* Build layers: base + optional FX for player */
    let layers=isEnemy
      ? [{folder:"NakedBody",tint:"#8a6060",alpha:1},{folder:"Head3",tint:null,alpha:1}]
      : playerLayers();
    if(!isEnemy){
      if(ent.fxSlash) layers=layers.concat([{folder:ent.fxSlash,tint:"#e8590c",alpha:0.9}]);
      if(ent.fxEffect) layers=layers.concat([{folder:ent.fxEffect,tint:"#5ec8ff",alpha:0.85}]);
    }
    ctx.imageSmoothingEnabled=false;
    let drawn=0;
    for(const L of layers){
      const im=getImg(L.folder,anim)||getImg(L.folder,"Idle"); if(!im) continue;
      ctx.save(); ctx.globalAlpha=(L.alpha||1);
      if(L.tint){ drawTinted(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh,L.tint); }
      else { ctx.drawImage(im,col*FW,row*FH,FW,FH,dx,dy,dw,dh); }
      ctx.restore(); drawn++;
    }
    if(!drawn){
      ctx.fillStyle=isEnemy?"#8a5050":"#3d6a8a";
      ctx.beginPath(); ctx.ellipse(s.x,s.y-16,11,16,0,0,Math.PI*2); ctx.fill();
    }
    if(ent.pvMax){
      const pct=ent.pv/ent.pvMax, bw=24, bh=3, bx=s.x-bw/2, by=dy+12;
      ctx.fillStyle="rgba(0,0,0,.2)"; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
      ctx.fillStyle=isEnemy?"#8a3030":"#2f6f4e";
      ctx.fillRect(bx,by,bw*Math.max(0,pct),bh);
    }
  }
  ctx.restore();
  /* warm missing images */
  for(const ent of [player,enemy]){
    const layers=ent===player?playerLayers():[{folder:"NakedBody"},{folder:"Head3"}];
    for(const L of layers) loadImg(L.folder,ent.anim||"Idle").then(im=>{ if(im) im._v=im; });
  }
}
const tintCv=document.createElement("canvas");
const tintCx=tintCv.getContext("2d");
function drawTinted(img,sx,sy,sw,sh,dx,dy,dw,dh,tintHex){
  const tw=Math.max(1,Math.round(dw)), th=Math.max(1,Math.round(dh));
  if(tintCv.width!==tw) tintCv.width=tw;
  if(tintCv.height!==th) tintCv.height=th;
  tintCx.clearRect(0,0,tw,th); tintCx.imageSmoothingEnabled=false;
  tintCx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
  tintCx.globalCompositeOperation="multiply"; tintCx.fillStyle=tintHex; tintCx.fillRect(0,0,tw,th);
  tintCx.globalCompositeOperation="destination-in"; tintCx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
  tintCx.globalCompositeOperation="source-over";
  ctx.drawImage(tintCv,dx,dy);
}
function playerLayers(){
  const L=[];
  for(const b of lookState.bodies){
    if(!b.folder) continue;
    const tint=(!b.color||b.color==="#ffffff")?null:b.color;
    L.push({folder:b.folder,tint,alpha:b.opacity??1});
  }
  const lk=lookState.look;
  const folder=id=>{ const v=lk[id]; return (v&&v!=="None")?v:null; };
  for(const id of ["chest","legs","shoes"]){
    const f=folder(id); if(f) L.push({folder:f,tint:(lookState.colors||{})[id]||null,alpha:1});
  }
  const h=folder("hair"); if(h) L.push({folder:h,tint:(lookState.colors||{}).hair||null,alpha:1});
  const hd=folder("head"); if(hd) L.push({folder:hd,tint:(lookState.colors||{}).head||null,alpha:1});
  return L.filter(x=>x.folder);
}

/* Normalise un step : string legacy → objet riche */
function clampFrame(n){
  const x = Number(n);
  if(!isFinite(x)) return 0;
  return Math.max(0, Math.min(FRAME_MAX, x|0));
}
function normalizeFrameRange(o){
  let fs = o.frameStart != null && o.frameStart !== "" ? clampFrame(o.frameStart) : 0;
  let fe = o.frameEnd != null && o.frameEnd !== "" ? clampFrame(o.frameEnd) : FRAME_MAX;
  if(fe < fs){ const t=fs; fs=fe; fe=t; }
  o.frameStart = fs;
  o.frameEnd = fe;
  let hfs = o.hitFrameStart != null && o.hitFrameStart !== "" ? clampFrame(o.hitFrameStart) : 0;
  let hfe = o.hitFrameEnd != null && o.hitFrameEnd !== "" ? clampFrame(o.hitFrameEnd) : FRAME_MAX;
  if(hfe < hfs){ const t=hfs; hfs=hfe; hfe=t; }
  o.hitFrameStart = hfs;
  o.hitFrameEnd = hfe;
  return o;
}
function clampPosCell(v){
  const n = Number(v); if(!isFinite(n)) return 0;
  return Math.max(-3, Math.min(3, n|0));
}
function normalizeStep(s){
  if(typeof s==="string") return normalizeFrameRange({
    anim:s, delay:0, move:"Idle", fps:14, slash:"None", effect:"None",
    hitTarget:false, hitAnim:"TakeDamage", hitAnimFps:14, hitDelay:null,
    fxHold:false, hideMount:false, clearMount:false, forceGround:false,
    posDc:0, posDr:0,
    frameStart:0, frameEnd:FRAME_MAX, hitFrameStart:0, hitFrameEnd:FRAME_MAX,
    hitDelayByDist:false,
  });
  const o = Object.assign({
    anim:"Attack1",delay:0,move:"Idle",fps:14,slash:"None",effect:"None",
    hitTarget:false, hitAnim:"TakeDamage", hitAnimFps:14, hitDelay:null,
    fxHold:false, hideMount:false, clearMount:false, forceGround:false,
    posDc:0, posDr:0,
    frameStart:0, frameEnd:FRAME_MAX, hitFrameStart:0, hitFrameEnd:FRAME_MAX,
    hitDelayByDist:false,
  }, s);
  if(o.hitDelay === "end" || o.hitDelay === -1) o.hitDelay = null;
  else if(o.hitDelay === "" || o.hitDelay === false) o.hitDelay = null;
  else if(o.hitDelay != null) o.hitDelay = Math.max(0, Number(o.hitDelay)|0);
  o.fxHold = !!o.fxHold;
  o.hideMount = !!o.hideMount;
  o.clearMount = !!o.clearMount;
  o.forceGround = !!o.forceGround;
  o.posDc = clampPosCell(o.posDc);
  o.posDr = clampPosCell(o.posDr);
  o.hitDelayByDist = !!o.hitDelayByDist;
  return normalizeFrameRange(o);
}

/** Séquence globale : touché à cheval → monture off + TakeDamage@24. */
const MOUNT_HIT_VERSION = 3;
const DEFAULT_MOUNT_HIT = {
  enabled: true,
  version: MOUNT_HIT_VERSION,
  steps: [
    {
      anim:"TakeDamage", delay:0, fps:24, slash:"None", effect:"None",
      hitTarget:false, forceGround:true, hideMount:true, clearMount:true,
      posDc:0, posDr:0,
      frameStart:0, frameEnd:FRAME_MAX, move:"Idle", hitAnim:"TakeDamage", hitAnimFps:14, hitDelay:null,
      fxHold:false, hitFrameStart:0, hitFrameEnd:FRAME_MAX,
    },
  ].map(normalizeStep),
};
let mountHit = JSON.parse(JSON.stringify(DEFAULT_MOUNT_HIT));
function loadMountHit(){
  try{
    const raw = localStorage.getItem(KEY_MOUNT_HIT);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || typeof o !== "object") return;
    /* v3 : simple TakeDamage@24 (plus Die/Idle). Ancienne config → défaut. */
    if((o.version|0) < MOUNT_HIT_VERSION){
      mountHit = JSON.parse(JSON.stringify(DEFAULT_MOUNT_HIT));
      mountHit.enabled = o.enabled !== false;
      saveMountHit();
      return;
    }
    mountHit.enabled = o.enabled !== false;
    mountHit.version = MOUNT_HIT_VERSION;
    if(Array.isArray(o.steps) && o.steps.length){
      mountHit.steps = o.steps.map(normalizeStep);
    }
  }catch(_e){}
}
function saveMountHit(){
  mountHit.version = MOUNT_HIT_VERSION;
  try{ localStorage.setItem(KEY_MOUNT_HIT, JSON.stringify(mountHit)); }catch(_e){}
  try{ sessionStorage.setItem(KEY_MOUNT_HIT, JSON.stringify(mountHit)); }catch(_e){}
}
loadMountHit();

function dirFromIsoDelta(dc, dr){
  if(!dc && !dr) return null;
  const sx = (dc - dr) * (TILE_W / 2);
  const sy = (dc + dr) * (TILE_H / 2);
  let i = Math.round(Math.atan2(sx, -sy) / (Math.PI/4));
  if(i < 0) i += 8;
  return i & 7;
}
function facePlayerToEnemy(){
  const d = dirFromIsoDelta((enemy.c|0)-(player.c|0), (enemy.r|0)-(player.r|0));
  if(d!=null) player.dir = d;
}
function chebDist(a,b){
  return Math.max(Math.abs((a.c|0)-(b.c|0)), Math.abs((a.r|0)-(b.r|0)));
}
function hitDelayMsByDistance(baseMs, tileDist){
  const base = Math.max(0, Number(baseMs)|0);
  const d = Math.max(1, tileDist|0);
  const exp = Math.min(8, d - 1);
  return base * Math.pow(2, exp);
}

/* Preview d'une action (chaîne de steps riches sur le joueur) */
let _previewTimer=null;
/** Freeze une entité sur une frame précise (pour le scrub ◀▶). */
function freezePreviewFrame(ent, anim, frame, fs, fe, step){
  if(_previewTimer){ clearTimeout(_previewTimer); _previewTimer=null; }
  ent.anim = anim || "Idle";
  ent.t0 = performance.now();
  ent.stepFps = 0.0001; /* quasi gelé */
  ent.frameStart = frame|0;
  ent.frameEnd = frame|0;
  ent.freezeFrame = frame|0;
  if(step){
    ent.hideMount = !!(step.hideMount || step.clearMount);
    ent.forceGround = !!step.forceGround;
    ent.showMount = !(step.hideMount || step.clearMount) && (editorTab === "mount" || previewMountOn);
  } else {
    ent.hideMount = false;
  }
  const st=document.getElementById("pvStatus");
  if(st) st.textContent="Frame "+frame+" · "+anim+(fs!=null?" ("+fs+"→"+fe+")":"");
}

let previewMountOn = false;
function previewMountFolder(){
  const m = lookState.look && lookState.look.mount;
  if(m && m!=="None") return m;
  return "Mount1";
}

function applyPreviewClip(ent, step, isHit){
  const fs = isHit ? (step.hitFrameStart|0) : (step.frameStart|0);
  const fe = isHit ? (step.hitFrameEnd!=null?step.hitFrameEnd:FRAME_MAX) : (step.frameEnd!=null?step.frameEnd:FRAME_MAX);
  ent.frameStart = Math.max(0, Math.min(FRAME_MAX, fs));
  ent.frameEnd = Math.max(ent.frameStart, Math.min(FRAME_MAX, fe));
  ent.freezeFrame = null;
  ent.hideMount = !!(step.hideMount || step.clearMount);
  ent.forceGround = !!step.forceGround;
  if(previewMountOn || editorTab === "mount"){
    ent.showMount = !(step.hideMount || step.clearMount);
  }
}
function applyPreviewPosShift(ent, step, base){
  if(!ent || !step) return;
  const dc = clampPosCell(step.posDc);
  const dr = clampPosCell(step.posDr);
  if(!dc && !dr) return;
  let nc = (base ? base.c : ent.c) + dc;
  let nr = (base ? base.r : ent.r) + dr;
  nc = Math.max(0, Math.min(GRID-1, nc|0));
  nr = Math.max(0, Math.min(GRID-1, nr|0));
  ent.c = nc; ent.r = nr;
}
function previewAction(steps, opts){
  opts = opts || {};
  if(_previewTimer){ clearTimeout(_previewTimer); _previewTimer=null; }
  previewMountOn = !!opts.asMount || editorTab === "mount";
  const seq=(steps&&steps.length?steps:["Attack1"]).map(normalizeStep);
  let i=0;
  let mountGone = false;
  const basePos = { c: player.c|0, r: player.r|0 };
  const stEl=document.getElementById("pvStatus");
  if(stEl) stEl.textContent = previewMountOn ? "Preview monture · à cheval" : "Preview sort";
  /* Warm monture */
  if(previewMountOn){
    const mf = previewMountFolder();
    loadImg(mf, "RideIdle"); loadImg(mf, "RideRun");
    player.showMount = true; player.hideMount = false; player._mountCleared = false;
  }
  function next(){
    if(i>=seq.length){
      player.anim = previewMountOn && !mountGone ? "RideIdle" : "Idle";
      player.t0=performance.now();
      player.fxSlash=null; player.fxEffect=null;
      player.frameStart=0; player.frameEnd=FRAME_MAX; player.freezeFrame=null;
      player.hideMount = mountGone;
      player.showMount = previewMountOn && !mountGone;
      player.stepFps = null;
      /* garder la case finale après décalage (utile pour régler Die) */
      enemy.anim="Idle"; enemy.t0=performance.now();
      enemy.frameStart=0; enemy.frameEnd=FRAME_MAX; enemy.freezeFrame=null;
      if(stEl) stEl.textContent = previewMountOn ? "Fin séquence monture · case "+player.c+","+player.r : "Idle";
      return;
    }
    const step=seq[i++];
    if(step.clearMount || step.hideMount) mountGone = true;
    /* décalage cases (depuis la case de départ de la preview) */
    player.c = basePos.c; player.r = basePos.r;
    applyPreviewPosShift(player, step, basePos);
    facePlayerToEnemy();
    /* anim joueur */
    let anim = step.anim || "Idle";
    if(previewMountOn && !step.forceGround && !step.hideMount && !step.clearMount && !mountGone){
      /* rester en Ride* si Idle demandé */
      if(/^Idle$/i.test(anim)) anim = "RideIdle";
    }
    player.anim=anim; player.t0=performance.now();
    player.stepFps=step.fps||14;
    applyPreviewClip(player, step, false);
    if(mountGone){ player.hideMount = true; player.showMount = false; player._mountCleared = true; }
    /* FX */
    player.fxSlash=(step.slash&&step.slash!=="None")?step.slash:null;
    player.fxEffect=(step.effect&&step.effect!=="None")?step.effect:null;
    if(stEl) stEl.textContent = (previewMountOn?"Monture · ":"")+anim+(player.hideMount?" · sans monture":"");
    /* Hit sur la cible */
    let delay=Math.max(0, step.delay|0);
    let dur;
    if(typeof FantasyBridge!=="undefined" && FantasyBridge.animStepTiming){
      const t=FantasyBridge.animStepTiming(step, COLS);
      delay=t.delay; dur=t.dur; player.stepFps=t.fps;
    } else {
      let fps=(step.fps!=null?step.fps:14); if(fps<1) fps=14;
      player.stepFps=fps;
      const nFrames = Math.max(1, (step.frameEnd|0) - (step.frameStart|0) + 1);
      dur=Math.max(120, Math.round((nFrames/fps)*1000));
    }
    if(step.hitTarget){
      const ha = step.hitAnim && step.hitAnim!=="None" ? step.hitAnim : (step.hitAnim==="None" ? null : "TakeDamage");
      let hitMs;
      if(step.hitDelayByDist && step.hitDelay != null && step.hitDelay !== "" && step.hitDelay !== "end"){
        hitMs = hitDelayMsByDistance(step.hitDelay, chebDist(player, enemy));
      } else if(typeof FantasyBridge!=="undefined" && FantasyBridge.hitDelayMsFromStart){
        hitMs = FantasyBridge.hitDelayMsFromStart(step.hitDelay, dur);
      } else {
        const hd = step.hitDelay;
        if(hd == null || hd === "" || hd === "end" || hd === -1) hitMs = dur;
        else hitMs = Math.min(dur, Math.max(0, Number(hd)|0));
      }
      const applyEnemyHit = ()=>{
        if(ha){
          enemy.anim=ha; enemy.t0=performance.now();
          let hfps=Number(step.hitAnimFps); if(!isFinite(hfps)||hfps<1) hfps=14;
          enemy.stepFps=hfps;
          applyPreviewClip(enemy, step, true);
        }
      };
      setTimeout(()=>{
        facePlayerToEnemy();
        applyEnemyHit();
      }, delay + hitMs);
      if(stEl && step.hitDelayByDist){
        stEl.textContent = (stEl.textContent||"")+" · hit "+hitMs+"ms ("+chebDist(player,enemy)+"c)";
      }
    }
    _previewTimer=setTimeout(next, delay+dur);
  }
  /* Précharger FX */
  seq.forEach(s=>{
    if(s.slash&&s.slash!=="None") loadImg(s.slash,"Attack1");
    if(s.effect&&s.effect!=="None") loadImg(s.effect,"Attack1");
  });
  next();
}

      });

  renderSteps();

  /* ── Overlays corps ── */
  const bodyCard=card("Corps overlay (pendant l'action)");
  const bHint=document.createElement("p"); bHint.className="hint";

  const bt=document.createElement("div"); bt.className="body-tokens";

  host.appendChild(bodyCard);

  /* ── Évolutions catalogue jeu ── */
  const evoCard=card("Évolutions du jeu");
  const evHint=document.createElement("p"); evHint.className="hint";
  evHint.textContent="Chaque évo cochée s’ajoute à la chaîne (DI = 2 coups à la place de la base, puis les autres). « FX prolongé » = slash qui ne coupe pas. En combat : lance d’autres sorts pendant l’anim (combo en file). Puis Combat ▶.";
  evoCard.appendChild(evHint);

  const sEvo = ensureEditable(activeId);
  initEvoConfig(sEvo);
  const tree = getEvoTree(activeId);

  if(!tree){

    noEvo.textContent="Ce sort n'a pas de catalogue d'évolutions dans le jeu.";

  if(!isCustom){

    host.appendChild(note);
  }

/* ── Helpers UI pour les steps ── */
/** Bande frame-par-frame : 1er tap = début, 2e tap = fin. ◀▶ pour avancer. */
function mkFrameTrimRow(label, startVal, endVal, onStart, onEnd, opts){
  opts = opts || {};
  let fs = startVal!=null?startVal:0;
  let fe = endVal!=null?endVal:FRAME_MAX;
  if(fe < fs){ const t=fs; fs=fe; fe=t; }
  let pickMode = "start"; /* prochain tap */
  let scrub = fs;

  const wrap=document.createElement("div");
  wrap.style.cssText="margin:4px 0 6px;padding:6px 8px;border:1px dashed var(--line2);border-radius:8px;background:var(--bg)";
  const tip=document.createElement("div");
  tip.style.cssText="font-size:10px;color:var(--ink2);margin-bottom:4px;line-height:1.35";
  tip.textContent=label+" — tape une case = début (violet), une autre = fin (vert). ◀▶ = frame par frame.";
  wrap.appendChild(tip);

  const status=document.createElement("div");
  status.style.cssText="font-size:11px;font-weight:700;color:var(--acc);margin-bottom:4px";
  const strip=document.createElement("div"); strip.className="frame-strip";

  function paint(){
    status.textContent="Début "+fs+" → Fin "+fe+"  ·  prochain tap = "+(pickMode==="start"?"début":"fin");
    strip.innerHTML="";
    for(let i=0;i<=FRAME_MAX;i++){
      const b=document.createElement("button"); b.type="button"; b.textContent=String(i);
      if(i===fs) b.classList.add("start");
      else if(i===fe) b.classList.add("end");
      else if(i>fs && i<fe) b.classList.add("in");
      b.onclick=()=>{
        if(pickMode==="start"){
          fs=i; if(fe<fs) fe=fs; pickMode="end";
          onStart(fs); onEnd(fe);
        } else {
          fe=i; if(fe<fs){ const t=fs; fs=fe; fe=t; onStart(fs); }
          onEnd(fe); pickMode="start";
        }
        scrub = Math.max(fs, Math.min(fe, scrub));
        paint();
        if(typeof opts.onScrub==="function") opts.onScrub(scrub, fs, fe);
      };
      strip.appendChild(b);
    }
  }
  wrap.appendChild(status);
  wrap.appendChild(strip);

  const scrubRow=document.createElement("div"); scrubRow.className="frame-scrub";
  const prevB=document.createElement("button"); prevB.type="button"; prevB.textContent="◀";
  const scrubLab=document.createElement("span");
  scrubLab.style.cssText="font-size:12px;font-weight:700;min-width:72px;text-align:center";
  const nextB=document.createElement("button"); nextB.type="button"; nextB.textContent="▶";
  function setScrub(v){
    scrub = Math.max(fs, Math.min(fe, v));
    scrubLab.textContent="Frame "+scrub;
    if(typeof opts.onScrub==="function") opts.onScrub(scrub, fs, fe);
  }
  prevB.onclick=()=>setScrub(scrub-1);
  nextB.onclick=()=>setScrub(scrub+1);
  scrubRow.appendChild(prevB); scrubRow.appendChild(scrubLab); scrubRow.appendChild(nextB);
  wrap.appendChild(scrubRow);

  paint();
  setScrub(fs);
  return wrap;
}
/** Remplit les contrôles anim communs (FX, FPS, trim, hit…). opts.mountExtra = hideMount/clearMount/forceGround */
function fillAnimStepControls(box, st, opts){
  opts = opts || {};
  const onSave = opts.onSave || (()=> scheduleAutoSave());
  const onRerender = opts.onRerender || (()=>{});
  const anims = opts.anims || ALL_ANIMS;

  box.appendChild(mkSelectRow("Animation", anims, st.anim, v=>{ st.anim=v; onSave(); }));
  if(opts.showMove !== false){
    box.appendChild(mkSelectRow("Mouvement joueur", MOVE_ANIMS_LIST, st.move||"Idle", v=>{ st.move=v; onSave(); }));
  }
  box.appendChild(mkSelectRow("FX Slash", fxSlashList(), st.slash||"None", v=>{ st.slash=v; onSave(); }));
  box.appendChild(mkSelectRow("FX Effect", fxEffectList(), st.effect||"None", v=>{ st.effect=v; onSave(); }));
  box.appendChild(mkCheckRow("FX prolongé (slash ne coupe pas)", !!st.fxHold, v=>{ st.fxHold=v; onSave(); }));
  box.appendChild(mkNumRow("Pause avant ton anim (ms)", st.delay||0, 0, 3000, 50, v=>{ st.delay=v; onSave(); }));
  box.appendChild(mkNumRow("Vitesse ton anim (FPS)", st.fps||14, 1, FPS_MAX, 1, v=>{ st.fps=v; onSave(); }));
  box.appendChild(mkFrameTrimRow("Portion d’anim (toi)", st.frameStart, st.frameEnd,
    v=>{ st.frameStart=v; if(st.frameEnd < v) st.frameEnd=v; onSave(); onRerender(); },
    v=>{ st.frameEnd=v; if(st.frameStart > v) st.frameStart=v; onSave(); onRerender(); },
    { onScrub:(frame, a, b)=>{
        freezePreviewFrame(player, st.anim||"Idle", frame, a, b, st);
      }}
  ));

  if(opts.mountExtra){
    box.appendChild(mkCheckRow("Forcer anim à pied (pas Ride*)", !!st.forceGround, v=>{ st.forceGround=v; onSave(); }));
    box.appendChild(mkCheckRow("Cacher la monture (ce step)", !!st.hideMount, v=>{ st.hideMount=v; onSave(); }));
    box.appendChild(mkCheckRow("Désarçonner (retire la monture)", !!st.clearMount, v=>{ st.clearMount=v; onSave(); }));
    const posTip=document.createElement("p");
    posTip.className="hint";
    posTip.style.cssText="margin:6px 0 2px;font-size:10px;line-height:1.35";
    posTip.textContent="Décalage sur les cases (corrige le recul visuel de Die). 0 = case actuelle. −/+ = 1 case.";
    box.appendChild(posTip);
    box.appendChild(mkNumRow("Décalage cases → (c)", st.posDc!=null?st.posDc:0, -3, 3, 1, v=>{ st.posDc=v; onSave(); }));
    box.appendChild(mkNumRow("Décalage cases ↓ (r)", st.posDr!=null?st.posDr:0, -3, 3, 1, v=>{ st.posDr=v; onSave(); }));
  }

  if(opts.showHit !== false){
    box.appendChild(mkCheckRow("Frappe la cible", !!st.hitTarget, v=>{ st.hitTarget=v; onSave(); onRerender(); }));
    if(st.hitTarget){
      box.appendChild(mkSelectRow("Réaction ennemi", HIT_REACT_ANIMS, st.hitAnim||"TakeDamage", v=>{ st.hitAnim=v; onSave(); }));
      box.appendChild(mkNumRow("FPS réaction", st.hitAnimFps!=null?st.hitAnimFps:14, 1, FPS_MAX, 1, v=>{ st.hitAnimFps=v; onSave(); }));
      box.appendChild(mkCheckRow("Délai × distance (exponentiel)", !!st.hitDelayByDist, v=>{
        st.hitDelayByDist=v;
        if(v && (st.hitDelay==null || st.hitDelay==="")) st.hitDelay=180;
        onSave(); onRerender();
      }));
      if(st.hitDelayByDist){
        const tip=document.createElement("p"); tip.className="hint";
        tip.style.cssText="margin:4px 0;font-size:10px;line-height:1.35";
        const paintTip=()=>{
          const b = Math.max(0, Number(st.hitDelay!=null?st.hitDelay:180)|0);
          tip.textContent="Latence 1 case = base. 2c = ×2, 3c = ×4, 4c = ×8…  Ex. base "+b+" → 1c="+b+" · 2c="+(b*2)+" · 3c="+(b*4)+" ms. TakeDamage après ce délai (le tireur se tourne vers la cible).";
        };
        paintTip();
        box.appendChild(tip);
        /* Pas de onRerender ici : l’appui long +/- détruirait le DOM en boucle (= plantage). */
        box.appendChild(mkNumRow("Latence 1 case (ms)", st.hitDelay!=null?st.hitDelay:180, 0, 2000, 10, v=>{
          st.hitDelay=v; paintTip(); onSave();
        }));
      } else {
        box.appendChild(mkHitDelayRow(st.hitDelay, v=>{ st.hitDelay=v; onSave(); }));
      }
      box.appendChild(mkFrameTrimRow("Portion réaction (ennemi)", st.hitFrameStart, st.hitFrameEnd,
        v=>{ st.hitFrameStart=v; if(st.hitFrameEnd < v) st.hitFrameEnd=v; onSave(); onRerender(); },
        v=>{ st.hitFrameEnd=v; if(st.hitFrameStart > v) st.hitFrameStart=v; onSave(); onRerender(); },
        { onScrub:(frame, a, b)=>{
            freezePreviewFrame(enemy, st.hitAnim||"TakeDamage", frame, a, b, null);
          }}
      ));
    }
  }
}

function mkSelectRow(label, opts, val, onChange){
  const d=document.createElement("div");
  d.style.cssText="display:flex;align-items:center;gap:6px;margin-bottom:4px";
  const lb=document.createElement("span"); lb.style.cssText="font-size:11px;color:var(--ink2);min-width:90px;flex-shrink:0"; lb.textContent=label;
  const sel=document.createElement("select");
  sel.style.cssText="flex:1;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--soft);font-size:11px";
  opts.forEach(o=>{ const op=document.createElement("option"); op.value=o; op.textContent=o; if(o===val) op.selected=true; sel.appendChild(op); });
  sel.onchange=()=>onChange(sel.value);
  d.appendChild(lb); d.appendChild(sel); return d;
}
function mkNumRow(label, val, min, max, step, onChange){
  let cur = Number(val); if(!isFinite(cur)) cur = min;
  cur = Math.max(min, Math.min(max, cur));
  const d=document.createElement("div");
  d.style.cssText="display:flex;align-items:center;gap:6px;margin-bottom:6px";
  const lb=document.createElement("span"); lb.style.cssText="font-size:11px;color:var(--ink2);min-width:90px;flex-shrink:0"; lb.textContent=label;
  const btns=document.createElement("div"); btns.className="step-btns";
  const minus=document.createElement("button"); minus.type="button"; minus.textContent="−";
  const disp=document.createElement("span"); disp.className="val"; disp.textContent=String(cur);
  const plus=document.createElement("button"); plus.type="button"; plus.textContent="+";
  const apply=(v)=>{
    if(!isFinite(v)) v=min;
    v=Math.max(min, Math.min(max, v));
    /* aligner sur le step */
    const st = step > 0 ? step : 1;
    v = Math.round(v / st) * st;
    v=Math.max(min, Math.min(max, v));
    cur=v; disp.textContent=String(cur); onChange(cur);
  };
  minus.onclick=()=>apply(cur - (step||1));
  plus.onclick=()=>apply(cur + (step||1));
  /* appui long = répéter (stop si le bouton a été retiré du DOM) */
  function hold(btn, dir){
    let t=null, iv=null;
    const go=()=>{
      if(!btn.isConnected){ clearTimeout(t); clearInterval(iv); return; }
      apply(cur + dir*(step||1));
    };
    btn.onpointerdown=(e)=>{ e.preventDefault(); go(); t=setTimeout(()=>{ iv=setInterval(go, 80); }, 350); };
    const stop=()=>{ clearTimeout(t); clearInterval(iv); };
    btn.onpointerup=stop; btn.onpointerleave=stop; btn.onpointercancel=stop;
  }
  hold(minus, -1); hold(plus, 1);
  btns.appendChild(minus); btns.appendChild(disp); btns.appendChild(plus);
  d.appendChild(lb); d.appendChild(btns); return d;
}
function mkCheckRow(label, val, onChange){
  const d=document.createElement("label");
  d.style.cssText="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin-bottom:4px;cursor:pointer";
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!val;
  cb.onchange=()=>onChange(cb.checked);
  d.appendChild(cb); d.appendChild(document.createTextNode(label)); return d;
}
/** Délai impact : null = fin d’anim ; nombre (0+) = ms après le début de ton attaque. */
function mkHitDelayRow(val, onChange){
  const wrap=document.createElement("div");
  wrap.style.cssText="margin-bottom:6px;padding:6px 8px;border:1px dashed var(--line2);border-radius:8px;background:var(--bg)";
  const tip=document.createElement("div");
  tip.style.cssText="font-size:10px;color:var(--ink2);margin-bottom:4px;line-height:1.35";
  tip.textContent="Quand TakeDamage commence : ms après le début de TON attaque. 0 = tout de suite. Décoche « fin d’anim » pour régler avant la fin.";
  wrap.appendChild(tip);
  const atEnd = val == null || val === "" || val === false || val === "end" || val === -1;
  const row=document.createElement("label");
  row.style.cssText="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin-bottom:4px;cursor:pointer";
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=atEnd;
  row.appendChild(cb);
  row.appendChild(document.createTextNode("TakeDamage à la fin de mon anim"));
  wrap.appendChild(row);
  const numHost=document.createElement("div");
  const paintNum=()=>{
    numHost.innerHTML="";
    const cur = (val != null && val !== "" && val !== "end" && val !== false) ? (Number(val)|0) : 0;
    numHost.appendChild(mkNumRow("Délai impact (ms)", cur, 0, 2000, 10, v=>{
      onChange(v); val=v;
    }));
  };
  cb.onchange=()=>{
    if(cb.checked){ onChange(null); val=null; numHost.innerHTML=""; }
    else { onChange(0); val=0; paintNum(); }
  };
  wrap.appendChild(numHost);
  if(!atEnd) paintNum();
  return wrap;
}

    const hint=document.createElement("div");
    hint.style.cssText="font-size:10px;color:var(--ink2);margin-bottom:6px;line-height:1.35";
    hint.textContent="Choisis une anim différente par coup (sinon la même est rejouée ×2).";
    div.appendChild(hint);
    div.appendChild(mkSelectRow("Coup 1 · anim attaque", ALL_ANIMS, entry.anim1||entry.anim||choice.anim||"Attack1", v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.anim1=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkNumRow("Coup 1 · FPS attaque", entry.fps1!=null?entry.fps1:(entry.fps!=null?entry.fps:14), 1, FPS_MAX, 1, v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.fps1=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkFrameTrimRow("Coup 1 · portion anim",
      entry.frameStart1!=null?entry.frameStart1:(entry.frameStart|0),
      entry.frameEnd1!=null?entry.frameEnd1:(entry.frameEnd!=null?entry.frameEnd:FRAME_MAX),
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.frameStart1=v; scheduleAutoSave(); } },
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.frameEnd1=v; scheduleAutoSave(); } }
    ));
    div.appendChild(mkSelectRow("Coup 1 · réaction", HIT_REACT_ANIMS, entry.hitAnim1||entry.hitAnim||"TakeDamage", v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.hitAnim1=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkNumRow("Coup 1 · FPS réaction", entry.hitAnimFps1!=null?entry.hitAnimFps1:(entry.hitAnimFps!=null?entry.hitAnimFps:14), 1, FPS_MAX, 1, v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.hitAnimFps1=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkHitDelayRow(entry.hitDelay1!=null?entry.hitDelay1:entry.hitDelay, v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.hitDelay1=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkFrameTrimRow("Coup 1 · portion réaction",
      entry.hitFrameStart1!=null?entry.hitFrameStart1:0,
      entry.hitFrameEnd1!=null?entry.hitFrameEnd1:FRAME_MAX,
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.hitFrameStart1=v; scheduleAutoSave(); } },
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.hitFrameEnd1=v; scheduleAutoSave(); } }
    ));
    div.appendChild(mkSelectRow("Coup 2 · anim attaque", ALL_ANIMS, entry.anim2||entry.anim||choice.anim||"Attack1", v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.anim2=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkNumRow("Coup 2 · FPS attaque", entry.fps2!=null?entry.fps2:(entry.fps!=null?entry.fps:14), 1, FPS_MAX, 1, v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.fps2=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkFrameTrimRow("Coup 2 · portion anim",
      entry.frameStart2!=null?entry.frameStart2:(entry.frameStart|0),
      entry.frameEnd2!=null?entry.frameEnd2:(entry.frameEnd!=null?entry.frameEnd:FRAME_MAX),
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.frameStart2=v; scheduleAutoSave(); } },
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.frameEnd2=v; scheduleAutoSave(); } }
    ));
    div.appendChild(mkSelectRow("Coup 2 · réaction", HIT_REACT_ANIMS, entry.hitAnim2||entry.hitAnim||"TakeDamage", v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.hitAnim2=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkNumRow("Coup 2 · FPS réaction", entry.hitAnimFps2!=null?entry.hitAnimFps2:(entry.hitAnimFps!=null?entry.hitAnimFps:14), 1, FPS_MAX, 1, v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.hitAnimFps2=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkHitDelayRow(entry.hitDelay2!=null?entry.hitDelay2:entry.hitDelay, v=>{
      const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice);
      if(e){ e.hitDelay2=v; scheduleAutoSave(); }
    }));
    div.appendChild(mkFrameTrimRow("Coup 2 · portion réaction",
      entry.hitFrameStart2!=null?entry.hitFrameStart2:0,
      entry.hitFrameEnd2!=null?entry.hitFrameEnd2:FRAME_MAX,
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.hitFrameStart2=v; scheduleAutoSave(); } },
      v=>{ const s2=ensureEditable(spellId); const e=evoEntry(s2, tier, choice); if(e){ e.hitFrameEnd2=v; scheduleAutoSave(); } }
    ));
  }

  const testB=document.createElement("button"); testB.type="button"; testB.className="test-btn";
  testB.textContent="▶ Tester";
  testB.onclick=()=>{
    const s2=ensureEditable(spellId);
    const e=evoEntry(s2, tier, choice);
    const isDI=/Double Impact|Déchirure|Salve/i.test(choice.name||"");
    if(isDI){
      const mk=(n)=>({
        anim: (e&&(e["anim"+n]||e.anim))||choice.anim||"Attack1",
        delay: n===1 ? ((e&&e.delay)||0) : 0,
        fps: (e&&(e["fps"+n]!=null?e["fps"+n]:e.fps))!=null?(e["fps"+n]!=null?e["fps"+n]:e.fps):14,
        slash: (e&&e.slash)||"None",
        effect: (e&&e.effect)||"None",
        hitTarget:true,
        hitAnim: (e&&(e["hitAnim"+n]||e.hitAnim))||"TakeDamage",
        hitAnimFps: (e&&(e["hitAnimFps"+n]!=null?e["hitAnimFps"+n]:e.hitAnimFps))!=null?(e["hitAnimFps"+n]!=null?e["hitAnimFps"+n]:e.hitAnimFps):14,
        hitDelay: (e&&(e["hitDelay"+n]!=null?e["hitDelay"+n]:e.hitDelay))!=null?(e["hitDelay"+n]!=null?e["hitDelay"+n]:e.hitDelay):null,
        frameStart: (e&&(e["frameStart"+n]!=null?e["frameStart"+n]:e.frameStart))!=null?(e["frameStart"+n]!=null?e["frameStart"+n]:e.frameStart):0,
        frameEnd: (e&&(e["frameEnd"+n]!=null?e["frameEnd"+n]:e.frameEnd))!=null?(e["frameEnd"+n]!=null?e["frameEnd"+n]:e.frameEnd):FRAME_MAX,
        hitFrameStart: (e&&(e["hitFrameStart"+n]!=null?e["hitFrameStart"+n]:e.hitFrameStart))!=null?(e["hitFrameStart"+n]!=null?e["hitFrameStart"+n]:e.hitFrameStart):0,
        hitFrameEnd: (e&&(e["hitFrameEnd"+n]!=null?e["hitFrameEnd"+n]:e.hitFrameEnd))!=null?(e["hitFrameEnd"+n]!=null?e["hitFrameEnd"+n]:e.hitFrameEnd):FRAME_MAX,
        fxHold: !!(e&&e.fxHold),
      });
      previewAction([normalizeStep(mk(1)), normalizeStep(mk(2))]);
      return;
    }
    previewAction([normalizeStep({
      anim: (e&&e.anim)||choice.anim||"Attack1",
      delay:(e&&e.delay)||0,
      fps:(e&&e.fps)||14,
      slash:(e&&e.slash)||"None",
      effect:(e&&e.effect)||"None",
      hitTarget:true,
      hitAnim:(e&&e.hitAnim)||"TakeDamage",
      hitAnimFps:(e&&e.hitAnimFps)!=null?e.hitAnimFps:14,
      hitDelay:(e&&e.hitDelay)!=null?e.hitDelay:null,
      frameStart:(e&&e.frameStart)!=null?e.frameStart:0,
      frameEnd:(e&&e.frameEnd)!=null?e.frameEnd:FRAME_MAX,
      hitFrameStart:(e&&e.hitFrameStart)!=null?e.hitFrameStart:0,
      hitFrameEnd:(e&&e.hitFrameEnd)!=null?e.hitFrameEnd:FRAME_MAX,
      fxHold:!!(e&&e.fxHold),
    })]);
  };
  div.appendChild(testB);
  return div;
}

/* ── Helpers UI ── */
function renderMountHitEditor(host){
  const cardEl=card("Dégâts reçus sur monture");
  const hint=document.createElement("p"); hint.className="hint";
  hint.textContent="Simple : touché à cheval → monture off + TakeDamage @ 24 fps. ► Voir la chute pour tester.";
  cardEl.appendChild(hint);

  cardEl.appendChild(mkCheckRow("Activer la séquence monture", !!mountHit.enabled, v=>{
    mountHit.enabled=v; saveMountHit();
  }));

  /* Gros bouton preview immédiatement visible */
  const bigPv=document.createElement("button"); bigPv.type="button";
  bigPv.textContent="▶ Voir la chute";
  bigPv.style.cssText="margin:8px 0;padding:12px;border-radius:10px;background:var(--ok);color:#fff;border:none;font-weight:800;cursor:pointer;width:100%;font-size:14px";
  bigPv.onclick=()=>{
    previewMountOn = true;
    player.showMount = true; player.hideMount = false;
    previewAction(mountHit.steps||[], { asMount:true });
  };
  cardEl.appendChild(bigPv);

  function renderMountSteps(){
    const existing=cardEl.querySelector(".steps-wrap");
    if(existing) existing.remove();
    const wrap=document.createElement("div"); wrap.className="steps-wrap";
    wrap.style.cssText="display:flex;flex-direction:column;gap:8px;margin-top:6px";
    if(!Array.isArray(mountHit.steps)) mountHit.steps=[];
    mountHit.steps.forEach((step,idx)=>{
      const st=normalizeStep(step); mountHit.steps[idx]=st;
      const box=document.createElement("div");
      box.style.cssText="border:1.5px solid var(--line2);border-radius:10px;padding:8px;background:var(--soft);position:relative";
      const hdr=document.createElement("div"); hdr.style.cssText="display:flex;align-items:center;gap:6px;margin-bottom:6px";
      const num=document.createElement("span"); num.style.cssText="font-size:10px;font-weight:700;color:var(--acc);min-width:18px";
      num.textContent="Step "+(idx+1);
      const delB=document.createElement("button"); delB.type="button"; delB.textContent="×";
      delB.style.cssText="margin-left:auto;background:#fee;border:1px solid #fcc;color:#c00;border-radius:6px;padding:0 7px;cursor:pointer;font-weight:700";
      delB.onclick=()=>{ mountHit.steps.splice(idx,1); saveMountHit(); renderMountSteps(); };
      hdr.appendChild(num); hdr.appendChild(delB); box.appendChild(hdr);

      fillAnimStepControls(box, st, {
        onSave: ()=> saveMountHit(),
        onRerender: ()=> renderMountSteps(),
        showMove: false,
        showHit: false,
        mountExtra: true,
      });

      const pvB=document.createElement("button"); pvB.type="button"; pvB.textContent="▶ Tester ce step (à cheval)";
      pvB.style.cssText="margin-top:6px;padding:5px 12px;border-radius:8px;background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;font-size:11px";
      pvB.onclick=()=>previewAction([st], { asMount:true });
      box.appendChild(pvB);
      wrap.appendChild(box);
    });

    const addB=document.createElement("button"); addB.type="button"; addB.textContent="+ Ajouter une étape";
    addB.style.cssText="padding:9px;border-radius:9px;border:1.5px dashed var(--acc);background:none;color:var(--acc);font-weight:700;cursor:pointer;width:100%";
    addB.onclick=()=>{
      mountHit.steps.push(normalizeStep({
        anim:"TakeDamage", forceGround:true, hideMount:true, clearMount:true, fps:24, posDc:0, posDr:0,
      }));
      saveMountHit(); renderMountSteps();
    };
    wrap.appendChild(addB);

    const allB=document.createElement("button"); allB.type="button"; allB.textContent="▶ Voir la chute (toute la séquence)";
    allB.style.cssText="margin-top:4px;padding:9px;border-radius:9px;background:var(--acc);color:#fff;border:none;font-weight:700;cursor:pointer;width:100%";
    allB.onclick=()=>previewAction(mountHit.steps||[], { asMount:true });
    wrap.appendChild(allB);

    const resetB=document.createElement("button"); resetB.type="button"; resetB.textContent="↩ Remettre la séquence par défaut";
    resetB.style.cssText="margin-top:4px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:700;cursor:pointer;width:100%;font-size:11px";
    resetB.onclick=()=>{
      mountHit = JSON.parse(JSON.stringify(DEFAULT_MOUNT_HIT));
      saveMountHit(); renderEditor();
    };
    wrap.appendChild(resetB);

    cardEl.appendChild(wrap);
  }
  renderMountSteps();
  host.appendChild(cardEl);

  const tip=document.createElement("p");
  tip.style.cssText="font-size:11px;color:var(--ink2);text-align:center;padding:8px";
  tip.textContent="Par défaut : monture disparaît + TakeDamage à 24 fps, puis Idle. Pas besoin de calibrer Die.";
  host.appendChild(tip);
}

function wireEditorTabs(){
  document.querySelectorAll("#editorTabs button").forEach(b=>{
    b.onclick=()=>{
      editorTab = b.getAttribute("data-tab") || "spell";
      if(editorTab === "mount"){
        previewMountOn = true;
        player.showMount = true;
        player.hideMount = false;
        player.anim = "RideIdle";
        player.t0 = performance.now();
        player.frameStart = 0; player.frameEnd = FRAME_MAX; player.freezeFrame = null;
        const mf = previewMountFolder();
        loadImg(mf, "RideIdle"); loadImg(mf, "RideRun");
        const st=document.getElementById("pvStatus");
        if(st) st.textContent="Preview · à cheval — règle tes steps puis ▶ Voir la chute";
      } else {
        previewMountOn = false;
        player.showMount = false;
        player.hideMount = false;
        player.anim = "Idle";
        player.t0 = performance.now();
      }
      renderEditor();
    };
  });
}
function card(title){
  const d=document.createElement("div"); d.className="card";
  const h=document.createElement("h3"); h.textContent=title; d.appendChild(h);
  return d;
}
function mkRow2(...els){
  const d=document.createElement("div"); d.className="row2";
  els.forEach(e=>d.appendChild(e)); return d;
}
function fieldText(label, val, key, placeholder, textarea){
  const lbl=document.createElement("label"); lbl.className="field";
  lbl.innerHTML=`<span>${label}</span>`;
  const inp=textarea?document.createElement("textarea"):document.createElement("input");
  if(!textarea) inp.type="text"; inp.value=val||""; if(placeholder) inp.placeholder=placeholder;
  inp.oninput=()=>{
    const s2=ensureEditable(activeId);
    if(key==="dmgMin"){ if(!s2.dmg) s2.dmg=[0,0]; s2.dmg[0]=parseInt(inp.value)||0; }
    else if(key==="dmgMax"){ if(!s2.dmg) s2.dmg=[0,0]; s2.dmg[1]=parseInt(inp.value)||0; }
    else s2[key]=inp.value;
    if(key==="name") renderNav();
  };
  lbl.appendChild(inp); return lbl;
}
function fieldNum(label, val, key, min, max){
  /* Même UX −/+ que FPS/délais (pas de champ number / barre au doigt) */
  return mkNumRow(label, val||0, min, max, 1, v=>{
    const s2=ensureEditable(activeId);
    s2[key]=v;
    scheduleAutoSave();
  });
}
function fieldSelect(label, val, key, opts){
  const lbl=document.createElement("label"); lbl.className="field";
  lbl.innerHTML=`<span>${label}</span>`;
  const sel=document.createElement("select");
  opts.forEach(o=>{ const op=document.createElement("option"); op.value=o; op.textContent=o; if(o===val) op.selected=true; sel.appendChild(op); });
  sel.onchange=()=>{
    const s2=ensureEditable(activeId);
    s2[key]=sel.value==="none"?"":sel.value;
    scheduleAutoSave();
  };
  lbl.appendChild(sel); return lbl;
}
function fieldTextEvo(label, val, key, evoIdx){
  const lbl=document.createElement("label"); lbl.className="field";
  lbl.innerHTML=`<span>${label}</span>`;
  const inp=document.createElement("input"); inp.type="text"; inp.value=val||"";
  inp.oninput=()=>{ const s2=ensureEditable(activeId); if(s2.evos&&s2.evos[evoIdx]) s2.evos[evoIdx][key]=inp.value; };
  lbl.appendChild(inp); return lbl;
}
function fieldTextAreaEvo(label, val, key, evoIdx){
  const lbl=document.createElement("label"); lbl.className="field";
  lbl.innerHTML=`<span>${label}</span>`;
  const ta=document.createElement("textarea"); ta.value=val||""; ta.placeholder="Décris l'amélioration…";
  ta.oninput=()=>{ const s2=ensureEditable(activeId); if(s2.evos&&s2.evos[evoIdx]) s2.evos[evoIdx][key]=ta.value; };
  lbl.appendChild(ta); return lbl;
}

/* ────────────────────────────────────────────────────────────
   Init
──────────────────────────────────────────────────────────── */
function boot(){
  wireFccNav();
  loadCustom(); loadLook();
  if(allSpells().length) activeId=allSpells()[0].id;

  /* Resize en premier — fallbacks multiples pour mobile Safari */
  (function resizePvEarly(){
    const vh = window.innerHeight || document.documentElement.clientHeight || 667;
    const h=Math.max(180, Math.round(vh*0.32));
    canvas.width=Math.max(320, canvas.parentElement ? canvas.parentElement.clientWidth : 390);
    canvas.height=h; canvas.style.height=h+"px";
    document.getElementById("previewWrap").style.height=h+"px";
  })();

  renderNav(); renderEditor();
  wireEditorTabs();

  /* Démarrer la boucle immédiatement — les sprites arrivent au fur et à mesure */
  document.getElementById("pvStatus").textContent = "Chargement…";
  drawLoop();

  /* Précharger en arrière-plan (priorité : Idle + Attack1 en premier) */
  const WARM_ANIMS_PRIO = ["Idle","Attack1","Attack2","Kick","TakeDamage"];
  const WARM_ANIMS_REST = ["Walk","Run","Attack3","Attack4","Attack5","Attack6",
                           "Special1","Die","Rolling","Slide","Taunt","AttackRun","AttackRun2"];
  const coreFolders = ["NakedBody","Head3"];
  const playerFolders = playerLayers().map(l=>l.folder).filter(Boolean);
  const allFolders = [...new Set([...coreFolders,...playerFolders])];
  /* Priorité haute */
  const prioJobs = [];
  allFolders.forEach(f=> WARM_ANIMS_PRIO.forEach(a=>{ prioJobs.push(loadImg(f,a)); }));
  /* Ennemi preview */
  ["NakedBody","Head3"].forEach(f=> WARM_ANIMS_PRIO.forEach(a=> prioJobs.push(loadImg(f,a)) ));
  Promise.allSettled(prioJobs).then(results=>{
    const ok=results.filter(r=>r.status==="fulfilled"&&r.value).length;
    const st=document.getElementById("pvStatus");
    if(ok>=6) st.textContent="Prêt ✓";
    else if(ok>0) st.textContent="Sprites "+ok+"/"+prioJobs.length+"…";
    else{
      st.textContent="Chargement sprites CDN…";
      setTimeout(()=>{
        allFolders.concat(["NakedBody","Head3"]).forEach(f=>{
          WARM_ANIMS_PRIO.forEach(a=> loadImg(f,a));
        });
      }, 1500);
    }
    allFolders.forEach(f=> WARM_ANIMS_REST.forEach(a=>loadImg(f,a)));
    ["Slash1","Slash2","Effect1","Effect2","Effect3"].forEach(fx=>{
      loadImg(fx,"Attack1"); loadImg(fx,"Special1");
    });
  });

  document.getElementById("btnSave").onclick=()=>{
    saveCustom();
    saveMountHit();
    showSavedStatus();
    setTimeout(()=>{ document.getElementById("pvStatus").textContent="Sauvé ✓"; showSavedStatus(); }, 800);
    setTimeout(()=>renderNav(),100);
  };
  document.getElementById("btnCombatGo").onclick=()=>{ saveMountHit(); goCombat(); };
  document.getElementById("btnCopySave").onclick=()=> copySpellsBackup();
  document.getElementById("btnPasteSave").onclick=async()=>{
    if(await pasteSpellsBackup()){
      if(!activeId && customSpells[0]) activeId=customSpells[0].id;
      renderNav(); renderEditor(); showSavedStatus();
      document.getElementById("pvStatus").textContent="Config restaurée ✓ · "+customSpells.length+" sort(s)";
    } else {
      document.getElementById("pvStatus").textContent="Import échoué — vérifie le JSON";
    }
  };
  document.getElementById("btnRestoreCoup").onclick=()=> restorePresetCoupBrut();
  if(/(?:^|[?&])restore=(coup-brut|spells)/i.test(location.search||"")) restorePresetCoupBrut();
  showSavedStatus();

  function resizePv(){
    const vh = window.innerHeight || document.documentElement.clientHeight || 667;
    const h=Math.max(180, Math.round(vh*0.32));
    canvas.width=Math.max(320, canvas.parentElement ? canvas.parentElement.clientWidth : 390);
    canvas.height=h; canvas.style.height=h+"px";
    document.getElementById("previewWrap").style.height=h+"px";
  }
  window.addEventListener("resize",resizePv);
}
boot();
})();
