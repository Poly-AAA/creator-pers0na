<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{if(localStorage.getItem("roguelite.theme")==="dark")document.documentElement.classList.add("dark");}catch(e){}</script>
<title>Arène</title>
<link rel="stylesheet" href="css/skin-d.css">
</head>
<body class="skin-d">
<div class="orient" aria-label="Paysage"><svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><rect x="26" y="8" width="18" height="34" fill="none" stroke="currentColor" stroke-width="3"/><path d="M10 44c10 12 34 12 44 0" fill="none" stroke="#EA7020" stroke-width="3"/><path d="M50 40l6 6-8 1z" fill="#EA7020"/></svg></div>
<div class="app-hub">
  <div class="hazard" aria-hidden="true"></div>
  <header class="topbar">
    <h1 id="title">ARÈNE</h1>
    <div class="top-tools">
      <button type="button" id="themeBtn" aria-label="Thème"></button>
      <div class="badge" id="badge">●</div>
    </div>
  </header>
  <main class="screen" id="screen"></main>
  <nav class="footer-links" aria-label="Ateliers">
    <a href="character-creator-fantasy.html" aria-label="Créateur"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.2" r="2.2" fill="currentColor"/><path fill="currentColor" d="M4 14v-2c0-2 1.8-3.4 4-3.4s4 1.4 4 3.4v2z"/></svg></a>
    <a href="fantasy-combat.html" aria-label="Combat libre"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.2 12.4L9.6 5l1.2 1.2-7.4 7.4-1.2-1.2zm9.2-8.2L5 10.6l1.2 1.2 6.4-6.4-1.2-1.2z"/></svg></a>
    <a href="spell-editor.html" aria-label="Éditeur de sorts"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1l1.6 4.6L14 7l-4.4 1.4L8 13l-1.6-4.6L2 7l4.4-1.4z"/></svg></a>
  </nav>
</div>
<script>
(function(){
  var KEY="roguelite.theme";
  var sun="<svg viewBox='0 0 16 16' aria-hidden='true'><circle cx='8' cy='8' r='2.6' fill='currentColor'/><path stroke='currentColor' stroke-width='1.5' d='M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4'/></svg>";
  var moon="<svg viewBox='0 0 16 16' aria-hidden='true'><path fill='currentColor' d='M9.2 1.6a5.6 5.6 0 1 0 5.2 7.6 4.6 4.6 0 0 1-5.2-7.6z'/></svg>";
  function apply(){
    var dark=false;
    try{ dark=localStorage.getItem(KEY)==="dark"; }catch(e){}
    document.documentElement.classList.toggle("dark", dark);
    var b=document.getElementById("themeBtn");
    if(b) b.innerHTML= dark ? sun : moon;
  }
  apply();
  var b=document.getElementById("themeBtn");
  if(b) b.addEventListener("click", function(){
    var next=document.documentElement.classList.contains("dark") ? "light" : "dark";
    try{ localStorage.setItem(KEY, next); }catch(e){}
    apply();
  });
})();
</script>
<script type="module" src="js/hub.js"></script>
</body>
</html>
