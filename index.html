<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEURO CORE — Phase 1 · Corps customisable</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin:0; height:100%; background:#0a0d0a; color:#e8e8e0; font-family:'Segoe UI', Arial, sans-serif; overflow:hidden; }
  .app { height:100dvh; display:flex; flex-direction:column; }
  .topbar {
    flex:0 0 auto;
    background: linear-gradient(180deg,#b81c1c,#7a1010);
    padding:8px 12px;
    font-size:12px; font-weight:700; text-align:center; letter-spacing:1px;
  }
  .info { flex:0 0 auto; font-size:11px; color:#9aa; text-align:center; padding:4px 8px; min-height:16px; }
  .stage { flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; }
  svg { width:min(94%, 62dvh); height:auto; touch-action: manipulation; }
  .tile { stroke:#173a28; stroke-width:1.5; cursor:pointer; transition: fill 0.1s; }
  .tile.light { fill:#3f7a54; }
  .tile.dark  { fill:#2f6b48; }
  .tile.selected { fill:#6fd8c8; }
  .controls {
    flex:0 0 auto; background:#16211a; border-top:1px solid #000;
    display:flex; flex-direction:column; max-height:48dvh; min-height:0;
  }
  .tabs {
    flex:0 0 auto; display:flex; gap:0; border-bottom:1px solid #243328;
    background:#101810;
  }
  .tab-btn {
    flex:1 1 0; background:transparent; border:none; border-bottom:2px solid transparent;
    color:#889; padding:10px 6px; font-size:12px; font-weight:600; cursor:pointer;
    letter-spacing:0.3px;
  }
  .tab-btn:hover { color:#ccd; background:#1a241c; }
  .tab-btn.active {
    color:#6fd8c8; border-bottom-color:#6fd8c8; background:#16211a;
  }
  .tab-panels { flex:1 1 auto; overflow-y:auto; padding:10px 12px; min-height:0; }
  .tab-panel { display:none; flex-direction:column; gap:8px; }
  .tab-panel.active { display:flex; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row label { font-size:11px; color:#ccd; flex:0 0 88px; }
  .row input[type=range] { flex:1 1 auto; accent-color:#6fd8c8; min-width:60px; }
  .row input[type=color] {
    width:36px; height:28px; padding:0; border:1px solid #2a4a33;
    background:#1f2e24; border-radius:4px; cursor:pointer;
  }
  .row .val { font-size:10px; color:#8a9; min-width:28px; text-align:right; }
  .btn-group { display:flex; gap:6px; flex-wrap:wrap; }
  .ctrl-btn {
    background:#1f2e24; border:2px solid #2a4a33; color:#aabb;
    padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { background:#2a4a33; }
  .ctrl-btn.active { background:#3f7a54; border-color:#6fd8c8; color:#fff; font-weight:bold; }
  .section-title {
    font-size:10px; color:#6fd8c8; letter-spacing:0.8px; text-transform:uppercase;
    margin-top:2px; padding-top:6px; border-top:1px solid #243328;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .section-title:first-child { border-top:none; padding-top:0; margin-top:0; }
  .slider-grid { display:flex; flex-direction:column; gap:4px; }
  .slider-row {
    display:grid;
    grid-template-columns: 78px 1fr 32px;
    align-items:center; gap:6px;
  }
  .slider-row span.label { font-size:10px; color:#9aa; }
  .slider-row span.num { font-size:10px; color:#6fd8c8; text-align:right; font-variant-numeric: tabular-nums; }
  .slider-row input[type=range] { width:100%; accent-color:#6fd8c8; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">NEURO CORE — Phase 1 · Corps customisable par tronçon</div>
  <div class="info" id="info">Utilise les onglets en bas : Corps · Équipements · Grille</div>
  <div class="stage">
    <svg id="scene"></svg>
  </div>
  <div class="controls">
    <div class="tabs" id="mainTabs" role="tablist">
      <button class="tab-btn active" type="button" role="tab" data-tab="corps" aria-selected="true">Corps</button>
      <button class="tab-btn" type="button" role="tab" data-tab="equip" aria-selected="false">Équipements</button>
      <button class="tab-btn" type="button" role="tab" data-tab="grille" aria-selected="false">Grille</button>
    </div>

    <div class="tab-panels">
      <!-- ONGLET CORPS -->
      <div class="tab-panel active" id="panel-corps" role="tabpanel">
        <div class="row">
          <label>Morphologie</label>
          <div class="btn-group" id="morphSelector">
            <button class="ctrl-btn active" data-morph="heavy">⚔️ Lourd</button>

        </div>
        <div class="row">
          <label>Poitrine</label>
          <div class="btn-group" id="chestShapeSelector">
            <button class="ctrl-btn" data-chest="flat">Plat</button>
            <button class="ctrl-btn active" data-chest="pec">Pecs</button>
            <button class="ctrl-btn" data-chest="soft">Doux</button>
            <button class="ctrl-btn" data-chest="full">Plein</button>
          </div>
        </div>
        <div class="slider-grid" id="bodySliders"></div>
      </div>

      <!-- ONGLET ÉQUIPEMENTS -->
      <div class="tab-panel" id="panel-equip" role="tabpanel">
        <div class="row">
          <label>Pantalon</label>
          <div class="btn-group" id="pantsSelector">
            <button class="ctrl-btn active" data-pants="none">Aucun</button>
            <button class="ctrl-btn" data-pants="in">IN</button>
            <button class="ctrl-btn" data-pants="over">OVER</button>

          <label>Chapeau</label>
          <div class="btn-group" id="hatSelector">
            <button class="ctrl-btn active" data-hat="none">Aucun</button>
            <button class="ctrl-btn" data-hat="cap">Casquette</button>
          </div>
          <input type="color" id="hatColor" value="#3d2b1f" title="Couleur chapeau">
        </div>
      </div>

      <!-- ONGLET GRILLE -->
      <div class="tab-panel" id="panel-grille" role="tabpanel">

          <label>Ancres</label>

            <button class="ctrl-btn" data-anchors="off">Masquer</button>
            <button class="ctrl-btn active" data-anchors="on">Afficher</button>
          </div>
        </div>

        <div class="row">
          <label>Taille grille</label>
          <input type="range" id="gridSize" min="3" max="8" step="1" value="5">
          <span id="gridSizeVal" class="val">5</span>
        </div>
        <div class="row">
          <label>Largeur case</label>
          <input type="range" id="tileW" min="30" max="70" step="2" value="52">
          <span id="tileWVal" class="val">52</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   NEURO CORE — Phase 1+
   Superposition Z-Index + customisation par tronçon anatomique
   ============================================================
   Architecture :
   - MORPHS ……………… presets de base (heavy / standard / light)
   - BODY_CUSTOM ……… réglages indépendants par tronçon
   - resolveMorph() …… fusionne morpho + custom → profil final
   - LAYERS ……………… ordre de dessin SVG
   - ANCHORS ……………… points d'ancrage (suivent le profil résolu)
   - EQUIPMENT …………… pantalon IN/OVER, tunique, casquette
   ============================================================ */

const svg = document.getElementById("scene");
const info = document.getElementById("info");
const gridSizeInput = document.getElementById("gridSize");
const tileWInput = document.getElementById("tileW");
const pantsColorInput = document.getElementById("pantsColor");
const torsoColorInput = document.getElementById("torsoColor");
const hatColorInput = document.getElementById("hatColor");

/* ============================================================
   CUSTOM CORPS — schéma des tronçons
   Chaque clé est un slider (sauf chestShape = enum).
   Les multiplicateurs tournent autour de 1.0.
   Les volumes (belly, glutes, chestSize) sont en 0→1+.
   ============================================================ */
const BODY_SLIDER_DEFS = [
  { key: "neck",         label: "Cou",           min: 0.4, max: 1.8, step: 0.05, def: 1.0 },
  { key: "shoulderWidth",label: "Épaules Ø",     min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
  { key: "shoulderCap",  label: "Haut épaules",  min: 0.0, max: 1.8, step: 0.05, def: 1.0 },
  { key: "biceps",       label: "Biceps",        min: 0.4, max: 1.8, step: 0.05, def: 1.0 },
  { key: "elbow",        label: "Coudes",        min: 0.3, max: 2.0, step: 0.05, def: 1.0 },
  { key: "forearm",      label: "Avant-bras",    min: 0.4, max: 1.8, step: 0.05, def: 1.0 },
  { key: "chestSize",    label: "Poitrine Ø",    min: 0.0, max: 1.5, step: 0.05, def: 0.55 },
  { key: "belly",        label: "Ventre",        min: 0.0, max: 1.4, step: 0.05, def: 0.15 },
  { key: "waist",        label: "Taille",        min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
  { key: "hips",         label: "Hanches",       min: 0.5, max: 1.7, step: 0.05, def: 1.0 },
  { key: "glutes",       label: "Fesses",        min: 0.0, max: 1.5, step: 0.05, def: 0.35 },
  { key: "thigh",        label: "Cuisses",       min: 0.4, max: 1.8, step: 0.05, def: 1.0 },
  { key: "calf",         label: "Mollets",       min: 0.4, max: 1.8, step: 0.05, def: 1.0 },
];

function defaultBodyCustom() {
  const body = { chestShape: "pec" };
  for (const d of BODY_SLIDER_DEFS) body[d.key] = d.def;
  return body;
}

const state = {
  selected: { row: 2, col: 2 },
  morph: "heavy",
  body: defaultBodyCustom(),
  pants: "none",
  torso: "none",
  hat: "none",
  pantsColor: "#4a6741",
  torsoColor: "#8b5a2b",
  hatColor: "#3d2b1f",
  showAnchors: true,
};

/* ============================================================
   1. PROFILS MORPHOLOGIQUES (presets)
   ============================================================ */
const MORPHS = {
  heavy: {
    id: "heavy",
    label: "⚔️ LOURD",
    labelColor: "#ff6b6b",
    height: 1.8,
    shoulderW: 0.45,
    hipW: 0.28,
    waistW: 0.30,
    footSpread: 0.25,
    headRx: 0.20,
    headRy: 0.26,
    neckW: 0.08,
    armThick: 0.10,
    legThick: 0.10,
    headY: -1.75,
    neckTop: -1.65,
    shoulderY: -1.40,
    chestY: -1.10,
    waistY: -0.80,
    hipY: -0.72,
    kneeY: -0.15,
    ankleY: 0.00,
    footY: 0.06,
    elbowY: -0.90,
    wristY: -0.55,
    pantsScaleX: 1.20,
    pantsScaleY: 1.05,
    torsoScaleX: 1.18,
    hatScale: 1.12,
  },
  standard: {
    id: "standard",
    label: "🗡️ STANDARD",
    labelColor: "#6fd8c8",
    height: 1.6,
    shoulderW: 0.35,
    hipW: 0.22,
    waistW: 0.22,
    footSpread: 0.20,
    headRx: 0.18,
    headRy: 0.22,
    neckW: 0.06,
    armThick: 0.08,
    legThick: 0.08,
    headY: -1.56,
    neckTop: -1.48,
    shoulderY: -1.28,
    chestY: -1.00,
    waistY: -0.70,
    hipY: -0.65,
    kneeY: -0.15,
    ankleY: 0.00,
    footY: 0.05,
    elbowY: -0.85,
    wristY: -0.50,
    pantsScaleX: 1.00,
    pantsScaleY: 1.00,
    torsoScaleX: 1.00,
    hatScale: 1.00,
  },
  light: {
    id: "light",
    label: "🏹 FIN",
    labelColor: "#a78bfa",
    height: 1.7,
    shoulderW: 0.275,
    hipW: 0.16,
    waistW: 0.16,
    footSpread: 0.15,
    headRx: 0.16,
    headRy: 0.21,
    neckW: 0.05,
    armThick: 0.06,
    legThick: 0.06,
    headY: -1.65,
    neckTop: -1.55,
    shoulderY: -1.35,
    chestY: -1.05,
    waistY: -0.75,
    hipY: -0.68,
    kneeY: -0.15,
    ankleY: 0.00,
    footY: 0.05,
    elbowY: -0.88,
    wristY: -0.52,
    pantsScaleX: 0.82,
    pantsScaleY: 1.02,
    torsoScaleX: 0.82,
    hatScale: 0.92,
  },
};

/**
 * Fusionne le preset morphologique + les réglages de tronçons.
 * Tout le rendu (corps, ancres, équipements) lit UNIQUEMENT ce profil.
 */
function resolveMorph(morphId, body = state.body) {
  const base = MORPHS[morphId];
  const b = body;
  const m = { ...base };

  m.neckW      = base.neckW * b.neck;
  m.shoulderW  = base.shoulderW * b.shoulderWidth;
  m.shoulderCap = b.shoulderCap;
  m.biceps     = base.armThick * b.biceps;
  m.elbowBulk  = base.armThick * b.elbow;
  m.forearm    = base.armThick * b.forearm;
  m.armThick   = (m.biceps + m.forearm) / 2; // compat équipements
  m.chestShape = b.chestShape;
  m.chestSize  = b.chestSize;
  m.belly      = b.belly;
  m.waistW     = (base.waistW || base.hipW) * b.waist;
  m.hipW       = base.hipW * b.hips;
  m.glutes     = b.glutes;
  m.thigh      = base.legThick * b.thigh;
  m.calf       = base.legThick * b.calf;
  m.legThick   = (m.thigh + m.calf) / 2;

  // Échelles équipements suivent les tronçons
  m.pantsScaleX = base.pantsScaleX * ((b.thigh + b.hips) / 2);
  m.torsoScaleX = base.torsoScaleX * ((b.shoulderWidth + b.waist) / 2);

  return m;
}

/* ============================================================
   2. ORDRE DES CALQUES (Z-INDEX SVG)
   ============================================================ */
const LAYER_ORDER = [
  "legBack",
  "armBack",
  "torso",
  "head",
  "armFront",
  "legFront",
  "anchors",
  "meta",
];

/* ============================================================
   3. POINTS D'ANCRAGE (suivent le morph résolu)
   ============================================================ */
function getAnchors(m) {
  return {
    head:      { x: 0, y: m.headY },
    neck:      { x: 0, y: m.neckTop },
    shoulderL: { x: -m.shoulderW, y: m.shoulderY },
    shoulderR: { x:  m.shoulderW, y: m.shoulderY },
    elbowL:    { x: -m.shoulderW * 1.05, y: m.elbowY },
    elbowR:    { x:  m.shoulderW * 1.05, y: m.elbowY },
    waistL:    { x: -m.waistW * 0.85, y: m.waistY },
    waistR:    { x:  m.waistW * 0.85, y: m.waistY },
    hip:       { x: 0, y: m.hipY },
    gluteL:    { x: -m.hipW * 0.55, y: m.hipY + 0.06 },
    gluteR:    { x:  m.hipW * 0.35, y: m.hipY + 0.06 },
    handL:     { x: -m.shoulderW * 1.15, y: m.wristY },
    handR:     { x:  m.shoulderW * 1.15, y: m.wristY },
    footL:     { x: -m.footSpread, y: m.ankleY },
    footR:     { x:  m.footSpread, y: m.ankleY },
    pivot:     { x: 0, y: 0 },
  };
}

/* ============================================================
   UTILITAIRES SVG
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  return node;
}

function createPath(d, fill, stroke = "#2a1c15", strokeW = 1.5) {
  return el("path", {
    d, fill, stroke, "stroke-width": strokeW, "stroke-linejoin": "round",
  });
}

function createEllipse(cx, cy, rx, ry, fill, stroke = "#2a1c15", strokeW = 1.5) {
  return el("ellipse", {
    cx, cy, rx, ry, fill, stroke, "stroke-width": strokeW,
  });
}

function px(v, w) { return (v * w).toFixed(2); }

function darken(hex, amount = 0.22) {
  const n = hex.replace("#", "");
  const r = Math.max(0, Math.round(parseInt(n.slice(0, 2), 16) * (1 - amount)));
  const g = Math.max(0, Math.round(parseInt(n.slice(2, 4), 16) * (1 - amount)));
  const b = Math.max(0, Math.round(parseInt(n.slice(4, 6), 16) * (1 - amount)));
  return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
}

/* ============================================================
   4. GRILLE ISOMÉTRIQUE 2:1
   ============================================================ */
function isoToScreen(row, col, tileW, tileH, originX, originY) {
  return {
    x: originX + (col - row) * (tileW / 2),
    y: originY + (col + row) * (tileH / 2),
  };
}

function drawGrid(parent, gridSize, tileW, tileH, originX, originY) {
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const { x: cx, y: cy } = isoToScreen(row, col, tileW, tileH, originX, originY);
      const hw = tileW / 2;
      const hh = tileH / 2;
      const d = `M ${cx} ${cy - hh} L ${cx + hw} ${cy} L ${cx} ${cy + hh} L ${cx - hw} ${cy} Z`;
      const isSelected = state.selected.row === row && state.selected.col === col;
      const shade = (row + col) % 2 === 0 ? "light" : "dark";
      const tile = createPath(
        d,
        isSelected ? "#6fd8c8" : (shade === "light" ? "#3f7a54" : "#2f6b48"),
        "#173a28", 1.5
      );
      tile.classList.add("tile", isSelected ? "selected" : shade);
      tile.dataset.row = row;
      tile.dataset.col = col;
      tile.addEventListener("click", () => {
        state.selected = { row, col };
        info.textContent = `Case (${row}, ${col}) · ${state.morph} · poitrine ${state.body.chestShape}`;
        draw();
      });
      parent.appendChild(tile);
    }
  }
}

/* ============================================================
   5. CORPS — PARTIES ANATOMIQUES (lisent le morph RÉSOLU)
   ============================================================ */
const SKIN = "#e8c4a0";
const SKIN_DARK = "#c9a080";
const SKIN_MID = "#dbb494";
const OUTLINE = "#2a1c15";
const FOOT = "#8a6e5a";

function buildGlutes(m, w, side) {
  // Fesses : volume indépendant, ancré sur la hanche
  if (m.glutes <= 0.05) return [];
  const nodes = [];
  const isBack = side === "back";
  const gx = isBack ? -m.hipW * 0.45 : m.hipW * 0.25;
  const gy = m.hipY + 0.05;
  const rx = (0.06 + m.glutes * 0.10) * (isBack ? 1.1 : 1.0);
  const ry = 0.05 + m.glutes * 0.09;
  nodes.push(createEllipse(
    gx * w, gy * w, rx * w, ry * w,
    isBack ? SKIN_DARK : SKIN_MID, OUTLINE, 1.2
  ));
  return nodes;
}

function buildLegBack(m, w) {
  const nodes = [];
  const sx = -m.footSpread;
  const thigh = m.thigh;
  const calf = m.calf;

  nodes.push(...buildGlutes(m, w, "back"));

  nodes.push(createPath(
    `M ${px(-m.hipW * 0.4, w)} ${px(m.hipY, w)}
     L ${px(sx - thigh * 0.35, w)} ${px(m.kneeY, w)}
     L ${px(sx + thigh * 0.55, w)} ${px(m.kneeY + 0.08, w)}
     L ${px(-m.hipW * 0.1, w)} ${px(m.hipY + 0.08, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(sx - thigh * 0.35, w)} ${px(m.kneeY, w)}
     L ${px(sx - calf * 0.45, w)} ${px(m.ankleY, w)}
     L ${px(sx + calf * 0.55, w)} ${px(m.ankleY + 0.02, w)}
     L ${px(sx + thigh * 0.55, w)} ${px(m.kneeY + 0.08, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(sx - calf * 0.45, w)} ${px(m.ankleY, w)}
     L ${px(sx - calf * 0.2, w)} ${px(m.footY, w)}
     L ${px(sx + calf * 0.95, w)} ${px(m.footY, w)}
     L ${px(sx + calf * 0.55, w)} ${px(m.ankleY + 0.02, w)} Z`,
    FOOT, OUTLINE, 1.5
  ));
  return nodes;
}

function buildLegFront(m, w) {
  const nodes = [];
  const sx = m.footSpread;
  const thigh = m.thigh;
  const calf = m.calf;

  nodes.push(...buildGlutes(m, w, "front"));

  nodes.push(createPath(
    `M ${px(m.hipW * 0.15, w)} ${px(m.hipY, w)}
     L ${px(sx - thigh * 0.2, w)} ${px(m.kneeY, w)}
     L ${px(sx + thigh * 0.65, w)} ${px(m.kneeY + 0.08, w)}
     L ${px(m.hipW * 0.5, w)} ${px(m.hipY + 0.08, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(sx - thigh * 0.2, w)} ${px(m.kneeY, w)}
     L ${px(sx - calf * 0.05, w)} ${px(m.ankleY, w)}
     L ${px(sx + calf * 0.95, w)} ${px(m.ankleY + 0.02, w)}
     L ${px(sx + thigh * 0.65, w)} ${px(m.kneeY + 0.08, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(sx - calf * 0.05, w)} ${px(m.ankleY, w)}
     L ${px(sx + calf * 0.25, w)} ${px(m.footY, w)}
     L ${px(sx + calf * 1.45, w)} ${px(m.footY, w)}
     L ${px(sx + calf * 0.95, w)} ${px(m.ankleY + 0.02, w)} Z`,
    FOOT, OUTLINE, 1.5
  ));
  return nodes;
}

function buildShoulderCap(m, w, side, fill) {
  // Haut d'épaule / deltoïde — volume indépendant
  if (m.shoulderCap <= 0.05) return [];
  const nodes = [];
  const isBack = side === "back";
  const shx = isBack ? -m.shoulderW : m.shoulderW;
  const cap = m.shoulderCap;
  const rx = 0.04 + cap * 0.055;
  const ry = 0.035 + cap * 0.04;
  nodes.push(createEllipse(
    (shx + (isBack ? 0.02 : -0.02)) * w,
    (m.shoulderY + 0.02) * w,
    rx * w, ry * w,
    fill, OUTLINE, 1.3
  ));
  return nodes;
}

function buildElbowJoint(m, w, side, fill) {
  // Grosseur du coude — jointure indépendante du bras
  if (m.elbowBulk <= 0.02) return [];
  const nodes = [];
  const isBack = side === "back";
  const shx = isBack ? -m.shoulderW : m.shoulderW;
  const thick = isBack ? m.biceps : m.biceps;
  const ex = isBack
    ? shx - thick * 0.8
    : shx + thick * 0.9;
  const r = 0.025 + m.elbowBulk * 0.55;
  nodes.push(createEllipse(
    ex * w, (m.elbowY + 0.03) * w,
    r * w, r * 0.85 * w,
    fill, OUTLINE, 1.2
  ));
  return nodes;
}

function buildArmBack(m, w) {
  const nodes = [];
  const shx = -m.shoulderW;
  const bi = m.biceps;
  const fo = m.forearm;

  nodes.push(...buildShoulderCap(m, w, "back", SKIN_DARK));

  // Biceps
  nodes.push(createPath(
    `M ${px(shx + bi * 0.4, w)} ${px(m.shoulderY, w)}
     L ${px(shx - bi * 0.85, w)} ${px(m.elbowY, w)}
     L ${px(shx - bi * 0.05, w)} ${px(m.elbowY + 0.08, w)}
     L ${px(shx + bi * 1.05, w)} ${px(m.shoulderY + 0.12, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  nodes.push(...buildElbowJoint(m, w, "back", SKIN_DARK));
  // Avant-bras
  nodes.push(createPath(
    `M ${px(shx - bi * 0.85, w)} ${px(m.elbowY, w)}
     L ${px(shx - fo * 1.15, w)} ${px(m.wristY, w)}
     L ${px(shx - fo * 0.25, w)} ${px(m.wristY + 0.04, w)}
     L ${px(shx - bi * 0.05, w)} ${px(m.elbowY + 0.08, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  nodes.push(createEllipse(
    (shx - fo * 0.85) * w, m.wristY * w,
    Math.max(0.02, fo * 0.45) * w, Math.max(0.018, fo * 0.4) * w,
    SKIN_DARK, OUTLINE, 1.5
  ));
  return nodes;
}

function buildArmFront(m, w) {
  const nodes = [];
  const shx = m.shoulderW;
  const bi = m.biceps;
  const fo = m.forearm;

  nodes.push(...buildShoulderCap(m, w, "front", SKIN));

  nodes.push(createPath(
    `M ${px(shx - bi * 0.5, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(shx + bi * 0.95, w)} ${px(m.elbowY, w)}
     L ${px(shx + bi * 0.15, w)} ${px(m.elbowY + 0.08, w)}
     L ${px(shx - bi * 1.05, w)} ${px(m.shoulderY + 0.12, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(...buildElbowJoint(m, w, "front", SKIN));
  nodes.push(createPath(
    `M ${px(shx + bi * 0.95, w)} ${px(m.elbowY, w)}
     L ${px(shx + fo * 1.25, w)} ${px(m.wristY, w)}
     L ${px(shx + fo * 0.35, w)} ${px(m.wristY + 0.04, w)}
     L ${px(shx + bi * 0.15, w)} ${px(m.elbowY + 0.08, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createEllipse(
    (shx + fo * 0.95) * w, m.wristY * w,
    Math.max(0.022, fo * 0.5) * w, Math.max(0.02, fo * 0.42) * w,
    SKIN, OUTLINE, 1.5
  ));
  return nodes;
}

/**
 * Formes de poitrine / pectoraux
 * flat  — silhouette plate
 * pec   — plaques angulaires (musclé)
 * soft  — volumes arrondis
 * full  — volumes plus larges / tombants
 */
function buildChest(m, w) {
  const nodes = [];
  const size = m.chestSize;
  if (size <= 0.02 || m.chestShape === "flat") return nodes;

  const sw = m.shoulderW;
  const cy = m.shoulderY + 0.12 + size * 0.04;
  const shape = m.chestShape;

  if (shape === "pec") {
    const pecH = 0.12 + size * 0.16;
    const pecW = 0.55 + size * 0.2;
    nodes.push(createPath(
      `M ${px(-sw * pecW, w)} ${px(cy, w)}
       L ${px(-sw * 0.12, w)} ${px(cy + 0.03, w)}
       L ${px(-sw * 0.12, w)} ${px(cy + pecH, w)}
       L ${px(-sw * pecW, w)} ${px(cy + pecH - 0.02, w)} Z`,
      SKIN_MID, OUTLINE, 1.2
    ));
    nodes.push(createPath(
      `M ${px(sw * pecW, w)} ${px(cy - 0.02, w)}
       L ${px(sw * 0.12, w)} ${px(cy + 0.03, w)}
       L ${px(sw * 0.12, w)} ${px(cy + pecH, w)}
       L ${px(sw * pecW, w)} ${px(cy + pecH - 0.02, w)} Z`,
      SKIN_MID, OUTLINE, 1.2
    ));
  } else if (shape === "soft" || shape === "full") {
    const full = shape === "full" ? 1.25 : 1.0;
    const rx = (0.07 + size * 0.09) * full;
    const ry = (0.06 + size * 0.10) * full;
    const drop = shape === "full" ? 0.04 + size * 0.04 : 0.01;
    // Sein / volume G (arrière isométrique un peu plus sombre)
    nodes.push(createEllipse(
      (-sw * 0.42) * w, (cy + drop + ry * 0.3) * w,
      rx * w, ry * w, SKIN_MID, OUTLINE, 1.2
    ));
    // Sein / volume D
    nodes.push(createEllipse(
      (sw * 0.38) * w, (cy + drop + ry * 0.25) * w,
      rx * 1.05 * w, ry * 1.05 * w, SKIN, OUTLINE, 1.2
    ));
  }
  return nodes;
}

function buildBelly(m, w) {
  const nodes = [];
  if (m.belly <= 0.05) {
    // Abs discrets si ventre bas
    if (m.belly < 0.2) {
      nodes.push(createPath(
        `M ${px(-0.02, w)} ${px(m.chestY, w)}
         L ${px(0.02, w)} ${px(m.chestY, w)}
         L ${px(0.02, w)} ${px(m.waistY, w)}
         L ${px(-0.02, w)} ${px(m.waistY, w)} Z`,
        SKIN_MID, OUTLINE, 1
      ));
    }
    return nodes;
  }
  const bulge = m.belly;
  const midY = (m.chestY + m.waistY) / 2;
  const rx = m.waistW * (0.55 + bulge * 0.7);
  const ry = 0.08 + bulge * 0.14;
  nodes.push(createEllipse(
    0.02 * w, midY * w, rx * w, ry * w,
    SKIN_MID, OUTLINE, 1.3
  ));
  return nodes;
}

function buildTorso(m, w) {
  const nodes = [];
  const sw = m.shoulderW;
  const ww = m.waistW;
  const hw = m.hipW;

  // Silhouette torse : épaules → taille → hanches (ventre élargit la taille)
  const waistBulge = ww * (1 + m.belly * 0.35);
  nodes.push(createPath(
    `M ${px(-sw, w)} ${px(m.shoulderY, w)}
     L ${px(sw, w)} ${px(m.shoulderY - 0.05, w)}
     L ${px(waistBulge, w)} ${px(m.waistY, w)}
     L ${px(hw * 0.9, w)} ${px(m.hipY, w)}
     L ${px(-hw * 0.9, w)} ${px(m.hipY, w)}
     L ${px(-waistBulge, w)} ${px(m.waistY, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));

  nodes.push(...buildChest(m, w));
  nodes.push(...buildBelly(m, w));
  return nodes;
}

function buildHead(m, w) {
  const nodes = [];
  nodes.push(createPath(
    `M ${px(-m.neckW, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(m.neckW, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(m.neckW * 0.85, w)} ${px(m.neckTop, w)}
     L ${px(-m.neckW * 0.85, w)} ${px(m.neckTop, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createEllipse(0, m.headY * w, m.headRx * w, m.headRy * w, SKIN, OUTLINE, 1.5));
  if (m.id === "heavy" || m.neckW > 0.075) {
    nodes.push(createPath(
      `M ${px(-m.headRx * 0.9, w)} ${px(m.headY + 0.05, w)}
       L ${px(-m.headRx * 0.8, w)} ${px(m.headY + m.headRy * 0.55, w)}
       L ${px(m.headRx * 0.8, w)} ${px(m.headY + m.headRy * 0.55, w)}
       L ${px(m.headRx * 0.9, w)} ${px(m.headY + 0.05, w)} Z`,
      SKIN, OUTLINE, 1.5
    ));
  }
  const eyeY = m.headY - 0.02;
  const eyeRx = m.headRx * 0.2;
  const eyeRy = m.headRy * 0.12;
  nodes.push(createEllipse(-m.headRx * 0.4 * w, eyeY * w, eyeRx * w, eyeRy * w, "#1a1a1a", OUTLINE, 1));
  nodes.push(createEllipse( m.headRx * 0.4 * w, eyeY * w, eyeRx * w, eyeRy * w, "#1a1a1a", OUTLINE, 1));
  return nodes;
}

/* ============================================================
   6. ÉQUIPEMENTS
   ============================================================ */
function buildPantsLeg(m, w, side, mode, color) {
  const nodes = [];
  const isBack = side === "back";
  const sx = isBack ? -m.footSpread : m.footSpread;
  const fill = isBack ? darken(color, 0.18) : color;
  const stitch = darken(color, 0.35);
  const thick = m.thigh * m.pantsScaleX;
  const hipInner = isBack ? -m.hipW * 0.35 : m.hipW * 0.12;
  const hipOuter = isBack ? -m.hipW * 0.55 : m.hipW * 0.55;
  const hemY = mode === "over" ? m.footY * 0.7 : m.ankleY - 0.02;
  const flare = mode === "over" ? thick * 0.35 : 0;

  nodes.push(createPath(
    `M ${px(hipInner, w)} ${px(m.hipY - 0.02, w)}
     L ${px(hipOuter, w)} ${px(m.hipY - 0.02, w)}
     L ${px(sx + (isBack ? -thick * 0.55 : thick * 0.75) + flare * 0.3, w)} ${px(m.kneeY, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.15) - flare * 0.1, w)} ${px(m.kneeY + 0.06, w)} Z`,
    fill, OUTLINE, 1.4
  ));
  nodes.push(createPath(
    `M ${px(sx + (isBack ? -thick * 0.55 : thick * 0.75) + flare * 0.3, w)} ${px(m.kneeY, w)}
     L ${px(sx + (isBack ? -thick * 0.65 : thick * 0.95) + flare, w)} ${px(hemY, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.05) - flare * 0.2, w)} ${px(hemY + 0.015, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.15) - flare * 0.1, w)} ${px(m.kneeY + 0.06, w)} Z`,
    fill, OUTLINE, 1.4
  ));
  const hemBand = mode === "over" ? 0.035 : 0.025;
  nodes.push(createPath(
    `M ${px(sx + (isBack ? -thick * 0.65 : thick * 0.95) + flare, w)} ${px(hemY, w)}
     L ${px(sx + (isBack ? -thick * 0.65 : thick * 0.95) + flare, w)} ${px(hemY + hemBand, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.05) - flare * 0.2, w)} ${px(hemY + hemBand, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.05) - flare * 0.2, w)} ${px(hemY + 0.015, w)} Z`,
    stitch, OUTLINE, 1.2
  ));
  return nodes;
}

function buildPantsWaist(m, w, color) {
  const nodes = [];
  const belt = darken(color, 0.3);
  nodes.push(createPath(
    `M ${px(-m.hipW * 1.05, w)} ${px(m.hipY - 0.06, w)}
     L ${px(m.hipW * 1.05, w)} ${px(m.hipY - 0.06, w)}
     L ${px(m.hipW * 0.95, w)} ${px(m.hipY + 0.04, w)}
     L ${px(-m.hipW * 0.95, w)} ${px(m.hipY + 0.04, w)} Z`,
    color, OUTLINE, 1.4
  ));
  nodes.push(createPath(
    `M ${px(-m.hipW * 1.0, w)} ${px(m.hipY - 0.02, w)}
     L ${px(m.hipW * 1.0, w)} ${px(m.hipY - 0.02, w)}
     L ${px(m.hipW * 0.98, w)} ${px(m.hipY + 0.02, w)}
     L ${px(-m.hipW * 0.98, w)} ${px(m.hipY + 0.02, w)} Z`,
    belt, OUTLINE, 1.1
  ));
  return nodes;
}

function buildTunic(m, w, color) {
  const nodes = [];
  const sw = m.shoulderW * m.torsoScaleX;
  const hw = Math.max(m.hipW, m.waistW) * m.torsoScaleX;
  const shade = darken(color, 0.2);
  // La tunique suit aussi le ventre
  const midBulge = hw * (1 + m.belly * 0.25);
  nodes.push(createPath(
    `M ${px(-sw * 0.95, w)} ${px(m.shoulderY + 0.02, w)}
     L ${px(sw * 0.95, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(midBulge * 1.1, w)} ${px(m.waistY + 0.08, w)}
     L ${px(-midBulge * 1.1, w)} ${px(m.waistY + 0.08, w)} Z`,
    color, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(-sw * 0.25, w)} ${px(m.shoulderY + 0.04, w)}
     L ${px(0, w)} ${px(m.shoulderY + 0.22, w)}
     L ${px(sw * 0.25, w)} ${px(m.shoulderY + 0.02, w)}
     L ${px(0, w)} ${px(m.shoulderY + 0.18, w)} Z`,
    shade, OUTLINE, 1.1
  ));
  return nodes;
}

function buildCap(m, w, color) {
  const nodes = [];
  const s = m.hatScale;
  const shade = darken(color, 0.25);
  const top = m.headY - m.headRy * 0.55;
  nodes.push(createPath(
    `M ${px(-m.headRx * 1.05 * s, w)} ${px(m.headY - m.headRy * 0.15, w)}
     Q ${px(0, w)} ${px(top - 0.08 * s, w)} ${px(m.headRx * 1.05 * s, w)} ${px(m.headY - m.headRy * 0.15, w)}
     L ${px(m.headRx * 1.1 * s, w)} ${px(m.headY + 0.02, w)}
     L ${px(-m.headRx * 1.1 * s, w)} ${px(m.headY + 0.02, w)} Z`,
    color, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(m.headRx * 0.2 * s, w)} ${px(m.headY - 0.02, w)}
     L ${px(m.headRx * 1.45 * s, w)} ${px(m.headY + 0.04, w)}
     L ${px(m.headRx * 1.15 * s, w)} ${px(m.headY + 0.08, w)}
     L ${px(m.headRx * 0.15 * s, w)} ${px(m.headY + 0.04, w)} Z`,
    shade, OUTLINE, 1.3
  ));
  return nodes;
}

/* ============================================================
   7. ANCRAGES VISUELS
   ============================================================ */
function buildAnchorMarkers(m, w) {
  const nodes = [];
  const anchors = getAnchors(m);
  const colors = {
    head: "#ff6b6b", neck: "#ffa07a",
    shoulderL: "#6fd8c8", shoulderR: "#6fd8c8",
    elbowL: "#34d399", elbowR: "#34d399",
    waistL: "#f0c040", waistR: "#f0c040", hip: "#f0c040",
    gluteL: "#fb923c", gluteR: "#fb923c",
    handL: "#a78bfa", handR: "#a78bfa",
    footL: "#60a5fa", footR: "#60a5fa",
    pivot: "#ff0044",
  };
  for (const [name, pos] of Object.entries(anchors)) {
    const r = name === "pivot" ? 0.035 * w : 0.026 * w;
    const e = createEllipse(pos.x * w, pos.y * w, r, r, colors[name] || "#fff", "#000", 1);
    e.setAttribute("opacity", "0.85");
    e.dataset.anchor = name;
    nodes.push(e);
  }
  return nodes;
}

/* ============================================================
   8. ASSEMBLEUR
   ============================================================ */
function createCharacter(cx, cy, tileW, morphId) {
  const m = resolveMorph(morphId, state.body);
  const w = tileW;
  const root = el("g", {
    class: "character",
    transform: `translate(${cx}, ${cy})`,
    "data-morph": morphId,
    "data-chest": m.chestShape,
  });
  root.style.pointerEvents = "none";

  const layers = {};
  for (const name of LAYER_ORDER) {
    layers[name] = el("g", { class: `layer layer-${name}`, "data-layer": name });
    root.appendChild(layers[name]);
  }

  for (const n of buildLegBack(m, w))  layers.legBack.appendChild(n);
  for (const n of buildArmBack(m, w))  layers.armBack.appendChild(n);
  for (const n of buildTorso(m, w))    layers.torso.appendChild(n);
  for (const n of buildHead(m, w))     layers.head.appendChild(n);
  for (const n of buildArmFront(m, w)) layers.armFront.appendChild(n);
  for (const n of buildLegFront(m, w)) layers.legFront.appendChild(n);

  if (state.pants !== "none") {
    const mode = state.pants;
    const color = state.pantsColor;
    for (const n of buildPantsLeg(m, w, "back", mode, color)) layers.legBack.appendChild(n);
    for (const n of buildPantsWaist(m, w, color)) layers.torso.appendChild(n);
    for (const n of buildPantsLeg(m, w, "front", mode, color)) layers.legFront.appendChild(n);
  }

  if (state.torso === "tunic") {
    for (const n of buildTunic(m, w, state.torsoColor)) layers.torso.appendChild(n);
  }
  if (state.hat === "cap") {
    for (const n of buildCap(m, w, state.hatColor)) layers.head.appendChild(n);
  }
  if (state.showAnchors) {
    for (const n of buildAnchorMarkers(m, w)) layers.anchors.appendChild(n);
  }

  const pivot = createEllipse(0, 0, 0.03 * w, 0.03 * w, "#ff0044", "#ff0044", 1.5);
  pivot.setAttribute("opacity", "0.7");
  layers.meta.appendChild(pivot);

  const label = el("text", {
    x: 0,
    y: (m.headY - m.headRy - 0.18) * w,
    "text-anchor": "middle",
    "font-size": "9",
    fill: m.labelColor,
    "font-weight": "bold",
    "font-family": "Arial",
  });
  label.textContent = m.label;
  layers.meta.appendChild(label);

  return root;
}

/* ============================================================
   9. RENDU
   ============================================================ */
function draw() {
  const gridSize = parseInt(gridSizeInput.value, 10);
  const tileW = parseInt(tileWInput.value, 10);
  const tileH = tileW / 2;

  document.getElementById("gridSizeVal").textContent = gridSize;
  document.getElementById("tileWVal").textContent = tileW;

  state.selected.row = Math.min(state.selected.row, gridSize - 1);
  state.selected.col = Math.min(state.selected.col, gridSize - 1);

  const pad = tileW * 1.2;
  const gridPixelW = gridSize * tileW;
  const gridPixelH = gridSize * tileH;
  const charHeadroom = tileW * 2.3;
  const viewW = gridPixelW + pad * 2;
  const viewH = gridPixelH + pad * 2 + charHeadroom;
  const originX = viewW / 2;
  const originY = pad + charHeadroom * 0.35;

  svg.setAttribute("viewBox", `0 0 ${viewW} ${viewH}`);
  svg.innerHTML = "";

  const world = el("g", { class: "world" });
  svg.appendChild(world);
  drawGrid(world, gridSize, tileW, tileH, originX, originY);

  const { x: cx, y: cy } = isoToScreen(
    state.selected.row, state.selected.col, tileW, tileH, originX, originY
  );
  world.appendChild(createCharacter(cx, cy, tileW, state.morph));
}

/* ============================================================
   10. UI — sliders tronçons + bindings
   ============================================================ */
function buildBodySlidersUI() {
  const host = document.getElementById("bodySliders");
  host.innerHTML = "";
  for (const def of BODY_SLIDER_DEFS) {
    const row = document.createElement("div");
    row.className = "slider-row";

    const lab = document.createElement("span");
    lab.className = "label";
    lab.textContent = def.label;

    const input = document.createElement("input");
    input.type = "range";
    input.min = def.min;
    input.max = def.max;
    input.step = def.step;
    input.value = state.body[def.key];
    input.dataset.bodyKey = def.key;
    input.id = `body_${def.key}`;

    const num = document.createElement("span");
    num.className = "num";
    num.id = `bodyVal_${def.key}`;
    num.textContent = Number(state.body[def.key]).toFixed(2);

    input.addEventListener("input", () => {
      const v = parseFloat(input.value);
      state.body[def.key] = v;
      num.textContent = v.toFixed(2);
      info.textContent = `${def.label} → ${v.toFixed(2)}`;
      draw();
    });

    row.appendChild(lab);
    row.appendChild(input);
    row.appendChild(num);
    host.appendChild(row);
  }
}

function syncBodySlidersFromState() {
  for (const def of BODY_SLIDER_DEFS) {
    const input = document.getElementById(`body_${def.key}`);
    const num = document.getElementById(`bodyVal_${def.key}`);
    if (input) input.value = state.body[def.key];
    if (num) num.textContent = Number(state.body[def.key]).toFixed(2);
  }
  // chest shape buttons
  document.querySelectorAll("#chestShapeSelector .ctrl-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.chest === state.body.chestShape);
  });
}

function bindButtonGroup(containerId, datasetKey, stateKey, labels) {
  const container = document.getElementById(containerId);
  container.querySelectorAll(".ctrl-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      container.querySelectorAll(".ctrl-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state[stateKey] = btn.dataset[datasetKey];
      info.textContent = labels
        ? labels(state[stateKey], btn)
        : `${stateKey} → ${state[stateKey]}`;
      draw();
    });
  });
}

bindButtonGroup("morphSelector", "morph", "morph", (v, btn) =>
  `Morphologie ${btn.textContent.trim()} (base) · tronçons conservés`
);
bindButtonGroup("pantsSelector", "pants", "pants", (v) =>
  `Pantalon : ${v === "none" ? "aucun" : v.toUpperCase()}`
);
bindButtonGroup("torsoSelector", "torso", "torso", (v) =>
  `Haut : ${v === "none" ? "aucun" : "tunique"}`
);
bindButtonGroup("hatSelector", "hat", "hat", (v) =>
  `Chapeau : ${v === "none" ? "aucun" : "casquette"}`
);

document.querySelectorAll("#chestShapeSelector .ctrl-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#chestShapeSelector .ctrl-btn")
      .forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.body.chestShape = btn.dataset.chest;
    info.textContent = `Forme poitrine : ${btn.textContent.trim()}`;
    draw();
  });
});

document.getElementById("resetBody").addEventListener("click", () => {
  state.body = defaultBodyCustom();
  syncBodySlidersFromState();
  info.textContent = "Tronçons réinitialisés aux valeurs par défaut";
  draw();
});

document.getElementById("anchorToggle").querySelectorAll(".ctrl-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.getElementById("anchorToggle").querySelectorAll(".ctrl-btn")
      .forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.showAnchors = btn.dataset.anchors === "on";
    info.textContent = state.showAnchors
      ? "Points d'ancrage visibles"
      : "Points d'ancrage masqués";
    draw();
  });
});

pantsColorInput.addEventListener("input", () => { state.pantsColor = pantsColorInput.value; draw(); });
torsoColorInput.addEventListener("input", () => { state.torsoColor = torsoColorInput.value; draw(); });
hatColorInput.addEventListener("input", () => { state.hatColor = hatColorInput.value; draw(); });
gridSizeInput.addEventListener("input", draw);
tileWInput.addEventListener("input", draw);

/* Onglets Corps / Équipements / Grille */
document.querySelectorAll("#mainTabs .tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll("#mainTabs .tab-btn").forEach((b) => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", b === btn ? "true" : "false");
    });
    document.querySelectorAll(".tab-panel").forEach((panel) => {
      panel.classList.toggle("active", panel.id === `panel-${tab}`);
    });
    const titles = { corps: "Corps & morphologie", equip: "Équipements", grille: "Grille & ancres" };
    info.textContent = `Onglet : ${titles[tab] || tab}`;
  });
});

buildBodySlidersUI();
draw();
</script>
</body>
</html>
