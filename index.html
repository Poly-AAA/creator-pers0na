<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEURO CORE — Phase 1 · Superposition Z-Index</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin:0; height:100%; background:#0a0d0a; color:#e8e8e0; font-family:'Segoe UI', Arial, sans-serif; overflow:hidden; }
  .app { height:100dvh; display:flex; flex-direction:column; }
  .topbar {
    flex:0 0 auto;
    background: linear-gradient(180deg,#b81c1c,#7a1010);
    padding:8px 12px;
    font-size:12px; font-weight:700; text-align:center; letter-spacing:1px;
  }
  .info { flex:0 0 auto; font-size:11px; color:#9aa; text-align:center; padding:4px 8px; min-height:16px; }
  .stage { flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; }
  svg { width:min(94%, 62dvh); height:auto; touch-action: manipulation; }
  .tile { stroke:#173a28; stroke-width:1.5; cursor:pointer; transition: fill 0.1s; }
  .tile.light { fill:#3f7a54; }
  .tile.dark  { fill:#2f6b48; }
  .tile.selected { fill:#6fd8c8; }
  .controls {
    flex:0 0 auto; background:#16211a; border-top:1px solid #000;
    padding:10px 12px; display:flex; flex-direction:column; gap:8px;
    max-height:42dvh; overflow-y:auto;
  }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row label { font-size:11px; color:#ccd; flex:0 0 88px; }
  .row input[type=range] { flex:1 1 auto; accent-color:#6fd8c8; min-width:60px; }
  .row input[type=color] {
    width:36px; height:28px; padding:0; border:1px solid #2a4a33;
    background:#1f2e24; border-radius:4px; cursor:pointer;
  }
  .btn-group { display:flex; gap:6px; flex-wrap:wrap; }
  .ctrl-btn {
    background:#1f2e24; border:2px solid #2a4a33; color:#aabb;
    padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { background:#2a4a33; }
  .ctrl-btn.active { background:#3f7a54; border-color:#6fd8c8; color:#fff; font-weight:bold; }
  .section-title {
    font-size:10px; color:#6fd8c8; letter-spacing:0.8px; text-transform:uppercase;
    margin-top:2px; padding-top:4px; border-top:1px solid #243328;
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">NEURO CORE — Phase 1 · Système de Superposition (Z-Index)</div>
  <div class="info" id="info">Sélectionne une morphologie, équipe un pantalon, puis clique sur une case.</div>
  <div class="stage">
    <svg id="scene"></svg>
  </div>
  <div class="controls">
    <div class="row">
      <label>Morphologie</label>
      <div class="btn-group" id="morphSelector">
        <button class="ctrl-btn active" data-morph="heavy">⚔️ Lourd</button>
        <button class="ctrl-btn" data-morph="standard">🗡️ Standard</button>
        <button class="ctrl-btn" data-morph="light">🏹 Fin</button>
      </div>
    </div>

    <div class="section-title">Équipements (Phase 1)</div>

    <div class="row">
      <label>Pantalon</label>
      <div class="btn-group" id="pantsSelector">
        <button class="ctrl-btn active" data-pants="none">Aucun</button>
        <button class="ctrl-btn" data-pants="in">IN</button>
        <button class="ctrl-btn" data-pants="over">OVER</button>
      </div>
      <input type="color" id="pantsColor" value="#4a6741" title="Couleur pantalon">
    </div>

    <div class="row">
      <label>Haut</label>
      <div class="btn-group" id="torsoSelector">
        <button class="ctrl-btn active" data-torso="none">Aucun</button>
        <button class="ctrl-btn" data-torso="tunic">Tunique</button>
      </div>
      <input type="color" id="torsoColor" value="#8b5a2b" title="Couleur haut">
    </div>

    <div class="row">
      <label>Chapeau</label>
      <div class="btn-group" id="hatSelector">
        <button class="ctrl-btn active" data-hat="none">Aucun</button>
        <button class="ctrl-btn" data-hat="cap">Casquette</button>
      </div>
      <input type="color" id="hatColor" value="#3d2b1f" title="Couleur chapeau">
    </div>

    <div class="row">
      <label>Ancres</label>
      <div class="btn-group" id="anchorToggle">
        <button class="ctrl-btn" data-anchors="off">Masquer</button>
        <button class="ctrl-btn active" data-anchors="on">Afficher</button>
      </div>
    </div>

    <div class="row">
      <label>Taille grille</label>
      <input type="range" id="gridSize" min="3" max="8" step="1" value="5">
      <span id="gridSizeVal">5</span>
    </div>
    <div class="row">
      <label>Largeur case</label>
      <input type="range" id="tileW" min="30" max="70" step="2" value="52">
      <span id="tileWVal">52</span>
    </div>
  </div>
</div>

<script>
/* ============================================================
   NEURO CORE — Phase 1
   Système de superposition (Z-Index) + équipements modulaires
   ============================================================
   Architecture :
   - MORPHS ………………… profils dimensionnels (heavy / standard / light)
   - LAYERS ………………… ordre de dessin SVG (z-index documenté)
   - ANCHORS ……………… points d'ancrage pour futurs équipements
   - EQUIPMENT …………… pantalon IN/OVER, tunique, casquette
   - ASSEMBLER …………… construit le personnage calque par calque
   ============================================================ */

const svg = document.getElementById("scene");
const info = document.getElementById("info");
const gridSizeInput = document.getElementById("gridSize");
const tileWInput = document.getElementById("tileW");
const pantsColorInput = document.getElementById("pantsColor");
const torsoColorInput = document.getElementById("torsoColor");
const hatColorInput = document.getElementById("hatColor");

/** État runtime du créateur */
const state = {
  selected: { row: 2, col: 2 },
  morph: "heavy",
  pants: "none",      // none | in | over
  torso: "none",      // none | tunic
  hat: "none",        // none | cap
  pantsColor: "#4a6741",
  torsoColor: "#8b5a2b",
  hatColor: "#3d2b1f",
  showAnchors: true,
};

/* ============================================================
   1. PROFILS MORPHOLOGIQUES
   Toutes les dimensions sont en fractions de tileW.
   Les équipements lisent ces profils pour s'adapter.
   ============================================================ */
const MORPHS = {
  heavy: {
    id: "heavy",
    label: "⚔️ LOURD",
    labelColor: "#ff6b6b",
    height: 1.8,
    shoulderW: 0.45,   // demi-largeur épaules
    hipW: 0.28,
    footSpread: 0.25,
    headRx: 0.20,
    headRy: 0.26,
    neckW: 0.08,
    armThick: 0.10,
    legThick: 0.10,
    // Positions verticales relatives (y négatif = vers le haut)
    headY: -1.75,
    neckTop: -1.65,
    shoulderY: -1.40,
    chestY: -1.10,
    waistY: -0.80,
    hipY: -0.72,
    kneeY: -0.15,
    ankleY: 0.00,
    footY: 0.06,
    elbowY: -0.90,
    wristY: -0.55,
    // Échelles pour équipements
    pantsScaleX: 1.20,
    pantsScaleY: 1.05,
    torsoScaleX: 1.18,
    hatScale: 1.12,
  },
  standard: {
    id: "standard",
    label: "🗡️ STANDARD",
    labelColor: "#6fd8c8",
    height: 1.6,
    shoulderW: 0.35,
    hipW: 0.22,
    footSpread: 0.20,
    headRx: 0.18,
    headRy: 0.22,
    neckW: 0.06,
    armThick: 0.08,
    legThick: 0.08,
    headY: -1.56,
    neckTop: -1.48,
    shoulderY: -1.28,
    chestY: -1.00,
    waistY: -0.70,
    hipY: -0.65,
    kneeY: -0.15,
    ankleY: 0.00,
    footY: 0.05,
    elbowY: -0.85,
    wristY: -0.50,
    pantsScaleX: 1.00,
    pantsScaleY: 1.00,
    torsoScaleX: 1.00,
    hatScale: 1.00,
  },
  light: {
    id: "light",
    label: "🏹 FIN",
    labelColor: "#a78bfa",
    height: 1.7,
    shoulderW: 0.275,
    hipW: 0.16,
    footSpread: 0.15,
    headRx: 0.16,
    headRy: 0.21,
    neckW: 0.05,
    armThick: 0.06,
    legThick: 0.06,
    headY: -1.65,
    neckTop: -1.55,
    shoulderY: -1.35,
    chestY: -1.05,
    waistY: -0.75,
    hipY: -0.68,
    kneeY: -0.15,
    ankleY: 0.00,
    footY: 0.05,
    elbowY: -0.88,
    wristY: -0.52,
    pantsScaleX: 0.82,
    pantsScaleY: 1.02,
    torsoScaleX: 0.82,
    hatScale: 0.92,
  },
};

/* ============================================================
   2. ORDRE DES CALQUES (Z-INDEX SVG)
   Du plus bas (dessiné en premier) au plus haut.
   Les équipements s'insèrent DANS le calque anatomique
   correspondant (ex: pantalon dans legBack / legFront).
   ============================================================ */
const LAYER_ORDER = [
  "legBack",    // 1. Jambes arrière-plan
  "armBack",    // 2. Bras arrière-plan
  "torso",      // 3. Corps / Torse (+ haut)
  "head",       // 4. Tête (+ chapeau)
  "armFront",   // 5. Bras premier plan
  "legFront",   // 6. Jambes premier plan
  "anchors",    // Debug : points d'ancrage
  "meta",       // Pivot + étiquette
];

/* ============================================================
   3. POINTS D'ANCRAGE
   Coordonnées en fractions de tileW, adaptées à la morpho.
   Utilisés pour positionner équipements et (Phase 2+) rotations.
   ============================================================ */
function getAnchors(m) {
  return {
    head:      { x: 0,              y: m.headY },
    neck:      { x: 0,              y: m.neckTop },
    shoulderL: { x: -m.shoulderW,   y: m.shoulderY },
    shoulderR: { x:  m.shoulderW,   y: m.shoulderY },
    waistL:    { x: -m.hipW * 0.7,  y: m.waistY },
    waistR:    { x:  m.hipW * 0.7,  y: m.waistY },
    hip:       { x: 0,              y: m.hipY },
    handL:     { x: -m.shoulderW * 1.15, y: m.wristY },
    handR:     { x:  m.shoulderW * 1.15, y: m.wristY },
    footL:     { x: -m.footSpread,  y: m.ankleY },
    footR:     { x:  m.footSpread,  y: m.ankleY },
    pivot:     { x: 0,              y: 0 },
  };
}

/* ============================================================
   UTILITAIRES SVG
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  return node;
}

function createPath(d, fill, stroke = "#2a1c15", strokeW = 1.5) {
  return el("path", {
    d, fill, stroke, "stroke-width": strokeW, "stroke-linejoin": "round",
  });
}

function createEllipse(cx, cy, rx, ry, fill, stroke = "#2a1c15", strokeW = 1.5) {
  return el("ellipse", {
    cx, cy, rx, ry, fill, stroke, "stroke-width": strokeW,
  });
}

/** Convertit fractions * tileW → path SVG avec valeurs numériques */
function px(v, w) { return (v * w).toFixed(2); }

function darken(hex, amount = 0.22) {
  const n = hex.replace("#", "");
  const r = Math.max(0, Math.round(parseInt(n.slice(0, 2), 16) * (1 - amount)));
  const g = Math.max(0, Math.round(parseInt(n.slice(2, 4), 16) * (1 - amount)));
  const b = Math.max(0, Math.round(parseInt(n.slice(4, 6), 16) * (1 - amount)));
  return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
}

function lighten(hex, amount = 0.15) {
  const n = hex.replace("#", "");
  const r = Math.min(255, Math.round(parseInt(n.slice(0, 2), 16) + (255 - parseInt(n.slice(0, 2), 16)) * amount));
  const g = Math.min(255, Math.round(parseInt(n.slice(2, 4), 16) + (255 - parseInt(n.slice(2, 4), 16)) * amount));
  const b = Math.min(255, Math.round(parseInt(n.slice(4, 6), 16) + (255 - parseInt(n.slice(4, 6), 16)) * amount));
  return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
}

/* ============================================================
   4. GRILLE ISOMÉTRIQUE 2:1
   ============================================================ */
function isoToScreen(row, col, tileW, tileH, originX, originY) {
  return {
    x: originX + (col - row) * (tileW / 2),
    y: originY + (col + row) * (tileH / 2),
  };
}

function drawGrid(parent, gridSize, tileW, tileH, originX, originY) {
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const { x: cx, y: cy } = isoToScreen(row, col, tileW, tileH, originX, originY);
      const hw = tileW / 2;
      const hh = tileH / 2;
      const d = `M ${cx} ${cy - hh} L ${cx + hw} ${cy} L ${cx} ${cy + hh} L ${cx - hw} ${cy} Z`;
      const isSelected = state.selected.row === row && state.selected.col === col;
      const shade = (row + col) % 2 === 0 ? "light" : "dark";
      const tile = createPath(d, isSelected ? "#6fd8c8" : (shade === "light" ? "#3f7a54" : "#2f6b48"), "#173a28", 1.5);
      tile.classList.add("tile", isSelected ? "selected" : shade);
      tile.dataset.row = row;
      tile.dataset.col = col;
      tile.addEventListener("click", () => {
        state.selected = { row, col };
        info.textContent = `Case sélectionnée : (${row}, ${col}) · Morpho ${state.morph} · Pantalon ${state.pants}`;
        draw();
      });
      parent.appendChild(tile);
    }
  }
}

/* ============================================================
   5. CORPS — PARTIES ANATOMIQUES PAR CALQUE
   Chaque fonction retourne un DocumentFragment / array de nodes
   à placer dans le calque nommé.
   ============================================================ */
const SKIN = "#e8c4a0";
const SKIN_DARK = "#c9a080";
const SKIN_MID = "#dbb494";
const OUTLINE = "#2a1c15";
const FOOT = "#8a6e5a";

function buildLegBack(m, w) {
  const nodes = [];
  const sx = -m.footSpread;
  const thick = m.legThick;
  // Cuisse arrière
  nodes.push(createPath(
    `M ${px(-m.hipW * 0.4, w)} ${px(m.hipY, w)}
     L ${px(sx - thick * 0.3, w)} ${px(m.kneeY, w)}
     L ${px(sx + thick * 0.5, w)} ${px(m.kneeY + 0.08, w)}
     L ${px(-m.hipW * 0.1, w)} ${px(m.hipY + 0.08, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  // Mollet
  nodes.push(createPath(
    `M ${px(sx - thick * 0.3, w)} ${px(m.kneeY, w)}
     L ${px(sx - thick * 0.4, w)} ${px(m.ankleY, w)}
     L ${px(sx + thick * 0.5, w)} ${px(m.ankleY + 0.02, w)}
     L ${px(sx + thick * 0.5, w)} ${px(m.kneeY + 0.08, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  // Pied
  nodes.push(createPath(
    `M ${px(sx - thick * 0.4, w)} ${px(m.ankleY, w)}
     L ${px(sx - thick * 0.2, w)} ${px(m.footY, w)}
     L ${px(sx + thick * 0.9, w)} ${px(m.footY, w)}
     L ${px(sx + thick * 0.5, w)} ${px(m.ankleY + 0.02, w)} Z`,
    FOOT, OUTLINE, 1.5
  ));
  return nodes;
}

function buildLegFront(m, w) {
  const nodes = [];
  const sx = m.footSpread;
  const thick = m.legThick;
  nodes.push(createPath(
    `M ${px(m.hipW * 0.15, w)} ${px(m.hipY, w)}
     L ${px(sx - thick * 0.2, w)} ${px(m.kneeY, w)}
     L ${px(sx + thick * 0.6, w)} ${px(m.kneeY + 0.08, w)}
     L ${px(m.hipW * 0.45, w)} ${px(m.hipY + 0.08, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(sx - thick * 0.2, w)} ${px(m.kneeY, w)}
     L ${px(sx, w)} ${px(m.ankleY, w)}
     L ${px(sx + thick * 0.9, w)} ${px(m.ankleY + 0.02, w)}
     L ${px(sx + thick * 0.6, w)} ${px(m.kneeY + 0.08, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(sx, w)} ${px(m.ankleY, w)}
     L ${px(sx + thick * 0.3, w)} ${px(m.footY, w)}
     L ${px(sx + thick * 1.4, w)} ${px(m.footY, w)}
     L ${px(sx + thick * 0.9, w)} ${px(m.ankleY + 0.02, w)} Z`,
    FOOT, OUTLINE, 1.5
  ));
  return nodes;
}

function buildArmBack(m, w) {
  const nodes = [];
  const shx = -m.shoulderW;
  const thick = m.armThick;
  nodes.push(createPath(
    `M ${px(shx + thick * 0.4, w)} ${px(m.shoulderY, w)}
     L ${px(shx - thick * 0.8, w)} ${px(m.elbowY, w)}
     L ${px(shx - thick * 0.1, w)} ${px(m.elbowY + 0.08, w)}
     L ${px(shx + thick * 1.0, w)} ${px(m.shoulderY + 0.12, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(shx - thick * 0.8, w)} ${px(m.elbowY, w)}
     L ${px(shx - thick * 1.1, w)} ${px(m.wristY, w)}
     L ${px(shx - thick * 0.3, w)} ${px(m.wristY + 0.04, w)}
     L ${px(shx - thick * 0.1, w)} ${px(m.elbowY + 0.08, w)} Z`,
    SKIN_DARK, OUTLINE, 1.5
  ));
  nodes.push(createEllipse(
    (shx - thick * 0.8) * w, m.wristY * w,
    0.04 * w * (m.armThick / 0.08), 0.035 * w * (m.armThick / 0.08),
    SKIN_DARK, OUTLINE, 1.5
  ));
  return nodes;
}

function buildArmFront(m, w) {
  const nodes = [];
  const shx = m.shoulderW;
  const thick = m.armThick;
  nodes.push(createPath(
    `M ${px(shx - thick * 0.5, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(shx + thick * 0.9, w)} ${px(m.elbowY, w)}
     L ${px(shx + thick * 0.2, w)} ${px(m.elbowY + 0.08, w)}
     L ${px(shx - thick * 1.0, w)} ${px(m.shoulderY + 0.12, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createPath(
    `M ${px(shx + thick * 0.9, w)} ${px(m.elbowY, w)}
     L ${px(shx + thick * 1.2, w)} ${px(m.wristY, w)}
     L ${px(shx + thick * 0.4, w)} ${px(m.wristY + 0.04, w)}
     L ${px(shx + thick * 0.2, w)} ${px(m.elbowY + 0.08, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  nodes.push(createEllipse(
    (shx + thick * 0.9) * w, m.wristY * w,
    0.045 * w * (m.armThick / 0.08), 0.038 * w * (m.armThick / 0.08),
    SKIN, OUTLINE, 1.5
  ));
  return nodes;
}

function buildTorso(m, w) {
  const nodes = [];
  const sw = m.shoulderW;
  const hw = m.hipW;
  // Torse principal
  nodes.push(createPath(
    `M ${px(-sw, w)} ${px(m.shoulderY, w)}
     L ${px(sw, w)} ${px(m.shoulderY - 0.05, w)}
     L ${px(hw, w)} ${px(m.waistY, w)}
     L ${px(-hw, w)} ${px(m.waistY, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  // Pectoraux
  const pecY = m.shoulderY + 0.08;
  const pecH = (m.waistY - m.shoulderY) * 0.45;
  nodes.push(createPath(
    `M ${px(-sw * 0.7, w)} ${px(pecY, w)}
     L ${px(-sw * 0.15, w)} ${px(pecY + 0.04, w)}
     L ${px(-sw * 0.15, w)} ${px(pecY + pecH, w)}
     L ${px(-sw * 0.7, w)} ${px(pecY + pecH - 0.02, w)} Z`,
    SKIN_MID, OUTLINE, 1.2
  ));
  nodes.push(createPath(
    `M ${px(sw * 0.7, w)} ${px(pecY - 0.02, w)}
     L ${px(sw * 0.15, w)} ${px(pecY + 0.04, w)}
     L ${px(sw * 0.15, w)} ${px(pecY + pecH, w)}
     L ${px(sw * 0.7, w)} ${px(pecY + pecH - 0.02, w)} Z`,
    SKIN_MID, OUTLINE, 1.2
  ));
  // Ligne abdominale (heavy/standard)
  if (m.id !== "light") {
    nodes.push(createPath(
      `M ${px(-0.02, w)} ${px(m.chestY, w)}
       L ${px(0.02, w)} ${px(m.chestY, w)}
       L ${px(0.02, w)} ${px(m.waistY, w)}
       L ${px(-0.02, w)} ${px(m.waistY, w)} Z`,
      SKIN_MID, OUTLINE, 1
    ));
  }
  return nodes;
}

function buildHead(m, w) {
  const nodes = [];
  // Cou
  nodes.push(createPath(
    `M ${px(-m.neckW, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(m.neckW, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(m.neckW * 0.85, w)} ${px(m.neckTop, w)}
     L ${px(-m.neckW * 0.85, w)} ${px(m.neckTop, w)} Z`,
    SKIN, OUTLINE, 1.5
  ));
  // Tête
  nodes.push(createEllipse(0, m.headY * w, m.headRx * w, m.headRy * w, SKIN, OUTLINE, 1.5));
  // Mâchoire (heavy)
  if (m.id === "heavy") {
    nodes.push(createPath(
      `M ${px(-m.headRx * 0.9, w)} ${px(m.headY + 0.05, w)}
       L ${px(-m.headRx * 0.8, w)} ${px(m.headY + m.headRy * 0.55, w)}
       L ${px(m.headRx * 0.8, w)} ${px(m.headY + m.headRy * 0.55, w)}
       L ${px(m.headRx * 0.9, w)} ${px(m.headY + 0.05, w)} Z`,
      SKIN, OUTLINE, 1.5
    ));
  }
  // Yeux
  const eyeY = m.headY - 0.02;
  const eyeRx = m.headRx * 0.2;
  const eyeRy = m.headRy * 0.12;
  nodes.push(createEllipse(-m.headRx * 0.4 * w, eyeY * w, eyeRx * w, eyeRy * w, "#1a1a1a", OUTLINE, 1));
  nodes.push(createEllipse( m.headRx * 0.4 * w, eyeY * w, eyeRx * w, eyeRy * w, "#1a1a1a", OUTLINE, 1));
  return nodes;
}

/* ============================================================
   6. ÉQUIPEMENTS — PANTALON IN / OVER
   IN  : s'arrête à la cheville (rentre dans les bottes)
   OVER: descend plus bas et plus large (par-dessus bottes)
   Chaque jambe est dessinée dans son calque respectif.
   ============================================================ */
function buildPantsLeg(m, w, side, mode, color) {
  // side: "back" | "front"
  const nodes = [];
  const isBack = side === "back";
  const sx = isBack ? -m.footSpread : m.footSpread;
  const fill = isBack ? darken(color, 0.18) : color;
  const stitch = darken(color, 0.35);
  const thick = m.legThick * m.pantsScaleX;
  const hipInner = isBack ? -m.hipW * 0.35 : m.hipW * 0.12;
  const hipOuter = isBack ? -m.hipW * 0.55 : m.hipW * 0.55;

  // Hem Y selon mode
  const hemY = mode === "over" ? m.footY * 0.7 : m.ankleY - 0.02;
  const flare = mode === "over" ? thick * 0.35 : 0;

  // Cuisse → genou
  nodes.push(createPath(
    `M ${px(hipInner, w)} ${px(m.hipY - 0.02, w)}
     L ${px(hipOuter, w)} ${px(m.hipY - 0.02, w)}
     L ${px(sx + (isBack ? -thick * 0.55 : thick * 0.75) + flare * 0.3, w)} ${px(m.kneeY, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.15) - flare * 0.1, w)} ${px(m.kneeY + 0.06, w)} Z`,
    fill, OUTLINE, 1.4
  ));

  // Genou → ourlet
  nodes.push(createPath(
    `M ${px(sx + (isBack ? -thick * 0.55 : thick * 0.75) + flare * 0.3, w)} ${px(m.kneeY, w)}
     L ${px(sx + (isBack ? -thick * 0.65 : thick * 0.95) + flare, w)} ${px(hemY, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.05) - flare * 0.2, w)} ${px(hemY + 0.015, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.15) - flare * 0.1, w)} ${px(m.kneeY + 0.06, w)} Z`,
    fill, OUTLINE, 1.4
  ));

  // Ourlet (bande)
  const hemBand = mode === "over" ? 0.035 : 0.025;
  nodes.push(createPath(
    `M ${px(sx + (isBack ? -thick * 0.65 : thick * 0.95) + flare, w)} ${px(hemY, w)}
     L ${px(sx + (isBack ? -thick * 0.65 : thick * 0.95) + flare, w)} ${px(hemY + hemBand, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.05) - flare * 0.2, w)} ${px(hemY + hemBand, w)}
     L ${px(sx + (isBack ? thick * 0.55 : -thick * 0.05) - flare * 0.2, w)} ${px(hemY + 0.015, w)} Z`,
    stitch, OUTLINE, 1.2
  ));

  // Couture centrale légère (jambe avant seulement)
  if (!isBack) {
    nodes.push(createPath(
      `M ${px(sx + thick * 0.25, w)} ${px(m.hipY + 0.05, w)}
       L ${px(sx + thick * 0.35, w)} ${px(hemY - 0.01, w)}`,
      "none", stitch, 1
    ));
  }

  return nodes;
}

function buildPantsWaist(m, w, color) {
  // Ceinture / haut du pantalon — calque torso (au-dessus des jambes arrière,
  // sous le haut éventuel : on le met dans legFront après le corps via hip belt
  // → ici on attache la ceinture au calque torso pour qu'elle s'asseye sous un haut).
  const nodes = [];
  const fill = color;
  const belt = darken(color, 0.3);
  nodes.push(createPath(
    `M ${px(-m.hipW * 1.05, w)} ${px(m.hipY - 0.06, w)}
     L ${px(m.hipW * 1.05, w)} ${px(m.hipY - 0.06, w)}
     L ${px(m.hipW * 0.95, w)} ${px(m.hipY + 0.04, w)}
     L ${px(-m.hipW * 0.95, w)} ${px(m.hipY + 0.04, w)} Z`,
    fill, OUTLINE, 1.4
  ));
  nodes.push(createPath(
    `M ${px(-m.hipW * 1.0, w)} ${px(m.hipY - 0.02, w)}
     L ${px(m.hipW * 1.0, w)} ${px(m.hipY - 0.02, w)}
     L ${px(m.hipW * 0.98, w)} ${px(m.hipY + 0.02, w)}
     L ${px(-m.hipW * 0.98, w)} ${px(m.hipY + 0.02, w)} Z`,
    belt, OUTLINE, 1.1
  ));
  return nodes;
}

/* ============================================================
   7. ÉQUIPEMENTS — HAUT (tunique) + CHAPEAU (casquette)
   Pour valider le système multi-calques.
   ============================================================ */
function buildTunic(m, w, color) {
  const nodes = [];
  const sw = m.shoulderW * m.torsoScaleX;
  const hw = m.hipW * m.torsoScaleX;
  const fill = color;
  const shade = darken(color, 0.2);
  // Corps de la tunique
  nodes.push(createPath(
    `M ${px(-sw * 0.95, w)} ${px(m.shoulderY + 0.02, w)}
     L ${px(sw * 0.95, w)} ${px(m.shoulderY - 0.02, w)}
     L ${px(hw * 1.15, w)} ${px(m.waistY + 0.08, w)}
     L ${px(-hw * 1.15, w)} ${px(m.waistY + 0.08, w)} Z`,
    fill, OUTLINE, 1.5
  ));
  // Col en V
  nodes.push(createPath(
    `M ${px(-sw * 0.25, w)} ${px(m.shoulderY + 0.04, w)}
     L ${px(0, w)} ${px(m.shoulderY + 0.22, w)}
     L ${px(sw * 0.25, w)} ${px(m.shoulderY + 0.02, w)}
     L ${px(0, w)} ${px(m.shoulderY + 0.18, w)} Z`,
    shade, OUTLINE, 1.1
  ));
  // Ourlet bas
  nodes.push(createPath(
    `M ${px(-hw * 1.15, w)} ${px(m.waistY + 0.04, w)}
     L ${px(hw * 1.15, w)} ${px(m.waistY + 0.04, w)}
     L ${px(hw * 1.15, w)} ${px(m.waistY + 0.08, w)}
     L ${px(-hw * 1.15, w)} ${px(m.waistY + 0.08, w)} Z`,
    shade, OUTLINE, 1.1
  ));
  return nodes;
}

function buildCap(m, w, color) {
  const nodes = [];
  const s = m.hatScale;
  const fill = color;
  const shade = darken(color, 0.25);
  const top = m.headY - m.headRy * 0.55;
  // Couronne
  nodes.push(createPath(
    `M ${px(-m.headRx * 1.05 * s, w)} ${px(m.headY - m.headRy * 0.15, w)}
     Q ${px(0, w)} ${px(top - 0.08 * s, w)} ${px(m.headRx * 1.05 * s, w)} ${px(m.headY - m.headRy * 0.15, w)}
     L ${px(m.headRx * 1.1 * s, w)} ${px(m.headY + 0.02, w)}
     L ${px(-m.headRx * 1.1 * s, w)} ${px(m.headY + 0.02, w)} Z`,
    fill, OUTLINE, 1.5
  ));
  // Visière (côté droit / avant isométrique)
  nodes.push(createPath(
    `M ${px(m.headRx * 0.2 * s, w)} ${px(m.headY - 0.02, w)}
     L ${px(m.headRx * 1.45 * s, w)} ${px(m.headY + 0.04, w)}
     L ${px(m.headRx * 1.15 * s, w)} ${px(m.headY + 0.08, w)}
     L ${px(m.headRx * 0.15 * s, w)} ${px(m.headY + 0.04, w)} Z`,
    shade, OUTLINE, 1.3
  ));
  return nodes;
}

/* ============================================================
   8. ANCRAGES VISUELS (debug)
   ============================================================ */
function buildAnchorMarkers(m, w) {
  const nodes = [];
  const anchors = getAnchors(m);
  const colors = {
    head: "#ff6b6b", neck: "#ffa07a",
    shoulderL: "#6fd8c8", shoulderR: "#6fd8c8",
    waistL: "#f0c040", waistR: "#f0c040", hip: "#f0c040",
    handL: "#a78bfa", handR: "#a78bfa",
    footL: "#60a5fa", footR: "#60a5fa",
    pivot: "#ff0044",
  };
  for (const [name, pos] of Object.entries(anchors)) {
    const r = name === "pivot" ? 0.035 * w : 0.028 * w;
    const e = createEllipse(pos.x * w, pos.y * w, r, r, colors[name] || "#fff", "#000", 1);
    e.setAttribute("opacity", "0.85");
    e.dataset.anchor = name;
    nodes.push(e);
  }
  return nodes;
}

/* ============================================================
   9. ASSEMBLEUR DE PERSONNAGE
   Crée les groupes de calques dans LAYER_ORDER, y injecte
   peau + équipements selon l'état courant.
   ============================================================ */
function createCharacter(cx, cy, tileW, morphId) {
  const m = MORPHS[morphId];
  const w = tileW;
  const root = el("g", {
    class: "character",
    transform: `translate(${cx}, ${cy})`,
    "data-morph": morphId,
  });
  root.style.pointerEvents = "none";

  // Créer les calques vides dans l'ordre Z
  const layers = {};
  for (const name of LAYER_ORDER) {
    layers[name] = el("g", { class: `layer layer-${name}`, "data-layer": name });
    root.appendChild(layers[name]);
  }

  // --- Peau ---
  for (const n of buildLegBack(m, w))  layers.legBack.appendChild(n);
  for (const n of buildArmBack(m, w))  layers.armBack.appendChild(n);
  for (const n of buildTorso(m, w))    layers.torso.appendChild(n);
  for (const n of buildHead(m, w))     layers.head.appendChild(n);
  for (const n of buildArmFront(m, w)) layers.armFront.appendChild(n);
  for (const n of buildLegFront(m, w)) layers.legFront.appendChild(n);

  // --- Pantalon (IN / OVER) ---
  // Jambe arrière → calque legBack (au-dessus de la peau)
  // Ceinture → calque torso (sous un éventuel haut : on l'ajoute AVANT la tunique)
  // Jambe avant → calque legFront
  if (state.pants !== "none") {
    const mode = state.pants; // "in" | "over"
    const color = state.pantsColor;
    for (const n of buildPantsLeg(m, w, "back", mode, color)) {
      layers.legBack.appendChild(n);
    }
    for (const n of buildPantsWaist(m, w, color)) {
      layers.torso.appendChild(n);
    }
    for (const n of buildPantsLeg(m, w, "front", mode, color)) {
      layers.legFront.appendChild(n);
    }
  }

  // --- Haut (tunique) — calque torso, au-dessus de la ceinture ---
  if (state.torso === "tunic") {
    for (const n of buildTunic(m, w, state.torsoColor)) {
      layers.torso.appendChild(n);
    }
  }

  // --- Chapeau — calque head, au-dessus de la tête ---
  if (state.hat === "cap") {
    for (const n of buildCap(m, w, state.hatColor)) {
      layers.head.appendChild(n);
    }
  }

  // --- Ancres debug ---
  if (state.showAnchors) {
    for (const n of buildAnchorMarkers(m, w)) {
      layers.anchors.appendChild(n);
    }
  }

  // --- Meta : pivot + label ---
  const pivot = createEllipse(0, 0, 0.03 * w, 0.03 * w, "#ff0044", "#ff0044", 1.5);
  pivot.setAttribute("opacity", "0.7");
  layers.meta.appendChild(pivot);

  const label = el("text", {
    x: 0,
    y: (m.headY - m.headRy - 0.18) * w,
    "text-anchor": "middle",
    "font-size": "9",
    fill: m.labelColor,
    "font-weight": "bold",
    "font-family": "Arial",
  });
  label.textContent = m.label;
  layers.meta.appendChild(label);

  return root;
}

/* ============================================================
   10. RENDU PRINCIPAL
   ============================================================ */
function draw() {
  const gridSize = parseInt(gridSizeInput.value, 10);
  const tileW = parseInt(tileWInput.value, 10);
  const tileH = tileW / 2; // ratio isométrique 2:1

  document.getElementById("gridSizeVal").textContent = gridSize;
  document.getElementById("tileWVal").textContent = tileW;

  // Clamp sélection si grille réduite
  state.selected.row = Math.min(state.selected.row, gridSize - 1);
  state.selected.col = Math.min(state.selected.col, gridSize - 1);

  const pad = tileW * 1.2;
  const gridPixelW = gridSize * tileW;
  const gridPixelH = gridSize * tileH;
  const charHeadroom = tileW * 2.3;
  const viewW = gridPixelW + pad * 2;
  const viewH = gridPixelH + pad * 2 + charHeadroom;

  const originX = viewW / 2;
  const originY = pad + charHeadroom * 0.35;

  svg.setAttribute("viewBox", `0 0 ${viewW} ${viewH}`);
  svg.innerHTML = "";

  const world = el("g", { class: "world" });
  svg.appendChild(world);

  drawGrid(world, gridSize, tileW, tileH, originX, originY);

  const { x: cx, y: cy } = isoToScreen(
    state.selected.row, state.selected.col, tileW, tileH, originX, originY
  );
  // Le point de pivot du perso = centre de la case (cx, cy)
  world.appendChild(createCharacter(cx, cy, tileW, state.morph));
}

/* ============================================================
   11. UI BINDINGS
   ============================================================ */
function bindButtonGroup(containerId, datasetKey, stateKey, labels) {
  const container = document.getElementById(containerId);
  container.querySelectorAll(".ctrl-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      container.querySelectorAll(".ctrl-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state[stateKey] = btn.dataset[datasetKey];
      info.textContent = labels
        ? labels(state[stateKey], btn)
        : `${stateKey} → ${state[stateKey]}`;
      draw();
    });
  });
}

bindButtonGroup("morphSelector", "morph", "morph", (v, btn) =>
  `Morphologie ${btn.textContent.trim()} · Pantalon ${state.pants}`
);
bindButtonGroup("pantsSelector", "pants", "pants", (v) =>
  `Pantalon : ${v === "none" ? "aucun" : v.toUpperCase()} · Morpho ${state.morph}`
);
bindButtonGroup("torsoSelector", "torso", "torso", (v) =>
  `Haut : ${v === "none" ? "aucun" : "tunique"} · Morpho ${state.morph}`
);
bindButtonGroup("hatSelector", "hat", "hat", (v) =>
  `Chapeau : ${v === "none" ? "aucun" : "casquette"} · Morpho ${state.morph}`
);
document.getElementById("anchorToggle").querySelectorAll(".ctrl-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.getElementById("anchorToggle").querySelectorAll(".ctrl-btn")
      .forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.showAnchors = btn.dataset.anchors === "on";
    info.textContent = state.showAnchors
      ? "Points d'ancrage visibles"
      : "Points d'ancrage masqués";
    draw();
  });
});

pantsColorInput.addEventListener("input", () => {
  state.pantsColor = pantsColorInput.value;
  draw();
});
torsoColorInput.addEventListener("input", () => {
  state.torsoColor = torsoColorInput.value;
  draw();
});
hatColorInput.addEventListener("input", () => {
  state.hatColor = hatColorInput.value;
  draw();
});

gridSizeInput.addEventListener("input", draw);
tileWInput.addEventListener("input", draw);

draw();
</script>
