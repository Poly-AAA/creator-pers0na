<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEURO CORE — Graphismes 8 vues</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin:0; height:100%; background:#0a0d0a; color:#e8e8e0; font-family:'Segoe UI', Arial, sans-serif; overflow:hidden; }
  .app { height:100dvh; display:flex; flex-direction:column; }
  .topbar {
    flex:0 0 auto;
    background: linear-gradient(180deg,#b81c1c,#7a1010);
    padding:8px 12px;
    font-size:12px; font-weight:700; text-align:center; letter-spacing:1px;
  }
  .info { flex:0 0 auto; font-size:11px; color:#9aa; text-align:center; padding:4px 8px; min-height:16px; }
  .stage { flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; }
  svg { width:min(94%, 62dvh); height:auto; touch-action: manipulation; }
  .tile { stroke:#173a28; stroke-width:1.5; cursor:pointer; transition: fill 0.1s; }
  .tile.light { fill:#3f7a54; }
  .tile.dark  { fill:#2f6b48; }
  .tile.selected { fill:#6fd8c8; }
  .tile-hit { cursor:pointer; pointer-events:all; }
  .character, .character * { pointer-events:none !important; }
  .controls {
    flex:0 0 auto; background:#16211a; border-top:1px solid #000;
    display:flex; flex-direction:column; max-height:48dvh; min-height:0;
  }
  .tabs {
    flex:0 0 auto; display:flex; gap:0; border-bottom:1px solid #243328;
    background:#101810;
  }
  .tab-btn {
    flex:1 1 0; background:transparent; border:none; border-bottom:2px solid transparent;
    color:#889; padding:10px 4px; font-size:11px; font-weight:600; cursor:pointer;
  }
  .tab-btn:hover { color:#ccd; background:#1a241c; }
  .tab-btn.active { color:#6fd8c8; border-bottom-color:#6fd8c8; background:#16211a; }
  .tab-panels { flex:1 1 auto; overflow-y:auto; padding:10px 12px; min-height:0; }
  .tab-panel { display:none; flex-direction:column; gap:8px; }
  .tab-panel.active { display:flex; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row label { font-size:11px; color:#ccd; flex:0 0 88px; }
  .row input[type=range] { flex:1 1 auto; accent-color:#6fd8c8; min-width:60px; }
  .row input[type=color] {
    width:36px; height:28px; padding:0; border:1px solid #2a4a33;
    background:#1f2e24; border-radius:4px; cursor:pointer;
  }
  .row .val { font-size:10px; color:#8a9; min-width:28px; text-align:right; }
  .btn-group { display:flex; gap:6px; flex-wrap:wrap; }
  .ctrl-btn {
    background:#1f2e24; border:2px solid #2a4a33; color:#aabb;
    padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { background:#2a4a33; }
  .ctrl-btn.active { background:#3f7a54; border-color:#6fd8c8; color:#fff; font-weight:bold; }
  .section-title {
    font-size:10px; color:#6fd8c8; letter-spacing:0.8px; text-transform:uppercase;
    margin-top:2px; padding-top:6px; border-top:1px solid #243328;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .section-title:first-child { border-top:none; padding-top:0; margin-top:0; }
  .slider-grid { display:flex; flex-direction:column; gap:4px; }
  .slider-row {
    display:grid; grid-template-columns: 78px 1fr 32px;
    align-items:center; gap:6px;
  }
  .slider-row span.label { font-size:10px; color:#9aa; }
  .slider-row span.num { font-size:10px; color:#6fd8c8; text-align:right; font-variant-numeric: tabular-nums; }
  .slider-row input[type=range] { width:100%; accent-color:#6fd8c8; }
  .facing-pad {
    display:grid;
    grid-template-columns: repeat(3, minmax(56px, 1fr));
    grid-template-rows: repeat(3, 42px);
    gap:6px; justify-content:center; margin:4px 0 8px; max-width:280px; margin-inline:auto;
  }
  .facing-pad .ctrl-btn { width:100%; height:42px; padding:2px 4px; font-size:9px; line-height:1.15; }
  .facing-center {
    display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#6fd8c8; font-weight:700; text-align:center;
  }
  .rot-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .hint { font-size:10px; color:#778; text-align:center; line-height:1.35; }
  .equip-slot {
    display:flex; flex-direction:column; gap:4px;
    padding-bottom:8px; margin-bottom:2px;
    border-bottom:1px solid #243328;
  }
  .equip-slot:last-child { border-bottom:none; padding-bottom:0; margin-bottom:0; }
  .equip-slot .row label { flex:1 1 auto; min-width:0; }
  .equip-slot .btn-group .ctrl-btn { padding:3px 8px; font-size:10px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">NEURO CORE — map · tourne vers la case (v3.1)</div>
  <div class="info" id="info">Clique une case autour du perso : il se tourne vers elle</div>
  <div class="stage"><svg id="scene"></svg></div>
  <div class="controls">
    <div class="tabs" id="mainTabs" role="tablist">
      <button class="tab-btn active" type="button" data-tab="corps">Corps</button>
      <button class="tab-btn" type="button" data-tab="equip">Équipements</button>
      <button class="tab-btn" type="button" data-tab="rotation">Rotation</button>
      <button class="tab-btn" type="button" data-tab="grille">Grille</button>
    </div>
    <div class="tab-panels">
      <div class="tab-panel active" id="panel-corps">
        <div class="row">
          <label>Morphologie</label>
          <div class="btn-group" id="morphSelector">

        </div>
        <div class="section-title">
          <span>Tronçons</span>

        </div>
        <div class="row">

          <div class="btn-group" id="chestShapeSelector">
            <button class="ctrl-btn" data-chest="flat">Plat</button>
            <button class="ctrl-btn active" data-chest="pec">Pecs</button>

        <div class="facing-pad" id="facingPad">
          <button class="ctrl-btn" type="button" data-facing="4">3/4 dos<br>gauche</button>
          <button class="ctrl-btn" type="button" data-facing="5">Dos</button>
          <button class="ctrl-btn" type="button" data-facing="6">3/4 dos<br>droit</button>
          <button class="ctrl-btn" type="button" data-facing="3">Profil<br>gauche</button>
          <div class="facing-center" id="facingLabel">3/4 F·D</div>
          <button class="ctrl-btn" type="button" data-facing="7">Profil<br>droit</button>
          <button class="ctrl-btn" type="button" data-facing="2">3/4 face<br>gauche</button>
          <button class="ctrl-btn active" type="button" data-facing="0">3/4 face<br>droit</button>
          <button class="ctrl-btn" type="button" data-facing="1">Face</button>

        <div class="rot-row">
          <button class="ctrl-btn" type="button" id="rotLeft">↺ −45°</button>
          <button class="ctrl-btn" type="button" id="rotRight">+45° ↻</button>
        </div>
        <div class="rot-row" style="margin-top:6px;">
          <button class="ctrl-btn" type="button" id="galleryMorphs">Galerie 3 morphos</button>
          <button class="ctrl-btn" type="button" id="galleryFacings">Galerie 8 vues</button>
        </div>
        <div class="row" style="justify-content:center;">
          <span class="val" id="facingDeg" style="min-width:auto;">3/4 face-droit · SE · 45°</span>
        </div>
      </div>

      <div class="tab-panel" id="panel-grille">
        <div class="row">
          <label>Ancres</label>
          <div class="btn-group" id="anchorToggle">
            <button class="ctrl-btn" data-anchors="off">Masquer</button>
            <button class="ctrl-btn active" data-anchors="on">Afficher</button>
          </div>
        </div>
        <div class="row">
          <label>Taille grille</label>
          <input type="range" id="gridSize" min="3" max="8" step="1" value="5">
          <span id="gridSizeVal" class="val">5</span>
        </div>
        <div class="row">
          <label>Largeur case</label>
          <input type="range" id="tileW" min="30" max="70" step="2" value="52">
          <span id="tileWVal" class="val">52</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   NEURO CORE — Graphismes 8 vues (pivot / angles / physique)
   Inspiré turnaround Dofus-like + planche NEURO-CORE
   ============================================================
   RÈGLES ANTI-ERREUR :
   1. Pivot TOUJOURS entre les pieds (0, 0) — jamais déplacé
   2. Hauteurs Y figées (tête, épaules, taille, genoux, pieds)
      identiques sur les 8 vues → pas de saut à la rotation
   3. Foreshortening via facteurs X (spread), jamais via Y
   4. Ombre au sol ancrée sur le pivot
   5. Miroir UNIQUEMENT pour gauche↔droite (géométrie symétrique)
   6. Équipements lisent le même profil → restent calés
   ============================================================ */

const svg = document.getElementById("scene");
const info = document.getElementById("info");
const gridSizeInput = document.getElementById("gridSize");
const tileWInput = document.getElementById("tileW");
// Phase 3 : couleurs gérées via state.colors + UI dynamique

const BODY_SLIDER_DEFS = [
  { key: "neck",          label: "Cou",          min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
  { key: "shoulderWidth", label: "Épaules Ø",    min: 0.6, max: 1.5, step: 0.05, def: 1.0 },
  { key: "shoulderCap",   label: "Haut épaules", min: 0.0, max: 1.6, step: 0.05, def: 1.0 },
  { key: "biceps",        label: "Biceps",       min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
  { key: "elbow",         label: "Coudes",       min: 0.4, max: 1.8, step: 0.05, def: 1.0 },
  { key: "forearm",       label: "Avant-bras",   min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
  { key: "chestSize",     label: "Poitrine Ø",   min: 0.0, max: 1.4, step: 0.05, def: 0.5 },
  { key: "belly",         label: "Ventre",       min: 0.0, max: 1.2, step: 0.05, def: 0.1 },
  { key: "waist",         label: "Taille",       min: 0.6, max: 1.5, step: 0.05, def: 1.0 },
  { key: "hips",          label: "Hanches",      min: 0.6, max: 1.6, step: 0.05, def: 1.0 },
  { key: "glutes",        label: "Fesses",       min: 0.0, max: 1.4, step: 0.05, def: 0.35 },
  { key: "thigh",         label: "Cuisses",      min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
  { key: "calf",          label: "Mollets",      min: 0.5, max: 1.6, step: 0.05, def: 1.0 },
];

function defaultBodyCustom() {
  const body = { chestShape: "pec" };
  for (const d of BODY_SLIDER_DEFS) body[d.key] = d.def;
  return body;
}

const state = {
  selected: { row: 2, col: 2 },
  morph: "standard",
  body: defaultBodyCustom(),
  charHeight: 1.0,
  charSize: 1.05,
  facing: 0,
  // Phase 3 — équipements modulaires
  equip: {
    hair: "short",
    hat: "none",
    top: "tunic",
    pants: "in",
    boots: "leather",
    weapon: "none",
    accessory: "belt",
  },
  colors: {
    hair: "#2c2420",
    hat: "#2d3748",
    top: "#3b6ea5",
    pants: "#3d2b1f",
    boots: "#2a221c",
    weapon: "#c0a060",
    accessory: "#c4a35a",
  },
  preset: "aventurier",
  showAnchors: false,
  galleryMorphs: false,
  galleryFacings: false,
};

/* ============================================================
   MORPHOLOGIES — proportions style Dofus (tête + grosse, corps compact)
   Hauteurs Y LOCKÉES (anti-jitter rotation)
   ============================================================ */
const Y = {
  head: -1.58,
  neck: -1.36,
  shoulder: -1.22,
  chest: -0.98,
  waist: -0.72,
  hip: -0.62,
  knee: -0.26,
  ankle: -0.02,
  foot: 0.045,
  elbow: -0.86,
  wrist: -0.52,
};

const MORPHS = {
  heavy: {
    id: "heavy", label: "LOURD", labelColor: "#ff8a8a",
    shoulderW: 0.40, hipW: 0.30, waistW: 0.30, footSpread: 0.20,
    headRx: 0.24, headRy: 0.28, neckW: 0.07,
    armThick: 0.10, legThick: 0.105,
  },
  standard: {
    id: "standard", label: "STANDARD", labelColor: "#6fd8c8",
    shoulderW: 0.32, hipW: 0.22, waistW: 0.20, footSpread: 0.16,
    headRx: 0.22, headRy: 0.26, neckW: 0.055,
    armThick: 0.078, legThick: 0.08,
  },
  light: {
    id: "light", label: "FIN", labelColor: "#c4b5fd",
    shoulderW: 0.26, hipW: 0.17, waistW: 0.15, footSpread: 0.13,
    headRx: 0.20, headRy: 0.25, neckW: 0.045,
    armThick: 0.06, legThick: 0.06,
  },
};

/**
 * 8 vues — alignées sur le turnaround de référence
 * mirror: flip X seulement (symétrie gauche/droite)
 * kind: type de silhouette (pas de changement de hauteur)
 * near: quelle jambe/bras est au premier plan (avant miroir)
 */
const FACINGS = [
  { id: 0, key: "SE", short: "3/4 F·D", name: "3/4 face-droit",  deg: 45,  mirror: false, kind: "qFront", near: "R" },
  { id: 1, key: "S",  short: "Face",    name: "Face",             deg: 90,  mirror: false, kind: "front",  near: "R" },
  { id: 2, key: "SW", short: "3/4 F·G", name: "3/4 face-gauche", deg: 135, mirror: true,  kind: "qFront", near: "R" },
  { id: 3, key: "W",  short: "Prof. G", name: "Profil gauche",   deg: 180, mirror: true,  kind: "side",   near: "R" },
  { id: 4, key: "NW", short: "3/4 D·G", name: "3/4 dos-gauche",  deg: 225, mirror: true,  kind: "qBack",  near: "R" },
  { id: 5, key: "N",  short: "Dos",     name: "Dos",              deg: 270, mirror: false, kind: "back",   near: "R" },
  { id: 6, key: "NE", short: "3/4 D·D", name: "3/4 dos-droit",   deg: 315, mirror: false, kind: "qBack",  near: "R" },
  { id: 7, key: "E",  short: "Prof. D", name: "Profil droit",    deg: 0,   mirror: false, kind: "side",   near: "R" },
];

function getFacing(id = state.facing) {
  return FACINGS[((id % 8) + 8) % 8];
}

/**
 * Orientation Dofus : regarde dans la direction du déplacement à l'écran.
 * 0° = droite (E), 90° = bas (S), etc.
 */
function facingFromScreenDelta(dx, dy) {
  if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) return state.facing;
  const angle = Math.atan2(dy, dx); // -PI..PI
  let sector = Math.round(angle / (Math.PI / 4)); // -4..4
  if (sector === -4) sector = 4;
  // 0=E, 1=SE, 2=S, 3=SW, 4=W, -3=NW, -2=N, -1=NE
  const map = { 0: 7, 1: 0, 2: 1, 3: 2, 4: 3, "-3": 4, "-2": 5, "-1": 6 };
  return map[sector] !== undefined ? map[sector] : state.facing;
}

/** Fallback grille (Δcol / Δrow) si pas de layout écran */
function facingFromDelta(dRow, dCol) {
  const sr = Math.sign(dRow);
  const sc = Math.sign(dCol);
  if (sr === 0 && sc === 0) return state.facing;
  const table = {
    "1,0": 0, "1,1": 1, "0,1": 2, "-1,1": 3,
    "-1,0": 4, "-1,-1": 5, "0,-1": 6, "1,-1": 7,
  };
  return table[`${sc},${sr}`] ?? state.facing;
}

function moveToTile(row, col) {
  const gridSize = parseInt(gridSizeInput.value, 10);
  if (row < 0 || col < 0 || row >= gridSize || col >= gridSize) return;

  const from = state.selected;
  const dRow = row - from.row;
  const dCol = col - from.col;
  if (dRow === 0 && dCol === 0) {
    info.textContent = `Case (${row},${col}) · ${getFacing().name}`;
    return;
  }

  // Direction à l'écran (comme Dofus) — plus fiable que le delta grille seul
  let nextFacing = facingFromDelta(dRow, dCol);
  if (state.layout) {
    const { tileW, tileH, ox, oy } = state.layout;
    const a = isoToScreen(from.row, from.col, tileW, tileH, ox, oy);
    const b = isoToScreen(row, col, tileW, tileH, ox, oy);
    nextFacing = facingFromScreenDelta(b.x - a.x, b.y - a.y);
  }

  state.facing = nextFacing;
  state.selected = { row, col };
  // Quitte les galeries : on veut voir le perso tourner sur la map
  state.galleryFacings = false;
  state.galleryMorphs = false;
  const gm = document.getElementById("galleryMorphs");
  const gf = document.getElementById("galleryFacings");
  if (gm) gm.classList.remove("active");
  if (gf) gf.classList.remove("active");

  syncFacingUI();
  const f = getFacing();
  info.textContent = `→ (${row},${col}) · ${f.short} (${f.name})`;
  draw();
}

/** Facteur d'écartement horizontal selon la vue (foresight X only) */
function spreadFor(kind) {
  if (kind === "front" || kind === "back") return 1.0;
  if (kind === "qFront" || kind === "qBack") return 0.82;
  return 0.38; // side
}

function resolveMorph(morphId, body = state.body) {
  const base = MORPHS[morphId];
  const b = body;
  const h = state.charHeight; // hauteur globale — scale Y depuis les pieds
  const m = { ...base };

  // Hauteurs Y de base × hauteur perso (pivot reste à 0)
  m.head = Y.head * h;
  m.neck = Y.neck * h;
  m.shoulder = Y.shoulder * h;
  m.chest = Y.chest * h;
  m.waist = Y.waist * h;
  m.hip = Y.hip * h;
  m.knee = Y.knee * h;
  m.ankle = Y.ankle * h;
  m.foot = Y.foot * h;

  // Longueur des segments bras : suit Hauteur + curseurs Biceps / Avant-bras
  // (sinon les bras restent courts/minces quand le corps grandit)
  const upperLen = 0.65 + 0.35 * b.biceps;   // allonge le bras supérieur
  const foreLen  = 0.65 + 0.35 * b.forearm;  // allonge l'avant-bras
  m.elbow = m.shoulder + (Y.elbow - Y.shoulder) * h * upperLen;
  m.wrist = m.elbow    + (Y.wrist - Y.elbow)    * h * foreLen;

  m.neckW = base.neckW * b.neck;
  m.shoulderW = base.shoulderW * b.shoulderWidth;
  m.shoulderCap = b.shoulderCap;

  // Épaisseur bras : suit Hauteur × curseurs (effet bien visible)
  const thickScale = h;
  m.biceps    = base.armThick * b.biceps    * thickScale;
  m.forearm   = base.armThick * b.forearm   * thickScale;
  m.elbowBulk = base.armThick * b.elbow     * thickScale;
  m.handSize  = base.armThick * 0.55 * ((b.biceps + b.forearm) / 2) * thickScale;

  m.chestShape = b.chestShape;
  m.chestSize = b.chestSize;
  m.belly = b.belly;
  m.waistW = base.waistW * b.waist;
  m.hipW = base.hipW * b.hips;
  m.glutes = b.glutes;

  // Jambes : même logique (épaisseur × hauteur)
  m.thigh = base.legThick * b.thigh * thickScale;
  m.calf  = base.legThick * b.calf  * thickScale;
  m.footSpread = base.footSpread;
  m.headRx = base.headRx;
  m.headRy = base.headRy * h;
  m.legThick = (m.thigh + m.calf) / 2;
  m.armThick = (m.biceps + m.forearm) / 2;
  m.charSize = state.charSize;
  m.charHeight = h;
  m.upperLen = upperLen;
  m.foreLen = foreLen;
  return m;
}


/* ============================================================
   PHASE 3 — BIBLIOTHÈQUE D'ÉQUIPEMENTS + PRESETS
   ============================================================ */
const EQUIP_SLOTS = [
  { key: "hair",      label: "Coiffure" },
  { key: "hat",       label: "Chapeau" },
  { key: "top",       label: "Haut" },
  { key: "pants",     label: "Bas" },
  { key: "boots",     label: "Bottes" },
  { key: "weapon",    label: "Arme" },
  { key: "accessory", label: "Accessoire" },
];

const EQUIP_OPTIONS = {
  hair: [
    { id: "none", label: "Aucun" },
    { id: "short", label: "Court" },

function applyPreset(id) {
  const p = PRESETS[id];
  if (!p) return;
  state.preset = id;
  state.equip = { ...p.equip };
  state.colors = { ...p.colors };
  buildEquipUI();
  info.textContent = `Preset : ${p.label}`;
  draw();
}

function buildEquipUI() {
  const presetHost = document.getElementById("presetSelector");
  const slotsHost = document.getElementById("equipSlots");
  if (!presetHost || !slotsHost) return;

  presetHost.innerHTML = "";
  for (const [id, p] of Object.entries(PRESETS)) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ctrl-btn" + (state.preset === id ? " active" : "");
    btn.dataset.preset = id;
    btn.textContent = p.label;
    btn.addEventListener("click", () => applyPreset(id));
    presetHost.appendChild(btn);
  }

  slotsHost.innerHTML = "";
  for (const slot of EQUIP_SLOTS) {
    const wrap = document.createElement("div");
    wrap.className = "equip-slot";

    const head = document.createElement("div");
    head.className = "row";
    const lab = document.createElement("label");
    lab.textContent = slot.label;
    const color = document.createElement("input");
    color.type = "color";
    color.value = state.colors[slot.key] || "#888888";
    color.title = `Couleur ${slot.label}`;
    color.addEventListener("input", () => {
      state.colors[slot.key] = color.value;
      state.preset = null;
      document.querySelectorAll("#presetSelector .ctrl-btn").forEach((b) => b.classList.remove("active"));
      info.textContent = `${slot.label} couleur → ${color.value}`;
      draw();
    });
    head.append(lab, color);
    wrap.appendChild(head);

    const group = document.createElement("div");
    group.className = "btn-group";
    for (const opt of EQUIP_OPTIONS[slot.key] || []) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ctrl-btn" + (state.equip[slot.key] === opt.id ? " active" : "");
      btn.textContent = opt.label;
      btn.addEventListener("click", () => {
        state.equip[slot.key] = opt.id;
        state.preset = null;
        buildEquipUI();
        info.textContent = `${slot.label} : ${opt.label}`;
        draw();
      });
      group.appendChild(btn);
    }
    wrap.appendChild(group);
    slotsHost.appendChild(wrap);
  }
}

function applyFacing(m, facingId = state.facing) {
  const f = getFacing(facingId);
  const spread = spreadFor(f.kind);
  const out = { ...m, facing: f, spread };
  // Largeur projetée — on NE touche PAS aux Y
  out.shoulderW = m.shoulderW * spread;
  out.hipW = m.hipW * spread;
  out.waistW = m.waistW * spread;
  out.footSpread = m.footSpread * (f.kind === "side" ? 0.25 : (f.kind === "front" || f.kind === "back" ? 0.55 : 1));
  if (f.kind === "back" || f.kind === "qBack") {
    out.glutes = Math.min(1.5, m.glutes * 1.2 + 0.08);
    out.chestSize = m.chestSize * 0.25;
  }
  if (f.kind === "side") {
    out.headRx = m.headRx * 0.82;
  }
  return out;
}

/* ============================================================
   SVG UTILS + PALETTE DOFUS (contours gras, cel-shade, lumière HG)
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const OUT = "#1a1210";       // contour épais style Ankama
const SKIN = "#f0c8a0";
const SKIN_L = "#f8dcb8";
const SKIN_D = "#d4a57a";
const SKIN_M = "#e8b888";

function el(tag, attrs = {}) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null && v !== "") n.setAttribute(k, v);
  }
  return n;
}
function path(d, fill, stroke = OUT, sw = 1.85) {
  return el("path", { d, fill, stroke, "stroke-width": sw, "stroke-linejoin": "round", "stroke-linecap": "round" });
}
function oval(cx, cy, rx, ry, fill, stroke = OUT, sw = 1.85) {
  return el("ellipse", { cx, cy, rx, ry, fill, stroke, "stroke-width": sw });
}
function px(v, w) { return (v * w).toFixed(2); }
function darken(hex, a = 0.22) {
  const n = hex.replace("#", "");
  const r = Math.max(0, Math.round(parseInt(n.slice(0, 2), 16) * (1 - a)));
  const g = Math.max(0, Math.round(parseInt(n.slice(2, 4), 16) * (1 - a)));
  const b = Math.max(0, Math.round(parseInt(n.slice(4, 6), 16) * (1 - a)));
  return `#${r.toString(16).padStart(2,"0")}${g.toString(16).padStart(2,"0")}${b.toString(16).padStart(2,"0")}`;
}

function getAnchors(m) {
  const reach = 0.55 + 0.45 * (m.upperLen || 1);
  const elbowX = m.shoulderW * (0.35 + reach * 0.5);
  const wristX = elbowX + m.shoulderW * (0.25 + (m.foreLen || 1) * 0.2);
  return {
    head: { x: 0, y: m.head },
    neck: { x: 0, y: m.neck },
    shoulderL: { x: -m.shoulderW, y: m.shoulder },
    shoulderR: { x:  m.shoulderW, y: m.shoulder },
    elbowL: { x: -elbowX, y: m.elbow },
    elbowR: { x:  elbowX, y: m.elbow },
    waistL: { x: -m.waistW * 0.9, y: m.waist },
    waistR: { x:  m.waistW * 0.9, y: m.waist },
    hip: { x: 0, y: m.hip },
    handL: { x: -wristX, y: m.wrist },
    handR: { x:  wristX, y: m.wrist },
    footL: { x: -m.footSpread, y: m.ankle },
    footR: { x:  m.footSpread, y: m.ankle },
    pivot: { x: 0, y: 0 },
  };
}

/* ============================================================
   GRILLE ISO 2:1
   ============================================================ */
function isoToScreen(row, col, tileW, tileH, ox, oy) {
  return { x: ox + (col - row) * (tileW / 2), y: oy + (col + row) * (tileH / 2) };
}

function drawGrid(parent, gridSize, tileW, tileH, ox, oy) {
  const tiles = el("g", { class: "tiles" });
  parent.appendChild(tiles);
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const { x: cx, y: cy } = isoToScreen(row, col, tileW, tileH, ox, oy);
      const hw = tileW / 2, hh = tileH / 2;
      const d = `M ${cx} ${cy - hh} L ${cx + hw} ${cy} L ${cx} ${cy + hh} L ${cx - hw} ${cy} Z`;
      const sel = state.selected.row === row && state.selected.col === col;
      const shade = (row + col) % 2 === 0 ? "light" : "dark";
      const tile = path(d, sel ? "#6fd8c8" : (shade === "light" ? "#3f7a54" : "#2f6b48"), "#173a28", 1.5);
      tile.classList.add("tile", sel ? "selected" : shade);
      tile.setAttribute("data-row", String(row));
      tile.setAttribute("data-col", String(col));
      tiles.appendChild(tile);
    }
  }
}

/** Couche cliquable AU-DESSUS du perso (sinon le SVG du corps mange les taps) */
function drawTileHitLayer(parent, gridSize, tileW, tileH, ox, oy) {
  const hits = el("g", { class: "tile-hits" });
  hits.setAttribute("pointer-events", "all");
  parent.appendChild(hits);
  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const { x: cx, y: cy } = isoToScreen(row, col, tileW, tileH, ox, oy);
      const hw = tileW / 2, hh = tileH / 2;
      const d = `M ${cx} ${cy - hh} L ${cx + hw} ${cy} L ${cx} ${cy + hh} L ${cx - hw} ${cy} Z`;
      const hit = path(d, "rgba(0,0,0,0)", "none", 0);
      hit.classList.add("tile-hit");
      hit.setAttribute("data-row", String(row));
      hit.setAttribute("data-col", String(col));
      hit.setAttribute("pointer-events", "all");
      hit.style.cursor = "pointer";
      hits.appendChild(hit);
    }
  }
}

/* ============================================================
   CORPS — polish vectoriel (lumière HG, cel-shade léger)
   Structure inchangée : pivot / Y / facing / calques
   ============================================================ */
function buildShadow(m, w) {
  // Ombre proportionnelle à l'écartement des pieds + taille
  const s = (m.footSpread || 0.16) / 0.16;
  return [
    oval(0.02 * w, 0.03 * w, 0.30 * s * w, 0.095 * w, "rgba(0,0,0,0.16)", "none", 0),
    oval(0, 0.012 * w, 0.20 * s * w, 0.06 * w, "rgba(0,0,0,0.34)", "none", 0),
  ];
}

function limbColors(far) {
  return far
    ? { fill: SKIN_D, mid: darken(SKIN_D, 0.1), hi: SKIN_M }
    : { fill: SKIN, mid: SKIN_M, hi: SKIN_L };
}

/** Sous-vêtement de base (si pas de pantalon) — lisibilité type planche ref */
function buildBaseShorts(m, w, kind) {
  if (state.equip.pants !== "none") return [];
  const nodes = [];
  const col = "#3a4555";
  const shade = darken(col, 0.2);
  const hw = m.hipW;
  nodes.push(path(
    `M ${px(-hw * 1.05, w)} ${px(m.hip - 0.04, w)}
     Q ${px(-hw * 1.1, w)} ${px(m.hip + 0.08, w)} ${px(-hw * 0.55, w)} ${px(m.hip + 0.16, w)}
     L ${px(-hw * 0.12, w)} ${px(m.hip + 0.08, w)}
     L ${px(hw * 0.12, w)} ${px(m.hip + 0.08, w)}
     L ${px(hw * 0.55, w)} ${px(m.hip + 0.16, w)}
     Q ${px(hw * 1.1, w)} ${px(m.hip + 0.08, w)} ${px(hw * 1.05, w)} ${px(m.hip - 0.04, w)} Z`,
    col, OUT, 1.2
  ));
  if (kind !== "back" && kind !== "qBack") {
    nodes.push(path(
      `M ${px(0, w)} ${px(m.hip - 0.02, w)} L ${px(0, w)} ${px(m.hip + 0.1, w)}`,
      "none", shade, 1.2
    ));
  }
  return nodes;
}

function buildBaseTop(m, w, kind) {
  // Débardeur simple si pas de haut — comme les refs athletic
  if (state.equip.top !== "none") return [];
  const nodes = [];
  const col = "#4a5568";
  const sw = m.shoulderW * 0.92;
  const ww = m.waistW * 1.05;
  nodes.push(path(
    `M ${px(-sw * 0.85, w)} ${px(m.shoulder + 0.04, w)}
     Q ${px(-ww, w)} ${px(m.waist, w)} ${px(-ww * 0.95, w)} ${px(m.hip - 0.02, w)}
     L ${px(ww * 0.95, w)} ${px(m.hip - 0.02, w)}
     Q ${px(ww, w)} ${px(m.waist, w)} ${px(sw * 0.85, w)} ${px(m.shoulder + 0.02, w)}
     L ${px(sw * 0.35, w)} ${px(m.shoulder + 0.06, w)}
     Q ${px(0, w)} ${px(m.shoulder + 0.22, w)} ${px(-sw * 0.35, w)} ${px(m.shoulder + 0.06, w)} Z`,
    col, OUT, 1.25
  ));
  if (kind === "back" || kind === "qBack") {
    // Dos du débardeur plus sombre
    nodes.push(path(
      `M ${px(-sw * 0.7, w)} ${px(m.shoulder + 0.08, w)}
       L ${px(sw * 0.7, w)} ${px(m.shoulder + 0.06, w)}
       L ${px(ww * 0.7, w)} ${px(m.waist, w)}
       L ${px(-ww * 0.7, w)} ${px(m.waist, w)} Z`,
      darken(col, 0.12), OUT, 1
    ));
  }
  return nodes;
}

/** Jambe (side = -1 gauche / +1 droite, far = arrière-plan) */
function buildLeg(m, w, side, far, kind) {
  const nodes = [];
  const c = limbColors(far);
  const sx = side * m.footSpread;
  const hipX = side * m.hipW * (kind === "side" ? 0.15 : 0.55);
  const th = m.thigh * (kind === "side" ? 0.9 : 1);
  const cf = m.calf * (kind === "side" ? 0.9 : 1);
  const boot = "#2f2a28";
  const bootHi = "#4a423e";
  const h = m.charHeight || 1;

  // Cuisse
  nodes.push(path(
    `M ${px(hipX - side * th * 0.15, w)} ${px(m.hip, w)}
     C ${px(hipX - side * th * 0.55, w)} ${px((m.hip + m.knee) / 2, w)},
       ${px(sx - side * th * 0.4, w)} ${px(m.knee + 0.04 * h, w)},
       ${px(sx - side * th * 0.12, w)} ${px(m.knee, w)}
     L ${px(sx + side * th * 0.6, w)} ${px(m.knee + 0.035 * h, w)}
     C ${px(hipX + side * th * 0.45, w)} ${px((m.hip + m.knee) / 2, w)},
       ${px(hipX + side * th * 0.22, w)} ${px(m.hip + 0.04 * h, w)},
       ${px(hipX + side * th * 0.12, w)} ${px(m.hip, w)} Z`,
    c.fill
  ));
  // Highlight cuisse (lumière HG)
  if (!far) {
    nodes.push(path(
      `M ${px(hipX - side * th * 0.02, w)} ${px(m.hip + 0.04 * h, w)}
       Q ${px(sx + side * th * 0.15, w)} ${px((m.hip + m.knee) / 2, w)}
         ${px(sx + side * th * 0.25, w)} ${px(m.knee + 0.01 * h, w)}`,
      "none", c.hi, 1.6
    ));
  }
  // Genou
  nodes.push(oval(
    (sx + side * th * 0.2) * w, m.knee * w,
    Math.max(0.02, th * 0.35) * w, Math.max(0.016, th * 0.28) * w,
    c.mid, OUT, 1.1
  ));
  // Mollet
  nodes.push(path(
    `M ${px(sx - side * th * 0.12, w)} ${px(m.knee, w)}
     C ${px(sx - side * cf * 0.6, w)} ${px((m.knee + m.ankle) / 2, w)},
       ${px(sx - side * cf * 0.38, w)} ${px(m.ankle - 0.015 * h, w)},
       ${px(sx - side * cf * 0.12, w)} ${px(m.ankle, w)}
     L ${px(sx + side * cf * 0.58, w)} ${px(m.ankle + 0.012 * h, w)}
     C ${px(sx + side * cf * 0.5, w)} ${px((m.knee + m.ankle) / 2, w)},
       ${px(sx + side * th * 0.58, w)} ${px(m.knee + 0.05 * h, w)},
       ${px(sx + side * th * 0.55, w)} ${px(m.knee + 0.03 * h, w)} Z`,
    c.mid
  ));
  // Botte (volume + semelle)
  const toe = kind === "side" ? side * 0.15 : side * 0.11;
  nodes.push(path(
    `M ${px(sx - side * cf * 0.22, w)} ${px(m.ankle - 0.01 * h, w)}
     L ${px(sx - side * 0.04, w)} ${px(m.foot, w)}
     L ${px(sx + toe + side * 0.07, w)} ${px(m.foot, w)}
     L ${px(sx + side * cf * 0.55, w)} ${px(m.ankle, w)}
     L ${px(sx + side * cf * 0.35, w)} ${px(m.ankle - 0.08 * h, w)}
     L ${px(sx - side * cf * 0.05, w)} ${px(m.ankle - 0.08 * h, w)} Z`,
    boot
  ));
  nodes.push(path(
    `M ${px(sx - side * 0.03, w)} ${px(m.foot, w)}
     L ${px(sx + toe + side * 0.07, w)} ${px(m.foot, w)}
     L ${px(sx + toe + side * 0.05, w)} ${px(m.foot + 0.02 * h, w)}
     L ${px(sx - side * 0.02, w)} ${px(m.foot + 0.02 * h, w)} Z`,
    "#1a1614", OUT, 1
  ));
  // Reflet botte
  if (!far) {
    nodes.push(path(
      `M ${px(sx + side * 0.02, w)} ${px(m.ankle - 0.06 * h, w)}
       L ${px(sx + side * 0.08, w)} ${px(m.foot - 0.01 * h, w)}`,
      "none", bootHi, 1.3
    ));
  }
  return nodes;
}

function buildArm(m, w, side, far, kind) {
  const nodes = [];
  const c = limbColors(far);
  const shx = side * m.shoulderW;
  const h = m.charHeight || 1;
  const bi = Math.max(0.028, m.biceps) * (kind === "side" ? 1.0 : 1.12);
  const fo = Math.max(0.024, m.forearm) * (kind === "side" ? 1.0 : 1.12);

  // Placement X selon la vue — profil = bras le long du corps
  let elbowX, wristX;
  if (kind === "side") {
    elbowX = shx + side * bi * 0.25;
    wristX = shx + side * fo * 0.15;
  } else if (kind === "front" || kind === "back") {
    elbowX = shx + side * (m.shoulderW * 0.15 + bi * 0.5);
    wristX = elbowX + side * (fo * 0.35);
  } else {
    // 3/4
    const reach = 0.5 + 0.4 * (m.upperLen || 1);
    const reachF = 0.45 + 0.4 * (m.foreLen || 1);
    elbowX = shx + side * (bi * 0.3 + m.shoulderW * reach * 0.45);
    wristX = elbowX + side * (fo * 0.22 + m.shoulderW * reachF * 0.3);
  }

  if (m.shoulderCap > 0.1) {
    const r = (0.028 + m.shoulderCap * 0.042 + bi * 0.22) * w;
    nodes.push(oval(shx * w, (m.shoulder + 0.015 * h) * w, r, r * 0.82, c.fill));
  }

  nodes.push(path(
    `M ${px(shx - side * bi * 0.32, w)} ${px(m.shoulder, w)}
     Q ${px(elbowX - side * bi * 0.65, w)} ${px((m.shoulder + m.elbow) / 2, w)}
       ${px(elbowX - side * bi * 0.4, w)} ${px(m.elbow, w)}
     L ${px(elbowX + side * bi * 0.5, w)} ${px(m.elbow + 0.025 * h, w)}
     Q ${px(shx + side * bi * 0.5, w)} ${px((m.shoulder + m.elbow) / 2, w)}
       ${px(shx + side * bi * 0.38, w)} ${px(m.shoulder + 0.04 * h, w)} Z`,
    c.fill
  ));

  const er = Math.max(0.016, 0.018 + m.elbowBulk * 0.5) * w;
  nodes.push(oval(elbowX * w, (m.elbow + 0.012 * h) * w, er, er * 0.82, c.mid));

  nodes.push(path(
    `M ${px(elbowX - side * bi * 0.32, w)} ${px(m.elbow, w)}
     Q ${px(wristX - side * fo * 0.5, w)} ${px((m.elbow + m.wrist) / 2, w)}
       ${px(wristX - side * fo * 0.32, w)} ${px(m.wrist, w)}
     L ${px(wristX + side * fo * 0.42, w)} ${px(m.wrist + 0.02 * h, w)}
     Q ${px(elbowX + side * fo * 0.38, w)} ${px((m.elbow + m.wrist) / 2, w)}
       ${px(elbowX + side * bi * 0.42, w)} ${px(m.elbow + 0.025 * h, w)} Z`,
    c.mid
  ));

  const hr = Math.max(0.016, (m.handSize || fo * 0.42)) * w;
  nodes.push(oval(wristX * w, m.wrist * w, hr, hr * 0.8, c.fill));
  return nodes;
}

function buildTorso(m, w, kind) {
  const nodes = [];
  const sw = m.shoulderW;
  const ww = m.waistW * (1 + m.belly * 0.25);
  const hw = m.hipW;
  const back = kind === "back" || kind === "qBack";
  const h = m.charHeight || 1;

  // Silhouette torse
  nodes.push(path(
    `M ${px(-sw, w)} ${px(m.shoulder, w)}
     Q ${px(-sw * 1.05, w)} ${px(m.chest, w)} ${px(-ww, w)} ${px(m.waist, w)}
     Q ${px(-hw * 1.05, w)} ${px(m.hip - 0.02 * h, w)} ${px(-hw * 0.9, w)} ${px(m.hip, w)}
     L ${px(hw * 0.9, w)} ${px(m.hip, w)}
     Q ${px(hw * 1.05, w)} ${px(m.hip - 0.02 * h, w)} ${px(ww, w)} ${px(m.waist, w)}
     Q ${px(sw * 1.05, w)} ${px(m.chest, w)} ${px(sw, w)} ${px(m.shoulder - 0.025 * h, w)}
     Z`,
    back ? SKIN_D : SKIN
  ));

  // Highlight clavicule / pectoral (lumière HG) — face & 3/4 face
  if (!back && kind !== "side") {
    nodes.push(path(
      `M ${px(-sw * 0.75, w)} ${px(m.shoulder + 0.04 * h, w)}
       Q ${px(-sw * 0.2, w)} ${px(m.chest - 0.02 * h, w)} ${px(0, w)} ${px(m.chest, w)}`,
      "none", SKIN_L, 1.8
    ));
  }

  // Fesses
  if (back && m.glutes > 0.08) {
    const gx = m.hipW * 0.38;
    const gr = (0.055 + m.glutes * 0.09) * w;
    nodes.push(oval((-gx) * w, (m.hip + 0.045 * h) * w, gr, gr * 0.92, SKIN_D));
    nodes.push(oval(( gx) * w, (m.hip + 0.045 * h) * w, gr * 1.04, gr * 0.95, SKIN_M));
  }

  // Poitrine
  if (!back && m.chestSize > 0.05 && m.chestShape !== "flat") {
    const cy = m.shoulder + 0.13 * h;
    const size = m.chestSize;
    if (m.chestShape === "pec") {
      const ph = (0.10 + size * 0.12) * h;
      const pw = 0.55 + size * 0.15;
      if (kind !== "side") {
        nodes.push(path(
          `M ${px(-sw * pw, w)} ${px(cy, w)}
           Q ${px(-sw * 0.35, w)} ${px(cy + 0.02 * h, w)} ${px(-sw * 0.08, w)} ${px(cy + 0.03 * h, w)}
           L ${px(-sw * 0.08, w)} ${px(cy + ph, w)}
           Q ${px(-sw * 0.4, w)} ${px(cy + ph - 0.01 * h, w)} ${px(-sw * pw, w)} ${px(cy + ph - 0.02 * h, w)} Z`,
          SKIN_M, OUT, 1.1));
        nodes.push(path(
          `M ${px(sw * pw, w)} ${px(cy - 0.01 * h, w)}
           Q ${px(sw * 0.35, w)} ${px(cy + 0.02 * h, w)} ${px(sw * 0.08, w)} ${px(cy + 0.03 * h, w)}
           L ${px(sw * 0.08, w)} ${px(cy + ph, w)}
           Q ${px(sw * 0.4, w)} ${px(cy + ph - 0.01 * h, w)} ${px(sw * pw, w)} ${px(cy + ph - 0.02 * h, w)} Z`,
          SKIN_L, OUT, 1.1));
      } else {
        nodes.push(oval(sw * 0.28 * w, (cy + 0.06 * h) * w, (0.06 + size * 0.05) * w, (0.07 + size * 0.06) * h * w, SKIN_M, OUT, 1.1));
      }
    } else {
      const full = m.chestShape === "full" ? 1.22 : 1;
      const rx = (0.065 + size * 0.08) * full;
      const ry = (0.055 + size * 0.09) * full * h;
      const drop = (m.chestShape === "full" ? 0.04 : 0.015) * h;
      if (kind === "side") {
        nodes.push(oval(sw * 0.32 * w, (cy + drop + ry * 0.35) * w, rx * 1.1 * w, ry * w, SKIN_M, OUT, 1.15));
      } else {
        nodes.push(oval((-sw * 0.4) * w, (cy + drop + ry * 0.3) * w, rx * w, ry * w, SKIN_M, OUT, 1.15));
        nodes.push(oval(( sw * 0.38) * w, (cy + drop + ry * 0.28) * w, rx * 1.05 * w, ry * 1.05 * w, SKIN_L, OUT, 1.15));
      }
    }
  }

  if (m.belly > 0.12) {
    nodes.push(oval(0.01 * w, ((m.chest + m.waist) / 2) * w,
      m.waistW * (0.5 + m.belly * 0.55) * w, (0.07 + m.belly * 0.1) * h * w, SKIN_M, OUT, 1.1));
  }

  return nodes;
}

function buildHead(m, w, kind) {
  const nodes = [];
  const back = kind === "back" || kind === "qBack";
  const side = kind === "side";
  const h = m.charHeight || 1;
  const hair = "#2c2420";

  // Cou
  nodes.push(path(
    `M ${px(-m.neckW, w)} ${px(m.shoulder - 0.01 * h, w)}
     L ${px(m.neckW, w)} ${px(m.shoulder - 0.01 * h, w)}
     L ${px(m.neckW * 0.78, w)} ${px(m.neck, w)}
     L ${px(-m.neckW * 0.78, w)} ${px(m.neck, w)} Z`,
    SKIN
  ));
  // Crâne
  nodes.push(oval(0, m.head * w, m.headRx * w, m.headRy * w, back ? SKIN_D : SKIN));

  if (back) {
    // Cheveux / crâne arrière
    nodes.push(path(
      `M ${px(-m.headRx * 0.95, w)} ${px(m.head - m.headRy * 0.1, w)}
       Q ${px(0, w)} ${px(m.head - m.headRy * 1.15, w)} ${px(m.headRx * 0.95, w)} ${px(m.head - m.headRy * 0.1, w)}
       Q ${px(m.headRx * 0.7, w)} ${px(m.head + m.headRy * 0.15, w)}
         ${px(0, w)} ${px(m.head + m.headRy * 0.2, w)}
       Q ${px(-m.headRx * 0.7, w)} ${px(m.head + m.headRy * 0.15, w)}
         ${px(-m.headRx * 0.95, w)} ${px(m.head - m.headRy * 0.1, w)} Z`,
      hair, OUT, 1.15
    ));
  } else if (side) {
    // Cheveux profil
    nodes.push(path(
      `M ${px(-m.headRx * 0.9, w)} ${px(m.head - m.headRy * 0.2, w)}
       Q ${px(-m.headRx * 0.2, w)} ${px(m.head - m.headRy * 1.1, w)} ${px(m.headRx * 0.7, w)} ${px(m.head - m.headRy * 0.35, w)}
       L ${px(m.headRx * 0.55, w)} ${px(m.head + 0.02 * h, w)}
       Q ${px(-m.headRx * 0.4, w)} ${px(m.head + m.headRy * 0.2, w)}
         ${px(-m.headRx * 0.85, w)} ${px(m.head + 0.05 * h, w)} Z`,
      hair, OUT, 1.1
    ));
    // Nez
    nodes.push(path(
      `M ${px(m.headRx * 0.5, w)} ${px(m.head - 0.02 * h, w)}
       L ${px(m.headRx * 0.92, w)} ${px(m.head + 0.015 * h, w)}
       L ${px(m.headRx * 0.5, w)} ${px(m.head + 0.055 * h, w)} Z`,
      SKIN_M, OUT, 1
    ));
    // Œil
    nodes.push(oval(m.headRx * 0.18 * w, (m.head - 0.02 * h) * w, m.headRx * 0.13 * w, m.headRy * 0.09 * w, "#fff", OUT, 0.7));
    nodes.push(oval(m.headRx * 0.2 * w, (m.head - 0.02 * h) * w, m.headRx * 0.07 * w, m.headRy * 0.07 * w, "#1a1a1a", "none", 0));
    // Oreille
    nodes.push(oval((-m.headRx * 0.58) * w, m.head * w, 0.032 * w, 0.048 * w, SKIN_M, OUT, 1));
  } else {
    // Cheveux dessus (face / 3/4) — volume Dofus
    nodes.push(path(
      `M ${px(-m.headRx * 1.02, w)} ${px(m.head - m.headRy * 0.05, w)}
       Q ${px(-m.headRx * 0.6, w)} ${px(m.head - m.headRy * 1.25, w)}
         ${px(0, w)} ${px(m.head - m.headRy * 1.35, w)}
       Q ${px(m.headRx * 0.6, w)} ${px(m.head - m.headRy * 1.25, w)}
         ${px(m.headRx * 1.02, w)} ${px(m.head - m.headRy * 0.05, w)}
       Q ${px(m.headRx * 0.5, w)} ${px(m.head - m.headRy * 0.45, w)}
         ${px(0, w)} ${px(m.head - m.headRy * 0.4, w)}
       Q ${px(-m.headRx * 0.5, w)} ${px(m.head - m.headRy * 0.45, w)}
         ${px(-m.headRx * 1.02, w)} ${px(m.head - m.headRy * 0.05, w)} Z`,
      hair, OUT, 1.7
    ));
    // Yeux style Dofus (grands, blanc + iris + pupille)
    const eyeY = m.head - 0.005 * h;
    const ex = m.headRx * (kind === "qFront" ? 0.34 : 0.38);
    const erx = m.headRx * 0.22 * w;
    const ery = m.headRy * 0.16 * w;
    nodes.push(oval((-ex) * w, eyeY * w, erx, ery, "#fff", OUT, 1.2));
    nodes.push(oval(( ex) * w, eyeY * w, erx, ery, "#fff", OUT, 1.2));
    nodes.push(oval((-ex + m.headRx * 0.03) * w, eyeY * w, erx * 0.55, ery * 0.7, "#3a6ea5", "none", 0));
    nodes.push(oval(( ex + m.headRx * 0.03) * w, eyeY * w, erx * 0.55, ery * 0.7, "#3a6ea5", "none", 0));
    nodes.push(oval((-ex + m.headRx * 0.04) * w, eyeY * w, erx * 0.28, ery * 0.4, "#0d0d0d", "none", 0));
    nodes.push(oval(( ex + m.headRx * 0.04) * w, eyeY * w, erx * 0.28, ery * 0.4, "#0d0d0d", "none", 0));
    // Reflet œil
    nodes.push(oval((-ex - m.headRx * 0.04) * w, eyeY * w - ery * 0.3, erx * 0.18, ery * 0.18, "#fff", "none", 0));
    nodes.push(oval(( ex - m.headRx * 0.04) * w, eyeY * w - ery * 0.3, erx * 0.18, ery * 0.18, "#fff", "none", 0));
    // Sourcils épais
    nodes.push(path(
      `M ${px(-ex - m.headRx * 0.16, w)} ${px(eyeY - 0.06 * h, w)}
       Q ${px(-ex, w)} ${px(eyeY - 0.07 * h, w)} ${px(-ex + m.headRx * 0.14, w)} ${px(eyeY - 0.05 * h, w)}`,
      "none", hair, 2.2
    ));
    nodes.push(path(
      `M ${px(ex - m.headRx * 0.14, w)} ${px(eyeY - 0.05 * h, w)}
       Q ${px(ex, w)} ${px(eyeY - 0.07 * h, w)} ${px(ex + m.headRx * 0.16, w)} ${px(eyeY - 0.06 * h, w)}`,
      "none", hair, 2.2
    ));
    // Petite bouche
    nodes.push(path(
      `M ${px(-m.headRx * 0.12, w)} ${px(m.head + m.headRy * 0.35, w)}
       Q ${px(0, w)} ${px(m.head + m.headRy * 0.42, w)} ${px(m.headRx * 0.12, w)} ${px(m.head + m.headRy * 0.35, w)}`,
      "none", "#a06050", 1.5
    ));
    // Menton
    nodes.push(path(
      `M ${px(-m.headRx * 0.4, w)} ${px(m.head + m.headRy * 0.45, w)}
       Q ${px(0, w)} ${px(m.head + m.headRy * 0.82, w)} ${px(m.headRx * 0.4, w)} ${px(m.head + m.headRy * 0.45, w)}`,
      "none", OUT, 1.2
    ));
  }
  return nodes;
}

/* ============================================================
   ÉQUIPEMENTS — variantes par silhouette (front / qFront / side / qBack / back)
   Hauteurs Y inchangées ; seuls X / détails / foreshortening changent
   ============================================================ */
function isBackKind(kind) { return kind === "back" || kind === "qBack"; }

function buildPants(m, w, side, far, mode, color, kind) {
  const nodes = [];
  const fill = far ? darken(color, 0.18) : color;
  const stitch = darken(color, 0.32);
  const h = m.charHeight || 1;
  const sx = side * m.footSpread;
  const hipMul = kind === "side" ? 0.18 : (kind === "front" || kind === "back" ? 0.62 : 0.55);
  const hipX = side * m.hipW * hipMul;
  const th = Math.max(m.thigh, m.legThick) * (kind === "side" ? 1.0 : 1.12);
  const out = kind === "side" ? 0.55 : 0.62;
  const hemY = mode === "over" ? m.foot * 0.45 : m.ankle - 0.035 * h;
  nodes.push(path(
    `M ${px(hipX - side * th * 0.22, w)} ${px(m.hip - 0.03 * h, w)}
     L ${px(hipX + side * th * 0.38, w)} ${px(m.hip - 0.03 * h, w)}
     L ${px(sx + side * th * out, w)} ${px(m.knee, w)}
     L ${px(sx - side * th * 0.26, w)} ${px(m.knee, w)} Z`,
    fill, OUT, 1.7
  ));
  nodes.push(path(
    `M ${px(sx - side * th * 0.26, w)} ${px(m.knee, w)}
     L ${px(sx + side * th * out, w)} ${px(m.knee, w)}
     L ${px(sx + side * th * (mode === "over" ? out + 0.08 : out - 0.04), w)} ${px(hemY, w)}
     L ${px(sx - side * th * 0.28, w)} ${px(hemY, w)} Z`,
    fill, OUT, 1.7
  ));
  nodes.push(path(
    `M ${px(sx - side * th * 0.28, w)} ${px(hemY, w)}
     L ${px(sx + side * th * (mode === "over" ? out + 0.08 : out - 0.04), w)} ${px(hemY, w)}
     L ${px(sx + side * th * (mode === "over" ? out + 0.08 : out - 0.04), w)} ${px(hemY + 0.03 * h, w)}
     L ${px(sx - side * th * 0.28, w)} ${px(hemY + 0.03 * h, w)} Z`,
    stitch, OUT, 1.2
  ));
  return nodes;
}

function buildPantsBelt(m, w, color, kind) {
  if (state.equip.top !== "none" || state.equip.accessory === "belt") return [];
  const h = m.charHeight || 1;
  const ww = kind === "side" ? m.hipW * 0.55 : m.hipW * 1.08;
  return [path(
    `M ${px(-ww, w)} ${px(m.hip - 0.04 * h, w)}
     L ${px(ww, w)} ${px(m.hip - 0.04 * h, w)}
     L ${px(ww * 0.92, w)} ${px(m.hip + 0.035 * h, w)}
     L ${px(-ww * 0.92, w)} ${px(m.hip + 0.035 * h, w)} Z`,
    darken(color, 0.15), OUT, 1.5
  )];
}

function buildTunic(m, w, color, kind) {
  const nodes = [];
  const side = kind === "side";
  const back = isBackKind(kind);
  const sw = Math.max(m.shoulderW * (side ? 0.55 : 0.95), m.hipW * (side ? 0.5 : 0.85));
  const ww = Math.max(m.waistW, m.hipW * 0.72) * (side ? 0.7 : 1.08 + m.belly * 0.2);
  const shade = darken(color, 0.22);
  const h = m.charHeight || 1;
  nodes.push(path(
    `M ${px(-sw, w)} ${px(m.shoulder + 0.015 * h, w)}
     Q ${px(-ww * 1.05, w)} ${px(m.waist, w)} ${px(-ww, w)} ${px(m.hip + 0.05 * h, w)}
     L ${px(ww, w)} ${px(m.hip + 0.05 * h, w)}
     Q ${px(ww * 1.05, w)} ${px(m.waist, w)} ${px(sw, w)} ${px(m.shoulder - 0.005 * h, w)} Z`,
    back ? shade : color, OUT, 1.9
  ));
  if (!back && !side) {
    nodes.push(path(
      `M ${px(-sw * 0.8, w)} ${px(m.shoulder + 0.05 * h, w)}
       Q ${px(0, w)} ${px(m.shoulder + 0.08 * h, w)} ${px(sw * 0.8, w)} ${px(m.shoulder + 0.04 * h, w)}
       L ${px(sw * 0.65, w)} ${px(m.chest, w)}
       Q ${px(0, w)} ${px(m.chest + 0.015 * h, w)} ${px(-sw * 0.65, w)} ${px(m.chest, w)} Z`,
      shade, "none", 0
    ));
    nodes.push(path(
      `M ${px(-sw * 0.26, w)} ${px(m.shoulder + 0.035 * h, w)}
       L ${px(0, w)} ${px(m.shoulder + 0.22 * h, w)}
       L ${px(sw * 0.26, w)} ${px(m.shoulder + 0.03 * h, w)}`,
      "none", shade, 2
    ));
  } else if (side) {
    nodes.push(path(
      `M ${px(sw * 0.15, w)} ${px(m.shoulder + 0.04 * h, w)}
       L ${px(ww * 0.2, w)} ${px(m.hip + 0.02 * h, w)}`,
      "none", shade, 1.6
    ));
  } else if (kind === "qBack") {
    nodes.push(path(
      `M ${px(-sw * 0.2, w)} ${px(m.shoulder + 0.06 * h, w)} L ${px(-sw * 0.15, w)} ${px(m.hip, w)}`,
      "none", darken(color, 0.3), 1.4
    ));
    nodes.push(path(
      `M ${px(sw * 0.2, w)} ${px(m.shoulder + 0.05 * h, w)} L ${px(sw * 0.15, w)} ${px(m.hip, w)}`,
      "none", darken(color, 0.3), 1.4
    ));
  }
  nodes.push(path(
    `M ${px(-ww * 1.02, w)} ${px(m.hip - 0.015 * h, w)}
     L ${px(ww * 1.02, w)} ${px(m.hip - 0.015 * h, w)}
     L ${px(ww * 0.95, w)} ${px(m.hip + 0.055 * h, w)}
     L ${px(-ww * 0.95, w)} ${px(m.hip + 0.055 * h, w)} Z`,
    "#5c3d22", OUT, 1.6
  ));
  if (side) {
    nodes.push(oval(ww * 0.2 * w, (m.hip + 0.02 * h) * w, 0.028 * w, 0.026 * w, "#c4a35a", OUT, 1.2));
  } else {
    nodes.push(oval(0, (m.hip + 0.02 * h) * w, 0.038 * w, 0.03 * w, "#c4a35a", OUT, 1.3));
  }
  return nodes;
}

function buildCap(m, w, color, kind) {
  const nodes = [];
  const shade = darken(color, 0.22);
  const h = m.charHeight || 1;
  const back = isBackKind(kind);
  const side = kind === "side";
  const rx = m.headRx * (side ? 0.92 : 1.05);
  const top = m.head - m.headRy * 0.55;
  nodes.push(path(
    `M ${px(-rx, w)} ${px(m.head - m.headRy * 0.1, w)}
     Q ${px(0, w)} ${px(top - 0.06 * h, w)} ${px(rx, w)} ${px(m.head - m.headRy * 0.1, w)}
     L ${px(rx * 1.02, w)} ${px(m.head + 0.02 * h, w)}
     L ${px(-rx * 1.02, w)} ${px(m.head + 0.02 * h, w)} Z`,
    color, OUT, 1.7
  ));
  if (!back) {
    if (side) {
      nodes.push(path(
        `M ${px(rx * 0.2, w)} ${px(m.head - 0.02 * h, w)}
         L ${px(rx * 1.55, w)} ${px(m.head + 0.01 * h, w)}
         L ${px(rx * 1.35, w)} ${px(m.head + 0.07 * h, w)}
         L ${px(rx * 0.15, w)} ${px(m.head + 0.04 * h, w)} Z`,
        shade, OUT, 1.4
      ));
    } else {
      const tip = kind === "front" ? 1.35 : 1.42;
      nodes.push(path(
        `M ${px(m.headRx * 0.12, w)} ${px(m.head - 0.01 * h, w)}
         L ${px(m.headRx * tip, w)} ${px(m.head + 0.04 * h, w)}
         L ${px(m.headRx * (tip - 0.25), w)} ${px(m.head + 0.08 * h, w)}
         L ${px(m.headRx * 0.08, w)} ${px(m.head + 0.03 * h, w)} Z`,
        shade, OUT, 1.4
      ));
    }
  } else {
    nodes.push(path(
      `M ${px(-rx * 0.7, w)} ${px(m.head + 0.01 * h, w)}
       L ${px(rx * 0.7, w)} ${px(m.head + 0.01 * h, w)}
       L ${px(rx * 0.55, w)} ${px(m.head + 0.05 * h, w)}
       L ${px(-rx * 0.55, w)} ${px(m.head + 0.05 * h, w)} Z`,
      shade, OUT, 1.3
    ));
  }
  return nodes;
}

function buildHair(m, w, style, color, kind) {
  if (style === "none") return [];
  const nodes = [];
  const h = m.charHeight || 1;
  const back = isBackKind(kind);
  const side = kind === "side";
  if (style === "short") {
    if (side) {
      nodes.push(path(
        `M ${px(-m.headRx * 0.95, w)} ${px(m.head + 0.02 * h, w)}
         Q ${px(-m.headRx * 1.15, w)} ${px(m.head - m.headRy * 0.7, w)} ${px(-m.headRx * 0.2, w)} ${px(m.head - m.headRy * 1.15, w)}
         Q ${px(m.headRx * 0.85, w)} ${px(m.head - m.headRy * 1.05, w)} ${px(m.headRx * 0.95, w)} ${px(m.head - m.headRy * 0.15, w)}
         L ${px(m.headRx * 0.7, w)} ${px(m.head + 0.02 * h, w)}
         Q ${px(0, w)} ${px(m.head - m.headRy * 0.35, w)} ${px(-m.headRx * 0.7, w)} ${px(m.head + 0.02 * h, w)} Z`,
        color, OUT, 1.6
      ));
    } else if (back) {
      nodes.push(path(
        `M ${px(-m.headRx * 1.08, w)} ${px(m.head + 0.04 * h, w)}
         Q ${px(-m.headRx * 1.1, w)} ${px(m.head - m.headRy * 0.9, w)} ${px(0, w)} ${px(m.head - m.headRy * 1.25, w)}
         Q ${px(m.headRx * 1.1, w)} ${px(m.head - m.headRy * 0.9, w)} ${px(m.headRx * 1.08, w)} ${px(m.head + 0.04 * h, w)}
         Q ${px(0, w)} ${px(m.head - m.headRy * 0.25, w)} ${px(-m.headRx * 1.08, w)} ${px(m.head + 0.04 * h, w)} Z`,
        color, OUT, 1.6
      ));
    } else {
      nodes.push(path(
        `M ${px(-m.headRx * 1.05, w)} ${px(m.head - m.headRy * 0.05, w)}
         Q ${px(0, w)} ${px(m.head - m.headRy * 1.28, w)} ${px(m.headRx * 1.05, w)} ${px(m.head - m.headRy * 0.05, w)}
         Q ${px(m.headRx * 0.55, w)} ${px(m.head - m.headRy * 0.35, w)}
           ${px(0, w)} ${px(m.head - m.headRy * 0.3, w)}
         Q ${px(-m.headRx * 0.55, w)} ${px(m.head - m.headRy * 0.35, w)}
           ${px(-m.headRx * 1.05, w)} ${px(m.head - m.headRy * 0.05, w)} Z`,
        color, OUT, 1.6
      ));
    }
  } else if (style === "ponytail") {
    if (side) {
      nodes.push(path(
        `M ${px(-m.headRx * 0.9, w)} ${px(m.head + 0.01 * h, w)}
         Q ${px(-m.headRx * 0.3, w)} ${px(m.head - m.headRy * 1.15, w)} ${px(m.headRx * 0.9, w)} ${px(m.head - m.headRy * 0.2, w)}
         L ${px(m.headRx * 0.55, w)} ${px(m.head + 0.02 * h, w)}
         Q ${px(0, w)} ${px(m.head - m.headRy * 0.4, w)} ${px(-m.headRx * 0.65, w)} ${px(m.head + 0.02 * h, w)} Z`,
        color, OUT, 1.6
      ));
    } else {
      nodes.push(path(
        `M ${px(-m.headRx * 0.95, w)} ${px(m.head - m.headRy * 0.1, w)}
         Q ${px(0, w)} ${px(m.head - m.headRy * 1.2, w)} ${px(m.headRx * 0.95, w)} ${px(m.head - m.headRy * 0.1, w)}
         L ${px(m.headRx * 0.7, w)} ${px(m.head + 0.02 * h, w)}
         Q ${px(0, w)} ${px(m.head - m.headRy * 0.4, w)} ${px(-m.headRx * 0.7, w)} ${px(m.head + 0.02 * h, w)} Z`,
        color, OUT, 1.6
      ));
    }
    let qx, qBend;
    if (side) { qx = -m.headRx * 0.55; qBend = -0.22; }
    else if (back) { qx = 0; qBend = 0.02; }
    else if (kind === "front") { qx = 0; qBend = 0.06; }
    else { qx = m.headRx * 0.12; qBend = 0.1; }
    const qy = m.head - m.headRy * (back ? 0.05 : 0.15);
    nodes.push(path(
      `M ${px(qx - 0.04, w)} ${px(qy, w)}
       Q ${px(qx + qBend, w)} ${px(qy - 0.28 * h, w)} ${px(qx + qBend * 0.4, w)} ${px(qy - 0.5 * h, w)}
       Q ${px(qx - 0.1, w)} ${px(qy - 0.22 * h, w)} ${px(qx + 0.04, w)} ${px(qy, w)} Z`,
      color, OUT, 1.5
    ));
  }
  return nodes;
}

function buildHelm(m, w, color, kind) {
  const nodes = [];
  const shade = darken(color, 0.25);
  const h = m.charHeight || 1;
  const back = isBackKind(kind);
  const side = kind === "side";
  const rx = m.headRx * (side ? 0.95 : 1.12);
  const top = m.head - m.headRy * 0.75;
  nodes.push(path(
    `M ${px(-rx, w)} ${px(m.head + 0.04 * h, w)}
     Q ${px(-rx * 1.02, w)} ${px(top, w)} ${px(0, w)} ${px(top - 0.06 * h, w)}
     Q ${px(rx * 1.02, w)} ${px(top, w)} ${px(rx, w)} ${px(m.head + 0.04 * h, w)}
     L ${px(rx * 0.85, w)} ${px(m.head + 0.1 * h, w)}
     L ${px(-rx * 0.85, w)} ${px(m.head + 0.1 * h, w)} Z`,
    color, OUT, 1.8
  ));
  if (!back) {
    if (side) {
      nodes.push(path(
        `M ${px(rx * 0.15, w)} ${px(m.head - 0.02 * h, w)}
         L ${px(rx * 0.85, w)} ${px(m.head - 0.01 * h, w)}
         L ${px(rx * 0.8, w)} ${px(m.head + 0.04 * h, w)}
         L ${px(rx * 0.12, w)} ${px(m.head + 0.035 * h, w)} Z`,
        "#111", OUT, 1.2
      ));
    } else {
      const vw = kind === "front" ? 0.58 : 0.52;
      nodes.push(path(
        `M ${px(-m.headRx * vw, w)} ${px(m.head - 0.02 * h, w)}
         L ${px(m.headRx * vw, w)} ${px(m.head - 0.02 * h, w)}
         L ${px(m.headRx * (vw - 0.05), w)} ${px(m.head + 0.04 * h, w)}
         L ${px(-m.headRx * (vw - 0.05), w)} ${px(m.head + 0.04 * h, w)} Z`,
        "#111", OUT, 1.2
      ));
    }
  } else {
    nodes.push(path(
      `M ${px(-rx * 0.75, w)} ${px(m.head + 0.06 * h, w)}
       L ${px(rx * 0.75, w)} ${px(m.head + 0.06 * h, w)}
       L ${px(rx * 0.55, w)} ${px(m.head + 0.14 * h, w)}
       L ${px(-rx * 0.55, w)} ${px(m.head + 0.14 * h, w)} Z`,
      shade, OUT, 1.4
    ));
  }
  nodes.push(path(
    `M ${px(-0.03, w)} ${px(top - 0.02 * h, w)}
     L ${px(0, w)} ${px(top - 0.18 * h, w)}
     L ${px(0.03, w)} ${px(top - 0.02 * h, w)} Z`,
    shade, OUT, 1.3
  ));
  return nodes;
}

function buildVest(m, w, color, kind) {
  const nodes = [];
  const side = kind === "side";
  const back = isBackKind(kind);
  const sw = Math.max(m.shoulderW * (side ? 0.55 : 0.98), m.hipW * (side ? 0.5 : 0.9));
  const ww = Math.max(m.waistW, m.hipW * 0.75) * (side ? 0.72 : 1.05);
  const shade = darken(color, 0.2);
  const h = m.charHeight || 1;
  nodes.push(path(
    `M ${px(-sw, w)} ${px(m.shoulder + 0.02 * h, w)}
     L ${px(-sw * 1.05, w)} ${px(m.chest, w)}
     L ${px(-ww, w)} ${px(m.hip + 0.02 * h, w)}
     L ${px(ww, w)} ${px(m.hip + 0.02 * h, w)}
     L ${px(sw * 1.05, w)} ${px(m.chest, w)}
     L ${px(sw, w)} ${px(m.shoulder, w)} Z`,
    back ? shade : color, OUT, 1.9
  ));
  if (!back && !side) {
    nodes.push(path(`M ${px(-0.02, w)} ${px(m.shoulder + 0.05 * h, w)} L ${px(-0.02, w)} ${px(m.hip, w)}`, "none", shade, 1.8));
    nodes.push(path(`M ${px(0.02, w)} ${px(m.shoulder + 0.05 * h, w)} L ${px(0.02, w)} ${px(m.hip, w)}`, "none", shade, 1.8));
  } else if (side) {
    nodes.push(path(
      `M ${px(sw * 0.1, w)} ${px(m.shoulder + 0.05 * h, w)} L ${px(ww * 0.15, w)} ${px(m.hip, w)}`,
      "none", shade, 1.6
    ));
  }
  if (side) {
    nodes.push(oval(sw * 0.15 * w, (m.shoulder + 0.02 * h) * w, 0.06 * w, 0.045 * w, shade, OUT, 1.4));
  } else {
    nodes.push(oval((-sw) * w, (m.shoulder + 0.02 * h) * w, 0.07 * w, 0.05 * w, shade, OUT, 1.4));
    nodes.push(oval(( sw) * w, (m.shoulder + 0.01 * h) * w, 0.07 * w, 0.05 * w, darken(color, 0.1), OUT, 1.4));
  }
  return nodes;
}

function buildBootsOverlay(m, w, side, far, style, color, kind) {
  if (style === "none") return [];
  const nodes = [];
  const h = m.charHeight || 1;
  const sx = side * m.footSpread;
  const cf = m.calf * (kind === "side" ? 0.95 : 1);
  const fill = far ? darken(color, 0.18) : color;
  const topY = style === "plate" ? m.knee + 0.02 * h : (m.knee + m.ankle) / 2;
  const toe = kind === "side" ? side * 0.12 : side * 0.04;
  nodes.push(path(
    `M ${px(sx - side * cf * 0.5, w)} ${px(topY, w)}
     L ${px(sx + side * cf * 0.62 + toe * 0.3, w)} ${px(topY, w)}
     L ${px(sx + side * cf * 0.58 + toe, w)} ${px(m.ankle - 0.02 * h, w)}
     L ${px(sx - side * cf * 0.42, w)} ${px(m.ankle - 0.02 * h, w)} Z`,
    fill, OUT, 1.6
  ));
  if (style === "plate") {
    nodes.push(path(
      `M ${px(sx - side * cf * 0.48, w)} ${px(topY + 0.04 * h, w)}
       L ${px(sx + side * cf * 0.58, w)} ${px(topY + 0.04 * h, w)}`,
      "none", darken(color, 0.3), 1.4
    ));
    if (kind !== "side") {
      nodes.push(path(
        `M ${px(sx - side * cf * 0.2, w)} ${px(topY + 0.02 * h, w)}
         L ${px(sx - side * cf * 0.15, w)} ${px(m.ankle - 0.03 * h, w)}`,
        "none", darken(color, 0.35), 1.2
      ));
    }
  }
  return nodes;
}

function buildWeapon(m, w, style, color, kind) {
  if (style === "none") return [];
  const nodes = [];
  const h = m.charHeight || 1;
  const a = getAnchors(m);
  let handX = a.handR.x;
  let handY = a.handR.y;
  if (kind === "side") {
    handX = m.shoulderW * 0.35 + m.forearm * 0.8;
    handY = m.wrist;
  } else if (kind === "front" || kind === "back") {
    handX = a.handR.x * 0.95;
  }
  if (kind === "qFront") handX *= 1.05;
  if (isBackKind(kind)) handX *= 0.92;

  if (style === "staff") {
    const lean = kind === "side" ? 0.04 : (kind === "qFront" ? 0.02 : 0);
    nodes.push(path(
      `M ${px(handX - 0.02 - lean, w)} ${px(handY + 0.35 * h, w)}
       L ${px(handX + 0.02 - lean, w)} ${px(handY + 0.35 * h, w)}
       L ${px(handX + 0.015 + lean, w)} ${px(handY - 0.95 * h, w)}
       L ${px(handX - 0.015 + lean, w)} ${px(handY - 0.95 * h, w)} Z`,
      "#6b4a2a", OUT, 1.4
    ));
    nodes.push(oval((handX + lean) * w, (handY - 1.05 * h) * w, 0.07 * w, 0.07 * w, color, OUT, 1.5));
    nodes.push(oval((handX + lean) * w, (handY - 1.05 * h) * w, 0.035 * w, 0.035 * w, "#fff8", "none", 0));
  } else if (style === "sword") {
    const tipX = kind === "side" ? handX + 0.06 : handX;
    nodes.push(path(
      `M ${px(handX - 0.025, w)} ${px(handY + 0.05 * h, w)}
       L ${px(handX + 0.025, w)} ${px(handY + 0.05 * h, w)}
       L ${px(tipX + 0.02, w)} ${px(handY - 0.55 * h, w)}
       L ${px(tipX, w)} ${px(handY - 0.75 * h, w)}
       L ${px(tipX - 0.02, w)} ${px(handY - 0.55 * h, w)} Z`,
      color, OUT, 1.5
    ));
    nodes.push(path(
      `M ${px(handX - 0.08, w)} ${px(handY + 0.02 * h, w)}
       L ${px(handX + 0.08, w)} ${px(handY + 0.02 * h, w)}
       L ${px(handX + 0.08, w)} ${px(handY + 0.06 * h, w)}
       L ${px(handX - 0.08, w)} ${px(handY + 0.06 * h, w)} Z`,
      "#c4a35a", OUT, 1.3
    ));
    nodes.push(path(
      `M ${px(handX - 0.02, w)} ${px(handY + 0.06 * h, w)}
       L ${px(handX + 0.02, w)} ${px(handY + 0.06 * h, w)}
       L ${px(handX + 0.015, w)} ${px(handY + 0.18 * h, w)}
       L ${px(handX - 0.015, w)} ${px(handY + 0.18 * h, w)} Z`,
      "#5c3d22", OUT, 1.2
    ));
  }
  return nodes;
}

function buildNecklace(m, w, color, kind) {
  if (isBackKind(kind)) return [];
  const h = m.charHeight || 1;
  if (kind === "side") {
    return [path(
      `M ${px(-m.neckW * 0.4, w)} ${px(m.neck + 0.02 * h, w)}
       Q ${px(m.neckW * 1.8, w)} ${px(m.shoulder + 0.2 * h, w)} ${px(m.neckW * 0.6, w)} ${px(m.chest - 0.05 * h, w)}`,
      "none", color, 2.2
    ), oval(m.neckW * 1.2 * w, (m.shoulder + 0.18 * h) * w, 0.028 * w, 0.028 * w, color, OUT, 1.2)];
  }
  const drop = kind === "front" ? 0.2 : 0.18;
  return [path(
    `M ${px(-m.neckW * 1.6, w)} ${px(m.neck + 0.02 * h, w)}
     Q ${px(0, w)} ${px(m.shoulder + drop * h, w)} ${px(m.neckW * 1.6, w)} ${px(m.neck + 0.02 * h, w)}`,
    "none", color, 2.2
  ), oval(0, (m.shoulder + (drop + 0.02) * h) * w, 0.03 * w, 0.03 * w, color, OUT, 1.2)];
}

function buildEarrings(m, w, color, kind) {
  if (kind === "back") return [];
  const h = m.charHeight || 1;
  const nodes = [];
  const ey = m.head + 0.02 * h;
  if (kind === "side") {
    nodes.push(oval((-m.headRx * 0.55) * w, ey * w, 0.02 * w, 0.035 * w, color, OUT, 1));
  } else if (kind === "qBack") {
    nodes.push(oval((m.headRx * 0.8) * w, ey * w, 0.018 * w, 0.03 * w, color, OUT, 1));
  } else {
    const ex = kind === "front" ? 0.88 : 0.85;
    nodes.push(oval((-m.headRx * ex) * w, ey * w, 0.018 * w, 0.03 * w, color, OUT, 1));
    nodes.push(oval(( m.headRx * ex) * w, ey * w, 0.018 * w, 0.03 * w, color, OUT, 1));
  }
  return nodes;
}

function buildAccessoryBelt(m, w, color, kind) {
  const h = m.charHeight || 1;
  const ww = Math.max(m.waistW, m.hipW * 0.8) * (kind === "side" ? 0.7 : 1.05);
  const nodes = [path(
    `M ${px(-ww * 1.05, w)} ${px(m.hip - 0.02 * h, w)}
     L ${px(ww * 1.05, w)} ${px(m.hip - 0.02 * h, w)}
     L ${px(ww * 0.95, w)} ${px(m.hip + 0.05 * h, w)}
     L ${px(-ww * 0.95, w)} ${px(m.hip + 0.05 * h, w)} Z`,
    "#5c3d22", OUT, 1.5
  )];
  if (kind === "side") {
    nodes.push(oval(ww * 0.25 * w, (m.hip + 0.015 * h) * w, 0.032 * w, 0.028 * w, color, OUT, 1.2));
  } else {
    nodes.push(oval(0, (m.hip + 0.015 * h) * w, 0.04 * w, 0.03 * w, color, OUT, 1.2));
  }
  return nodes;
}

function buildAnchors(m, w) {
  const nodes = [];
  const anchors = getAnchors(m);
  const colors = {
    head:"#ff6b6b", neck:"#ffa07a", shoulderL:"#6fd8c8", shoulderR:"#6fd8c8",
    waistL:"#f0c040", waistR:"#f0c040", hip:"#f0c040",
    handL:"#a78bfa", handR:"#a78bfa", footL:"#60a5fa", footR:"#60a5fa", pivot:"#ff0044",
  };
  for (const [name, pos] of Object.entries(anchors)) {
    const r = name === "pivot" ? 0.032 * w : 0.024 * w;
    const e = oval(pos.x * w, pos.y * w, r, r, colors[name] || "#fff", "#000", 1);
    e.setAttribute("opacity", "0.85");
    nodes.push(e);
  }
  return nodes;
}

/* ============================================================
   ASSEMBLEUR — ordre Z correct selon la vue
   ============================================================ */
function createCharacter(cx, cy, tileW, morphId) {
  const m = applyFacing(resolveMorph(morphId), state.facing);
  const f = m.facing;
  const kind = f.kind;
  const w = tileW;
  const s = m.charSize; // taille générale — scale uniforme depuis le pivot

  const root = el("g", {
    class: "character",
    transform: `translate(${cx}, ${cy})`,
    "data-facing": f.key,
    "data-view": f.name,
    "data-size": s.toFixed(2),
    "data-height": m.charHeight.toFixed(2),
    "pointer-events": "none",
  });
  root.style.pointerEvents = "none";

  // Groupe échelle : pivot pieds (0,0) inchangé
  const scaled = el("g", {
    class: "char-scale",
    transform: `scale(${s})`,
  });
  root.appendChild(scaled);

  // Ombre ancrée au pivot, suit la taille
  for (const n of buildShadow(m, w)) scaled.appendChild(n);

  const body = el("g", {
    class: "body",
    transform: f.mirror ? "scale(-1,1)" : "",
  });
  scaled.appendChild(body);

  const farSide = -1;
  const nearSide = 1;
  const add = (nodes) => { for (const n of nodes) body.appendChild(n); };

  const eq = state.equip;
  const col = state.colors;

  // 1) membres loin
  add(buildLeg(m, w, farSide, true, kind));
  add(buildBootsOverlay(m, w, farSide, true, eq.boots, col.boots, kind));
  add(buildArm(m, w, farSide, true, kind));
  if (eq.pants !== "none") add(buildPants(m, w, farSide, true, eq.pants, col.pants, kind));

  // 2) torse + vêtements
  add(buildTorso(m, w, kind));
  add(buildBaseShorts(m, w, kind));
  add(buildBaseTop(m, w, kind));
  if (eq.pants !== "none") add(buildPantsBelt(m, w, col.pants, kind));
  if (eq.top === "tunic") add(buildTunic(m, w, col.top, kind));
  if (eq.top === "vest") add(buildVest(m, w, col.top, kind));
  if (eq.accessory === "belt" && eq.top === "none") add(buildAccessoryBelt(m, w, col.accessory, kind));
  if (eq.accessory === "necklace") add(buildNecklace(m, w, col.accessory, kind));

  // 3) tête + coiffure + chapeau
  add(buildHead(m, w, kind));
  // Si casque : pas de cheveux visibles / cheveux sous casque omis
  if (eq.hat !== "helm") add(buildHair(m, w, eq.hair, col.hair, kind));
  if (eq.hat === "cap") add(buildCap(m, w, col.hat, kind));
  if (eq.hat === "helm") add(buildHelm(m, w, col.hat, kind));
  if (eq.accessory === "earrings") add(buildEarrings(m, w, col.accessory, kind));

  // 4) membres près + bottes + arme
  add(buildLeg(m, w, nearSide, false, kind));
  add(buildBootsOverlay(m, w, nearSide, false, eq.boots, col.boots, kind));
  add(buildArm(m, w, nearSide, false, kind));
  if (eq.pants !== "none") add(buildPants(m, w, nearSide, false, eq.pants, col.pants, kind));
  add(buildWeapon(m, w, eq.weapon, col.weapon, kind));

  if (state.showAnchors) add(buildAnchors(m, w));

  // Meta hors miroir, dans le scale : label suit la hauteur
  const meta = el("g", { class: "meta" });
  scaled.appendChild(meta);
  const pivot = oval(0, 0, 0.028 * w, 0.028 * w, "#ff0044", "#ff0044", 1.2);
  pivot.setAttribute("opacity", "0.75");
  meta.appendChild(pivot);

  const label = el("text", {
    x: 0, y: (m.head - m.headRy - 0.16) * w,
    "text-anchor": "middle",
    "font-size": String(Math.max(8, Math.round(9 / Math.sqrt(s)))),
    fill: m.labelColor, "font-weight": "bold", "font-family": "Arial",
  });
  label.textContent = `${m.label} · ${f.short}`;
  meta.appendChild(label);

  return root;
}

/* ============================================================
   RENDU + UI
   ============================================================ */
function draw() {
  const gridSize = parseInt(gridSizeInput.value, 10);
  const tileW = parseInt(tileWInput.value, 10);
  const tileH = tileW / 2;
  document.getElementById("gridSizeVal").textContent = gridSize;
  document.getElementById("tileWVal").textContent = tileW;
  state.selected.row = Math.min(state.selected.row, gridSize - 1);
  state.selected.col = Math.min(state.selected.col, gridSize - 1);

  const pad = tileW * 1.2;
  const charHeadroom = tileW * 2.35;
  const viewW = gridSize * tileW + pad * 2;
  const viewH = gridSize * tileH + pad * 2 + charHeadroom;
  const ox = viewW / 2;
  const oy = pad + charHeadroom * 0.35;

  svg.setAttribute("viewBox", `0 0 ${viewW} ${viewH}`);
  svg.innerHTML = "";
  const world = el("g", { class: "world" });
  svg.appendChild(world);
  state.layout = { gridSize, tileW, tileH, ox, oy, viewW, viewH };

  drawGrid(world, gridSize, tileW, tileH, ox, oy);
  const { x: cx, y: cy } = isoToScreen(state.selected.row, state.selected.col, tileW, tileH, ox, oy);

  if (state.galleryFacings) {
    // 8 vues du même perso (équipement courant) — grille 4×2
    const saved = state.facing;
    const gapX = tileW * 1.15;
    const gapY = tileW * 1.55;
    const ids = [2, 1, 0, 7, 3, 5, 6, 4]; // rangée face puis dos
    ids.forEach((fid, i) => {
      const col = i % 4;
      const row = Math.floor(i / 4);
      state.facing = fid;
      const x = cx + (col - 1.5) * gapX;
      const y = cy + (row - 0.35) * gapY;
      world.appendChild(createCharacter(x, y, tileW * 0.82, state.morph));
    });
    state.facing = saved;
    info.textContent = "Galerie 8 vues — équipement figé, compare Face / 3-4 / Profil / Dos";
  } else if (state.galleryMorphs) {
    const gap = tileW * 1.35;
    const morphs = ["heavy", "standard", "light"];
    morphs.forEach((mid, i) => {
      const x = cx + (i - 1) * gap;
      world.appendChild(createCharacter(x, cy, tileW, mid));
    });
    info.textContent = `Galerie morphos · vue ${getFacing().name} — compare Lourd / Standard / Fin`;
  } else {
    world.appendChild(createCharacter(cx, cy, tileW, state.morph));
  }

  // Hits au-dessus du perso pour que les taps passent toujours
  if (!state.galleryFacings && !state.galleryMorphs) {
    drawTileHitLayer(world, gridSize, tileW, tileH, ox, oy);
  }
}

function buildBodySlidersUI() {
  const host = document.getElementById("bodySliders");
  host.innerHTML = "";
  for (const def of BODY_SLIDER_DEFS) {
    const row = document.createElement("div");
    row.className = "slider-row";
    const lab = document.createElement("span");
    lab.className = "label"; lab.textContent = def.label;
    const input = document.createElement("input");
    input.type = "range"; input.min = def.min; input.max = def.max;
    input.step = def.step; input.value = state.body[def.key]; input.id = `body_${def.key}`;
    const num = document.createElement("span");
    num.className = "num"; num.id = `bodyVal_${def.key}`;
    num.textContent = Number(state.body[def.key]).toFixed(2);
    input.addEventListener("input", () => {
      const v = parseFloat(input.value);
      state.body[def.key] = v;
      num.textContent = v.toFixed(2);
      info.textContent = `${def.label} → ${v.toFixed(2)}`;
      draw();
    });
    row.append(lab, input, num);
    host.appendChild(row);
  }
}

function syncBodySlidersFromState() {
  for (const def of BODY_SLIDER_DEFS) {
    const input = document.getElementById(`body_${def.key}`);
    const num = document.getElementById(`bodyVal_${def.key}`);
    if (input) input.value = state.body[def.key];
    if (num) num.textContent = Number(state.body[def.key]).toFixed(2);
  }
  document.querySelectorAll("#chestShapeSelector .ctrl-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.chest === state.body.chestShape);
  });
}

function bindButtonGroup(id, dataKey, stateKey, labelFn) {
  const box = document.getElementById(id);
  if (!box) return;
  box.querySelectorAll(".ctrl-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      box.querySelectorAll(".ctrl-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state[stateKey] = btn.dataset[dataKey];
      info.textContent = labelFn ? labelFn(state[stateKey], btn) : `${stateKey}: ${state[stateKey]}`;
      draw();
    });
  });
}

bindButtonGroup("morphSelector", "morph", "morph", (_, btn) => `Morphologie ${btn.textContent.trim()}`);

document.querySelectorAll("#chestShapeSelector .ctrl-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#chestShapeSelector .ctrl-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.body.chestShape = btn.dataset.chest;
    info.textContent = `Poitrine : ${btn.textContent.trim()}`;
    draw();
  });
});

document.getElementById("resetBody").addEventListener("click", () => {
  state.body = defaultBodyCustom();
  state.charHeight = 1.0;
  state.charSize = 1.0;
  const hIn = document.getElementById("charHeight");
  const sIn = document.getElementById("charSize");
  if (hIn) hIn.value = "1.00";
  if (sIn) sIn.value = "1.00";
  document.getElementById("charHeightVal").textContent = "1.00";
  document.getElementById("charSizeVal").textContent = "1.00";
  syncBodySlidersFromState();
  info.textContent = "Tronçons + hauteur/taille réinitialisés";
  draw();
});

const charHeightInput = document.getElementById("charHeight");
const charSizeInput = document.getElementById("charSize");
charHeightInput.addEventListener("input", () => {
  state.charHeight = parseFloat(charHeightInput.value);
  document.getElementById("charHeightVal").textContent = state.charHeight.toFixed(2);
  info.textContent = `Hauteur perso → ${state.charHeight.toFixed(2)}`;
  draw();
});
charSizeInput.addEventListener("input", () => {
  state.charSize = parseFloat(charSizeInput.value);
  document.getElementById("charSizeVal").textContent = state.charSize.toFixed(2);
  info.textContent = `Taille générale → ${state.charSize.toFixed(2)}`;
  draw();
});

document.getElementById("anchorToggle").querySelectorAll(".ctrl-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.getElementById("anchorToggle").querySelectorAll(".ctrl-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.showAnchors = btn.dataset.anchors === "on";
    draw();
  });
});

gridSizeInput.addEventListener("input", draw);
tileWInput.addEventListener("input", draw);

document.querySelectorAll("#mainTabs .tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll("#mainTabs .tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === `panel-${tab}`));
  });
});

function syncFacingUI() {
  const f = getFacing();
  document.querySelectorAll("#facingPad .ctrl-btn").forEach((btn) => {
    btn.classList.toggle("active", parseInt(btn.dataset.facing, 10) === state.facing);
  });
  document.getElementById("facingLabel").textContent = f.short;
  document.getElementById("facingDeg").textContent = `${f.name} · ${f.key} · ${f.deg}°`;
}

function setFacing(id) {
  state.facing = ((id % 8) + 8) % 8;
  syncFacingUI();
  info.textContent = `Vue : ${getFacing().name}`;
  draw();
}

document.querySelectorAll("#facingPad .ctrl-btn").forEach((btn) => {
  btn.addEventListener("click", () => setFacing(parseInt(btn.dataset.facing, 10)));
});
document.getElementById("rotLeft").addEventListener("click", () => setFacing(state.facing - 1));
document.getElementById("rotRight").addEventListener("click", () => setFacing(state.facing + 1));

document.getElementById("galleryMorphs").addEventListener("click", () => {
  state.galleryMorphs = !state.galleryMorphs;
  if (state.galleryMorphs) state.galleryFacings = false;
  document.getElementById("galleryMorphs").classList.toggle("active", state.galleryMorphs);
  document.getElementById("galleryFacings").classList.toggle("active", state.galleryFacings);
  info.textContent = state.galleryMorphs
    ? "Galerie 3 morphos ON — tourne pour vérifier les 8 vues"
    : "Galerie OFF — un seul perso";
  draw();
});

document.getElementById("galleryFacings").addEventListener("click", () => {
  state.galleryFacings = !state.galleryFacings;
  if (state.galleryFacings) state.galleryMorphs = false;
  document.getElementById("galleryFacings").classList.toggle("active", state.galleryFacings);
  document.getElementById("galleryMorphs").classList.toggle("active", state.galleryMorphs);
  info.textContent = state.galleryFacings
    ? "Galerie 8 vues ON — vérifie l'équipement sur toutes les orientations"
    : "Galerie OFF — un seul perso";
  draw();
});

// Clic / tap map → déplacement + orientation (délégation, au-dessus du perso)
function onMapInteract(e) {
  const hit = e.target && e.target.closest && e.target.closest("[data-row][data-col]");
  if (!hit) return;
  const row = parseInt(hit.getAttribute("data-row"), 10);
  const col = parseInt(hit.getAttribute("data-col"), 10);
  if (Number.isNaN(row) || Number.isNaN(col)) return;
  e.preventDefault();
  moveToTile(row, col);
}
svg.addEventListener("click", onMapInteract);
svg.addEventListener("pointerup", (e) => {
  // Mobile : certains WebViews ne déclenchent pas click sur path SVG
  if (e.pointerType === "touch" || e.pointerType === "pen") onMapInteract(e);
});

buildBodySlidersUI();
buildEquipUI();
syncFacingUI();
draw();
</script>
</body>
</html>
